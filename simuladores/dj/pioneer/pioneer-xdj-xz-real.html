/* botões com repetição (SEARCH / TRACK SEARCH) */
function bindRepeat(el,a){ let iv=null,t0=0;
  const s=a.slice(-1), base=a.slice(0,-1);
  const step=f=>{ if(!ready)return; const d=decks[s], fl=d.buffer.sampleRate/75;
    if(base==="srchb")d.pos=(d.pos-fl*38*f+d.len)%d.len;
    else if(base==="srchf")d.pos=(d.pos+fl*38*f)%d.len;
    else if(base==="trkprev"){ d.pos=0; d.playing=false; }
    else if(base==="trknext"){ d.trk=(d.trk+1)%TRACKS.length; d.pos=0; d.playing=false; } };
  el.addEventListener("pointerdown",ev=>{ teach(a); if(!started){startAudio();return;} step(1); t0=Date.now();
    iv=setInterval(()=>step(Date.now()-t0>1500?4:1),80); ev.preventDefault(); });
  const up=()=>{ if(iv){clearInterval(iv);iv=null;} };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up); el.addEventListener("pointerleave",up);
}
/* CUE com press-and-hold (cue point sampler) */
function bindCue(el,a){ const s=a.slice(-1); let held=false,sampler=false;
  el.addEventListener("pointerdown",ev=>{ teach(a); if(!started){startAudio();return;} if(!ready)return; held=true;
    const d=decks[s];
    if(!d.playing&&d.cueSet&&Math.abs(d.pos-d.cuePoint)<=200){ sampler=true; d.playing=true; }
    else cueDeck(s); });
  const up=()=>{ if(!held)return; held=false; if(sampler){ sampler=false; const d=decks[s]; d.playing=false; d.pos=d.cuePoint; } };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
}
/* prato */
function bindJog(el,s){ let active=false,last=0;
  const rect=()=>el.getBoundingClientRect();
  const ang=e=>{ const r=rect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2)); };
  const dist=e=>{ const r=rect(); return Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))/(r.width/2); };
  el.addEventListener("mouseenter",()=>teach("jog"));
  el.addEventListener("pointerdown",e=>{ if(!started){startAudio();return;} if(!ready)return; const d=decks[s];
    active=true; last=ang(e); d.jogTouch=true;
    if(d.vinyl&&dist(e)<0.70){ d.touching=true; d.targetPos=d.pos; }
    el.setPointerCapture(e.pointerId); e.preventDefault(); });
  el.addEventListener("pointermove",e=>{ if(!active||!ready)return; const d=decks[s];
    const a=ang(e); let da=a-last; if(da>Math.PI)da-=2*Math.PI; if(da<-Math.PI)da+=2*Math.PI; last=a;
    if(d.touching){ d.targetPos=clamp(d.targetPos+da/(2*Math.PI)*d.buffer.sampleRate*0.5,0,d.len-1); markMission("scratch"); }
    else { d.bend=clamp(da*26,-14,14); d.bendT=Date.now(); } });
  const up=()=>{ active=false; if(!ready)return; const d=decks[s]; d.touching=false; d.jogTouch=false; };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
}

/* ---------- ação dos botões ---------- */
function onCtl(a,ev){ if(ev)ev.preventDefault(); teach(a);
  /* BROWSE-USB-PADRAO vem primeiro: navegar na lista não depende do áudio estar
     ligado (e o brCarregar liga sozinho na hora de carregar a faixa) */
  if(brRota(a)) return;
  if(a==="pwr"){ PANEL.ligado=!PANEL.ligado; els.pwr.classList.toggle("on",PANEL.ligado);
    aplicaMaster();
    teachMais("pwr",PANEL.ligado?"Aparelho <b>ligado</b>.":"Aparelho <b>desligado</b>: o visor apaga e o master emudece.");
    return; }
  if(!started){ startAudio().then(()=>{ if(/^play/.test(a))playDeck(a.slice(-1),true); }); return; }
  if(!ready)return;
  const s=a.slice(-1), base=a.replace(/[AB]$/,"");
  if(base==="play"&&/[AB]$/.test(a)){ playDeck(s); if(s==="B")markMission("play2"); return; }
  if(/^(loopin|loopout|reloop|beatcut|callb|callf)$/.test(base)&&/[AB]$/.test(a)){ loopAct(s,base); return; }
  if(base==="slip"&&/[AB]$/.test(a)){ const d=decks[s]; d.slip=!d.slip; d.slipPos=d.pos; return; }
  if(base==="rev"&&/[AB]$/.test(a)){ decks[s].dir*=-1; return; }
  if(base==="jogmode"&&/[AB]$/.test(a)){ const d=decks[s]; d.vinyl=!d.vinyl; els[a].innerHTML=d.vinyl?"VINYL":"CDJ"; return; }
  if(base==="mtempo"&&/[AB]$/.test(a)){ decks[s].mt=!decks[s].mt; return; }
  if(base==="trange"&&/[AB]$/.test(a)){ const d=decks[s]; d.rangeIdx=(d.rangeIdx+1)%RANGES.length; d.pitch=-(d.tempoPos-0.5)*2*rangeVal(d); return; }
  if(base==="treset"&&/[AB]$/.test(a)){ const d=decks[s]; d.tempoPos=0.5; placeTempo(s,0.5); d.pitch=0; return; }
  if(base==="sync"&&/[AB]$/.test(a)){ syncTo(s); return; }
  if(base==="mast"&&/[AB]$/.test(a)){ decks.A.mst=(s==="A"); decks.B.mst=(s==="B"); return; }
  if(base==="shift"&&/[AB]$/.test(a)){ shiftOn[s]=!shiftOn[s]; return; }
  if(base==="mem"&&/[AB]$/.test(a)){ const d=decks[s]; d.memPoint=d.cuePoint; flash(a); return; }
  if(base==="del"&&/[AB]$/.test(a)){ decks[s].memPoint=null; flash(a); return; }
  if(/^pm\d[AB]$/.test(a)){ const i=+a[2]-1; padMode[s]=i;
    [1,2,3,4].forEach(k=>els["pm"+k+s].classList.toggle("on",k-1===i)); return; }
  if(/^cue\d$/.test(a)){ const n=+a[3]; hpCue[n]=!hpCue[n]; return; }
  if(a==="fxon"){ fxActive=!fxActive; configureFx(); if(fxActive)markMission("beatfx"); return; }
  if(a==="beatb"){ beatIdx=clamp(beatIdx-1,0,7); configureFx(); return; }
  if(a==="beatf"){ beatIdx=clamp(beatIdx+1,0,7); configureFx(); return; }
  /* BEAT FX por BANDA (manual: "An effect is added to the frequency band of lit
     buttons") — os três botões agora escolhem MESMO em que faixa o efeito age */
  if(a==="fxlow"||a==="fxmid"||a==="fxhi"){ const b=a.slice(2);
    PANEL.fxBanda[b]=!PANEL.fxBanda[b];
    /* o aparelho não deixa apagar as três: sem banda nenhuma não há efeito */
    if(!PANEL.fxBanda.low&&!PANEL.fxBanda.mid&&!PANEL.fxBanda.hi)PANEL.fxBanda[b]=true;
    els[a].classList.toggle("on",PANEL.fxBanda[b]); configureFx();
    teachMais(a,"Bandas ativas: <b>"+["low","mid","hi"].filter(k=>PANEL.fxBanda[k]).join(" · ").toUpperCase()+"</b>.");
    return; }
  if(a==="tap"){ tapTempo(); return; }
  if(a==="autotap"){ PANEL.autoTap=!PANEL.autoTap; els[a].classList.toggle("on",!PANEL.autoTap);
    teachMais(a,PANEL.autoTap?"Em <b>AUTO</b>: o BPM sai da faixa carregada."
                             :"Em <b>TAP</b>: vale o BPM que você bater no TAP ("+(PANEL.bpmTap?PANEL.bpmTap.toFixed(1):"ainda nenhum")+")."); return; }
  if(a==="fxquant"){ PANEL.fxQuant=!PANEL.fxQuant; els[a].classList.toggle("on",PANEL.fxQuant); configureFx();
    teachMais(a,PANEL.fxQuant?"Quantize <b>ligado</b>: o tempo do efeito cai certinho na grade."
                             :"Quantize <b>desligado</b>: o efeito usa o tempo cru do knob."); return; }
  if(/^sc/.test(a)){ const nm=SCNAME[a]; scType=(scType===nm)?null:nm; applyAllColor(); return; }
  if(a==="mcue"){ PANEL.mcue=!PANEL.mcue; els[a].classList.toggle("on",PANEL.mcue);
    teachMais(a,PANEL.mcue?"MASTER CUE <b>ligado</b>: o fone recebe a saída da casa."
                          :"MASTER CUE desligado: o fone volta para os canais em CUE."); return; }
  if(a==="fbon"){ PANEL.fbon=!PANEL.fbon; els[a].classList.toggle("on",PANEL.fbon);
    teachMais(a,PANEL.fbon?("Redutor de microfonia <b>ligado</b> em "+(swPos.fbsw?"HEAVY":"LIGHT")+".")
                          :"Redutor de microfonia desligado."); return; }
  if(a==="talkover"){ PANEL.talkover=!PANEL.talkover; els[a].classList.toggle("on",PANEL.talkover); aplicaMaster();
    teachMais(a,PANEL.talkover?"TALK OVER <b>ativo</b>: a música caiu 18 dB para a voz passar por cima."
                              :"TALK OVER desligado: a música voltou ao nível cheio."); return; }
  /* o manual é explícito: o MASTER REC grava no pendrive da USB 2 — sem ele
     montado o aparelho não começa a gravar */
  if(a==="mrec"){
    if(!PANEL.rec&&!BR.montado["USB 2"]){
      teachMais(a,"O MASTER REC grava no pendrive da <b>USB 2</b> (manual, p. 31) — e ela está desmontada. Clique no slot da USB 2 para espetar de novo."); return; }
    PANEL.rec=!PANEL.rec; if(PANEL.rec)PANEL.marcas=0; els[a].classList.toggle("on",PANEL.rec);
    teachMais(a,PANEL.rec?"Gravando o master no pendrive da USB 2 (WAV)."
                         :"Gravação encerrada — "+PANEL.marcas+" marca(s) de faixa."); return; }
  /* TRACK MARK: "splits a track WHILE the track is being recorded" (manual).
     Parado, ele guarda a marca pendente — assim o botão responde sempre e o
     aluno entende que a marca só vale com o REC ligado. */
  if(a==="tmark"){ PANEL.marcas++; flash(a);
    teachMais(a,PANEL.rec?("Marca "+PANEL.marcas+" — o arquivo será dividido aqui.")
                         :("Contador em "+PANEL.marcas+", mas <b>sem gravação em curso</b>: no aparelho a marca só divide o arquivo com o MASTER REC ligado."));
    return; }
  if(a==="tmode"){ PANEL.tempoRestante=!PANEL.tempoRestante; els[a].classList.toggle("on",PANEL.tempoRestante);
    teachMais(a,"Visor mostrando o tempo <b>"+(PANEL.tempoRestante?"RESTANTE":"DECORRIDO")+"</b>."); return; }
  if(a==="dquant"){ PANEL.quantiza=!PANEL.quantiza; els[a].classList.toggle("on",PANEL.quantiza);
    teachMais(a,PANEL.quantiza?"QUANTIZE <b>ligado</b>: cue, loop e pads passam a cair na grade de batidas."
                              :"QUANTIZE desligado: cue e loop caem exatamente onde você apertou."); return; }
  flash(a);
}
/* TAP TEMPO — três batidas ou mais definem o BPM de referência do BEAT FX */
let _taps=[];
function tapTempo(){ const t=performance.now(); _taps=_taps.filter(x=>t-x<2400); _taps.push(t);
  flash("tap");
  if(_taps.length>=3){ const iv=(_taps[_taps.length-1]-_taps[0])/(_taps.length-1);
    PANEL.bpmTap=clamp(60000/iv,60,200); PANEL.autoTap=false;
    els.autotap&&els.autotap.classList.add("on"); configureFx();
    teachMais("tap","BPM batido: <b>"+PANEL.bpmTap.toFixed(1)+"</b> — o BEAT FX passou a usar este tempo.");
  } else teachMais("tap","Bata mais "+(3-_taps.length)+" vez(es) no ritmo da música."); }
function flash(a){ const e=els[a]; if(!e)return; e.style.filter="brightness(1.8)"; setTimeout(()=>{e.style.filter="";},150); }

/* BROWSE-USB-PADRAO */
/* ===========================================================================
   LISTA DE MÚSICAS DO PENDRIVE (seção BROWSE) — mesmo padrão do XDJ-RX2/RX3
   ---------------------------------------------------------------------------
   POR QUE ESTE BLOCO EXISTE: no XDJ-XZ os botões da seção browse estavam
   desenhados e mudos. USB 1 / USB 2 só trocavam de cor, o seletor rotativo não
   girava nem confirmava (o mkRot media o arrasto e jogava fora), LOAD 1 / LOAD 2
   davam um flash e não carregavam nada, e BACK / TAG TRACK / SHORTCUT /
   TRACK FILTER só acendiam a própria pele.

   O QUE ELE FAZ (manual do XDJ-XZ, "Part names" e "Browse section"):
     USB 1 / USB 2 ....... mostram o conteúdo do dispositivo
     rekordbox ........... biblioteca via USB/PRO DJ LINK
     LINK ................ dispositivo da rede PRO DJ LINK
     BROWSE / TAG LIST / INFO / MENU ...... telas
     BACK ................ volta um nível · segurar 1 s vai ao topo
     TAG TRACK/REMOVE .... marca/desmarca na TAG LIST
     Rotary selector ..... gira = navega · clica = confirma
     SHORTCUT ............ TRACK / PLAYLIST / SEARCH
     TRACK FILTER/EDIT ... filtra por BPM/tom
     LOAD 1 / LOAD 2 ..... carregam no DECK 1 / DECK 2
     USB 1/2 STOP ........ segurar 2 s desmonta antes de tirar o pendrive
   A tela de 7" do XDJ-XZ é TOUCH (manual): com a lista aberta, tocar numa linha
   seleciona e tocar de novo na mesma linha confirma.

   ⚠️ Este bloco foi TRAZIDO do XDJ-RX2/RX3, que já estavam consertados, como
   mandava a ordem — o comportamento é o mesmo de propósito. O que é específico
   do XZ está só no BR_ADAPT e no despacho brRota.
   =========================================================================== */
const BR_ADAPT={
  decks:  ()=>({ "1":decks.A, "2":decks.B }),   /* deck A = DECK 1 · deck B = DECK 2 */
  fontes: ["USB 1","USB 2"],
  linhas: 7
};
const BR={ aberto:false, dev:"USB 1", tela:"browse", sel:0, topo:0,
           tags:new Set(), nTags:0, filtro:false, msg:"", montado:{"USB 1":true,"USB 2":true},
           geo:null };

/* faixas: vêm do BANCO SMU. Sem banco a lista sai VAZIA e o visor avisa —
   nunca inventar nome de música. */
function brFaixas(){
  const B=window.BANCO_SMU, F=(B&&Array.isArray(B.faixas))?B.faixas:[];
  return F.map((f,i)=>({ id:i, tipo:"faixa", ref:f,
    rot:(f.nome||f.titulo||f.arquivo||("FAIXA "+(i+1))), bpm:+f.bpm||0 }));
}
function brBpmRef(){ const d=(decks.B&&decks.B.mst)?decks.B:decks.A;
  return d?124*(1+d.pitch/100):0; }
function brItens(){
  if(BR.tela==="menu") return ["UTILITY","LANGUAGE","LCD BRIGHTNESS","AUTO CUE LEVEL",
    "QUANTIZE BEAT VALUE","MASTER REC","MIDI CHANNEL","VERSION No."].map((t,i)=>({id:i,tipo:"menu",rot:t}));
  if(BR.tela==="shortcut") return ["TRACK","PLAYLIST","SEARCH"].map((t,i)=>({id:i,tipo:"cat",rot:t}));
  /* rekordbox sem PRO DJ LINK e USB desmontada têm de vir VAZIAS — senão o
     visor mostra a biblioteca do pendrive como se fosse a do computador */
  if(BR_ADAPT.fontes.indexOf(BR.dev)<0||!BR.montado[BR.dev]) return [];
  let L=brFaixas();
  if(BR.tela==="taglist") L=L.filter(f=>BR.tags.has(f.id));
  if(BR.filtro){ const r=brBpmRef(); if(r>0) L=L.filter(f=>!f.bpm||Math.abs(f.bpm-r)<=r*0.16); }
  return L;
}
function brAjusta(){ const n=brItens().length;
  BR.sel=n?clamp(BR.sel,0,n-1):0;
  const vis=BR_ADAPT.linhas;
  if(BR.sel<BR.topo)BR.topo=BR.sel;
  if(BR.sel>BR.topo+vis-1)BR.topo=BR.sel-vis+1;
  BR.topo=clamp(BR.topo,0,Math.max(0,n-vis));
}
function brMover(n){ const t=brItens().length; if(!t){BR.sel=0;BR.topo=0;return;}
  BR.sel=(BR.sel+n%t+t)%t; brAjusta(); }
function brAbrir(tela,dev){ if(dev)BR.dev=dev; BR.tela=tela; BR.aberto=true; BR.msg=""; brAjusta(); }
function brFechar(){ BR.aberto=false; BR.tela="browse"; }
function brEntrar(){
  if(!BR.aberto){ brAbrir("browse"); return; }
  const L=brItens(), it=L[BR.sel]; if(!it)return;
  if(it.tipo==="cat"){ BR.tela="browse"; BR.msg="categoria "+it.rot; BR.sel=0; BR.topo=0; return; }
  if(it.tipo==="menu"){ BR.msg=it.rot+" — ajuste no aparelho real"; return; }
  /* faixa: confirma carregando no deck que está PARADO (não corta quem toca) */
  const D=BR_ADAPT.decks();
  brCarregar((D["1"]&&!D["1"].playing)?"1":(D["2"]&&!D["2"].playing)?"2":"1");
}
function brVoltar(topo){
  if(!BR.aberto)return;
  if(topo||BR.tela==="browse"||BR.tela==="taglist"){ brFechar(); return; }
  BR.tela="browse"; BR.sel=0; BR.topo=0; BR.msg="";
}

/* ---------- carregar a faixa no deck (é o que faz o LOAD ser de verdade) ---------- */
function picos(data,len){ const N=520,p=new Float32Array(N),blk=Math.max(1,Math.floor(len/N));
  for(let i=0;i<N;i++){ let mx=0; for(let j=0;j<blk;j+=24){ const v=Math.abs(data[i*blk+j]||0); if(v>mx)mx=v; } p[i]=mx; }
  return p; }
async function brCarregar(nd){
  if(!started){ await startAudio(); }
  if(!ready)return;
  const L=brItens(), it=L[BR.sel];
  if(!it||it.tipo!=="faixa"){ BR.msg="nada para carregar"; return; }
  const d=BR_ADAPT.decks()[nd]; if(!d)return;
  const B=window.BANCO_SMU;
  if(!B||!B.base){ BR.msg="banco de faixas indisponível"; return; }
  BR.msg="carregando "+it.rot+"…";
  try{
    let buf=B.cache?B.cache[it.ref.arquivo]:null;
    if(!buf){ const r=await fetch(B.base+it.ref.arquivo); if(!r.ok)throw new Error("HTTP "+r.status);
      buf=await AC.decodeAudioData(await r.arrayBuffer()); if(B.cache)B.cache[it.ref.arquivo]=buf; }
    d.buffer=buf; d.data=buf.getChannelData(0); d.len=d.data.length;
    d.pos=0; d.cuePoint=0; d.cueSet=false; d.rate=0; d.bend=0;
    d.loopOn=false; d.loopIn=false; d.loopStart=0; d.loopEnd=0; d.loopFull=0;
    d.slip=false; d.playing=false; d.dir=1;
    d.hot=[null,null,null,null,null,null,null,null];
    d.peaks=picos(d.data,d.len);
    d.title=it.rot; d.bpm=it.bpm||124; d.dev=BR.dev;
    BR.msg=""; brFechar();
    teachTxt("LOAD "+nd,"<b>"+it.rot+"</b> carregada no DECK "+nd+
      (it.bpm?(" ("+it.bpm.toFixed(1)+" BPM)"):"")+". O deck fica parado no início — aperte ▶/❚❚.");
  }catch(e){ console.warn("LOAD falhou:",e); BR.msg="falhou: "+((e&&e.message)||e); }
}

/* ---------- despacho dos botões da seção browse e das portas USB ---------- */
function brRota(a){
  switch(a){
    case "usbsel1": BR.montado["USB 1"]=true; brAbrir("browse","USB 1"); BR.sel=0; BR.topo=0;
      ["rbox","link","usbsel1","usbsel2"].forEach(k=>els[k]&&els[k].classList.toggle("on",k===a)); return true;
    case "usbsel2": BR.montado["USB 2"]=true; brAbrir("browse","USB 2"); BR.sel=0; BR.topo=0;
      ["rbox","link","usbsel1","usbsel2"].forEach(k=>els[k]&&els[k].classList.toggle("on",k===a)); return true;
    case "rbox": brAbrir("browse","rekordbox");
      ["rbox","link","usbsel1","usbsel2"].forEach(k=>els[k]&&els[k].classList.toggle("on",k===a)); return true;
    case "link": brAbrir("browse","PRO DJ LINK");
      ["rbox","link","usbsel1","usbsel2"].forEach(k=>els[k]&&els[k].classList.toggle("on",k===a)); return true;
    case "browse": case "taglist": case "info": case "menu":
      brAbrir(a==="browse"?"browse":a);
      ["browse","taglist","info","menu"].forEach(k=>els[k]&&els[k].classList.toggle("on",k===a)); return true;
    case "shortcut": brAbrir("shortcut"); return true;
    case "back":     brVoltar(false);     return true;
    /* TAG TRACK marca a faixa EM DESTAQUE — então ele abre a lista se estiver
       fechada, senão o DJ marcaria às cegas (e nada apareceria no visor) */
    case "tagtrack": { if(!BR.aberto)brAbrir("browse");
      const it=brItens()[BR.sel];
      if(it&&it.tipo==="faixa"){ BR.tags.has(it.id)?BR.tags.delete(it.id):BR.tags.add(it.id); brAjusta();
        BR.msg=(BR.tags.has(it.id)?it.rot+" marcada na TAG LIST":it.rot+" saiu da TAG LIST"); }
      else BR.msg="nada para marcar";
      BR.nTags=BR.tags.size;                    /* contador simples: o ★ do visor lê daqui */
      els.tagtrack&&els.tagtrack.classList.toggle("on",BR.nTags>0); return true; }
    case "tfilter": BR.filtro=!BR.filtro; els.tfilter&&els.tfilter.classList.toggle("on",BR.filtro);
      if(!BR.aberto)brAbrir("browse"); BR.sel=0; BR.topo=0; brAjusta(); return true;
    case "load1": brCarregar("1"); return true;
    case "load2": brCarregar("2"); return true;
    case "usbslot1": case "usbslot2": {   /* espetar o pendrive de volta */
      const dv=a==="usbslot1"?"USB 1":"USB 2";
      BR.montado[dv]=true; els[a]&&els[a].classList.add("on");
      brAbrir("browse",dv); BR.sel=0; BR.topo=0;
      teachMais(a,"Pendrive <b>espetado</b> — a lista da "+dv+" abriu no visor."); return true; }
    case "stop1": case "stop2":
      teachMais(a,"<b>Segure 2 segundos</b> para desmontar antes de tirar o pendrive — é assim no aparelho. Um toque rápido não faz nada.");
      return true;
  }
  return false;
}
/* ações de PRESSIONAR E SEGURAR (o manual define o tempo de cada uma) */
const BR_LONGO={ back:1000, menu:1000, stop1:2000, stop2:2000, tfilter:1000 };
function brLongo(a){
  if(a==="back"){ brVoltar(true); return; }
  if(a==="menu"){ brAbrir("menu"); BR.msg="UTILITY"; return; }
  if(a==="tfilter"){ BR.msg="TRACK FILTER EDIT — critérios no aparelho real"; return; }
  if(a==="stop1"||a==="stop2"){ const dv=a==="stop1"?"USB 1":"USB 2";
    BR.montado[dv]=false;
    const slot=a==="stop1"?"usbslot1":"usbslot2"; els[slot]&&els[slot].classList.remove("on");
    if(BR.aberto&&BR.dev===dv){ BR.sel=0; BR.topo=0; BR.msg="dispositivo removido com segurança"; }
    teachMais(a,"Desmontado. Agora dá para tirar o pendrive sem corromper a base do rekordbox. Clique no slot da "+dv+" para espetar de novo."); }
}
/* liga um botão que tem 2ª função em pressionar-e-segurar */
function bindLongo(el,a,ms){
  let t=null,jaFoi=false;
  el.addEventListener("pointerdown",ev=>{ ev.preventDefault(); teach(a); if(!started)startAudio();
    jaFoi=false; try{el.setPointerCapture(ev.pointerId);}catch(_){}
    t=setTimeout(()=>{ jaFoi=true; flash(a); brLongo(a); },ms); });
  const solta=()=>{ if(t){clearTimeout(t);t=null;} if(!jaFoi){ flash(a); if(!brRota(a))onCtl(a); } jaFoi=false; };
  el.addEventListener("pointerup",solta); el.addEventListener("pointercancel",solta);
}

/* ---------- seletor rotativo: GIRA para navegar, CLICA para confirmar ----------
   ⚠️ clique x giro NÃO se distingue pelo NÚMERO de pointermove (um arrasto pode
   chegar num evento só): o que separa os dois é a DISTÂNCIA que o ponteiro andou. */
function bindRotary(el){
  let ativo=false,ult=0,acu=0,px=0,py=0;
  const cen=()=>{ const b=el.getBoundingClientRect(); return [b.left+b.width/2,b.top+b.height/2,(b.width/2)||1]; };
  const ang=e=>{ const [x,y]=cen(); return Math.atan2(e.clientY-y,e.clientX-x); };
  const raio=e=>{ const [x,y,r]=cen(); return Math.hypot(e.clientX-x,e.clientY-y)/r; };
  const PASSO=Math.PI/9;                               /* 20° = um clique do encoder */
  const gira=n=>{ brMover(n); if(!BR.aberto)brAbrir("browse"); };
  el.addEventListener("pointerdown",e=>{ if(!started)startAudio();
    ativo=true; ult=ang(e); acu=0; px=e.clientX; py=e.clientY;
    try{el.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); teach("rotary"); });
  el.addEventListener("pointermove",e=>{ if(!ativo)return;
    if(raio(e)<0.18){ ult=ang(e); return; }             /* no miolo o ângulo é instável */
    const g=ang(e); let d=g-ult; if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; ult=g; acu+=d;
    while(acu>=PASSO){ acu-=PASSO; gira(1); }
    while(acu<=-PASSO){ acu+=PASSO; gira(-1); } });
  const solta=e=>{ if(!ativo)return; ativo=false;
    const dx=((e&&e.clientX!=null)?e.clientX:px)-px, dy=((e&&e.clientY!=null)?e.clientY:py)-py;
    if(Math.hypot(dx,dy)<6)brEntrar(); };
  el.addEventListener("pointerup",solta); el.addEventListener("pointercancel",solta);
  el.addEventListener("wheel",e=>{ e.preventDefault(); gira(e.deltaY>0?1:-1); },{passive:false});
}
/* ---------- a tela de 7" do XDJ-XZ É TOUCH (manual) ---------- */
function bindTelaTouch(el){
  let ultLinha=-1, ultT=0;
  el.addEventListener("pointerdown",e=>{
    if(!started){ startAudio(); return; }
    if(!BR.aberto||!BR.geo){ teach("screen"); return; }
    const r=el.getBoundingClientRect();
    const cy=(e.clientY-r.top)/r.height*sH;                  /* px do canvas */
    const i=Math.floor((cy-BR.geo.y0)/BR.geo.alt);
    if(i<0||i>=BR.geo.vis)return;
    const alvo=BR.topo+i, n=brItens().length; if(alvo>=n)return;
    const t=performance.now();
    if(alvo===ultLinha&&t-ultT<600){ brEntrar(); }            /* 2º toque = confirmar */
    else { BR.sel=alvo; brAjusta(); teach("rotary"); }
    ultLinha=alvo; ultT=t;
  });
}

/* ---------- desenho da lista dentro do visor ---------- */
function brDesenhar(ctx,lx,ly,lw,lh){
  const TIT={browse:"BROWSE",taglist:"TAG LIST",info:"INFO",menu:"MENU / UTILITY",
             shortcut:"SHORTCUT"}[BR.tela]||"BROWSE";
  ctx.save(); ctx.textBaseline="middle";
  ctx.fillStyle="#070a10"; ctx.fillRect(lx,ly,lw,lh);
  const bh=lh*0.095;
  ctx.fillStyle="#121722"; ctx.fillRect(lx,ly,lw,bh);
  ctx.fillStyle="#2f8fe0"; ctx.fillRect(lx,ly,lw*0.004,bh);
  ctx.font="800 "+Math.round(bh*0.46)+"px Inter,Arial"; ctx.textAlign="left";
  ctx.fillStyle="#eaf2fa"; ctx.fillText(BR.dev,lx+lw*0.016,ly+bh*0.5);
  ctx.fillStyle="#7e8794"; ctx.fillText("›",lx+lw*0.016+ctx.measureText(BR.dev).width+lw*0.012,ly+bh*0.5);
  ctx.fillStyle="#8fd4ff"; ctx.fillText(TIT,lx+lw*0.016+ctx.measureText(BR.dev).width+lw*0.030,ly+bh*0.5);
  ctx.textAlign="right";
  if(BR.filtro){ ctx.fillStyle="#f0a63c"; ctx.fillText("TRACK FILTER",lx+lw*0.985,ly+bh*0.5); }
  else { ctx.fillStyle="#7e8794"; ctx.fillText("SELETOR: gire e clique",lx+lw*0.985,ly+bh*0.5); }

  if(BR.tela==="info"){ brInfo(ctx,lx,ly+bh,lw,lh-bh); ctx.restore(); return; }

  const L=brItens(), vis=BR_ADAPT.linhas;
  if(!L.length){
    const usb=BR_ADAPT.fontes.indexOf(BR.dev)>=0;
    brAviso(ctx,lx,ly+bh,lw,lh-bh,
      !usb?"SEM DISPOSITIVO":(!BR.montado[BR.dev]?"DISPOSITIVO REMOVIDO"
        :(BR.tela==="taglist"?"TAG LIST VAZIA":"NENHUMA FAIXA")),
      !usb?"Ligue um computador ou celular por PRO DJ LINK."
        :(!BR.montado[BR.dev]?"Clique no slot da "+BR.dev+" no painel para espetar de novo."
          :(BR.tela==="taglist"?"Escolha uma faixa no BROWSE e aperte TAG TRACK."
            :"O filtro pode estar apertado — solte o TRACK FILTER.")));
    ctx.restore(); return; }

  const ch=lh*0.075, y0=ly+bh+ch, alt=(lh-bh-ch-lh*0.10)/vis;
  BR.geo={y0,alt,vis};        /* guardado para o TOQUE na tela saber em que linha caiu */
  ctx.font="800 "+Math.round(ch*0.52)+"px Inter,Arial"; ctx.fillStyle="#6d7684"; ctx.textAlign="left";
  ctx.fillText("TRACK",lx+lw*0.055,ly+bh+ch*0.5);
  ctx.textAlign="right"; ctx.fillText("BPM",lx+lw*0.96,ly+bh+ch*0.5);

  for(let i=0;i<vis;i++){
    const it=L[BR.topo+i]; if(!it)break;
    const y=y0+i*alt, sel=(BR.topo+i)===BR.sel;
    ctx.fillStyle=sel?"#1d5f9e":(i%2?"#0b0f15":"#0d1219"); ctx.fillRect(lx,y,lw,alt-1);
    if(sel){ ctx.fillStyle="#8fd4ff"; ctx.fillRect(lx,y,lw*0.006,alt-1); }
    ctx.font="800 "+Math.round(alt*0.42)+"px Inter,Arial"; ctx.textAlign="left";
    ctx.fillStyle=(it.tipo==="faixa"&&BR.tags.has(it.id))?"#f0a63c":"#242c37";
    ctx.fillText("★",lx+lw*0.014,y+alt*0.5);
    ctx.fillStyle=sel?"#ffffff":"#cfd8e3";
    let nome=it.rot; const maxw=lw*0.74;
    while(nome.length>4&&ctx.measureText(nome).width>maxw)nome=nome.slice(0,-2);
    if(nome!==it.rot)nome+="…";
    ctx.fillText(nome,lx+lw*0.055,y+alt*0.5);
    if(it.bpm){ ctx.textAlign="right"; ctx.fillStyle=sel?"#ffe6bd":"#f0a63c";
      ctx.fillText(it.bpm.toFixed(1),lx+lw*0.96,y+alt*0.5); }
  }
  if(L.length>vis){ const tx=lx+lw*0.988, th=(lh-bh-ch-lh*0.10);
    ctx.fillStyle="#141a23"; ctx.fillRect(tx,y0,lw*0.010,th);
    const h=Math.max(th*0.08,th*vis/L.length), p=BR.topo/(L.length-vis);
    ctx.fillStyle="#4a7fb5"; ctx.fillRect(tx,y0+p*(th-h),lw*0.010,h); }
  const fy=ly+lh-lh*0.10;
  ctx.fillStyle="#0a0e14"; ctx.fillRect(lx,fy,lw,lh*0.10);
  ctx.font="800 "+Math.round(lh*0.045)+"px Inter,Arial"; ctx.textAlign="left";
  ctx.fillStyle=BR.msg?"#f0a63c":"#6d7684";
  ctx.fillText(BR.msg||("LOAD 1 / LOAD 2 mandam para o deck  ·  BACK volta  ·  "+(BR.sel+1)+"/"+L.length),
    lx+lw*0.016,fy+lh*0.05);
  ctx.restore();
}
function brAviso(ctx,x,y,w,h,tit,sub){
  ctx.textAlign="center";
  const cabe=(txt,px,cor)=>{ let s=px;
    do{ ctx.font="900 "+Math.round(s)+"px Inter,Arial"; s-=1; }while(s>6&&ctx.measureText(txt).width>w*0.92);
    ctx.fillStyle=cor; };
  cabe(tit,h*0.15,"#39424f"); ctx.fillText(tit,x+w/2,y+h*0.42);
  cabe(sub,h*0.085,"#5a6472"); ctx.fillText(sub,x+w/2,y+h*0.62);
}
function brInfo(ctx,x,y,w,h){
  const it=brItens()[BR.sel], a=decks.A, b=decks.B;
  const nomeDe=(d,k)=>d?(d.title||TRACKS[k].t):"—";
  ctx.textAlign="left";
  const linhas=[
    ["FAIXA",   it?it.rot:nomeDe(a,0)],
    ["BPM",     it&&it.bpm?it.bpm.toFixed(1):(a?(124*(1+a.pitch/100)).toFixed(1):"—")],
    ["DECK 1",  nomeDe(a,0)],
    ["DECK 2",  nomeDe(b,1)],
    ["TAG LIST",BR.tags.size+" faixa(s) marcada(s)"],
    ["FONTE",   BR.dev+(BR.montado[BR.dev]?"":" (removida)")]
  ];
  linhas.forEach((l,i)=>{ const ly2=y+h*0.13+i*h*0.145;
    ctx.fillStyle="#6d7684"; ctx.font="800 "+Math.round(h*0.075)+"px Inter,Arial";
    ctx.fillText(l[0],x+w*0.03,ly2);
    ctx.fillStyle="#dfe6ee"; ctx.font="800 "+Math.round(h*0.095)+"px Inter,Arial";
    ctx.fillText(String(l[1]),x+w*0.26,ly2); });
}
/* fim BROWSE-USB-PADRAO */

/* ======================= BUILD ======================= */
function build(){
  silk();

  /* ---- POWER / MIC ---- */
  const p=document.createElement("div"); p.className="pwrsw"; p.innerHTML="&#9211;"; place("pwr",p);
  p.addEventListener("pointerdown",()=>onCtl("pwr"));
  mkSw("mic1sw",0,2); mkSw("mic2sw",0,2);
  mkKnob("mic1lvl",0.0,"sml"); mkKnob("mic2lvl",0.0,"sml");
  ["mic1low","mic1mid","mic1hi","mic2low","mic2mid","mic2hi"].forEach(k=>mkKnob(k,0.5));
  mkRb("talkover","red"); mkSw("fbsw",0,2); mkBtn("fbon","ON","gr");

  /* ---- BROWSE / TELA ---- */
  mkBtn("browse","BROWSE","wht"); mkBtn("taglist","TAG LIST","wht"); mkBtn("info","INFO","wht");
  mkBtnL("menu","MENU","wht",BR_LONGO.menu);          /* segurar 1 s = UTILITY */
  mkBtn("rbox","rekordbox","wht"); mkBtn("link","LINK","cy"); mkBtn("usbsel1","USB 1","gr"); mkBtn("usbsel2","USB 2","gr");
  els.usbsel1.classList.add("on");
  mkRb("tmode"); mkRb("dquant");
  mkBtnL("back","&#8592;","wht",BR_LONGO.back);       /* segurar 1 s = topo */
  mkBtn("tagtrack","&#9679;","wht");
  mkRot("rotary");
  mkBtnL("tfilter","","wht",BR_LONGO.tfilter); mkBtn("shortcut","","wht");
  mkBtn("load1","1","wht"); mkBtn("load2","2","wht");
  /* tela de 7" */
  const sp=POS.screen;
  const sc=document.createElement("canvas"); sc.className="scr";
  sc.width=1180; sc.height=Math.round(1180/((sp[2]/sp[3])*AR));
  pct(sc,sp[0],sp[1],sp[2],sp[3]); deck.appendChild(sc); els.screen=sc;
  sc.addEventListener("mouseenter",()=>teach("screen"));
  sCtx=sc.getContext("2d"); sW=sc.width; sH=sc.height;
  /* o LCD de 7" do XDJ-XZ é TOUCH (manual): com a lista aberta, tocar numa linha
     seleciona e tocar de novo na mesma linha confirma — ver BROWSE-USB-PADRAO */
  sc.style.cursor="pointer"; bindTelaTouch(sc);

  /* ---- MASTER / USB ---- */
  mkKnob("mlevel",0.72,"sml",()=>aplicaMaster()); mkBtn("mcue","CUE","or");
  /* MASTER EQ: nasce em 0 dB (repouso 0,8125) e agora MEXE no som de verdade —
     antes os três knobs giravam a pele e não tinham nó de áudio nenhum */
  ["mlow","mmid","mhi"].forEach(k=>mkKnob(k,null,null,()=>aplicaMasterEq()));
  mkKnob("booth",0.5,"sml",()=>teach("booth"));
  els.mmetL=$("#mmL"); els.mmetR=$("#mmR");
  mkUsb("usbslot1"); mkUsb("usbslot2"); els.usbslot1.classList.add("on");
  mkRb("mrec","red");
  mkRbL("stop1",null,BR_LONGO.stop1); mkRbL("stop2",null,BR_LONGO.stop2);   /* segurar 2 s desmonta */
  mkRb("tmark");

  /* ---- MIXER ---- */
  mkSw("ch3in",0,3); mkSw("ch4in",0,3);
  CH.forEach(n=>{
    /* init null = nasce no repouso de KNOBREP: TRIM na unidade, EQ em 0 dB */
    mkKnob("trim"+n,null,"sml",()=>{ if(ready)setEq(n,"trim",kv("trim"+n)); });
    ["hi","mid","low"].forEach(b=>mkKnob(b+n,null,null,()=>{ if(ready)setEq(n,b,kv(b+n)); }));
    mkKnob("col"+n,0.5,"color",()=>applyAllColor());
    mkBtn("cue"+n,"CUE","or");
    mkFader("fad"+n,n);
    mkSw("asg"+n,1,3,v=>{ assignMode[n]=["A","THRU","B"][v];
      if(ready){ const c=chans[n]; c.dry.disconnect(); c.dry.connect(busOf(assignMode[n])); } });
    els["met"+n]=$("#mt"+n);
  });
  mkSw("auxsw",0,3); mkKnob("auxtrim",0.4,"sml");
  ["scspace","scdub","scsweep","scnoise","sccrush","scfilter"].forEach(k=>mkBtn(k,"","cy"));
  mkKnob("param",0.5,"sml"); mkKnob("hpmix",0.5,"sml"); mkKnob("hplvl",0.3,"sml");
  mkXpad("xpad");
  mkBtn("beatb","&#9664;","wht"); mkBtn("beatf","&#9654;","wht");
  mkRb("tap","wt"); mkRb("autotap"); mkRb("fxquant");
  mkBtn("fxlow","LOW","bl"); mkBtn("fxmid","MID","bl"); mkBtn("fxhi","HI","bl");
  mkKnob("fxsel",fxIdx/(FXNAMES.length-1),null,v=>{ fxIdx=Math.round(v*(FXNAMES.length-1)); configureFx(); });
  mkKnob("fxch",fxChIdx/(FXCHN.length-1),null,v=>{ fxChIdx=Math.round(v*(FXCHN.length-1)); routeFx(); });
  mkKnob("fxtime",0.4,"sml",()=>configureFx());
  mkKnob("fxdepth",0.55,"sml",()=>configureFx());
  const fo=document.createElement("div"); fo.className="rb wt"; fo.innerHTML='<div class="led"></div>';
  place("fxon",fo); fo.addEventListener("pointerdown",ev=>onCtl("fxon",ev));
  mkXf("xfader");

  /* ---- DECKS ---- */
  ["A","B"].forEach(s=>{
    mkAmb("loopin"+s); mkAmb("loopout"+s); mkRb("reloop"+s);
    mkRb("callb"+s); mkRb("callf"+s); mkRb("del"+s); mkRb("mem"+s);
    mkKnob("vspeed"+s,0.5,"sml");
    mkRb("beatcut"+s); mkBtn("jogmode"+s,"VINYL","vinyl");
    mkRb("slip"+s,"red"); mkKnob("jogadj"+s,0.5,"sml");
    mkBtn("rev"+s,"REV","revb");
    mkRb("sync"+s,"wt"); mkRb("mast"+s,"wt");
    mkRb("trange"+s); mkRb("mtempo"+s,"red");
    mkBtn("shift"+s,"SHIFT","wht");
    mkRbg("trkprev"+s,SVG_PREV); mkRbg("trknext"+s,SVG_NEXT);
    mkRbg("srchb"+s,SVG_RW); mkRbg("srchf"+s,SVG_FF);
    mkBig("cue"+s,"cue","CUE"); mkBig("play"+s,"play","&#9654;/&#10073;&#10073;");
    PADMODES.forEach((t,i)=>mkBtn("pm"+(i+1)+s,t,["wht","cy","bl","rd"][i]));
    els["pm1"+s].classList.add("on");
    for(let i=0;i<8;i++)mkPad("pad"+(i+1)+s,PADCOL[i]);
    mkRb("treset"+s); mkTempo("tempo"+s,s);
    /* prato */
    const key=s==="A"?"jog":"platter";
    let [jx,jy,jw,jh]=POS[key]; { const nh=jw*AR; jy=jy+jh/2-nh/2; jh=nh; }
    const cv=document.createElement("canvas"); cv.className="jogc"; cv.width=520; cv.height=520;
    pct(cv,jx,jy,jw,jh); deck.appendChild(cv); jogCtx[s]=cv.getContext("2d"); jogS[s]=cv.width;
    jogBase[s]=buildJogBase(s,cv.width);   /* camada estática pintada 1x */
    const hit=document.createElement("div"); hit.className="joghit"; pct(hit,jx,jy,jw,jh); deck.appendChild(hit);
    els[key]=cv; bindJog(hit,s);
  });
  renderMission();
}

function init(){ build(); frame();
  $("#btnStart").addEventListener("pointerdown",()=>startAudio());
  $("#btnReset").addEventListener("pointerdown",()=>location.reload());
  const fit=()=>{ const w=$(".wrap");
    const cap=document.documentElement.classList.contains("smu-fs")?2.6:1;   // contrato html.smu-fs
    const s=Math.max(0.1,Math.min((window.innerWidth-6)/w.offsetWidth,(window.innerHeight-6)/w.offsetHeight,cap));
    $("#stage").style.transform="scale("+s+")"; };
  window.addEventListener("resize",fit); fit();
}
init();

/*BANCO-SMU-INI*/
/*BANCO-SMU-v2*/
/* BANCO SMU — faixas liberadas da SMU tocando no motor completo deste aparelho.
   ⛔ Em producao BASE tem de ser URL ABSOLUTA com CORS "*": o sim roda em
   <iframe srcDoc sandbox> sem allow-same-origin e sem <base>, entao caminho
   relativo resolve contra a URL da AULA (404) e o fetch vai com Origin: null. */
(function(){
  /* URL ABSOLUTA com CORS "*" — obrigatorio. O sim roda em iframe srcDoc de
     origem opaca: caminho relativo dava 404 e o fetch sai com Origin: null.
     Conferido em 29/07/2026: devolve 206 + audio/mpeg + Access-Control-Allow-Origin: *
     mesmo com Origin: null, nas 13 faixas. NAO voltar para caminho relativo. */
  var BASE = "https://pshynylvvkhhohftouoe.supabase.co/storage/v1/object/public/musicas-dj/";
  var FAIXAS = [
    { arquivo:"sotex-1.mp3",  nome:"SOTEX 01", bpm:98.4  },
    { arquivo:"sotex-2.mp3",  nome:"SOTEX 02", bpm:144.6 },
    { arquivo:"sotex-3.mp3",  nome:"SOTEX 03", bpm:146.4 },
    { arquivo:"sotex-4.mp3",  nome:"SOTEX 04", bpm:95.3  },
    { arquivo:"sotex-5.mp3",  nome:"SOTEX 05", bpm:133.4 },
    { arquivo:"sotex-6.mp3",  nome:"SOTEX 06", bpm:113.3 },
    { arquivo:"sotex-7.mp3",  nome:"SOTEX 07", bpm:117.7 },
    { arquivo:"sotex-8.mp3",  nome:"SOTEX 08", bpm:117.7 },
    { arquivo:"sotex-9.mp3",  nome:"SOTEX 09", bpm:160.2 },
    { arquivo:"sotex-10.mp3", nome:"SOTEX 10", bpm:160.2 },
    { arquivo:"sotex-11.mp3", nome:"SOTEX 11", bpm:89.6  },
    { arquivo:"sotex-12.mp3", nome:"SOTEX 12", bpm:139.6 },
    { arquivo:"sotex-13.mp3", nome:"SOTEX 13", bpm:122.5 }
  ];
  window.BANCO_SMU = { base:BASE, faixas:FAIXAS, escolhida:null, cache:{} };

  /* Envolve renderTrack: escolheu faixa -> MP3 real; senao -> faixa sintetizada.
     O deck recebe um AudioBuffer nos dois casos e nao percebe diferenca. */
  async function baixar(f){
    if (window.BANCO_SMU.cache[f.arquivo]) return window.BANCO_SMU.cache[f.arquivo];
    var r = await fetch(window.BANCO_SMU.base + f.arquivo);
    if (!r.ok) throw new Error("HTTP " + r.status);
    var buf = await AC.decodeAudioData(await r.arrayBuffer());
    window.BANCO_SMU.cache[f.arquivo] = buf;
    return buf;
  }

  if (typeof renderTrack === "function") {
    var _orig = renderTrack;
    renderTrack = async function(kind){
      var esc = window.BANCO_SMU.escolhida;
      if (!esc) return await _orig.apply(this, arguments);
      try {
        /* Mixer chama renderTrack("A") e renderTrack("B") p/ ter material
           DIFERENTE em cada par de canais — mesma faixa nos dois viraria
           exercicio pobre (o aluno nao ouve a mixagem, ouve eco). Entao "B"
           (e "C"/"D" nos de 4 decks) pega a proxima faixa da lista.
           Player de 1 deck chama sem argumento e cai no caso normal. */
        var lista = window.BANCO_SMU.faixas;
        var i = lista.indexOf(esc);
        var passo = { A:0, B:1, C:2, D:3 }[String(kind || "A").toUpperCase()] || 0;
        var alvo = lista[(i + passo) % lista.length];
        var buf = await baixar(alvo);
        if (passo === 0) window.__BANCO_BPM = alvo.bpm;   // BPM do deck principal
        return buf;
      } catch(e) {
        console.warn("Banco SMU falhou, usando faixa de treino:", e);
        window.__BANCO_BPM = null;
        return await _orig.apply(this, arguments);
      }
    };
  }

  /* A barra e position:fixed, entao ela se prende a viewport do IFRAME em que
     o sim roda. Em uso normal isso e a tela do simulador (ok). Mas quando o sim
     e EMBUTIDO dentro de outra aula (iframe dentro de iframe), a viewport vira
     do tamanho do aparelho na bancada e a barra cobriria o painel.

     ⛔ NAO usar "window.self !== window.top" p/ detectar isso: em uso NORMAL o
     sim JA roda dentro de um iframe (srcDoc do animation-player), entao essa
     condicao e sempre verdadeira e some com a barra em todo lugar.
     O que distingue e a PROFUNDIDADE: aninhado 2+ niveis -> parent != top. */
  function embutido(){
    if (window.__SMU_EMBUTIDO) return true;              // bandeira explicita
    try { return window.parent !== window.top; } catch(e) { return false; }
  }
  window.BANCO_SMU.mostrarBarra = function(v){           // controle manual
    var b = document.getElementById("bancoSmuBar");
    if (b) b.style.display = v ? "flex" : "none";
  };

  /* Barra flutuante: nao depende do layout do aparelho (cada sim tem o seu). */
  function montar(){
    if (embutido()) return;                              // quem embute controla a UI
    if (document.getElementById("bancoSmuBar")) return;
    var bar = document.createElement("div");
    bar.id = "bancoSmuBar";
    bar.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:9999;display:flex;gap:6px;"+
      "align-items:center;background:#0d1117ee;border:1px solid #1d5638;border-radius:9px;"+
      "padding:6px 9px;font:11px/1.3 Inter,system-ui,sans-serif;color:#b7f5cf;"+
      "box-shadow:0 6px 24px #000a;backdrop-filter:blur(4px)";
    var lbl = document.createElement("span");
    lbl.textContent = "🎵 BANCO SMU";
    lbl.style.cssText = "font-weight:800;letter-spacing:.5px";
    var sel = document.createElement("select");
    sel.style.cssText = "font:inherit;background:#10241a;color:#dff7e9;border:1px solid #1d5638;"+
      "border-radius:6px;padding:3px 6px;max-width:190px";
    var op0 = document.createElement("option");
    op0.value = ""; op0.textContent = "faixa de treino (padrão)";
    sel.appendChild(op0);
    FAIXAS.forEach(function(f,i){
      var o = document.createElement("option");
      o.value = String(i); o.textContent = f.nome + " · " + f.bpm + " BPM";
      sel.appendChild(o);
    });
    var msg = document.createElement("span");
    msg.style.cssText = "color:#7fa08d";
    sel.addEventListener("change", function(){
      window.BANCO_SMU.escolhida = sel.value === "" ? null : FAIXAS[+sel.value];
      msg.textContent = sel.value === ""
        ? "recarregue p/ voltar à faixa de treino"
        : "recarregue o áudio p/ tocar esta faixa";
    });
    bar.appendChild(lbl); bar.appendChild(sel); bar.appendChild(msg);
    document.body.appendChild(bar);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", montar);
  else montar();
})();

</script>
