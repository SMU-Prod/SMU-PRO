<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Pioneer CDJ-3000 — réplica fiel (SMU)</title>
<style>
  :root{ --ink:#e9eef7; --amber:#ff9a1e; --green:#37d24a; --blue:#2f8bff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{ background:radial-gradient(1100px 640px at 50% -10%,#25282d,#0a0b0d 62%),#08090b; color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    user-select:none;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
  #stage{transform-origin:top center;flex:0 0 auto}
  .wrap{width:560px;display:flex;flex-direction:column;gap:8px;padding:10px}

  .util{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(180deg,#202329,#15171b);border:1px solid #0c0d0f;border-radius:11px;padding:7px 11px}
  .brand b{font-size:15px;letter-spacing:1px;color:#eef2f8}
  .brand .m{font-size:9px;letter-spacing:2px;color:#8a94a4;text-transform:uppercase;margin-left:6px}
  .pill{font-size:10px;color:#8b97a9;background:#0c0e12;border:1px solid #2a2f37;border-radius:16px;padding:4px 9px;display:flex;align-items:center;gap:6px}
  .pill b{color:#fff}.dot{width:8px;height:8px;border-radius:50%;background:#444}.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .spacer{flex:1}
  .btnp{font:inherit;font-size:11px;font-weight:700;border:0;border-radius:8px;padding:6px 11px;cursor:pointer;color:#07120b;background:linear-gradient(180deg,#5be59a,#27b566)}
  .btnp.ghost{background:transparent;color:#8b97a9;border:1px solid #2a2f37}
  .mission{display:flex;align-items:center;gap:8px;background:#0c0e12;border:1px solid #2a2f37;border-radius:9px;padding:5px 10px;flex:1 1 240px;min-width:0}
  .mission .idx{font-size:10px;color:var(--amber);font-weight:800;white-space:nowrap}
  .mission .txt{font-size:11px;line-height:1.2}.mission .txt b{color:#fff}.mission .txt small{color:#8b97a9}

  /* ===== corpo do CDJ-3000: preto fosco / metal escovado =====
     Dimensões oficiais (spec Pioneer DJ): 329,0 (L) x 452,6 (P) x 118,8 (A) mm
     → aspect-ratio do painel visto de cima = 329 / 452,6                       */
  .deck{position:relative;width:100%;aspect-ratio:329/452.6;border-radius:11px;
    background:
      repeating-linear-gradient(90deg,#00000016 0 1px,transparent 1px 3px),
      radial-gradient(110% 58% at 30% 38%,#2f3236 0%,#292c30 28%,#212427 56%,#191b1e 80%,#141618 100%);
    box-shadow:0 26px 60px #000d, inset 0 2px 0 #ffffff10, inset 0 -6px 18px #000a, 0 0 0 1px #000, 0 0 0 2px #303338;
    overflow:hidden}
  .deck::before{content:"";position:absolute;inset:0;border-radius:11px;pointer-events:none;
    background:linear-gradient(118deg,#ffffff10 0%,transparent 22%, transparent 78%, #00000030 100%)}

  .lab{position:absolute;font-size:6.4px;letter-spacing:.2px;color:#c3cbd4;font-weight:700;text-transform:uppercase;text-shadow:0 1px 1px #000;pointer-events:none;white-space:nowrap;z-index:4;line-height:1}
  .lab.sm{font-size:5.2px;color:#aeb6c0;letter-spacing:.1px}
  .lab.xs{font-size:4.4px;color:#c0c8d1;letter-spacing:0}
  .lab.rd{color:#e0473f}.lab.gr{color:#37d24a}.lab.lc{text-transform:none}
  /* etiqueta serigrafada em caixa (IN ADJUST / 1/2X / SLIP REV…) */
  .lab.box{color:#e6ebf1;background:#1b1e23;border:1px solid #454b53;border-radius:2px;padding:1px 3px;font-size:4.6px}

  .logo{position:absolute;left:50%;top:0.4%;transform:translateX(-50%);font-size:13px;font-weight:900;font-style:italic;color:#9ba3ac;text-shadow:0 1px 1px #000;letter-spacing:.4px;z-index:4;opacity:.6}
  .biglogo{position:absolute;left:50.7%;top:92.6%;transform:translateX(-50%);font-size:23px;font-weight:900;font-style:italic;color:#c4cad1;text-shadow:0 1px 2px #000,0 0 1px #fff3;letter-spacing:.5px;pointer-events:none;opacity:.92;z-index:4}
  .biglogo i{font-style:normal}
  .modeltxt{position:absolute;left:95.5%;top:96.4%;transform:translate(-100%,0);font-size:12px;font-weight:900;letter-spacing:.6px;color:#dfe4ea;text-shadow:0 1px 1px #000;z-index:4;white-space:nowrap}
  .modeltxt small{font-weight:700;font-size:6.4px;color:#9aa2ac;letter-spacing:.8px;margin-right:4px;vertical-align:2px}

  /* ---- estrutura do chassi medida na foto ---- */
  /* bloco traseiro elevado (rekordbox + botões de navegação) */
  .rear{position:absolute;pointer-events:none;z-index:0;border-radius:5px 5px 0 0;
    background:linear-gradient(180deg,#1b1e22 0%,#26292e 16%,#1a1d21 46%,#121417 78%,#0c0e10 100%);
    box-shadow:inset 0 1px 0 #ffffff20, inset 0 -3px 8px #000b, 0 1px 0 #000}
  /* risca azul do rekordbox no alto do bloco traseiro (vista de cima) */
  .rear::after{content:"";position:absolute;left:30%;right:30%;top:5%;height:9%;border-radius:2px;
    background:linear-gradient(90deg,transparent,#2b8397 22%,#3fb6cf 50%,#2b8397 78%,transparent);opacity:.85}
  /* flanco de alumínio escovado — SÓ o lado ESQUERDO (USB/SD). O direito é módulo preto. */
  .flank{position:absolute;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 2px),
               linear-gradient(180deg,#a2a2a5 0%,#909093 22%,#6e7176 52%,#53575c 76%,#3a3d41 100%);
    box-shadow:inset 0 1px 0 #ffffff33, inset 0 -2px 6px #0008}
  .flank.l{border-radius:9px 0 0 0}
  /* lado direito: chapa preta (medido na foto — NÃO é alumínio) */
  .rside{position:absolute;pointer-events:none;z-index:0;border-radius:0 9px 0 0;
    background:linear-gradient(180deg,#1d2024,#131619 44%,#0d0f11);box-shadow:inset 1px 1px 0 #ffffff12, inset 0 -2px 6px #0009}
  /* módulo elevado do seletor rotativo / do BEAT SYNC */
  .mod{position:absolute;pointer-events:none;z-index:1;border-radius:7px;
    background:linear-gradient(180deg,#2b3036,#1a1e22 60%,#111417);
    box-shadow:inset 0 1px 0 #ffffff1c, 0 2px 4px #0009, inset 0 -3px 7px #0007}
  /* porta USB azul e slot de SD (decorativos, medidos) */
  .usbport{position:absolute;pointer-events:none;z-index:2;border-radius:3px;
    background:linear-gradient(180deg,#141c26,#0b1118);box-shadow:0 0 7px #2f8bff44, inset 0 0 0 1.5px #2f9fe0, inset 0 3px 7px #000c}
  .usbport::after{content:"";position:absolute;left:17%;right:17%;top:28%;bottom:26%;border-radius:1px;
    background:linear-gradient(180deg,#2a5fae,#123258);box-shadow:inset 0 1px 0 #ffffff28}
  .sdslot{position:absolute;pointer-events:none;z-index:2;border-radius:4px;
    background:linear-gradient(180deg,#2b3036,#1b1f23 40%,#111417);box-shadow:inset 0 2px 7px #000d, 0 1px 0 #ffffff1c}
  .sdslot::after{content:"";position:absolute;left:10%;right:10%;bottom:8%;height:10%;border-radius:2px;background:#1a7fe0;box-shadow:0 0 5px #2f8bff88}

  /* baía rebaixada do display: moldura preta em volta do vidro (medida na foto) */
  .hood{position:absolute;border-radius:4px;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,#4a4f56 0%,#2a2e33 12%,#15181b 34%,#101215 100%);
    box-shadow:inset 0 0 0 1px #000, inset 0 4px 10px #000d, 0 1px 0 #ffffff14}

  /* botões de navegação (browse) — cápsula fina, texto azul, no bloco traseiro */
  .browse{position:absolute;cursor:pointer;border-radius:3px;z-index:3;min-width:0;box-sizing:border-box;overflow:hidden;
    background:linear-gradient(180deg,#2c3037,#191d22 55%,#101317);border:1px solid #000;
    box-shadow:inset 0 1px 0 #ffffff26, inset 0 0 0 1px #4b525b, 0 1px 2px #000a;
    display:flex;align-items:center;justify-content:center;color:#6fb0ff;font-size:5.1px;font-weight:800;letter-spacing:.4px;
    text-shadow:0 0 4px #2f8bff88,0 1px 1px #000;white-space:nowrap;padding:0 1px}
  .browse:active{transform:translateY(1px)}
  .browse.lit{color:#eef3f9;text-shadow:0 1px 1px #000}

  /* display (vidro de 9" 16:9 — a moldura preta é o .hood, por fora) */
  .disp{position:absolute;z-index:2;border-radius:2px;overflow:hidden;background:#04050700;
    box-shadow:inset 0 0 0 1px #000, 0 0 0 1px #0a0c0e, inset 0 2px 10px #000c}
  .dispc{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

  /* botão redondo metálico (cúpula escovada — como na foto) */
  .rbtn{position:absolute;cursor:pointer;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 50% 26%,#f2f5f8,#c8ced4 46%,#8a9098 74%,#5a6067 92%,#3c4147 100%);
    border:1px solid #2a2d31;box-shadow:0 2px 4px #0009, inset 0 1px 1px #ffffffcc, inset 0 -3px 5px #0005;
    display:flex;align-items:center;justify-content:center;color:#3a3e43;font-size:8.5px;font-weight:900;text-shadow:0 1px 0 #ffffff66}
  .rbtn:active{transform:translateY(1px)}
  .rbtn .led{position:absolute;top:32%;left:50%;transform:translateX(-50%);width:32%;height:32%;border-radius:50%;background:#3a1010;box-shadow:inset 0 0 2px #000}
  .rbtn.on .led{background:#ff3b2f;box-shadow:0 0 6px #ff3b2f,inset 0 0 2px #fff6}
  .rbtn.amber .cen{width:36%;height:36%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffcf7a,#e8951c 60%,#9a5e00);box-shadow:inset 0 1px 1px #fff8,0 0 0 1px #000}
  .rbtn.amber.on .cen{box-shadow:0 0 10px #ff9a1e,inset 0 1px 1px #fff8,0 0 0 1px #000}
  /* variante ESCURA (DELETE, MEMORY, TIME MODE, ±RANGE, MASTER TEMPO, TEMPO RESET, RELOOP) */
  .rbtn.dk{background:radial-gradient(circle at 46% 26%,#6b7178,#3a4046 40%,#1c2024 72%,#0b0d10 100%);
    border:1px solid #000;box-shadow:0 2px 4px #000b, inset 0 1px 1px #ffffff45, inset 0 -3px 6px #0008;color:#b9c1cb;text-shadow:0 1px 1px #000}
  /* colar rebaixado dos botões redondos escuros grandes (DELETE / RELOOP) */
  .rbtn.collar{box-shadow:0 0 0 2px #0b0d10, 0 0 0 3px #3b4148, 0 2px 5px #000b, inset 0 1px 1px #ffffff45, inset 0 -3px 6px #0008}
  /* setas âmbar dos botões redondos (TRACK SEARCH / SEARCH / CALL) */
  .rbtn.arw{color:#ffa524;font-size:7.2px;text-shadow:0 1px 0 #ffffff55;letter-spacing:-.5px}
  .rbtn.dk.arw{color:#ffa524;text-shadow:0 1px 1px #000}

  /* botões laranja (IN/OUT) */
  .orange{position:absolute;cursor:pointer;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 50% 30%,#ffdf9e,#ffa72a 52%,#e07c06 84%,#b25e02 100%);
    border:1px solid #6b3500;box-shadow:0 0 0 2px #0d0f12, 0 2px 5px #000b, inset 0 1px 2px #fff9, inset 0 -3px 6px #0005}
  .orange:active{transform:translateY(1px)}
  .orange.on{box-shadow:0 0 0 2px #0d0f12, 0 0 14px #ff9a1e, inset 0 1px 2px #fff9}

  /* botão numerado do BEAT LOOP (na foto é ESCURO com número âmbar) */
  .numb{position:absolute;cursor:pointer;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 46% 26%,#6b7178,#3a4046 40%,#1c2024 72%,#0b0d10 100%);
    border:1px solid #000;box-shadow:0 2px 4px #000b, inset 0 1px 1px #ffffff45, inset 0 -3px 6px #0008;
    display:flex;align-items:center;justify-content:center;color:#ffb43a;font-size:11.5px;font-weight:900;text-shadow:0 1px 1px #000}
  .numb:active{transform:translateY(1px)}
  .numb.on{background:radial-gradient(circle at 50% 30%,#bfe6ff,#5db1ff 55%,#1d6fd0);color:#05233f;text-shadow:none;box-shadow:0 0 12px #2f8bff,inset 0 1px 1px #fff}

  /* pads HOT CUE (retângulo preto, letra no alto-esq., barra colorida embaixo) */
  .hc{position:absolute;cursor:pointer;border-radius:4px;z-index:3;overflow:hidden;
    background:linear-gradient(180deg,#2a2e34,#191d21 48%,#0e1114);border:1px solid #000;
    box-shadow:inset 0 1px 0 #ffffff1f, inset 0 0 0 1px #2f343a, 0 1px 2px #000a}
  .hc .ul{position:absolute;left:9%;right:9%;top:75%;height:10%;border-radius:1px;opacity:.95;box-shadow:0 0 5px currentColor}
  .hc .lt{position:absolute;left:9%;top:14%;font-size:7px;font-weight:900;text-shadow:0 1px 1px #000;line-height:1}
  .hc:active{transform:translateY(1px)}
  .hc.on{background:linear-gradient(180deg,#3d434a,#23282d)}
  .hc.on .ul{opacity:1;top:26%;height:59%;filter:brightness(1.15)}

  /* botões grandes CUE / PLAY — aro colorido fino, cúpula metálica ocupando 80% */
  .big{position:absolute;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3}
  .big .ring{position:absolute;inset:0;border-radius:50%}
  .big .cap{position:absolute;inset:11%;border-radius:50%;
    background:radial-gradient(circle at 50% 26%,#f4f7fa,#ced4da 44%,#9aa0a7 72%,#6a7076 92%,#4a4f55 100%);
    border:1px solid #2c3035;box-shadow:0 2px 6px #000b, inset 0 1px 2px #fff, inset 0 -4px 8px #0006;
    display:flex;align-items:center;justify-content:center;color:#fbfdff;font-size:9.5px;font-weight:900;
    text-shadow:0 1px 2px #000a,0 0 3px #0008,0 0 1px #0007}
  /* ATENÇÃO: sem `closest-side` o 100% do radial-gradient é a DIAGONAL (1,414 r) e o aro some. */
  .big.cue .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 79%,#ffa42a 82%,#e08a12 94%,#8c5200 99.5%,transparent 100%)}
  .big.cue.on .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 78%,#ffd48a 81%,#ffa42a 94%,#c87400 99.5%,transparent 100%);filter:drop-shadow(0 0 5px #ff9a1e)}
  .big.play .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 79%,#3fd94f 82%,#1fa838 94%,#0d6a24 99.5%,transparent 100%)}
  .big.play.on .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 78%,#8bf79a 81%,#3fd94f 94%,#149a38 99.5%,transparent 100%);filter:drop-shadow(0 0 5px #37d24a)}
  .big:active{transform:translateY(1px)}

  /* knobs */
  .knob{position:absolute;border-radius:50%;cursor:ns-resize;z-index:3;
    background:radial-gradient(circle at 50% 26%,#e9edf1,#b9bfc6 40%,#7d838a 70%,#4a4f55 100%);border:1px solid #0a0b0d;
    box-shadow:0 2px 3px #0009, inset 0 1px 0 #ffffff9c}
  .knob::after{content:"";position:absolute;left:50%;top:10%;width:9%;height:40%;background:#f2f5f8;border-radius:1px;transform:translateX(-50%);box-shadow:0 0 1px #0007}
  .knob.big{background:radial-gradient(circle at 50% 28%,#43484f,#22262b 46%,#101215 78%);border:1px solid #000;
    box-shadow:0 0 0 2px #16191d, 0 0 0 3px #2f343a, 0 3px 6px #000b, inset 0 1px 0 #ffffff26}
  .knob.big::before{content:"";position:absolute;inset:20%;border-radius:50%;
    background:radial-gradient(circle at 50% 30%,#5b6168,#2a2e33 52%,#0f1114);
    box-shadow:inset 0 2px 5px #000c, 0 0 0 2px #eef2f6, 0 0 0 3px #0b0d10}
  .knob.big::after{display:none}

  /* switch DIRECTION (3 posições) — alavanca à ESQUERDA, rótulos à direita (como na foto) */
  .sw{position:absolute;z-index:3;border-radius:4px;cursor:pointer;
    background:linear-gradient(180deg,#2a2e34,#15181c);border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff1c, inset 0 -2px 5px #000a, 0 1px 2px #000a}
  .sw .nub{position:absolute;left:8%;width:37%;height:24%;top:6%;border-radius:2px;
    background:linear-gradient(180deg,#f2f5f8,#c2c8cf 45%,#878d95);box-shadow:0 2px 3px #000b,inset 0 1px 0 #fff,inset 0 -2px 3px #0004;transition:top .08s}
  .sw.p1 .nub{top:38%}.sw.p2 .nub{top:70%}
  .sw .slit{position:absolute;left:5%;width:43%;top:6%;bottom:6%;border-radius:2px;background:#05060788;box-shadow:inset 0 0 0 1px #000,inset 0 2px 6px #000c}
  .sw .lbl{position:absolute;right:4%;width:50%;top:6%;bottom:6%;display:flex;flex-direction:column;justify-content:space-around;align-items:center;
    background:linear-gradient(160deg,#3a3f46 0 12%,#101316 12%);border-radius:2px;box-shadow:inset 0 0 0 1px #000}
  .sw .lbl i{font-style:normal;font-size:5.4px;font-weight:800;letter-spacing:.2px;color:#eaeff4;text-shadow:0 1px 1px #000;line-height:1}
  .sw .lbl i.rd{color:#e0473f}

  /* indicador VINYL/CDJ */
  .vind{position:absolute;z-index:3;cursor:pointer;border-radius:3px;
    background:linear-gradient(180deg,#16191d,#0a0c0e);border:1px solid #000;box-shadow:inset 0 0 0 1px #3a4047, inset 0 1px 2px #000a;
    min-width:0;box-sizing:border-box;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;align-items:center}
  .vind b,.vind span{font-size:7px;font-weight:900;letter-spacing:.3px;line-height:1.15}
  .vind b{color:#3aa0ff;text-shadow:0 0 6px #2f8bff}
  .vind span{color:#3f3a18}
  .vind.cdj b{color:#1c2a38;text-shadow:none}.vind.cdj span{color:#f0d000;text-shadow:0 0 6px #e6c400}

  /* botões escuros retangulares (SLIP, BEAT SYNC, BACK...) */
  .darkbtn{position:absolute;cursor:pointer;border-radius:4px;z-index:3;min-width:0;box-sizing:border-box;overflow:hidden;
    background:linear-gradient(180deg,#333940,#20252a 46%,#12151a);border:1px solid #000;
    box-shadow:inset 0 1px 0 #ffffff22, inset 0 0 0 1px #3d434b, 0 1px 2px #000a;
    display:flex;align-items:center;justify-content:center;text-align:center;color:#e2e8ef;font-size:6px;font-weight:800;line-height:1.06;letter-spacing:.1px;text-shadow:0 1px 1px #000;padding:0}
  .darkbtn:active{transform:translateY(1px)}
  .darkbtn.red{color:#ff4b40}.darkbtn.amber{color:#ffb43a}.darkbtn.blue{color:#5aa2ff}
  .darkbtn.on{background:linear-gradient(180deg,#3e454d,#242a30);filter:brightness(1.45)}
  /* SLIP / QUANTIZE: placa preta com etiqueta acesa dentro (como na foto) */
  /* ATENÇÃO: padding em % resolve contra a LARGURA do .deck e estoura o botão — use px. */
  .darkbtn.tight{font-size:5.2px;letter-spacing:-.1px}
  .darkbtn.tag{background:linear-gradient(180deg,#23272c,#101317);font-size:0;padding:1.5px}
  .darkbtn.tag.narrow::after{font-size:4.2px;letter-spacing:0}
  .darkbtn.tag::after{content:attr(data-face);width:100%;height:100%;border-radius:2px;font-size:5.2px;font-weight:900;letter-spacing:.2px;
    display:flex;align-items:center;justify-content:center;background:#3a1210;color:#ff6252;box-shadow:inset 0 0 0 1px #5a201a}
  .darkbtn.tag.red::after{background:#ee3527;color:#2a0605;box-shadow:0 0 6px #ff3b2f88}
  /* setas do BEAT JUMP (pads quadradas, não redondas) */
  .darkbtn.arrow{font-size:8px;color:#eef3f9;
    background:linear-gradient(180deg,#3a4048,#21262c 50%,#12151a)}
  /* indicadores acesos (VINYL/CDJ, MASTER, KEY SYNC) */
  .darkbtn.lit{text-shadow:0 0 5px currentColor,0 1px 1px #000}
  /* CALL / DELETE: placa com pictograma cromado (o rótulo é serigrafia, fica acima) */
  .darkbtn.plate{background:linear-gradient(180deg,#31373e,#1a1e23 55%,#0e1114);font-size:0}
  .darkbtn.plate::after{content:"";width:42%;height:58%;border-radius:2px;
    background:linear-gradient(135deg,#eef2f6 0 46%,#5a6068 46% 54%,#eef2f6 54% 100%);
    clip-path:polygon(0 0,100% 0,0 100%,100% 100%);opacity:.9}

  /* fader TEMPO — carcaça elevada; escala de traços dos DOIS lados do rasgo (medida na foto) */
  .fader{position:absolute;z-index:3;border-radius:6px;cursor:ns-resize;touch-action:none;
    background:linear-gradient(90deg,#0a0c0e 0 4%,#2a2f35 10%,#1b1f23 50%,#2a2f35 90%,#0a0c0e 96% 100%);
    border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff22, inset 0 -2px 6px #000a, 0 2px 5px #000b}
  /* traços: 2 colunas (esq/dir do rasgo), passo constante — como a régua serigrafada real */
  .fader .ticks{position:absolute;left:12%;right:12%;top:5%;bottom:5%;pointer-events:none;
    background:
      repeating-linear-gradient(180deg,#c9cfd6 0 1.5px,transparent 1.5px,transparent 3.05%);
    -webkit-mask-image:linear-gradient(90deg,#000 0 34%,transparent 34% 66%,#000 66% 100%);
            mask-image:linear-gradient(90deg,#000 0 34%,transparent 34% 66%,#000 66% 100%)}
  .fader .slot{position:absolute;left:50%;top:5%;bottom:5%;width:3px;transform:translateX(-50%);background:#000;border-radius:2px;box-shadow:inset 0 0 3px #000,0 0 0 1px #ffffff14}

/* UMA batida em AMOSTRAS DA FAIXA. NÃO depende do pitch: o fader muda a VELOCIDADE DE LEITURA,
   não a distância entre as batidas gravadas. (Estava ×(1+pitch/100): com o fader em +6% um
   "BEAT LOOP 4" saía com 3,77 batidas e o BEAT JUMP saltava 3,77 — media tempo de relógio.) */

function perf(){ return (window.performance&&performance.now)?performance.now():Date.now(); }

/* ===================== AÇÕES ===================== */
/* wantPlay = o que o DJ pediu (luz do botão). d.playing = motor ligado — só desliga quando o
   prato termina de FREAR (VINYL SPEED ADJUST). Play continua valendo no 1º clique. */
function playDeck(on){ if(!ready)return; wantPlay=on!==undefined?on:!wantPlay;
  if(wantPlay)d.playing=true; setState("play",wantPlay); if(wantPlay)markMission("play"); }
function cueDeck(){ if(!ready)return;
  if(wantPlay){ playDeck(false); d.pos=d.cuePoint; spinK=0; d.dir=0; d.playing=false; }  // back-cue: para SECO
  else { if(Math.abs(d.pos-d.cuePoint)>200)d.cuePoint=quant(d.pos); else d.pos=d.cuePoint; }
  setState("cue",true); markMission("cue"); }
/* HOT CUE: vazio grava · gravado SALTA (e toca). Apagar só com CALL/DELETE armado —
   antes o 2º toque parado em cima APAGAVA a pad sozinho, que não é o comportamento do aparelho. */
function hotcue(L){ if(!ready)return; const key="hc"+L, p=d.hotcues[L];
  if(delArm){ if(p!==undefined){ delete d.hotcues[L]; setState(key,false); } armDelete(false); return; }
  if(p===undefined){ d.hotcues[L]=quant(d.pos); setState(key,true); }
  else { slipStart(); d.pos=p; if(!wantPlay)playDeck(true); }
  markMission("hotcue"); }
function armDelete(on){ delArm=on===undefined?!delArm:!!on; setState("calldelete",delArm); }

  setState("beatloop4",d.loopOn&&Math.abs(b-4)<0.02); setState("beatloop8",d.loopOn&&Math.abs(b-8)<0.02); }

  else if(a==="loopout"){ const e=Math.min(quant(d.pos),d.len-1);
    if(d.loopIn&&e>d.loopStart){ d.loopEnd=e; d.loopOn=true; d.loopIn=false; slipStart(); loopLights(); markMission("loop"); } }
  else if(a==="reloop"){ if(d.loopEnd>d.loopStart){ d.loopOn=!d.loopOn;

function loopScale(f){ if(!ready||!d.loopOn)return; const b=beatLen();

function setLoopBeats(n){ if(!ready||!d.loopOn)return; d.loopEnd=Math.min(d.loopStart+n*beatLen(),d.len-1); loopLights(); }
function beatLoopBtn(beats){ if(!ready)return; if(d.loopOn)loopScale(beats===4?0.5:2); else autoLoop(beats); }

  for(let i=0;i<N;i++){ const b=i/N*64, f=b-Math.floor(b);          // 64 batidas em 16 compassos

let jogCtx,jogS;

function drawJog(){ if(!jogCtx)return; const ctx=jogCtx,S=jogS,c=S/2; ctx.clearRect(0,0,S,S);

  g.addColorStop(0,"#8b9197");g.addColorStop(0.30,"#6a6f75");g.addColorStop(0.52,"#4e5257");
  g.addColorStop(0.74,"#7c8288");g.addColorStop(1,"#3b3e43");
  ctx.beginPath();ctx.arc(c,c,c*0.999,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.arc(c,c,c*0.999,0,7);ctx.strokeStyle="rgba(0,0,0,0.55)";ctx.lineWidth=Math.max(1,S*0.004);ctx.stroke();
  // 2) faixa escura dos dimples (0,795 → 0,945)
  let rg=ctx.createRadialGradient(c,c*0.66,S*0.16,c,c,c*0.945);
  rg.addColorStop(0,"#34383d");rg.addColorStop(0.55,"#2c2f34");rg.addColorStop(1,"#1e2125");
  ctx.beginPath();ctx.arc(c,c,c*0.945,0,7);ctx.fillStyle=rg;ctx.fill();
  // 3) 30 dimples grandes + micro-furos entre eles (contados na foto)
  const R=c*0.868, dr=S*0.0322, ND=30;
  for(let i=0;i<ND;i++){ const a=i/ND*Math.PI*2-Math.PI/2, x=c+Math.cos(a)*R, y=c+Math.sin(a)*R;
    let dg=ctx.createRadialGradient(x,y-dr*0.5,dr*0.06,x,y+dr*0.3,dr*1.05);
    dg.addColorStop(0,"#181b1e");dg.addColorStop(0.45,"#22262a");dg.addColorStop(0.86,"#31353b");dg.addColorStop(1,"#3b4046");
    ctx.beginPath();ctx.arc(x,y,dr,0,7);ctx.fillStyle=dg;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,dr,0.10*Math.PI,0.90*Math.PI);ctx.strokeStyle="rgba(255,255,255,0.10)";ctx.lineWidth=Math.max(1,S*0.0018);ctx.stroke();

  ring("SYNC",135, keyOn? "#7fc0ff":"#98a1ac");  ring("MASTER",45, masterOn? "#ffbe57":"#5a4a2a");

/* ---- motor do prato: parte e FREIA no tempo do VINYL SPEED ADJUST (TOUCH ↔ BRAKE) ----

function tick(){ if(!ready)return; const now=perf(); if(!lastT)lastT=now;

  bindKnob(hitEls.vinylspeed, els.vinylspeed, ()=>vinylBrake, v=>vinylBrake=v);
  bindKnob(hitEls.rotary, els.rotary, ()=>rotaryVal, v=>rotaryVal=v);

  // HOT CUE pads coloridas (pele + hit + ensino)
  HC.forEach(([L,col])=>{ const a="hc"+L; const el=div("hc"); el.style.color=col;
    el.innerHTML=`<div class="lt" style="color:${col}">${L}</div><div class="ul" style="background:${col}"></div>`;
    let [x,y,w,h]=POS[a]; pct(el,x,y,w,h); deck.appendChild(el); els[a]=el;
    const c={act:a,k:"HOT CUE "+L,d:`Ponto quente <b>${L}</b>. Vazio: <b>grava</b> o ponto atual (acende ${L==='A'?'vermelho':'a cor'}). Gravado: <b>salta</b> para ele e toca. Para apagar, aperte <b>CALL/DELETE</b> (fica aceso) e depois a pad. São 8 hot cues coloridos.`};
    const hit=document.createElement("div"); hit.className="hit"; pct(hit,x,y,w,h); hit.dataset.act=a; deck.appendChild(hit); hitEls[a]=hit;
    hit.addEventListener("mouseenter",()=>teach(c)); hit.addEventListener("pointerdown",e=>onControl(c,e));
    hit.addEventListener("pointerup",()=>{ if(ready&&d.slipping)slipEnd(); }); });   // SLIP: solta a pad e a faixa volta

  // JOG
  let [jx,jy,jw,jh]=POS.jog; { const nh=jw*AR; jy=jy+jh/2-nh/2; jh=nh; }
  const jcv=document.createElement("canvas"); jcv.className="jogc"; jcv.width=440; jcv.height=440;
  pct(jcv,jx,jy,jw,jh); deck.appendChild(jcv); jogCtx=jcv.getContext("2d"); jogS=jcv.width;
  const jhit=document.createElement("div"); jhit.className="joghit"; pct(jhit,jx,jy,jw,jh); deck.appendChild(jhit);
  jhit.addEventListener("mouseenter",()=>teach(CTRL_JOG)); bindJog(jhit);

  // TEMPO fader — na foto o "−" fica em CIMA e o "+" EMBAIXO (empurrar p/ frente acelera).
  // Régua pontilhada + LED verde do 0 ficam FORA da carcaça, à esquerda (medidos na foto).
  const tp=POS.tempo;
  deco("tdots",[87.28,71.30,0.32,22.70]);
  const led=deco("tdots",[85.34,81.95,1.42,0.55]);
  led.style.background="#7ed321"; led.style.borderRadius="1px"; led.style.boxShadow="0 0 5px #7ed32188"; led.style.zIndex="3";
  addLab("−",86.90,70.45,"sm"); addLab("0",86.95,81.55,"sm"); addLab("+",87.05,93.85,"sm");
  addLab("TEMPO",89.9,96.08,"sm");
  const t=div("fader"); t.innerHTML='<div class="ticks"></div><div class="slot"></div><div class="zero"></div><div class="cap" id="tcap"></div>';
  pct(t,tp[0],tp[1],tp[2],tp[3]); deck.appendChild(t); els.tempo=t; placeTempoCap(0.5);
  const thit=document.createElement("div"); thit.className="hit"; pct(thit,tp[0]-1,tp[1],tp[2]+2,tp[3]); thit.dataset.act="tempo"; deck.appendChild(thit);
  const cT=CTRL.find(x=>x.act==="tempo"); thit.addEventListener("mouseenter",()=>teach(cT)); bindTempo(thit);

  renderMission();
}
function div(cls){ const e=document.createElement("div"); e.className=cls; return e; }

/* ===================== INTERAÇÃO ===================== */
function onControl(c,e){ teach(c);
  if(!started){ startAudio().then(()=>{ if(c.act==="play")playDeck(); }); return; }
  if(!ready)return; const a=c.act; flash(els[a]);
  if(a==="play")playDeck();
  else if(a==="cue")cueDeck();
  else if(a[0]==="h"&&a[1]==="c")hotcue(a.slice(2));
  else if(a==="incue")loopAct("loopin");
  else if(a==="out")loopAct("loopout");
  else if(a==="reloop")loopAct("reloop");
  else if(a==="beatloop4")beatLoopBtn(4);      // com loop ativo vira 1/2X
  else if(a==="beatloop8")beatLoopBtn(8);      // com loop ativo vira 2X
  else if(a==="beatjumpL")beatJump(-1);
  else if(a==="beatjumpR")beatJump(1);
  else if(a==="tracksearchL"||a==="tracksearchR"){ d.pos=0; d.cuePoint=0; }
  else if(a==="searchL"||a==="searchR"){ d.pos=clamp(d.pos+(a==="searchR"?1:-1)*beatLen()*2,0,d.len-1); }
  else if(a==="direction"){ dirState=(dirState+1)%3; els.direction.className="sw p"+dirState; }
  else if(a==="mastertempo"){ mt=!mt; setState("mastertempo",mt); }
  else if(a==="temporange"){ range=range===6?10:range===10?16:range===16?100:6; applyTempo(); }  // o fader não se move: o PITCH é que muda
  else if(a==="jogmode"){ vinylMode=!vinylMode; els.vinylcdj.classList.toggle("cdj",!vinylMode); }
  else if(a==="temporeset"){ placeTempoCap(0.5); applyTempo(); }
  else if(a==="usbstop"){ playDeck(false); spinK=0; d.playing=false; d.pos=0; d.cuePoint=0; }
  else if(a==="timemode"){ timeRemain=!timeRemain; }
  else if(a==="memory"){ const p=d.cuePoint; if(!d.memList.includes(p)){ d.memList.push(p); d.memList.sort((x,y)=>x-y); } }
  else if(a==="callL"||a==="callR"){ if(d.memList.length){ d.memIdx=(d.memIdx+(a==="callR"?1:-1)+d.memList.length)%d.memList.length; d.pos=d.cuePoint=d.memList[d.memIdx]; } }
  else if(a==="deletebt"){ if(d.memIdx>=0){ d.memList.splice(d.memIdx,1); d.memIdx=Math.min(d.memIdx,d.memList.length-1); } }
  else if(a==="quantize"){ qz=!qz; els.quantize.classList.toggle("red",qz); }
  else if(a==="slip"){ slipOn=!slipOn; els.slip.classList.toggle("red",slipOn); if(!slipOn)d.slipping=false; }
  else if(a==="calldelete"){ armDelete(); }                 // arma o APAGAR: a próxima pad de hot cue é apagada
  else if(a==="beatsync"){ syncToMaster(); }
  else if(a==="mastersync"){ masterOn=!masterOn; setState("mastersync",masterOn); }
  else if(a==="keysync"){ keyOn=!keyOn; setState("keysync",keyOn); }
  else if(a==="display"){ onDisplay(e); }
  // source/browse/menu/back/tagtrack/trackfilter/shortcut/power/vinylcdj: informativos
  // (rotary, jogadjust e vinylspeed são knobs — arraste, ver bindKnob)
}

/* a TELA é touch: as 3 abas do topo direito escolhem e trocam o valor (como no aparelho). */
function onDisplay(e){ if(!ready||!e||!els.display)return; const r=els.display.getBoundingClientRect();
  if(!r.width)return; const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
  if(fy>=0&&fy<0.16&&fx>0.685){ tab = fx<0.785?0 : fx<0.885?1 : 2;
    if(tab===0){ loopBeats=loopBeats>=32?1:loopBeats*2; setLoopBeats(loopBeats); }
    else if(tab===2){ jumpBeats=jumpBeats>=32?1:jumpBeats*2; } }
  else if(fx<0.12&&fy>0.79&&fy<0.87){ qz=!qz; els.quantize.classList.toggle("red",qz); }   // caixa QUANTIZE
}

function bindJog(el){ let active=false,last=0;
  const rect=()=>el.getBoundingClientRect();
  const ang=e=>{ const r=rect(); return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2)); };
  const dist=e=>{ const r=rect(); return Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))/(r.width/2); };
  /* o PRATO preto vai até 0,705 do raio (medido no desenho do jog): tocar nele é SCRATCH.
     de 0,705 até a borda é o aro de metal = pitch bend. Estava 0,42: metade do prato,
     que é área sensível no aparelho real, respondia como aro. */
  const begin=e=>{ if(!ready)return; active=true; last=ang(e);
    if(vinylMode && dist(e)<=0.705){ d.touching=true; d.targetPos=d.pos; slipStart(); } };
  el.addEventListener("pointerdown",e=>{ if(!started){ startAudio().then(()=>begin(e)); } else begin(e);
    try{el.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
  el.addEventListener("pointermove",e=>{ if(!active||!ready)return; const a=ang(e); let da=a-last; if(da>Math.PI)da-=2*Math.PI; if(da<-Math.PI)da+=2*Math.PI; last=a;
    const w=1.4-0.8*jogWeight;      // JOG ADJUST: LIGHT (leve) anda mais, HEAVY anda menos
    if(d.touching){ d.targetPos=clamp(d.targetPos+da/(2*Math.PI)*d.buffer.sampleRate*0.5*w,0,d.len-1); markMission("scratch"); }
    else { d.pos=clamp(d.pos+da/(2*Math.PI)*d.buffer.sampleRate*0.05*w,0,d.len-1); } });
  const up=()=>{ active=false; if(d&&d.touching){ d.touching=false; slipEnd(); } };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
}
/* knobs de verdade: arrastar na vertical GIRA o botão e mexe no parâmetro. */
function bindKnob(hit,el,get,set){ if(!hit)return; let drag=false,y0=0,v0=0;
  const draw=v=>{ if(el)el.style.transform="rotate("+(-135+v*270).toFixed(1)+"deg)"; };
  draw(get());
  hit.addEventListener("pointerdown",e=>{ drag=true; y0=e.clientY; v0=get(); try{hit.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
  hit.addEventListener("pointermove",e=>{ if(!drag)return; const v=clamp(v0-(e.clientY-y0)/120,0,1); set(v); draw(v); });
  const up=()=>{drag=false;}; hit.addEventListener("pointerup",up); hit.addEventListener("pointercancel",up);
}
let tempoPos=0.5;
function placeTempoCap(p){ tempoPos=p; const cap=$("#tcap"); if(cap)cap.style.top=(10+p*80)+"%"; }
/* o pitch SEMPRE sai da posição do fader × o ±RANGE atual — inclusive quando só o RANGE muda. */
function applyTempo(){ if(!ready)return; d.pitch=(tempoPos-0.5)*2*range; markMission("tempo"); }
/* p=0 é o TOPO do fader. Na foto o topo é "−" e a base é "+": para cima DESACELERA. */
function bindTempo(el){ let drag=false;
  const mv=e=>{ if(!ready)return; const r=el.getBoundingClientRect(); if(!r.height)return;
    let p=clamp((e.clientY-r.top-r.height*0.10)/(r.height*0.80),0,1);
    if(Math.abs(p-0.5)<0.02)p=0.5;                    // trava central do fader: 0,00 % dá pra achar
    placeTempoCap(p); applyTempo(); };
  el.addEventListener("pointerdown",e=>{ drag=true; try{el.setPointerCapture(e.pointerId);}catch(_){}
    if(!started){ startAudio().then(()=>mv(e)); } else mv(e); e.preventDefault(); });   // pega já no 1º toque
  el.addEventListener("pointermove",e=>{ if(drag)mv(e); });
  el.addEventListener("pointerup",()=>drag=false); el.addEventListener("pointercancel",()=>drag=false);
}

/* O aparelho tem que DESENHAR ANTES de ligar o áudio: build() e frame() na mesma linha. */
function init(){ build(); frame();
  $("#btnStart").addEventListener("pointerdown",()=>startAudio());
  $("#btnReset").addEventListener("pointerdown",()=>location.reload());
  const fit=()=>{ const w=$(".wrap"); const s=Math.max(0.1,Math.min((window.innerWidth-6)/w.offsetWidth,(window.innerHeight-6)/w.offsetHeight,1)); $("#stage").style.transform="scale("+s+")"; };
  window.addEventListener("resize",fit); fit();
}
init();

/*BANCO-SMU-v2*/
/* BANCO SMU — faixas liberadas da SMU tocando no motor completo deste aparelho.
   ⛔ Em producao BASE tem de ser URL ABSOLUTA com CORS "*": o sim roda em
   <iframe srcDoc sandbox> sem allow-same-origin e sem <base>, entao caminho
   relativo resolve contra a URL da AULA (404) e o fetch vai com Origin: null. */
(function(){
  /* URL ABSOLUTA com CORS "*" — obrigatorio. O sim roda em iframe srcDoc de
     origem opaca: caminho relativo dava 404 e o fetch sai com Origin: null.
     Conferido em 29/07/2026: devolve 206 + audio/mpeg + Access-Control-Allow-Origin: *
     mesmo com Origin: null, nas 13 faixas. NAO voltar para caminho relativo. */
  var BASE = "https://pshynylvvkhhohftouoe.supabase.co/storage/v1/object/public/musicas-dj/";
  var FAIXAS = [
    { arquivo:"sotex-1.mp3",  nome:"SOTEX 01", bpm:98.4  },
    { arquivo:"sotex-2.mp3",  nome:"SOTEX 02", bpm:144.6 },
    { arquivo:"sotex-3.mp3",  nome:"SOTEX 03", bpm:146.4 },
    { arquivo:"sotex-4.mp3",  nome:"SOTEX 04", bpm:95.3  },
    { arquivo:"sotex-5.mp3",  nome:"SOTEX 05", bpm:133.4 },
    { arquivo:"sotex-6.mp3",  nome:"SOTEX 06", bpm:113.3 },
    { arquivo:"sotex-7.mp3",  nome:"SOTEX 07", bpm:117.7 },
    { arquivo:"sotex-8.mp3",  nome:"SOTEX 08", bpm:117.7 },
    { arquivo:"sotex-9.mp3",  nome:"SOTEX 09", bpm:160.2 },
    { arquivo:"sotex-10.mp3", nome:"SOTEX 10", bpm:160.2 },
    { arquivo:"sotex-11.mp3", nome:"SOTEX 11", bpm:89.6  },
    { arquivo:"sotex-12.mp3", nome:"SOTEX 12", bpm:139.6 },
    { arquivo:"sotex-13.mp3", nome:"SOTEX 13", bpm:122.5 }
  ];
  window.BANCO_SMU = { base:BASE, faixas:FAIXAS, escolhida:null, cache:{} };

  /* Envolve renderTrack: escolheu faixa -> MP3 real; senao -> faixa sintetizada.
     O deck recebe um AudioBuffer nos dois casos e nao percebe diferenca. */
  if (typeof renderTrack === "function") {
    var _orig = renderTrack;
    renderTrack = async function(){
      var esc = window.BANCO_SMU.escolhida;
      if (!esc) return await _orig.apply(this, arguments);
      try {
        if (window.BANCO_SMU.cache[esc.arquivo]) {
          window.__BANCO_BPM = esc.bpm;
          return window.BANCO_SMU.cache[esc.arquivo];
        }
        var r = await fetch(window.BANCO_SMU.base + esc.arquivo);
        if (!r.ok) throw new Error("HTTP " + r.status);
        var buf = await AC.decodeAudioData(await r.arrayBuffer());
        window.BANCO_SMU.cache[esc.arquivo] = buf;
        window.__BANCO_BPM = esc.bpm;
        return buf;
      } catch(e) {
        console.warn("Banco SMU falhou, usando faixa de treino:", e);
        window.__BANCO_BPM = null;
        return await _orig.apply(this, arguments);
      }
    };
  }

  /* A barra e position:fixed, entao ela se prende a viewport do IFRAME em que
     o sim roda. Em uso normal isso e a tela do simulador (ok). Mas quando o sim
     e EMBUTIDO dentro de outra aula (iframe dentro de iframe), a viewport vira
     do tamanho do aparelho na bancada e a barra cobriria o painel.

     ⛔ NAO usar "window.self !== window.top" p/ detectar isso: em uso NORMAL o
     sim JA roda dentro de um iframe (srcDoc do animation-player), entao essa
     condicao e sempre verdadeira e some com a barra em todo lugar.
     O que distingue e a PROFUNDIDADE: aninhado 2+ niveis -> parent != top. */
  function embutido(){
    if (window.__SMU_EMBUTIDO) return true;              // bandeira explicita
    try { return window.parent !== window.top; } catch(e) { return false; }
  }
  window.BANCO_SMU.mostrarBarra = function(v){           // controle manual
    var b = document.getElementById("bancoSmuBar");
    if (b) b.style.display = v ? "flex" : "none";
  };

  /* Barra flutuante: nao depende do layout do aparelho (cada sim tem o seu). */
  function montar(){
    if (embutido()) return;                              // quem embute controla a UI
    if (document.getElementById("bancoSmuBar")) return;
    var bar = document.createElement("div");
    bar.id = "bancoSmuBar";
    bar.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:9999;display:flex;gap:6px;"+
      "align-items:center;background:#0d1117ee;border:1px solid #1d5638;border-radius:9px;"+
      "padding:6px 9px;font:11px/1.3 Inter,system-ui,sans-serif;color:#b7f5cf;"+
      "box-shadow:0 6px 24px #000a;backdrop-filter:blur(4px)";
    var lbl = document.createElement("span");
    lbl.textContent = "🎵 BANCO SMU";
    lbl.style.cssText = "font-weight:800;letter-spacing:.5px";
    var sel = document.createElement("select");
    sel.style.cssText = "font:inherit;background:#10241a;color:#dff7e9;border:1px solid #1d5638;"+
      "border-radius:6px;padding:3px 6px;max-width:190px";
    var op0 = document.createElement("option");
    op0.value = ""; op0.textContent = "faixa de treino (padrão)";
    sel.appendChild(op0);
    FAIXAS.forEach(function(f,i){
      var o = document.createElement("option");
      o.value = String(i); o.textContent = f.nome + " · " + f.bpm + " BPM";
      sel.appendChild(o);
    });
    var msg = document.createElement("span");
    msg.style.cssText = "color:#7fa08d";
    sel.addEventListener("change", function(){
      window.BANCO_SMU.escolhida = sel.value === "" ? null : FAIXAS[+sel.value];
      msg.textContent = sel.value === ""
        ? "recarregue p/ voltar à faixa de treino"
        : "recarregue o áudio p/ tocar esta faixa";
    });
    bar.appendChild(lbl); bar.appendChild(sel); bar.appendChild(msg);
    document.body.appendChild(bar);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", montar);
  else montar();
})();
