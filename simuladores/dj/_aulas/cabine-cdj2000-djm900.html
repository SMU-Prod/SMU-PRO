<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Monte a sua cabine (SMU)</title>
<style>
/* ============================================================================
   MOLDURA DAS DUAS AULAS DA CABINE

   REGRA DE OURO DESTE ARQUIVO (ordem do dono, 29/07/2026):
   "na barra superior, ponha janelas que abrindo tem as informacoes, mas algo
    que nao ocupe a tela. Deixa a maior parte da tela para as CDJs e mixers."

   Por isso:
   - NAO existe coluna lateral, nem fita de passos, nem paragrafo embaixo da
     mesa. Tudo isso virou POPOVER ancorado num botao da barra.
   - O #palco recebe TODA a altura que sobra (flex:1) e os aparelhos moram nele.
   - O popover e position:ABSOLUTE. Nunca fixed: a aula roda dentro de iframe,
     e fixed em iframe se ancora no iframe, nao na tela do aluno.
   - Nada de escalar a pagina inteira com transform (era o que fazia tudo virar
     miniatura). Quem escala e SO o simulador, dentro da propria moldura dele.
   ============================================================================ */
  :root{
    --ink:#e9eef7; --amber:#ffae1a; --green:#39d271; --blue:#37a2ff; --red:#ff4636;
    --line:#2a2f37; --painel:#0c0e12; --barra:46px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:radial-gradient(1100px 640px at 50% -10%,#26292e,#0a0b0d 62%),#08090b;
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    user-select:none;
  }
  #app{display:flex;flex-direction:column;height:100%;width:100%}

  /* ---------------- BARRA SUPERIOR (compacta) ---------------- */
  #barra{
    flex:0 0 auto;position:relative;z-index:60;
    display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
    min-height:var(--barra);padding:4px 8px;
    background:linear-gradient(180deg,#20232a,#14161a);
    border-bottom:1px solid #05070a;
  }
  .marca{display:flex;align-items:baseline;gap:5px;flex:0 0 auto}
  .marca b{font-size:14px;letter-spacing:1px}
  .marca .m{font-size:8px;letter-spacing:1.5px;color:#8a94a4;text-transform:uppercase;white-space:nowrap}
  #passos{display:flex;gap:4px;flex:0 0 auto;margin-left:4px}
  .pa{
    font:inherit;font-size:9.5px;font-weight:800;letter-spacing:.3px;
    border:1px solid #1c2229;background:#11151a;color:#8b97a9;
    border-radius:14px;padding:5px 9px;cursor:pointer;white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .pa.on{background:#151d2a;border-color:var(--blue);color:#cfe6ff}
  .pa.ok{background:#0f2418;border-color:#1e5c38;color:#9fe3bb}
  .pa:disabled{opacity:.35;cursor:not-allowed}
  .vazio{flex:1 1 auto;min-width:4px}

  .btn{
    font:inherit;font-size:10px;font-weight:800;letter-spacing:.3px;
    border:1px solid #262c34;border-radius:8px;padding:7px 10px;cursor:pointer;
    color:#cbd4e0;background:linear-gradient(180deg,#1c2026,#12151a);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:#37414d}
  .btn.on{border-color:var(--blue);color:#cfe6ff;background:#152232}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn .sel{font-size:9px;font-weight:900;border-radius:9px;padding:1px 6px;background:#3a2a10;color:#ffc98a}
  .btn .sel.zero{background:#123a2a;color:#7df0a8}
  .ponto{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 7px #ff463699}
  .ponto.ok{background:var(--green);box-shadow:0 0 7px #39d27199}

  /* ---------------- POPOVER (absolute, nunca fixed) ---------------- */
  .pop{
    display:none;position:absolute;top:calc(100% + 4px);right:6px;z-index:70;
    width:min(430px,calc(100vw - 16px));max-height:min(70vh,520px);overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:#0d1015;border:1px solid #2b323b;border-radius:11px;
    box-shadow:0 18px 44px #000c,0 0 0 1px #ffffff08 inset;padding:11px 12px;
  }
  .pop.on{display:block}
  .pop h4{margin:0 0 8px;font-size:10px;letter-spacing:1.3px;color:#8b97a9;text-transform:uppercase;font-weight:800}
  .pop p{margin:0 0 9px;font-size:11.5px;line-height:1.5;color:#c2cbd6}
  .pop b{color:#fff}
  .pop code{background:#161a20;border-radius:3px;padding:0 3px;font-size:11px}

  .chk{display:flex;gap:7px;align-items:flex-start;padding:7px 8px;border-radius:8px;margin-bottom:5px;
    background:#11151a;border:1px solid #1c2229}
  .chk.ok{background:#0f2418;border-color:#1e5c38}
  .chk .b{width:15px;height:15px;border-radius:50%;flex:0 0 auto;margin-top:1px;background:#2a3038;border:1px solid #000;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#6b7684}
  .chk.ok .b{background:var(--green);color:#062a13}
  .chk .tx{font-size:11px;line-height:1.35;color:#c2cbd6}
  .chk.ok .tx{color:#9fe3bb}
  .chk .tx b{color:#fff}
  .som{margin:2px 0 9px;padding:9px;border-radius:8px;text-align:center;font-size:11.5px;font-weight:800;
    background:#2a1414;border:1px solid #52201c;color:#ff9c90}
  .som.on{background:#0f2a18;border-color:#1e6b3c;color:#7df0a8}
  .elo{margin:0 0 9px;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.45;
    background:#1b1410;border:1px solid #4a3418;color:#ffd9a6}
  .elo b{color:#fff}
  .est{font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;background:#4a2a12;color:#ffc98a;white-space:nowrap}

  /* ---------------- PALCO: os aparelhos ficam com a tela ---------------- */
  #palco{flex:1 1 auto;min-height:0;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px}

  /* -------- passo 1: escolha -------- */
  .razao{font-size:11px;line-height:1.45;color:#9fb0c4;margin:0 2px 8px;padding:7px 9px;border-radius:7px;
    background:#0e1a26;border:1px solid #1d3350}
  .razao b{color:#fff}
  .escolha{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
  .col .lb{font-size:9px;color:#7f8b9c;margin-bottom:5px;letter-spacing:.6px;font-weight:800}
  .opt{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #23282f;border-radius:8px;
    background:linear-gradient(180deg,#171a1f,#101317);cursor:pointer;margin-bottom:5px;
    min-height:42px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
  .opt .ic{width:30px;height:20px;border-radius:3px;flex:0 0 auto;border:1px solid #000;
    background:linear-gradient(180deg,#3b4148,#191c20)}
  .opt.vinil .ic{background:radial-gradient(circle at 50% 50%,#5a6068 16%,#0f1114 18%,#1a1d21 70%)}
  .opt .nm{font-size:11px;font-weight:700;line-height:1.15}
  .opt .tp{font-size:8.5px;color:#7f8b9c}
  .opt .tag{margin-left:auto;font-size:8px;font-weight:900;padding:2px 5px;border-radius:4px;white-space:nowrap}
  .tag.line{background:#123a5c;color:#8fd0ff}
  .tag.phono{background:#4a2a12;color:#ffc98a}
  .tag.aio{background:#123a2a;color:#7df0a8}
  .aio-bloco{margin-top:10px;border-top:1px dashed #232a32;padding-top:9px}
  .aio-bloco .lb{font-size:9px;color:#7f8b9c;margin-bottom:6px;letter-spacing:.6px;font-weight:800}

  /* -------- passo 2 (praticando): A MESA --------
     Cada aparelho ocupa a LARGURA TODA e nunca e cortado: a altura da moldura
     sai do tamanho natural que o proprio simulador informa, entao o fit() dele
     cabe exato. Se os tres nao couberem na altura, todos encolhem juntos —
     encolhe, nao recorta. */
  .mesa{display:flex;gap:6px;align-items:flex-start;justify-content:center;min-height:100%}
  .mesa.coluna{flex-direction:column;align-items:center}
  .mesa.linha{flex-direction:row;align-items:flex-start}
  .apl{display:flex;flex-direction:column;background:#08090b;border:1px solid #1b2027;border-radius:9px;
    overflow:hidden;flex:0 0 auto;max-width:100%}
  .apl .cab{display:flex;align-items:center;gap:7px;padding:4px 7px;background:#12161b;border-bottom:1px solid #1b2027;flex:0 0 auto}
  .apl .cab .nm{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .apl .cab .ch{font-size:9px;font-weight:900;letter-spacing:.5px;padding:2px 6px;border-radius:4px;
    background:#10304a;color:#7fd4ff;border:1px solid #1c4e73;white-space:nowrap}
  .apl .cab .ch.mix{background:#2b1f3a;color:#d3b6ff;border-color:#4b3670}
  .apl .cab .esq{margin-left:auto;display:flex;gap:5px}
  /* --- o caminho do som, à vista --- */
  #rota{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px;
        background:#0e1216;border-bottom:1px solid #1b2027;font-size:10px;line-height:1.35}
  #rota .via{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;
             background:#141a20;border:1px solid #222a33;white-space:nowrap}
  #rota .via.off{opacity:.45}
  #rota .via b{font-weight:900;letter-spacing:.4px}
  #rota .ch1 b{color:#8fd6ff} #rota .ch2 b{color:#ffc98a} #rota .mst b{color:#d3b6ff}
  #rota .db{font-variant-numeric:tabular-nums;color:#cfe6ff;font-weight:800}
  #rota .det{color:#7d8b99}
  #rota .seta{color:#4d5a68;font-weight:900}
  #rota .barra{width:46px;height:5px;border-radius:3px;background:#1d242c;overflow:hidden}
  #rota .barra i{display:block;height:100%;background:linear-gradient(90deg,#2f7d4f,#8fd66a)}
  #rota .barra.q i{background:linear-gradient(90deg,#8a6d2a,#ffcf5a)}
  /* A MOLDURA e so a janela. Quem encolhe e o IFRAME INTEIRO, por transform:
     medida em px (fonte, borda, padding) nao escala sozinha — escalar o
     contexto todo resolve tudo junto e nunca encavala. */
  .moldura{position:relative;background:#08090b;overflow:hidden;width:100%}
  .moldura iframe{display:block;border:0;background:#08090b;position:absolute;left:50%;top:0;
    transform-origin:top center}
  /* aparelho ampliado: cobre o palco inteiro. Nao e fixed — e absolute no palco. */
  .apl.ampliado{position:absolute;left:6px;right:6px;top:6px;bottom:6px;z-index:40;border-color:var(--blue);
    width:auto !important;max-width:none}
  .apl.ampliado .moldura{flex:1 1 auto}
  .mesa.temAmpliado{display:block;min-height:0}
  .mesa.temAmpliado .apl:not(.ampliado){display:none}
  html.ampliado #barra{min-height:32px;padding:2px 6px}
  html.ampliado .marca,html.ampliado #passos{display:none}

  /* -------- passo 2 (cabeamento): AS TRASEIRAS -------- */
  .cabos-topo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .cabo-b{font:inherit;font-size:10px;font-weight:900;letter-spacing:.4px;border-radius:8px;padding:8px 12px;cursor:pointer;
    border:1px solid #2a3038;color:#c2cbd6;background:linear-gradient(180deg,#171a1f,#101317);
    min-height:38px;touch-action:manipulation}
  .cabo-b.on{border-color:var(--amber);color:#ffd79a;background:#2a1f0d;box-shadow:0 0 0 1px var(--amber) inset}
  .cabo-b .pt{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .pt.ac{background:#e0a33a} .pt.rca{background:#e05a4a} .pt.link{background:#4ab0e0}
  .instr{font-size:10.5px;line-height:1.4;color:#9fb0c4;margin-left:2px}
  .instr b{color:#fff}

  .bancada{position:relative;display:flex;flex-direction:column;gap:9px}
  .painel{position:relative;border-radius:7px;border:1px solid #05070a;
    background:linear-gradient(180deg,#2c3037,#181b20 55%,#0f1216);
    box-shadow:0 5px 14px #000a, inset 0 1px 0 #ffffff14;width:100%}
  .painel .tit{position:absolute;top:-13px;left:3px;font-size:9px;font-weight:800;color:#9aa4b1;letter-spacing:.4px;white-space:nowrap}
  .painel .fonte{position:absolute;top:-13px;right:3px;font-size:8px;color:#6b7684;white-space:nowrap}
  .painel .grade{position:absolute;left:0;right:0;top:8%;height:22%;
    background:repeating-linear-gradient(90deg,#0b0e11 0 2px,#191d22 2px 5px);opacity:.5;pointer-events:none}
  .con{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-width:16px;min-height:16px}
  .con .pino{border-radius:3px;border:1.5px solid #6b7684;background:linear-gradient(180deg,#2b2f35,#0f1215);
    width:100%;height:100%;min-width:14px;min-height:12px}
  .con .sig{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;
    font-size:6.5px;font-weight:800;color:#94a0ae;letter-spacing:.2px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}
  .con.clicavel{cursor:pointer;touch-action:manipulation}
  .con.clicavel::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(100%,30px);height:max(100%,30px)}                 /* alvo de dedo */
  .con.clicavel:hover .pino{box-shadow:0 0 0 2px #fff6}
  .con.sel .pino{box-shadow:0 0 0 3px var(--amber),0 0 12px var(--amber)}
  .con.ok .pino{border-color:var(--green);background:linear-gradient(180deg,#14351f,#0b1d12)}
  .con.rca .pino{border-radius:50%;background:radial-gradient(circle at 50% 32%,#d8dde3,#8f959c 58%,#43484e)}
  .con.rca.entrada .pino{border-color:#b03a2e}
  .con.link .pino{border-radius:2px;background:linear-gradient(180deg,#1a1e23,#0a0c0f);border-color:#4ab0e0}
  .con.gnd .pino{border-radius:50%;background:radial-gradient(circle at 50% 32%,#c9a227,#6b5510);border-color:#3a2f08}
  .con.morto .pino{opacity:.45;border-color:#3a4048}
  .con.canal .sig{color:#ffc98a}

  svg.fios{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}

  .regua{position:relative;display:flex;align-items:center;gap:12px;padding:0 12px;height:46px;border-radius:7px;
    background:linear-gradient(180deg,#23272d,#131619);border:1px solid #05070a;
    box-shadow:inset 0 1px 0 #ffffff12,0 4px 10px #0009}
  .regua .rt{font-size:8.5px;font-weight:900;color:#8a94a4;letter-spacing:1px;white-space:nowrap}
  .tom{width:30px;height:26px;border-radius:3px;cursor:pointer;position:relative;flex:0 0 auto;
    background:linear-gradient(180deg,#101317,#0a0c0f);border:1.5px solid #4a5058;touch-action:manipulation}
  .tom::before,.tom::after{content:"";position:absolute;top:7px;width:3px;height:9px;background:#4a5058;border-radius:1px}
  .tom::before{left:8px} .tom::after{right:8px}
  .tom.ok{border-color:var(--green)} .tom.ok::before,.tom.ok::after{background:var(--green)}
  .tom.sel{box-shadow:0 0 0 3px var(--amber)}
  .chaveac{margin-left:auto;font:inherit;font-size:9px;font-weight:900;padding:7px 11px;border-radius:6px;cursor:pointer;
    background:#3a1a16;border:1px solid #6b241c;color:#ff9c90;letter-spacing:.5px;touch-action:manipulation}
  .chaveac.on{background:#14351f;border-color:#1e6b3c;color:#7df0a8}
  .fonte12{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;
    background:linear-gradient(180deg,#20242a,#111417);border:1px solid #05070a}
  .fonte12 .ft{font-size:8.5px;font-weight:900;color:#8a94a4;letter-spacing:.6px;white-space:nowrap}
  .switch{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:7px;
    background:linear-gradient(180deg,#1d2128,#0f1216);border:1px solid #05070a}
  .switch .st{font-size:8.5px;font-weight:900;color:#7fd4ff;letter-spacing:.6px;white-space:nowrap}

  .semdado{padding:14px;border-radius:8px;background:#1b1410;border:1px solid #4a3418;color:#ffd9a6;
    font-size:11.5px;line-height:1.5}
  .semdado b{color:#fff}

  /* -------- MUSICAS -------- */
  .faixa{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;margin-bottom:4px;
    background:#11151a;border:1px solid #1c2229;font-size:11px}
  .faixa .fn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .faixa .fb{font:inherit;font-size:9px;font-weight:900;border:1px solid #2a3038;border-radius:6px;padding:5px 8px;
    cursor:pointer;color:#aab4c2;background:linear-gradient(180deg,#171a1f,#101317);touch-action:manipulation}
  .faixa .fb.on{border-color:var(--green);color:#7df0a8;background:#0f2418}

  /* alvo de dedo maior no toque */
  @media (pointer:coarse){
    .btn,.pa{min-height:38px}
    .cabo-b{min-height:44px}
    .opt{min-height:50px}
  }
  /* retrato de iPad: a barra nao pode comer altura — quebra em duas linhas curtas */
  @media (max-width:820px){
    .marca .m{display:none}
    #barra{gap:4px;padding:3px 5px}
    .btn{padding:7px 8px;font-size:9.5px}
  }

  /* CONTRATO DE TELA CHEIA (html.smu-fs) — o player da aula avisa, o simulador
     responde SO com CSS. Em tela cheia a barra encolhe e o palco cresce. */
  html.smu-fs #barra{min-height:38px;padding:3px 8px}
  html.smu-fs #palco{padding:4px}
  html.smu-fs .pop{max-height:min(78vh,640px)}
</style>
</head>
<body>
<div id="app">

  <header id="barra">
    <div class="marca"><b>SMU</b><span class="m" id="sub">PRO • CABINE</span></div>
    <div id="passos"></div>
    <span class="vazio"></span>

    <button class="btn" id="bFalta" data-pop="falta">
      <span class="ponto" id="pontoSom"></span>O QUE FALTA <span class="sel" id="selFalta">0</span>
    </button>
    <button class="btn" id="bComo" data-pop="como">COMO FUNCIONA</button>
    <button class="btn" id="bMus" data-pop="mus">MÚSICAS</button>
    <button class="btn" id="btnAmpliar">AMPLIAR</button>
    <button class="btn" id="btnReset">RECOMEÇAR</button>

    <div class="pop" id="pop-falta">
      <h4>O que falta</h4>
      <div class="som" id="som">SEM SOM</div>
      <div id="elo"></div>
      <div id="lista"></div>
    </div>
    <div class="pop" id="pop-como"><h4>Como funciona</h4><div id="como"></div></div>
    <div class="pop" id="pop-mus"><h4>Músicas</h4><div id="mus"></div></div>
  </header>

  <!-- O CAMINHO DO SOM, à vista. O aluno tem de VER que o player da esquerda
       entra no CH1, que quem manda no volume/timbre é o mixer, e que o MASTER
       é o que sai no alto-falante do aparelho dele. -->
  <div id="rota" hidden></div>

  <main id="palco"></main>
</div>

<script>
/* ============================================================================
   1. DADOS INJETADOS PELO GERADOR
   ============================================================================ */
const SIMS = [{"id":"cdj2000","tipo":"deck","sub":"tela colorida · 8 hot cue","nome":"Pioneer CDJ-2000NXS2","html":"&lt;!doctype html&gt;\n&lt;html lang=&quot;pt-BR&quot;&gt;\n&lt;head&gt;\n&lt;script&gt;window.__SMU_VISOR={&quot;modo&quot;:&quot;lista&quot;,&quot;toque&quot;:true,&quot;decks&quot;:1,&quot;carga&quot;:&quot;reload&quot;,&quot;demo&quot;:[&quot;SMU DEMO — Dance Floor Bomb&quot;]};&lt;/script&gt;\n&lt;script&gt;/* PONTE SMU */\n/* ---------------------------------------------------------------------------\n   CAIXA-PRETA — primeira coisa do arquivo, de proposito.\n   O iframe e srcdoc com sandbox=&quot;allow-scripts&quot;: origem OPACA. O pai NAO\n   consegue ler o console dele, entao um erro de script dentro do aparelho\n   sumia sem deixar rastro e a gente ficava adivinhando. Daqui em diante todo\n   erro sobe para a aula por postMessage.                                    */\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function grita(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  window.__SMU_ERROS = [];\n  addEventListener(&quot;error&quot;, function(e){\n    var m = {smu:&quot;erroJS&quot;, msg:String(e.message||e.type), src:String(e.filename||&quot;&quot;), linha:e.lineno||0};\n    window.__SMU_ERROS.push(m); grita(m);\n  }, true);\n  addEventListener(&quot;unhandledrejection&quot;, function(e){\n    var r = e.reason, m = {smu:&quot;erroJS&quot;, msg:&quot;promessa: &quot;+String((r&amp;&amp;r.message)||r), src:&quot;&quot;, linha:0};\n    window.__SMU_ERROS.push(m); grita(m);\n  });\n  /* SONDA: a aula pergunta, o aparelho responde de dentro da caixa opaca.\n     E so leitura — nao muda comportamento nenhum.                           */\n  addEventListener(&quot;message&quot;, function(e){\n    var d=e.data; if(!d||d.smu!==&quot;probe&quot;) return;\n    var r; try{ r = (0,eval)(d.expr); }catch(err){ r = &quot;ERRO: &quot;+(err&amp;&amp;err.message||err); }\n    try{ r = JSON.parse(JSON.stringify(r)); }catch(_){ r = String(r); }\n    grita({smu:&quot;probeOk&quot;, id:d.id, val:r});\n  });\n})();\n/* ---------------------------------------------------------------------------\n   PRATO EM BRANCO — causa achada medindo, nao deduzindo.\n   No simulador AVULSO o jog desenha certo (medido: caixa 244x244, canvas\n   420x420). Embutido, a superficie aparece mas o disco nao. O motivo e que o\n   sim desenha UMA vez no init(); dentro de um iframe com srcdoc o layout ainda\n   nao aconteceu nessa hora, a caixa do canvas vale 0, e o desenho vai para o\n   vazio. Como o jog so e redesenhado quando alguem o gira, ele fica branco\n   para sempre.\n   Conserto no ENCAIXE, sem tocar em simulador nenhum: quando o tamanho real\n   chegar, mandamos o sim desenhar de novo.                                  */\n(function(){\n  var jaOk = false;\n  function redesenhar(){\n    try {\n      /* os sims expoem uma destas: frame() e o padrao da frota */\n      [&quot;frame&quot;,&quot;desenhar&quot;,&quot;render&quot;,&quot;draw&quot;,&quot;drawAll&quot;,&quot;pinta&quot;].forEach(function(n){\n        if (typeof window[n] === &quot;function&quot;) { window[n](); jaOk = true; }\n      });\n      /* muitos recalculam sozinhos no resize */\n      window.dispatchEvent(new Event(&quot;resize&quot;));\n    } catch(e){}\n  }\n  function medir(){\n    var c = document.querySelector('canvas[id*=&quot;jog&quot;],canvas.jogc,canvas');\n    return c ? Math.round(c.getBoundingClientRect().width) : 0;\n  }\n  /* tenta ate a caixa ter largura de verdade — sem laco infinito */\n  var n = 0;\n  var t = setInterval(function(){\n    n++;\n    if (medir() &gt; 0) { redesenhar(); }\n    if (n &gt; 20 || (jaOk &amp;&amp; medir() &gt; 0)) clearInterval(t);\n  }, 100);\n  addEventListener(&quot;load&quot;, redesenhar);\n  /* e sempre que a aula mudar o tamanho do aparelho (ampliar, girar o iPad) */\n  if (window.ResizeObserver) {\n    var ro = new ResizeObserver(function(){ redesenhar(); });\n    addEventListener(&quot;DOMContentLoaded&quot;, function(){ ro.observe(document.body); });\n  }\n})();\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function env(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  function c01(v){ return v&lt;0?0:v&gt;1?1:v; }\n\n  /* ---------- 1. audio: o destino do simulador vira um grafo nosso ---------- */\n  var O = window.AudioContext || window.webkitAudioContext;\n  window.__g=[]; window.__cad=[];\n  /* ⛔ O ganho pedido pela aula tem de SOBREVIVER ao aparelho ainda nao ter\n     ligado o audio. MEDIDO na aula: a aula manda {vol,v:0} para o mixer assim\n     que o estado chega, mas nessa hora o AudioContext do mixer AINDA NAO\n     EXISTE (__cad vazio) — o comando caia no vazio. Quando o aluno tocava no\n     mixer, ele ligava o audio com ganho 1 e as bases de demonstracao DELE\n     tocavam por cima do player. Agora o pedido fica guardado e e aplicado no\n     instante em que o contexto nasce.                                       */\n  var ultVol = {v:1, eq:null, filtros:null, temPedido:false};\n  if(O){\n    function P(){\n      var c=new O(), destReal=c.destination;\n      /* ⛔ PODA. O LOAD do visor RELIGA o audio do aparelho (fecha o contexto e\n         chama startAudio() de novo). Sem podar, __cad[0] fica sendo o contexto\n         MORTO — o pico() mediria silencio para sempre e a aula acusaria\n         &quot;o player nao esta tocando&quot; com a musica no ar. */\n      window.__cad = (window.__cad||[]).filter(function(a){\n        try{ return a.ctx &amp;&amp; a.ctx.state !== &quot;closed&quot;; }catch(e){ return false; } });\n      window.__g = window.__cad.map(function(a){ return a.g; });\n      var pre=c.createGain(); pre.gain.value=1;          /* o sim conecta AQUI */\n      var an=c.createAnalyser(); an.fftSize=512; pre.connect(an);\n      var g=c.createGain(); g.gain.value=1; pre.connect(g);\n      /* ---------------------------------------------------------------\n         A TIRA DE CANAL DO MIXER, DENTRO DO DECK.\n         O audio nao atravessa o iframe, entao o timbre nao pode &quot;vir\n         pronto&quot; do mixer. O que atravessa e a DESCRICAO dos filtros que o\n         mixer tem ligados; aqui existem biquads DE VERDADE, e o som do\n         player passa por eles. Quatro: as 3 bandas do EQ + o COLOR/FILTER.\n         O tipo/frequencia/Q de cada um NAO e chutado aqui — chega do\n         proprio no do mixer (ver a funcao cadeia() no lado mixer). Estes valores\n         iniciais so valem enquanto o mixer nao falou.                  */\n      var lo=c.createBiquadFilter(); lo.type=&quot;lowshelf&quot;;  lo.frequency.value=200;  lo.gain.value=0;\n      var md=c.createBiquadFilter(); md.type=&quot;peaking&quot;;   md.frequency.value=1000; md.Q.value=0.9; md.gain.value=0;\n      var hi=c.createBiquadFilter(); hi.type=&quot;highshelf&quot;; hi.frequency.value=4000; hi.gain.value=0;\n      var col=c.createBiquadFilter(); col.type=&quot;allpass&quot;; col.frequency.value=1000; col.Q.value=1; col.gain.value=0;\n      /* 5a casa: mixer de 4 bandas (DJM-V10) precisa dela alem do FILTER */\n      var col2=c.createBiquadFilter(); col2.type=&quot;allpass&quot;; col2.frequency.value=1000; col2.Q.value=1; col2.gain.value=0;\n      /* torneira de bancada: 1 em producao. Serve para MEDIR sem tocar som\n         na maquina de quem esta testando (window.__SMU_MUDO=1). */\n      var sai=c.createGain(); sai.gain.value = window.__SMU_MUDO ? 0 : 1;\n      g.connect(lo); lo.connect(md); md.connect(hi); hi.connect(col); col.connect(col2);\n      col2.connect(sai); sai.connect(destReal);\n      try{ Object.defineProperty(c,&quot;destination&quot;,{get:function(){return pre},configurable:true}); }catch(e){}\n      var reg={ctx:c,an:an,g:g,lo:lo,md:md,hi:hi,col:col,col2:col2,sai:sai,dest:destReal};\n      reg.f=[lo,md,hi,col,col2];\n      window.__g.push(g); window.__cad.push(reg);\n      if(ultVol.temPedido){                 /* o pedido que chegou antes da hora */\n        g.gain.value = ultVol.v;\n        if(ultVol.eq){ lo.gain.value=ultVol.eq.low||0; md.gain.value=ultVol.eq.mid||0; hi.gain.value=ultVol.eq.hi||0; }\n        if(ultVol.filtros) porFiltros(reg, ultVol.filtros, true);\n      }\n      return c;\n    }\n    P.prototype=O.prototype; window.AudioContext=P; window.webkitAudioContext=P;\n  }\n  function rampa(p,v){ try{\n      if(!isFinite(v)) return;\n      if(Math.abs(p.value-v) &lt; 1e-6) return;         /* ja esta la: nao agenda nada */\n      var t=(window.__cad[0]&amp;&amp;window.__cad[0].ctx?window.__cad[0].ctx.currentTime:0);\n      p.cancelScheduledValues(t); p.setValueAtTime(p.value,t); p.linearRampToValueAtTime(v,t+0.02);\n    }catch(e){ try{ p.value=v; }catch(_){} } }\n  /* ---------------------------------------------------------------------\n     O TIMBRE DO MIXER APLICADO AQUI DENTRO.\n     O parametro fs e a lista de filtros que o mixer REALMENTE tem ligados, cada um\n     {t:tipo, f:frequencia, q:Q, g:ganho em dB}, lida dos nos dele. Nada e\n     inventado deste lado: se o mixer nao mandar, o filtro fica em allpass\n     (transparente), que e o mesmo que nao existir.\n     ⚠️ Rampa LINEAR de 20 ms, que TERMINA. Nada de setTargetAtTime: ele e\n     exponencial e nunca acaba, o parametro vira a-rate e o biquad passa a\n     recalcular coeficiente por amostra (34,5% de CPU na CL5).           */\n  function porFiltros(a, fs, direto){\n    if(!a || !a.f) return;\n    for(var i=0;i&lt;a.f.length;i++){\n      var n=a.f[i], s=fs&amp;&amp;fs[i];\n      if(!s){                                   /* sobra de filtro: transparente */\n        try{ n.type=&quot;allpass&quot;; }catch(e){}\n        if(direto){ try{ n.gain.value=0; }catch(e){} } else rampa(n.gain,0);\n        continue;\n      }\n      try{ if(s.t &amp;&amp; n.type!==s.t) n.type=s.t; }catch(e){}\n      if(direto){\n        try{ if(s.f!=null) n.frequency.value=s.f; if(s.q!=null) n.Q.value=s.q; if(s.g!=null) n.gain.value=s.g; }catch(e){}\n      } else {\n        if(s.f!=null) rampa(n.frequency, s.f);\n        if(s.q!=null) rampa(n.Q, s.q);\n        if(s.g!=null) rampa(n.gain, s.g);\n      }\n    }\n  }\n  function volume(v,eq,filtros){\n    ultVol.v = v; ultVol.eq = eq; if(filtros!==undefined) ultVol.filtros = filtros;\n    ultVol.temPedido = true;\n    (window.__cad||[]).forEach(function(a){\n      rampa(a.g.gain, v);\n      if(filtros) porFiltros(a, filtros, false);\n      else if(eq){ rampa(a.lo.gain, eq.low||0); rampa(a.md.gain, eq.mid||0); rampa(a.hi.gain, eq.hi||0); }\n    });\n  }\n  /* pico ANTES do ganho: diz se o PLAYER esta tocando, nao se o mixer deixou passar */\n  var buf=null;\n  function pico(){\n    var a=(window.__cad||[])[0]; if(!a) return 0;\n    if(!buf||buf.length!==a.an.fftSize) buf=new Uint8Array(a.an.fftSize);\n    a.an.getByteTimeDomainData(buf);\n    var p=0; for(var i=0;i&lt;buf.length;i+=4){ var x=Math.abs(buf[i]-128)/128; if(x&gt;p)p=x; }\n    return p;\n  }\n\n  /* ---------- 1b. VU: o AUDIO nao atravessa o iframe, o SINAL sim ----------\n     O mixer embutido nao recebe audio nenhum — quem toca e o deck, no outro\n     iframe. Entao os medidores dele mediam silencio e ficavam apagados nos\n     dois lugares (canal e master), que foi o que o dono viu.\n\n     ⛔ Nada de inventar escala de dB aqui. Cada simulador ja tem a escala do\n     MANUAL dele (o DJM-900NXS2 tem 15 segmentos por medidor: canal +12..-30 e\n     master +15..-27 dB, conferido na pagina &quot;Control Panel&quot; do manual — e o\n     sim desenha 15). Se a ponte &quot;acendesse N LEDs&quot; estaria reescrevendo essa\n     calibracao por fora.\n     O que a ponte faz e o degrau ANTES: entrega ao analisador do mixer a mesma\n     ONDA que existiria se o cabo estivesse ligado. Dai o codigo do proprio\n     aparelho mede e acende — igualzinho ao avulso, sem tocar em simulador.\n     Como so o analisador e alimentado (nada chega ao destination), NAO SAI SOM.\n\n     Onde mora o analisador (levantado arquivo por arquivo, nao chutado):\n       chans[n].analyser + masterAn ... DJM-450/750MK2/800/900NXS2/V10, X1850\n       d.an / b.an / d.masterAn ....... DJM-600\n       dA.an / dB.an / masterAn ....... DJM-2000\n     Os tres casos leem por getByteTimeDomainData, entao um so remendo serve. */\n  function po(o){ return o &amp;&amp; typeof o===&quot;object&quot;; }\n  /* ---------------------------------------------------------------------\n     OS CANAIS DO MIXER — o mesmo levantamento arquivo por arquivo que ja\n     servia para achar os analisadores serve para achar a TIRA DE CANAL\n     inteira. Cada simulador guarda o canal num objeto so; o que muda e o\n     nome da variavel.                                                   */\n  function achaCanais(){\n    var C={};\n    try{ if(typeof chans!==&quot;undefined&quot; &amp;&amp; po(chans))\n      for(var k in chans){ if(po(chans[k])) C[k]=chans[k]; } }catch(e){}\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof d!==&quot;undefined&quot; &amp;&amp; po(d) &amp;&amp; (d.fader||d.trim)) C[&quot;1&quot;]=d; }catch(e){}\n    try{ if(!C[&quot;2&quot;] &amp;&amp; typeof b!==&quot;undefined&quot; &amp;&amp; po(b) &amp;&amp; (b.fader||b.trim)) C[&quot;2&quot;]=b; }catch(e){}\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof dA!==&quot;undefined&quot; &amp;&amp; po(dA) &amp;&amp; (dA.fader||dA.trim)) C[&quot;1&quot;]=dA; }catch(e){}\n    try{ if(!C[&quot;2&quot;] &amp;&amp; typeof dB!==&quot;undefined&quot; &amp;&amp; po(dB) &amp;&amp; (dB.fader||dB.trim)) C[&quot;2&quot;]=dB; }catch(e){}\n    /* DJM-A9: os canais moram em CH */\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof CH!==&quot;undefined&quot; &amp;&amp; po(CH))\n      for(var j in CH){ if(po(CH[j])) C[j]=CH[j]; } }catch(e){}\n    return C;\n  }\n  /* ⚠️ Procurar por NOME nao basta: ha simulador em que c.ch e o NUMERO do\n     canal e nao o no de ganho. Por isso cada leitor so aceita o que de fato\n     tem o parametro que ele vai ler, e segue procurando quando nao tem.    */\n  function pgan(o,nomes){\n    for(var i=0;i&lt;nomes.length;i++){\n      try{ var n=o[nomes[i]];\n        if(n &amp;&amp; n.gain &amp;&amp; typeof n.gain.value===&quot;number&quot;) return +n.gain.value;\n      }catch(e){}\n    }\n    return null;\n  }\n  function pgan1(n){ try{ return (n &amp;&amp; n.gain &amp;&amp; typeof n.gain.value===&quot;number&quot;) ? +n.gain.value : null; }catch(e){ return null; } }\n  function pbq(o,nomes){\n    for(var i=0;i&lt;nomes.length;i++){\n      try{ var n=o[nomes[i]];\n        if(n &amp;&amp; n.frequency &amp;&amp; typeof n.frequency.value===&quot;number&quot; &amp;&amp; n.type)\n          return {t:String(n.type), f:+n.frequency.value, q:(n.Q?+n.Q.value:1), g:(n.gain?+n.gain.value:0)};\n      }catch(e){}\n    }\n    return null;\n  }\n  /* ---------------------------------------------------------------------\n     CADEIA — o caminho do som DENTRO do mixer, lido dos nos de audio.\n     ⛔ Nao se re-deduz dB por angulo de knob aqui. O simulador ja converteu\n     posicao em parametro (o DJM-900NXS2 faz -26..+6 dB por banda, e o TRIM\n     -inf..+9 dB, exatamente como o manual dele). Ler o NO e a fonte de\n     verdade; refazer a conta do lado de fora seria inventar uma segunda.\n     So existe depois que o aluno liga o audio do mixer. Antes disso volta\n     null e a aula cai no caminho antigo, por posicao de controle.       */\n  function cadeia(){\n    var C=achaCanais(), out={ch:{}, master:null, bus:{}}, achou=false;\n    var xa=null, xb=null, th=null, ms=null, am=null;\n    try{ if(typeof xfA!==&quot;undefined&quot;) xa=xfA; }catch(e){}\n    try{ if(typeof xfB!==&quot;undefined&quot;) xb=xfB; }catch(e){}\n    try{ if(typeof thru!==&quot;undefined&quot;) th=thru; }catch(e){}\n    try{ if(th==null &amp;&amp; typeof thruBus!==&quot;undefined&quot;) th=thruBus; }catch(e){}\n    try{ if(typeof master!==&quot;undefined&quot;) ms=master; }catch(e){}\n    try{ if(typeof assignMode     for(var i=0;i&lt;L.length;i++) if(carreg &amp;&amp; L[i].id === carreg.id) n = i + 1;\n    var mostra = ST.aberto || !!carreg || !!ST.msg;\n    o.classList.toggle(&quot;on&quot;, mostra &amp;&amp; L.length &gt; 0);\n    if(!mostra) { o.innerHTML = &quot;&quot;; return; }\n    var atual = L[ST.sel] || carreg;\n    o.innerHTML = '&lt;span class=&quot;n&quot;&gt;TRK ' + (ST.sel + 1) + '/' + L.length + '&lt;/span&gt;' +\n      (CFG.texto ? ('&lt;span class=&quot;t&quot;&gt;' + esc(ST.msg || (atual ? atual.nome : &quot;—&quot;)) + '&lt;/span&gt;') : '&lt;span class=&quot;t&quot;&gt;&lt;/span&gt;') +\n      (atual &amp;&amp; atual.bpm ? ('&lt;span class=&quot;n&quot;&gt;' + (+atual.bpm).toFixed(1) + '&lt;/span&gt;') : &quot;&quot;);\n    ajustarFonte();\n  }\n\n  /* --- toca-discos: NAO TEM VISOR. Vai para o painel de ensino do sim. --- */\n  var DSC = null;\n  function pintarSemVisor(){\n    var t = document.getElementById(&quot;teach&quot;); if(!t) return;\n    estilo();\n    if(!DSC || !DSC.isConnected){\n      DSC = document.createElement(&quot;div&quot;); DSC.className = &quot;smud&quot;;\n      t.appendChild(DSC);\n      DSC.addEventListener(&quot;click&quot;, function(e){\n        var b = e.target.closest(&quot;button[data-i]&quot;); if(!b) return;\n        e.stopPropagation();\n        var L = ST.playlist.length ? ST.playlist : ST.banco;\n        var f = L[+b.dataset.i]; if(f) carregar(1, f);\n      });\n    }\n    var L = ST.playlist.length ? ST.playlist : ST.banco;\n    var carreg = ST.carregada[1];\n    DSC.innerHTML = '&lt;span class=&quot;e&quot;&gt;O DISCO NA MÃO — este aparelho NÃO TEM VISOR: ' +\n      'no mundo real quem troca a música é a sua mão, escolhendo o vinil.&lt;/span&gt;' +\n      L.map(function(f,i){\n        return '&lt;button data-i=&quot;' + i + '&quot; class=&quot;' + (carreg &amp;&amp; carreg.id === f.id ? &quot;on&quot; : &quot;&quot;) + '&quot;&gt;' +\n          esc(f.nome) + '&lt;/button&gt;';\n      }).join(&quot;&quot;) + (ST.msg ? ('&lt;span class=&quot;e&quot;&gt;' + esc(ST.msg) + '&lt;/span&gt;') : &quot;&quot;);\n  }\n\n  /* ---------------------------------------------------------------------\n     6. OS CONTROLES DO APARELHO — nada de botao inventado\n     --------------------------------------------------------------------- */\n  var ABRE   = [&quot;browse&quot;,&quot;navbrowse&quot;,&quot;usbport&quot;,&quot;usbslot&quot;,&quot;usb&quot;,&quot;sdslot&quot;,&quot;srcusb&quot;,&quot;srcusb1&quot;,&quot;srcusb2&quot;,\n                &quot;source&quot;,&quot;playlist&quot;,&quot;shortcut&quot;,&quot;disc&quot;,&quot;pc&quot;,&quot;srcrb&quot;,&quot;srclink&quot;,&quot;srcdisc&quot;,&quot;usb1&quot;,&quot;usb2&quot;];\n  var TELAS  = { browse:&quot;usb&quot;, navbrowse:&quot;usb&quot;, playlist:&quot;playlist&quot;, shortcut:&quot;playlist&quot;,\n                 taglist:&quot;playlist&quot;, navtag:&quot;playlist&quot; };\n  /* ⛔ so o TAG TRACK / REMOVE. Nada de sequestrar o MEMORY: naquele botao o\n     aparelho grava PONTO DE CUE — usar para playlist seria ensinar errado. */\n  var GUARDA = [&quot;tagtrack&quot;];\n  var PROX   = [&quot;trknext&quot;,&quot;tracksearchR&quot;,&quot;srchfwd&quot;,&quot;foldernext&quot;,&quot;folder2&quot;,&quot;callnext&quot;];\n  var ANT    = [&quot;trkprev&quot;,&quot;tracksearchL&quot;,&quot;srchback&quot;,&quot;folderprev&quot;,&quot;folder&quot;,&quot;callprev&quot;];\n\n  function ligarControles(){\n    document.addEventListener(&quot;pointerdown&quot;, function(e){\n      var alvo = e.target &amp;&amp; e.target.closest ? e.target.closest(&quot;[data-act]&quot;) : null;\n      if(!alvo) return;\n      var a = alvo.dataset.act;\n      /* ⛔ nunca stopPropagation: o handler do proprio aparelho tem de rodar\n         igual. Aqui so se ACRESCENTA comportamento. */\n      if(CFG.modo === &quot;faixa&quot;){\n        if(PROX.indexOf(a) &gt;= 0){ andarCD(1); return; }\n        if(ANT.indexOf(a)  &gt;= 0){ andarCD(-1); return; }\n        return;\n      }\n      if(CFG.modo !== &quot;lista&quot;) return;\n      if(a === &quot;back&quot;){ voltar(); return; }\n      if(TELAS[a]){ abrir(TELAS[a]); return; }\n      if(ABRE.indexOf(a) &gt;= 0){ abrir(&quot;raiz&quot;); return; }\n      if(GUARDA.indexOf(a) &gt;= 0 &amp;&amp; ST.aberto){ guardar(); return; }\n      if(ST.aberto &amp;&amp; PROX.indexOf(a) &gt;= 0){ mover(1); return; }\n      if(ST.aberto &amp;&amp; ANT.indexOf(a)  &gt;= 0){ mover(-1); return; }\n      /* LOAD de cada aparelho, com o nome que ELE usa (levantado arquivo por\n         arquivo): XDJ-AZ/RX = load1/load2 · Prime 4 = loadl/loadr ·\n         OPUS-QUAD = load13/load24 (um botao serve dois decks). */\n      var lado = {load1:1, loadl:1, load13:1, load3:1,\n                  load2:2, loadr:2, load24:2, load4:2}[a];\n      if(lado){ ST.lado = lado; if(ST.aberto) confirmar(); else abrir(&quot;raiz&quot;); return; }\n    }, true);\n\n    /* SELETOR ROTATIVO: girar anda, apertar carrega. Arrasto vertical serve de\n       giro — e como se gira um encoder com o dedo no iPad. */\n    ligarRotativo();\n  }\n  function achaRotativo(){\n    var n = [&quot;rotary&quot;,&quot;selectpush&quot;,&quot;select&quot;,&quot;folder&quot;,&quot;browseknob&quot;];\n    for(var i=0;i&lt;n.length;i++){\n      var e = document.querySelector('[data-act=&quot;' + n[i] + '&quot;]');\n      if(e) return e;\n    }\n    return null;\n  }\n  var rotLigado = false;\n  function ligarRotativo(){\n    if(rotLigado) return;\n    var r = achaRotativo(); if(!r) return;\n    rotLigado = true;\n    var y0 = 0, acc = 0, andou = false, t0 = 0, ativo = false;\n    r.addEventListener(&quot;pointerdown&quot;, function(e){\n      ativo = true; andou = false; acc = 0; y0 = e.clientY; t0 = Date.now();\n    });\n    document.addEventListener(&quot;pointermove&quot;, function(e){\n      if(!ativo) return;\n      /* um passo por ~1/6 da altura do proprio seletor: medido no CDJ-850, com\n         0,28 da altura um arrasto curto de dedo nao virava pass      ajustar(); pintar(); return;\n    }\n    if(d.smu === &quot;ladoVisor&quot;){ ST.lado = d.lado || 1; pintar(); return; }\n    if(d.smu === &quot;ytev&quot; &amp;&amp; d.ev === &quot;semPonte&quot;){\n      ST.msg = &quot;YouTube só toca com a aula aberta DENTRO do curso — o player mora na moldura&quot;;\n      ST.aberto = true; pintar(); return;\n    }\n  });\n\n  function comecar(){\n    if(CFG.modo === &quot;nenhum&quot;){ pintarSemVisor(); return; }\n    if(CFG.modo === &quot;nativo&quot;) return;             /* o browse dele ja resolve */\n    ligarControles();\n    /* o rotativo so existe depois do build(): tenta de novo por um tempo */\n    var n = 0, t = setInterval(function(){ n++; ligarRotativo(); if(rotLigado || n &gt; 25) clearInterval(t); }, 200);\n    embrulharRender();\n    pintar();\n  }\n  if(document.readyState === &quot;complete&quot; || document.readyState === &quot;interactive&quot;) setTimeout(comecar, 0);\n  else window.addEventListener(&quot;DOMContentLoaded&quot;, comecar);\n})();\n\n&lt;/script&gt;\n&lt;meta charset=&quot;utf-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no&quot;&gt;\n&lt;link rel=&quot;icon&quot; href=&quot;data:,&quot;&gt;\n&lt;title&gt;Pioneer CDJ-2000NXS2 — réplica fiel (SMU)&lt;/title&gt;\n&lt;style&gt;\n  :root{ --ink:#e9eef7; --amber:#ffae1a; --green:#39d271; --blue:#37a2ff; --cyan:#5fd7ff; }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%}\n  body{ background:radial-gradient(1100px 640px at 50% -10%,#26292e,#0a0b0d 62%),#08090b; color:var(--ink);\n    font-family:&quot;Inter&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;-webkit-font-smoothing:antialiased;\n    user-select:none;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}\n  #stage{transform-origin:top center;flex:0 0 auto}\n  .wrap{width:560px;display:flex;flex-direction:column;gap:8px;padding:10px}\n\n  .util{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(180deg,#202329,#15171b);border:1px solid #0c0d0f;border-radius:11px;padding:7px 11px}\n  .brand b{font-size:15px;letter-spacing:1px;color:#eef2f8}\n  .brand .m{font-size:9px;letter-spacing:2px;color:#8a94a4;text-transform:uppercase;margin-left:6px}\n  .pill{font-size:10px;color:#8b97a9;background:#0c0e12;border:1px solid #2a2f37;border-radius:16px;padding:4px 9px;display:flex;align-items:center;gap:6px}\n  .pill b{color:#fff}.dot{width:8px;height:8px;border-radius:50%;background:#444}.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}\n  .spacer{flex:1}\n  .btnp{font:inherit;font-size:11px;font-weight:700;border:0;border-radius:8px;padding:6px 11px;cursor:pointer;color:#07120b;background:linear-gradient(180deg,#5be59a,#27b566)}\n  .btnp.ghost{background:transparent;color:#8b97a9;border:1px solid #2a2f37}\n  .mission{display:flex;align-items:center;gap:8px;background:#0c0e12;border:1px solid #2a2f37;border-radius:9px;padding:5px 10px;flex:1 1 240px;min-width:0}\n  .mission .idx{font-size:10px;color:var(--amber);font-weight:800;white-space:nowrap}\n  .mission .txt{font-size:11px;line-height:1.2}.mission .txt b{color:#fff}.mission .txt small{color:#8b97a9}\n\n  /* ===== corpo do CDJ-2000NXS2: preto grafite acetinado (não é o preto brilhante do MK3) ===== */\n  .deck{position:relative;width:100%;aspect-ratio:329/453;border-radius:13px;\n    background:\n      radial-gradient(120% 45% at 50% -6%, #43474d 0%, #2b2f34 20%, transparent 46%),\n      linear-gradient(180deg,#2a2d32 0%,#212429 6%,#1b1e22 34%,#17191d 72%,#111316 100%);\n    box-shadow:0 30px 70px #000e, inset 0 2px 0 #ffffff16, inset 0 -8px 22px #000b, 0 0 0 1px #000, 0 0 0 2px #34383e, 0 0 0 3px #0a0b0d;\n    overflow:hidden}\n  /* acetinado bem discreto — a NXS2 não brilha como o MK3 */\n  .deck::before{content:&quot;&quot;;position:absolute;inset:0;border-radius:13px;pointer-events:none;z-index:0;\n    background:linear-gradient(180deg,#ffffff12 0%,#ffffff05 5%,transparent 13%)}\n  .deck::after{content:&quot;&quot;;position:absolute;inset:0;border-radius:13px;pointer-events:none;z-index:9;\n    background:radial-gradient(130% 105% at 50% 42%, transparent 70%, #00000045 100%)}\n\n  /* faixa traseira (borda de trás vista de cima) */\n  .rear{position:absolute;left:20%;right:10%;top:0;height:2.7%;z-index:1;\n    background:linear-gradient(180deg,#0c0e10,#212529 70%,#15181b);border-bottom:1px solid #000;\n    box-shadow:inset 0 1px 0 #ffffff14}\n  .discslot{position:absolute;z-index:1;border-radius:2px;background:linear-gradient(180deg,#0a0b0d,#1b1e22);\n    border:1px solid #000;box-shadow:inset 0 1px 2px #000c,0 1px 0 #ffffff10}\n\n  /* placas/seções serigrafadas do painel */\n  .plate{position:absolute;z-index:1;border-radius:7px;background:linear-gradient(180deg,#23262b,#191c20 60%,#141619);\n    box-shadow:inset 0 1px 0 #ffffff18, inset 0 -2px 5px #0008, 0 1px 0 #00000090, 0 0 0 1px #0b0c0e}\n  .plate.dark{background:linear-gradient(180deg,#151719,#0d0f11);box-shadow:inset 0 1px 0 #ffffff10, inset 0 2px 8px #000b, 0 0 0 1px #08090a}\n\n  .lab{position:absolute;z-index:2;font-size:5.6px;letter-spacing:.7px;color:#8b929b;font-weight:700;text-transform:uppercase;text-shadow:0 1px 0 #000;pointer-events:none;white-space:nowrap}\n  .lab.sm{font-size:4.8px;color:#767d86;letter-spacing:.5px}\n  .lab.wh{color:#c8cfd8}\n  .lab.blu{color:#5ba9e8}\n\n  .biglogo{position:absolute;left:50%;top:93.2%;transform:translateX(-50%);font-size:19px;font-weight:900;font-style:italic;\n    color:#b9c0c8;text-shadow:0 1px 2px #000,0 0 1px #fff2;letter-spacing:.5px;pointer-events:none;opacity:.9;z-index:2}\n  .model{position:absolute;right:2.4%;top:95.2%;text-align:right;pointer-events:none;z-index:2}\n  .model b{display:block;font-size:9px;font-weight:900;letter-spacing:.6px;color:#c9d0d8;text-shadow:0 1px 1px #000}\n  .model i{display:block;font-style:normal;font-size:4.6px;letter-spacing:1.4px;color:#7e858e}\n\n  /* ---------- botões ---------- */\n  .btn{position:absolute;z-index:3;cursor:pointer;border-radius:3px;min-width:0;box-sizing:border-box;overflow:hidden;\n    background:linear-gradient(180deg,#41464d 0%,#2b3037 42%,#1a1d21 58%,#101317 100%);border:1px solid #000;\n    box-shadow:inset 0 1px 0 #ffffff2e, inset 0 -1px 1px #000, 0 1px 2px #000a;\n    display:flex;align-items:center;justify-content:center;color:#c3cad3;font-size:5.6px;font-weight:800;text-align:center;\n    line-height:1.02;letter-spacing:.3px;text-shadow:0 1px 1px #000;padding:0 1px}\n  .btn:active{transform:translateY(1px)}\n  .btn.lit{color:#fff;background:linear-gradient(180deg,#6d7784,#414a55 45%,#232a32);box-shadow:inset 0 1px 0 #ffffff55,0 0 7px #ffffff30}\n  /* fileira BROWSE / TAG LIST / INFO / MENU */\n  .btn.top{border-radius:4px;font-size:6.2px;letter-spacing:.5px;\n    background:linear-gradient(180deg,#4a5058 0%,#31363d 45%,#1d2126 60%,#131619 100%)}\n  .btn.top.lit{background:linear-gradient(180deg,#8fd8ff,#3ba2e2 55%,#1a6ba5);color:#04202f;text-shadow:none;box-shadow:0 0 9px #37a2ff,inset 0 1px 0 #ffffff70}\n  /* fonte (rekordbox/LINK/USB/SD/DISC) */\n  .btn.src{border-radius:3px;font-size:5px;letter-spacing:.2px}\n  .btn.src.lit{background:linear-gradient(180deg,#ffd07a,#f0a020 55%,#a05f00);color:#2b1600;text-shadow:none;box-shadow:0 0 8px #ffae1a,inset 0 1px 0 #ffffff70}\n  /* meia-lua ao redor do rotativo */\n  .btn.arcT{border-radius:9px 9px 3px 3px;font-size:4.6px;line-height:1.1}\n  .btn.arcB{border-radius:3px 3px 9px 9px;font-size:4.6px;line-height:1.1}\n  /* SYNC / MASTER redondos com texto */\n  .btn.rnd{border-radius:50%;font-size:5px;letter-spacing:.2px}\n  .btn.rnd.lit{background:linear-gradient(180deg,#9ee1ff,#39a8e8 50%,#15629c);color:#03202e;text-shadow:none;box-shadow:0 0 10px #37a2ff,inset 0 1px 0 #ffffff70}\n  .btn.rnd.mst.lit{background:linear-gradient(180deg,#ffd58a,#f09a1e 50%,#9a5a00);color:#2b1500;box-shadow:0 0 10px #ff9d1a,inset 0 1px 0 #ffffff70}\n\n  /* HOT CUE — pastilhas retangulares translúcidas que acendem */\n  .pad{position:absolute;z-index:3;cursor:pointer;border-radius:4px;min-width:0;box-sizing:border-box;overflow:hidden;\n    background:linear-gradient(180deg,#2c3138 0%,#1a1e23 45%,#101418 100%);border:1px solid #05070a;\n    box-shadow:inset 0 1px 0 #ffffff22, inset 0 -2px 4px #000a, 0 1px 2px #000a;\n    display:flex;align-items:center;justify-content:center;color:#6e7681;font-size:7px;font-weight:900;letter-spacing:1px}\n  .pad:active{transform:translateY(1px)}\n  .pad.on{background:linear-gradient(180deg,#ffcf7d,#ff9d1a 48%,#c96b00 100%);color:#3a1d00;\n    box-shadow:0 0 12px #ff9d1a,inset 0 1px 0 #ffffff70}\n  .pad.bnk2{}\n  .pad.bnk2.on{background:linear-gradient(180deg,#a9e8ff,#37a2ff 48%,#1163b4 100%);color:#022238;box-shadow:0 0 12px #37a2ff,inset 0 1px 0 #ffffff70}\n\n  /* botões redondos escuros (TRACK SEARCH, SEARCH, CALL, MEMORY, DELETE...) */\n  .rbtn{position:absolute;z-index:3;cursor:pointer;border-radius:50%;min-width:0;box-sizing:border-box;overflow:hidden;\n    background:radial-gradient(circle at 50% 30%,#4a5057,#2a2e33 55%,#14171a 100%);\n    border:1px solid #000;box-shadow:0 2px 4px #0009, inset 0 1px 1px #ffffff35, inset 0 -3px 5px #0006;\n    display:flex;align-items:center;justify-content:center;color:#b6bdc6;font-size:6px;font-weight:900;text-shadow:0 1px 1px #000}\n  .rbtn:active{transform:translateY(1px)}\n  .rbtn.on{background:radial-gradient(circle at 50% 30%,#ffdca0,#ff9d1a 55%,#a35c00 100%);color:#341900;text-shadow:none;box-shadow:0 0 11px #ff9d1a,inset 0 1px 1px #ffffff80}\n  /* botões de loop: acrílico âmbar (IN/OUT/RELOOP) */\n  .rbtn.loop{background:radial-gradient(circle at 50% 30%,#6c5a3a,#3a2f1c 58%,#1a150c 100%);color:#c8a55e}\n  .rbtn.loop.on{background:radial-gradient(circle at 50% 30%,#ffe6a8,#ffab27 55%,#b06a00 100%);color:#3a1d00;box-shadow:0 0 13px #ffab27,inset 0 1px 1px #ffffff90}\n  .rbtn.grn.on{background:radial-gradient(circle at 50% 30%,#c4ffd8,#39d271 55%,#0f7a3c 100%);color:#032414;box-shadow:0 0 12px #39d271,inset 0 1px 1px #ffffff80}\n\n  /* CUE e PLAY/PAUSE: botão escuro com anel iluminado */\n  .big{position:absolute;z-index:3;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}\n  .big .ring{position:absolute;inset:0;border-radius:50%;\n    background:radial-gradient(circle at 50% 50%,transparent 62%,#20242a 66%,#14171b 86%,#0b0d10 100%);\n    box-shadow:0 2px 5px #000a, inset 0 1px 0 #ffffff20}\n  .big .cap{position:absolute;inset:15%;border-radius:50%;\n    background:radial-gradient(circle at 50% 28%,#3c424a,#22262c 55%,#131619 100%);\n    border:1px solid #000;box-shadow:inset 0 1px 1px #ffffff2e, inset 0 -3px 6px #0007, 0 1px 3px #0009;\n    display:flex;align-items:center;justify-content:center;color:#aab2bc;font-size:7px;font-weight:900;letter-spacing:.6px;text-shadow:0 1px 1px #000}\n  .big.cue .ring{background:radial-gradient(circle at 50% 50%,transparent 62%,#4a3312 67%,#2a1d0a 84%,#0b0d10 100%)}\n  .big.cue.on .ring{background:radial-gradient(circle at 50% 50%,transparent 61%,#ffb347 66%,#c96f00 85%,#3a2000 100%);box-shadow:0 0 16px #ff9d1a}\n  .big.cue.on .cap{color:#ffd9a0}\n  .big.play .ring{background:radial-gradient(circle at 50% 50%,transparent 62%,#13381f 67%,#0c2415 84%,#0b0d10 100%)}\n  .big.play.on .ring{background:radial-gradient(circle at 50% 50%,transparent 61%,#5cf090 66%,#159048 85%,#04240f 100%);box-shadow:0 0 16px #39d271}\n  .big.play.on .cap{color:#bff5d1}\n\n  /* knobs pretos com ponteiro (VINYL SPEED ADJUST) */\n  .knob{position:absolute;z-index:3;border-radius:50%;cursor:ns-resize;\n    background:radial-gradient(circle at 50% 30%,#3b4046,#1b1e22 62%,#0d0f11 100%);border:1px solid #000;\n    box-shadow:0 2px 3px #0008, inset 0 1px 0 #ffffff26}\n  .knob::after{content:&quot;&quot;;position:absolute;left:50%;top:12%;width:7%;height:33%;background:#dbe1e8;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 3px #000}\n  /* knob serrilhado (rotativo e JOG ADJUST) */\n  .knurl{position:absolute;z-index:3;border-radius:50%;cursor:ns-resize;\n    background:\n      repeating-conic-gradient(from 0deg,#5a6068 0deg 3deg,#23272c 3deg 6deg),\n      radial-gradient(circle at 50% 30%,#6a7078,#2a2e33 70%);\n    border:1px solid #000;box-shadow:0 2px 5px #0009, inset 0 1px 1px #ffffff30}\n  .knurl .face{position:absolute;inset:20%;border-radius:50%;\n    background:radial-gradient(circle at 50% 26%,#4b525a,#22262b 60%,#111417 100%);\n    box-shadow:inset 0 1px 1px #ffffff28, inset 0 -3px 6px #0008;cursor:pointer}\n  .knurl.rot .face{inset:15%}\n\n  /* fader TEMPO */\n  .tempo{position:absolute;z-index:3;background:linear-gradient(90deg,#0a0b0d,#1a1d21 50%,#0a0b0d);border:1px solid #000;border-radius:5px;\n    box-shadow:inset 0 2px 9px #000c, inset 0 0 0 1px #ffffff0d;cursor:ns-resize;touch-action:none}\n  .tempo .slot{position:absolute;left:50%;top:4%;bottom:4%;width:3px;transform:translateX(-50%);background:#000;border-radius:2px;box-shadow:inset 0 0 2px #000}\n  .tempo .grad{position:absolute;left:14%;right:14%;top:4%;bottom:4%;\n    background:repeating-linear-gradient(180deg,#767d86 0 1.5px,transparent 1.5px,transparent 4.4%)}\n  .tempo .tlab{position:absolute;left:0;right:0;bottom:1.5%;text-align:center;font-size:5px;font-weight:700;letter-spacing:.7px;color:#8b929b;pointer-events:none}\n  .tempo .cap{position:absolute;left:50%;width:86%;height:13%;transform:translate(-50%,-50%);\n    background:linear-gradient(180deg,#f2f5f8 0%,#cfd4da 46%,#8d939b 54%,#b9bfc6 100%);border:1px solid #000;border-radius:2px;\n    box-shadow:0 2px 5px #000b, inset 0 1px 0 #fff}\n  .tempo .cap::after{content:&quot;&quot;;position:absolute;left:6%;right:6%;top:50%;height:2px;background:#e2453f;transform:translateY(-50%)}\n  .tscale{position:absolute;z-index:2;pointer-events:none;\n    background:repeating-linear-gradient(180deg,#6d747d 0 2px,transparent 2px,transparent 8.2%)}\n\n  /* alavanca DIRECTION (SLIP REV / FWD / REV) */\n  .lever{position:absolute;z-index:3;cursor:pointer;border-radius:4px;overflow:hidden;\n    background:linear-gradient(180deg,#101316,#191c20 50%,#0c0e11);border:1px solid #000;box-shadow:inset 0 2px 6px #000c}\n  .lever .kn{position:absolute;left:12%;right:12%;height:26%;top:37%;border-radius:3px;\n    background:linear-gradient(180deg,#e8ecf1,#a7adb5 55%,#7c828a);box-shadow:0 1px 3px #000b, inset 0 1px 0 #fff;transition:top .11s}\n  .lever.up .kn{top:6%}\n  .lever.dn .kn{top:68%}\n\n  /* indicadores */\n  .ind{position:absolute;z-index:3;border-radius:3px;cursor:pointer;\n    background:linear-gradient(180deg,#15181b,#0a0c0e);border:1px solid #000;box-shadow:inset 0 1px 2px #000b;\n    display:flex;align-items:center;justify-content:center;color:#4a2020;font-size:5px;font-weight:900;letter-spacing:.6px}\n  .ind.on{background:linear-gradient(180deg,#ff6a5a,#c81f10);color:#310502;box-shadow:0 0 10px #ff3a22}\n  .jmind{position:absolute;z-index:3;cursor:pointer;border-radius:3px;background:linear-gradient(180deg,#14171a,#0a0c0e);border:1px solid #000;\n    display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;box-shadow:inset 0 1px 2px #000b;padding:1px}\n  .jmind b,.jmind span{font-size:5px;font-weight:900;letter-spacing:.6px;line-height:1;color:#25333f;\n    border:1px solid #1b242c;border-radius:2px;padding:1px 3px;width:86%;text-align:center;box-sizing:border-box}\n  .jmind.on b{color:#7fe0ff;border-color:#2a6a86;text-shadow:0 0 6px #37a2ff}\n  .jmind:not(.on) span{color:#7fe0ff;border-color:#2a6a86;text-shadow:0 0 6px #37a2ff}\n\n  /* aberturas de mídia (USB / SD) — decorativas, mas ensinadas */\n  .slotm{position:absolute;z-index:2;cursor:pointer;border-radius:3px;\n    background:linear-gradient(180deg,#0a0b0d,#15181b 60%,#0a0b0d);border:1px solid #000;\n    box-shadow:inset 0 2px 6px #000d, 0 1px 0 #ffffff12}\n  .slotm i{position:absolute;left:8%;right:8%;top:26%;height:26%;border-radius:2px;background:#05060700;box-shadow:inset 0 0 0 1px #2a2f35}\n\n  .dispreg{position:absolute;background:transparent}\n  .jogc,.dispc{position:absolute;pointer-events:none;z-index:1}\n  .joghit{position:absolute;cursor:grab;border-radius:50%;touch-action:none;z-index:5}\n  .joghit:active{cursor:grabbing}\n  .hit{position:absolute;cursor:pointer;z-index:6;border-radius:5px}\n  body.debug .hit{background:#00e5ff22;box-shadow:inset 0 0 0 1px #00e5ff}\n\n  .teach{display:flex;align-items:center;gap:8px;background:#0c0e12;border:1px solid #2a2f37;border-radius:9px;padding:7px 11px;min-height:38px}\n  .teach .k{font-size:10px;font-weight:900;color:var(--blue);background:#0f1a28;border:1px solid #234;border-radius:5px;padding:3px 7px;white-space:nowrap}\n  .teach .d{font-size:11.5px;color:#cdd5e0;line-height:1.25}.teach .d b{color:#fff}\n&lt;/style&gt;\n&lt;style&gt;/* SMU: a barra do sim some da TELA, mas continua no DOM — apagar mata o init() */\n.util{display:none!important}&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;stage&quot;&gt;\n&lt;div class=&quot;wrap&quot;&gt;\n\n  &lt;div class=&quot;util&quot;&gt;\n    &lt;div class=&quot;brand&quot;&gt;&lt;b&gt;SMU&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;PRO • PIONEER CDJ-2000NXS2&lt;/span&gt;&lt;/div&gt;\n    &lt;span class=&quot;pill&quot;&gt;&lt;span class=&quot;dot&quot; id=&quot;acDot&quot;&gt;&lt;/span&gt; Áudio &lt;b id=&quot;acState&quot;&gt;clique em Ligar&lt;/b&gt;&lt;/span&gt;\n    &lt;div class=&quot;mission&quot;&gt;\n      &lt;span class=&quot;idx&quot; id=&quot;mIdx&quot;&gt;MISSÃO 1/6&lt;/span&gt;\n      &lt;div class=&quot;txt&quot;&gt;&lt;b id=&quot;mTitle&quot;&gt;Dê play&lt;/b&gt;&lt;br&gt;&lt;small id=&quot;mHint&quot;&gt;Aperte PLAY/PAUSE (botão do anel verde).&lt;/small&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;span class=&quot;spacer&quot;&gt;&lt;/span&gt;\n    &lt;button class=&quot;btnp ghost&quot; id=&quot;btnReset&quot;&gt;Reiniciar&lt;/button&gt;\n    &lt;button class=&quot;btnp&quot; id=&quot;btnStart&quot;&gt;▶ Ligar áudio&lt;/button&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;deck&quot; id=&quot;deck&quot;&gt;\n    &lt;div class=&quot;rear&quot;&gt;&lt;/div&gt;\n    &lt;div class=&quot;biglogo&quot;&gt;Pioneer Dj&lt;/div&gt;\n    &lt;div class=&quot;model&quot;&gt;&lt;b&gt;CDJ-2000NXS2&lt;/b&gt;&lt;i&gt;MULTI PLAYER&lt;/i&gt;&lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;teach&quot; id=&quot;teach&quot;&gt;\n    &lt;span class=&quot;k&quot; id=&quot;tK&quot;&gt;CDJ-2000NXS2&lt;/span&gt;\n    &lt;span class=&quot;d&quot; id=&quot;tD&quot;&gt;Passe o mouse ou toque num controle para aprender o que ele faz. Aperte &lt;b&gt;Ligar áudio&lt;/b&gt; e comece pelo &lt;b&gt;PLAY/PAUSE&lt;/b&gt;.&lt;/span&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst $=(s,r=document)=&gt;r.querySelector(s), $$=(s,r=document)=&gt;[...r.querySelectorAll(s)];\nconst clamp=(v,a,b)=&gt;v&lt;a?a:v&gt;b?b:v;\nif(location.hash.includes(&quot;debug&quot;))document.body.classList.add(&quot;debug&quot;);\nconst deck=$(&quot;#deck&quot;);\nfunction pct(el,x,y,w,h){ el.style.left=x+&quot;%&quot;; el.style.top=y+&quot;%&quot;; if(w!=null)el.style.width=w+&quot;%&quot;; if(h!=null)el.style.height=h+&quot;%&quot;; }\n\n/* ===========================================================================\n   POSIÇÕES MEDIDAS NO DIAGRAMA OFICIAL &quot;Control panel&quot; (Operating Instructions\n   CDJ-2000NXS2, pág. 13) — método QUADRANTES: X=ALTURA X1..X10, Y=LARGURA Y1..Y8.\n   Painel de referência 1138 x 1475 px → [x,y,w,h] em % do painel.\n   =========================================================================== */\nconst POS={\n usbport:[1.14,5.56,6.94,4.41], usbstop:[8.61,10.1,3.69,2.85], sdslot:[1.32,14.71,11.25,4.95],\n srcrb:[16.96,4.54,4.75,1.69], srclink:[16.96,8,4.75,1.69], srcusb:[16.96,11.53,4.75,1.69],\n srcsd:[16.96,15.05,4.75,1.69], srcdisc:[16.96,18.58,4.75,1.69],\n timemode:[17.31,23.05,4.04,3.12], quantize:[17.84,27.39,2.99,2.31],\n browse:[27.59,4.47,9.84,2.03], taglist:[38.93,4.47,9.84,2.03], info:[50.26,4.47,9.84,2.03], menu:[61.6,4.47,9.84,2.03],\n display:[24.78,8,50.35,23.12],\n back:[76.1,7.59,4.31,2.71], tagtrack:[80.58,7.59,4.57,2.71],\n // rotativo: eixo = a emenda BACK|TAG TRACK (= emenda TRACK FILTER|SHORT CUT). Medido no manual\n // oficial (&quot;Control panel&quot;, p.13): eixo em 80,58% da largura, encostado na borda do LCD (74,96%),\n // nunca por cima dele. Estava em 74,43 (eixo 80,14) e invadia o visor.\n rotary:[74.87,11.59,11.42,8.81],\n trackfilter:[76.1,20.07,4.31,3.53], shortcut:[80.58,20.07,4.57,3.53], eject:[89.63,10.51,6.85,5.29],\n hcA:[3.25,24.88,7.38,3.12], hcB:[3.25,30.92,7.38,3.12], hcC:[3.25,36.95,7.38,3.12], hcD:[3.25,42.98,7.38,3.12],\n hccall:[0.88,49.22,2.99,2.31], bank:[5.89,49.36,2.2,2.03], hcdelete:[9.49,49.15,3.16,2.44],\n direction:[2.46,54.98,5.54,4.2], revind:[9.4,58.17,3.51,1.63],\n trkprev:[1.76,65.08,4.39,3.39], trknext:[7.91,65.08,4.39,3.39],\n srchback:[1.76,71.86,4.39,3.39], srchfwd:[7.91,71.86,4.39,3.39],\n cue:[1.05,78.85,9.67,7.46], play:[1.05,89.97,9.67,7.46],\n loopin:[15.73,35.53,5.18,4], loopout:[23.81,35.53,5.18,4], reloop:[33.83,35.93,4.31,3.32],\n beatloop:[16.34,42.31,3.78,2.92], slip:[16.61,47.12,3.25,2.51],\n callprev:[63.27,36.41,2.64,2.03], callnext:[68.98,36.41,2.64,2.03],\n deletebt:[75.66,36,3.69,2.85], memory:[81.9,36.27,2.99,2.31],\n jogadj:[76.1,41.83,5.1,3.93], touchbrake:[90.33,26.98,5.1,3.93], releasestart:[90.33,34.24,5.1,3.93],\n jogmodeind:[87.17,40.68,4.83,3.39], jogmode:[93.15,41.02,4.83,2.71],\n sync:[87.52,48.27,4.57,3.53], master:[93.76,48.27,4.57,3.53],\n temporange:[91.39,54.78,2.81,2.17], mastertempo:[91.21,60.47,3.25,2.51],\n tempo:[89.46,64.68,6.85,29.49], temporeset:[81.81,78.17,3.08,2.37],\n jog:[15.99,39.12,67.84,52.34]\n};\nconst AR=329/453;                      // 329 x 453 mm — proporção real do painel (largura/profundidade)\n/* elementos que precisam ficar CIRCULARES (altura = largura × AR, centro preservado) */\nconst ROUND=new Set([&quot;usbstop&quot;,&quot;timemode&quot;,&quot;quantize&quot;,&quot;rotary&quot;,&quot;eject&quot;,&quot;hccall&quot;,&quot;hcdelete&quot;,&quot;trkprev&quot;,&quot;trknext&quot;,\n  &quot;srchback&quot;,&quot;srchfwd&quot;,&quot;cue&quot;,&quot;play&quot;,&quot;loopin&quot;,&quot;loopout&quot;,&quot;reloop&quot;,&quot;beatloop&quot;,&quot;slip&quot;,&quot;callprev&quot;,&quot;callnext&quot;,\n  &quot;deletebt&quot;,&quot;memory&quot;,&quot;jogadj&quot;,&quot;touchbrake&quot;,&quot;releasestart&quot;,&quot;sync&quot;,&quot;master&quot;,&quot;temporange&quot;,&quot;mastertempo&quot;,&quot;temporeset&quot;,&quot;jog&quot;]);\n\n/* textos vindos do manual oficial (Part names and functions, p.13-15) */\nconst CTRL=[\n {act:&quot;play&quot;,kind:&quot;big&quot;,cls:&quot;play&quot;,cap:&quot;▶/❙❙&quot;,k:&quot;PLAY/PAUSE ▶/❙❙&quot;,d:&quot;Toca e pausa. &lt;b&gt;Acende&lt;/b&gt; tocando e &lt;b&gt;pisca&lt;/b&gt; em pausa. No modo VINYL o prato continua vivo sob o dedo.&quot;},\n {act:&quot;cue&quot;,kind:&quot;big&quot;,cls:&quot;cue&quot;,cap:&quot;CUE&quot;,k:&quot;CUE&quot;,d:&quot;Acende quando há um cue gravado; pisca quando dá para gravar um novo em pausa. Tocando, volta ao cue e pausa (&lt;b&gt;back-cue&lt;/b&gt;).&quot;},\n {act:&quot;hcA&quot;,kind:&quot;pad&quot;,k:&quot;HOT CUE A / E&quot;,d:&quot;Ponto quente. Aperte para gravar no ponto atual; aperte de novo para &lt;b&gt;saltar&lt;/b&gt;. O BANK troca entre A–D e E–H (8 hot cues).&quot;},\n {act:&quot;hcB&quot;,kind:&quot;pad&quot;,k:&quot;HOT CUE B / F&quot;,d:&quot;Segundo ponto quente do banco. Salto instantâneo, sem perder a batida quando o QUANTIZE está ligado.&quot;},\n {act:&quot;hcC&quot;,kind:&quot;pad&quot;,k:&quot;HOT CUE C / G&quot;,d:&quot;Terceiro ponto quente do banco. A cor de cada pastilha vem do que foi gravado no rekordbox.&quot;},\n {act:&quot;hcD&quot;,kind:&quot;pad&quot;,k:&quot;HOT CUE D / H&quot;,d:&quot;Quarto ponto quente do banco. Com CALL/DELETE você chama ou apaga hot cues salvos.&quot;},\n {act:&quot;hccall&quot;,kind:&quot;rbtn&quot;,txt:&quot;◄&quot;,k:&quot;HOT CUE CALL&quot;,d:&quot;Chama os hot cues gravados na mídia (SD/USB/rekordbox) para as pastilhas do banco em uso.&quot;},\n {act:&quot;bank&quot;,kind:&quot;btn&quot;,txt:&quot;&quot;,k:&quot;HOT CUE BANK&quot;,d:&quot;Troca o banco das pastilhas entre &lt;b&gt;HOT CUE A, B, C, D&lt;/b&gt; e &lt;b&gt;HOT CUE E, F, G, H&lt;/b&gt; — 8 hot cues no total.&quot;},\n {act:&quot;hcdelete&quot;,kind:&quot;rbtn&quot;,txt:&quot;✕&quot;,k:&quot;HOT CUE DELETE&quot;,d:&quot;Apaga os hot cues do banco em uso.&quot;},\n {act:&quot;loopin&quot;,kind:&quot;rbtn&quot;,cls:&quot;loop&quot;,k:&quot;LOOP IN/CUE (IN ADJUST)&quot;,d:&quot;Marca o &lt;b&gt;início&lt;/b&gt; do loop no ponto atual, ao vivo. Segurando, entra no ajuste fino do ponto de entrada.&quot;},\n {act:&quot;loopout&quot;,kind:&quot;rbtn&quot;,cls:&quot;loop&quot;,k:&quot;LOOP OUT (OUT ADJUST)&quot;,d:&quot;Marca o &lt;b&gt;fim&lt;/b&gt; do loop: a faixa passa a repetir o trecho entre IN e OUT. Segurando, ajusta o ponto de saída.&quot;},\n {act:&quot;reloop&quot;,kind:&quot;rbtn&quot;,cls:&quot;loop&quot;,k:&quot;RELOOP/EXIT&quot;,d:&quot;Sai do loop (volta a tocar normal) ou refaz o último loop gravado (reloop).&quot;},\n {act:&quot;beatloop&quot;,kind:&quot;rbtn&quot;,cls:&quot;loop&quot;,k:&quot;4/8BEAT (LOOP CUTTER)&quot;,d:&quot;Loop automático de &lt;b&gt;4 tempos&lt;/b&gt; (segurando, 8). Já dentro do loop, corta o loop pela metade — é o &lt;b&gt;loop cutter&lt;/b&gt;.&quot;},\n {act:&quot;slip&quot;,kind:&quot;rbtn&quot;,cls:&quot;grn&quot;,k:&quot;SLIP&quot;,d:&quot;Modo SLIP: a música continua correndo por baixo enquanto você faz loop, scratch ou reverso — ao soltar, ela volta onde estaria.&quot;},\n {act:&quot;direction&quot;,kind:&quot;lever&quot;,k:&quot;DIRECTION FWD/REV/SLIP REV&quot;,d:&quot;Alavanca de sentido. &lt;b&gt;FWD&lt;/b&gt; normal, &lt;b&gt;REV&lt;/b&gt; toca de trás para frente, &lt;b&gt;SLIP REV&lt;/b&gt; reverte com a música correndo por baixo.&quot;},\n {act:&quot;revind&quot;,kind:&quot;ind&quot;,txt:&quot;REV&quot;,k:&quot;Indicador REV&quot;,d:&quot;Acende quando a reprodução está invertida (para trás).&quot;},\n {act:&quot;trkprev&quot;,kind:&quot;rbtn&quot;,txt:&quot;❙◄◄&quot;,k:&quot;TRACK SEARCH ❙◄◄&quot;,d:&quot;Procura o começo das faixas: volta para a faixa anterior.&quot;},\n {act:&quot;trknext&quot;,kind:&quot;rbtn&quot;,txt:&quot;►►❙&quot;,k:&quot;TRACK SEARCH ►►❙&quot;,d:&quot;Procura o começo das faixas: avança para a próxima faixa.&quot;},\n {act:&quot;srchback&quot;,kind:&quot;rbtn&quot;,txt:&quot;◄◄&quot;,k:&quot;SEARCH ◄◄&quot;,d:&quot;Enquanto segurado, rebobina dentro da faixa (busca rápida para trás).&quot;},\n {act:&quot;srchfwd&quot;,kind:&quot;rbtn&quot;,txt:&quot;►►&quot;,k:&quot;SEARCH ►►&quot;,d:&quot;Enquanto segurado, avança dentro da faixa (busca rápida para frente).&quot;},\n {act:&quot;usbport&quot;,kind:&quot;slotm&quot;,k:&quot;Entrada USB&quot;,d:&quot;Encaixe do pen drive. A luz pisca enquanto o player conversa com a mídia — nunca puxe piscando.&quot;},\n {act:&quot;usbstop&quot;,kind:&quot;rbtn&quot;,txt:&quot;■&quot;,k:&quot;USB STOP&quot;,d:&quot;Segure por &lt;b&gt;2 segundos&lt;/b&gt; antes de tirar o pen drive. É o que evita corromper a mídia.&quot;},\n {act:&quot;sdslot&quot;,kind:&quot;slotm&quot;,k:&quot;Entrada de cartão SD&quot;,d:&quot;Porta e slot do cartão SD. Abra a tampa para inserir ou tirar o cartão.&quot;},\n {act:&quot;srcrb&quot;,kind:&quot;btn&quot;,cls:&quot;src&quot;,txt:&quot;rekordbox&quot;,k:&quot;rekordbox&quot;,d:&quot;Toca as músicas da biblioteca do rekordbox no computador ou celular.&quot;},\n {act:&quot;srclink&quot;,kind:&quot;btn&quot;,cls:&quot;src&quot;,txt:&quot;LINK&quot;,k:&quot;LINK&quot;,d:&quot;Toca a mídia (SD/USB) que está &lt;b&gt;em outro player&lt;/b&gt; pela rede PRO DJ LINK — e também dá acesso ao software de DJ.&quot;},\n {act:&quot;srcusb&quot;,kind:&quot;btn&quot;,cls:&quot;src&quot;,txt:&quot;USB&quot;,k:&quot;USB&quot;,d:&quot;Toca os arquivos do pen drive encaixado neste player.&quot;},\n {act:&quot;srcsd&quot;,kind:&quot;btn&quot;,cls:&quot;src&quot;,txt:&quot;SD&quot;,k:&quot;SD&quot;,d:&quot;Toca os arquivos do cartão SD deste player.&quot;},\n {act:&quot;srcdisc&quot;,kind:&quot;btn&quot;,cls:&quot;src&quot;,txt:&quot;DISC&quot;,k:&quot;DISC&quot;,d:&quot;Toca CD, CD-ROM ou DVD-ROM na gaveta.&quot;},\n {act:&quot;timemode&quot;,kind:&quot;rbtn&quot;,txt:&quot;T&quot;,k:&quot;TIME MODE / AUTO CUE&quot;,d:&quot;Um toque troca o tempo mostrado (&lt;b&gt;REMAIN&lt;/b&gt; ↔ &lt;b&gt;ELAPSED&lt;/b&gt;). Segurando 1 s, liga/desliga o AUTO CUE (pula o silêncio da entrada).&quot;},\n {act:&quot;quantize&quot;,kind:&quot;rbtn&quot;,txt:&quot;Q&quot;,k:&quot;QUANTIZE&quot;,d:&quot;Cola cue, hot cue e loop na &lt;b&gt;batida mais próxima&lt;/b&gt; da grade do rekordbox. Com ele ligado, hot cue, loop, reverso e slip não quebram o compasso.&quot;},\n {act:&quot;browse&quot;,kind:&quot;btn&quot;,cls:&quot;top&quot;,txt:&quot;BROWSE&quot;,k:&quot;BROWSE / SEARCH&quot;,d:&quot;Abre a tela [BROWSE] para navegar na mídia. Segurando 1 s, abre a busca por texto [SEARCH].&quot;},\n {act:&quot;taglist&quot;,kind:&quot;btn&quot;,cls:&quot;top&quot;,txt:&quot;TAG LIST&quot;,k:&quot;TAG LIST&quot;,d:&quot;Abre a lista de músicas marcadas (tag list) — sua fila de próximas.&quot;},\n {act:&quot;info&quot;,kind:&quot;btn&quot;,cls:&quot;top&quot;,txt:&quot;INFO&quot;,k:&quot;INFO / LINK INFO&quot;,d:&quot;Mostra os detalhes da faixa carregada (e o que está tocando nos outros players em LINK).&quot;},\n {act:&quot;menu&quot;,kind:&quot;btn&quot;,cls:&quot;top&quot;,txt:&quot;MENU&quot;,k:&quot;MENU / UTILITY&quot;,d:&quot;Um toque abre o menu. Segurando 1 s abre o [UTILITY] — as preferências do player.&quot;},\n {act:&quot;display&quot;,kind:&quot;disp&quot;,k:&quot;Tela principal (LCD 7\\&quot;)&quot;,d:&quot;Visor colorido de 7 polegadas: forma de onda ampliada em cores, forma de onda da faixa inteira, tempo, BPM, ±RANGE, hot cues, LOOP e QUANTIZE.&quot;},\n {act:&quot;back&quot;,kind:&quot;btn&quot;,cls:&quot;arcT&quot;,txt:&quot;BACK&quot;,k:&quot;BACK&quot;,d:&quot;Volta uma tela. Segurando 1 s, sobe direto para o topo da navegação.&quot;},\n {act:&quot;tagtrack&quot;,kind:&quot;btn&quot;,cls:&quot;arcT&quot;,txt:&quot;TAG&lt;br&gt;TRACK&quot;,k:&quot;TAG TRACK / REMOVE&quot;,d:&quot;Põe e tira a faixa da tag list.&quot;},\n {act:&quot;rotary&quot;,kind:&quot;knurl&quot;,k:&quot;Seletor rotativo&quot;,d:&quot;Gire para mover o cursor na lista; &lt;b&gt;aperte&lt;/b&gt; para entrar/carregar. É o volante da navegação.&quot;},\n {act:&quot;trackfilter&quot;,kind:&quot;btn&quot;,cls:&quot;arcB&quot;,txt:&quot;TRACK&lt;br&gt;FILTER&quot;,k:&quot;TRACK FILTER / EDIT&quot;,d:&quot;Filtra as faixas pelas marcações do rekordbox (BPM, KEY, tags).&quot;},\n {act:&quot;shortcut&quot;,kind:&quot;btn&quot;,cls:&quot;arcB&quot;,txt:&quot;SHORT&lt;br&gt;CUT&quot;,k:&quot;SHORTCUT&quot;,d:&quot;Atalho direto para as telas TRACK, PLAYLIST e SEARCH.&quot;},\n {act:&quot;eject&quot;,kind:&quot;rbtn&quot;,txt:&quot;⏏&quot;,k:&quot;DISC EJECT ⏏&quot;,d:&quot;Ejeta o disco. No simulador, volta a faixa ao começo.&quot;},\n {act:&quot;touchbrake&quot;,kind:&quot;knob&quot;,k:&quot;VINYL SPEED ADJUST — TOUCH/BRAKE&quot;,d:&quot;Regula a &lt;b&gt;rapidez com que a música para&lt;/b&gt; quando você toca no topo do prato (ou aperta pause). É o freio do vinil.&quot;},\n {act:&quot;releasestart&quot;,kind:&quot;knob&quot;,k:&quot;VINYL SPEED ADJUST — RELEASE/START&quot;,d:&quot;Regula a &lt;b&gt;rapidez com que a música volta&lt;/b&gt; à velocidade normal quando você solta o prato.&quot;},\n {act:&quot;callprev&quot;,kind:&quot;rbtn&quot;,txt:&quot;◄&quot;,k:&quot;CUE/LOOP CALL ◄ (LOOP 1/2X)&quot;,d:&quot;Chama o cue/loop salvo anterior. Durante o loop, &lt;b&gt;corta o loop pela metade&lt;/b&gt;.&quot;},\n {act:&quot;callnext&quot "mixer","sub":"4 canais · padrao de clube","nome":"Pioneer DJM-900NXS2","html":"&lt;!doctype html&gt;\r\n&lt;html lang=&quot;pt-BR&quot;&gt;\r\n&lt;head&gt;\n&lt;script&gt;/* PONTE SMU */\n/* ---------------------------------------------------------------------------\n   CAIXA-PRETA — primeira coisa do arquivo, de proposito.\n   O iframe e srcdoc com sandbox=&quot;allow-scripts&quot;: origem OPACA. O pai NAO\n   consegue ler o console dele, entao um erro de script dentro do aparelho\n   sumia sem deixar rastro e a gente ficava adivinhando. Daqui em diante todo\n   erro sobe para a aula por postMessage.                                    */\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function grita(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  window.__SMU_ERROS = [];\n  addEventListener(&quot;error&quot;, function(e){\n    var m = {smu:&quot;erroJS&quot;, msg:String(e.message||e.type), src:String(e.filename||&quot;&quot;), linha:e.lineno||0};\n    window.__SMU_ERROS.push(m); grita(m);\n  }, true);\n  addEventListener(&quot;unhandledrejection&quot;, function(e){\n    var r = e.reason, m = {smu:&quot;erroJS&quot;, msg:&quot;promessa: &quot;+String((r&amp;&amp;r.message)||r), src:&quot;&quot;, linha:0};\n    window.__SMU_ERROS.push(m); grita(m);\n  });\n  /* SONDA: a aula pergunta, o aparelho responde de dentro da caixa opaca.\n     E so leitura — nao muda comportamento nenhum.                           */\n  addEventListener(&quot;message&quot;, function(e){\n    var d=e.data; if(!d||d.smu!==&quot;probe&quot;) return;\n    var r; try{ r = (0,eval)(d.expr); }catch(err){ r = &quot;ERRO: &quot;+(err&amp;&amp;err.message||err); }\n    try{ r = JSON.parse(JSON.stringify(r)); }catch(_){ r = String(r); }\n    grita({smu:&quot;probeOk&quot;, id:d.id, val:r});\n  });\n})();\n/* ---------------------------------------------------------------------------\n   PRATO EM BRANCO — causa achada medindo,
