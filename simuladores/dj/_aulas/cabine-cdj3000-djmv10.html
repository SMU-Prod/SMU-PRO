<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Monte a sua cabine (SMU)</title>
<style>
/* ============================================================================
   MOLDURA DAS DUAS AULAS DA CABINE

   REGRA DE OURO DESTE ARQUIVO (ordem do dono, 29/07/2026):
   "na barra superior, ponha janelas que abrindo tem as informacoes, mas algo
    que nao ocupe a tela. Deixa a maior parte da tela para as CDJs e mixers."

   Por isso:
   - NAO existe coluna lateral, nem fita de passos, nem paragrafo embaixo da
     mesa. Tudo isso virou POPOVER ancorado num botao da barra.
   - O #palco recebe TODA a altura que sobra (flex:1) e os aparelhos moram nele.
   - O popover e position:ABSOLUTE. Nunca fixed: a aula roda dentro de iframe,
     e fixed em iframe se ancora no iframe, nao na tela do aluno.
   - Nada de escalar a pagina inteira com transform (era o que fazia tudo virar
     miniatura). Quem escala e SO o simulador, dentro da propria moldura dele.
   ============================================================================ */
  :root{
    --ink:#e9eef7; --amber:#ffae1a; --green:#39d271; --blue:#37a2ff; --red:#ff4636;
    --line:#2a2f37; --painel:#0c0e12; --barra:46px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:radial-gradient(1100px 640px at 50% -10%,#26292e,#0a0b0d 62%),#08090b;
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    user-select:none;
  }
  #app{display:flex;flex-direction:column;height:100%;width:100%}

  /* ---------------- BARRA SUPERIOR (compacta) ---------------- */
  #barra{
    flex:0 0 auto;position:relative;z-index:60;
    display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
    min-height:var(--barra);padding:4px 8px;
    background:linear-gradient(180deg,#20232a,#14161a);
    border-bottom:1px solid #05070a;
  }
  .marca{display:flex;align-items:baseline;gap:5px;flex:0 0 auto}
  .marca b{font-size:14px;letter-spacing:1px}
  .marca .m{font-size:8px;letter-spacing:1.5px;color:#8a94a4;text-transform:uppercase;white-space:nowrap}
  #passos{display:flex;gap:4px;flex:0 0 auto;margin-left:4px}
  .pa{
    font:inherit;font-size:9.5px;font-weight:800;letter-spacing:.3px;
    border:1px solid #1c2229;background:#11151a;color:#8b97a9;
    border-radius:14px;padding:5px 9px;cursor:pointer;white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .pa.on{background:#151d2a;border-color:var(--blue);color:#cfe6ff}
  .pa.ok{background:#0f2418;border-color:#1e5c38;color:#9fe3bb}
  .pa:disabled{opacity:.35;cursor:not-allowed}
  .vazio{flex:1 1 auto;min-width:4px}

  .btn{
    font:inherit;font-size:10px;font-weight:800;letter-spacing:.3px;
    border:1px solid #262c34;border-radius:8px;padding:7px 10px;cursor:pointer;
    color:#cbd4e0;background:linear-gradient(180deg,#1c2026,#12151a);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:#37414d}
  .btn.on{border-color:var(--blue);color:#cfe6ff;background:#152232}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn .sel{font-size:9px;font-weight:900;border-radius:9px;padding:1px 6px;background:#3a2a10;color:#ffc98a}
  .btn .sel.zero{background:#123a2a;color:#7df0a8}
  .ponto{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 7px #ff463699}
  .ponto.ok{background:var(--green);box-shadow:0 0 7px #39d27199}

  /* ---------------- POPOVER (absolute, nunca fixed) ---------------- */
  .pop{
    display:none;position:absolute;top:calc(100% + 4px);right:6px;z-index:70;
    width:min(430px,calc(100vw - 16px));max-height:min(70vh,520px);overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:#0d1015;border:1px solid #2b323b;border-radius:11px;
    box-shadow:0 18px 44px #000c,0 0 0 1px #ffffff08 inset;padding:11px 12px;
  }
  .pop.on{display:block}
  .pop h4{margin:0 0 8px;font-size:10px;letter-spacing:1.3px;color:#8b97a9;text-transform:uppercase;font-weight:800}
  .pop p{margin:0 0 9px;font-size:11.5px;line-height:1.5;color:#c2cbd6}
  .pop b{color:#fff}
  .pop code{background:#161a20;border-radius:3px;padding:0 3px;font-size:11px}

  .chk{display:flex;gap:7px;align-items:flex-start;padding:7px 8px;border-radius:8px;margin-bottom:5px;
    background:#11151a;border:1px solid #1c2229}
  .chk.ok{background:#0f2418;border-color:#1e5c38}
  .chk .b{width:15px;height:15px;border-radius:50%;flex:0 0 auto;margin-top:1px;background:#2a3038;border:1px solid #000;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#6b7684}
  .chk.ok .b{background:var(--green);color:#062a13}
  .chk .tx{font-size:11px;line-height:1.35;color:#c2cbd6}
  .chk.ok .tx{color:#9fe3bb}
  .chk .tx b{color:#fff}
  .som{margin:2px 0 9px;padding:9px;border-radius:8px;text-align:center;font-size:11.5px;font-weight:800;
    background:#2a1414;border:1px solid #52201c;color:#ff9c90}
  .som.on{background:#0f2a18;border-color:#1e6b3c;color:#7df0a8}
  .elo{margin:0 0 9px;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.45;
    background:#1b1410;border:1px solid #4a3418;color:#ffd9a6}
  .elo b{color:#fff}
  .est{font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;background:#4a2a12;color:#ffc98a;white-space:nowrap}

  /* ---------------- PALCO: os aparelhos ficam com a tela ---------------- */
  #palco{flex:1 1 auto;min-height:0;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px}

  /* -------- passo 1: escolha -------- */
  .razao{font-size:11px;line-height:1.45;color:#9fb0c4;margin:0 2px 8px;padding:7px 9px;border-radius:7px;
    background:#0e1a26;border:1px solid #1d3350}
  .razao b{color:#fff}
  .escolha{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
  .col .lb{font-size:9px;color:#7f8b9c;margin-bottom:5px;letter-spacing:.6px;font-weight:800}
  .opt{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #23282f;border-radius:8px;
    background:linear-gradient(180deg,#171a1f,#101317);cursor:pointer;margin-bottom:5px;
    min-height:42px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
  .opt .ic{width:30px;height:20px;border-radius:3px;flex:0 0 auto;border:1px solid #000;
    background:linear-gradient(180deg,#3b4148,#191c20)}
  .opt.vinil .ic{background:radial-gradient(circle at 50% 50%,#5a6068 16%,#0f1114 18%,#1a1d21 70%)}
  .opt .nm{font-size:11px;font-weight:700;line-height:1.15}
  .opt .tp{font-size:8.5px;color:#7f8b9c}
  .opt .tag{margin-left:auto;font-size:8px;font-weight:900;padding:2px 5px;border-radius:4px;white-space:nowrap}
  .tag.line{background:#123a5c;color:#8fd0ff}
  .tag.phono{background:#4a2a12;color:#ffc98a}
  .tag.aio{background:#123a2a;color:#7df0a8}
  .aio-bloco{margin-top:10px;border-top:1px dashed #232a32;padding-top:9px}
  .aio-bloco .lb{font-size:9px;color:#7f8b9c;margin-bottom:6px;letter-spacing:.6px;font-weight:800}

  /* -------- passo 2 (praticando): A MESA --------
     Cada aparelho ocupa a LARGURA TODA e nunca e cortado: a altura da moldura
     sai do tamanho natural que o proprio simulador informa, entao o fit() dele
     cabe exato. Se os tres nao couberem na altura, todos encolhem juntos —
     encolhe, nao recorta. */
  .mesa{display:flex;gap:6px;align-items:flex-start;justify-content:center;min-height:100%}
  .mesa.coluna{flex-direction:column;align-items:center}
  .mesa.linha{flex-direction:row;align-items:flex-start}
  .apl{display:flex;flex-direction:column;background:#08090b;border:1px solid #1b2027;border-radius:9px;
    overflow:hidden;flex:0 0 auto;max-width:100%}
  .apl .cab{display:flex;align-items:center;gap:7px;padding:4px 7px;background:#12161b;border-bottom:1px solid #1b2027;flex:0 0 auto}
  .apl .cab .nm{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .apl .cab .ch{font-size:9px;font-weight:900;letter-spacing:.5px;padding:2px 6px;border-radius:4px;
    background:#10304a;color:#7fd4ff;border:1px solid #1c4e73;white-space:nowrap}
  .apl .cab .ch.mix{background:#2b1f3a;color:#d3b6ff;border-color:#4b3670}
  .apl .cab .esq{margin-left:auto;display:flex;gap:5px}
  /* --- o caminho do som, à vista --- */
  #rota{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px;
        background:#0e1216;border-bottom:1px solid #1b2027;font-size:10px;line-height:1.35}
  #rota .via{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;
             background:#141a20;border:1px solid #222a33;white-space:nowrap}
  #rota .via.off{opacity:.45}
  #rota .via b{font-weight:900;letter-spacing:.4px}
  #rota .ch1 b{color:#8fd6ff} #rota .ch2 b{color:#ffc98a} #rota .mst b{color:#d3b6ff}
  #rota .db{font-variant-numeric:tabular-nums;color:#cfe6ff;font-weight:800}
  #rota .det{color:#7d8b99}
  #rota .seta{color:#4d5a68;font-weight:900}
  #rota .barra{width:46px;height:5px;border-radius:3px;background:#1d242c;overflow:hidden}
  #rota .barra i{display:block;height:100%;background:linear-gradient(90deg,#2f7d4f,#8fd66a)}
  #rota .barra.q i{background:linear-gradient(90deg,#8a6d2a,#ffcf5a)}
  /* A MOLDURA e so a janela. Quem encolhe e o IFRAME INTEIRO, por transform:
     medida em px (fonte, borda, padding) nao escala sozinha — escalar o
     contexto todo resolve tudo junto e nunca encavala. */
  .moldura{position:relative;background:#08090b;overflow:hidden;width:100%}
  .moldura iframe{display:block;border:0;background:#08090b;position:absolute;left:50%;top:0;
    transform-origin:top center}
  /* aparelho ampliado: cobre o palco inteiro. Nao e fixed — e absolute no palco. */
  .apl.ampliado{position:absolute;left:6px;right:6px;top:6px;bottom:6px;z-index:40;border-color:var(--blue);
    width:auto !important;max-width:none}
  .apl.ampliado .moldura{flex:1 1 auto}
  .mesa.temAmpliado{display:block;min-height:0}
  .mesa.temAmpliado .apl:not(.ampliado){display:none}
  html.ampliado #barra{min-height:32px;padding:2px 6px}
  html.ampliado .marca,html.ampliado #passos{display:none}

  /* -------- passo 2 (cabeamento): AS TRASEIRAS -------- */
  .cabos-topo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .cabo-b{font:inherit;font-size:10px;font-weight:900;letter-spacing:.4px;border-radius:8px;padding:8px 12px;cursor:pointer;
    border:1px solid #2a3038;color:#c2cbd6;background:linear-gradient(180deg,#171a1f,#101317);
    min-height:38px;touch-action:manipulation}
  .cabo-b.on{border-color:var(--amber);color:#ffd79a;background:#2a1f0d;box-shadow:0 0 0 1px var(--amber) inset}
  .cabo-b .pt{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .pt.ac{background:#e0a33a} .pt.rca{background:#e05a4a} .pt.link{background:#4ab0e0}
  .instr{font-size:10.5px;line-height:1.4;color:#9fb0c4;margin-left:2px}
  .instr b{color:#fff}

  .bancada{position:relative;display:flex;flex-direction:column;gap:9px}
  .painel{position:relative;border-radius:7px;border:1px solid #05070a;
    background:linear-gradient(180deg,#2c3037,#181b20 55%,#0f1216);
    box-shadow:0 5px 14px #000a, inset 0 1px 0 #ffffff14;width:100%}
  .painel .tit{position:absolute;top:-13px;left:3px;font-size:9px;font-weight:800;color:#9aa4b1;letter-spacing:.4px;white-space:nowrap}
  .painel .fonte{position:absolute;top:-13px;right:3px;font-size:8px;color:#6b7684;white-space:nowrap}
  .painel .grade{position:absolute;left:0;right:0;top:8%;height:22%;
    background:repeating-linear-gradient(90deg,#0b0e11 0 2px,#191d22 2px 5px);opacity:.5;pointer-events:none}
  .con{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-width:16px;min-height:16px}
  .con .pino{border-radius:3px;border:1.5px solid #6b7684;background:linear-gradient(180deg,#2b2f35,#0f1215);
    width:100%;height:100%;min-width:14px;min-height:12px}
  .con .sig{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;
    font-size:6.5px;font-weight:800;color:#94a0ae;letter-spacing:.2px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}
  .con.clicavel{cursor:pointer;touch-action:manipulation}
  .con.clicavel::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(100%,30px);height:max(100%,30px)}                 /* alvo de dedo */
  .con.clicavel:hover .pino{box-shadow:0 0 0 2px #fff6}
  .con.sel .pino{box-shadow:0 0 0 3px var(--amber),0 0 12px var(--amber)}
  .con.ok .pino{border-color:var(--green);background:linear-gradient(180deg,#14351f,#0b1d12)}
  .con.rca .pino{border-radius:50%;background:radial-gradient(circle at 50% 32%,#d8dde3,#8f959c 58%,#43484e)}
  .con.rca.entrada .pino{border-color:#b03a2e}
  .con.link .pino{border-radius:2px;background:linear-gradient(180deg,#1a1e23,#0a0c0f);border-color:#4ab0e0}
  .con.gnd .pino{border-radius:50%;background:radial-gradient(circle at 50% 32%,#c9a227,#6b5510);border-color:#3a2f08}
  .con.morto .pino{opacity:.45;border-color:#3a4048}
  .con.canal .sig{color:#ffc98a}

  svg.fios{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}

  .regua{position:relative;display:flex;align-items:center;gap:12px;padding:0 12px;height:46px;border-radius:7px;
    background:linear-gradient(180deg,#23272d,#131619);border:1px solid #05070a;
    box-shadow:inset 0 1px 0 #ffffff12,0 4px 10px #0009}
  .regua .rt{font-size:8.5px;font-weight:900;color:#8a94a4;letter-spacing:1px;white-space:nowrap}
  .tom{width:30px;height:26px;border-radius:3px;cursor:pointer;position:relative;flex:0 0 auto;
    background:linear-gradient(180deg,#101317,#0a0c0f);border:1.5px solid #4a5058;touch-action:manipulation}
  .tom::before,.tom::after{content:"";position:absolute;top:7px;width:3px;height:9px;background:#4a5058;border-radius:1px}
  .tom::before{left:8px} .tom::after{right:8px}
  .tom.ok{border-color:var(--green)} .tom.ok::before,.tom.ok::after{background:var(--green)}
  .tom.sel{box-shadow:0 0 0 3px var(--amber)}
  .chaveac{margin-left:auto;font:inherit;font-size:9px;font-weight:900;padding:7px 11px;border-radius:6px;cursor:pointer;
    background:#3a1a16;border:1px solid #6b241c;color:#ff9c90;letter-spacing:.5px;touch-action:manipulation}
  .chaveac.on{background:#14351f;border-color:#1e6b3c;color:#7df0a8}
  .fonte12{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;
    background:linear-gradient(180deg,#20242a,#111417);border:1px solid #05070a}
  .fonte12 .ft{font-size:8.5px;font-weight:900;color:#8a94a4;letter-spacing:.6px;white-space:nowrap}
  .switch{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:7px;
    background:linear-gradient(180deg,#1d2128,#0f1216);border:1px solid #05070a}
  .switch .st{font-size:8.5px;font-weight:900;color:#7fd4ff;letter-spacing:.6px;white-space:nowrap}

  .semdado{padding:14px;border-radius:8px;background:#1b1410;border:1px solid #4a3418;color:#ffd9a6;
    font-size:11.5px;line-height:1.5}
  .semdado b{color:#fff}

  /* -------- MUSICAS -------- */
  .faixa{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;margin-bottom:4px;
    background:#11151a;border:1px solid #1c2229;font-size:11px}
  .faixa .fn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .faixa .fb{font:inherit;font-size:9px;font-weight:900;border:1px solid #2a3038;border-radius:6px;padding:5px 8px;
    cursor:pointer;color:#aab4c2;background:linear-gradient(180deg,#171a1f,#101317);touch-action:manipulation}
  .faixa .fb.on{border-color:var(--green);color:#7df0a8;background:#0f2418}

  /* alvo de dedo maior no toque */
  @media (pointer:coarse){
    .btn,.pa{min-height:38px}
    .cabo-b{min-height:44px}
    .opt{min-height:50px}
  }
  /* retrato de iPad: a barra nao pode comer altura — quebra em duas linhas curtas */
  @media (max-width:820px){
    .marca .m{display:none}
    #barra{gap:4px;padding:3px 5px}
    .btn{padding:7px 8px;font-size:9.5px}
  }

  /* CONTRATO DE TELA CHEIA (html.smu-fs) — o player da aula avisa, o simulador
     responde SO com CSS. Em tela cheia a barra encolhe e o palco cresce. */
  html.smu-fs #barra{min-height:38px;padding:3px 8px}
  html.smu-fs #palco{padding:4px}
  html.smu-fs .pop{max-height:min(78vh,640px)}
</style>
</head>
<body>
<div id="app">

  <header id="barra">
    <div class="marca"><b>SMU</b><span class="m" id="sub">PRO • CABINE</span></div>
    <div id="passos"></div>
    <span class="vazio"></span>

    <button class="btn" id="bFalta" data-pop="falta">
      <span class="ponto" id="pontoSom"></span>O QUE FALTA <span class="sel" id="selFalta">0</span>
    </button>
    <button class="btn" id="bComo" data-pop="como">COMO FUNCIONA</button>
    <button class="btn" id="bMus" data-pop="mus">MÚSICAS</button>
    <button class="btn" id="btnAmpliar">AMPLIAR</button>
    <button class="btn" id="btnReset">RECOMEÇAR</button>

    <div class="pop" id="pop-falta">
      <h4>O que falta</h4>
      <div class="som" id="som">SEM SOM</div>
      <div id="elo"></div>
      <div id="lista"></div>
    </div>
    <div class="pop" id="pop-como"><h4>Como funciona</h4><div id="como"></div></div>
    <div class="pop" id="pop-mus"><h4>Músicas</h4><div id="mus"></div></div>
  </header>

  <!-- O CAMINHO DO SOM, à vista. O aluno tem de VER que o player da esquerda
       entra no CH1, que quem manda no volume/timbre é o mixer, e que o MASTER
       é o que sai no alto-falante do aparelho dele. -->
  <div id="rota" hidden></div>

  <main id="palco"></main>
</div>

<script>
/* ============================================================================
   1. DADOS INJETADOS PELO GERADOR
   ============================================================================ */
const SIMS = [{"id":"cdj3000","tipo":"deck","sub":"flagship · tela 9\"","nome":"Pioneer CDJ-3000","html":"&lt;!doctype html&gt;\n&lt;html lang=&quot;pt-BR&quot;&gt;\n&lt;head&gt;\n&lt;script&gt;window.__SMU_VISOR={&quot;modo&quot;:&quot;lista&quot;,&quot;toque&quot;:true,&quot;decks&quot;:1,&quot;carga&quot;:&quot;reload&quot;,&quot;demo&quot;:[&quot;ABOVE THE CLOUD E.P.&quot;]};&lt;/script&gt;\n&lt;script&gt;/* PONTE SMU */\n/* ---------------------------------------------------------------------------\n   CAIXA-PRETA — primeira coisa do arquivo, de proposito.\n   O iframe e srcdoc com sandbox=&quot;allow-scripts&quot;: origem OPACA. O pai NAO\n   consegue ler o console dele, entao um erro de script dentro do aparelho\n   sumia sem deixar rastro e a gente ficava adivinhando. Daqui em diante todo\n   erro sobe para a aula por postMessage.                                    */\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function grita(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  window.__SMU_ERROS = [];\n  addEventListener(&quot;error&quot;, function(e){\n    var m = {smu:&quot;erroJS&quot;, msg:String(e.message||e.type), src:String(e.filename||&quot;&quot;), linha:e.lineno||0};\n    window.__SMU_ERROS.push(m); grita(m);\n  }, true);\n  addEventListener(&quot;unhandledrejection&quot;, function(e){\n    var r = e.reason, m = {smu:&quot;erroJS&quot;, msg:&quot;promessa: &quot;+String((r&amp;&amp;r.message)||r), src:&quot;&quot;, linha:0};\n    window.__SMU_ERROS.push(m); grita(m);\n  });\n  /* SONDA: a aula pergunta, o aparelho responde de dentro da caixa opaca.\n     E so leitura — nao muda comportamento nenhum.                           */\n  addEventListener(&quot;message&quot;, function(e){\n    var d=e.data; if(!d||d.smu!==&quot;probe&quot;) return;\n    var r; try{ r = (0,eval)(d.expr); }catch(err){ r = &quot;ERRO: &quot;+(err&amp;&amp;err.message||err); }\n    try{ r = JSON.parse(JSON.stringify(r)); }catch(_){ r = String(r); }\n    grita({smu:&quot;probeOk&quot;, id:d.id, val:r});\n  });\n})();\n/* ---------------------------------------------------------------------------\n   PRATO EM BRANCO — causa achada medindo, nao deduzindo.\n   No simulador AVULSO o jog desenha certo (medido: caixa 244x244, canvas\n   420x420). Embutido, a superficie aparece mas o disco nao. O motivo e que o\n   sim desenha UMA vez no init(); dentro de um iframe com srcdoc o layout ainda\n   nao aconteceu nessa hora, a caixa do canvas vale 0, e o desenho vai para o\n   vazio. Como o jog so e redesenhado quando alguem o gira, ele fica branco\n   para sempre.\n   Conserto no ENCAIXE, sem tocar em simulador nenhum: quando o tamanho real\n   chegar, mandamos o sim desenhar de novo.                                  */\n(function(){\n  var jaOk = false;\n  function redesenhar(){\n    try {\n      /* os sims expoem uma destas: frame() e o padrao da frota */\n      [&quot;frame&quot;,&quot;desenhar&quot;,&quot;render&quot;,&quot;draw&quot;,&quot;drawAll&quot;,&quot;pinta&quot;].forEach(function(n){\n        if (typeof window[n] === &quot;function&quot;) { window[n](); jaOk = true; }\n      });\n      /* muitos recalculam sozinhos no resize */\n      window.dispatchEvent(new Event(&quot;resize&quot;));\n    } catch(e){}\n  }\n  function medir(){\n    var c = document.querySelector('canvas[id*=&quot;jog&quot;],canvas.jogc,canvas');\n    return c ? Math.round(c.getBoundingClientRect().width) : 0;\n  }\n  /* tenta ate a caixa ter largura de verdade — sem laco infinito */\n  var n = 0;\n  var t = setInterval(function(){\n    n++;\n    if (medir() &gt; 0) { redesenhar(); }\n    if (n &gt; 20 || (jaOk &amp;&amp; medir() &gt; 0)) clearInterval(t);\n  }, 100);\n  addEventListener(&quot;load&quot;, redesenhar);\n  /* e sempre que a aula mudar o tamanho do aparelho (ampliar, girar o iPad) */\n  if (window.ResizeObserver) {\n    var ro = new ResizeObserver(function(){ redesenhar(); });\n    addEventListener(&quot;DOMContentLoaded&quot;, function(){ ro.observe(document.body); });\n  }\n})();\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function env(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  function c01(v){ return v&lt;0?0:v&gt;1?1:v; }\n\n  /* ---------- 1. audio: o destino do simulador vira um grafo nosso ---------- */\n  var O = window.AudioContext || window.webkitAudioContext;\n  window.__g=[]; window.__cad=[];\n  /* ⛔ O ganho pedido pela aula tem de SOBREVIVER ao aparelho ainda nao ter\n     ligado o audio. MEDIDO na aula: a aula manda {vol,v:0} para o mixer assim\n     que o estado chega, mas nessa hora o AudioContext do mixer AINDA NAO\n     EXISTE (__cad vazio) — o comando caia no vazio. Quando o aluno tocava no\n     mixer, ele ligava o audio com ganho 1 e as bases de demonstracao DELE\n     tocavam por cima do player. Agora o pedido fica guardado e e aplicado no\n     instante em que o contexto nasce.                                       */\n  var ultVol = {v:1, eq:null, filtros:null, temPedido:false};\n  if(O){\n    function P(){\n      var c=new O(), destReal=c.destination;\n      /* ⛔ PODA. O LOAD do visor RELIGA o audio do aparelho (fecha o contexto e\n         chama startAudio() de novo). Sem podar, __cad[0] fica sendo o contexto\n         MORTO — o pico() mediria silencio para sempre e a aula acusaria\n         &quot;o player nao esta tocando&quot; com a musica no ar. */\n      window.__cad = (window.__cad||[]).filter(function(a){\n        try{ return a.ctx &amp;&amp; a.ctx.state !== &quot;closed&quot;; }catch(e){ return false; } });\n      window.__g = window.__cad.map(function(a){ return a.g; });\n      var pre=c.createGain(); pre.gain.value=1;          /* o sim conecta AQUI */\n      var an=c.createAnalyser(); an.fftSize=512; pre.connect(an);\n      var g=c.createGain(); g.gain.value=1; pre.connect(g);\n      /* ---------------------------------------------------------------\n         A TIRA DE CANAL DO MIXER, DENTRO DO DECK.\n         O audio nao atravessa o iframe, entao o timbre nao pode &quot;vir\n         pronto&quot; do mixer. O que atravessa e a DESCRICAO dos filtros que o\n         mixer tem ligados; aqui existem biquads DE VERDADE, e o som do\n         player passa por eles. Quatro: as 3 bandas do EQ + o COLOR/FILTER.\n         O tipo/frequencia/Q de cada um NAO e chutado aqui — chega do\n         proprio no do mixer (ver a funcao cadeia() no lado mixer). Estes valores\n         iniciais so valem enquanto o mixer nao falou.                  */\n      var lo=c.createBiquadFilter(); lo.type=&quot;lowshelf&quot;;  lo.frequency.value=200;  lo.gain.value=0;\n      var md=c.createBiquadFilter(); md.type=&quot;peaking&quot;;   md.frequency.value=1000; md.Q.value=0.9; md.gain.value=0;\n      var hi=c.createBiquadFilter(); hi.type=&quot;highshelf&quot;; hi.frequency.value=4000; hi.gain.value=0;\n      var col=c.createBiquadFilter(); col.type=&quot;allpass&quot;; col.frequency.value=1000; col.Q.value=1; col.gain.value=0;\n      /* 5a casa: mixer de 4 bandas (DJM-V10) precisa dela alem do FILTER */\n      var col2=c.createBiquadFilter(); col2.type=&quot;allpass&quot;; col2.frequency.value=1000; col2.Q.value=1; col2.gain.value=0;\n      /* torneira de bancada: 1 em producao. Serve para MEDIR sem tocar som\n         na maquina de quem esta testando (window.__SMU_MUDO=1). */\n      var sai=c.createGain(); sai.gain.value = window.__SMU_MUDO ? 0 : 1;\n      g.connect(lo); lo.connect(md); md.connect(hi); hi.connect(col); col.connect(col2);\n      col2.connect(sai); sai.connect(destReal);\n      try{ Object.defineProperty(c,&quot;destination&quot;,{get:function(){return pre},configurable:true}); }catch(e){}\n      var reg={ctx:c,an:an,g:g,lo:lo,md:md,hi:hi,col:col,col2:col2,sai:sai,dest:destReal};\n      reg.f=[lo,md,hi,col,col2];\n      window.__g.push(g); window.__cad.push(reg);\n      if(ultVol.temPedido){                 /* o pedido que chegou antes da hora */\n        g.gain.value = ultVol.v;\n        if(ultVol.eq){ lo.gain.value=ultVol.eq.low||0; md.gain.value=ultVol.eq.mid||0; hi.gain.value=ultVol.eq.hi||0; }\n        if(ultVol.filtros) porFiltros(reg, ultVol.filtros, true);\n      }\n      return c;\n    }\n    P.prototype=O.prototype; window.AudioContext=P; window.webkitAudioContext=P;\n  }\n  function rampa(p,v){ try{\n      if(!isFinite(v)) return;\n      if(Math.abs(p.value-v) &lt; 1e-6) return;         /* ja esta la: nao agenda nada */\n      var t=(window.__cad[0]&amp;&amp;window.__cad[0].ctx?window.__cad[0].ctx.currentTime:0);\n      p.cancelScheduledValues(t); p.setValueAtTime(p.value,t); p.linearRampToValueAtTime(v,t+0.02);\n    }catch(e){ try{ p.value=v; }catch(_){} } }\n  /* ---------------------------------------------------------------------\n     O TIMBRE DO MIXER APLICADO AQUI DENTRO.\n     O parametro fs e a lista de filtros que o mixer REALMENTE tem ligados, cada um\n     {t:tipo, f:frequencia, q:Q, g:ganho em dB}, lida dos nos dele. Nada e\n     inventado deste lado: se o mixer nao mandar, o filtro fica em allpass\n     (transparente), que e o mesmo que nao existir.\n     ⚠️ Rampa LINEAR de 20 ms, que TERMINA. Nada de setTargetAtTime: ele e\n     exponencial e nunca acaba, o parametro vira a-rate e o biquad passa a\n     recalcular coeficiente por amostra (34,5% de CPU na CL5).           */\n  function porFiltros(a, fs, direto){\n    if(!a || !a.f) return;\n    for(var i=0;i&lt;a.f.length;i++){\n      var n=a.f[i], s=fs&amp;&amp;fs[i];\n      if(!s){                                   /* sobra de filtro: transparente */\n        try{ n.type=&quot;allpass&quot;; }catch(e){}\n        if(direto){ try{ n.gain.value=0; }catch(e){} } else rampa(n.gain,0);\n        continue;\n      }\n      try{ if(s.t &amp;&amp; n.type!==s.t) n.type=s.t; }catch(e){}\n      if(direto){\n        try{ if(s.f!=null) n.frequency.value=s.f; if(s.q!=null) n.Q.value=s.q; if(s.g!=null) n.gain.value=s.g; }catch(e){}\n      } else {\n        if(s.f!=null) rampa(n.frequency, s.f);\n        if(s.q!=null) rampa(n.Q, s.q);\n        if(s.g!=null) rampa(n.gain, s.g);\n      }\n    }\n  }\n  function volume(v,eq,filtros){\n    ultVol.v = v; ultVol.eq = eq; if(filtros!==undefined) ultVol.filtros = filtros;\n    ultVol.temPedido = true;\n    (window.__cad||[]).forEach(function(a){\n      rampa(a.g.gain, v);\n      if(filtros) porFiltros(a, filtros, false);\n      else if(eq){ rampa(a.lo.gain, eq.low||0); rampa(a.md.gain, eq.mid||0); rampa(a.hi.gain, eq.hi||0); }\n    });\n  }\n  /* pico ANTES do ganho: diz se o PLAYER esta tocando, nao se o mixer deixou passar */\n  var buf=null;\n  function pico(){\n    var a=(window.__cad||[])[0]; if(!a) return 0;\n    if(!buf||buf.length!==a.an.fftSize) buf=new Uint8Array(a.an.fftSize);\n    a.an.getByteTimeDomainData(buf);\n    var p=0; for(var i=0;i&lt;buf.length;i+=4){ var x=Math.abs(buf[i]-128)/128; if(x&gt;p)p=x; }\n    return p;\n  }\n\n  /* ---------- 1b. VU: o AUDIO nao atravessa o iframe, o SINAL sim ----------\n     O mixer embutido nao recebe audio nenhum — quem toca e o deck, no outro\n     iframe. Entao os medidores dele mediam silencio e ficavam apagados nos\n     dois lugares (canal e master), que foi o que o dono viu.\n\n     ⛔ Nada de inventar escala de dB aqui. Cada simulador ja tem a escala do\n     MANUAL dele (o DJM-900NXS2 tem 15 segmentos por medidor: canal +12..-30 e\n     master +15..-27 dB, conferido na pagina &quot;Control Panel&quot; do manual — e o\n     sim desenha 15). Se a ponte &quot;acendesse N LEDs&quot; estaria reescrevendo essa\n     calibracao por fora.\n     O que a ponte faz e o degrau ANTES: entrega ao analisador do mixer a mesma\n     ONDA que existiria se o cabo estivesse ligado. Dai o codigo do proprio\n     aparelho mede e acende — igualzinho ao avulso, sem tocar em simulador.\n     Como so o analisador e alimentado (nada chega ao destination), NAO SAI SOM.\n\n     Onde mora o analisador (levantado arquivo por arquivo, nao chutado):\n       chans[n].analyser + masterAn ... DJM-450/750MK2/800/900NXS2/V10, X1850\n       d.an / b.an / d.masterAn ....... DJM-600\n       dA.an / dB.an / masterAn ....... DJM-2000\n     Os tres casos leem por getByteTimeDomainData, entao um so remendo serve. */\n  function po(o){ return o &amp;&amp; typeof o===&quot;object&quot;; }\n  /* ---------------------------------------------------------------------\n     OS CANAIS DO MIXER — o mesmo levantamento arquivo por arquivo que ja\n     servia para achar os analisadores serve para achar a TIRA DE CANAL\n     inteira. Cada simulador guarda o canal num objeto so; o que muda e o\n     nome da variavel.                                                   */\n  function achaCanais(){\n    var C={};\n    try{ if(typeof chans!==&quot;undefined&quot; &amp;&amp; po(chans))\n      for(var k in chans){ if(po(chans[k])) C[k]=chans[k]; } }catch(e){}\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof d!==&quot;undefined&quot; &amp;&amp; po(d) &amp;&amp; (d.fader||d.trim)) C[&quot;1&quot;]=d; }catch(e){}\n    try{ if(!C[&quot;2&quot;] &amp;&amp; typeof b!==&quot;undefined&quot; &amp;&amp; po(b) &amp;&amp; (b.fader||b.trim)) C[&quot;2&quot;]=b; }catch(e){}\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof dA!==&quot;undefined&quot; &amp;&amp; po(dA) &amp;&amp; (dA.fader||dA.trim)) C[&quot;1&quot;]=dA; }catch(e){}\n    try{ if(!C[&quot;2&quot;] &amp;&amp; typeof dB!==&quot;undefined&quot; &amp;&amp; po(dB) &amp;&amp; (dB.fader||dB.trim)) C[&quot;2&quot;]=dB; }catch(e){}\n    /* DJM-A9: os canais moram em CH */\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof CH!==&quot;undefined&quot; &amp;&amp; po(CH))\n      for(var j in CH){ if(po(CH[j])) C[j]=CH[j]; } }catch(e){}\n    return C;\n  }\n  /* ⚠️ Procurar por NOME nao basta: ha simulador em que c.ch e o NUMERO do\n     canal e nao o no de ganho. Por isso cada leitor so aceita o que de fato\n     tem o parametro que ele vai ler, e segue procurando quando nao tem.    */\n  function pgan(o,nomes){\n    for(var i=0;i&lt;nomes.length;i++){\n      try{ var n=o[nomes[i]];\n        if(n &amp;&amp; n.gain &amp;&amp; typeof n.gain.value===&quot;number&quot;) return +n.gain.value;\n      }catch(e){}\n    }\n    return null;\n  }\n  function pgan1(n){ try{ return (n &amp;&amp; n.gain &amp;&amp; typeof n.gain.value===&quot;number&quot;) ? +n.gain.value : null; }catch(e){ return null; } }\n  function pbq(o,nomes){\n    for(var i=0;i&lt;nomes.length;i++){\n      try{ var n=o[nomes[i]];\n        if(n &amp;&amp; n.frequency &amp;&amp; typeof n.frequency.value===&quot;number&quot; &amp;&amp; n.type)\n          return {t:String(n.type), f:+n.frequency.value, q:(n.Q?+n.Q.value:1), g:(n.gain?+n.gain.value:0)};\n      }catch(e){}\n    }\n    return null;\n  }\n  /* ---------------------------------------------------------------------\n     CADEIA — o caminho do som DENTRO do mixer, lido dos nos de audio.\n     ⛔ Nao se re-deduz dB por angulo de knob aqui. O simulador ja converteu\n     posicao em parametro (o DJM-900NXS2 faz -26..+6 dB por banda, e o TRIM\n     -inf..+9 dB, exatamente como o manual dele). Ler o NO e a fonte de\n     verdade; refazer a conta do lado de fora seria inventar uma segunda.\n     So existe depois que o aluno liga o audio do mixer. Antes disso volta\n     null e a aula cai no caminho antigo, por posicao de controle.       */\n  function cadeia(){\n    var C=achaCanais(), out={ch:{}, master:null, bus:{}}, achou=false;\n    var xa=null, xb=null, th=null, ms=null, am=null;\n    try{ if(typeof xfA!==&quot;undefined&quot;) xa=xfA; }catch(e){}\n    try{ if(typeof xfB!==&quot;undefined&quot;) xb=xfB; }catch(e){}\n    try{ if(typeof thru!==&quot;undefined&quot;) th=thru; }catch(e){}\n    try{ if(th==null &amp;&amp; typeof thruBus!==&quot;undefined&quot;) th=thruBus; }catch(e){}\n    try{ if(typeof master!==&quot;undefined&quot;) ms=master; }catch(e){}\n    try{ if(typeof assignMode!==&quot;undefined&quot;) am=assignMode; }catch(e){}\n    try{ if(!am &amp;&amp; typeof xfAssign!==&quot;undefined&quot; &amp;&amp; po(xfAssign)) am=xfAssign; }catch(e){}   /* Denon X1850 */\n    try{ if(!am &amp;&amp; typeof SW!==&quot;undefined&quot; &amp;&amp; po(SW))\n      am={1:SW.assign1,2:SW.assign2,3:SW.assign3,4:SW.assign4}; }catch(e){}                  /* DJM-A9 */\n    out.bus.A=pgan1(xa); out.bus.B=pgan1(xb); out.bus.T=pgan1(th);\n    out.master=pgan1(ms);\n    /* DJM-600: nao tem master global — o volume de saida mora no canal 1 */\n    if(out.master==null) for(var m1 in C){ var mv=pgan(C[m1],[&quot;masterVol&quot;,&quot;masterG&quot;,&quot;mst&quot;]);\n      if(mv!=null){ out.master=mv; break; } }\n    for(var k in C){\n      var c=C[k];\n      var e={\n        trim : pgan(c,[&quot;trim&quot;,&quot;gain&quot;,&quot;gan&quot;]),\n        /* &quot;ch&quot; fica por ULTIMO de proposito: em alguns simuladores ch e o\n           NUMERO do canal, nao o no de ganho. pgan() so aceita quem tem\n           .gain.value, entao segue procurando em vez de aceitar o numero.\n           ⚠️ chFader ANTES de fader, e a ordem tem motivo MEDIDO: no DJM-600 o\n           objeto do canal 1 carrega os dois — &quot;fader&quot; e o volume de SAIDA do\n           aparelho e &quot;chFader&quot; e o do canal. Lendo &quot;fader&quot; primeiro, o canal 1\n           publicava o master e o canal 2 publicava o dele: o fader do canal 1\n           nao mexia no deck 1 e o master mexia duas vezes. */\n        fader: pgan(c,[&quot;chFader&quot;,&quot;chfader&quot;,&quot;fader&quot;,&quot;fdr&quot;,&quot;ch&quot;]),\n        hi   : pbq(c,[&quot;hi&quot;,&quot;high&quot;,&quot;eqHi&quot;,&quot;eqhi&quot;,&quot;treble&quot;]),\n        mid  : pbq(c,[&quot;mid&quot;,&quot;eqMid&quot;,&quot;eqmid&quot;,&quot;himid&quot;,&quot;midHi&quot;,&quot;midhi&quot;]),\n        low  : pbq(c,[&quot;low&quot;,&quot;eqLo&quot;,&quot;eqLow&quot;,&quot;eqlow&quot;,&quot;bass&quot;]),\n        color: pbq(c,[&quot;color&quot
