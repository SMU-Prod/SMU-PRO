<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Monte a sua cabine (SMU)</title>
<style>
/* ============================================================================
   MOLDURA DAS DUAS AULAS DA CABINE

   REGRA DE OURO DESTE ARQUIVO (ordem do dono, 29/07/2026):
   "na barra superior, ponha janelas que abrindo tem as informacoes, mas algo
    que nao ocupe a tela. Deixa a maior parte da tela para as CDJs e mixers."

   Por isso:
   - NAO existe coluna lateral, nem fita de passos, nem paragrafo embaixo da
     mesa. Tudo isso virou POPOVER ancorado num botao da barra.
   - O #palco recebe TODA a altura que sobra (flex:1) e os aparelhos moram nele.
   - O popover e position:ABSOLUTE. Nunca fixed: a aula roda dentro de iframe,
     e fixed em iframe se ancora no iframe, nao na tela do aluno.
   - Nada de escalar a pagina inteira com transform (era o que fazia tudo virar
     miniatura). Quem escala e SO o simulador, dentro da propria moldura dele.
   ============================================================================ */
  :root{
    --ink:#e9eef7; --amber:#ffae1a; --green:#39d271; --blue:#37a2ff; --red:#ff4636;
    --line:#2a2f37; --painel:#0c0e12; --barra:46px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:radial-gradient(1100px 640px at 50% -10%,#26292e,#0a0b0d 62%),#08090b;
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    user-select:none;
  }
  #app{display:flex;flex-direction:column;height:100%;width:100%}

  /* ---------------- BARRA SUPERIOR (compacta) ---------------- */
  #barra{
    flex:0 0 auto;position:relative;z-index:60;
    display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
    min-height:var(--barra);padding:4px 8px;
    background:linear-gradient(180deg,#20232a,#14161a);
    border-bottom:1px solid #05070a;
  }
  .marca{display:flex;align-items:baseline;gap:5px;flex:0 0 auto}
  .marca b{font-size:14px;letter-spacing:1px}
  .marca .m{font-size:8px;letter-spacing:1.5px;color:#8a94a4;text-transform:uppercase;white-space:nowrap}
  #passos{display:flex;gap:4px;flex:0 0 auto;margin-left:4px}
  .pa{
    font:inherit;font-size:9.5px;font-weight:800;letter-spacing:.3px;
    border:1px solid #1c2229;background:#11151a;color:#8b97a9;
    border-radius:14px;padding:5px 9px;cursor:pointer;white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .pa.on{background:#151d2a;border-color:var(--blue);color:#cfe6ff}
  .pa.ok{background:#0f2418;border-color:#1e5c38;color:#9fe3bb}
  .pa:disabled{opacity:.35;cursor:not-allowed}
  .vazio{flex:1 1 auto;min-width:4px}

  .btn{
    font:inherit;font-size:10px;font-weight:800;letter-spacing:.3px;
    border:1px solid #262c34;border-radius:8px;padding:7px 10px;cursor:pointer;
    color:#cbd4e0;background:linear-gradient(180deg,#1c2026,#12151a);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:#37414d}
  .btn.on{border-color:var(--blue);color:#cfe6ff;background:#152232}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn .sel{font-size:9px;font-weight:900;border-radius:9px;padding:1px 6px;background:#3a2a10;color:#ffc98a}
  .btn .sel.zero{background:#123a2a;color:#7df0a8}
  .ponto{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 7px #ff463699}
  .ponto.ok{background:var(--green);box-shadow:0 0 7px #39d27199}

  /* ---------------- POPOVER (absolute, nunca fixed) ---------------- */
  .pop{
    display:none;position:absolute;top:calc(100% + 4px);right:6px;z-index:70;
    width:min(430px,calc(100vw - 16px));max-height:min(70vh,520px);overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:#0d1015;border:1px solid #2b323b;border-radius:11px;
    box-shadow:0 18px 44px #000c,0 0 0 1px #ffffff08 inset;padding:11px 12px;
  }
  .pop.on{display:block}
  .pop h4{margin:0 0 8px;font-size:10px;letter-spacing:1.3px;color:#8b97a9;text-transform:uppercase;font-weight:800}
  .pop p{margin:0 0 9px;font-size:11.5px;line-height:1.5;color:#c2cbd6}
  .pop b{color:#fff}
  .pop code{background:#161a20;border-radius:3px;padding:0 3px;font-size:11px}

  .chk{display:flex;gap:7px;align-items:flex-start;padding:7px 8px;border-radius:8px;margin-bottom:5px;
    background:#11151a;border:1px solid #1c2229}
  .chk.ok{background:#0f2418;border-color:#1e5c38}
  .chk .b{width:15px;height:15px;border-radius:50%;flex:0 0 auto;margin-top:1px;background:#2a3038;border:1px solid #000;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#6b7684}
  .chk.ok .b{background:var(--green);color:#062a13}
  .chk .tx{font-size:11px;line-height:1.35;color:#c2cbd6}
  .chk.ok .tx{color:#9fe3bb}
  .chk .tx b{color:#fff}
  .som{margin:2px 0 9px;padding:9px;border-radius:8px;text-align:center;font-size:11.5px;font-weight:800;
    background:#2a1414;border:1px solid #52201c;color:#ff9c90}
  .som.on{background:#0f2a18;border-color:#1e6b3c;color:#7df0a8}
  .elo{margin:0 0 9px;padding:8px 10px;border-radius:8px;font-size:11px;line-height:1.45;
    background:#1b1410;border:1px solid #4a3418;color:#ffd9a6}
  .elo b{color:#fff}
  .est{font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;background:#4a2a12;color:#ffc98a;white-space:nowrap}

  /* ---------------- PALCO: os aparelhos ficam com a tela ---------------- */
  #palco{flex:1 1 auto;min-height:0;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px}

  /* -------- passo 1: escolha -------- */
  .razao{font-size:11px;line-height:1.45;color:#9fb0c4;margin:0 2px 8px;padding:7px 9px;border-radius:7px;
    background:#0e1a26;border:1px solid #1d3350}
  .razao b{color:#fff}
  .escolha{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
  .col .lb{font-size:9px;color:#7f8b9c;margin-bottom:5px;letter-spacing:.6px;font-weight:800}
  .opt{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #23282f;border-radius:8px;
    background:linear-gradient(180deg,#171a1f,#101317);cursor:pointer;margin-bottom:5px;
    min-height:42px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
  .opt .ic{width:30px;height:20px;border-radius:3px;flex:0 0 auto;border:1px solid #000;
    background:linear-gradient(180deg,#3b4148,#191c20)}
  .opt.vinil .ic{background:radial-gradient(circle at 50% 50%,#5a6068 16%,#0f1114 18%,#1a1d21 70%)}
  .opt .nm{font-size:11px;font-weight:700;line-height:1.15}
  .opt .tp{font-size:8.5px;color:#7f8b9c}
  .opt .tag{margin-left:auto;font-size:8px;font-weight:900;padding:2px 5px;border-radius:4px;white-space:nowrap}
  .tag.line{background:#123a5c;color:#8fd0ff}
  .tag.phono{background:#4a2a12;color:#ffc98a}
  .tag.aio{background:#123a2a;color:#7df0a8}
  .aio-bloco{margin-top:10px;border-top:1px dashed #232a32;padding-top:9px}
  .aio-bloco .lb{font-size:9px;color:#7f8b9c;margin-bottom:6px;letter-spacing:.6px;font-weight:800}

  /* -------- passo 2 (praticando): A MESA --------
     Cada aparelho ocupa a LARGURA TODA e nunca e cortado: a altura da moldura
     sai do tamanho natural que o proprio simulador informa, entao o fit() dele
     cabe exato. Se os tres nao couberem na altura, todos encolhem juntos —
     encolhe, nao recorta. */
  .mesa{display:flex;gap:6px;align-items:flex-start;justify-content:center;min-height:100%}
  .mesa.coluna{flex-direction:column;align-items:center}
  .mesa.linha{flex-direction:row;align-items:flex-start}
  .apl{display:flex;flex-direction:column;background:#08090b;border:1px solid #1b2027;border-radius:9px;
    overflow:hidden;flex:0 0 auto;max-width:100%}
  .apl .cab{display:flex;align-items:center;gap:7px;padding:4px 7px;background:#12161b;border-bottom:1px solid #1b2027;flex:0 0 auto}
  .apl .cab .nm{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .apl .cab .ch{font-size:9px;font-weight:900;letter-spacing:.5px;padding:2px 6px;border-radius:4px;
    background:#10304a;color:#7fd4ff;border:1px solid #1c4e73;white-space:nowrap}
  .apl .cab .ch.mix{background:#2b1f3a;color:#d3b6ff;border-color:#4b3670}
  .apl .cab .esq{margin-left:auto;display:flex;gap:5px}
  /* --- o caminho do som, à vista --- */
  #rota{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px;
        background:#0e1216;border-bottom:1px solid #1b2027;font-size:10px;line-height:1.35}
  #rota .via{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;
             background:#141a20;border:1px solid #222a33;white-space:nowrap}
  #rota .via.off{opacity:.45}
  #rota .via b{font-weight:900;letter-spacing:.4px}
  #rota .ch1 b{color:#8fd6ff} #rota .ch2 b{color:#ffc98a} #rota .mst b{color:#d3b6ff}
  #rota .db{font-variant-numeric:tabular-nums;color:#cfe6ff;font-weight:800}
  #rota .det{color:#7d8b99}
  #rota .seta{color:#4d5a68;font-weight:900}
  #rota .barra{width:46px;height:5px;border-radius:3px;background:#1d242c;overflow:hidden}
  #rota .barra i{display:block;height:100%;background:linear-gradient(90deg,#2f7d4f,#8fd66a)}
  #rota .barra.q i{background:linear-gradient(90deg,#8a6d2a,#ffcf5a)}
  /* A MOLDURA e so a janela. Quem encolhe e o IFRAME INTEIRO, por transform:
     medida em px (fonte, borda, padding) nao escala sozinha — escalar o
     contexto todo resolve tudo junto e nunca encavala. */
  .moldura{position:relative;background:#08090b;overflow:hidden;width:100%}
  .moldura iframe{display:block;border:0;background:#08090b;position:absolute;left:50%;top:0;
    transform-origin:top center}
  /* aparelho ampliado: cobre o palco inteiro. Nao e fixed — e absolute no palco. */
  .apl.ampliado{position:absolute;left:6px;right:6px;top:6px;bottom:6px;z-index:40;border-color:var(--blue);
    width:auto !important;max-width:none}
  .apl.ampliado .moldura{flex:1 1 auto}
  .mesa.temAmpliado{display:block;min-height:0}
  .mesa.temAmpliado .apl:not(.ampliado){display:none}
  html.ampliado #barra{min-height:32px;padding:2px 6px}
  html.ampliado .marca,html.ampliado #passos{display:none}

  /* -------- passo 2 (cabeamento): AS TRASEIRAS -------- */
  .cabos-topo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .cabo-b{font:inherit;font-size:10px;font-weight:900;letter-spacing:.4px;border-radius:8px;padding:8px 12px;cursor:pointer;
    border:1px solid #2a3038;color:#c2cbd6;background:linear-gradient(180deg,#171a1f,#101317);
    min-height:38px;touch-action:manipulation}
  .cabo-b.on{border-color:var(--amber);color:#ffd79a;background:#2a1f0d;box-shadow:0 0 0 1px var(--amber) inset}
  .cabo-b .pt{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .pt.ac{background:#e0a33a} .pt.rca{background:#e05a4a} .pt.link{background:#4ab0e0}
  .instr{font-size:10.5px;line-height:1.4;color:#9fb0c4;margin-left:2px}
  .instr b{color:#fff}

  .bancada{position:relative;display:flex;flex-direction:column;gap:9px}
  .painel{position:relative;border-radius:7px;border:1px solid #05070a;
    background:linear-gradient(180deg,#2c3037,#181b20 55%,#0f1216);
    box-shadow:0 5px 14px #000a, inset 0 1px 0 #ffffff14;width:100%}
  .painel .tit{position:absolute;top:-13px;left:3px;font-size:9px;font-weight:800;color:#9aa4b1;letter-spacing:.4px;white-space:nowrap}
  .painel .fonte{position:absolute;top:-13px;right:3px;font-size:8px;color:#6b7684;white-space:nowrap}
  .painel .grade{position:absolute;left:0;right:0;top:8%;height:22%;
    background:repeating-linear-gradient(90deg,#0b0e11 0 2px,#191d22 2px 5px);opacity:.5;pointer-events:none}
  .con{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-width:16px;min-height:16px}
  .con .pino{border-radius:3px;border:1.5px solid #6b7684;background:linear-gradient(180deg,#2b2f35,#0f1215);
    width:100%;height:100%;min-width:14px;min-height:12px}
  .con .sig{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;
    font-size:6.5px;font-weight:800;color:#94a0ae;letter-spacing:.2px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}
  .con.clicavel{cursor:pointer;touch-action:manipulation}
  .con.clicavel::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(100%,30px);height:max(100%,30px)}                 /* alvo de dedo */
  .con.clicavel:hover .pino{box-shadow:0 0 0 2px #fff6}
  .con.sel .pino{box-shadow:0 0 0 3px var(--amber),0 0 12px var(--amber)}
  .con.ok .pino{border-color:var(--green);background:linear-gradient(180deg,#14351f,#0b1d12)}
  .con.rca .pino{border-radius:50%;background:radial-gradient(circle at 50% 32%,#d8dde3,#8f959c 58%,#43484e)}
  .con.rca.entrada .pino{border-color:#b03a2e}
  .con.link .pino{border-radius:2px;background:linear-gradient(180deg,#1a1e23,#0a0c0f);border-color:#4ab0e0}
  .con.gnd .pino{border-radius:50%;background:radial-gradient(circle at 50% 32%,#c9a227,#6b5510);border-color:#3a2f08}
  .con.morto .pino{opacity:.45;border-color:#3a4048}
  .con.canal .sig{color:#ffc98a}

  svg.fios{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}

  .regua{position:relative;display:flex;align-items:center;gap:12px;padding:0 12px;height:46px;border-radius:7px;
    background:linear-gradient(180deg,#23272d,#131619);border:1px solid #05070a;
    box-shadow:inset 0 1px 0 #ffffff12,0 4px 10px #0009}
  .regua .rt{font-size:8.5px;font-weight:900;color:#8a94a4;letter-spacing:1px;white-space:nowrap}
  .tom{width:30px;height:26px;border-radius:3px;cursor:pointer;position:relative;flex:0 0 auto;
    background:linear-gradient(180deg,#101317,#0a0c0f);border:1.5px solid #4a5058;touch-action:manipulation}
  .tom::before,.tom::after{content:"";position:absolute;top:7px;width:3px;height:9px;background:#4a5058;border-radius:1px}
  .tom::before{left:8px} .tom::after{right:8px}
  .tom.ok{border-color:var(--green)} .tom.ok::before,.tom.ok::after{background:var(--green)}
  .tom.sel{box-shadow:0 0 0 3px var(--amber)}
  .chaveac{margin-left:auto;font:inherit;font-size:9px;font-weight:900;padding:7px 11px;border-radius:6px;cursor:pointer;
    background:#3a1a16;border:1px solid #6b241c;color:#ff9c90;letter-spacing:.5px;touch-action:manipulation}
  .chaveac.on{background:#14351f;border-color:#1e6b3c;color:#7df0a8}
  .fonte12{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;
    background:linear-gradient(180deg,#20242a,#111417);border:1px solid #05070a}
  .fonte12 .ft{font-size:8.5px;font-weight:900;color:#8a94a4;letter-spacing:.6px;white-space:nowrap}
  .switch{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:7px;
    background:linear-gradient(180deg,#1d2128,#0f1216);border:1px solid #05070a}
  .switch .st{font-size:8.5px;font-weight:900;color:#7fd4ff;letter-spacing:.6px;white-space:nowrap}

  .semdado{padding:14px;border-radius:8px;background:#1b1410;border:1px solid #4a3418;color:#ffd9a6;
    font-size:11.5px;line-height:1.5}
  .semdado b{color:#fff}

  /* -------- MUSICAS -------- */
  .faixa{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;margin-bottom:4px;
    background:#11151a;border:1px solid #1c2229;font-size:11px}
  .faixa .fn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .faixa .fb{font:inherit;font-size:9px;font-weight:900;border:1px solid #2a3038;border-radius:6px;padding:5px 8px;
    cursor:pointer;color:#aab4c2;background:linear-gradient(180deg,#171a1f,#101317);touch-action:manipulation}
  .faixa .fb.on{border-color:var(--green);color:#7df0a8;background:#0f2418}

  /* alvo de dedo maior no toque */
  @media (pointer:coarse){
    .btn,.pa{min-height:38px}
    .cabo-b{min-height:44px}
    .opt{min-height:50px}
  }
  /* retrato de iPad: a barra nao pode comer altura — quebra em duas linhas curtas */
  @media (max-width:820px){
    .marca .m{display:none}
    #barra{gap:4px;padding:3px 5px}
    .btn{padding:7px 8px;font-size:9.5px}
  }

  /* CONTRATO DE TELA CHEIA (html.smu-fs) — o player da aula avisa, o simulador
     responde SO com CSS. Em tela cheia a barra encolhe e o palco cresce. */
  html.smu-fs #barra{min-height:38px;padding:3px 8px}
  html.smu-fs #palco{padding:4px}
  html.smu-fs .pop{max-height:min(78vh,640px)}
</style>
</head>
<body>
<div id="app">

  <header id="barra">
    <div class="marca"><b>SMU</b><span class="m" id="sub">PRO • CABINE</span></div>
    <div id="passos"></div>
    <span class="vazio"></span>

    <button class="btn" id="bFalta" data-pop="falta">
      <span class="ponto" id="pontoSom"></span>O QUE FALTA <span class="sel" id="selFalta">0</span>
    </button>
    <button class="btn" id="bComo" data-pop="como">COMO FUNCIONA</button>
    <button class="btn" id="bMus" data-pop="mus">MÚSICAS</button>
    <button class="btn" id="btnAmpliar">AMPLIAR</button>
    <button class="btn" id="btnReset">RECOMEÇAR</button>

    <div class="pop" id="pop-falta">
      <h4>O que falta</h4>
      <div class="som" id="som">SEM SOM</div>
      <div id="elo"></div>
      <div id="lista"></div>
    </div>
    <div class="pop" id="pop-como"><h4>Como funciona</h4><div id="como"></div></div>
    <div class="pop" id="pop-mus"><h4>Músicas</h4><div id="mus"></div></div>
  </header>

  <!-- O CAMINHO DO SOM, à vista. O aluno tem de VER que o player da esquerda
       entra no CH1, que quem manda no volume/timbre é o mixer, e que o MASTER
       é o que sai no alto-falante do aparelho dele. -->
  <div id="rota" hidden></div>

  <main id="palco"></main>
</div>

<script>
/* ============================================================================
   1. DADOS INJETADOS PELO GERADOR
   ============================================================================ */
const SIMS = [{"id":"cdj3000","tipo":"deck","sub":"flagship · tela 9\"","nome":"Pioneer CDJ-3000","html":"&lt;!doctype html&gt;\n&lt;html lang=&quot;pt-BR&quot;&gt;\n&lt;head&gt;\n&lt;script&gt;window.__SMU_VISOR={&quot;modo&quot;:&quot;lista&quot;,&quot;toque&quot;:true,&quot;decks&quot;:1,&quot;carga&quot;:&quot;reload&quot;,&quot;demo&quot;:[&quot;ABOVE THE CLOUD E.P.&quot;]};&lt;/script&gt;\n&lt;script&gt;/* PONTE SMU */\n/* ---------------------------------------------------------------------------\n   CAIXA-PRETA — primeira coisa do arquivo, de proposito.\n   O iframe e srcdoc com sandbox=&quot;allow-scripts&quot;: origem OPACA. O pai NAO\n   consegue ler o console dele, entao um erro de script dentro do aparelho\n   sumia sem deixar rastro e a gente ficava adivinhando. Daqui em diante todo\n   erro sobe para a aula por postMessage.                                    */\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function grita(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  window.__SMU_ERROS = [];\n  addEventListener(&quot;error&quot;, function(e){\n    var m = {smu:&quot;erroJS&quot;, msg:String(e.message||e.type), src:String(e.filename||&quot;&quot;), linha:e.lineno||0};\n    window.__SMU_ERROS.push(m); grita(m);\n  }, true);\n  addEventListener(&quot;unhandledrejection&quot;, function(e){\n    var r = e.reason, m = {smu:&quot;erroJS&quot;, msg:&quot;promessa: &quot;+String((r&amp;&amp;r.message)||r), src:&quot;&quot;, linha:0};\n    window.__SMU_ERROS.push(m); grita(m);\n  });\n  /* SONDA: a aula pergunta, o aparelho responde de dentro da caixa opaca.\n     E so leitura — nao muda comportamento nenhum.                           */\n  addEventListener(&quot;message&quot;, function(e){\n    var d=e.data; if(!d||d.smu!==&quot;probe&quot;) return;\n    var r; try{ r = (0,eval)(d.expr); }catch(err){ r = &quot;ERRO: &quot;+(err&amp;&amp;err.message||err); }\n    try{ r = JSON.parse(JSON.stringify(r)); }catch(_){ r = String(r); }\n    grita({smu:&quot;probeOk&quot;, id:d.id, val:r});\n  });\n})();\n/* ---------------------------------------------------------------------------\n   PRATO EM BRANCO — causa achada medindo, nao deduzindo.\n   No simulador AVULSO o jog desenha certo (medido: caixa 244x244, canvas\n   420x420). Embutido, a superficie aparece mas o disco nao. O motivo e que o\n   sim desenha UMA vez no init(); dentro de um iframe com srcdoc o layout ainda\n   nao aconteceu nessa hora, a caixa do canvas vale 0, e o desenho vai para o\n   vazio. Como o jog so e redesenhado quando alguem o gira, ele fica branco\n   para sempre.\n   Conserto no ENCAIXE, sem tocar em simulador nenhum: quando o tamanho real\n   chegar, mandamos o sim desenhar de novo.                                  */\n(function(){\n  var jaOk = false;\n  function redesenhar(){\n    try {\n      /* os sims expoem uma destas: frame() e o padrao da frota */\n      [&quot;frame&quot;,&quot;desenhar&quot;,&quot;render&quot;,&quot;draw&quot;,&quot;drawAll&quot;,&quot;pinta&quot;].forEach(function(n){\n        if (typeof window[n] === &quot;function&quot;) { window[n](); jaOk = true; }\n      });\n      /* muitos recalculam sozinhos no resize */\n      window.dispatchEvent(new Event(&quot;resize&quot;));\n    } catch(e){}\n  }\n  function medir(){\n    var c = document.querySelector('canvas[id*=&quot;jog&quot;],canvas.jogc,canvas');\n    return c ? Math.round(c.getBoundingClientRect().width) : 0;\n  }\n  /* tenta ate a caixa ter largura de verdade — sem laco infinito */\n  var n = 0;\n  var t = setInterval(function(){\n    n++;\n    if (medir() &gt; 0) { redesenhar(); }\n    if (n &gt; 20 || (jaOk &amp;&amp; medir() &gt; 0)) clearInterval(t);\n  }, 100);\n  addEventListener(&quot;load&quot;, redesenhar);\n  /* e sempre que a aula mudar o tamanho do aparelho (ampliar, girar o iPad) */\n  if (window.ResizeObserver) {\n    var ro = new ResizeObserver(function(){ redesenhar(); });\n    addEventListener(&quot;DOMContentLoaded&quot;, function(){ ro.observe(document.body); });\n  }\n})();\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function env(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  function c01(v){ return v&lt;0?0:v&gt;1?1:v; }\n\n  /* ---------- 1. audio: o destino do simulador vira um grafo nosso ---------- */\n  var O = window.AudioContext || window.webkitAudioContext;\n  window.__g=[]; window.__cad=[];\n  /* ⛔ O ganho pedido pela aula tem de SOBREVIVER ao aparelho ainda nao ter\n     ligado o audio. MEDIDO na aula: a aula manda {vol,v:0} para o mixer assim\n     que o estado chega, mas nessa hora o AudioContext do mixer AINDA NAO\n     EXISTE (__cad vazio) — o comando caia no vazio. Quando o aluno tocava no\n     mixer, ele ligava o audio com ganho 1 e as bases de demonstracao DELE\n     tocavam por cima do player. Agora o pedido fica guardado e e aplicado no\n     instante em que o contexto nasce.                                       */\n  var ultVol = {v:1, eq:null, filtros:null, temPedido:false};\n  if(O){\n    function P(){\n      var c=new O(), destReal=c.destination;\n      /* ⛔ PODA. O LOAD do visor RELIGA o audio do aparelho (fecha o contexto e\n         chama startAudio() de novo). Sem podar, __cad[0] fica sendo o contexto\n         MORTO — o pico() mediria silencio para sempre e a aula acusaria\n         &quot;o player nao esta tocando&quot; com a musica no ar. */\n      window.__cad = (window.__cad||[]).filter(function(a){\n        try{ return a.ctx &amp;&amp; a.ctx.state !== &quot;closed&quot;; }catch(e){ return false; } });\n      window.__g = window.__cad.map(function(a){ return a.g; });\n      var pre=c.createGain(); pre.gain.value=1;          /* o sim conecta AQUI */\n      var an=c.createAnalyser(); an.fftSize=512; pre.connect(an);\n      var g=c.createGain(); g.gain.value=1; pre.connect(g);\n      /* ---------------------------------------------------------------\n         A TIRA DE CANAL DO MIXER, DENTRO DO DECK.\n         O audio nao atravessa o iframe, entao o timbre nao pode &quot;vir\n         pronto&quot; do mixer. O que atravessa e a DESCRICAO dos filtros que o\n         mixer tem ligados; aqui existem biquads DE VERDADE, e o som do\n         player passa por eles. Quatro: as 3 bandas do EQ + o COLOR/FILTER.\n         O tipo/frequencia/Q de cada um NAO e chutado aqui — chega do\n         proprio no do mixer (ver a funcao cadeia() no lado mixer). Estes valores\n         iniciais so valem enquanto o mixer nao falou.                  */\n      var lo=c.createBiquadFilter(); lo.type=&quot;lowshelf&quot;;  lo.frequency.value=200;  lo.gain.value=0;\n      var md=c.createBiquadFilter(); md.type=&quot;peaking&quot;;   md.frequency.value=1000; md.Q.value=0.9; md.gain.value=0;\n      var hi=c.createBiquadFilter(); hi.type=&quot;highshelf&quot;; hi.frequency.value=4000; hi.gain.value=0;\n      var col=c.createBiquadFilter(); col.type=&quot;allpass&quot;; col.frequency.value=1000; col.Q.value=1; col.gain.value=0;\n      /* 5a casa: mixer de 4 bandas (DJM-V10) precisa dela alem do FILTER */\n      var col2=c.createBiquadFilter(); col2.type=&quot;allpass&quot;; col2.frequency.value=1000; col2.Q.value=1; col2.gain.value=0;\n      /* torneira de bancada: 1 em producao. Serve para MEDIR sem tocar som\n         na maquina de quem esta testando (window.__SMU_MUDO=1). */\n      var sai=c.createGain(); sai.gain.value = window.__SMU_MUDO ? 0 : 1;\n      g.connect(lo); lo.connect(md); md.connect(hi); hi.connect(col); col.connect(col2);\n      col2.connect(sai); sai.connect(destReal);\n      try{ Object.defineProperty(c,&quot;destination&quot;,{get:function(){return pre},configurable:true}); }catch(e){}\n      var reg={ctx:c,an:an,g:g,lo:lo,md:md,hi:hi,col:col,col2:col2,sai:sai,dest:destReal};\n      reg.f=[lo,md,hi,col,col2];\n      window.__g.push(g); window.__cad.push(reg);\n      if(ultVol.temPedido){                 /* o pedido que chegou antes da hora */\n        g.gain.value = ultVol.v;\n        if(ultVol.eq){ lo.gain.value=ultVol.eq.low||0; md.gain.value=ultVol.eq.mid||0; hi.gain.value=ultVol.eq.hi||0; }\n        if(ultVol.filtros) porFiltros(reg, ultVol.filtros, true);\n      }\n      return c;\n    }\n    P.prototype=O.prototype; window.AudioContext=P; window.webkitAudioContext=P;\n  }\n  function rampa(p,v){ try{\n      if(!isFinite(v)) return;\n      if(Math.abs(p.value-v) &lt; 1e-6) return;         /* ja esta la: nao agenda nada */\n      var t=(window.__cad[0]&amp;&amp;window.__cad[0].ctx?window.__cad[0].ctx.currentTime:0);\n      p.cancelScheduledValues(t); p.setValueAtTime(p.value,t); p.linearRampToValueAtTime(v,t+0.02);\n    }catch(e){ try{ p.value=v; }catch(_){} } }\n  /* ---------------------------------------------------------------------\n     O TIMBRE DO MIXER APLICADO AQUI DENTRO.\n     O parametro fs e a lista de filtros que o mixer REALMENTE tem ligados, cada um\n     {t:tipo, f:frequencia, q:Q, g:ganho em dB}, lida dos nos dele. Nada e\n     inventado deste lado: se o mixer nao mandar, o filtro fica em allpass\n     (transparente), que e o mesmo que nao existir.\n     ⚠️ Rampa LINEAR de 20 ms, que TERMINA. Nada de setTargetAtTime: ele e\n     exponencial e nunca acaba, o parametro vira a-rate e o biquad passa a\n     recalcular coeficiente por amostra (34,5% de CPU na CL5).           */\n  function porFiltros(a, fs, direto){\n    if(!a || !a.f) return;\n    for(var i=0;i&lt;a.f.length;i++){\n      var n=a.f[i], s=fs&amp;&amp;fs[i];\n      if(!s){                                   /* sobra de filtro: transparente */\n        try{ n.type=&quot;allpass&quot;; }catch(e){}\n        if(direto){ try{ n.gain.value=0; }catch(e){} } else rampa(n.gain,0);\n        continue;\n      }\n      try{ if(s.t &amp;&amp; n.type!==s.t) n.type=s.t; }catch(e){}\n      if(direto){\n        try{ if(s.f!=null) n.frequency.value=s.f; if(s.q!=null) n.Q.value=s.q; if(s.g!=null) n.gain.value=s.g; }catch(e){}\n      } else {\n        if(s.f!=null) rampa(n.frequency, s.f);\n        if(s.q!=null) rampa(n.Q, s.q);\n        if(s.g!=null) rampa(n.gain, s.g);\n      }\n    }\n  }\n  function volume(v,eq,filtros){\n    ultVol.v = v; ultVol.eq = eq; if(filtros!==undefined) ultVol.filtros = filtros;\n    ultVol.temPedido = true;\n    (window.__cad||[]).forEach(function(a){\n      rampa(a.g.gain, v);\n      if(filtros) porFiltros(a, filtros, false);\n      else if(eq){ rampa(a.lo.gain, eq.low||0); rampa(a.md.gain, eq.mid||0); rampa(a.hi.gain, eq.hi||0); }\n    });\n  }\n  /* pico ANTES do ganho: diz se o PLAYER esta tocando, nao se o mixer deixou passar */\n  var buf=null;\n  function pico(){\n    var a=(window.__cad||[])[0]; if(!a) return 0;\n    if(!buf||buf.length!==a.an.fftSize) buf=new Uint8Array(a.an.fftSize);\n    a.an.getByteTimeDomainData(buf);\n    var p=0; for(var i=0;i&lt;buf.length;i+=4){ var x=Math.abs(buf[i]-128)/128; if(x&gt;p)p=x; }\n    return p;\n  }\n\n  /* ---------- 1b. VU: o AUDIO nao atravessa o iframe, o SINAL sim ----------\n     O mixer embutido nao recebe audio nenhum — quem toca e o deck, no outro\n     iframe. Entao os medidores dele mediam silencio e ficavam apagados nos\n     dois lugares (canal e master), que foi o que o dono viu.\n\n     ⛔ Nada de inventar escala de dB aqui. Cada simulador ja tem a escala do\n     MANUAL dele (o DJM-900NXS2 tem 15 segmentos por medidor: canal +12..-30 e\n     master +15..-27 dB, conferido na pagina &quot;Control Panel&quot; do manual — e o\n     sim desenha 15). Se a ponte &quot;acendesse N LEDs&quot; estaria reescrevendo essa\n     calibracao por fora.\n     O que a ponte faz e o degrau ANTES: entrega ao analisador do mixer a mesma\n     ONDA que existiria se o cabo estivesse ligado. Dai o codigo do proprio\n     aparelho mede e acende — igualzinho ao avulso, sem tocar em simulador.\n     Como so o analisador e alimentado (nada chega ao destination), NAO SAI SOM.\n\n     Onde mora o analisador (levantado arquivo por arquivo, nao chutado):\n       chans[n].analyser + masterAn ... DJM-450/750MK2/800/900NXS2/V10, X1850\n       d.an / b.an / d.masterAn ....... DJM-600\n       dA.an / dB.an / masterAn ....... DJM-2000\n     Os tres casos leem por getByteTimeDomainData, entao um so remendo serve. */\n  function po(o){ return o &amp;&amp; typeof o===&quot;object&quot;; }\n  /* ---------------------------------------------------------------------\n     OS CANAIS DO MIXER — o mesmo levantamento arquivo por arquivo que ja\n     servia para achar os analisadores serve para achar a TIRA DE CANAL\n     inteira. Cada simulador guarda o canal num objeto so; o que muda e o\n     nome da variavel.                                                   */\n  function achaCanais(){\n    var C={};\n    try{ if(typeof chans!==&quot;undefined&quot; &amp;&amp; po(chans))\n      for(var k in chans){ if(po(chans[k])) C[k]=chans[k]; } }catch(e){}\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof d!==&quot;undefined&quot; &amp;&amp; po(d) &amp;&amp; (d.fader||d.trim)) C[&quot;1&quot;]=d; }catch(e){}\n    try{ if(!C[&quot;2&quot;] &amp;&amp; typeof b!==&quot;undefined&quot; &amp;&amp; po(b) &amp;&amp; (b.fader||b.trim)) C[&quot;2&quot;]=b; }catch(e){}\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof dA!==&quot;undefined&quot; &amp;&amp; po(dA) &amp;&amp; (dA.fader||dA.trim)) C[&quot;1&quot;]=dA; }catch(e){}\n    try{ if(!C[&quot;2&quot;] &amp;&amp; typeof dB!==&quot;undefined&quot; &amp;&amp; po(dB) &amp;&amp; (dB.fader||dB.trim)) C[&quot;2&quot;]=dB; }catch(e){}\n    /* DJM-A9: os canais moram em CH */\n    try{ if(!C[&quot;1&quot;] &amp;&amp; typeof CH!==&quot;undefined&quot; &amp;&amp; po(CH))\n      for(var j in CH){ if(po(CH[j])) C[j]=CH[j]; } }catch(e){}\n    return C;\n  }\n  /* ⚠️ Procurar por NOME nao basta: ha simulador em que c.ch e o NUMERO do\n     canal e nao o no de ganho. Por isso cada leitor so aceita o que de fato\n     tem o parametro que ele vai ler, e segue procurando quando nao tem.    */\n  function pgan(o,nomes){\n    for(var i=0;i&lt;nomes.length;i++){\n      try{ var n=o[nomes[i]];\n        if(n &amp;&amp; n.gain &amp;&amp; typeof n.gain.value===&quot;number&quot;) return +n.gain.value;\n      }catch(e){}\n    }\n    return null;\n  }\n  function pgan1(n){ try{ return (n &amp;&amp; n.gain &amp;&amp; typeof n.gain.value===&quot;number&quot;) ? +n.gain.value : null; }catch(e){ return null; } }\n  function pbq(o,nomes){\n    for(var i=0;i&lt;nomes.length;i++){\n      try{ var n=o[nomes[i]];\n        if(n &amp;&amp; n.frequency &amp;&amp; typeof n.frequency.value===&quot;number&quot; &amp;&amp; n.type)\n          return {t:String(n.type), f:+n.frequency.value, q:(n.Q?+n.Q.value:1), g:(n.gain?+n.gain.value:0)};\n      }catch(e){}\n    }\n    return null;\n  }\n  /* ---------------------------------------------------------------------\n     CADEIA — o caminho do som DENTRO do mixer, lido dos nos de audio.\n     ⛔ Nao se re-deduz dB por angulo de knob aqui. O simulador ja converteu\n     posicao em parametro (o DJM-900NXS2 faz -26..+6 dB por banda, e o TRIM\n     -inf..+9 dB, exatamente como o manual dele). Ler o NO e a fonte de\n     verdade; refazer a conta do lado de fora seria inventar uma segunda.\n     So existe depois que o aluno liga o audio do mixer. Antes disso volta\n     null e a aula cai no caminho antigo, por posicao de controle.       */\n  function cadeia(){\n    var C=achaCanais(), out={ch:{}, master:null, bus:{}}, achou=false;\n    var xa=null, xb=null, th=null, ms=null, am=null;\n    try{ if(typeof xfA!==&quot;undefined&quot;) xa=xfA; }catch(e){}\n    try{ if(typeof xfB!==&quot;undefined&quot;) xb=xfB; }catch(e){}\n    try{ if(typeof thru!==&quot;undefined&quot;) th=thru; }catch(e){}\n    try{ if(th==null &amp;&amp; typeof thruBus!==&quot;undefined&quot;) th=thruBus; }catch(e){}\n    try{ if(typeof master!==&quot;undefined&quot;) ms=master; }catch(e){}\n    try{ if(typeof assignMode!==&quot;undefined&quot;) am=assignMode; }catch(e){}\n    try{ if(!am &amp;&amp; typeof xfAssign!==&quot;undefined&quot; &amp;&amp; po(xfAssign)) am=xfAssign; }catch(e){}   /* Denon X1850 */\n    try{ if(!am &amp;&amp; typeof SW!==&quot;undefined&quot; &amp;&amp; po(SW))\n      am={1:SW.assign1,2:SW.assign2,3:SW.assign3,4:SW.assign4}; }catch(e){}                  /* DJM-A9 */\n    out.bus.A=pgan1(xa); out.bus.B=pgan1(xb); out.bus.T=pgan1(th);\n    out.master=pgan1(ms);\n    /* DJM-600: nao tem master global — o volume de saida mora no canal 1 */\n    if(out.master==null) for(var m1 in C){ var mv=pgan(C[m1],[&quot;masterVol&quot;,&quot;masterG&quot;,&quot;mst&quot;]);\n      if(mv!=null){ out.master=mv; break; } }\n    for(var k in C){\n      var c=C[k];\n      var e={\n        trim : pgan(c,[&quot;trim&quot;,&quot;gain&quot;,&quot;gan&quot;]),\n        /* &quot;ch&quot; fica por ULTIMO de proposito: em alguns simuladores ch e o\n           NUMERO do canal, nao o no de ganho. pgan() so aceita quem tem\n           .gain.value, entao segue procurando em vez de aceitar o numero.\n           ⚠️ chFader ANTES de fader, e a ordem tem motivo MEDIDO: no DJM-600 o\n           objeto do canal 1 carrega os dois — &quot;fader&quot; e o volume de SAIDA do\n           aparelho e &quot;chFader&quot; e o do canal. Lendo &quot;fader&quot; primeiro, o canal 1\n           publicava o master e o canal 2 publicava o dele: o fader do canal 1\n           nao mexia no deck 1 e o master mexia duas vezes. */\n        fader: pgan(c,[&quot;chFader&quot;,&quot;chfader&quot;,&quot;fader&quot;,&quot;fdr&quot;,&quot;ch&quot;]),\n        hi   : pbq(c,[&quot;hi&quot;,&quot;high&quot;,&quot;eqHi&quot;,&quot;eqhi&quot;,&quot;treble&quot;]),\n        mid  : pbq(c,[&quot;mid&quot;,&quot;eqMid&quot;,&quot;eqmid&quot;,&quot;himid&quot;,&quot;midHi&quot;,&quot;midhi&quot;]),\n        low  : pbq(c,[&quot;low&quot;,&quot;eqLo&quot;,&quot;eqLow&quot;,&quot;eqlow&quot;,&quot;bass&quot;]),\n        color: pbq(c,[&quot;color&quot x;flex-direction:column;gap:8px;padding:10px}\n\n  .util{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(180deg,#202329,#15171b);border:1px solid #0c0d0f;border-radius:11px;padding:7px 11px}\n  .brand b{font-size:15px;letter-spacing:1px;color:#eef2f8}\n  .brand .m{font-size:9px;letter-spacing:2px;color:#8a94a4;text-transform:uppercase;margin-left:6px}\n  .pill{font-size:10px;color:#8b97a9;background:#0c0e12;border:1px solid #2a2f37;border-radius:16px;padding:4px 9px;display:flex;align-items:center;gap:6px}\n  .pill b{color:#fff}.dot{width:8px;height:8px;border-radius:50%;background:#444}.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}\n  .spacer{flex:1}\n  .btnp{font:inherit;font-size:11px;font-weight:700;border:0;border-radius:8px;padding:6px 11px;cursor:pointer;color:#07120b;background:linear-gradient(180deg,#5be59a,#27b566)}\n  .btnp.ghost{background:transparent;color:#8b97a9;border:1px solid #2a2f37}\n  .mission{display:flex;align-items:center;gap:8px;background:#0c0e12;border:1px solid #2a2f37;border-radius:9px;padding:5px 10px;flex:1 1 240px;min-width:0}\n  .mission .idx{font-size:10px;color:var(--amber);font-weight:800;white-space:nowrap}\n  .mission .txt{font-size:11px;line-height:1.2}.mission .txt b{color:#fff}.mission .txt small{color:#8b97a9}\n\n  /* ===== corpo do CDJ-3000: preto fosco / metal escovado =====\n     Dimensões oficiais (spec Pioneer DJ): 329,0 (L) x 452,6 (P) x 118,8 (A) mm\n     → aspect-ratio do painel visto de cima = 329 / 452,6                       */\n  .deck{position:relative;width:100%;aspect-ratio:329/452.6;border-radius:11px;\n    background:\n      repeating-linear-gradient(90deg,#00000016 0 1px,transparent 1px 3px),\n      radial-gradient(110% 58% at 30% 38%,#2f3236 0%,#292c30 28%,#212427 56%,#191b1e 80%,#141618 100%);\n    box-shadow:0 26px 60px #000d, inset 0 2px 0 #ffffff10, inset 0 -6px 18px #000a, 0 0 0 1px #000, 0 0 0 2px #303338;\n    overflow:hidden}\n  .deck::before{content:&quot;&quot;;position:absolute;inset:0;border-radius:11px;pointer-events:none;\n    background:linear-gradient(118deg,#ffffff10 0%,transparent 22%, transparent 78%, #00000030 100%)}\n\n  .lab{position:absolute;font-size:6.4px;letter-spacing:.2px;color:#c3cbd4;font-weight:700;text-transform:uppercase;text-shadow:0 1px 1px #000;pointer-events:none;white-space:nowrap;z-index:4;line-height:1}\n  .lab.sm{font-size:5.2px;color:#aeb6c0;letter-spacing:.1px}\n  .lab.xs{font-size:4.4px;color:#c0c8d1;letter-spacing:0}\n  .lab.rd{color:#e0473f}.lab.gr{color:#37d24a}.lab.lc{text-transform:none}\n  /* etiqueta serigrafada em caixa (IN ADJUST / 1/2X / SLIP REV…) */\n  .lab.box{color:#e6ebf1;background:#1b1e23;border:1px solid #454b53;border-radius:2px;padding:1px 3px;font-size:4.6px}\n\n  .logo{position:absolute;left:50%;top:0.4%;transform:translateX(-50%);font-size:13px;font-weight:900;font-style:italic;color:#9ba3ac;text-shadow:0 1px 1px #000;letter-spacing:.4px;z-index:4;opacity:.6}\n  .biglogo{position:absolute;left:50.7%;top:92.6%;transform:translateX(-50%);font-size:23px;font-weight:900;font-style:italic;color:#c4cad1;text-shadow:0 1px 2px #000,0 0 1px #fff3;letter-spacing:.5px;pointer-events:none;opacity:.92;z-index:4}\n  .biglogo i{font-style:normal}\n  .modeltxt{position:absolute;left:95.5%;top:96.4%;transform:translate(-100%,0);font-size:12px;font-weight:900;letter-spacing:.6px;color:#dfe4ea;text-shadow:0 1px 1px #000;z-index:4;white-space:nowrap}\n  .modeltxt small{font-weight:700;font-size:6.4px;color:#9aa2ac;letter-spacing:.8px;margin-right:4px;vertical-align:2px}\n\n  /* ---- estrutura do chassi medida na foto ---- */\n  /* bloco traseiro elevado (rekordbox + botões de navegação) */\n  .rear{position:absolute;pointer-events:none;z-index:0;border-radius:5px 5px 0 0;\n    background:linear-gradient(180deg,#1b1e22 0%,#26292e 16%,#1a1d21 46%,#121417 78%,#0c0e10 100%);\n    box-shadow:inset 0 1px 0 #ffffff20, inset 0 -3px 8px #000b, 0 1px 0 #000}\n  /* risca azul do rekordbox no alto do bloco traseiro (vista de cima) */\n  .rear::after{content:&quot;&quot;;position:absolute;left:30%;right:30%;top:5%;height:9%;border-radius:2px;\n    background:linear-gradient(90deg,transparent,#2b8397 22%,#3fb6cf 50%,#2b8397 78%,transparent);opacity:.85}\n  /* flanco de alumínio escovado — SÓ o lado ESQUERDO (USB/SD). O direito é módulo preto. */\n  .flank{position:absolute;pointer-events:none;z-index:0;\n    background:repeating-linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 2px),\n               linear-gradient(180deg,#a2a2a5 0%,#909093 22%,#6e7176 52%,#53575c 76%,#3a3d41 100%);\n    box-shadow:inset 0 1px 0 #ffffff33, inset 0 -2px 6px #0008}\n  .flank.l{border-radius:9px 0 0 0}\n  /* lado direito: chapa preta (medido na foto — NÃO é alumínio) */\n  .rside{position:absolute;pointer-events:none;z-index:0;border-radius:0 9px 0 0;\n    background:linear-gradient(180deg,#1d2024,#131619 44%,#0d0f11);box-shadow:inset 1px 1px 0 #ffffff12, inset 0 -2px 6px #0009}\n  /* módulo elevado do seletor rotativo / do BEAT SYNC */\n  .mod{position:absolute;pointer-events:none;z-index:1;border-radius:7px;\n    background:linear-gradient(180deg,#2b3036,#1a1e22 60%,#111417);\n    box-shadow:inset 0 1px 0 #ffffff1c, 0 2px 4px #0009, inset 0 -3px 7px #0007}\n  /* porta USB azul e slot de SD (decorativos, medidos) */\n  .usbport{position:absolute;pointer-events:none;z-index:2;border-radius:3px;\n    background:linear-gradient(180deg,#141c26,#0b1118);box-shadow:0 0 7px #2f8bff44, inset 0 0 0 1.5px #2f9fe0, inset 0 3px 7px #000c}\n  .usbport::after{content:&quot;&quot;;position:absolute;left:17%;right:17%;top:28%;bottom:26%;border-radius:1px;\n    background:linear-gradient(180deg,#2a5fae,#123258);box-shadow:inset 0 1px 0 #ffffff28}\n  .sdslot{position:absolute;pointer-events:none;z-index:2;border-radius:4px;\n    background:linear-gradient(180deg,#2b3036,#1b1f23 40%,#111417);box-shadow:inset 0 2px 7px #000d, 0 1px 0 #ffffff1c}\n  .sdslot::after{content:&quot;&quot;;position:absolute;left:10%;right:10%;bottom:8%;height:10%;border-radius:2px;background:#1a7fe0;box-shadow:0 0 5px #2f8bff88}\n\n  /* baía rebaixada do display: moldura preta em volta do vidro (medida na foto) */\n  .hood{position:absolute;border-radius:4px;pointer-events:none;z-index:1;\n    background:linear-gradient(180deg,#4a4f56 0%,#2a2e33 12%,#15181b 34%,#101215 100%);\n    box-shadow:inset 0 0 0 1px #000, inset 0 4px 10px #000d, 0 1px 0 #ffffff14}\n\n  /* botões de navegação (browse) — cápsula fina, texto azul, no bloco traseiro */\n  .browse{position:absolute;cursor:pointer;border-radius:3px;z-index:3;min-width:0;box-sizing:border-box;overflow:hidden;\n    background:linear-gradient(180deg,#2c3037,#191d22 55%,#101317);border:1px solid #000;\n    box-shadow:inset 0 1px 0 #ffffff26, inset 0 0 0 1px #4b525b, 0 1px 2px #000a;\n    display:flex;align-items:center;justify-content:center;color:#6fb0ff;font-size:5.1px;font-weight:800;letter-spacing:.4px;\n    text-shadow:0 0 4px #2f8bff88,0 1px 1px #000;white-space:nowrap;padding:0 1px}\n  .browse:active{transform:translateY(1px)}\n  .browse.lit{color:#eef3f9;text-shadow:0 1px 1px #000}\n\n  /* display (vidro de 9&quot; 16:9 — a moldura preta é o .hood, por fora) */\n  .disp{position:absolute;z-index:2;border-radius:2px;overflow:hidden;background:#04050700;\n    box-shadow:inset 0 0 0 1px #000, 0 0 0 1px #0a0c0e, inset 0 2px 10px #000c}\n  .dispc{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}\n\n  /* botão redondo metálico (cúpula escovada — como na foto) */\n  .rbtn{position:absolute;cursor:pointer;border-radius:50%;z-index:3;\n    background:radial-gradient(circle at 50% 26%,#f2f5f8,#c8ced4 46%,#8a9098 74%,#5a6067 92%,#3c4147 100%);\n    border:1px solid #2a2d31;box-shadow:0 2px 4px #0009, inset 0 1px 1px #ffffffcc, inset 0 -3px 5px #0005;\n    display:flex;align-items:center;justify-content:center;color:#3a3e43;font-size:8.5px;font-weight:900;text-shadow:0 1px 0 #ffffff66}\n  .rbtn:active{transform:translateY(1px)}\n  .rbtn .led{position:absolute;top:32%;left:50%;transform:translateX(-50%);width:32%;height:32%;border-radius:50%;background:#3a1010;box-shadow:inset 0 0 2px #000}\n  .rbtn.on .led{background:#ff3b2f;box-shadow:0 0 6px #ff3b2f,inset 0 0 2px #fff6}\n  .rbtn.amber .cen{width:36%;height:36%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffcf7a,#e8951c 60%,#9a5e00);box-shadow:inset 0 1px 1px #fff8,0 0 0 1px #000}\n  .rbtn.amber.on .cen{box-shadow:0 0 10px #ff9a1e,inset 0 1px 1px #fff8,0 0 0 1px #000}\n  /* variante ESCURA (DELETE, MEMORY, TIME MODE, ±RANGE, MASTER TEMPO, TEMPO RESET, RELOOP) */\n  .rbtn.dk{background:radial-gradient(circle at 46% 26%,#6b7178,#3a4046 40%,#1c2024 72%,#0b0d10 100%);\n    border:1px solid #000;box-shadow:0 2px 4px #000b, inset 0 1px 1px #ffffff45, inset 0 -3px 6px #0008;color:#b9c1cb;text-shadow:0 1px 1px #000}\n  /* colar rebaixado dos botões redondos escuros grandes (DELETE / RELOOP) */\n  .rbtn.collar{box-shadow:0 0 0 2px #0b0d10, 0 0 0 3px #3b4148, 0 2px 5px #000b, inset 0 1px 1px #ffffff45, inset 0 -3px 6px #0008}\n  /* setas âmbar dos botões redondos (TRACK SEARCH / SEARCH / CALL) */\n  .rbtn.arw{color:#ffa524;font-size:7.2px;text-shadow:0 1px 0 #ffffff55;letter-spacing:-.5px}\n  .rbtn.dk.arw{color:#ffa524;text-shadow:0 1px 1px #000}\n\n  /* botões laranja (IN/OUT) */\n  .orange{position:absolute;cursor:pointer;border-radius:50%;z-index:3;\n    background:radial-gradient(circle at 50% 30%,#ffdf9e,#ffa72a 52%,#e07c06 84%,#b25e02 100%);\n    border:1px solid #6b3500;box-shadow:0 0 0 2px #0d0f12, 0 2px 5px #000b, inset 0 1px 2px #fff9, inset 0 -3px 6px #0005}\n  .orange:active{transform:translateY(1px)}\n  .orange.on{box-shadow:0 0 0 2px #0d0f12, 0 0 14px #ff9a1e, inset 0 1px 2px #fff9}\n\n  /* botão numerado do BEAT LOOP (na foto é ESCURO com número âmbar) */\n  .numb{position:absolute;cursor:pointer;border-radius:50%;z-index:3;\n    background:radial-gradient(circle at 46% 26%,#6b7178,#3a4046 40%,#1c2024 72%,#0b0d10 100%);\n    border:1px solid #000;box-shadow:0 2px 4px #000b, inset 0 1px 1px #ffffff45, inset 0 -3px 6px #0008;\n    display:flex;align-items:center;justify-content:center;color:#ffb43a;font-size:11.5px;font-weight:900;text-shadow:0 1px 1px #000}\n  .numb:active{transform:translateY(1px)}\n  .numb.on{background:radial-gradient(circle at 50% 30%,#bfe6ff,#5db1ff 55%,#1d6fd0);color:#05233f;text-shadow:none;box-shadow:0 0 12px #2f8bff,inset 0 1px 1px #fff}\n\n  /* pads HOT CUE (retângulo preto, letra no alto-esq., barra colorida embaixo) */\n  .hc{position:absolute;cursor:pointer;border-radius:4px;z-index:3;overflow:hidden;\n    background:linear-gradient(180deg,#2a2e34,#191d21 48%,#0e1114);border:1px solid #000;\n    box-shadow:inset 0 1px 0 #ffffff1f, inset 0 0 0 1px #2f343a, 0 1px 2px #000a}\n  .hc .ul{position:absolute;left:9%;right:9%;top:75%;height:10%;border-radius:1px;opacity:.95;box-shadow:0 0 5px currentColor}\n  .hc .lt{position:absolute;left:9%;top:14%;font-size:7px;font-weight:900;text-shadow:0 1px 1px #000;line-height:1}\n  .hc:active{transform:translateY(1px)}\n  .hc.on{background:linear-gradient(180deg,#3d434a,#23282d)}\n  .hc.on .ul{opacity:1;top:26%;height:59%;filter:brightness(1.15)}\n\n  /* botões grandes CUE / PLAY — aro colorido fino, cúpula metálica ocupando 80% */\n  .big{position:absolute;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3}\n  .big .ring{position:absolute;inset:0;border-radius:50%}\n  .big .cap{position:absolute;inset:11%;border-radius:50%;\n    background:radial-gradient(circle at 50% 26%,#f4f7fa,#ced4da 44%,#9aa0a7 72%,#6a7076 92%,#4a4f55 100%);\n    border:1px solid #2c3035;box-shadow:0 2px 6px #000b, inset 0 1px 2px #fff, inset 0 -4px 8px #0006;\n    display:flex;align-items:center;justify-content:center;color:#fbfdff;font-size:9.5px;font-weight:900;\n    text-shadow:0 1px 2px #000a,0 0 3px #0008,0 0 1px #0007}\n  /* ATENÇÃO: sem `closest-side` o 100% do radial-gradient é a DIAGONAL (1,414 r) e o aro some. */\n  .big.cue .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 79%,#ffa42a 82%,#e08a12 94%,#8c5200 99.5%,transparent 100%)}\n  .big.cue.on .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 78%,#ffd48a 81%,#ffa42a 94%,#c87400 99.5%,transparent 100%);filter:drop-shadow(0 0 5px #ff9a1e)}\n  .big.play .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 79%,#3fd94f 82%,#1fa838 94%,#0d6a24 99.5%,transparent 100%)}\n  .big.play.on .ring{background:radial-gradient(circle closest-side at 50% 50%,transparent 0 78%,#8bf79a 81%,#3fd94f 94%,#149a38 99.5%,transparent 100%);filter:drop-shadow(0 0 5px #37d24a)}\n  .big:active{transform:translateY(1px)}\n\n  /* knobs */\n  .knob{position:absolute;border-radius:50%;cursor:ns-resize;z-index:3;\n    background:radial-gradient(circle at 50% 26%,#e9edf1,#b9bfc6 40%,#7d838a 70%,#4a4f55 100%);border:1px solid #0a0b0d;\n    box-shadow:0 2px 3px #0009, inset 0 1px 0 #ffffff9c}\n  .knob::after{content:&quot;&quot;;position:absolute;left:50%;top:10%;width:9%;height:40%;background:#f2f5f8;border-radius:1px;transform:translateX(-50%);box-shadow:0 0 1px #0007}\n  .knob.big{background:radial-gradient(circle at 50% 28%,#43484f,#22262b 46%,#101215 78%);border:1px solid #000;\n    box-shadow:0 0 0 2px #16191d, 0 0 0 3px #2f343a, 0 3px 6px #000b, inset 0 1px 0 #ffffff26}\n  .knob.big::before{content:&quot;&quot;;position:absolute;inset:20%;border-radius:50%;\n    background:radial-gradient(circle at 50% 30%,#5b6168,#2a2e33 52%,#0f1114);\n    box-shadow:inset 0 2px 5px #000c, 0 0 0 2px #eef2f6, 0 0 0 3px #0b0d10}\n  .knob.big::after{display:none}\n\n  /* switch DIRECTION (3 posições) — alavanca à ESQUERDA, rótulos à direita (como na foto) */\n  .sw{position:absolute;z-index:3;border-radius:4px;cursor:pointer;\n    background:linear-gradient(180deg,#2a2e34,#15181c);border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff1c, inset 0 -2px 5px #000a, 0 1px 2px #000a}\n  .sw .nub{position:absolute;left:8%;width:37%;height:24%;top:6%;border-radius:2px;\n    background:linear-gradient(180deg,#f2f5f8,#c2c8cf 45%,#878d95);box-shadow:0 2px 3px #000b,inset 0 1px 0 #fff,inset 0 -2px 3px #0004;transition:top .08s}\n  .sw.p1 .nub{top:38%}.sw.p2 .nub{top:70%}\n  .sw .slit{position:absolute;left:5%;width:43%;top:6%;bottom:6%;border-radius:2px;background:#05060788;box-shadow:inset 0 0 0 1px #000,inset 0 2px 6px #000c}\n  .sw .lbl{position:absolute;right:4%;width:50%;top:6%;bottom:6%;display:flex;flex-direction:column;justify-content:space-around;align-items:center;\n    background:linear-gradient(160deg,#3a3f46 0 12%,#101316 12%);border-radius:2px;box-shadow:inset 0 0 0 1px #000}\n  .sw .lbl i{font-style:normal;font-size:5.4px;font-weight:800;letter-spacing:.2px;color:#eaeff4;text-shadow:0 1px 1px #000;line-height:1}\n  .sw .lbl i.rd{color:#e0473f}\n\n  /* indicador VINYL/CDJ */\n  .vind{position:absolute;z-index:3;cursor:pointer;border-radius:3px;\n    background:linear-gradient(180deg,#16191d,#0a0c0e);border:1px solid #000;box-shadow:inset 0 0 0 1px #3a4047, inset 0 1px 2px #000a;\n    min-width:0;box-sizing:border-box;overflow:hidden;\n    display:flex;flex-direction:column;justify-content:center;align-items:center}\n  .vind b,.vind span{font-size:7px;font-weight:900;letter-spacing:.3px;line-height:1.15}\n  .vind b{color:#3aa0ff;text-shadow:0 0 6px #2f8bff}\n  .vind span{color:#3f3a18}\n  .vind.cdj b{color:#1c2a38;text-shadow:none}.vind.cdj span{color:#f0d000;text-shadow:0 0 6px #e6c400}\n\n  /* botões escuros retangulares (SLIP, BEAT SYNC, BACK...) */\n  .darkbtn{position:absolute;cursor:pointer;border-radius:4px;z-index:3;min-width:0;box-sizing:border-box;overflow:hidden;\n    background:linear-gradient(180deg,#333940,#20252a 46%,#12151a);border:1px solid #000;\n    box-shadow:inset 0 1px 0 #ffffff22, inset 0 0 0 1px #3d434b, 0 1px 2px #000a;\n    display:flex;align-items:center;justify-content:center;text-align:center;color:#e2e8ef;font-size:6px;font-weight:800;line-height:1.06;letter-spacing:.1px;text-shadow:0 1px 1px #000;padding:0}\n  .darkbtn:active{transform:translateY(1px)}\n  .darkbtn.red{color:#ff4b40}.darkbtn.amber{color:#ffb43a}.darkbtn.blue{color:#5aa2ff}\n  .darkbtn.on{background:linear-gradient(180deg,#3e454d,#242a30);filter:brightness(1.45)}\n  /* SLIP / QUANTIZE: placa preta com etiqueta acesa dentro (como na foto) */\n  /* ATENÇÃO: padding em % resolve contra a LARGURA do .deck e estoura o botão — use px. */\n  .darkbtn.tight{font-size:5.2px;letter-spacing:-.1px}\n  .darkbtn.tag{background:linear-gradient(180deg,#23272c,#101317);font-size:0;padding:1.5px}\n  .darkbtn.tag.narrow::after{font-size:4.2px;letter-spacing:0}\n  .darkbtn.tag::after{content:attr(data-face);width:100%;height:100%;border-radius:2px;font-size:5.2px;font-weight:900;letter-spacing:.2px;\n    display:flex;align-items:center;justify-content:center;background:#3a1210;color:#ff6252;box-shadow:inset 0 0 0 1px #5a201a}\n  .darkbtn.tag.red::after{background:#ee3527;color:#2a0605;box-shadow:0 0 6px #ff3b2f88}\n  /* setas do BEAT JUMP (pads quadradas, não redondas) */\n  .darkbtn.arrow{font-size:8px;color:#eef3f9;\n    background:linear-gradient(180deg,#3a4048,#21262c 50%,#12151a)}\n  /* indicadores acesos (VINYL/CDJ, MASTER, KEY SYNC) */\n  .darkbtn.lit{text-shadow:0 0 5px currentColor,0 1px 1px #000}\n  /* CALL / DELETE: placa com pictograma cromado (o rótulo é serigrafia, fica acima) */\n  .darkbtn.plate{background:linear-gradient(180deg,#31373e,#1a1e23 55%,#0e1114);font-size:0}\n  .darkbtn.plate::after{content:&quot;&quot;;width:42%;height:58%;border-radius:2px;\n    background:linear-gradient(135deg,#eef2f6 0 46%,#5a6068 46% 54%,#eef2f6 54% 100%);\n    clip-path:polygon(0 0,100% 0,0 100%,100% 100%);opacity:.9}\n\n  /* fader TEMPO — carcaça elevada; escala de traços dos DOIS lados do rasgo (medida na foto) */\n  .fader{position:absolute;z-index:3;border-radius:6px;cursor:ns-resize;touch-action:none;\n    background:linear-gradient(90deg,#0a0c0e 0 4%,#2a2f35 10%,#1b1f23 50%,#2a2f35 90%,#0a0c0e 96% 100%);\n    border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff22, inset 0 -2px 6px #000a, 0 2px 5px #000b}\n  /* traços: 2 colunas (esq/dir do rasgo), passo constante — como a régua serigrafada real */\n  .fader .ticks{position:absolute;left:12%;right:12%;top:5%;bottom:5%;pointer-events:none;\n    background:\n      repeating-linear-gradient(180deg,#c9cfd6 0 1.5px,transparent 1.5px,transparent 3.05%);\n    -webkit-mask-image:linear-gradient(90deg,#000 0 34%,transparent 34% 66%,#000 66% 100%);\n            mask-image:linear-gradient(90deg,#000 0 34%,transparent 34% 66%,#000 66% 100%)}\n  .fader .slot{position:absolute;left:50%;top:5%;bottom:5%;width:3px;transform:translateX(-50%);background:#000;border-radius:2px;box-shadow:inset 0 0 3px #000,0 0 0 1px #ffffff14}\n  .fader .zero{position:absolute;left:6%;right:6%;top:50%;height:2px;transform:translateY(-50%);background:#eef2f6;pointer-events:none;box-shadow:0 0 3px #fff6}\n  .fader .cap{position:absolute;left:50%;width:96%;height:11.5%;transform:translate(-50%,-50%);border-radius:3px;\n    background:linear-gradient(180deg,#4a5057 0 30%,#31363c 30% 42%,#eef2f6 42% 52%,#22262b 52% 100%);\n    border:1px solid #000;box-shadow:0 3px 7px #000c, inset 0 1px 0 #ffffff40, inset 0 -2px 4px #0008}\n  .tscale{display:none}\n  /* régua pontilhada à esquerda do fader (− em cima, + embaixo) */\n  .tdots{position:absolute;z-index:3;pointer-events:none;\n    background:repeating-linear-gradient(180deg,#c9cfd6 0 1.5px,transparent 1.5px,transparent 2.6%)}\n  /* coroa de pontos serigrafada em volta dos knobs (JOG ADJUST / VINYL SPEED ADJ.) */\n  .dial{position:absolute;border-radius:50%;pointer-events:none;z-index:2;\n    background:repeating-conic-gradient(from -110deg,#b9c0c8 0 3deg,transparent 3deg 26deg);\n    -webkit-mask-image:radial-gradient(circle,transparent 0 74%,#000 74% 86%,transparent 86%);\n            mask-image:radial-gradient(circle,transparent 0 74%,#000 74% 86%,transparent 86%)}\n  /* placa preta rebaixada atrás dos pares TRACK SEARCH / SEARCH (medida na foto) */\n  .pplate{position:absolute;pointer-events:none;z-index:1;border-radius:6px;\n    background:linear-gradient(180deg,#191c20,#101317 55%,#0b0d10);\n    box-shadow:inset 0 1px 0 #ffffff10, inset 0 2px 6px #000a, 0 1px 0 #ffffff0d}\n\n  .power{position:absolute;z-index:3;cursor:pointer;border-radius:50%;\n    background:radial-gradient(circle at 50% 32%,#4a5058,#22262b 60%,#101316);border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff28, 0 1px 2px #000a;\n    display:flex;align-items:center;justify-content:center;color:#cfd6de;font-size:6.5px;text-shadow:0 0 3px #fff4}\n\n  .jogc{position:absolute;pointer-events:none;z-index:1}\n  .joghit{position:absolute;cursor:grab;border-radius:50%;touch-action:none;z-index:5}\n  .joghit:active{cursor:grabbing}\n\n  .hit{position:absolute;cursor:pointer;z-index:6;border-radius:6px}\n  body.debug .hit{background:#00e5ff22;box-shadow:inset 0 0 0 1px #00e5ff}\n\n  .teach{display:flex;align-items:center;gap:8px;background:#0c0e12;border:1px solid #2a2f37;border-radius:9px;padding:7px 11px;min-height:38px}\n  .teach .k{font-size:10px;font-weight:900;color:var(--blue);background:#0f1a28;border:1px solid #234;border-radius:5px;padding:3px 7px;white-space:nowrap}\n  .teach .d{font-size:11.5px;color:#cdd5e0;line-height:1.25}.teach .d b{color:#fff}\n&lt;/style&gt;\n&lt;style&gt;/* SMU: a barra do sim some da TELA, mas continua no DOM — apagar mata o init() */\n.util{display:none!important}&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div id=&quot;stage&quot;&gt;\n&lt;div class=&quot;wrap&quot;&gt;\n\n  &lt;div class=&quot;util&quot;&gt;\n    &lt;div class=&quot;brand&quot;&gt;&lt;b&gt;SMU&lt;/b&gt;&lt;span class=&quot;m&quot;&gt;PRO • PIONEER CDJ-3000&lt;/span&gt;&lt;/div&gt;\n    &lt;span class=&quot;pill&quot;&gt;&lt;span class=&quot;dot&quot; id=&quot;acDot&quot;&gt;&lt;/span&gt; Áudio &lt;b id=&quot;acState&quot;&gt;clique em Ligar&lt;/b&gt;&lt;/span&gt;\n    &lt;div class=&quot;mission&quot;&gt;\n      &lt;span class=&quot;idx&quot; id=&quot;mIdx&quot;&gt;MISSÃO 1/6&lt;/span&gt;\n      &lt;div class=&quot;txt&quot;&gt;&lt;b id=&quot;mTitle&quot;&gt;Dê play&lt;/b&gt;&lt;br&gt;&lt;small id=&quot;mHint&quot;&gt;Aperte PLAY/PAUSE (botão verde).&lt;/small&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;span class=&quot;spacer&quot;&gt;&lt;/span&gt;\n    &lt;button class=&quot;btnp ghost&quot; id=&quot;btnReset&quot;&gt;Reiniciar&lt;/button&gt;\n    &lt;button class=&quot;btnp&quot; id=&quot;btnStart&quot;&gt;▶ Ligar áudio&lt;/button&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;deck&quot; id=&quot;deck&quot;&gt;\n    &lt;div class=&quot;logo&quot;&gt;Pioneer DJ&lt;/div&gt;\n    &lt;div class=&quot;biglogo&quot;&gt;Pioneer &lt;i&gt;DJ&lt;/i&gt;&lt;/div&gt;\n    &lt;div class=&quot;modeltxt&quot;&gt;&lt;small&gt;MULTI PLAYER&lt;/small&gt;CDJ-3000&lt;/div&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;teach&quot; id=&quot;teach&quot;&gt;\n    &lt;span class=&quot;k&quot; id=&quot;tK&quot;&gt;CDJ-3000&lt;/span&gt;\n    &lt;span class=&quot;d&quot; id=&quot;tD&quot;&gt;Passe o mouse ou toque num controle para aprender o que ele faz. Aperte &lt;b&gt;Ligar áudio&lt;/b&gt; e comece pelo &lt;b&gt;PLAY&lt;/b&gt; verde.&lt;/span&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst $=(s,r=document)=&gt;r.querySelector(s), $$=(s,r=document)=&gt;[...r.querySelectorAll(s)];\nconst clamp=(v,a,b)=&gt;v&lt;a?a:v&gt;b?b:v;\nif(location.hash.includes(&quot;debug&quot;))document.body.classList.add(&quot;debug&quot;);\nconst deck=$(&quot;#deck&quot;);\nfunction pct(el,x,y,w,h){ el.style.left=x+&quot;%&quot;; el.style.top=y+&quot;%&quot;; if(w!=null)el.style.width=w+&quot;%&quot;; if(h!=null)el.style.height=h+&quot;%&quot;; }\n\nconst AR=329/452.6;                      // proporção real do painel (largura/profundidade, em mm — spec Pioneer DJ)\n/* Elementos circulares. O runtime consulta por KIND; &quot;jog&quot; entra pelo nome do POS para o\n   checar-pos medir o prato como CÍRCULO (distância ao centro) e não como caixa quadrada.\n   Conferido no manual oficial (CDJ-3000 Instruction Manual, &quot;Top panel&quot;, p.14): JOG ADJUST\n   (centro 77,8% x 49,2%) e TEMPO RESET (82,6% x 82,1%) ficam FORA do disco — só caem dentro\n   da CAIXA do prato, que não é a forma dele. */\nconst ROUND=new Set([&quot;rbtn&quot;,&quot;orange&quot;,&quot;numb&quot;,&quot;big&quot;,&quot;knob&quot;,&quot;power&quot;,&quot;jog&quot;]);\n\n/* ===================================================================================\n   POSIÇÕES MEDIDAS NA FOTO TOP-DOWN REAL do CDJ-3000 (método QUADRANTES do dono).\n   Foto oficial Pioneer DJ (cdj-3000-top). Painel = bbox px [516,71 → 1390,1271] = 874 x 1200 px.\n   Escala: 874 px ↔ 329,0 mm (largura) e 1200 px ↔ 452,6 mm (profundidade) — spec oficial.\n   Conversão: x% = (px-516)/8,74   ·   y% = (py-71)/12,00\n   Grade NOMEADA conferida em cdj-3000_quad.png (X = ALTURA X1..X10 · Y = LARGURA Y1..Y8;\n   célula = 10% altura x 12,5% largura → x=(Y-1)*12,5 · y=(X-1)*10).\n   Quadrantes dos 5 principais:\n     TELA 9&quot;  X1Y2→X4Y7  ·  PADS A–H  X4Y2→X4Y8  ·  JOG  X5Y2→X10Y7\n     CUE/PLAY X9Y1→X10Y2 ·  FADER TEMPO X7Y8→X10Y8\n   Elementos redondos: h = w*AR (já gravado assim aqui, p/ POS == runtime).\n   =================================================================================== */\nconst POS={\n // --- X1: bloco traseiro — rekordbox + 6 botões de navegação. Botão 9,07x1,50%; passo 10,92% ---\n source:[18.31,3.97,9.07,1.50], browse:[29.23,3.97,9.07,1.50], taglist:[40.15,3.97,9.07,1.50],\n playlist:[51.07,3.97,9.07,1.50], searchb:[61.99,3.97,9.07,1.50], menu:[72.91,3.97,9.07,1.50],\n // --- TELA TOUCH 9&quot; (X1Y2→X4Y7). Vidro medido: 60,0% x 24,51% = 197x110 mm ⇒ 8,9&quot; em 16:9 ---\n display:[20.10,7.45,60.00,24.51],\n // --- X2/X3 coluna e (219 mm), centrado em x=50% ---\n jog:[16.70,44.17,66.60,48.37]\n};\n/* decoração medida na foto (não é controle; fica fora do POS p/ não poluir a checagem).\n   ATENÇÃO: o lado DIREITO do CDJ-3000 é chapa PRETA (RGB ~18 na foto), não alumínio —\n   só o flanco ESQUERDO (USB/SD) é alumínio escovado (RGB ~126-150). */\nconst DECO={ rear:[15.28,0,69.44,6.72], flankL:[0,6.90,15.28,31.70], rside:[84.72,6.90,15.28,31.70],\n             hood:[15.28,6.72,69.44,26.90], usbport:[1.72,7.17,6.98,4.83], sdslot:[1.72,16.04,11.55,4.46],\n             modBack:[84.30,10.10,15.70,17.60], modSync:[86.27,46.40,11.12,6.70], modJog:[86.27,40.54,11.12,3.51] };\n\nconst HC=[[&quot;A&quot;,&quot;#ff3b3b&quot;],[&quot;B&quot;,&quot;#22d3d3&quot;],[&quot;C&quot;,&quot;#e6e400&quot;],[&quot;D&quot;,&quot;#b060ff&quot;],[&quot;E&quot;,&quot;#37d24a&quot;],[&quot;F&quot;,&quot;#ff9a1e&quot;],[&quot;G&quot;,&quot;#2f8bff&quot;],[&quot;H&quot;,&quot;#f0c000&quot;]];\nconst HCCOL={}; HC.forEach(([l,c])=&gt;HCCOL[l]=c);\n\n/* ---- catálogo de controles: kind + face + textos de ensino (funções do manual CDJ-3000) ---- */\nconst CTRL=[\n {act:&quot;source&quot;,kind:&quot;browse&quot;,face:&quot;SOURCE&quot;,k:&quot;SOURCE&quot;,d:&quot;Escolhe a &lt;b&gt;origem da mídia&lt;/b&gt;: USB, SD, rekordbox (USB/Wi-Fi/link) ou outros players via PRO DJ LINK.&quot;},\n {act:&quot;browse&quot;,kind:&quot;browse&quot;,face:&quot;BROWSE&quot;,k:&quot;BROWSE&quot;,d:&quot;Abre a &lt;b&gt;árvore de navegação&lt;/b&gt; para procurar e carregar faixas na tela touch.&quot;},\n {act:&quot;taglist&quot;,kind:&quot;browse&quot;,face:&quot;TAG LIST&quot;,k:&quot;TAG LIST&quot;,d:&quot;Mostra a &lt;b&gt;Tag List&lt;/b&gt;: faixas que você marcou para tocar em seguida.&quot;},\n {act:&quot;playlist&quot;,kind:&quot;browse&quot;,face:&quot;PLAY LIST&quot;,k:&quot;PLAY LIST&quot;,d:&quot;Abre suas &lt;b&gt;playlists&lt;/b&gt; do rekordbox.&quot;},\n {act:&quot;searchb&quot;,kind:&quot;browse&quot;,face:&quot;SEARCH&quot;,k: requency.setValueAtTime(460,t);lp.frequency.exponentialRampToValueAtTime(120,t+0.15);lp.Q.value=5;const a=off.createGain();a.gain.setValueAtTime(0.0001,t);a.gain.linearRampToValueAtTime(0.38,t+0.01);a.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(lp);lp.connect(a);a.connect(dst);o.start(t);o.stop(t+0.22);};\n  for(let bar=0;bar&lt;bars;bar++)for(let st=0;st&lt;16;st++){const t=(bar*16+st)*step;\n    if(K[st])kick(t);if(S[st])clap(t);if(H[st])hat(t,false);if(O[st])hat(t,true);if(B[st])bass(t);}\n  return await off.startRendering();\n}\n\nasync function startAudio(){ if(started)return; started=true;\n  $(&quot;#acState&quot;).textContent=&quot;carregando a faixa…&quot;;\n  AC=new (window.AudioContext||window.webkitAudioContext)();\n  const buf=await renderTrack();\n  const data=buf.getChannelData(0), len=data.length;\n  d={ buffer:buf,data,len,pos:0,playing:false,rate:0,pitch:0,baseBpm:(window.__BANCO_BPM||128),dir:1,touching:false,targetPos:0,cuePoint:0,\n      hotcues:{},recMode:false,loopOn:false,loopStart:0,loopEnd:0,loopIn:false,peaks:null,memList:[],memIdx:-1 };\n  d.fader=AC.createGain(); d.fader.gain.value=0.9; d.fader.connect(AC.destination);\n  d.analyser=AC.createAnalyser(); d.fader.connect(d.analyser);\n  const N=520,peaks=new Float32Array(N),blk=Math.floor(len/N);\n  for(let i=0;i&lt;N;i++){ let mx=0; for(let j=0;j&lt;blk;j+=16){ const v=Math.abs(data[i*blk+j]||0); if(v&gt;mx)mx=v; } peaks[i]=mx; }\n  d.peaks=peaks;\n  const sp=AC.createScriptProcessor(512,0,1); d.sp=sp;\n  sp.onaudioprocess=e=&gt;{ const out=e.outputBuffer.getChannelData(0);\n    for(let i=0;i&lt;out.length;i++){\n      if(d.touching){ const np=d.pos+(d.targetPos-d.pos)*0.0025; d.rate=np-d.pos; d.pos=np;\n        if(d.pos&lt;0){d.pos=0;d.rate=0;} else if(d.pos&gt;len-1){d.pos=len-1;d.rate=0;} }\n      else { const tgt=d.playing?d.dir*(1+d.pitch/100):0; d.rate+=(tgt-d.rate)*0.0022; d.pos+=d.rate;\n        if(d.loopOn&amp;&amp;d.rate&gt;0&amp;&amp;d.pos&gt;=d.loopEnd)d.pos=d.loo :FAIXAS, escolhida:null, cache:{} };\n\n  /* Envolve renderTrack: escolheu faixa -&gt; MP3 real; senao -&gt; faixa sintetizada.\n     O deck recebe um AudioBuffer nos dois casos e nao percebe diferenca. */\n  if (typeof renderTrack === &quot;function&quot;) {\n    var _orig = renderTrack;\n    renderTrack = async function(){\n      var esc = window.BANCO_SMU.escolhida;\n      if (!esc) return await _orig.apply(this, arguments);\n      try {\n        if (window.BANCO_SMU.cache[esc.arquivo]) {\n          window.__BANCO_BPM = esc.bpm;\n          return window.BANCO_SMU.cache[esc.arquivo];\n        }\n        var r = await fetch(window.BANCO_SMU.base + esc.arquivo);\n        if (!r.ok) throw new Error(&quot;HTTP &quot; + r.status);\n        var buf = await AC.decodeAudioData(await r.arrayBuffer());\n        window.BANCO_SMU.cache[esc.arquivo] = buf;\n        window.__BANCO_BPM = esc.bpm;\n        return buf;\n      } catch(e) {\n        console.warn(&quot;Banco SMU falhou, usando faixa de treino:&quot;, e);\n        window.__BANCO_BPM = null;\n        return await _orig.apply(this, arguments);\n      }\n    };\n  }\n\n  /* A barra e position:fixed, entao ela se prende a viewport do IFRAME em que\n     o sim roda. Em uso normal isso e a tela do simulador (ok). Mas quando o sim\n     e EMBUTIDO dentro de outra aula (iframe dentro de iframe), a viewport vira\n     do tamanho do aparelho na bancada e a barra cobriria o painel.\n\n     ⛔ NAO usar &quot;window.self !== window.top&quot; p/ detectar isso: em uso NORMAL o\n     sim JA roda dentro de um iframe (srcDoc do animation-player), entao essa\n     condicao e sempre verdadeira e some com a barra em todo lugar.\n     O que distingue e a PROFUNDIDADE: aninhado 2+ niveis -&gt; parent != top. */\n  function embutido(){\n    if (window.__SMU_EMBUTIDO) return true;              // bandeira explicita\n    try { return window.parent !== window.top; } catch(e) { return false; }\n  }\n  window.BANCO_SMU.mostrarBarra = function(v){           // controle manual\n    var b = document.getElementById(&quot;bancoSmuBar&quot;);\n    if (b) b.style.display = v ? &quot;flex&quot; : &quot;none&quot;;\n  };\n\n  /* Barra flutuante: nao depende do layout do aparelho (cada sim tem o seu). */\n  function montar(){\n    if (embutido()) return;                              // quem embute controla a UI\n    if (document.getElementById(&quot;bancoSmuBar&quot;)) return;\n    var bar = document.createElement(&quot;div&quot;);\n    bar.id = &quot;bancoSmuBar&quot;;\n    bar.style.cssText = &quot;position:fixed;left:8px;bottom:8px;z-index:9999;display:flex;gap:6px;&quot;+\n      &quot;align-items:center;background:#0d1117ee;border:1px solid #1d5638;border-radius:9px;&quot;+\n      &quot;padding:6px 9px;font:11px/1.3 Inter,system-ui,sans-serif;color:#b7f5cf;&quot;+\n      &quot;box-shadow:0 6px 24px #000a;backdrop-filter:blur(4px)&quot;;\n    var lbl = document.createElement(&quot;span&quot;);\n    lbl.textContent = &quot;🎵 BANCO SMU&quot;;\n    lbl.style.cssText = &quot;font-weight:800;letter-spacing:.5px&quot;;\n    var sel = document.createElement(&quot;select&quot;);\n    sel.style.cssText = &quot;font:inherit;background:#10241a;color:#dff7e9;border:1px solid #1d5638;&quot;+\n      &quot;border-radius:6px;padding:3px 6px;max-width:190px&quot;;\n    var op0 = document.createElement(&quot;option&quot;);\n    op0.value = &quot;&quot;; op0.textContent = &quot;faixa de treino (padrão)&quot;;\n    sel.appendChild(op0);\n    FAIXAS.forEach(function(f,i){\n      var o = document.createElement(&quot;option&quot;);\n      o.value = String(i); o.textContent = f.nome + &quot; · &quot; + f.bpm + &quot; BPM&quot;;\n      sel.appendChild(o);\n    });\n    var msg = document.createElement(&quot;span&quot;);\n    msg.style.cssText = &quot;color:#7fa08d&quot;;\n    sel.addEventListener(&quot;change&quot;, function(){\n      window.BANCO_SMU.escolhida = sel.value === &quot;&quot; ? null : FAIXAS[+sel.value];\n      msg.textContent = sel.value === &quot;&quot;\n        ? &quot;recarregue p/ voltar à faixa de treino&quot;\n        : &quot;recarregue o áudio p/ tocar esta faixa&quot;;\n    });\n    bar.appendChild(lbl); bar.appendChild(sel); bar.appendChild(msg);\n    document.body.appendChild(bar);\n  }\n  if (document.readyState === &quot;loading&quot;) document.addEventListener(&quot;DOMContentLoaded&quot;, montar);\n  else montar();\n})();\n\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n","kb":155},{"id":"djma9","tipo":"mixer","sub":"flagship · 4 canais · MULTI I/O","nome":"Pioneer DJM-A9","html":"&lt;!doctype html&gt;\n&lt;html lang=&quot;pt-BR&quot;&gt;\n&lt;head&gt;\n&lt;script&gt;/* PONTE SMU */\n/* ---------------------------------------------------------------------------\n   CAIXA-PRETA — primeira coisa do arquivo, de proposito.\n   O iframe e srcdoc com sandbox=&quot;allow-scripts&quot;: origem OPACA. O pai NAO\n   consegue ler o console dele, entao um erro de script dentro do aparelho\n   sumia sem deixar rastro e a gente ficava adivinhando. Daqui em diante todo\n   erro sobe para a aula por postMessage.                                    */\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function grita(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  window.__SMU_ERROS = [];\n  addEventListener(&quot;error&quot;, function(e){\n    var m = {smu:&quot;erroJS&quot;, msg:String(e.message||e.type), src:String(e.filename||&quot;&quot;), linha:e.lineno||0};\n    window.__SMU_ERROS.push(m); grita(m);\n  }, true);\n  addEventListener(&quot;unhandledrejection&quot;, function(e){\n    var r = e.reason, m = {smu:&quot;erroJS&quot;, msg:&quot;promessa: &quot;+String((r&amp;&amp;r.message)||r), src:&quot;&quot;, linha:0};\n    window.__SMU_ERROS.push(m); grita(m);\n  });\n  /* SONDA: a aula pergunta, o aparelho responde de dentro da caixa opaca.\n     E so leitura — nao muda comportamento nenhum.                           */\n  addEventListener(&quot;message&quot;, function(e){\n    var d=e.data; if(!d||d.smu!==&quot;probe&quot;) return;\n    var r; try{ r = (0,eval)(d.expr); }catch(err){ r = &quot;ERRO: &quot;+(err&amp;&amp;err.message||err); }\n    try{ r = JSON.parse(JSON.stringify(r)); }catch(_){ r = String(r); }\n    grita({smu:&quot;probeOk&quot;, id:d.id, val:r});\n  });\n})();\n/* ---------------------------------------------------------------------------\n   PRATO EM BRANCO — causa achada medindo, nao deduzindo.\n   No simulador AVULSO o jog desenha certo (medido: caixa 244x244, canvas\n   420x420). Embutido, a superficie aparece mas o disco nao. O motivo e que o\n   sim desenha UMA vez no init(); dentro de um iframe com srcdoc o layout ainda\n   nao aconteceu nessa hora, a caixa do canvas vale 0, e o desenho vai para o\n   vazio. Como o jog so e redesenhado quando alguem o gira, ele fica branco\n   para sempre.\n   Conserto no ENCAIXE, sem tocar em simulador nenhum: quando o tamanho real\n   chegar, mandamos o sim desenhar de novo.                                  */\n(function(){\n  var jaOk = false;\n  function redesenhar(){\n    try {\n      /* os sims expoem uma destas: frame() e o padrao da frota */\n      [&quot;frame&quot;,&quot;desenhar&quot;,&quot;render&quot;,&quot;draw&quot;,&quot;drawAll&quot;,&quot;pinta&quot;].forEach(function(n){\n        if (typeof window[n] === &quot;function&quot;) { window[n](); jaOk = true; }\n      });\n      /* muitos recalculam sozinhos no resize */\n      window.dispatchEvent(new Event(&quot;resize&quot;));\n    } catch(e){}\n  }\n  function medir(){\n    var c = document.querySelector('canvas[id*=&quot;jog&quot;],canvas.jogc,canvas');\n    return c ? Math.round(c.getBoundingClientRect().width) : 0;\n  }\n  /* tenta ate a caixa ter largura de verdade — sem laco infinito */\n  var n = 0;\n  var t = setInterval(function(){\n    n++;\n    if (medir() &gt; 0) { redesenhar(); }\n    if (n &gt; 20 || (jaOk &amp;&amp; medir() &gt; 0)) clearInterval(t);\n  }, 100);\n  addEventListener(&quot;load&quot;, redesenhar);\n  /* e sempre que a aula mudar o tamanho do aparelho (ampliar, girar o iPad) */\n  if (window.ResizeObserver) {\n    var ro = new ResizeObserver(function(){ redesenhar(); });\n    addEventListener(&quot;DOMContentLoaded&quot;, function(){ ro.observe(document.body); });\n  }\n})();\n(function(){\n  var PAI = (window.parent &amp;&amp; window.parent!==window) ? window.parent : null;\n  function env(m){ if(PAI) try{ PAI.postMessage(m,&quot;*&quot;); }catch(e){} }\n  function c01(v){ return v&lt;0?0:v&gt;1?1:v; }\n\n  /* ---------- 1. audio: o destino do simulador vira um grafo nosso ---------- */\n  var O = window.AudioContext || window.webkitAudioContext;\n  window.__g=[]; window.__cad=[];\n  /* ⛔ O ganho pedido pela aula tem de SOBREVIVER ao aparelho ainda nao ter\n     ligado o audio. MEDIDO na aula: a aula manda {vol,v:0} para o mixer assim\n     que o estado chega, mas nessa hora o AudioContext do mixer AINDA NAO\n     EXISTE (__cad vazio) — o comando caia no vazio. Quando o aluno tocava no\n     mixer, ele ligava o audio com ganho 1 e as bases de demonstracao DELE\n     tocavam por cima do player. Agora o pedido fica guardado e e aplicado no\n     instante em que o contexto nasce.                                       */\n  var ultVol = {v:1, eq:null, filtros:null, temPedido:false};\n  if(O){\n    function P(){\n      var c=new O(), destReal=c.destination;\n      /* ⛔ PODA. O LOAD do visor RELIGA o audio do aparelho (fecha o contexto e\n         chama startAudio() de novo). Sem podar, __cad[0] fica sendo o contexto\n         MORTO — o pico() mediria silencio para sempre e a aula acusaria\n         &quot;o player nao esta tocando&quot; com a musica no ar. */\n      window.__cad = (window.__cad||[]).filter(function(a){\n        try{ return a.ctx &amp;&amp; a.ctx.state !== &quot;closed&quot;; }catch(e){ return false; } });\n      window.__g = window.__cad.map(function(a){ return a.g; });\n      var pre=c.createGain(); pre.gain.value=1;          /* o sim conecta AQUI */\n      var an=c.createAnalyser(); an.fftSize=512; pre.connect(an);\n      var g=c.createGain(); g.gain.value=1; pre.connect(g);\n      /* ---------------------------------------------------------------\n         A TIRA DE CANAL DO MIXER, DENTRO DO DECK.\n         O audio nao atravessa o iframe, entao o timbre nao pode &quot;vir\n         pronto&quot; do mixer. O que atravessa e a DESCRICAO dos filtros que o\n         mixer tem ligados; aqui existem biquads DE VERDADE, e o som do\n         player passa por eles. Quatro: as 3 bandas do EQ + o COLOR/FILTER.\n         O tipo/frequencia/Q de cada um NAO e chutado aqui — chega do\n         proprio no do mixer (ver a funcao cadeia() no lado mixer). Estes valores\n         iniciais so valem enquanto o mixer nao falou.                  */\n      var lo=c.createBiquadFilter(); lo.type=&quot;lowshelf&quot;;  lo.frequency.value=200;  lo.gain.value=0;\n      var md=c.createBiquadFilter(); md.type=&quot;peaking&quot;;   md.frequency.value=1000; md.Q.value=0.9; md.gain.value=0;\n      var hi=c.createBiquadFilter(); hi.type=&quot;highshelf&quot;; hi.frequency.value=4000; hi.gain.value=0;\n      var col=c.createBiquadFilter(); col.type=&quot;allpass&quot;; col.frequency.value=1000; col.Q.value=1; col.gain.value=0;\n      /* 5a casa: mixer de 4 bandas (DJM-V10) precisa dela alem do FILTER */\n      var col2=c.createBiquadFilter(); col2.type=&quot;allpass&quot;; col2.frequency.value=1000; col2.Q.value=1; col2.gain.value=0;\n      /* torneira de bancada: 1 em producao. Serve para MEDIR sem tocar som\n         na maquina de quem esta testando (window.__SMU_MUDO=1). */\n      var sai=c.createGain(); sai.gain.value = window.__SMU_MUDO ? 0 : 1;\n      g.connect(lo); lo.connect(md); md.connect(hi); hi.connect(col); col.connect(col2);\n      col2.connect(sai); sai.connect(destReal);\n      try{ Object.defineProperty(c,&quot;destination&quot;,{get:function(){
