    '<div class="regua" id="regua"><span class="rt">RÉGUA AC 110/220 V</span>'+
      [0,1,2,3].map(n=>'<div class="tom'+(tomOcupada(n)?" ok":"")+(S.pegou&&S.pegou.dono==="tom"&&S.pegou.i===n?" sel":"")+'" data-tom="'+n+'"></div>').join("")+
      '<button class="chaveac '+(S.reguaLigada?"on":"")+'" id="chaveac">'+(S.reguaLigada?"LIGADA":"DESLIGADA")+'</button>'+
    '</div>';
  const fonte = precisaFonte ?
    '<div class="fonte12"><span class="ft">FONTE EXTERNA 12 V</span>'+
      '<div class="con '+(S.cabo==="ac"?"clicavel":"morto")+(S.pegou&&S.pegou.dono==="fonte"&&S.pegou.i===0?" sel":"")+(ligado("ac","fonte",0)?" ok":"")+'" '+
        'data-dono="fonte" data-i="0" style="position:relative;left:auto;top:auto;transform:none;width:26px;height:22px">'+
        '<div class="pino"></div><span class="sig">SAÍDA 12 V</span></div>'+
      '<div class="con '+(S.cabo==="ac"?"clicavel":"morto")+(S.pegou&&S.pegou.dono==="fonte"&&S.pegou.i===1?" sel":"")+(ligado("ac","fonte",1)?" ok":"")+'" '+
        'data-dono="fonte" data-i="1" style="position:relative;left:auto;top:auto;transform:none;width:26px;height:22px">'+
        '<div class="pino"></div><span class="sig">ENTRADA AC</span></div>'+
      '<span class="instr">DJM-450, XDJ-RR e XDJ-700 <b>não têm tomada IEC</b>: usam fonte de 12 V.</span></div>' : "";
  const switchHTML = sw ?
    '<div class="switch"><span class="st">SWITCH GIGABIT — PRO DJ LINK</span>'+
      [0,1,2,3].map(n=>'<div class="con link '+(S.cabo==="link"?"clicavel":"morto")+(S.pegou&&S.pegou.dono==="sw"&&S.pegou.i===n?" sel":"")+(ligado("link","sw",n)?" ok":"")+'" '+
        'data-dono="sw" data-i="'+n+'" style="position:relative;left:auto;top:auto;transform:none;width:22px;height:20px">'+
        '<div class="pino"></div><span class="sig">'+(n+1)+'</span></div>').join("")+
      '<span class="instr">O mixer escolhido não tem porta LINK para os dois players — no clube entra um <b>switch</b>.</span></div>' : "";
  return '<div class="cabos-topo">'+botoes+'<span class="instr">'+instr+'</span></div>'+
    '<div class="bancada" id="bancada">'+
      '<svg class="fios" id="fios"></svg>'+
      painelHTML(S.d1,"d1","ESQUERDA")+
      painelHTML(S.mix,"mix","MIXER")+
      painelHTML(S.d2,"d2","DIREITA")+
      switchHTML+fonte+regua+
    '</div>';
}
function tomOcupada(n){ return S.ligacoes.some(l=>l.tipo==="ac" && ((l.a.dono==="tom"&&l.a.i===n)||(l.b.dono==="tom"&&l.b.i===n))); }

/* ---- regras de ligacao da aula 1 ---- */
function conDe(dono,i){
  if(dono==="tom")   return {cat:"tomada", sig:"TOMADA "+(i+1)};
  if(dono==="fonte") return {cat:i===0?"dcSaida":"plugAC", sig:i===0?"SAÍDA 12 V":"ENTRADA AC DA FONTE"};
  if(dono==="sw")    return {cat:"link", sig:"SWITCH porta "+(i+1)};
  if(i>=1000){       /* pontas de cabo cativo */
    const t=trasDe(donoId(dono))||{};
    const p=[]; if(t.cativoAC)p.push({cat:"plugAC",sig:"PLUGUE DE FORÇA"});
    if(t.cativoRCA)p.push({cat:"rca-out",sig:"PAR RCA L/R (cativo)"});
    if(t.cativoGND)p.push({cat:"gnd",sig:"TERRA"});
    return p[i-1000] || null;
  }
  const t=trasDe(donoId(dono)); if(!t||!t.itens) return null;
  return t.itens[i] || null;
}
function donoId(d){ return d==="d1"?S.d1 : d==="d2"?S.d2 : d==="mix"?S.mix : null; }

/* devolve null se pode ligar, ou a EXPLICACAO do erro */
function porQueNao(a,b){
  const ca=conDe(a.dono,a.i), cb=conDe(b.dono,b.i);
  if(!ca||!cb) return "conector desconhecido.";
  if(a.dono===b.dono) return "os dois lados do cabo estão no mesmo aparelho.";
  if(S.cabo==="ac"){
    const ehTom = x=>x.cat==="tomada";
    const ehEntrada = x=>x.cat==="ac"||x.cat==="plugAC";
    const ehDC = x=>x.cat==="dcin";
    const ehSaidaDC = x=>x.cat==="dcSaida";
    if(ehTom(ca)&&ehEntrada(cb)) return null;
    if(ehEntrada(ca)&&ehTom(cb)) return null;
    if(ehDC(ca)&&ehSaidaDC(cb)) return null;
    if(ehSaidaDC(ca)&&ehDC(cb)) return null;
    if((ehDC(ca)&&ehTom(cb))||(ehTom(ca)&&ehDC(cb)))
      return "esse aparelho tem <b>DC IN 12 V</b>, não tomada: ele não vai direto na régua. Passe pela <b>FONTE 12 V</b>.";
    return "cabo de força liga <b>entrada de força</b> na <b>tomada</b> — nada mais.";
  }
  if(S.cabo==="rca"){
    const saida = ca.cat==="rca-out" ? ca : cb.cat==="rca-out" ? cb : null;
    const entra = ca.cat==="rca-in" ? ca : cb.cat==="rca-in" ? cb : null;
    if(!saida||!entra) return "RCA liga uma <b>saída</b> de player numa <b>entrada</b> de canal do mixer.";
    const donoSaida = ca.cat==="rca-out" ? a.dono : b.dono;
    if(!donoEhPlayer(donoSaida)) return "a saída tem de ser a do <b>player</b>.";
    const idPlayer = donoId(donoSaida);
    const ehPhonoEnt = /PHONO/i.test(entra.sig);
    const ehVinilP = ehVinil(nomeDe(idPlayer));
    if(ehVinilP && !ehPhonoEnt)
      return "o <b>"+esc(nomeDe(idPlayer))+"</b> é toca-discos: sai em <b>nível de agulha</b> e precisa de uma entrada <b>PHONO</b>. Em LINE o som fica fininho e baixo.";
    if(!ehVinilP && ehPhonoEnt)
      return "o <b>"+esc(nomeDe(idPlayer))+"</b> sai em <b>nível de linha</b>. Numa entrada <b>PHONO</b> o pré-amplificador de agulha satura: distorce e estoura.";
    return null;
  }
  if(S.cabo==="link"){
    if(ca.cat!=="link"||cb.cat!=="link") return "cabo de rede liga <b>LINK</b> em <b>LINK</b>.";
    if(donoEhPlayer(a.dono)&&donoEhPlayer(b.dono))
      return "player com player não fecha o PRO DJ LINK: os dois vão ao <b>mixer</b> ou ao <b>switch</b>.";
    return null;
  }
  return "cabo desconhecido.";
}
function clicarConector(dono,i){
  if(!S.pegou){ S.pegou={dono,i}; render(); return; }
  if(S.pegou.dono===dono && S.pegou.i===i){ S.pegou=null; render(); return; }
  const a=S.pegou, b={dono,i};
  const erro=porQueNao(a,b);
  if(erro){ S.erroCabo=erro; S.pegou=null; render(); return; }
  S.erroCabo=null;
  /* um conector so aceita um cabo: tira o que estava */
  S.ligacoes = S.ligacoes.filter(l=>!(l.tipo===S.cabo &&
    (l.a.dono===a.dono&&l.a.i===a.i || l.b.dono===a.dono&&l.b.i===a.i ||
     l.a.dono===b.dono&&l.a.i===b.i || l.b.dono===b.dono&&l.b.i===b.i)));
  S.ligacoes.push({tipo:S.cabo, a, b});
  S.pegou=null; render();
}
/* desenha os fios */
function fios(){
  const svg=$("#fios"), banc=$("#bancada"); if(!svg||!banc) return;
  const B=banc.getBoundingClientRect(); svg.innerHTML="";
  for(const l of S.ligacoes){
    const ea=$("#c-"+l.a.dono+"-"+l.a.i)||$('[data-tom="'+l.a.i+'"]');
    const eb=$("#c-"+l.b.dono+"-"+l.b.i)||$('[data-tom="'+l.b.i+'"]');
    const ea2 = l.a.dono==="tom" ? $('[data-tom="'+l.a.i+'"]') : ea;
    const eb2 = l.b.dono==="tom" ? $('[data-tom="'+l.b.i+'"]') : eb;
    if(!ea2||!eb2) continue;
    const r1=ea2.getBoundingClientRect(), r2=eb2.getBoundingClientRect();
    const x1=r1.left+r1.width/2-B.left, y1=r1.top+r1.height/2-B.top;
    const x2=r2.left+r2.width/2-B.left, y2=r2.top+r2.height/2-B.top;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    const curva=Math.max(24,Math.abs(y2-y1)*0.45);
    p.setAttribute("d","M"+x1+","+y1+" C"+x1+","+(y1+curva)+" "+x2+","+(y2-curva)+" "+x2+","+y2);
    p.setAttribute("stroke",(CABOS[l.tipo]||{}).cor||"#888");
    p.setAttribute("stroke-width","3"); p.setAttribute("fill","none");
    p.setAttribute("stroke-linecap","round"); p.setAttribute("opacity",".92");
    svg.appendChild(p);
  }
}

/* ---- o que falta na aula 1 ---- */
function faltaCabeamento(){
  const it=[];
  const forcas=[["d1",S.d1,"esquerda"],["mix",S.mix,"mixer"],["d2",S.d2,"direita"]];
  const forcaOk = d => {
    const modo=comoRecebeForca(donoId(d));
    if(modo==="iec"){ const c=primeiro(donoId(d),"ac"); return c?ligado("ac",d,c.i):false; }
    if(modo==="plug"){ const c=primeiro(donoId(d),"plugAC"); return c?ligado("ac",d,c.i):false; }
    if(modo==="dcin"){ const c=primeiro(donoId(d),"dcin");
      return !!(c && ligado("ac",d,c.i) && ligado("ac","fonte",0) && ligado("ac","fonte",1)); }
    return ligado("ac",d,1000);
  };
  it.push([forcas.every(([d])=>forcaOk(d)), "Ligar a <b>força</b> dos três",
    "Cada um do seu jeito: tomada IEC vai direto na régua; <b>DC IN 12 V</b> passa pela fonte; cabo cativo é o plugue solto."]);
  it.push([S.reguaLigada, "<b>Ligar a régua</b>", "Aparelho plugado com a régua desligada continua morto."]);
  const rcaOk = d => {
    const outs=itens(donoId(d),"rca-out");
    const alvo = outs.length ? outs : (trasDe(donoId(d))||{}).cativoRCA ? [{i:1001}] : [];
    return alvo.some(o=>ligado("rca",d,o.i));
  };
  it.push([rcaOk("d1")&&rcaOk("d2"), "Ligar o <b>RCA</b> dos dois players",
    "Na traseira dos mixers Pioneer os canais vêm ao contrário: da esquerda para a direita lê-se <b>CH4, CH3, CH2, CH1</b>. Leia a serigrafia."]);
  if(linkAplicavel()){
    const linkOk = d => temLink(donoId(d)) ? itens(donoId(d),"link").some(c=>ligado("link",d,c.i)) : true;
    it.push([linkOk("d1")&&linkOk("d2"), "Ligar o <b>RJ45 (PRO DJ LINK)</b>",
      "É o cabo de rede que faz os players conversarem: BPM, onda e a mesma pasta do USB em todos."]);
  } else {
    it.push([true, "<b>PRO DJ LINK</b>: não se aplica",
      "Nenhum dos dois players tem porta LINK — nesta cabine não há cabo de rede."]);
  }
  return it;
}

/* ============================================================================
   7. AULA 2 — A MESA (mixer no centro, esquerda=CH1, direita=CH2)
   ============================================================================ */
function telaMesa(){

function caixaAparelho(slot, s, rot, cls){
  return '<section class="apl" id="apl-'+slot+'" data-slot="'+slot+'">'+
    '<div class="cab"><span class="nm">'+esc(s.nome)+'</span>'+

      '<span class="esq">'+
        '<button class="btn" data-ampliar="'+slot+'">AMPLIAR</button>'+
      '</span></div>'+
    '<div class="moldura" id="mol-'+slot+'">'+
      '<iframe id="if-'+slot+'" sandbox="allow-scripts allow-popups" srcdoc="'+s.html+'"></iframe>'+
    '</div></section>';

/* ============================================================================
   DIMENSIONAR — a regra é CABER, nunca preencher.
   ----------------------------------------------------------------------------
     escala = Math.min(larguraDisponível/larguraNatural, alturaDisponível/alturaNatural)
   Math.min, sempre. Com Math.max o aparelho preenche e sai pelas laterais, que
   foi o defeito do AMPLIAR. Com min, sobra folga — e a folga é centralizada.

   O tamanho NATURAL vem do próprio simulador (a ponte responde {smu:"tam"}),
   então nada aqui é chutado. O iframe fica no tamanho natural e é o TRANSFORM
   que encolhe/cresce: assim fonte, borda e padding (medidos em px, que não
   escalam sozinhos) encolhem junto e nada encavala. O simulador por dentro
   continua achando que tem a tela inteira — o fit() dele fica em 1:1.

   Arranjo: testamos EMPILHADO e LADO A LADO e ficamos com o que dá o aparelho
   MAIOR. Se nenhum dos dois passa de MIN_K, empilhamos em tamanho legível e o
   palco ROLA. Cortar, nunca.
   ============================================================================ */
const GAP=6, CAB=27, MIN_K=0.55;
function tamDe(slot){ const t=S.tam[slot]; return (t&&t.w>0&&t.h>0)?t:{w:560,h:760}; }

function escalar(slot, k, dispH){
  const mol=$("#mol-"+slot), fr=$("#if-"+slot), sec=$("#apl-"+slot);
  if(!mol||!fr) return;
  const t=tamDe(slot);
  const lw=Math.round(t.w*k), lh=Math.round(t.h*k);
  fr.style.width=t.w+"px"; fr.style.height=t.h+"px";
  fr.style.transform="translateX(-50%) scale("+k+")";
  const alturaCaixa = (dispH!=null && dispH>lh) ? dispH : lh;
  mol.style.height=alturaCaixa+"px";
  fr.style.top=Math.max(0,Math.round((alturaCaixa-lh)/2))+"px";
  if(sec && !sec.classList.contains("ampliado")) sec.style.width=(lw+2)+"px";
}
function dimensionar(){
  const mesa=$("#mesa"); if(!mesa) return;
  const palco=$("#palco");
  const slots = S.aio ? ["m"] : ["1","m","2"];
  const W = palco.clientWidth-14, H = palco.clientHeight-14;
  if(W<=0||H<=0) return;

  if(S.ampliado){
    const sec=$("#apl-"+S.ampliado); if(!sec) return;
    const dispW = sec.clientWidth-2, dispH = sec.clientHeight-CAB-2;
    const t=tamDe(S.ampliado);
    escalar(S.ampliado, Math.min(dispW/t.w, dispH/t.h), dispH);   /* CABER */
    return;
  }
  const n=slots.length;
  const somaW=slots.reduce((a,s)=>a+tamDe(s).w,0);
  const somaH=slots.reduce((a,s)=>a+tamDe(s).h,0);
  const maxW=Math.max(...slots.map(s=>tamDe(s).w));
  const maxH=Math.max(...slots.map(s=>tamDe(s).h));
  const kCol=Math.min(W/maxW, (H-n*CAB-(n-1)*GAP)/somaH);
  const kLin=Math.min((W-(n-1)*GAP)/somaW, (H-CAB)/maxH);
  const melhor=Math.max(kCol,kLin);
  let k, linha, rola=false;
  if(melhor<MIN_K){ linha=false; rola=true; k=Math.min(1, W/maxW); }
  else { linha = kLin>kCol; k = linha?kLin:kCol; }
  mesa.classList.toggle("linha", linha);
  mesa.classList.toggle("coluna", !linha);
  mesa.classList.toggle("rola", rola);
  slots.forEach(s=>escalar(s,k,null));
}
function ampliar(slot){
  S.ampliado = (S.ampliado===slot) ? null : slot;
  const mesa=$("#mesa");
  if(mesa){
    mesa.classList.toggle("temAmpliado", !!S.ampliado);
    $$(".apl",mesa).forEach(a=>{
      a.classList.toggle("ampliado", a.dataset.slot===S.ampliado);
      if(a.dataset.slot===S.ampliado) a.style.width="";
    });
    $$("[data-ampliar]",mesa).forEach(b=>{
      b.textContent = (b.dataset.ampliar===S.ampliado) ? "VOLTAR" : "AMPLIAR";
    });
  }
  document.documentElement.classList.toggle("ampliado", !!S.ampliado);
  const bt=$("#btnAmpliar"); if(bt) bt.textContent = S.ampliado ? "VOLTAR" : "AMPLIAR";
  requestAnimationFrame(()=>{ dimensionar(); requestAnimationFrame(dimensionar); });
}

/* ============================================================================
   8. O SOM: o deck toca, o MIXER manda — a moldura traduz
   ------------------------------------------------------------------------
   Audio NAO atravessa iframe (MediaStream nao e clonavel por postMessage).
   Entao ninguem tenta conectar grafo com grafo: o simulador do MIXER publica o
   ESTADO dele (fader, EQ, trim, crossfader, master, seletor) e a moldura manda
   GANHO e EQ para cada deck, que aplica no proprio grafo. O som do mixer fica
   mudo — quem toca e o player, como na cabine.
   ============================================================================ */
function faderLaw(v){ return v<=0 ? 0 : Math.pow(v,1.6); }
function xfGanho(xf, lado){
  if(xf==null) return 1;
  if(lado==="A") return Math.cos(xf*Math.PI/2);
  if(lado==="B") return Math.cos((1-xf)*Math.PI/2);
  return 1;                                    /* THRU: crossfader nao mexe */
}
function eqDb(v){ return (clamp(v==null?0.81:v,0,1)-0.81)/0.19*6; }   /* 0.81 = centro dos EQ Pioneer */

/* ---- o SELETOR DE ENTRADA do canal ----
   A serigrafia vem do proprio simulador (SEL_LAB, que ja saiu do manual).
   Aqui so se decide se ela CASA com o que esta entrando. Se o simulador nao
   souber informar, o elo fica "desconhecido" e NAO silencia: silenciar por
   chute seria pior que nao silenciar (regra 3 do projeto). */
function tipoDaPosicao(pos){
  if(!pos) return null;
  if(/PHONO/i.test(pos)) return "phono";
  if(/DECK|ENGINE/i.test(pos)) return "deck";      /* player interno */
  if(/LINE|\bCD\d?\b/i.test(pos)) return "line";
  return "outra";                                   /* USB, DIGITAL, RETURN/AUX... */
}
const fonteDoPlayer = id => ehVinil(nomeDe(id)) ? "phono" : "line";

/* POSICOES IMPRESSAS NO SELETOR — so entra aqui o que esta CONFERIDO NO MANUAL.
   Serve de 2a fonte: se o proprio simulador publicar a serigrafia (SEL_LAB),
   ela vence. Se nao houver nem uma nem outra, o elo fica DESCONHECIDO e a aula
   NAO silencia — silenciar por chute seria pior que nao silenciar. */
const POSICOES = {
  /* DJM-800 — manual oficial: "Note that no PHONO input connector is provided
     for channel 1." CH2 tem CD/DIGITAL, CH3/CH4 tem LINE/DIGITAL. */
  djm800:{1:["CD/DIGITAL","LINE"],2:["CD/DIGITAL","PHONO"],3:["LINE/DIGITAL","PHONO"],4:["LINE/DIGITAL","PHONO"]},
  /* DJM-600 — manual oficial, citacao literal: "CH-1: Switches between CD1/LINE
     and LINE · CH-2: CD2/LINE and PHONO 1 · CH-3: LINE and PHONO 2 · CH-4:
     LINE and SUB MIC/PHONO 3". O CH-1 nao tem PHONO nenhum. */
  djm600:{1:["CD1/LINE","LINE"],2:["CD2/LINE","PHONO 1"],3:["LINE","PHONO 2"],4:["LINE","SUB MIC/PHONO 3"]},
  djm750:{1:["USB","LINE","PHONO","RETURN AUX"],2:["USB","LINE","PHONO","RETURN AUX"],
          3:["USB","LINE","PHONO","RETURN AUX"],4:["USB","LINE","PHONO","RETURN AUX"]},
  djm900:{1:["USB A","USB B","DIGITAL","LINE","PHONO","RETURN/AUX"],2:["USB A","USB B","DIGITAL","LINE","PHONO","RETURN/AUX"],
          3:["USB A","USB B","DIGITAL","LINE","PHONO","RETURN/AUX"],4:["USB A","USB B","DIGITAL","LINE","PHONO","RETURN/AUX"]},
  djm2000:{1:["CD/DIGITAL","PHONO","USB 1/2"],2:["CD/DIGITAL","LINE","USB 3/4"],
           3:["CD/DIGITAL","LINE","USB 5/6"],4:["CD/DIGITAL","PHONO","USB 7/8"]},
  djmv10:{1:["USB A","USB B","DIGITAL","LINE","PHONO","BUILT-IN"],2:["USB A","USB B","DIGITAL","LINE","MULTI I/O","BUILT-IN"],
          3:["USB A","USB B","DIGITAL","LINE","PHONO","BUILT-IN"],4:["USB A","USB B","DIGITAL","LINE","PHONO","BUILT-IN"],
          5:["USB A","USB B","DIGITAL","LINE","MULTI I/O","BUILT-IN"],6:["USB A","USB B","DIGITAL","LINE","PHONO","BUILT-IN"]},
  /* ⚠️ DJM-450 e X1850: o manual nao esta em disco. As posicoes saem da REPLICA
     fiel em disco. Marcado como nao conferido — ver estimado() abaixo. */
  djm450:{1:["USB","LINE","PHONO"],2:["USB","LINE","PHONO"]},
  x1850:{1:["DIGITAL","LINE","PHONO","USB","DVS"],2:["DIGITAL","LINE","PHONO","USB","DVS"],
         3:["DIGITAL","LINE","PHONO","USB","DVS"],4:["DIGITAL","LINE","PHONO","USB","DVS"]},
};
const SEM_MANUAL = new Set(["djm450","x1850"]);

function selDoCanal(c){
  const m=S.mixEstado;
  if(!m) return {conhecido:false};
  const ops = (m.selOps && m.selOps[c]) || (POSICOES[S.mix]||{})[c] || null;
  const idx = m.selIdx ? m.selIdx[c] : null;
  if(!ops || idx==null) return {conhecido:false};
  /* chave de 2 posicoes: o simulador usa 0 e 2 (esquerda/direita) */
  const i = ops.length<=2 ? (idx>=2?1:0) : Math.min(idx, ops.length-1);
  const pos = ops[i];
  const alvo = fonteDoPlayer(c===1?S.d1:S.d2);
  const certas = ops.filter(p=>tipoDaPosicao(p)===alvo);
  return {conhecido:true, pos, casa: tipoDaPosicao(pos)===alvo, certas,
          estimado: SEM_MANUAL.has(S.mix) && !(m.selOps&&m.selOps[c])};
}

/* qual elo esta cortando o som do canal — a resposta que o painel mostra */
function eloDoCanal(c){
  const m=S.mixEstado;
  if(!m) return {ok:false, txt:"o simulador do mixer ainda não respondeu — toque no mixer uma vez para acordá-lo."};
  if(m.on && m.on[c]===false) return {ok:false, txt:"o <b>CANAL "+c+"</b> está <b>desligado</b> na tecla ON."};
  const sel=selDoCanal(c);
  if(sel.conhecido && !sel.casa)
    return {ok:false, txt:"o <b>seletor de entrada do CANAL "+c+"</b> está em <b>"+esc(sel.pos)+"</b>. Nessa posição o canal ouve outra fonte — o player não sai. "+
      (sel.certas.length?"Neste canal a posição é <b>"+sel.certas.map(esc).join("</b> ou <b>")+"</b>.":"Este canal não tem posição para essa fonte — o player teria de ir para outro canal.")+
      (sel.estimado?" <span class='est'>⚠️ ESTIMADO</span> a serigrafia deste mixer saiu da réplica em disco, não do manual oficial.":"")};
  const f = m.fader && m.fader[c];
  if(f!=null && f<0.03) return {ok:false, txt:"o <b>fader do CANAL "+c+"</b> está fechado."};
  const t = m.trim && m.trim[c];
  if(t!=null && t<0.03) return {ok:false, txt:"o <b>TRIM do CANAL "+c+"</b> está no zero."};
  const lado = m.assign ? m.assign[c] : null;
  const gx = xfGanho(m.xf, lado);
  if(gx<0.03) return {ok:false, txt:"o <b>crossfader</b> está todo do outro lado (canal "+c+" atribuído a <b>"+esc(lado||"?")+"</b>)."};
  if(m.master!=null && m.master<0.03) return {ok:false, txt:"o <b>MASTER</b> do mixer está fechado."};
  if((S.nivel[c]||0)<0.004) return {ok:false, txt:"o <b>player do canal "+c+"</b> não está tocando: "+
    (S.carregada[c] ? "a faixa <b>"+esc(S.carregada[c].nome)+"</b> está carregada — aperte <b>PLAY</b>."
                    : "carregue uma faixa <b>no visor do aparelho</b> (USB / BROWSE) e aperte PLAY.")};
  return {ok:true, txt:""};
}
/* ----------------------------------------------------------------------------
   O GANHO E O TIMBRE QUE VAO PARA O DECK
   Duas fontes, nesta ordem — e a ordem importa:

   1) m.aud — os NÓS DE ÁUDIO do próprio mixer, lidos depois que o aluno ligou
      o áudio dele. É a fonte de verdade: o simulador já converteu posição de
      controle em parâmetro (o DJM-900NXS2 faz −26..+6 dB por banda e o TRIM
      −∞..+9 dB, como no manual dele). Aqui só se MULTIPLICA o que ele fez e se
      copia a especificação dos filtros para o deck montar biquads iguais.
      ⛔ Não se refaz a conta de dB deste lado. Refazer seria criar uma segunda
      verdade, que discorda da primeira no dia em que alguém mexer no mixer.

   2) posição dos controles — o caminho antigo, que continua valendo enquanto o
      áudio do mixer não ligou (aí não existe nó nenhum para ler).

   O que sai daqui:  v = trim × fader × crossfader × master   (produto puro, sem
   constante inventada), e `filtros` = as 3 bandas do EQ + o COLOR/FILTER, cada
   um com tipo, frequência, Q e ganho MEDIDOS no mixer.
   ---------------------------------------------------------------------------- */
function ganhoDoCanal(c){
  const m=S.mixEstado; if(!m) return {v:0, eq:null, filtros:null};
  const sel=selDoCanal(c);
  if(sel.conhecido && !sel.casa) return {v:0, eq:null, filtros:null};  /* seletor noutra fonte */
  if(m.on && m.on[c]===false)    return {v:0, eq:null, filtros:null};  /* canal desligado na tecla */

  const A = m.aud && m.aud.ch ? m.aud.ch[c] : null;
  if(A){
    const bus  = A.bus!=null ? A.bus : xfGanho(m.xf, m.assign?m.assign[c]:null);
    const mstA = m.aud.master!=null ? m.aud.master : 1;
    const v = (A.trim!=null?A.trim:1) * (A.fader!=null?A.fader:1) * bus * mstA;
    /* ordem indiferente: filtros lineares em cascata comutam.
       São 5 casas no deck — o bastante para um mixer de 4 bandas (DJM-V10)
       mais o FILTER/COLOR do canal. */
    const filtros = [A.low, A.mid2, A.mid, A.hi, A.color].filter(Boolean).slice(0,5);
    return {v:clamp(v,0,2), eq:null, filtros:filtros.length?filtros:null};
  }

  const f = m.fader && m.fader[c]!=null ? m.fader[c] : 1;
  const t = m.trim  && m.trim[c]!=null  ? m.trim[c]  : 0.55;
  const lado = m.assign ? m.assign[c] : null;
  const mst = m.master!=null ? m.master : 0.75;
  const v = faderLaw(f) * xfGanho(m.xf,lado) * (0.35+t*1.3) * (mst*1.2);
  const eq = m.eq && m.eq[c] ? { hi:eqDb(m.eq[c].hi), mid:eqDb(m.eq[c].mid), low:eqDb(m.eq[c].low) } : null;
  return {v:clamp(v,0,2), eq, filtros:null};
}
/* ============================================================================
   OS DOIS VU DO MIXER — sao medidores DIFERENTES, e de proposito.
   ----------------------------------------------------------------------------
   Manual do DJM-900NXS2, "Part names and functions" (citacao literal):
     k) Channel Level Indicator — "Displays the sound level of the respective
        channels BEFORE passing through the channel faders."
     q) Master Level Indicator  — "Displays the audio level output from the
        [MASTER1] and [MASTER2] terminals."
   Ou seja: fechar o fader do canal NAO derruba o VU daquele canal (ele mede
   antes do fader, depois do TRIM e do EQ), mas derruba o do MASTER.
   O manual ainda confirma o uso: "Adjust the [TRIM] control so that the channel
   level indicator lights at about [0 dB] at the peak level."

   ⛔ A ESCALA em dB nao e feita aqui. Ela ja esta dentro de cada simulador,
   tirada do manual dele (o DJM-900NXS2 desenha 15 segmentos por medidor:
   canal +12..-30 dB e master +15..-27 dB, exatamente como na figura do painel).
   O que a aula manda e o SINAL — o nivel que existiria no cabo. Quem converte
   sinal em LED continua sendo o aparelho.
   ============================================================================ */
function ganhoEq(c){
  const m=S.mixEstado, e=m&&m.eq&&m.eq[c];
  if(!e) return 1;
  const db=(eqDb(e.hi)+eqDb(e.mid)+eqDb(e.low))/3;    /* media das 3 bandas */
  return Math.pow(10, db/20);
}
const audDo = c => { const m=S.mixEstado; return (m&&m.aud&&m.aud.ch)?m.aud.ch[c]:null; };
/* ganho de tensao dos 3 EQ, em linear. Quando os nos existem, sai do dB DELES. */
function ganhoEqReal(c){
  const A=audDo(c); if(!A) return ganhoEq(c);
  const db=[A.hi,A.mid,A.low].filter(Boolean).map(x=>x.g||0);
  if(!db.length) return 1;
  return Math.pow(10, (db.reduce((a,b)=>a+b,0)/db.length)/20);
}
function vuDoCanal(c){
  const m=S.mixEstado; if(!m) return 0;
  const sel=selDoCanal(c);
  if(sel.conhecido && !sel.casa) return 0;      /* seletor noutra fonte: nada entra */
  if(m.on && m.on[c]===false) return 0;
  const A=audDo(c);
  const t = A ? (A.trim!=null?A.trim:1) : (m.trim&&m.trim[c]!=null ? (0.35+m.trim[c]*1.3) : 0.9);
  return clamp((S.nivel[c]||0)*t*ganhoEqReal(c), 0, 1);
}
function vuMaster(){
  const m=S.mixEstado; if(!m) return 0;
  let s=0;
  [1,2].forEach(c=>{
    const A=audDo(c);
    if(A){ s += vuDoCanal(c) * (A.fader!=null?A.fader:1) * (A.bus!=null?A.bus:1); return; }
    const f = m.fader && m.fader[c]!=null ? m.fader[c] : 1;
    const lado = m.assign ? m.assign[c] : null;
    s += vuDoCanal(c) * faderLaw(f) * xfGanho(m.xf,lado);
  });
  const mst = (m.aud && m.aud.master!=null) ? m.aud.master : (m.master!=null ? m.master*1.2 : 0.9);
  return clamp(s*mst, 0, 1);
}
function mandarVU(){
  if(eCabeamento || S.aio) return;              /* tudo-em-um mede o proprio audio */
  manda("m",{smu:"vu", ch:{1:vuDoCanal(1), 2:vuDoCanal(2)}, master:vuMaster()});
}
function aplicarAudio(){
  if(eCabeamento) return;
  if(S.aio){                                   /* tudo-em-um: um aparelho so */
    manda("m",{smu:"vol",v:1});
    return;
  }
  manda("m",{smu:"vol",v:0});                  /* o mixer nao toca: quem toca e o player */
  [1,2].forEach(c=>{
    const g=ganhoDoCanal(c);
    S.ganho[c]=g;
    /* "canal" e o contrato novo; "v" segue junto para o deck antigo entender */
    manda(String(c),{smu:"canal", ch:c, g:g.v, v:g.v, eq:g.eq, filtros:g.filtros});
  });
  mandarVU();
  pintarRoteamento();
}
function manda(slot,msg){
  const f=$("#if-"+slot);
  if(f&&f.contentWindow) try{ f.contentWindow.postMessage(msg,"*"); }catch(e){}
}

/* ============================================================================
   O CAMINHO DO SOM, À VISTA
   Ordem do dono: "a CDJ escolhe a música, dá play, este sinal vai para o canal
   da DJM que passa por todo o processo do mixer (gain, EQ, efeitos entre
   outros) e vai para o master, que sai no som do equipamento".
   Se o aluno não VÊ esse caminho, ele não aprende que existe. Esta faixa mostra,
   em tempo real, o número que a aula está mandando para cada deck — o mesmo
   número que o deck aplica no ganho dele.
   ============================================================================ */
const emDb = v => (v==null||v<=0.0005) ? "−∞" : (20*Math.log10(v)).toFixed(1).replace(".",",");
function pintarRoteamento(){
  const el=$("#rota"); if(!el) return;
  if(eCabeamento || S.passo!==2 || S.aio){ el.hidden=true; return; }
  el.hidden=false;
  const m=S.mixEstado;
  const via=(c)=>{
    const g=S.ganho[c], A=audDo(c);
    const v=g?g.v:null, mudo=(v==null||v<0.0005);
    const det=[];
    /* o SELETOR DE ENTRADA vem primeiro: é o defeito nº 1 da cabine de verdade
       e, quando ele está errado, é ele que está cortando o som. */
    const sel=selDoCanal(c);
    if(sel.conhecido) det.push("ENTRADA "+sel.pos+(sel.casa?"":" ✗ devia ser "+sel.certas.join("/")));
    if(A){
      if(A.trim!=null) det.push("TRIM "+emDb(A.trim)+" dB");
      const eqDbTxt = x => { if(!x) return "·"; const r=Math.round(x.g||0); return (r>0?"+":r<0?"−":"")+Math.abs(r); };
      if([A.hi,A.mid,A.low].some(Boolean)) det.push("EQ "+[A.hi,A.mid,A.low].map(eqDbTxt).join("/"));
      if(A.color && A.color.t!=="allpass") det.push("FILTER "+A.color.t.toUpperCase()+" "+Math.round(A.color.f)+" Hz");
      if(A.fader!=null) det.push("FADER "+emDb(A.fader)+" dB");
    } else if(m){
      if(m.trim&&m.trim[c]!=null)  det.push("TRIM "+Math.round(m.trim[c]*100)+"%");
      if(m.fader&&m.fader[c]!=null)det.push("FADER "+Math.round(m.fader[c]*100)+"%");
    }
    if(m&&m.assign&&m.assign[c]) det.push("X-FADER "+m.assign[c]);
    if(m&&m.cue&&m.cue[c]) det.push("CUE");
    const larg=Math.round(clamp(v||0,0,1.2)/1.2*100);
    return '<span class="via ch'+c+' '+(mudo?"off":"")+'">'+
      '<b>PLAYER '+(c===1?"ESQ":"DIR")+'</b><span class="seta">▶</span><b>CH'+c+'</b>'+
      '<span class="db">'+emDb(v)+' dB</span>'+
      '<span class="barra '+(larg>92?"q":"")+'"><i style="width:'+larg+'%"></i></span>'+
      (det.length?'<span class="det">'+esc(det.join(" · "))+'</span>':'')+
    '</span>';
  };
  const mst = (m&&m.aud&&m.aud.master!=null) ? m.aud.master : (m&&m.master!=null? m.master*1.2 : null);
  el.innerHTML = via(1)+'<span class="seta">▶</span>'+
    '<span class="via mst"><b>MASTER</b><span class="db">'+emDb(mst)+' dB</span>'+
      '<span class="seta">▶</span><span class="det">sai no alto-falante do seu aparelho</span></span>'+
    '<span class="seta">◀</span>'+via(2);
}

/* ---- conversa com os simuladores ---- */
addEventListener("message",ev=>{
  const d=ev.data; if(!d||!d.smu) return;
  const slot = slotDaJanela(ev.source);
  if(d.smu==="tam" && slot){
    S.tam[slot]={w:d.w,h:d.h};
    dimensionar();
    return;
  }
  if(d.smu==="estado" && slot==="m"){ S.mixEstado=d.est; aplicarAudio(); pintarPainel(); return; }
  /* o pico do player chega ~7x por segundo; e ele que move o VU do mixer */
  if(d.smu==="nivel" && (slot==="1"||slot==="2")){ S.nivel[+slot]=d.v; mandarVU(); pintarPainel(); return; }
  /* ---------------------------------------------------------------------
     O VISOR DO APARELHO FALANDO COM A AULA
     A playlist e UMA so (um pen drive nao se divide): quem guarda e a aula, e
     ela devolve a lista atualizada para os tres aparelhos. Assim o que o aluno
     guardou olhando o deck 1 aparece no visor do deck 2 — como no pen drive.
     --------------------------------------------------------------------- */
  if(d.smu==="plToggle"){
    const f=d.faixa; if(!f||!f.id) return;
    S.playlist = naPlaylist(f.id) ? S.playlist.filter(x=>x.id!==f.id) : S.playlist.concat([f]);
    mandarBiblioteca(); pintarPainel(); return;
  }
  if(d.smu==="plNova"){
    const f=d.faixa;
    /* confere o id do YouTube tambem deste lado: 11 caracteres, nada mais */
    if(!f || f.tipo!=="yt" || !idDoYoutube(f.yt)) return;
    if(!naPlaylist(f.id)) S.playlist = S.playlist.concat([f]);
    mandarBiblioteca(); pintarPainel(); return;
  }
  if(d.smu==="carregou" && slot){
    S.carregada[slot]={nome:d.nome,bpm:d.bpm,tipo:d.tipo,amostras:d.amostras,taxa:d.taxa};
    pintarPainel(); if(S.popAberto==="mus") pintarMusicas(); return;
  }
  if(d.smu==="carregouErro" && slot){
    S.erroFaixa="Deck "+slot+": "+d.erro; pintarPainel(); return;
  }
  /* PONTE DO YOUTUBE: o player mora na moldura da AULA (React), nunca no
     simulador. Aqui a aula so repassa — ela e o iframe direto do player.
     O visor ja manda um `slot` unico na cabine ("1-1", "2-1", "m-2"): sem isso
     os dois aparelhos pediriam o slot "A" e um comeria o player do outro.
     Aqui so se poe o ROTULO que o aluno le na moldura. */
  if(d.smu==="yt"){
    /* ⛔ SO REPASSA O QUE VEIO DE UM SIMULADOR NOSSO.
       MEDIDO: com a aula aberta SOZINHA (fora do player do curso) `parent` E a
       propria janela. O repasse voltava para este mesmo ouvinte, que repassava
       de novo — LACO INFINITO de postMessage, o navegador travava e no teste
       encheu 79 MB de mensagens em segundos. Fora do player nao ha ponte do
       YouTube para receber: o certo e nao repassar. */
    if(!slot) return;
    if(parent === window){
      /* aula aberta fora do player: nao existe ponte do YouTube. Avisa o visor
         em vez de deixar o aluno achando que carregou e nao toca. */
      manda(slot,{smu:"ytev", ev:"semPonte"});
      return;
    }
    const m=Object.assign({},d);
    m.label = slot==="m" ? "TUDO-EM-UM" : ("DECK "+slot+" ("+(slot==="1"?"esquerda":"direita")+")");
    try{ parent.postMessage(m,"*"); }catch(e){}
    return;
  }
  if(d.smu==="ytev"){ ["1","2","m"].forEach(s=>manda(s,d)); return; }
});
function slotDaJanela(w){
  for(const s of ["1","2","m"]){ const f=$("#if-"+s); if(f&&f.contentWindow===w) return s; }
  return null;
}
/* apresenta a cabine a cada aparelho (quem e ele na mesa) e entrega o pen drive.
   E chamado mais de uma vez de proposito: o iframe pode ainda estar carregando
   quando a mesa monta, e mensagem para janela que nao acordou cai no vazio. */
function pedirFaixas(){
  ["1","2","m"].forEach(s=>{ manda(s,{smu:"cabine", slot:s}); });
  mandarBiblioteca();
}

function faltaPraticando(){
  const it=[];
  if(S.aio){
    it.push([true,"<b>Tudo-em-um</b>: player e mixer no mesmo corpo",
      "Não há canal para escolher nem cabo para ligar — os decks já saem no mixer interno."]);
    it.push([S.playlist.length>0, "Guardar faixas na <b>playlist</b> pelo visor",
      "Aperte <b>USB</b> ou <b>BROWSE</b> no aparelho: a lista abre na tela dele. Guarde várias — é o seu pen drive."]);
    it.push([!!S.carregada.m, "<b>Carregar</b> no deck pelo visor",
      "Na aba PLAYLIST, escolha a faixa e use <b>LOAD 1</b> / <b>LOAD 2</b> (ou o seletor rotativo)."]);
    it.push([(S.nivel[1]||0)>0.004||(S.nivel[2]||0)>0.004 ? true : false,
      "Dar <b>play</b> e subir o fader",
      "Com a faixa carregada, aperte PLAY e suba o fader do canal."]);
    return it;
  }
  const e1=eloDoCanal(1), e2=eloDoCanal(2);
  it.push([true,"Cabine <b>montada</b>: esquerda = <b>CANAL 1</b>, direita = <b>CANAL 2</b>",
    "A posição na mesa é que manda. Não há canal a escolher."]);
  /* o pen drive vem ANTES do som: sem faixa carregada nao ha o que sair */
  it.push([S.playlist.length>0, "Guardar faixas na <b>playlist</b> pelo visor",
    "Aperte <b>USB</b> ou <b>BROWSE</b> no aparelho; na aba <b>USB — BANCO SMU</b> guarde com a estrela ou com <b>TAG TRACK</b>. É o seu pen drive: guarde várias."]);
  it.push([!!(S.carregada[1]&&S.carregada[2]), "<b>Carregar</b> uma faixa em cada deck",
    "Na aba <b>PLAYLIST</b> do visor: toque duas vezes na faixa (tela sensível) ou aperte o <b>seletor rotativo</b>. "+
    "No CD player, quem anda de faixa é o <b>TRACK SEARCH</b>."]);
  it.push([e1.ok,"Fazer o <b>canal 1</b> sair", e1.txt || "está passando."]);
  it.push([e2.ok,"Fazer o <b>canal 2</b> sair", e2.txt || "está passando."]);
  return it;
}
function pintarPainel(){
  const it = eCabeamento ? faltaCabeamento()
           : S.passo===1 ? [[prontoEscolha(),"Escolher o <b>equipamento</b>",
               "Dois decks + um mixer, ou um <b>tudo-em-um</b> sozinho."]]
           : faltaPraticando();
  const L=$("#lista"); L.innerHTML="";
  it.forEach(([ok,t,a])=>{
    const d=document.createElement("div"); d.className="chk"+(ok?" ok":"");
    d.innerHTML='<div class="b">'+(ok?"✓":"!")+'</div><div class="tx">'+t+
      (ok?"":"<br><span style='color:#7f8b9c'>"+a+"</span>")+'</div>';
    L.appendChild(d);
  });
  const pendentes = it.filter(x=>!x[0]).length;
  const bad=$("#selFalta"); if(bad){ bad.textContent=pendentes; bad.classList.toggle("zero",pendentes===0); }

  let som=false, elo="";
  if(eCabeamento){
    som = it.every(x=>x[0]);
    elo = som ? "" : "<div class='elo'>Continua <b>mudo</b>: "+esc(it.find(x=>!x[0])[1].replace(/<[^>]+>/g,""))+".</div>";
  } else if(S.passo>1){
    if(S.aio){ som=(S.nivel[1]||0)>0.004||(S.nivel[2]||0)>0.004; }
    else{
      const e1=eloDoCanal(1), e2=eloDoCanal(2);
      som = e1.ok || e2.ok;
      const cortes=[]; if(!e1.ok) cortes.push("<b>Canal 1</b> — "+e1.txt);
      if(!e2.ok) cortes.push("<b>Canal 2</b> — "+e2.txt);
      elo = cortes.length ? "<div class='elo'>"+cortes.join("<br>")+"</div>" : "";
    }
  }
  /* falha de carga do visor nao pode sumir calada — foi ela que fez o aluno
     achar que "escolher musica nao faz nada" */
  if(S.erroFaixa) elo = "<div class='elo'>Não deu para carregar: "+esc(S.erroFaixa)+"</div>" + elo;
  const sm=$("#som");
  sm.className="som"+(som?" on":"");
  sm.textContent = som ? "SOM NO AR ♪" : (S.passo===1?"cabine ainda não montada":"SEM SOM");
  $("#elo").innerHTML = elo;
  const p=$("#pontoSom"); if(p) p.classList.toggle("ok",som);
  pintarPassos();
}

/* extrai o id de um link do YouTube em qualquer formato, ou aceita o id cru.
   Colar link NAO gasta cota de API — e o caminho recomendado ao aluno. */
function idDoYoutube(t){
  t=(t||"").trim(); if(!t) return null;
  if(/^[\w-]{11}$/.test(t)) return t;
  const m=t.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m?m[1]:null;
}

  P.innerHTML = passosDaAula().map(([n,t])=>{
    const on = +n===S.passo;
    const ok = (n==="1"&&prontoEscolha()) || (n==="2"&&feito2);
    const liberado = n==="1" || prontoEscolha();
    return '<button class="pa '+(on?"on":"")+' '+(ok?"ok":"")+'" data-p="'+n+'" '+(liberado?"":"disabled")+'>'+
      n+" · "+t+'</button>';
  }).join("");
  $$(".pa",P).forEach(b=>b.addEventListener("click",()=>{
    const n=+b.dataset.p; if(n===2&&!prontoEscolha()) return;
    S.passo=n; render();
  }));
}

/* ============================================================================
   11. LIGAR OS EVENTOS DA TELA
   ============================================================================ */
function ligar(){
  $$(".opt[data-campo]").forEach(el=>el.addEventListener("click",()=>{
    const campo=el.dataset.campo;
    if(campo==="aio"){
      S.aio = (S.aio===el.dataset.id) ? null : el.dataset.id;
      if(S.aio){ S.d1=S.d2=S.mix=null; }
    } else { S[campo]=el.dataset.id; S.aio=null; }
    S.ligacoes=[]; S.pegou=null; S.tam={}; S.mixEstado=null;
    if(prontoEscolha()) S.passo=2;
    render();
  }));
  /* --- aula 1 --- */
  $$(".cabo-b").forEach(b=>b.addEventListener("click",()=>{ S.cabo=b.dataset.cabo; S.pegou=null; S.erroCabo=null; render(); }));
  $$(".con.clicavel").forEach(c=>c.addEventListener("click",ev=>{
    ev.stopPropagation(); clicarConector(c.dataset.dono, +c.dataset.i);
  }));
  $$(".tom").forEach(t=>t.addEventListener("click",ev=>{
    ev.stopPropagation();
    if(S.cabo!=="ac"){ S.erroCabo="a régua só recebe <b>cabo AC</b>. Troque o cabo lá em cima."; render(); return; }
    clicarConector("tom", +t.dataset.tom);
  }));
  const ch=$("#chaveac"); if(ch) ch.addEventListener("click",()=>{ S.reguaLigada=!S.reguaLigada; render(); });
  /* --- aula 2 --- */
  $$("[data-ampliar]").forEach(b=>b.addEventListener("click",ev=>{ ev.stopPropagation(); ampliar(b.dataset.ampliar); }));
}

/* ============================================================================
   12. RENDER
   ============================================================================ */
function render(){
  const P=$("#palco");
  const antes = S.passo===2 && !eCabeamento ? assinaturaMesa() : null;
  if(antes && antes===P.dataset.assinatura){
    /* a MESA ja esta montada: nao remontar (isso recarregaria os simuladores
       e mataria o audio do aluno). So repinta o painel. */
    pintarPainel(); pintarComo(); pintarRoteamento(); return;
  }
  P.innerHTML = S.passo===1 ? telaEscolha() : (eCabeamento ? telaTraseira() : telaMesa());
  P.dataset.assinatura = antes || "";
  ligar(); pintarPainel(); pintarComo(); pintarRoteamento();
  if(eCabeamento && S.passo===2){
    requestAnimationFrame(fios);
    if(S.erroCabo){ $("#elo").innerHTML="<div class='elo'>"+S.erroCabo+"</div>"; }
  }
  if(!eCabeamento && S.passo===2){
    S.ampliado=null;
    document.documentElement.classList.remove("ampliado");
    requestAnimationFrame(()=>{ dimensionar(); requestAnimationFrame(dimensionar); });
    /* entrega o pen drive aos visores. Mais de uma vez porque o iframe pode
       ainda nao ter acordado — mensagem para janela sem ouvinte cai no vazio. */
    [150,700,1800].forEach(t=>setTimeout(pedirFaixas,t));
  }
  const bt=$("#btnAmpliar");
  if(bt){ bt.disabled = !(S.passo===2 && !eCabeamento); bt.textContent = S.ampliado?"VOLTAR":"AMPLIAR"; }
}
function assinaturaMesa(){ return "mesa|"+S.aio+"|"+S.d1+"|"+S.d2+"|"+S.mix; }
function pintarComo(){ $("#como").innerHTML = textoComo(); if(S.popAberto==="mus") pintarMusicas(); }

/* ⛔ NAO usar location.reload() aqui. Solta, a aula tem URL propria e recarrega
   numa boa — foi assim que passou despercebido. Mas no player ela entra por
   srcdoc com sandbox="allow-scripts", ou seja ORIGEM OPACA e sem
   allow-same-origin: nessa condicao o navegador PROIBE reload e lanca
   SecurityError. O defeito so existia no ambiente que o aluno usa.
   Recomecar agora refaz o estado por codigo. */
function recomecar(){
  /* derruba o audio dos simuladores antes de tirar os iframes do ar, senao o
     contexto sobrevive tocando (preview_stop nao cala som; aba/iframe fora do
     DOM tambem nao garante) */
  document.querySelectorAll("iframe").forEach(f=>{
    try{ f.contentWindow.postMessage({smu:"parar"},"*"); }catch(_){}
  });
  S.passo=1; S.d1=null; S.d2=null; S.mix=null; S.aio=null;
  S.cabo="ac"; S.pegou=null; S.ligacoes=[]; S.reguaLigada=false;
  S.ampliado=null; S.mixEstado=null; S.ganho={1:null,2:null};
  S.erroCabo=null;
  const P=$("#palco"); if(P) P.dataset.assinatura="";   /* forca remontar */
  /* fecha o popover aberto: abrirPop(null) nao serve porque ele ALTERNA —
     chamar com o nome aberto fecharia, com outro abriria. Zera direto. */
  S.popAberto=null;
  ["falta","como","mus"].forEach(n=>{
    const q=$("#pop-"+n); if(q) q.classList.remove("on");
    const b=document.querySelector('.btn[data-pop="'+n+'"]'); if(b) b.classList.remove("on");
  });
  aplicarPreset();          /* aula travada volta direto para a mesa dela */
  render();
}
$("#btnReset").addEventListener("click",recomecar);
$("#btnAmpliar").addEventListener("click",()=>{
  if(eCabeamento||S.passo!==2) return;
  ampliar(S.ampliado || "m");        /* o mixer e o que mais pede tela */
});

/* titulo e subtitulo conforme o MODO */
(function(){
  const t = eCabeamento
    ? ["Ligando a cabine","PRO • LIGANDO A CABINE"]
    : ["Praticando: monte a sua cabine","PRO • PRATICANDO A CABINE"];
  document.title = t[0]+" (SMU)";
  const b=$("#sub"); if(b) b.textContent=t[1];
})();

/* ----------------------------------------------------------------------------
   REDIMENSIONAR — nao dava para depender so do evento `resize` da janela.
   MEDIDO: pondo a janela em 768x1024 (iPad em pe), a escala ficou congelada em
   0,5802 no arranjo "linha" e 130 px dos aparelhos das pontas sairam da tela.
   Chamando dimensionar() na mao no mesmo instante, o arranjo virou "coluna
   rola", escala 1, os tres INTEIROS dentro da janela e sem rolagem lateral —
   ou seja, a CONTA sempre esteve certa; quem faltou foi o GATILHO.
   Tres motivos reais para o `resize` nao servir sozinho:
     1. a aula roda dentro do iframe do player do curso — quando o player muda
        o tamanho do iframe, a janela de dentro nem sempre recebe `resize`;
     2. no iOS, girando o aparelho, o `resize` chega ANTES de innerWidth/
        innerHeight assumirem o valor novo — medir nessa hora da o valor velho;
     3. a barra de endereco do Safari entra e sai sem disparar nada confiavel.
   Entao o gatilho passa a ser o ResizeObserver do proprio elemento (que mede o
   que ELE tem, nao o que a janela diz) mais uma segunda passada atrasada.
   ---------------------------------------------------------------------------- */
/* Uma passada nao converge, e nao e teimosia: quando o arranjo sai de "rola"
   some a BARRA DE ROLAGEM, e o palco fica ~15 px mais largo do que estava na
   hora da conta. Medido: 1a passada k=0,571512 (palco 1009) · 2a k=0,580233
   (palco 1024). Por isso mede-se de novo no quadro seguinte — mesmo truque que
   o ampliar() ja usava. */
function passada(){ if(eCabeamento) fios(); else { dimensionar(); requestAnimationFrame(dimensionar); } }
let redim=null;
function reposicionar(){
  clearTimeout(redim);
  redim=setTimeout(passada,80);
  setTimeout(passada,420);   /* no iOS a 1a ainda pega innerWidth/Height velhos */
}
addEventListener("resize", reposicionar);
addEventListener("orientationchange", reposicionar);
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>reposicionar());
  const observar=()=>{ const p=$("#palco"); if(p) ro.observe(p); ro.observe(document.body); };
  if(document.readyState==="loading") addEventListener("DOMContentLoaded",observar); else observar();
}

aplicarPreset();   /* aula travada num aparelho: entra direto na mesa */
render();
/* o mixer manda o estado sozinho, mas na 1a vez pedimos — assim o painel
   ja nasce dizendo qual elo esta cortando, sem esperar o aluno mexer. */
setTimeout(()=>{ if(!eCabeamento&&S.passo===2){ manda("m",{smu:"estado?"}); pedirFaixas(); } },900);
</script>
