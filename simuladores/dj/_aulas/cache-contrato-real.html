<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Fechar um evento: cachê, contrato e MEI (SMU)</title>
<style>
  :root{ --ink:#e9eef7; --amber:#ffae1a; --green:#39d271; --blue:#37a2ff; --red:#ff4636;
         --roxo:#8b5cf6; --line:#2a2f37; --painel:#0c0e12; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{ background:radial-gradient(1100px 640px at 50% -10%,#26292e,#0a0b0d 62%),#08090b; color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    user-select:none;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
  #stage{transform-origin:top center;flex:0 0 auto}
  .wrap{width:1080px;display:flex;flex-direction:column;gap:9px;padding:10px}
  /* contrato html.smu-fs: em tela cheia o player avisa e o sim pode crescer */
  html.smu-fs .wrap{padding:4px}

  .util{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:linear-gradient(180deg,#202329,#15171b);
    border:1px solid #0c0d0f;border-radius:11px;padding:8px 12px}
  .brand b{font-size:15px;letter-spacing:1px}
  .brand .m{font-size:9px;letter-spacing:2px;color:#8a94a4;text-transform:uppercase;margin-left:6px}
  .pill{font-size:10px;color:#8b97a9;background:var(--painel);border:1px solid var(--line);border-radius:16px;padding:4px 10px}
  .pill b{color:#fff}
  .pill.g b{color:var(--green)} .pill.r b{color:var(--red)}
  .spacer{flex:1}
  .btnp{font:inherit;font-size:11px;font-weight:700;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;
    color:#07120b;background:linear-gradient(180deg,#5be59a,#27b566)}
  .btnp.ghost{background:transparent;color:#8b97a9;border:1px solid var(--line)}
  .btnp.warn{color:#2a0d06;background:linear-gradient(180deg,#ffc46a,#e08a1e)}
  .btnp:disabled{opacity:.4;cursor:not-allowed}

  /* passos */
  .passos{display:flex;gap:6px}
  .pa{flex:1;padding:7px 9px;border-radius:8px;background:#11151a;border:1px solid #1c2229;cursor:pointer}
  .pa.on{background:#151d2a;border-color:var(--blue)}
  .pa.ok{background:#0f2418;border-color:#1e5c38}
  .pa .n{font-size:9px;font-weight:900;color:#6b7684}
  .pa.on .n{color:var(--blue)} .pa.ok .n{color:var(--green)}
  .pa .t{font-size:10.5px;font-weight:800;margin-top:2px}
  .pa .s{font-size:9px;color:#8b97a9;margin-top:1px}

  .grid{display:grid;grid-template-columns:1fr 300px;gap:9px}
  .card{background:var(--painel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:452px}
  .card h3{margin:0 0 8px;font-size:10px;letter-spacing:1.4px;color:#8b97a9;text-transform:uppercase;font-weight:800}

  /* conversa */
  .conv{background:#0f1218;border:1px solid #1c2229;border-radius:8px;padding:9px;max-height:170px;overflow:hidden}
  .msg{max-width:78%;padding:6px 9px;border-radius:9px;font-size:10.5px;line-height:1.35;margin-bottom:6px}
  .msg.eles{background:#1a2028;border:1px solid #232b35;color:#cfd8e3}
  .msg.voce{background:#123726;border:1px solid #1e5c38;color:#a8ecc4;margin-left:auto}
  .msg .who{display:block;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#7f8b9c;margin-bottom:2px}

  .perg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:9px}
  .pq{padding:6px 8px;border-radius:7px;background:#11151a;border:1px solid #1c2229;cursor:pointer;font-size:9.8px;line-height:1.3}
  .pq:hover{background:#151b23}
  .pq.ok{background:#0f2418;border-color:#1e5c38;cursor:default}
  .pq b{color:#cdd5e0} .pq.ok b{color:#9fe3bb}
  .pq .r{display:block;color:#8b97a9;margin-top:3px;font-size:9.2px}

  /* ficha */
  .ficha{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}
  .fi{background:#0f1218;border:1px solid #1c2229;border-radius:7px;padding:6px 7px;font-size:9.2px;line-height:1.3}
  .fi .k{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#6b7684;font-weight:800}
  .fi .v{color:#cdd5e0;margin-top:2px;font-weight:700}
  .fi.vazio .v{color:#4d5663}

  /* tabela / itens */
  .tabs{display:flex;gap:5px;margin:8px 0}
  .tb{flex:1;padding:6px 7px;border-radius:7px;border:1px solid #23282f;background:#12161c;cursor:pointer;font-size:9.4px;line-height:1.3}
  .tb b{display:block;font-size:10.5px;color:#cdd5e0}
  .tb i{font-style:normal;color:var(--amber);font-weight:800}
  .tb.on{background:#151d2a;border-color:var(--blue)}
  .tb.on b{color:#fff}

  .it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:#11151a;
    border:1px solid #1c2229;margin-bottom:4px;cursor:pointer}
  .it:hover{background:#151b23}
  .it .sw{width:30px;height:16px;border-radius:9px;background:#242a33;border:1px solid #05070a;flex:0 0 auto;position:relative}
  .it .sw i{position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:#6b7684;transition:all .12s}
  .it.on .sw{background:#1e5c38} .it.on .sw i{left:15px;background:#7df0a8}
  .it .nm{flex:1;font-size:10px;font-weight:700;color:#c2cbd6}
  .it .ds{font-size:8.8px;color:#7f8b9c;font-weight:500;display:block;margin-top:1px}
  .it .vl{font-size:10.5px;font-weight:900;color:#8b97a9;width:82px;text-align:right}
  .it.on .vl{color:var(--green)}
  .it.erro{border-color:#6b2018;background:#1c0f0d}
  .it.erro .vl{color:var(--red)}

  .conta{background:#080b10;border:1px solid #1c2229;border-radius:7px;padding:8px;font-family:Consolas,monospace;
    font-size:10px;line-height:1.6;color:#9fb4c9;white-space:pre}
  .conta b{color:#fff}

  /* clausulas */
  .cls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cl{background:#11151a;border:1px solid #1c2229;border-radius:8px;padding:7px 8px}
  .cl.in{background:#0f2418;border-color:#1e5c38}
  .cl.out{background:#1c0f0d;border-color:#6b2018}
  .cltop{display:flex;align-items:center;gap:5px}
  .cltop b{flex:1;font-size:10px;color:#e2e8f0}
  .clb{font-size:8.5px;font-weight:900;letter-spacing:.3px;padding:3px 7px;border-radius:5px;cursor:pointer;
    border:1px solid #2a3038;color:#8b97a9;background:#0d1116;white-space:nowrap}
  .clb.on{background:#1e5c38;border-color:#2f8f57;color:#d6ffe6}
  .clb.x.on{background:#6b2018;border-color:#a03426;color:#ffd9d3}
  .cltx{font-size:9.2px;line-height:1.4;color:#9fe3bb;margin-top:5px;border-left:2px solid #2f8f57;padding-left:6px}
  .clfail{font-size:9.2px;line-height:1.42;color:#ffbdb4;margin-top:5px;border-left:2px solid #a03426;padding-left:6px}
  .clfail b{color:#ff8f80}
  .clhint{font-size:9px;line-height:1.35;color:#6f7a89;margin-top:4px}

  /* mei */
  .cams{display:flex;gap:6px;margin-bottom:8px}
  .cam{flex:1;padding:7px 8px;border-radius:8px;background:#11151a;border:1px solid #1c2229;cursor:pointer;font-size:9.4px;line-height:1.35}
  .cam b{display:block;font-size:10px;color:#cdd5e0;margin-bottom:3px}
  .cam.on{background:#151d2a;border-color:var(--blue)}
  .cam.mau{background:#1c0f0d;border-color:#6b2018;color:#ffbdb4}
  .cam.bom{background:#0f2418;border-color:#1e5c38;color:#9fe3bb}

  .meigrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
  .box{background:#0f1218;border:1px solid #1c2229;border-radius:8px;padding:8px}
  .box h4{margin:0 0 6px;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:#8b97a9;font-weight:800}
  .box .li{font-size:9.4px;line-height:1.45;color:#c2cbd6;margin-bottom:4px}
  .box .li b{color:#fff}
  .teto{height:16px;border-radius:5px;background:#161b22;overflow:hidden;position:relative;margin:7px 0 5px;border:1px solid #05070a}
  .teto i{display:block;height:100%;width:0;background:linear-gradient(90deg,#27b566,#5be59a);transition:width .2s}
  .teto.estourou i{background:linear-gradient(90deg,#a03426,#ff6a58)}
  .teto span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#0a0d10;text-shadow:0 1px 0 rgba(255,255,255,.25)}
  input[type=range]{width:100%;accent-color:#37a2ff}

  .conseq{margin-top:9px;background:#1c0f0d;border:1px solid #6b2018;border-radius:8px;padding:8px 9px;
    font-size:9.8px;line-height:1.45;color:#ffbdb4}
  .conseq b{color:#ff8f80}

  .aviso{font-size:9.8px;line-height:1.45;color:#8b97a9;margin-top:9px;border-top:1px dashed #232a32;padding-top:8px}
  .aviso b{color:#cdd5e0}
  .chk{display:flex;gap:7px;align-items:flex-start;padding:6px 7px;border-radius:7px;margin-bottom:5px;
    background:#11151a;border:1px solid #1c2229}
  .chk.ok{background:#0f2418;border-color:#1e5c38}
  .chk .b{width:14px;height:14px;border-radius:50%;flex:0 0 auto;margin-top:1px;background:#2a3038;border:1px solid #000;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#6b7684}
  .chk.ok .b{background:var(--green);color:#062a13}
  .chk .tx{font-size:10px;line-height:1.3;color:#c2cbd6}
  .chk.ok .tx{color:#9fe3bb}
</style>
</head>
<body>
<div id="stage">
<div class="wrap">

  <div class="util">
    <div class="brand"><b>SMU</b><span class="m">PRO • FECHAR UM EVENTO: CACHÊ, CONTRATO E MEI</span></div>
    <span class="pill">Passo <b id="pnum">1 de 5</b></span>
    <span class="pill g">Cachê <b id="pcache">—</b></span>
    <span class="pill" id="psobra">Sobra <b>—</b></span>
    <span class="spacer"></span>
    <button class="btnp ghost" id="btnReset">Recomeçar</button>
  </div>

  <div class="passos">
    <div class="pa on" data-p="1"><div class="n">PASSO 1</div><div class="t">A proposta</div><div class="s">levantar os dados</div></div>
    <div class="pa" data-p="2"><div class="n">PASSO 2</div><div class="t">O cachê</div><div class="s">montar o preço</div></div>
    <div class="pa" data-p="3"><div class="n">PASSO 3</div><div class="t">O contrato</div><div class="s">cláusula por cláusula</div></div>
    <div class="pa" data-p="4"><div class="n">PASSO 4</div><div class="t">Nota fiscal</div><div class="s">MEI e CNPJ</div></div>
    <div class="pa" data-p="5"><div class="n">PASSO 5</div><div class="t">Fechado</div><div class="s">o dinheiro na conta</div></div>
  </div>

  <div class="grid">
    <div class="card" id="palco"></div>
    <div class="card">
      <h3>O que falta</h3>
      <div id="lista"></div>
      <div class="aviso" id="aviso"></div>
    </div>
  </div>
</div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const R$=v=>"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const R0=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");

/* ==========================================================
   PASSO 1 — a proposta que chega no WhatsApp
   ========================================================== */
const PERGUNTAS=[
 {id:"hora",  q:"Que horas começa e que horas termina?",
  a:"Das 21h às 3h. A cerimônia é na igreja às 18h, com outro fornecedor de som.",
  k:"Horário", v:"21h às 3h — 6 h de set"},
 {id:"local", q:"Onde é? Quantos quilômetros da minha cidade?",
  a:"Sítio Recanto do Vale — 180 km daqui, tudo asfalto.",
  k:"Local", v:"180 km — 360 km ida e volta"},
 {id:"som",   q:"O som e a luz são meus ou já tem estrutura no local?",
  a:"O sítio não tem som nem luz. Energia tem: quadro trifásico, 2 circuitos de 32 A, aterrado.",
  k:"Estrutura", v:"Som e luz por sua conta · energia OK"},
 {id:"data",  q:"Que dia da semana cai essa data?",
  a:"Domingo — véspera do feriado de 7 de setembro. Ninguém trabalha na segunda.",
  k:"Data", v:"Domingo, véspera de feriado"},
 {id:"tipo",  q:"Que tipo de festa é e quantas pessoas?",
  a:"Casamento, 150 convidados. Tem entrada dos noivos, valsa e hora do bolo, com cronograma do cerimonial.",
  k:"Evento", v:"Casamento · 150 pessoas · cerimonial"},
 {id:"quem",  q:"Quem assina o contrato e quem paga?",
  a:"Quem assina é o pai da noiva, pessoa física. O buffet só cuida da comida.",
  k:"Contratante", v:"Pessoa física (pai da noiva)"},
];

/* ==========================================================
   PASSO 2 — a calculadora do cachê
   ========================================================== */
const TABELAS={
  aniversario:{nome:"Aniversário", h:250,
    d:"Set solto, sem cronograma. Você chega, toca e vai embora."},
  casamento:{nome:"Casamento", h:300,
    d:"Cronograma do cerimonial, prova de som, entrada dos noivos e microfone para discurso."},
  clube:{nome:"Clube / balada", h:200,
    d:"A casa fornece som, luz e técnico. Set fixo de 2 h, cachê menor e agenda recorrente."},
};
const HSET=6, HPORTA=17;   /* 17 h de porta a porta: 3 h de ida, montagem, prova, 6 h de set, desmontagem, 3 h de volta */

const ITENS=[
 {id:"montagem", nm:"Montagem, prova de som e desmontagem", ds:"você entra no sítio às 17h e sai às 4h", v:500,  regra:"sim",
  falta:"Você vai passar 5 horas trabalhando fora do set — carregando, montando, passando som e desmontando. Não cobrar isso é dar 5 horas de graça."},
 {id:"madruga",  nm:"Adicional de madrugada", ds:"2 h de set depois da 1h da manhã", v:300, regra:"sim",
  falta:"A festa vai até as 3h. Hora de madrugada não é igual a hora de sábado à tarde: é o resto do domingo perdido e a segunda-feira comprometida."},
 {id:"desloc",   nm:"Deslocamento — 360 km × R$ 2,00/km", ds:"combustível, pedágio e desgaste do carro", v:720, regra:"sim",
  falta:"São 360 km com o equipamento no carro. Só de gasolina e pedágio já saem uns R$ 310 do seu bolso — e o carro é seu."},
 {id:"hotel",    nm:"Hospedagem — 1 diária", ds:"você termina às 3h a 180 km de casa", v:280, regra:"sim",
  falta:"Ou você paga o hotel, ou dirige 180 km às 5h da manhã depois de 12 horas em pé. As duas contas são suas — só uma delas não te mata."},
 {id:"equip",    nm:"Locação do seu som + luz (150 pessoas)", ds:"o sítio não tem nada; a estrutura é sua", v:1400, regra:"sim",
  falta:"Você vai levar o SEU equipamento e não está cobrando por ele. Isso é emprestar R$ 40 mil em caixas e luz de graça — com o desgaste por sua conta."},
 {id:"ajudante", nm:"Ajudante de carga e montagem", ds:"2 racks, 4 caixas e a treliça não sobem sozinhos", v:300, regra:"sim",
  falta:"Sem ajudante você carrega tudo sozinho e chega no set esgotado. Com ajudante e sem cobrar, você paga R$ 300 para trabalhar."},
 {id:"feriado",  nm:"Véspera de feriado (+15%)", ds:"domingo que ninguém quer trabalhar e todo mundo quer festa", v:0, regra:"opcional",
  falta:""},
 {id:"cerimonia",nm:"Som da cerimônia — 2 caixas + microfone", ds:"", v:450, regra:"nao",
  erro:"O briefing diz que a cerimônia é na igreja, com OUTRO fornecedor. Cobrar por isso infla a sua proposta em R$ 450 por um serviço que você não vai prestar — e é exatamente esse tipo de item que faz o contratante escolher o concorrente."},
 {id:"gerador",  nm:"Gerador 15 kVA", ds:"", v:900, regra:"nao",
  erro:"O sítio tem quadro trifásico com 2 circuitos de 32 A e aterramento — você perguntou isso no passo 1. Cobrar gerador aqui é R$ 900 de gordura numa proposta que vai ser comparada com outras três."},
];

const CUSTOS=[
 ["Combustível 360 km",       248.00, "9 km/l, gasolina a R$ 6,20"],
 ["Pedágio (ida e volta)",     62.00, ""],
 ["Ajudante de carga",        300.00, "sai do seu bolso, cobrando ou não"],
 ["Hospedagem",               280.00, "você vai dormir lá de qualquer jeito"],
 ["Manutenção do equipamento",200.00, "reserva por evento: cone, cabo, lâmpada"],
 ["DAS do MEI (mês)",          86.05, "fixo, vence dia 20"],
];
const CUSTO = CUSTOS.reduce((s,c)=>s+c[1],0);   /* R$ 1.176,05 */

/* linha de extrato monoespaçada: rótulo à esquerda, valor à direita */
const LN=(a,b,w=42,cor="")=>a+" ".repeat(Math.max(1,w-a.length-b.length))
  +`<b${cor?` style="color:${cor}"`:""}>${b}</b>`;
const HR=(w=42)=>"─".repeat(w);

/* ==========================================================
   PASSO 3 — as cláusulas
   ========================================================== */
const CLAUSULAS=[
 {id:"horario", t:"Horário de início e de fim",
  hint:"Montagem, início do set e hora de desligar — os três, com hora escrita.",
  texto:"Acesso ao local a partir das 17h para montagem e prova de som. Execução musical das 21h às 3h. Desmontagem imediatamente após.",
  fail:"Você chegou às 17h e o salão ainda estava sendo montado: a tomada só ficou livre às 20h30. Começou atrasado e a culpa virou sua. Às 3h, quando desligou, o pai da noiva perguntou por que parou <b>tão cedo</b> — ninguém tinha combinado hora de fim."},
 {id:"extra", t:"O que acontece se passar do horário",
  hint:"Preço da hora extra, combinado antes — e quem tem poder de autorizar.",
  texto:"Hora adicional: R$ 350 por hora cheia, autorizada por escrito (mensagem serve) por quem assina este contrato, e paga em até 48 h.",
  fail:"3h05, pista cheia, o noivo pede <b>mais uma horinha</b>. Sem cláusula você vai negociar preço no meio da festa, com o cara alegre e a sogra ouvindo. Deu no que sempre dá: você tocou 2 horas de graça — ou disse não e saiu como o chato que acabou o casamento."},
 {id:"quemsom", t:"Quem fornece o som (e a energia)",
  hint:"O que é seu, o que é da casa — e quem responde se faltar.",
  texto:"O CONTRATADO fornece PA, luz e cabine. O CONTRATANTE garante ponto de energia trifásico, 2 circuitos de 32 A, aterrado, disponível às 17h.",
  fail:"O sítio te ofereceu uma extensão de 20 m saindo da cozinha. Metade das caixas ficou muda, o disjuntor caiu 3 vezes durante a festa e o vídeo do fotógrafo registrou os 40 segundos de silêncio bem na entrada dos noivos."},
 {id:"sinal", t:"Sinal de entrada",
  hint:"Sem sinal pago, a data não está reservada — está emprestada.",
  texto:"40% na assinatura, a título de sinal, para reserva da data. Saldo de 60% até 3 dias antes do evento.",
  fail:"Você segurou a data por 4 meses e recusou dois aniversários por causa dela. Faltando 3 semanas, apareceu um DJ R$ 800 mais barato e veio o <b>infelizmente vamos ter que cancelar</b>. Você ficou sem a festa, sem os aniversários e sem um centavo."},
 {id:"cancel", t:"Cancelamento pelo contratante",
  hint:"Escalonado por prazo: quanto mais perto, mais alto.",
  texto:"Cancelamento com mais de 30 dias: retém-se o sinal. Entre 30 e 7 dias: 50% do valor total. Com menos de 7 dias: 100%.",
  fail:"Cancelaram 5 dias antes porque choveu na semana e a festa virou almoço. Você já tinha recusado outra data, garantido o ajudante e reservado o hotel. Sem cláusula, a conversa passa a ser sobre quanto é <b>justo</b> — e justo, para quem cancelou, é zero."},
 {id:"comida", t:"Alimentação do DJ e da equipe",
  hint:"Não é frescura: é 11 horas no sítio, sem nada aberto por perto.",
  texto:"O CONTRATANTE fornece 2 refeições completas e água, servidas no mesmo horário do buffet, para o DJ e 1 assistente.",
  fail:"11 horas no sítio, 180 km de casa, nada aberto num raio de 20 km. Você comeu às 16h. À 1h da manhã, com a pista cheia, o seu ajudante estava sentado atrás do rack com dor de cabeça. É exatamente a hora em que o DJ começa a errar a mixagem."},
 {id:"hotel", t:"Hospedagem (porque é fora)",
  hint:"Entra porque esta festa é a 180 km. Em festa na sua cidade, não entra.",
  texto:"Por ser evento fora do município, o CONTRATANTE arca com 1 diária de hospedagem para 2 pessoas, com saída no dia seguinte.",
  fail:"3h30, você desmontou, carregou o carro sozinho e pegou 180 km de estrada às 5h da manhã depois de 12 horas em pé. É esse trajeto — não o show — que aparece na notícia de segunda-feira."},
 {id:"pgto", t:"Forma de pagamento",
  hint:"Meio, prazo, conta e nota fiscal. Escritos.",
  texto:"Pagamento por PIX/transferência na conta PJ do CONTRATADO. Sinal na assinatura, saldo até 3 dias antes. Nota fiscal emitida em até 48 h após o evento.",
  fail:"O contratante decidiu pagar em 3 vezes no cartão, a última em 60 dias. Você já tinha pago o hotel, o ajudante e a gasolina do próprio bolso. O dinheiro da festa entrou 2 meses depois — na prática, você financiou o casamento dos outros."},
];

/* ==========================================================
   PASSO 4 — nota fiscal e MEI
   ========================================================== */
const CAMINHOS=[
 {id:"cpf", nm:"Mandar o CPF e pedir PIX",
  txt:"O financeiro não pode pagar fornecedor sem nota: a despesa não entra na contabilidade da empresa. Sua proposta é arquivada e a festa vai para o DJ que emite. Você não perdeu por preço nem por talento — perdeu por não existir no papel."},
 {id:"amigo", nm:"Pedir para um amigo com CNPJ emitir",
  txt:"A nota sai no CNPJ dele, o dinheiro cai na conta dele e você fica dependendo do humor de terceiro para receber. O faturamento também é dele: não conta como seu histórico, nem para crédito, nem para INSS. E se a atividade não bater com o CNAE dele, a nota é irregular — o problema é dos dois."},
 {id:"mei", nm:"Abrir MEI e emitir a sua nota",
  txt:"CNPJ na hora, no Portal do Empreendedor, com a conta gov.br. Nota fiscal de serviço no mesmo dia, conta PJ, INSS contando e a porta do mercado corporativo aberta."},
];
const FATURADO_ANO = 34200;   /* 8 festas já feitas no ano, nesta simulação */
const CORPORATIVA  = 9000;    /* a festa de fim de ano da empresa */

/* ==========================================================
   estado
   ========================================================== */
const S={ passo:1, perg:{}, tabela:null, itens:{}, cl:{}, caminho:null, mei:false,
          festas:2, conseq:"" };

/* ---------- contas ---------- */
function subtotal(){
  if(!S.tabela) return 0;
  let t = TABELAS[S.tabela].h * HSET;
  ITENS.forEach(i=>{ if(i.id!=="feriado" && S.itens[i.id]) t+=i.v; });
  return t;
}
function adicionalFeriado(){ return S.itens.feriado ? Math.round(subtotal()*0.15) : 0; }
function cache(){ return subtotal()+adicionalFeriado(); }
function sobra(){ return cache()-CUSTO; }

function tabelaOk(){ return S.tabela==="casamento"; }
function itensOk(){
  return ITENS.filter(i=>i.regra==="sim").every(i=>!!S.itens[i.id])
      && ITENS.filter(i=>i.regra==="nao").every(i=>!S.itens[i.id]);
}
function perguntasOk(){ return PERGUNTAS.every(p=>!!S.perg[p.id]); }
function clausulasOk(){ return CLAUSULAS.every(c=>S.cl[c.id]==="in"); }

/* ---------- a trava: só avança quem fez o anterior ---------- */
function podeIr(n){
  if(n<=1) return true;
  if(n===2) return perguntasOk();
  if(n===3) return perguntasOk() && tabelaOk() && itensOk();
  if(n===4) return podeIr(3) && clausulasOk();
  if(n===5) return podeIr(4) && S.mei;
  return false;
}

/* ==========================================================
   render
   ========================================================== */
function render(){
  $("#pnum").textContent=S.passo+" de 5";
  $("#pcache").textContent = S.tabela ? R0(cache()) : "—";
  const ps=$("#psobra");
  ps.className = "pill"+(S.tabela ? (sobra()>0?" g":" r") : "");
  ps.innerHTML = "Sobra <b>"+(S.tabela? R0(sobra()) : "—")+"</b>";

  $$(".pa").forEach(p=>{ const n=+p.dataset.p;
    p.classList.toggle("on",n===S.passo);
    p.classList.toggle("ok", podeIr(n+1) || (n===5&&S.passo===5&&podeIr(5)));
    p.onclick=()=>{ if(podeIr(n)){ S.passo=n; S.conseq=""; render(); } };
  });

  const P=$("#palco");
  if(S.passo===1) P.innerHTML=telaProposta();
  else if(S.passo===2) P.innerHTML=telaCache();
  else if(S.passo===3) P.innerHTML=telaContrato();
  else if(S.passo===4) P.innerHTML=telaMEI();
  else P.innerHTML=telaFechado();
  if(S.conseq) P.insertAdjacentHTML("beforeend",`<div class="conseq">${S.conseq}</div>`);
  ligar();
  checklist();
}

/* ---------- passo 1 ---------- */

        HR(),
        LN("O QUE VOCÊ COBRA", R0(tot), 42, "#7df0a8"),

      um item. Só muda quem paga.<br><br>

/* ==========================================================
   eventos
   ========================================================== */
function ligar(){
  $$(".pq[data-q]").forEach(el=>el.onclick=()=>{ S.perg[el.dataset.q]=true; S.conseq=""; render(); });

  const bp=$("#btPrecoJa");
  if(bp) bp.onclick=()=>{
    S.conseq=`<b>Você mandou R$ 2.500 sem saber onde é a festa.</b> Ela é a 180 km, vai até as 3h da
      manhã e o som é seu. Só combustível, pedágio, ajudante, hotel e manutenção comem ${R$(CUSTO)}.
      Sobram uns R$ 1.300 por 17 horas de porta a porta — e você ainda emprestou R$ 40 mil em equipamento
      de graça. Pior: o número já saiu. Subir agora vira “ele tentou me enrolar”.`;
    render();
  };

  $$(".tb[data-tab]").forEach(el=>el.onclick=()=>{
    S.tabela=el.dataset.tab;
    S.conseq = tabelaOk() ? "" :
      S.tabela==="clube"
      ? `<b>Tabela de clube num casamento.</b> No clube a casa fornece som, luz e técnico, o set é de 2 h e
         você chega meia hora antes. Aqui você monta às 17h, faz prova de som com o cerimonial, toca a entrada
         dos noivos, segura 6 h de pista e responde se o microfone falhar no discurso do pai. Não é a mesma hora
         de trabalho — e não é o mesmo preço.`
      : `<b>Tabela de aniversário num casamento.</b> Aniversário é set solto: você toca e vai embora.
         Casamento tem cronograma do cerimonial, prova de som, entrada dos noivos, valsa, hora do bolo e
         microfone para discurso — com uma pessoa chorando se der errado. Cobrar preço de aniversário é
         assumir a responsabilidade do casamento pelo trabalho do aniversário.`;
    render();
  });

  $$(".it[data-it]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.it, it=ITENS.find(x=>x.id===id);
    S.itens[id]=!S.itens[id];
    S.conseq = (S.itens[id] && it.regra==="nao") ? `<b>${it.nm}:</b> ${it.erro}` : "";
    render();
  });

  $$(".clb[data-cl]").forEach(el=>el.onclick=()=>{
    S.cl[el.dataset.cl]=el.dataset.v; S.conseq=""; render();
  });

  $$(".cam[data-cam]").forEach(el=>el.onclick=()=>{
    S.caminho=el.dataset.cam;
    S.mei = (S.caminho==="mei");
    S.conseq="";
    render();
  });

  const rg=$("#rgFestas");
  if(rg) rg.oninput=()=>{ S.festas=+rg.value; render(); };
}

/* ==========================================================
   painel "O que falta"
   ========================================================== */
function checklist(){
  const semObrig = ITENS.filter(i=>i.regra==="sim" && !S.itens[i.id]);
  const comErro  = ITENS.filter(i=>i.regra==="nao" && S.itens[i.id]);
  const fora     = CLAUSULAS.filter(c=>S.cl[c.id]==="out");
  const indecisa = CLAUSULAS.filter(c=>!S.cl[c.id]);

  const it=[
    [perguntasOk(), "Levantar os 6 dados antes de dar preço",
      "Preço dito é preço fechado. Falta perguntar: "+PERGUNTAS.filter(p=>!S.perg[p.id]).map(p=>p.k.toLowerCase()).join(", ")+"."],
    [tabelaOk(), "Aplicar a tabela do tipo certo de evento",
      S.tabela? "A tabela escolhida é de "+TABELAS[S.tabela].nome.toLowerCase()+" — e o briefing diz casamento."
              : "Casamento, aniversário e clube dão trabalhos diferentes e preços diferentes."],
    [semObrig.length===0, "Cobrar tudo o que a noite exige",
      semObrig.length? "Item que você não cobra, você paga: "+semObrig[0].falta : ""],
    [comErro.length===0, "Não cobrar o que não é seu",
      comErro.length? comErro.map(i=>i.nm.split("—")[0].trim()).join(" e ")+" não entram nesta festa — o briefing já respondeu isso." : ""],
    [clausulasOk(), "Fechar as 8 cláusulas do contrato",
      indecisa.length? indecisa.length+" ainda sem decisão. É onde as brigas nascem."
        : fora.length? fora.map(c=>c.t.toLowerCase()).join("; ")+" — sem isso escrito, a discussão é a sua palavra contra a dele."
        : ""],
    [S.mei, "Ter CNPJ para emitir nota fiscal",
      "Sem nota, o financeiro da empresa não paga — e a festa vai para quem emite."],
  ];

  const L=$("#lista"); L.innerHTML="";
  it.forEach(([ok,t,a])=>{
    const d=document.createElement("div"); d.className="chk"+(ok?" ok":"");
    d.innerHTML=`<div class="b">${ok?"✓":"!"}</div><div class="tx"><b>${t}</b>${(!ok&&a)?"<br><span style='color:#7f8b9c'>"+a+"</span>":""}</div>`;
    L.appendChild(d);
  });

  const tudo=it.every(([o])=>o);
  $("#aviso").innerHTML = tudo
    ? `<b style="color:#7df0a8">Evento fechado do jeito profissional.</b> A rotina é sempre esta:
       perguntar antes de cotar, montar o preço item por item, mandar a proposta com o contrato de uma página
       anexo, receber o sinal — e só então a data sai do caderno de “talvez”. O MEI é o que permite tudo isso
       existir no papel: ${R$(86.05)} por mês para poder cobrar de qualquer contratante do país.`
    : `<b>Como se fecha um evento:</b> pergunta, calcula, escreve e assina — nessa ordem.
       Quem inverte a ordem descobre o preço certo depois da festa, e aí já não dá para cobrar.`;
}

/* ==========================================================
   boot
   ========================================================== */
$("#btnReset").addEventListener("pointerdown",()=>location.reload());
window.addEventListener("message",e=>{ if(e.data&&e.data.type==="smu-fullscreen")
  document.documentElement.classList.toggle("smu-fs",!!e.data.on); });
render();
const fit=()=>{ const w=$(".wrap");
  const cap=document.documentElement.classList.contains("smu-fs")?2.6:1;   // contrato html.smu-fs
  const s=Math.max(0.1,Math.min((window.innerWidth-6)/w.offsetWidth,(window.innerHeight-6)/w.offsetHeight,cap));
  $("#stage").style.transform="scale("+s+")"; };
window.addEventListener("resize",fit); fit();
</script>
</body>
