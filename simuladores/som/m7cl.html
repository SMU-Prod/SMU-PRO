<!doctype html>
<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Yamaha M7CL-48 — console real (Simulador SMU)</title>
<style>
/* ==================================================================
   YAMAHA M7CL-48 — RÉPLICA DA CONSOLE FÍSICA
   ------------------------------------------------------------------
   Este NÃO é o M7CL Editor (o software de PC). É a MESA: superfície,
   faders, os 33 knobs do SELECTED CHANNEL e a touch screen central.

   FONTE DE VERDADE (Regra 2) — tudo medido, nada chutado:
     manuais/yamaha-M7CL-v3-owners.pdf, cap.2 "Panels and controls"
       p.17  mapa geral do top panel
       p.18  strip de INPUT e ST IN
       p.19  SELECTED CHANNEL (16 MIX/MTX + HA/PAN/HPF/DYN + EQ 4x3)
       p.21  Centralogic (8 strips com encoder multifunção)
       p.22  SCENE MEMORY / MONITOR e USER DEFINED KEYS (12, grade 4x3)
       p.23  STEREO/MONO MASTER e NAVIGATION KEYS
       p.32  estrutura da touch screen (function access area + main area)
       p.90  SELECTED CHANNEL VIEW screen (15 campos)
       p.98  OVERVIEW screen (12 campos)
     Páginas rasterizadas em _ref-m7cl/p0NN.png. Spec em _ref-m7cl/SPEC-PAINEL.md

   ⚠️ ESTIMADO — a ÚNICA coisa não tirada do manual:
     A COR do chassi. As figuras do manual são line art (P&B), então a
     geometria é exata mas a cor não está lá. A paleta abaixo veio das
     fotos do produto. Está toda em custom properties: para corrigir,
     mexa SÓ no bloco :root — é 1 linha por cor.
     As cores da TELA (azuis, laranja do +48V, verde da curva de EQ) NÃO
     são estimadas: vieram das capturas coloridas da p.32 e p.98.
   ================================================================== */

:root{
  /* --- chassi: MEDIDO na foto real da M7CL-48 enviada pelo dono ---
     Correção: a primeira versão usava cinza grafite (estimativa minha a
     partir do line art). Na foto o corpo é PRETO fosco com moldura preta
     e os blocos de strip são um cinza-chumbo mais escuro que o corpo. */
  --chassi:#17191c;          /* corpo preto fosco */
  --chassi-alto:#23262a;     /* faces iluminadas / relevo */
  --chassi-baixo:#0d0e10;    /* sombra / vinco */
  --painel:#1f2226;          /* fundo dos blocos de strip */
  --etiqueta:#1b5fa8;        /* faixa azul do topo de cada canal */
  --fita:#e9e6dd;            /* fita branca de escrever o nome */
  --serigrafia:#e8e8ea;      /* texto impresso no painel */
  --serigrafia-fraca:#9a9da3;
  --knob-send:#7d2230;       /* knobs MIX/MATRIX do SELECTED CHANNEL: bordô */

  /* --- tela touch: MEDIDO nas capturas coloridas p.32 / p.98 --- */
  --tela-fundo:#2b2d30;
  --tela-canal:#3a3d42;
  --tela-azul:#1f6fb8;       /* botões e faixa do canal selecionado */
  --tela-azul-claro:#3fa9f5;
  --tela-laranja:#e8741c;    /* +48V, INS  */
  --tela-verde:#39b54a;      /* curva de EQ */
  --tela-borda:#5a5e64;
  --tela-texto:#e9eaec;

  /* --- LEDs --- */
  --led-on:#48e05a;          /* [ON] aceso */
  --led-sel:#f2c200;         /* [SEL] aceso */
  --led-cue:#ff8a1f;         /* [CUE] aceso */
  --led-over:#ff2d2d;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#17181a;color:var(--serigrafia);
  font-family:"Segoe UI",Tahoma,Verdana,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* A mesa é desenhada num palco fixo de 1920x1000 e depois recebe um
   scale para caber na janela. Assim as proporções do painel nunca
   deformam -- só muda o zoom. */
/* position:fixed + translate(-50%,-50%) centraliza o palco JÁ escalado.
   Com o palco no fluxo normal ele continua ocupando 1920x1000 e o
   flex do body empurra tudo -- foi o que deixou a mesa fora do lugar. */
/* PROPORÇÃO MEDIDA, não escolhida:
     - cotas oficiais (p.299): 1274 mm x 701 mm  ->  1.817
     - vista de topo da figura p.17, medida por pixel: 1349 x 734 px -> 1.838
   Duas fontes independentes batem, então o palco usa 1920 x 1044 (= 1.839). */
/* Centralização: margem negativa de METADE do tamanho de design, e o scale
   em torno do centro. Com translate(-50%,-50%) o deslocamento usaria o
   tamanho NÃO escalado (960/522 px) e jogava a mesa para o canto. */
#palco{
  position:fixed;left:50%;top:50%;width:1920px;height:1044px;
  margin-left:-960px;margin-top:-522px;
  transform-origin:center center;
}

/* ---- contrato html.smu-fs (memória: o player avisa por postMessage e o
   simulador responde SÓ com CSS -- sem isso o sim é cortado em tela cheia) --- */
html.smu-fs,html.smu-fs body{height:100%}
html.smu-fs body{align-items:center}

/* ================= chassi ================= */
.mesa{
  position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(180deg,var(--chassi-alto) 0%,var(--chassi) 42%,var(--chassi-baixo) 100%);
  box-shadow:0 18px 60px #000a, inset 0 1px 0 #ffffff18;
  display:flex;flex-direction:column;padding:10px;gap:8px;
}

/* Profundidade dos andares, MEDIDA na figura p.17 (caixa de 734 px):
   andar de cima 330 px = 45 %, andar de baixo 310 px = 42 %,
   faixa frontal da mesa 94 px = 13 %. */
/* gap ZERO de propósito: a posição de cada bloco vem das medidas da planta,
   por vãos explícitos. Deixar o flex distribuir sobra foi o que desalinhou
   os blocos de input da direita entre o andar de cima e o de baixo -- na
   mesa real os dois começam no MESMO x (1119 de 1349 na planta). */
.andar{display:flex;gap:0;min-height:0}
.andar.cima{flex:45 1 0}
.andar.baixo{flex:42 1 0}
.rodape{
  flex:13 1 0;min-height:0;display:flex;align-items:center;padding:0 14px;
  border-top:1px solid #00000055;
  background:linear-gradient(180deg,var(--chassi-baixo),#31343880);
  border-radius:0 0 6px 6px;
}

/* bloco preto que abriga um grupo de strips */
.bloco{
  background:var(--painel);border-radius:6px;padding:5px 4px;
  border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff10;
  display:flex;gap:2px;flex:0 0 auto;
}
.bloco.col{flex-direction:column;gap:4px}

/* ================= strip de canal ================= */
/* ordem MEDIDA no manual p.18: nº / SEL / CUE / 6 LEDs / ON / nome / fader / nº */
/* Larguras MEDIDAS na figura p.17 (% da largura da mesa x 1920 px):
     input  1.885 % -> 36 px   (confere nos dois blocos: 16 e 8 strips)
     ST IN  1.90  % -> 36 px
     Centralogic 2.41 % -> 46 px  (faders mais espaçados que os de input)
     STEREO/MONO 2.15 % -> 41 px                                        */
/* O strip divide a largura do bloco (que é quem tem a medida da planta),
   em vez de cada strip ter largura fixa e a soma "dar mais ou menos certo". */
.strip{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:2px 1px;background:#232629;border-radius:3px;border:1px solid #0c0d0e;
}
/* Etiqueta AZUL no topo de cada canal -- vista na foto real.
   O rodapé do strip é serigrafia branca simples. */
.strip .num{
  font-size:9px;color:#fff;line-height:1;font-weight:700;width:100%;text-align:center;
  background:linear-gradient(180deg,#2a78c4,var(--etiqueta));
  border-radius:2px;padding:1px 0;border:1px solid #0b3a68;
}
.strip .num.b{
  margin-top:1px;background:none;border:none;color:var(--serigrafia);
  font-weight:600;font-size:8px;padding:0;
}

/* Alturas MEDIDAS no recorte ampliado do andar de baixo (strip de 280 px na
   planta): a metade de cima do canal é botão e meter; o fader fica com 43 %.
   A 1ª versão dava 67 % ao fader e o strip virava um trilho comprido e vazio. */
/* As teclas da M7CL são CINZA-CLARAS com o LED escuro em cima (ver foto do
   painel SCENE/UDK/NAV). A 1ª versão usava tecla escura e elas sumiam no
   painel preto -- na mesa real elas saltam à vista. */
.tecla{
  width:26px;height:20px;border-radius:2px;cursor:pointer;position:relative;
  background:linear-gradient(180deg,#d3d7db 0%,#b3b8be 55%,#969ba1 100%);
  border:1px solid #15171a;
  box-shadow:inset 0 1px 0 #ffffffcc, 0 1px 2px #0009;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.tecla:active{transform:translateY(1px)}
/* o LED é a barrinha na parte de cima da tecla, como no hardware */
.tecla i{
  display:block;width:16px;height:4px;border-radius:1px;background:#2a2d31;
  box-shadow:inset 0 1px 1px #000;transition:background .08s,box-shadow .08s;
}
.tecla.on i{background:var(--led-on);box-shadow:0 0 6px var(--led-on)}
.tecla.sel.on i{background:var(--led-sel);box-shadow:0 0 6px var(--led-sel)}
.tecla.cue.on i{background:var(--led-cue);box-shadow:0 0 6px var(--led-cue)}
.rot{font-size:7px;color:var(--serigrafia-fraca);line-height:1;letter-spacing:.3px}

/* meter de 6 LEDs -- OVER,-6,-12,-18,-30,-60 (p.18) */
.meterled{display:flex;flex-direction:column;gap:1px;width:26px;padding:1px 2px;
  background:#15171a;border-radius:2px;border:1px solid #0a0b0c}
.meterled b{display:block;height:7px;border-radius:1px;background:#15281a;
  box-shadow:inset 0 0 0 1px #0b0d0c;transition:background .05s}
/* cores conferidas na foto: verde embaixo, âmbar no topo da faixa útil,
   vermelho só no OVER */
.meterled b.a{background:var(--led-on)}
.meterled b.a.am{background:#e8c020;box-shadow:0 0 4px #e8c02088}
.meterled b.a.ov{background:var(--led-over);box-shadow:0 0 5px var(--led-over)}

/* ===== SELECTED CHANNEL VIEW =====
   A tela real tem 640x480 e NÃO rola: se rolou, o layout está errado. Aqui
   os controles são apertados o suficiente para caber, sem mudar a estrutura
   medida na figura da p.90. */
.telasel > div{min-height:0;min-width:0;overflow:hidden}
.telasel .knob{--kd:19px}
.telasel .knob.mini,.telasel .kt{--kd:14px;--kt:14px}
.telasel .tbt{font-size:7.5px;padding:1px 3px;line-height:1.15}
/* a célula do knob (rótulo + knob + valor) é o que mais custa altura: são 12
   delas só no EQ. Colar as três linhas devolve os 25 px que faltavam. */
.telasel .kcel{min-width:0 !important;gap:0 !important}
.telasel .kcel > div{line-height:1;font-size:7px}

/* fita BRANCA de escrever o nome do canal (na foto é fita clara, não faixa preta) */
.nome{
  width:32px;height:14px;background:var(--fita);border:1px solid #8d8a80;border-radius:1px;
  font-size:7.5px;color:#15181b;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;white-space:nowrap;cursor:pointer;
}

/* fader 100mm: trilho + escala impressa + cursor */
/* 43 % do strip -- MEDIDO na planta (fader 120 px num strip de 280 px).
   Com flex:1 ele engolia 67 % e o canal virava um trilho vazio. */
.fader{
  position:relative;width:30px;flex:0 0 43%;min-height:0;cursor:ns-resize;
  display:flex;align-items:stretch;justify-content:center;
  /* Na foto (e na planta) a área do fader é um painel CLARO com a escala
     impressa e a fenda escura no meio. Deixar tudo escuro como o resto do
     strip fazia o fader sumir e o canal parecer oco. */
  background:linear-gradient(180deg,#4b5057,#3c4046);
  border-radius:2px;box-shadow:inset 0 0 3px #0008;
}
/* Sem a fita de nome (a Centralogic não tem, p.21), sobram os 14 px da fita
   mais os 2 px de gap. Devolvo ao FADER, que é o que a figura do manual
   mostra: o fader da Centralogic corre mais longo que o do canal de input.
   Isto é aritmética em cima da medida da planta (43 %), não medida nova. */
.strip[data-cl] .fader{flex:0 0 calc(43% + 16px)}

/* O fader é o elemento mais visível do canal na mesa real (ver foto).
   A 1ª versão tinha trilho fino e escuro e o strip virava um buraco preto. */
/* a fenda por onde o punho corre: escura contra o painel claro */
.fader .trilho{
  position:absolute;left:50%;top:3px;bottom:3px;width:7px;transform:translateX(-50%);
  background:linear-gradient(90deg,#0b0d0f 0%,#17191c 40%,#25282c 50%,#17191c 60%,#0b0d0f 100%);
  border-radius:2px;box-shadow:inset 0 1px 3px #000, 0 0 0 1px #5a6068;
}
.fader .escala{
  position:absolute;inset:3px 0;font-size:5px;color:#e2e5e8;
  pointer-events:none;
}
.fader .escala span{position:absolute;right:0;transform:translateY(-50%);line-height:1}
.fader .escala u{position:absolute;left:0;width:4px;height:1px;background:#cfd3d8;
  transform:translateY(-50%);text-decoration:none}
/* cursor claro e graúdo, com o risco central branco do fader Yamaha */
/* punho: ~62 % da largura do strip na planta. A 1ª versão usava 26 px num
   strip de 29 px (90 %) e o punho transbordava por cima das bordas. */
.fader .cursor{
  position:absolute;left:50%;width:18px;height:13px;transform:translate(-50%,-50%);
  border-radius:2px;pointer-events:none;
  background:linear-gradient(180deg,#f2f4f6 0%,#cfd3d7 40%,#7e8288 50%,#c8ccd1 60%,#eef0f2 100%);
  border:1px solid #0d0f11;box-shadow:0 2px 5px #000b, inset 0 1px 0 #fff;
}
.fader .cursor:after{content:"";position:absolute;left:1px;right:1px;top:50%;height:2px;
  background:#fff;transform:translateY(-50%);box-shadow:0 0 2px #000a}
/* Na M7CL o punho do STEREO e do MONO é VERMELHO -- é o que distingue o
   master dos canais quando se olha a mesa de longe. */
.strip.master .fader .cursor{
  background:linear-gradient(180deg,#e8555f 0%,#c8202e 40%,#7d1019 50%,#c02434 60%,#e8555f 100%);
  border-color:#3d070c;
}
.strip.master .fader .cursor:after{background:#ffd9dc}

/* ================= knobs ================= */
/* Knob com cara de peça física: saia escura em volta, corpo com luz vinda de
   cima-esquerda e um brilho especular. Antes era um disco chapado. */
.knob{
  width:var(--kd,26px);height:var(--kd,26px);border-radius:50%;position:relative;cursor:ns-resize;
  background:
    radial-gradient(circle at 36% 26%,#8a8f97 0%,#5a5f66 34%,#3a3e44 62%,#22252a 100%);
  border:1px solid #0d0f11;
  box-shadow:0 2px 5px #000a, inset 0 1px 1px #ffffff30, inset 0 -2px 3px #0009;
}
.knob:before{ /* brilho especular */
  content:"";position:absolute;left:22%;top:14%;width:34%;height:26%;border-radius:50%;
  background:linear-gradient(180deg,#ffffff55,#ffffff00);pointer-events:none;
}
.knob:after{ /* traço indicador */
  content:"";position:absolute;left:50%;top:7%;width:2px;height:36%;
  background:#f4f6f8;border-radius:1px;transform-origin:50% 100%;
  transform:translateX(-50%) rotate(var(--ang,0deg));
  box-shadow:0 0 2px #000a;
}
.knob.mini{--kd:19px}
/* os 16 encoders MIX/MATRIX do SELECTED CHANNEL são bordô na mesa real */
.knob.send{
  background:radial-gradient(circle at 36% 26%,#c4515f 0%,#9c2d3c 34%,var(--knob-send) 66%,#3f0d15 100%);
}
/* o encoder tem serrilha na saia, como no hardware */
.knob.enc:before{
  content:"";position:absolute;inset:1px;border-radius:50%;z-index:0;
  background:repeating-conic-gradient(#00000045 0 7deg,#ffffff14 7deg 14deg);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);
          mask:radial-gradient(circle,transparent 58%,#000 60%);
}
.knob.enc{ /* encoder multifunção */
  background:radial-gradient(circle at 36% 26%,#969ba3 0%,#666b72 34%,#3f434a 64%,#25282c 100%);
}

/* ================= SELECTED CHANNEL ================= */
/* SELECTED CHANNEL: 11.1 % da largura da mesa.
   MEDIDO no recorte ampliado da p.17 (x 557..707 da caixa de 1349 px).
   A 1ª versão usava 21.5 % -- o dobro -- e era o que mais deixava a mesa
   "fora de parâmetro": o painel de knobs engolia o lugar do display. */
/* largura vem de MED.selch (medida na planta), aplicada no script */
.selch{
  background:var(--painel);border:1px solid #000;border-radius:6px;padding:3px;
  display:flex;gap:3px;flex:0 0 auto;
}
/* vãos de chassi: larguras vindas das medidas da planta (const MED no script) */
.vao-chassi{flex:0 0 auto}
.vao{
  flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:10px;
}
.vao span{font-size:9px;color:var(--serigrafia-fraca);letter-spacing:.5px}
/* Knobs miúdos: o SELECTED CHANNEL real tem 213 px de largura para 33 knobs.
   São pequenos na mesa de verdade -- encolher aqui é fidelidade, não economia. */
/* knobs maiores: na foto o SELECTED CHANNEL é DENSO, os knobs preenchem a
   caixa inteira. Os meus estavam espremidos no topo com vazio embaixo. */
.selch .knob{--kd:24px}
.selch .knob.mini{--kd:20px}
/* Os dois blocos ESTICAM para preencher os 201 px da caixa. Sem isto eles
   ficavam com a largura natural (131 px) e sobravam 70 px mortos à direita
   -- era o vazio que aparecia na comparação com a foto. */
.selch>*{flex:1 1 0;min-width:0}
.selch>.caixa:first-child{flex:0 0 40%}
.selch>div:last-child{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.selch .caixa{display:flex;flex-direction:column;justify-content:center}
.gridmix{align-content:space-between;height:100%;justify-items:center}
.eqlinha{justify-content:space-around}
.selch .caixa{border:1px solid #4a4e54;border-radius:3px;padding:3px 3px;position:relative}
.selch .caixa>.tit{
  position:absolute;top:-5px;left:4px;background:var(--painel);padding:0 3px;
  font-size:6px;color:var(--serigrafia);letter-spacing:.3px;font-weight:600;
}
.gridmix{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px}
.gridmix .cel{display:flex;flex-direction:column;align-items:center;gap:1px}
.gridmix .cel small{font-size:6.5px;color:var(--serigrafia-fraca);line-height:1}
.eqlinha{display:flex;align-items:flex-end;gap:3px;margin-top:1px}
.eqlinha .cel{display:flex;flex-direction:column;align-items:center;gap:0}
.eqlinha .cel small{font-size:4.5px;color:var(--serigrafia-fraca);line-height:1}
.gridmix .cel small{font-size:5px}
.faixa-eq{font-size:5.5px;color:var(--serigrafia);text-align:center;letter-spacing:.3px}

/* ================= touch screen ================= */
/* Display: 24.5 % da mesa = moldura com a TELA LCD (16.8 %, razão ~4:3)
   à esquerda e a placa YAMAHA / M7CL (6.7 %) à direita. MEDIDO na p.17. */
.telabox{
  flex:0 0 auto;background:var(--painel);border-radius:6px;border:1px solid #000;
  padding:5px;display:flex;gap:4px;position:relative;
}
.placa{
  flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
  align-items:flex-end;justify-content:space-between;padding:2px 2px 6px;
}
.placa .ym{font-size:13px;font-weight:800;letter-spacing:1.5px;color:#d8dbe0}
.placa .mod{text-align:right;line-height:1.15}
.placa .mod u{display:block;font-size:5.5px;letter-spacing:.6px;color:#92969c;
  text-decoration:none}
.placa .mod b{font-size:17px;letter-spacing:.5px;color:#e4e7ea}
/* centro do andar de cima: bridge em cima (atravessando os dois),
   selected channel + display embaixo. Larguras fixas porque foram MEDIDAS. */
/* O centro alinha pela BASE com os blocos de input: na planta os blocos vão
   até y=310 e o display até y=315. Alinhado pelo topo, sobrava um degrau de
   uns 100 px embaixo do display -- foi o "flutuando" que o dono viu.
   Altura: bridge (30..110) + display (117..315) = 285 px de 734 = 38,8 %. */
.centro{
  flex:0 0 auto;display:flex;flex-direction:column;gap:5px;
  align-self:flex-end;height:405px;
}
/* altura da faixa selected-channel/display: 198 px de 734 = 27 % = 282 px.
   Alinhada ao topo: abaixo dela a mesa real tem chassi liso até a Centralogic. */
.centro-linha{flex:0 0 auto;height:282px;display:flex;gap:6px;align-items:stretch}

/* --- meter bridge MBM7CL (atravessa selected channel + tela) --- */
/* altura da bridge: 80 px de 734 na planta = 114 px no palco */
.bridge{
  flex:0 0 auto;width:100%;height:114px;overflow:hidden;display:flex;gap:8px;align-items:stretch;
  background:#0e1012;border:1px solid #000;border-radius:4px;padding:3px 6px;
  box-shadow:inset 0 1px 0 #ffffff12;
}
.bcols{flex-wrap:nowrap}
.bgrupo{display:flex;flex-direction:column;gap:1px;justify-content:flex-end}
.blinha{display:flex;gap:3px;align-items:flex-end}
/* escala em dB serigrafada dos DOIS lados de cada grupo (p.17/19) */
.besc{
  display:flex;flex-direction:column;justify-content:flex-end;
  gap:1px;padding-bottom:1px;
}
.besc span{
  font-size:4.5px;line-height:5px;height:5px;color:var(--serigrafia-fraca);
  text-align:right;white-space:nowrap;
}
.bcols{display:flex;gap:3px;align-items:flex-end}
.bcol{display:flex;flex-direction:column;align-items:center;gap:1px}
.bcol>span{font-size:6px;color:var(--serigrafia-fraca);line-height:1}
.bleds{display:flex;flex-direction:column;gap:1px}
/* LED apagado não é cinza morto: é o próprio LED sem corrente, e a grade
   continua visível de longe (ver foto da bridge). */
/* LED bicolor APAGADO é escuro, seja qual for a cor que ele acende.
   Pintar o topo de vermelho/âmbar escuro deixava a bridge com cara suja --
   na foto a bridge apagada é uma grade verde-escura uniforme. */
/* LED da bridge: retângulo HORIZONTAL, como no desenho do manual */
.bleds{display:flex;flex-direction:column;gap:1px}
.bleds b{display:block;width:11px;height:4px;border-radius:1px;background:#15281a;
  box-shadow:inset 0 0 0 1px #0a0c0b}
.bleds b.a{background:var(--led-on);box-shadow:0 0 4px #48e05a99}
.bleds b.a.am{background:#e8c020;box-shadow:0 0 4px #e8c02099}
.bleds b.a.ov{background:var(--led-over);box-shadow:0 0 5px var(--led-over)}
.brot{font-size:6.5px;color:var(--serigrafia-fraca);text-align:center;letter-spacing:1px}
.betiq{margin-left:auto;align-self:center;font-size:6.5px;color:var(--serigrafia-fraca);
  border:1px solid #34383d;border-radius:2px;padding:2px 5px}
.bridge .logo{align-self:center;font-size:13px;font-weight:800;letter-spacing:2.5px;
  color:#d8dbe0;padding-left:6px}
/* "M7CL" impresso à direita da tela, como na foto */
.telabox .marca{font-size:13px;letter-spacing:1.5px;color:#b9bdc3;font-weight:700}

/* TELA LCD: 16.8 % da mesa = 322 px. Razão medida na p.17: 226x172 px = 1.31,
   ou seja ~4:3 -- NÃO é widescreen (foi outro erro da 1ª versão). */
/* Altura MEDIDA na planta: 172 px de 734 = 23.4 % da profundidade = 246 px.
   Fixa em px de propósito -- derivar altura da largura (aspect-ratio) é o que
   já cortou simulador em tela cheia neste projeto. */
/* ===== A TELA TEM RESOLUÇÃO PRÓPRIA =====
   Erro que causava sobreposição e barra de rolagem: eu desenhava o conteúdo
   em 327x250, que é o TAMANHO FÍSICO da tela na mesa -- não a resolução dela.
   O SELECTED CHANNEL VIEW não cabe nesse espaço e vazava por cima.

   A área ativa medida na planta dá 238x181 = razão 1,315, ou seja ~4:3.
   Logo o LCD é VGA 640x480. Desenho o conteúdo NESSA resolução e escalo para
   o tamanho físico: na mesa fica pequeno (como é de verdade) e o AMPLIAR
   mostra o MESMO desenho, legível e sem estourar.                        */
#lcd-espaco{
  flex:0 0 auto;overflow:hidden;position:relative;
  background:#000;border:2px solid #0a0b0c;border-radius:2px;
}
#tela{
  position:absolute;left:0;top:0;
  width:640px;height:480px;               /* resolução do LCD, não o tamanho */
  transform-origin:0 0;
  display:flex;gap:5px;
  background:var(--tela-fundo);padding:5px;
  color:var(--tela-texto);font-size:14px;overflow:hidden;
}
/* position:relative para as janelas (popup) ficarem contidas na ÁREA
   PRINCIPAL. Sem isto elas se ancoravam em #tela e cobriam também a área de
   acesso a funções -- na mesa real o menu da direita CONTINUA visível com a
   janela aberta (ver a figura de SELECTED CHANNEL VIEW e a p.32). */
#area{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden;
  position:relative}

/* --- function access area (barra direita da tela, p.32) --- */
/* function access area: ~22 % da largura da tela (medido na p.32).
   Em resolução de LCD (640 px) isso dá 140 px. */
#fac{width:140px;flex:0 0 auto;display:flex;flex-direction:column;gap:7.6px}
#fac .bt{
  background:linear-gradient(180deg,#3c4046,#2a2d31);border:1.9px solid #14161a;border-radius:5.7px;
  padding:5.7px 7.6px;font-size:18.1px;text-align:center;cursor:pointer;color:var(--tela-texto);
}
#fac .bt:hover{background:linear-gradient(180deg,#4a4f56,#33373c)}
#fac .bt.ativo{background:linear-gradient(180deg,#2f8fd8,#1a5f9e);border-color:#0d3f6d}
#fac .selcanal{
  background:linear-gradient(180deg,#2f8fd8,#1a5f9e);border:1.9px solid #0d3f6d;border-radius:5.7px;
  padding:3.8px 7.6px;cursor:pointer;line-height:1.15;
}
#fac .selcanal b{font-size:24.7px;display:block;letter-spacing:.5px}
#fac .selcanal span{font-size:19px;color:#dbeaf7}
#fac .relogio{font-size:19px;text-align:center;color:#c8ccd2;background:#1a1c1f;border-radius:3.8px;padding:1.9px}
#fac .cena{
  margin-top:auto;background:#1a1c1f;border:1.9px solid #14161a;border-radius:5.7px;padding:3.8px 7.6px;cursor:pointer;
}
#fac .cena u{font-size:15.2px;color:#9aa0a8;text-decoration:none;display:block}
#fac .cena b{font-size:28.5px;letter-spacing:1.9px}
#fac .cena span{font-size:16.1px;color:#c8ccd2;display:block;overflow:hidden;white-space:nowrap}

/* meter da function access area */
#facmeter{background:#111315;border:1.9px solid #14161a;border-radius:5.7px;padding:3.8px;
  display:flex;flex-direction:column;align-items:center;gap:3.8px}
#facmeter .barras{display:flex;gap:3.8px;height:140.6px;align-items:flex-end}
#facmeter .barras i{width:15.2px;background:#1d2023;border-radius:1.9px;position:relative;height:100%}
#facmeter .barras i b{position:absolute;left:0;right:0;bottom:0;border-radius:1.9px;
  background:linear-gradient(0deg,#39b54a,#c8d400 72%,#ff2d2d 92%)}
#facmeter .rot{font-size:13.3px}

/* ================= Centralogic / UDK / NAV / SCENE ================= */
/* Proporções verticais MEDIDAS no recorte ampliado do painel (265 px de
   altura útil na planta): SCENE 18 % · UDK 40 % · NAV 37 %.
   E cada seção vive dentro de uma CAIXA com moldura e título serigrafado --
   eu tinha empilhado as três soltas e o painel ficava com cara improvisada. */
.bloco.col{justify-content:flex-start;gap:4px;padding:5px 4px}
.secao{
  border:1px solid #4a4e54;border-radius:3px;padding:4px 3px 3px;position:relative;
  display:flex;flex-direction:column;justify-content:center;
}
.secao.s-scene{flex:18 1 0}
.secao.s-udk{flex:40 1 0}
.secao.s-nav{flex:37 1 0}
.subtit{
  position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  background:var(--painel);padding:0 4px;white-space:nowrap;
  font-size:6.5px;color:var(--serigrafia);letter-spacing:.7px;font-weight:600;
}
.udk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px;place-items:center}
/* teclas da UDK são QUADRADAS na planta, não retangulares largas */
.udk .tecla{width:19px;height:17px}
.udkcel{display:flex;flex-direction:column;align-items:center;gap:0}
.udkcel small{font-size:6px;color:var(--serigrafia-fraca);line-height:1.1}

.nav{display:flex;gap:4px;align-items:flex-start}
.nav .col{display:flex;flex-direction:column;gap:3px}
.nav .navk{
  width:44px;height:17px;border-radius:2px;cursor:pointer;font-size:7px;
  background:linear-gradient(180deg,#5d6167,#3e4146);border:1px solid #1a1c1f;
  color:var(--serigrafia);display:flex;align-items:center;justify-content:center;gap:2px;
  box-shadow:inset 0 1px 0 #ffffff22;
}
.nav .navk i{width:5px;height:5px;border-radius:1px;background:#2a2d31;flex:0 0 auto}
.nav .navk.on i{background:var(--led-sel);box-shadow:0 0 5px var(--led-sel)}
.nav .navk.piscando i{animation:pisca .45s steps(1) infinite}
@keyframes pisca{50%{background:#2a2d31;box-shadow:none}}

.cena-sec{display:flex;align-items:center;gap:6px}
.cena-sec .bt{
  width:34px;height:26px;border-radius:3px;cursor:pointer;font-size:7px;
  background:linear-gradient(180deg,#5d6167,#3e4146);border:1px solid #1a1c1f;
  color:var(--serigrafia);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 #ffffff22;
}
.cena-sec .bt:active{transform:translateY(1px)}
.setas{display:flex;flex-direction:column;gap:3px}
.setas .bt{width:26px;height:15px;font-size:8px}

/* ===== aviso de SENDS ON FADER =====
   Nesse modo o fader NÃO é o nível do canal e o [ON] NÃO é o mute do canal:
   os dois passam a ser da MANDADA. É o comportamento real (p.70), mas sem
   aviso na mesa o operador acha que a tecla parou de funcionar. */
.mesa.sof .strip .fader .cursor{
  background:linear-gradient(180deg,#ffd98a 0%,#f0a020 40%,#a86a06 50%,#e8a52c 60%,#ffd98a 100%);
  border-color:#5c3a02;
}
#avisosof{
  position:absolute;left:50%;top:2px;transform:translateX(-50%);z-index:50;
  background:linear-gradient(180deg,#f0a020,#c87a08);color:#1a1206;
  font-size:12px;font-weight:700;letter-spacing:.4px;
  padding:3px 14px;border-radius:0 0 5px 5px;border:1px solid #7a4a04;border-top:0;
  display:none;
}
.mesa.sof #avisosof{display:block}

/* ================= rodapé de ajuda ================= */
#ajuda{
  position:absolute;left:10px;bottom:6px;right:250px;height:20px;
  font-size:11px;color:#cfd3d8;display:flex;align-items:center;gap:8px;
  pointer-events:none;
}
#ajuda b{color:#ffd45e}

/* ================= popups da tela ================= */
/* A janela ocupa a ÁREA PRINCIPAL e NUNCA o menu da direita: na mesa real a
   área de acesso a funções continua visível com a janela aberta (figura de
   SELECTED CHANNEL VIEW e ATT/HPF/EQ no manual). O #area agora é relative,
   então o inset é relativo a ela. */
.popup{
  position:absolute;inset:3px;background:#242629;border:1.9px solid #5a5e64;
  border-radius:6px;display:flex;flex-direction:column;overflow:hidden;z-index:20;
}
.popup .cab{
  display:flex;align-items:center;gap:11.4px;padding:5.7px 9.5px;background:linear-gradient(180deg,#3d4147,#2a2d31);
  border-bottom:1.9px solid #14161a;font-size:19px;font-weight:600;
}
.popup .cab .x{margin-left:auto;cursor:pointer;background:#1f6fb8;border-radius:2px;
  padding:1px 7px;border:1px solid #0d3f6d}
/* teclas de ferramentas do manual (p.35): LIBRARY DEFAULT COPY PASTE COMPARE */
.ferramentas{display:flex;gap:3px;margin-left:auto}
.ferramentas .fbt{
  background:linear-gradient(180deg,#4a4f56,#33373c);border:1px solid #14161a;
  border-radius:2px;color:#e9eaec;font-size:9px;padding:2px 6px;cursor:pointer;
  font-family:inherit;
}
.ferramentas .fbt:hover{background:linear-gradient(180deg,#5a6069,#3d4249)}
/* fichas 1ch / 8ch / ALL no rodapé da janela */
.abas1ch{display:flex;gap:2px;padding:3px 4px 0}
.abas1ch .abt{
  background:linear-gradient(180deg,#3c4046,#2a2d31);border:1px solid #14161a;
  border-bottom:0;border-radius:3px 3px 0 0;color:#c9ced4;font-size:10px;
  padding:2px 12px;cursor:pointer;font-family:inherit;
}
.abas1ch .abt.on{background:#fff;color:#15181b;font-weight:700}
.popup .corpo{flex:1 1 auto;overflow:auto;padding:11.4px}

/* ===== cores dos knobs NA TELA, medidas na figura oficial (p.90) =====
   Os 16 sends não são todos da mesma cor: vão em quatro grupos de quatro —
   1-4 vermelho, 5-8 azul, 9-12 ciano, 13-16 roxo. O EQ é verde, o PAN é
   vermelho e o HPF é verde. Eu tinha pintado tudo de bordô. */
.kt{ width:var(--kt,49.4px);height:var(--kt,49.4px);border-radius:50%;position:relative;
  cursor:ns-resize;border:1.9px solid #10131a;
  box-shadow:0 1.9px 5.7px #0009, inset 0 1.9px 1.9px #ffffff33;
  background:radial-gradient(circle at 36% 28%, var(--kc2), var(--kc1) 68%, var(--kc0));
}
.kt:after{content:"";position:absolute;left:50%;top:8%;width:2px;height:36%;
  background:#fff;border-radius:1px;transform-origin:50% 100%;
  transform:translateX(-50%) rotate(var(--ang,0deg));box-shadow:0 0 2px #000a}
.k-send1{--kc2:#f2707a;--kc1:#cf2d3d;--kc0:#6d0f18}   /* MIX 1-4  vermelho */
.k-send2{--kc2:#7aa8f0;--kc1:#2f5fd0;--kc0:#12285e}   /* MIX 5-8  azul     */
.k-send3{--kc2:#7fdcf2;--kc1:#22a6c8;--kc0:#0b4657}   /* MIX 9-12 ciano    */
.k-send4{--kc2:#c39cf0;--kc1:#7c4dc8;--kc0:#33165c}   /* MIX 13-16 roxo    */
.k-eq   {--kc2:#a9dfa2;--kc1:#4f9f52;--kc0:#1d4520}   /* EQ verde          */
.k-pan  {--kc2:#f2707a;--kc1:#cf2d3d;--kc0:#6d0f18}   /* PAN vermelho      */
.k-hpf  {--kc2:#9fe0cf;--kc1:#33a68c;--kc0:#0f4437}   /* HPF verde-água    */
.k-cinza{--kc2:#c6ccd4;--kc1:#7b838d;--kc0:#2a3038}   /* HA e dinâmica     */

/* rodapé da tela: os 8 canais da Centralogic, com o selecionado em azul */
.rodape-canais{display:flex;gap:1px;margin-top:auto;padding-top:3px}
.rodape-canais div{
  flex:1 1 0;min-width:0;font-size:13.3px;text-align:center;padding:1.9px 0;border-radius:1.9px;
  background:#8d939b;color:#15181b;overflow:hidden;white-space:nowrap;cursor:pointer;
}
.rodape-canais div.sel{background:var(--tela-azul);color:#fff}
/* A linha L do OVERVIEW é MOSTRUÁRIO, não botoeira: o manual (p.99) diz que
   ela indica quais canais os faders pegam — não há operação de tocar nela.
   Classe PRÓPRIA de propósito: se reusasse `.rodape-canais` as 8 células
   casariam um seletor com cursor:pointer e virariam botão que finge — que é
   exatamente o defeito que o portão clicar-tudo caça (e ele resolve seletor,
   não cascata, então sobrescrever o cursor depois não bastaria). */
.linha-l{display:flex;gap:1px;padding-top:3px}
.linha-l span{
  flex:1 1 0;min-width:0;font-size:13.3px;text-align:center;padding:1.9px 0;border-radius:1.9px;
  background:#5f656c;color:#dfe3e8;overflow:hidden;white-space:nowrap;
}
.linha-l span.sel{background:#3c6ea8;color:#fff}

/* ===== caixa de confirmação (p.32) =====
   A M7CL pergunta antes de chamar ou guardar cena -- é a RECALL/STORE
   CONFIRMATION das preferences (p.214). Eu tinha a preferência declarada mas
   NÃO a usava: um toque numa tecla de cena apagava a mixagem inteira do aluno
   sem aviso. A caixa segue a figura do manual: verde, com "?" e CANCEL/OK. */
#confirma{
  position:absolute;inset:0;z-index:120;display:none;
  align-items:center;justify-content:center;background:#0008;
}
#confirma.on{display:flex}
#confirma .cx{
  background:linear-gradient(180deg,#3f6b46,#2c4b31);
  border:2px solid #8fbf96;border-radius:5px;min-width:260px;max-width:80%;
  box-shadow:0 8px 30px #000a;overflow:hidden;
}
#confirma .tit{
  background:#24402a;padding:4px 10px;font-size:13px;font-weight:700;
  letter-spacing:.5px;color:#dff0e2;
}
#confirma .msg{
  display:flex;align-items:center;gap:10px;padding:14px 12px;font-size:14px;color:#f0f6f1;
}
#confirma .msg .q{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 38% 30%,#bfe0c4,#4d7d55);
  border:1px solid #24402a;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;color:#1b2f1f;
}
#confirma .bts{display:flex;gap:10px;justify-content:center;padding:0 12px 12px}
#confirma .bts button{
  min-width:96px;padding:6px 10px;font-size:13px;font-family:inherit;cursor:pointer;
  background:linear-gradient(180deg,#20351f,#16250f);color:#eaf3ea;
  border:1px solid #6f9a76;border-radius:3px;
}
#confirma .bts button.ok{background:linear-gradient(180deg,#2c4b31,#20351f)}

/* ===== moldura grossa do parâmetro em foco (p.99) =====
   "Quando você pressiona um dos knobs na tela OVERVIEW, o mesmo tipo de knob
   de cada canal fica cercado por uma moldura grossa. Essa moldura indica que
   o parâmetro pode ser editado — nesse estado você opera os encoders 1–8."
   Sem a moldura o aluno não tem como saber o que os encoders estão movendo. */
/* O alvo é sempre um .knob (redondo), então o anel também tem de ser: outline
   quadrado em cima de um círculo fica com jeito de erro de layout. */
.emfoco{ box-shadow:0 0 0 2px #ffd45e, 0 0 7px #ffd45e88 !important; }
/* "Knobs com moldura DUPLA indicam PAN/BALANCE" (p.31) — dois anéis */
.emfoco.dupla{
  box-shadow:0 0 0 2px #ffd45e, 0 0 0 3px #15171a, 0 0 0 5px #ffd45e,
             0 0 7px #ffd45e88 !important;
}

/* botão genérico dentro da tela */
.tbt{
  background:linear-gradient(180deg,#3c4046,#2a2d31);border:1.9px solid #14161a;border-radius:3.8px;
  color:var(--tela-texto);font-size:17.1px;padding:3.8px 9.5px;cursor:pointer;
}
.tbt.on{background:linear-gradient(180deg,#2f8fd8,#1a5f9e);border-color:#0d3f6d}
.tbt.laranja.on{background:linear-gradient(180deg,#f08a30,#c85e0e);border-color:#8a3f06}

/* ================= barra de aprendizado (fora da console) ================= */
#barra{
  position:absolute;left:0;right:0;top:0;height:0;overflow:visible;z-index:40;
}
/* ===== barra de transporte, o padrão da frota (.smu do CL5) =====
   O play tem que estar SEMPRE à vista, não escondido dentro de uma tela.
   Fica no rodapé da mesa e é REAPROVEITADA no overlay quando a tela amplia. */
#smu{
  display:flex;align-items:center;gap:8px;flex:0 0 auto;
  padding:4px 10px;background:#111315;border-top:1px solid #000;
  font-size:12px;color:#c9ced4;
}
#smu button{
  background:linear-gradient(180deg,#2f8fd8,#1a5f9e);border:1px solid #0d3f6d;
  border-radius:3px;color:#fff;font-size:12px;padding:4px 12px;cursor:pointer;
  font-family:inherit;
}
#smu button.sec{background:linear-gradient(180deg,#4a4f56,#33373c);border-color:#14161a}
#smu select{
  background:#15171a;color:#e9eaec;border:1px solid #3d4147;border-radius:3px;
  font-size:12px;padding:3px 6px;max-width:280px;
}
#smu .st{color:#9aa0a8;font-size:11px}
#smu .st b{color:#ffd45e}

/* navegação de canais DENTRO da tela ampliada: as nav keys ficam na mesa,
   atrás do overlay, e sem isto o aluno não conseguia trocar de grupo */
#navov{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:900px}
#navov button{
  background:linear-gradient(180deg,#4a4f56,#33373c);border:1px solid #14161a;
  border-radius:3px;color:#e9eaec;font-size:11px;padding:3px 10px;cursor:pointer;
  font-family:inherit;
}
#navov button.on{background:linear-gradient(180deg,#2f8fd8,#1a5f9e);border-color:#0d3f6d}

#lupa,#fechar-lupa{
  background:#1f6fb8;border:1px solid #0d3f6d;border-radius:3px;color:#fff;
  font-size:11px;padding:3px 9px;cursor:pointer;font-family:inherit;
}
#lupa{position:absolute;right:10px;top:8px;z-index:45}
#fechar-lupa{font-size:13px;padding:6px 18px}
/* EXPANDIR A TELA
   A 1ª versão escondia os andares e tentava reposicionar a .telabox. Não
   funcionava: a tela vive DENTRO do andar de cima, então sumia junto com ele
   (virava 0x0 — comprovado por medição). Agora a tela é MOVIDA para um overlay
   próprio, que não depende da cadeia de display do painel. */
#overlay{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(8,9,10,.95);
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
#overlay.on{display:flex}
#overlay .moldura{
  background:var(--painel);border:1px solid #000;border-radius:8px;padding:12px;
  box-shadow:0 20px 60px #000c;
}
#overlay .rot{font-size:13px;color:#c9ced4;letter-spacing:.3px;text-align:center}
#overlay .rot b{color:#ffd45e}
/* tela + auxiliares: SELECTED CHANNEL à esquerda, Centralogic embaixo —
   é a vizinhança que os controles têm na mesa física.
   O PALCO (#ov-palco) tem layout natural em width:max-content e é escalado
   como um bloco só — nunca calcular escala medindo pedaço de flexbox. */
#overlay{overflow:hidden}
#ov-palco{display:flex;flex-direction:column;align-items:center;gap:10px;
  width:max-content;transform-origin:50% 50%}
#ov-linha{display:flex;align-items:stretch;gap:10px}
#aux-esq{display:flex;align-items:stretch}
/* a tela ampliada é 1,6x — a seção física ao lado acompanha, senão fica
   um raminho desproporcional do lado de um telão (reclamação do dono) */
#aux-esq .selch{height:auto;zoom:1.55}
#aux-baixo{display:flex;justify-content:center}
/* 232px = o que o strip da Centralogic PRECISA (medido por scrollHeight).
   Com 150px o flexbox não recorta os filhos e os faders vazavam por cima
   dos botões de navegação — parecia sobreposição de camadas, era estouro. */
#aux-baixo .bloco{height:232px}
/* o fader do strip mede 43% DA ALTURA DO STRIP (proporção da planta) — num
   bloco de altura arbitrária isso nunca fecha a conta: crescer o bloco cresce
   o fader junto. Aqui ele vira o elemento elástico e absorve a sobra. */
#aux-baixo .strip .fader{flex:1 1 auto !important}
#aux-baixo:empty,#aux-esq:empty{display:none}
</style>
</head>
<body>
<div id="palco">
  <div class="mesa" id="mesa"></div>
  <button id="lupa" type="button">AMPLIAR TELA</button>
</div>
<div id="overlay">
  <!-- A tela ampliada leva junto os controles que a acompanham na mesa:
       à esquerda a seção SELECTED CHANNEL (os 33 knobs), embaixo os 8 strips
       da Centralogic. Eles são MOVIDOS para cá, não copiados.

       TUDO vive dentro de UM PALCO de layout natural que é escalado como um
       bloco só (transform: scale) — a mesma técnica do zoom-to-fit da mesa.
       Calcular a escala medindo pedaços (largura da coluna, altura do bloco)
       era o que cortava a tela: medida parcial em flexbox mente. -->
  <div id="ov-palco">
    <div id="ov-linha">
      <div id="aux-esq"></div>
      <div class="moldura" id="overlay-moldura"></div>
    </div>
    <div id="aux-baixo"></div>
    <div id="navov"></div>
    <div class="rot">Tela ampliada — recurso do simulador, a console real não faz isto.
      Aperte <b>ESC</b> ou o botão para voltar à mesa.</div>
    <button id="fechar-lupa" type="button">VOLTAR À MESA</button>
  </div>
</div>

<script>
"use strict";
/* ==================================================================
   MOTOR DO SIMULADOR
   Tudo em DOM/SVG de propósito: o portão de teste do projeto
   (ferramentas/clicar-tudo.mjs) não enxerga dentro de <canvas>, então
   um botão desenhado em canvas passaria por "vivo" sem nunca ter sido
   clicado. Curva de EQ é SVG, que é DOM e é inspecionável.
   ================================================================== */

/* ---------- constantes da mesa (MEDIDAS no manual) ---------- */
const N_IN = 48;            // M7CL-48
const N_STIN = 4;
const N_MIX = 16;
const N_MTX = 8;
const N_DCA = 8;
const N_MUTE = 8;

/* escala impressa no fader, p.18 */
const ESCALA_FADER = [10,5,0,-5,-10,-20,-30,-40,-50,-60,-Infinity];
/* LEDs do meter do strip, p.18 */
const LEDS_STRIP = ["OVER","-6","-12","-18","-30","-60"];
/* O limiar de cada LED é o PRÓPRIO rótulo, convertido de dBFS para linear.
   OVER é clip (0 dBFS). Usar números lineares inventados aqui deixava o
   meter apagado com música tocando. */
const LIMIAR_LED = [0, -6, -12, -18, -30, -60].map(db => Math.pow(10, db/20));
/* a bridge tem 12 passos, com os dB impressos nela (p.19) */
const LIMIAR_BRIDGE = [0,-3,-6,-9,-12,-15,-18,-24,-30,-40,-50,-60].map(db => Math.pow(10, db/20));

/* ---------- helpers ---------- */
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const fmtDb = v => v <= -138 ? "-∞" : (v>0?"+":"") + v.toFixed(1);

/* dB do fader -> posição 0..1 no trilho.
   O fader da M7CL não é linear em dB: de +10 a -10 o curso é largo e
   embaixo comprime. Reproduzo a escala impressa por interpolação nos
   próprios pontos serigrafados, que é o que o operador enxerga. */
const PONTOS = [[10,1],[5,.93],[0,.84],[-5,.75],[-10,.66],[-20,.52],
                [-30,.40],[-40,.28],[-50,.17],[-60,.07],[-138,0]];
function dbParaPos(db){
  if (db <= -138) return 0;
  for (let i=0;i<PONTOS.length-1;i++){
    const [d1,p1] = PONTOS[i], [d2,p2] = PONTOS[i+1];
    if (db <= d1 && db >= d2) return p2 + (db-d2)*(p1-p2)/(d1-d2);
  }
  return db > 10 ? 1 : 0;
}
function posParaDb(p){
  p = clamp(p,0,1);
  if (p <= 0) return -138;
  for (let i=0;i<PONTOS.length-1;i++){
    const [d1,p1] = PONTOS[i], [d2,p2] = PONTOS[i+1];
    if (p <= p1 && p >= p2) return d2 + (p-p2)*(d1-d2)/(p1-p2);
  }
  return 10;
}

/* ---------- estado ---------- */
function novoCanal(id, tipo, nome){
  return {
    id, tipo, nome,
    icone: tipo==="in"||tipo==="stin" ? "Vocal" : "Playback",
    on: true, sel:false, cue:false,
    fader: tipo==="in" || tipo==="stin" ? -138 : 0,
    /* HA: faixa MEDIDA no manual -62..+10 dB */
    ha:{ gain:-20, phantom:false, phase:false },
    hpf:{ on:tipo==="in"||tipo==="stin", freq:80 },        /* 20..600 Hz */
    /* EQ 4 bandas, faixas MEDIDAS: F 20..20k, G ±18, Q 0.10..10 */
    eq:{ on:true, tipo:"I", att:0, bandas:{
      low:  {f:125,  g:0, q:0.7},
      lomid:{f:1000, g:0, q:0.7},
      himid:{f:4000, g:0, q:0.7},
      high: {f:10000,g:0, q:0.7} } },
    /* Faixas MEDIDAS no apêndice "Dynamics Parameters" (p.249-251).
       Guardo TODOS os campos de todos os tipos: trocar de tipo na mesa real
       não zera o que os outros tipos usam. */
    dyn1:{ on:false, tipo:"GATE",
           thr:-26, range:-70, attack:0, hold:0.02, decay:0.3,
           ratio:5, release:0.3, knee:2, out:0, width:6, freq:6300 },
    dyn2:{ on:false, tipo:"COMPRESSOR",
           thr:-14, range:-70, attack:6, hold:0.02, decay:0.3,
           ratio:5, release:0.3, knee:2, out:0, width:6, freq:6300 },
    /* TO STEREO/MONO (p.63). Dois modos POR CANAL:
       ST/MONO -> STEREO e MONO ligam/desligam separados (toSt, toMono)
       LCR     -> os dois ligam JUNTOS (lcrOn) e o CSR reparte o nível entre
                  o STEREO (L/R) e o MONO (C). CSR em 0% = pan comum, nada
                  vai para o MONO (p.65) -- por isso 0 é o padrão. */
    pan:0, toSt:true, toMono:false, lcr:false, lcrOn:true, csr:0,
    mix: Array.from({length:N_MIX}, () => ({ lvl:-138, on:true, pre:false })),
    mtx: Array.from({length:N_MTX}, () => ({ lvl:-138, on:true, pre:false })),
    dca:[], mute:[],
    insert:false, dout:false, recallSafe:false,
    nivel:0   /* nível instantâneo p/ os meters */
  };
}

/* ÁUDIO MULTITRACK — o estado vive AQUI, junto de S, e não lá embaixo com as
   funções de áudio.
   ⚠️ TDZ: `montar()` roda no topo do script e monta a barra de transporte, que
   lê AUD. Com o `const AUD` declarado depois, a barra estourava
   "Cannot access 'AUD' before initialization" e o simulador inteiro morria em
   silêncio — o portão acusou "1 não rodaram", não "botão morto". */
const SB_MEDIA = "https://pshynylvvkhhohftouoe.supabase.co/storage/v1/object/public/media/";
const AUD = {
  ctx:null, base:null, bases:[], tocando:false, carregando:false,
  stems:[],            /* {n,c,f,p, canal, buffer, src, nodes} */
  t0:0, offset:0, dur:0,
  pedido:0,            /* contador de carregamentos, para descartar o atrasado */
  /* TODOS os sources criados, independente da música a que pertencem.
     pararAudio() percorria AUD.stems -- mas trocar de música SUBSTITUI essa
     lista, e os sources criados antes ficavam fora dela: vivos, tocando, e
     sem ninguém que os alcançasse. Resultado: duas músicas ao mesmo tempo.
     Esta lista existe para que parar signifique parar TUDO. */
  vivos:[],
};

const S = {
  canais:{},
  sel:"CH1",
  nav:"IN1-8",          /* nav key ativa -> quem está na Centralogic */
  navFixa:null,         /* nav key segurada 2s fixa a Centralogic */
  tela:"OVERVIEW",
  popup:null,
  sof:null,             /* SENDS ON FADER: null | {tipo:"mix"|"mtx", n:0..} */
  sendDest:"mix",       /* TO MIX x TO MATRIX no OVERVIEW */
  /* DUAS coisas diferentes, e o manual (p.22) separa as duas:
       n   = a cena ATUAL, a que está carregada na mesa agora
       sel = o número SELECIONADO, que é o que as teclas [▲]/[▼] movem e o que
             o [STORE] e o [RECALL] usam como alvo
     "Use estas teclas para SELECIONAR o número de cena que você quer guardar
     ou chamar" — a seta não chama nada. Apertar as duas juntas volta para a
     cena atual. Eu tinha uma variável só para os dois papéis; por isso andar
     com a seta parecia mexer na mesa. */
  cena:{ n:0, sel:0, nome:"Initial Data", lista:[] },
  monitor:{ nivel:0.7, cueAtivo:false, dimm:false },
  osc:{ on:false, tipo:"SINE", freq:1000, nivel:-20 },
  talkback:{ on:false, nivel:-10 },
  udk:[],               /* 12 funções */
  usuario:"ADMIN",
  ajuda:"",
  patch:null,           /* preenchido logo abaixo com o padrão de fábrica */
  muteSafe:{},          /* canais protegidos do mute group (p.129) */
  link:[],              /* pares de Channel Link (p.130) */
  focus:{},             /* por cena: o que o recall MEXE (p.147) */
  fade:{ on:false, tempo:2.0 },   /* p.151 — faders andam em rampa */
  meterPonto:"POST ON", /* PRE EQ | PRE FADER | POST ON (p.167) */
};
S.patch = patchPadrao();

/* --- monta os canais --- */
for (let i=1;i<=N_IN;i++)   S.canais["CH"+i]  = novoCanal("CH"+i,"in","ch "+i);
for (let i=1;i<=N_STIN;i++) S.canais["ST"+i]  = novoCanal("ST"+i,"stin","ST IN "+i);
for (let i=1;i<=N_MIX;i++)  S.canais["MIX"+i] = novoCanal("MIX"+i,"mix","MIX "+i);
for (let i=1;i<=N_MTX;i++)  S.canais["MTX"+i] = novoCanal("MTX"+i,"mtx","MATRIX "+i);
for (let i=1;i<=N_DCA;i++) S.canais["DCA"+i] = novoCanal("DCA"+i,"dca","DCA "+i);
S.canais["STEREO"] = novoCanal("STEREO","stereo","ST");
S.canais["MONO"]   = novoCanal("MONO","mono","MONO");

/* Ordem do dono: a mesa nasce com TODOS os faders embaixo (-∞).
   É também como se entrega uma console para o show: nada aberto. */
for (const c of Object.values(S.canais)) c.fader = -138;

/* ==================================================================
   PATCH — portas e ligação padrão, MEDIDOS no cap.9 (p.105-113)
   ==================================================================
   Patch PADRÃO de saída do M7CL-32/48, copiado da tabela da p.105:
     OMNI OUT 1-12 → MIX 1-12 · OMNI OUT 13/14 → MATRIX 1/2
     OMNI OUT 15/16 → STEREO L/R · 2TR OUT DIGITAL → STEREO L/R
     SLOT1 out 1-8 → MIX 1-8 · SLOT1 out 9-16 → MIX 1-8            */
const PORTAS_SAIDA = [
  ...Array.from({length:16},(_,i)=>"OMNI "+(i+1)),
  "2TR OUT D",
  ...Array.from({length:16},(_,i)=>"SLOT1-"+(i+1)),
  ...Array.from({length:8},(_,i)=>"RACK "+(i+1)+" IN"),
  "—",
];
const PORTAS_ENTRADA = [
  ...Array.from({length:N_IN},(_,i)=>"INPUT "+(i+1)),
  "2TR IN D","2TR IN A",
  ...Array.from({length:16},(_,i)=>"SLOT1-"+(i+1)),
  ...Array.from({length:8},(_,i)=>"RACK "+(i+1)+" OUT"),
  "—",
];
function patchPadrao(){
  const p = { entrada:{}, saida:{} };
  for (let i=1;i<=N_IN;i++)   p.entrada["CH"+i] = "INPUT "+i;      /* canal N ← jack N */
  for (let i=1;i<=N_STIN;i++) p.entrada["ST"+i] = i===1 ? "2TR IN D" : "—";
  for (let i=1;i<=12;i++)     p.saida["MIX"+i]  = "OMNI "+i;       /* p.105 */
  for (let i=13;i<=16;i++)    p.saida["MIX"+i]  = "—";
  p.saida["MTX1"] = "OMNI 13"; p.saida["MTX2"] = "OMNI 14";
  for (let i=3;i<=8;i++)      p.saida["MTX"+i]  = "—";
  p.saida["STEREO"] = "OMNI 15";                                   /* L/R em 15/16 */
  p.saida["MONO"]   = "—";
  return p;
}

/* funções que a Yamaha permite nas 12 USER DEFINED KEYS (apêndice p.280) */
/* Nomes exatos da tabela do manual: é INC RECALL / DEC RECALL, não
   "SCENE INC/DEC" -- e o nome importa porque descreve o que a tecla faz
   (ela CHAMA a cena, não só anda o número). */
const FUNCOES_UDK = [
  "INC RECALL","DEC RECALL","SCENE RECALL","TALKBACK ON","OSCILLATOR ON",
  "MONITOR DIMM","SENDS ON FADER","CUE CLEAR","METER PEAK HOLD","TAP TEMPO",
  "MUTE GROUP 1","MUTE GROUP 2","HELP","(sem atribuição)"
];
S.udk = ["DEC RECALL","INC RECALL","SCENE RECALL","TALKBACK ON",
         "OSCILLATOR ON","CUE CLEAR","SENDS ON FADER","MONITOR DIMM",
         "MUTE GROUP 1","MUTE GROUP 2","TAP TEMPO","HELP"];

/* 300 cenas -- a 000 é "Initial Data" e é read-only na mesa real.
   Ela PRECISA ter dados: é a cena que devolve a mesa ao estado de fábrica, e
   é o primeiro RECALL que todo operador dá ao assumir uma mesa que não conhece.
   Com dados:null o RECALL não fazia nada e o botão parecia morto.
   Preenchida logo abaixo, depois que os canais existem. */
S.cena.lista = [{n:0,nome:"Initial Data",bloq:true,dados:null}];

/* ---------- qual grupo a Centralogic está controlando ---------- */
const NAVS = [
  {id:"IN1-8",   rot:"1-8",     alvo:i=>"CH"+(1+i)},
  {id:"IN9-16",  rot:"9-16",    alvo:i=>"CH"+(9+i)},
  {id:"IN17-24", rot:"17-24",   alvo:i=>"CH"+(17+i)},
  {id:"IN25-32", rot:"25-32",   alvo:i=>"CH"+(25+i)},
  {id:"IN33-40", rot:"33-40",   alvo:i=>"CH"+(33+i)},
  {id:"IN41-48", rot:"41-48",   alvo:i=>"CH"+(41+i)},
  {id:"STIN",    rot:"ST IN",   alvo:i=>i<4?"ST"+(1+i):null},
  {id:"DCA",     rot:"DCA",     alvo:i=>"DCA"+(1+i)},
  {id:"MIX1-8",  rot:"MIX1-8",  alvo:i=>"MIX"+(1+i)},
  {id:"MIX9-16", rot:"MIX9-16", alvo:i=>"MIX"+(9+i)},
  {id:"MATRIX",  rot:"MATRIX",  alvo:i=>"MTX"+(1+i)},
  /* p.23: [STEREO] põe ST L/R + MONO nos módulos 1-3; 4-8 ficam sem uso */
  {id:"STEREO",  rot:"STEREO",  alvo:i=>i===0?"STEREO":i===1?"STEREO":i===2?"MONO":null},
];
const navPorId = id => NAVS.find(n=>n.id===id);
function grupoCentralogic(){
  const nv = navPorId(S.navFixa || S.nav) || NAVS[0];
  return Array.from({length:8}, (_,i)=>nv.alvo(i));
}
/* o OVERVIEW pode estar mostrando um grupo diferente do da Centralogic
   (p.98/104) -- por isso as duas leituras são separadas */
function grupoTela(){
  const nv = navPorId(S.nav) || NAVS[0];
  if (nv.id === "DCA") {           /* p.98: não existe OVERVIEW de DCA */
    const ant = navPorId(S.navAnterior || "IN1-8");
    return Array.from({length:8}, (_,i)=>ant.alvo(i));
  }
  return Array.from({length:8}, (_,i)=>nv.alvo(i));
}

/* ==================================================================
   ENCODERS MULTIFUNÇÃO — a TELA decide o que eles fazem
   ==================================================================
   Na M7CL os 8 encoders da Centralogic não têm função fixa: quem manda é a
   tela aberta. Na visão 8ch do EQ cada encoder mexe no MESMO parâmetro de um
   canal diferente; na tela SETUP os mesmos encoders viram SCREEN/PANEL/LAMP.
   É o que a Yamaha chama de multifunção -- 8 encoders para centenas de
   parâmetros.

   Cada tela REGISTRA seus alvos aqui, em ordem (posição 0 = encoder 1). */
S.encAlvos = [];
S.encRotulo = "";
function limparEncoders(){ S.encAlvos = []; S.encRotulo = ""; }
/* d = {ler, escrever, min, max, rot, log} */
function registrarEncoder(i, d){ S.encAlvos[i] = d; }

/* ---------- render coalescido por frame ----------
   (memória do projeto: repaint síncrono por pointermove travava o iPad) */
let sujo = false;
function pedirRender(){
  /* O ÁUDIO é aplicado JÁ, não no próximo frame: o desenho pode esperar o
     rAF, o som não. Com a aba sem foco o rAF congela, e o fader e o [ON]
     deixariam de ter efeito sonoro sem ninguém entender por quê. */
  if (typeof aplicarAudioAgora === "function") aplicarAudioAgora();
  if (sujo) return;
  sujo = true;
  requestAnimationFrame(()=>{ sujo = false; desenhar(); });
}

/* Atualizadores da barra de transporte. Declarado ANTES de montar(), que é
   quem cria a barra — ver a nota de TDZ em fazBarraTransporte(). */
const BARRAS = [];

/* ================= construção do DOM da mesa =================
   MEDIDAS DA PLANTA (p.17), caixa do painel = 1349 px de largura.
   Convertidas para o palco de 1920 px pelo fator 1920/1349 = 1,4233.
   Os dois andares usam os MESMOS x para os blocos de input -- é isso que
   mantém 41-48 (cima) e 33-40 (baixo) na mesma coluna, como na foto.    */
const F = 1920/1349;
const mm = px => Math.round(px * F);          /* planta -> palco */

/* Os x abaixo são as MOLDURAS do desenho, achadas por densidade de traço
   (colunas com preto em >80 % da altura), medidas separadamente no andar de
   cima e no de baixo. Correção importante da 2ª rodada: a 1ª versão media
   "colunas vazias", e o texto "Centralogic™" impresso no chassi partia o vão
   em dois -- daí a Centralogic ter saído 100 px larga demais e o vão estreito.
   Molduras COMUNS aos dois andares (a carcaça): 53 · 233 · 257 · 436 · 1135 · 1314 */
const MED = {
  x0:        mm(53),                 /*  75  borda até o 1º bloco de input     */
  bloco8:    mm(233-53),             /* 256  um grupo de 8 canais              */
  divisoria: mm(257-233),            /*  34  chassi entre os dois grupos de 8  */
  bloco8b:   mm(436-257),            /* 255  o segundo grupo de 8              */
  blocoDir:  mm(1314-1135),          /* 255  8 strips, à direita               */
  /* andar de cima */
  vaoCima:   mm(566-436),            /* 185  chassi antes do SELECTED CHANNEL  */
  selch:     mm(707-566),            /* 201  SELECTED CHANNEL — a moldura
                                             EXTERNA é 566; eu tinha pegado a
                                             linha interna (579) e perdido
                                             20 px de largura útil de knob    */
  vaoSel:    mm(715-707),            /*  11                                    */
  lcd:       mm(945-715),            /* 327  a TELA                            */
  placa:     mm(1036-945),           /* 130  YAMAHA / M7CL impressos           */
  vaoDir:    mm(1135-1036),          /* 141  chassi depois do display          */
  /* andar de baixo */
  vaoStin:   mm(454-436),            /*  26                                    */
  stin:      mm(570-454),            /* 165  4 strips ST IN                    */
  vaoCL:     mm(722-570),            /* 216  o vão com a marca Centralogic     */
  centralog: mm(902-722),            /* 256  8 strips -- MESMA largura dos de
                                             input (22,5 px na planta), não
                                             mais largos como eu tinha feito   */
  meio:      mm(1042-902),           /* 199  SCENE / UDK / NAV                 */
  master:    mm(1103-1042),          /*  87  STEREO + MONO                     */
  vaoMaster: mm(1135-1103),          /*  46                                    */
};
const vao = w => { const v = el("div","vao-chassi"); v.style.width = w+"px"; return v; };

/* O "bloco de 16" da esquerda são na verdade DOIS blocos de 8 com uma
   divisória de chassi no meio (planta: 36..234 | 234..256 | 256..445).
   Na foto isso é bem visível -- fazer um bloco único de 16 apagava a
   divisória e deixava a mesa com cara de painel corrido. */
function parDeBlocos(primeiro){
  const total = MED.bloco8 + MED.divisoria + MED.bloco8b;
  const w = el("div");
  w.style.cssText = "flex:0 0 auto;display:flex;gap:"+MED.divisoria+"px;width:"+total+"px";
  [[0,MED.bloco8],[8,MED.bloco8b]].forEach(([off,larg])=>{
    const b = fazBloco(Array.from({length:8},(_,i)=>{
      const n = primeiro + off + i;
      return fazStrip("CH"+n, String(n));
    }));
    b.style.width = larg+"px";
    w.appendChild(b);
  });
  return w;
}

const mesa = document.getElementById("mesa");

function fazTecla(cls, rotulo){
  const cel = el("div","udkcel");
  const b = el("button","tecla "+cls);
  b.type = "button";
  b.appendChild(el("i"));
  cel.appendChild(b);
  if (rotulo) cel.appendChild(el("small",null,rotulo));
  return {cel, b};
}

function fazMeterLed(){
  const m = el("div","meterled");
  LEDS_STRIP.forEach((_,i)=>{
    const b = el("b");
    if (i===0) b.classList.add("ov");        /* OVER: vermelho */
    else if (i===1) b.classList.add("am");   /* -6: âmbar */
    m.appendChild(b);
  });
  return m;
}

function fazFader(){
  const f = el("div","fader");
  f.appendChild(el("div","trilho"));
  const esc = el("div","escala");
  ESCALA_FADER.forEach(v=>{
    const p = dbParaPos(v===-Infinity?-138:v);
    const y = (1-p)*100;
    const t = el("span",null, v===-Infinity?"-∞":String(v));
    t.style.top = y+"%";
    const u = el("u"); u.style.top = y+"%";
    esc.appendChild(u); esc.appendChild(t);
  });
  f.appendChild(esc);
  f.appendChild(el("div","cursor"));
  return f;
}

/* um strip completo (input, ST IN, centralogic, master) */
function fazStrip(idCanal, rotuloTopo, opc){
  opc = opc || {};
  const s = el("div","strip"+(opc.classe ? " "+opc.classe : ""));
  s.dataset.canal = idCanal || "";

  /* Na Centralogic o strip começa DIRETO no encoder: não existe etiqueta de
     número no topo (o número fica só no rodapé) -- conferido na planta e na
     foto. Nos canais de input a etiqueta azul existe. */
  if (opc.encoder){
    const k = el("div","knob enc");
    k.dataset.papel = "enc";
    s.appendChild(k);
  } else {
    s.appendChild(el("div","num",rotuloTopo));
  }
  const sel = fazTecla("sel","SEL");  s.appendChild(sel.cel); sel.b.dataset.acao="sel";
  const cue = fazTecla("cue","CUE");  s.appendChild(cue.cel); cue.b.dataset.acao="cue";
  s.appendChild(fazMeterLed());
  const on  = fazTecla("on","ON");    s.appendChild(on.cel);  on.b.dataset.acao="on";
  /* ⛔ A Centralogic NÃO tem fita de nome — conferido na figura do manual
     (p.21): o strip tem encoder, [SEL], [CUE], LEDs, [ON], fader e o número
     1-8, e mais nada. É de propósito: como os 8 faders trocam de canal a cada
     nav key, uma fita escrita à mão mentiria. Na mesa real o único lugar que
     diz em que canal o fader está é a LINHA DE BAIXO DA TELA (p.99) — que é
     justamente por isso que ela existe. Eu tinha posto a fita aqui, e isso
     entregava de graça o que o operador aprende a ler na tela. */
  if (!opc.encoder){ const nm = el("div","nome"); s.appendChild(nm); }
  s.appendChild(fazFader());
  s.appendChild(el("div","num b",opc.rodape != null ? opc.rodape : rotuloTopo));
  return s;
}

/* ---- meter bridge MBM7CL (opcional no hardware; p.19)
   MIX 1-16 à esquerda, MATRIX 1-8 à direita. Escala MEDIDA:
   OVER,-3,-6,-9,-12,-15,-18,-24,-30,-40,-50,-60 ---- */
const ESCALA_BRIDGE = ["OVER","-3","-6","-9","-12","-15","-18","-24","-30","-40","-50","-60"];
function fazMeterBridge(){
  const mb = el("div","bridge");
  /* Estrutura MEDIDA no recorte ampliado da p.17: TRÊS grupos
     (MIX 1-8 | MIX 9-16 | MATRIX 1-8), e cada grupo tem a escala em dB
     serigrafada dos DOIS lados das colunas -- era o que faltava na minha
     versão, e é o que dá à bridge a cara de bridge. */
  const escala = () => {
    const e = el("div","besc");
    ESCALA_BRIDGE.forEach(v=>e.appendChild(el("span",null,v)));
    return e;
  };
  const faz = (rot, n, pref, base) => {
    base = base || 0;
    const g = el("div","bgrupo");
    const linha = el("div","blinha");
    linha.appendChild(escala());                 /* dB à esquerda */
    const cols = el("div","bcols");
    for (let i=0;i<n;i++){
      const c = el("div","bcol");
      c.dataset.canal = pref+(base+i+1);
      c.appendChild(el("span",null,String(base+i+1)));   /* número em cima */
      const leds = el("div","bleds");
      ESCALA_BRIDGE.forEach((_,j)=>{
        const b=el("b");
        if (j===0) b.classList.add("ov");            /* OVER */
        else if (j<=2) b.classList.add("am");        /* -3 / -6 */
        leds.appendChild(b);
      });
      c.appendChild(leds);
      cols.appendChild(c);
    }
    linha.appendChild(cols);
    linha.appendChild(escala());                 /* dB à direita */
    g.appendChild(linha);
    g.appendChild(el("div","brot",rot));
    return g;
  };
  mb.appendChild(faz("MIX", 8, "MIX", 0));
  mb.appendChild(faz("", 8, "MIX", 8));
  mb.appendChild(faz("MATRIX", N_MTX, "MTX", 0));
  /* Só a etiqueta técnica. O logo YAMAHA fica na placa ao lado da tela e
     aparece UMA vez na mesa -- eu tinha posto nos dois lugares e ficava
     duplicado. Conferido na planta (p.17) e nas fotos. */
  mb.appendChild(el("div","betiq","METER BRIDGE MBM7CL FOR M7CL"));
  return mb;
}

     SELECTED CHANNEL e da tela (é assim na foto real -- ela é bem mais
     larga que a tela sozinha), e embaixo ficam os dois lado a lado. */
  const centro = el("div","centro");
  /* trava a largura do centro no que foi medido: sem isso a meter bridge,
     que tem 24 colunas de LED, fica mais larga que o conjunto de baixo e

/* ===== barra de transporte — o padrão da frota (.smu do CL5) =====
   O play tem que estar SEMPRE à vista, fora da tela da mesa: foi o que o
   dono sentiu falta ("não tem o sistema de play que os outros simuladores
   têm"). Aqui ela também é usada dentro do overlay da tela ampliada. */
function fazBarraTransporte(){
  const b = el("div"); b.id = "smu";

  const play = el("button", null, "► Tocar base");
  play.type = "button";
  play.addEventListener("click", async ()=>{
    /* feedback SÍNCRONO antes de qualquer await: sem rede o fetch falha e o
       botão parecia morto (o portão acusou "sem reação"). */
    S.ajuda = AUD.base ? "…" : "Buscando as músicas do acervo…";
    pedirRender();
    if (!AUD.bases.length) await carregarCatalogo();
    if (!AUD.bases.length){
      S.ajuda = "Não consegui buscar as músicas — precisa de internet. "+
                "O resto da mesa funciona normalmente.";
      pedirRender(); return;
    }
    if (!AUD.base) await carregarBase(Number(sel.value)||0);
    if (AUD.tocando) pausarAudio(); else tocarAudio();
    play.textContent = AUD.tocando ? "❚❚ Pausar" : "► Tocar base";
  });

  const sel = el("select");
  sel.addEventListener("change", async ()=>{
    S.ajuda = "Trocando de música…";
    pedirRender();
    if (!AUD.bases.length){
      S.ajuda = "Lista de músicas ainda não carregou — aperte tocar para tentar de novo.";
      pedirRender(); return;
    }
    await carregarBase(Number(sel.value)||0);
    play.textContent = "► Tocar base";
  });

  const volta = el("button","sec","◀◀"); volta.type="button";
  volta.title = "Voltar ao começo";
  volta.addEventListener("click", ()=>{ voltarAudio(); play.textContent = "► Tocar base"; });

  const st = el("span","st","áudio: —");

  b.appendChild(play); b.appendChild(sel); b.appendChild(volta); b.appendChild(st);

  /* preenche o seletor quando o catálogo chega */
  const encher = ()=>{
    sel.innerHTML = "";
    if (!AUD.bases.length){
      const o = el("option",null,"(carregando músicas…)"); sel.appendChild(o); return;
    }
    AUD.bases.forEach((x,i)=>{
      const o = el("option", null, x.label+"  ·  "+x.stems.length+" faixas");
      o.value = String(i);
      sel.appendChild(o);
    });
  };
  encher();
  carregarCatalogo().then(encher);

  /* Atualiza por função própria, registrada em BARRAS, e NÃO por lig():
     lig() pertence ao render da tela e só é declarado bem depois; usá-lo aqui
     estourava TDZ ("Cannot access 'lig' before initialization") e matava o
     simulador inteiro em silêncio. */
  BARRAS.push(()=>{
    /* o catálogo chega por rede, depois da barra existir: se as músicas já
       vieram e o seletor ainda está com o texto de espera, enche agora */
    if (AUD.bases.length && sel.options.length !== AUD.bases.length) encher();
    st.innerHTML = AUD.carregando
      ? ("carregando <b>"+((AUD.baseAlvo&&AUD.baseAlvo.label)||"")+"</b>…")
      : AUD.base ? ("<b>"+AUD.base.label.split("—")[0].trim()+"</b> · "+
                    AUD.stems.length+" faixas · "+(AUD.tocando ? "tocando" : "parado"))
      : "escolha uma música e aperte tocar";
    if (!AUD.tocando && play.textContent.indexOf("❚❚") === 0) play.textContent = "► Tocar base";
    if (AUD.base){
      const i = AUD.bases.indexOf(AUD.base);
      if (i >= 0 && sel.value !== String(i)) sel.value = String(i);
    }
  });
  return b;
}
