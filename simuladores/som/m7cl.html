/* ---- USER DEFINED KEYS ---- */
function acaoUDK(i){
  const f = S.udk[i];
  flashUDK(i);            /* retorno visível mesmo nas funções sem estado */
  switch(f){
    /* INC/DEC avisam quando batem no fim, senão parecem mortos */
    case "SCENE INC": {
      if (S.cena.n >= 300){ S.ajuda = "Já está na última cena (300)"; break; }
      S.cena.n++; recallCena(); break;
    }
    case "SCENE DEC": {
      if (S.cena.n <= 0){ S.ajuda = "Já está na cena <b>000 Initial Data</b> — não há anterior"; break; }
      S.cena.n--; recallCena(); break;
    }
    case "SCENE RECALL": recallCena(); break;
    case "TALKBACK ON": S.talkback.on = !S.talkback.on;
      S.ajuda = "TALKBACK "+(S.talkback.on?"ligado":"desligado"); break;
    case "OSCILLATOR ON": S.osc.on = !S.osc.on;
      S.ajuda = "OSCILADOR "+(S.osc.on?"LIGADO — cuidado com o PA":"desligado"); break;
    case "MONITOR DIMM": S.monitor.dimm = !S.monitor.dimm;
      S.ajuda = "MONITOR DIMM "+(S.monitor.dimm?"ligado":"desligado"); break;
    case "SENDS ON FADER":
      S.sof = S.sof ? null : {tipo:"mix", n:0};
      S.ajuda = S.sof ? "<b>SENDS ON FADER</b> — os faders viram sends do MIX 1" : "Saiu do SENDS ON FADER";
      break;
    case "CUE CLEAR": {
      const n = Object.values(S.canais).filter(c=>c.cue).length;
      Object.values(S.canais).forEach(c=>c.cue=false);
      S.monitor.cueAtivo = false;
      /* avisa mesmo quando não havia nada em cue -- sem isso o botão
         parece morto para quem aperta */
      S.ajuda = n ? ("CUE limpo em "+n+" canal(is)")
                  : "CUE CLEAR — nenhum canal estava em cue";
      break;
    }
    case "MUTE GROUP 1":
    case "MUTE GROUP 2": {
      const n = +f.slice(-1);
      S.mg = S.mg || {};
      S.mg[n] = !S.mg[n];
      aplicarMuteGroup(n, S.mg[n]);
      break;
    }
    case "HELP": abrirPopup("HELP"); break;
    /* TAP TEMPO de verdade: mede o intervalo entre as batidas e ESCREVE o
       tempo nos racks de efeito. Antes só trocava a mensagem -- era o botão
       mais morto do painel, e o portão não pegava porque a mensagem mudava. */
    case "TAP TEMPO": {
      const agora = performance.now();
      S.tap = S.tap || { ultimo:0, batidas:[] };
      if (S.tap.ultimo && agora - S.tap.ultimo < 3000){
        S.tap.batidas.push(agora - S.tap.ultimo);
        if (S.tap.batidas.length > 4) S.tap.batidas.shift();   /* média das 4 últimas */
        const med = S.tap.batidas.reduce((a,b)=>a+b,0) / S.tap.batidas.length;
        const ms = Math.round(clamp(med, 20, 3000));
        let n = 0;
        S.rack.forEach(r=>{ if (r.tipo === "EFFECT"){ r.param.tempo = ms; n++; } });
        S.tapMs = ms;
        S.ajuda = "TAP TEMPO: <b>"+ms+" ms</b> ("+Math.round(60000/ms)+" BPM) — "+
                  "aplicado em "+n+" rack(s) de efeito";
      } else {
        S.tap.batidas = [];
        S.ajuda = "TAP TEMPO — bata de novo, no ritmo da música";
      }
      S.tap.ultimo = agora;
      break;
    }
    default:
      S.ajuda = "USER DEFINED KEY "+(i+1)+": <b>"+(f||"sem atribuição")+"</b>";
  }
  pedirRender();
}

/* ---- cenas ---- */
function recallCena(){
  const c = S.cena.lista.find(x=>x.n===S.cena.n);
  if (!c){ S.ajuda = "Cena <b>"+num3(S.cena.n)+"</b> está vazia — nada para chamar"; pedirRender(); return; }
  if (c.dados) aplicarCena(c.dados);
  S.cena.nome = c.nome;
  S.ajuda = "Cena <b>"+num3(c.n)+" "+c.nome+"</b> chamada — os faders andaram sozinhos";
  pedirRender();
}
function fotoDaMesa(){
  const f = {};
  for (const [id,c] of Object.entries(S.canais)){
    f[id] = { fader:c.fader, on:c.on, pan:c.pan, toSt:c.toSt, toMono:c.toMono,
      ha:{...c.ha}, hpf:{...c.hpf},
      eq:{on:c.eq.on,tipo:c.eq.tipo,att:c.eq.att,bandas:JSON.parse(JSON.stringify(c.eq.bandas))},
      dyn1:{...c.dyn1}, dyn2:{...c.dyn2},
      mix:c.mix.map(s=>({...s})), mtx:c.mtx.map(s=>({...s})),
      dca:[...c.dca], mute:[...c.mute], insert:c.insert, dout:c.dout, nome:c.nome };
  }
  return f;
}
function aplicarCena(f){
  for (const [id,v] of Object.entries(f)){
    const c = S.canais[id];
    if (!c || c.recallSafe) continue;      /* RECALL SAFE respeitado */
    /* FOCUS (p.147): a cena só mexe no que estiver ligado no FOCUS.
       Guardo o valor atual do que o focus proíbe e devolvo depois. */
    const guardado = {};
    if (S.focus.FADER === false) guardado.fader = c.fader;
    if (S.focus.ON    === false) guardado.on    = c.on;
    if (S.focus.EQ    === false) guardado.eq    = JSON.parse(JSON.stringify(c.eq));
    if (S.focus.HA    === false) guardado.ha    = {...c.ha};
    if (S.focus.PAN   === false) guardado.pan   = c.pan;
    Object.assign(c, {
      fader:v.fader, on:v.on, pan:v.pan, toSt:v.toSt, toMono:v.toMono,
      ha:{...v.ha}, hpf:{...v.hpf},
      eq:{on:v.eq.on,tipo:v.eq.tipo,att:v.eq.att,bandas:JSON.parse(JSON.stringify(v.eq.bandas))},
      dyn1:{...v.dyn1}, dyn2:{...v.dyn2},
      mix:v.mix.map(s=>({...s})), mtx:v.mtx.map(s=>({...s})),
      dca:[...v.dca], mute:[...v.mute], insert:v.insert, dout:v.dout, nome:v.nome
    });
    Object.assign(c, guardado);            /* devolve o que o FOCUS proibiu */
  }
}

/* MUTE GROUP com MUTE SAFE (p.126-129): o canal marcado como safe não
   obedece ao grupo -- é o que salva o microfone do padre quando alguém
   aperta o mute group errado no meio do show. */
function aplicarMuteGroup(n, ligado){
  let n_ = 0;
  for (const c of Object.values(S.canais)){
    if (!c.mute.includes(n)) continue;
    if (S.muteSafe[c.id]) continue;        /* protegido */
    c.on = !ligado; n_++;
  }
  S.ajuda = "MUTE GROUP "+n+" "+(ligado?"LIGADO":"desligado")+" — "+n_+" canais"+
            (Object.keys(S.muteSafe).filter(k=>S.muteSafe[k]).length
              ? " (os em MUTE SAFE não obedeceram)" : "");
  pedirRender();
}
function guardarCena(n, nome){
  if (n===0){ S.ajuda="A cena <b>000 Initial Data</b> é protegida na mesa real — escolha outro número"; return false; }
  const ja = S.cena.lista.findIndex(x=>x.n===n);
  const reg = {n, nome:nome||("SCENE "+num3(n)), bloq:false, dados:fotoDaMesa()};
  if (ja>=0) S.cena.lista[ja] = reg; else S.cena.lista.push(reg);
  S.cena.lista.sort((a,b)=>a.n-b.n);
  S.cena.n = n; S.cena.nome = reg.nome;
  S.ajuda = "Cena <b>"+num3(n)+" "+reg.nome+"</b> guardada";
  return true;
}

/* ---- meters: sinal fictício, só visual. NÃO gera áudio de propósito ---- */
let t0 = 0;
function tickMeters(ts){
  if (ts - t0 > 60){
    t0 = ts;
    /* Com música tocando, o meter mede o SINAL REAL de cada faixa.
       O metering point escolhe de qual analisador ler (p.167). */
    const comAudio = new Set();
    if (AUD.tocando){
      for (const s of AUD.stems){
        const c = S.canais[s.canal], n = s.nodes;
        if (!c || !n || !n.anaPos) continue;
        const ana = (S.meterPonto === "POST ON") ? n.anaPos : n.anaPre;
        ana.getByteTimeDomainData(n.buf);
        let pico = 0;
        for (let i=0;i<n.buf.length;i++){
          const v = Math.abs(n.buf[i] - 128) / 128;
          if (v > pico) pico = v;
        }
        /* ataque rápido, queda lenta -- é o que faz o LED ser legível */
        c.nivel = Math.max(pico, (c.nivel||0) * 0.82);
        comAudio.add(c.id);
      }
    }
    for (const c of Object.values(S.canais)){
      if (comAudio.has(c.id)) continue;          /* já medido no áudio real */
      if (c.tipo==="in" || c.tipo==="stin"){
        /* Sem música carregada o meter fica PARADO: um LED que mexe sem sinal
           é exatamente o "botão que finge" que o dono cobra. Só há animação
           quando o oscilador interno está ligado, que aí há sinal de verdade. */
        if (!S.osc.on){ c.nivel = 0; continue; }
        const base = clamp((c.ha.gain+62)/72, 0, 1);
        const vivo = base * (0.55 + 0.45*Math.sin(ts/300 + c.id.length*1.7 + (+c.id.replace(/\D/g,"")||0)));
        /* O METERING POINT muda de verdade o que o meter mostra (p.167):
           PRE EQ e PRE FADER ignoram o fader; só POST ON passa pelo fader
           e pela tecla [ON]. Sem isto o botão seria enfeite. */
        if (S.meterPonto === "PRE EQ" || S.meterPonto === "PRE FADER"){
          c.nivel = clamp(vivo, 0, 1);
        } else {
          c.nivel = c.on ? clamp(vivo*clamp(dbParaPos(c.fader)+0.15,0,1.2), 0, 1) : 0;
        }
      }
    }
    /* O master soma o que chega. Com áudio real o nível medido JÁ passou pelo
       fader (em POST ON), então não se multiplica por ele de novo -- isso
       elevava o sinal ao quadrado e o master ficava sempre baixo demais. */
    const entradas = Object.values(S.canais)
      .filter(c=>(c.tipo==="in"||c.tipo==="stin") && c.on && c.toSt);
    /* Sinais somam em POTÊNCIA, não em amplitude: raiz da soma dos quadrados.
       Somar amplitude direto e depois dividir por um número escolhido a dedo
       deixava o master sempre baixo demais e o meter apagado. */
    const soma = AUD.tocando
      ? Math.sqrt(entradas.reduce((a,c)=>a + c.nivel*c.nivel, 0))
      : Math.sqrt(entradas.reduce((a,c)=>{ const v=c.nivel*dbParaPos(c.fader); return a+v*v; },0));
    const st = S.canais.STEREO;
    const fdSt = st.fader <= -138 ? 0 : Math.pow(10, st.fader/20);
    st.nivel = clamp(soma * fdSt * (st.on?1:0), 0, 1);
    S.canais.MONO.nivel = S.canais.MONO.on ? st.nivel*0.8 : 0;

    /* Os buses MIX e MATRIX medem o que os canais MANDAM para eles.
       Sem isto a meter bridge ficava sempre apagada, mesmo com o aluno
       abrindo mandada -- e é justamente nela que se confere o monitor. */
    const somaBus = (arrNome, idx) => {
      let p = 0;
      for (const c of entradas){
        const s = c[arrNome] && c[arrNome][idx];
        if (!s || !s.on || s.lvl <= -138) continue;
        const v = c.nivel * Math.pow(10, s.lvl/20);
        p += v*v;
      }
      return Math.sqrt(p);
    };
    for (let i=0;i<N_MIX;i++){
      const m = S.canais["MIX"+(i+1)];
      const fd = m.fader <= -138 ? 0 : Math.pow(10, m.fader/20);
      m.nivel = clamp(somaBus("mix", i) * fd * (m.on?1:0), 0, 1);
    }
    for (let i=0;i<N_MTX;i++){
      const m = S.canais["MTX"+(i+1)];
      const fd = m.fader <= -138 ? 0 : Math.pow(10, m.fader/20);
      m.nivel = clamp(somaBus("mtx", i) * fd * (m.on?1:0), 0, 1);
    }
    pedirRender();
  }
  requestAnimationFrame(tickMeters);
}
requestAnimationFrame(tickMeters);

/* ==================================================================
   TELA TOUCH
   Estrutura só é recriada quando muda a "chave estrutural". Os valores
   que mudam a todo frame (meters, ângulos, dB) são atualizados por
   ligações registradas na construção -- sem recriar nó nenhum.
   ================================================================== */
let LIGACOES = [];
const lig = fn => { LIGACOES.push(fn); fn(); };
let telaChave = null;

function desenharTela(){
  const chave = [S.tela, S.popup, S.sel, S.nav, S.navFixa, S.sendDest,
                 S.sof?S.sof.tipo+S.sof.n:"-", S.cena.n, S.cena.lista.length].join("|");
  if (chave !== telaChave){ telaChave = chave; construirTela(); }
  for (const f of LIGACOES) f();
}

function construirTela(){
  LIGACOES = [];
  const area = document.getElementById("area");
  const fac  = document.getElementById("fac");
  if (!area || !fac) return;

  if (S.popup) TELAS_POPUP[S.popup] ? TELAS_POPUP[S.popup](area) : area.appendChild(el("div",null,"?"));
  else (TELAS[S.tela] || TELAS.OVERVIEW)(area);
}

/* ---------- function access area (p.32) ---------- */
function construirFAC(fac){
  const c = S.canais[S.sel];

  const sc = el("div","selcanal");
  sc.appendChild(el("b",null, c ? rotuloCurto(c) : "--"));
  sc.appendChild(el("span",null, c ? c.nome : ""));
  sc.title = "Aperte a metade esquerda para o canal anterior, a direita para o próximo (igual à mesa real)";
  sc.addEventListener("pointerdown", ev=>{
    const r = sc.getBoundingClientRect();
    pularCanal(ev.clientX < r.left + r.width/2 ? -1 : 1);
  });
  fac.appendChild(sc);

  const rel = el("div","relogio","--:--:--");
  lig(()=>{ const d = new Date();
    rel.textContent = [d.getHours(),d.getMinutes(),d.getSeconds()]
      .map(x=>String(x).padStart(2,"0")).join(":"); });
  fac.appendChild(rel);
  fac.appendChild(el("div","relogio", S.usuario));

  const botao = (rot, alvo, dica) => {
    const b = el("div","bt",rot);
    b.title = dica || "";
    b.classList.toggle("ativo",
      (alvo==="SOF" && !!S.sof) || S.tela===alvo || S.popup===alvo);
    b.addEventListener("pointerdown", ()=>{
      if (alvo==="SOF"){
        S.sof = S.sof ? null : {tipo:"mix", n:0};
        S.ajuda = S.sof
          ? "<b>SENDS ON FADER</b> — escolha o bus na tela; os faders de input viram os sends"
          : "Saiu do SENDS ON FADER";
        if (S.sof) S.tela = "SOF";
      }
      else if (alvo==="CHJOB") abrirPopup("CHJOB");
      else if (alvo==="RACK") abrirPopup("RACK");
      else if (alvo==="MONITOR") abrirPopup("MONITOR");
      else if (alvo==="SETUP") abrirPopup("SETUP");
      else if (alvo==="METER"){ S.popup=null; S.tela="METER"; }
      pedirRender();
    });
    return b;
  };
  /* MIX (músicas) e MINHAS CENAS: o que o aluno mais usa nesta aula */
  const linhaAluno = el("div"); linhaAluno.style.cssText="display:flex;gap:2px";
  const bMix = el("div","bt","MIX"); bMix.style.flex="1";
  bMix.title = "Escolher a música multitrack e o transporte";
  bMix.classList.toggle("ativo", S.tela==="MIX");
  bMix.addEventListener("pointerdown",()=>{ S.popup=null; S.tela="MIX"; pedirRender(); });
  const bCen = el("div","bt","CENAS"); bCen.style.flex="1";
  bCen.title = "Guardar/chamar cenas na sua conta";
  bCen.addEventListener("pointerdown",()=>{ abrirPopup("NUVEM"); pedirRender(); });
  linhaAluno.appendChild(bMix); linhaAluno.appendChild(bCen);
  fac.appendChild(linhaAluno);

  fac.appendChild(botao("SENDS ON FADER","SOF","Os faders passam a controlar as mandadas para o bus escolhido"));
  fac.appendChild(botao("CH JOB","CHJOB","Copiar, mover e inicializar canal"));
  const linha = el("div"); linha.style.cssText="display:flex;gap:3px";
  const bR = botao("RACK","RACK","GEQ e efeitos (racks 1-8)"); bR.style.flex="1";
  const bM = botao("MONITOR","MONITOR","Monitor, cue, oscilador e talkback"); bM.style.flex="1";
  linha.appendChild(bR); linha.appendChild(bM);
  fac.appendChild(linha);

  /* meter L R M da function access area */
  const mt = el("div"); mt.id="facmeter";
  mt.appendChild(el("div","rot","METER"));
  const barras = el("div","barras");
  const bs = ["L","R","M"].map(()=>{ const i = el("i"); const b = el("b"); i.appendChild(b); barras.appendChild(i); return b; });
  mt.appendChild(barras);
  mt.appendChild(el("div","rot","L   R   M"));
  lig(()=>{
    const st = S.canais.STEREO, mo = S.canais.MONO;
    const v = [st.nivel, st.nivel*0.94, mo.nivel];
    bs.forEach((b,i)=>b.style.height = (v[i]*100).toFixed(1)+"%");
  });
  mt.style.cursor="pointer";
  mt.addEventListener("pointerdown", ()=>{ S.popup=null; S.tela="METER"; pedirRender(); });
  fac.appendChild(mt);

  fac.appendChild(botao("SETUP","SETUP","Ajustes gerais, usuário e user defined keys"));

  const cen = el("div","cena");
  cen.appendChild(el("u",null,"SCENE"));
  cen.appendChild(el("b",null,num3(S.cena.n)));
  cen.appendChild(el("span",null,S.cena.nome));
  cen.addEventListener("pointerdown", ()=>{ abrirPopup("SCENE"); pedirRender(); });
  fac.appendChild(cen);
}
function rotuloCurto(c){
  if (c.tipo==="in") return "CH"+c.id.slice(2);
  if (c.tipo==="stin") return "ST IN"+c.id.slice(2);
  if (c.tipo==="mix") return "MIX"+c.id.slice(3);
  if (c.tipo==="mtx") return "MTX"+c.id.slice(3);
  if (c.tipo==="dca") return "DCA"+c.id.slice(3);
  return c.id;
}
function pularCanal(d){
  const ordem = [];
  for (let i=1;i<=N_IN;i++) ordem.push("CH"+i);

/* curva de EQ em SVG (4 bandas + HPF), MEDIDA: F 20-20k, G ±18, Q .1-10 */
function curvaEQ(c, w, h){
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  svg.style.cssText = "width:100%;height:"+h+"px;background:#15171a;border-radius:1px;display:block";
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("fill","none");
  path.setAttribute("stroke","var(--tela-verde)");
  path.setAttribute("stroke-width","1.2");
  const zero = document.createElementNS("http://www.w3.org/2000/svg","line");
  zero.setAttribute("x1","0"); zero.setAttribute("x2",String(w));
  zero.setAttribute("y1",String(h/2)); zero.setAttribute("y2",String(h/2));
  zero.setAttribute("stroke","#3a3d42"); zero.setAttribute("stroke-width","0.5");
  svg.appendChild(zero); svg.appendChild(path);
  lig(()=>{
    const pts = [];
    for (let x=0;x<=w;x+=2){
      const f = Math.pow(10, Math.log10(20) + (x/w)*(Math.log10(20000)-Math.log10(20)));
      let db = 0;
      if (c.eq.on){
        for (const b of Object.values(c.eq.bandas)) db += ganhoPico(f, b.f, b.g, b.q);
      }
      if (c.hpf.on) db += ganhoHPF(f, c.hpf.freq);
      pts.push(x.toFixed(0)+","+(h/2 - clamp(db,-20,20)*(h/2)/20).toFixed(1));
    }
    path.setAttribute("d","M"+pts.join("L"));
  });
  return svg;
}
/* resposta aproximada de um peaking bell -- suficiente para a tela,
   é o mesmo desenho indicativo que a mesa mostra ("approximate EQ response", p.99) */
function ganhoPico(f, f0, g, q){
  if (!g) return 0;
  const x = Math.log2(f/f0);
  return g * Math.exp(-(x*x)*(q*q)*1.4);
}
/* HPF -12 dB/oct (MEDIDO no manual: 20-600 Hz, -12 dB/oct) */
function ganhoHPF(f, fc){
  if (f >= fc) return 0;
  return Math.max(-24, 12*Math.log2(f/fc));
}

/* knob com rótulo e valor, arrastável, que escreve direto no estado */
function knobTela(rot, ler, escrever, min, max, fmt, opc){
  opc = opc || {};
  const cel = el("div");
  cel.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:1px;min-width:34px";
  if (rot) { const r = el("div",null,rot); r.style.cssText="font-size:7.5px;color:#aeb4bb"; cel.appendChild(r); }
  /* opc.cor = classe k-* da paleta oficial (ver .kt no CSS) */
  const k = el("div", opc.cor ? ("kt "+opc.cor) : ("knob"+(opc.mini?" mini":"")));
  if (opc.cor && opc.mini) k.style.setProperty("--kt","19px");
  const v = el("div"); v.style.cssText="font-size:8px;color:var(--tela-texto)";
  cel.appendChild(k); cel.appendChild(v);
  k.style.touchAction = "none";
  let base = null, y0 = 0;
  k.addEventListener("pointerdown", ev=>{
    ev.stopPropagation(); ev.preventDefault();
    base = ler(); y0 = ev.clientY;
    try{ k.setPointerCapture(ev.pointerId); }catch(e){}
  });
  k.addEventListener("pointermove", ev=>{
    if (base === null) return;
    const d = (y0 - ev.clientY)/140;
    escrever(clamp(base + d*(max-min), min, max));
    pedirRender();
  });
  const solta = ()=>{ base = null; };
  k.addEventListener("pointerup", solta);
  k.addEventListener("pointercancel", solta);
  lig(()=>{
    const val = ler();
    k.style.setProperty("--ang", anguloDe(val,min,max)+"deg");
    v.textContent = fmt ? fmt(val) : val.toFixed(1);
  });
  return cel;
}

  const b = el("button","tbt"+(opc.laranja?" laranja":""), rot);

  b.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); alternar(); pedirRender(); });
  lig(()=>b.classList.toggle("on", !!ler()));

}

/* ==================================================================
   DYNAMICS — tudo MEDIDO no apêndice "Dynamics Parameters" (p.249-251)
   ==================================================================
   O manual é explícito: a lista de tipos MUDA conforme o canal.
     entrada, DYN1 : GATE · DUCKING · COMPRESSOR · EXPANDER
     entrada, DYN2 : COMPRESSOR · COMPANDER-H · COMPANDER-S · DE-ESSER
     SAÍDA,   DYN1 : COMPRESSOR · EXPANDER · COMPANDER-H · COMPANDER-S
   (canal de saída não tem DYN2). Eu usava a lista de entrada em tudo. */
const TIPOS_DYN1     = ["GATE","DUCKING","COMPRESSOR","EXPANDER"];
const TIPOS_DYN2     = ["COMPRESSOR","COMPANDER-H","COMPANDER-S","DE-ESSER"];
const TIPOS_DYN1_OUT = ["COMPRESSOR","EXPANDER","COMPANDER-H","COMPANDER-S"];
const tiposDyn = (c, qual) =>
  qual === "dyn2" ? TIPOS_DYN2 : (ehSaida(c) ? TIPOS_DYN1_OUT : TIPOS_DYN1);

/* RATIO não é contínuo: são 16 pontos fixos (p.249). O operador gira e o
   valor PULA entre eles -- um knob contínuo de 1 a 20 seria mentira. */
const RATIOS = [1.0,1.1,1.3,1.5,1.7,2.0,2.5,3.0,3.5,4.0,5.0,6.0,8.0,10,20,Infinity];
const fmtRatio = v => (v===Infinity?"∞":v>=10?String(v):v.toFixed(1))+":1";

/* Qual parâmetro cada tipo mostra, e com que faixa. Sai direto das tabelas
   do manual: THRESHOLD do GATE vai a -72, dos outros a -54; OUT GAIN é
   0..+18 no compressor e -18..0 no compander. */
function paramsDyn(tipo){
  const T72 = {campo:"thr",  rot:"THRESHOLD", min:-72, max:0,   fmt:v=>v.toFixed(0)+" dB"};
  const T54 = {campo:"thr",  rot:"THRESHOLD", min:-54, max:0,   fmt:v=>v.toFixed(0)+" dB"};
  const ATK = {campo:"attack",rot:"ATTACK",   min:0,   max:120, fmt:v=>v.toFixed(0)+" ms"};
  const HLD = {campo:"hold", rot:"HOLD",  min:0.02, max:1.96, log:true, fmt:v=>v<1?(v*1000).toFixed(0)+" ms":v.toFixed(2)+" s"};
  const DEC = {campo:"decay",rot:"DECAY", min:0.005,max:42.3, log:true, fmt:v=>v<1?(v*1000).toFixed(0)+" ms":v.toFixed(2)+" s"};
  const REL = {campo:"release",rot:"RELEASE",min:0.005,max:42.3,log:true, fmt:v=>v<1?(v*1000).toFixed(0)+" ms":v.toFixed(2)+" s"};
  const RAT = {campo:"ratio",rot:"RATIO", lista:RATIOS, fmt:fmtRatio};
  const KNE = {campo:"knee", rot:"KNEE",  min:0, max:5, passo:1, fmt:v=>v<1?"HARD":v.toFixed(0)};
  const OUTp= {campo:"out",  rot:"OUT GAIN", min:0,  max:18, fmt:v=>"+"+v.toFixed(1)+" dB"};
  const OUTn= {campo:"out",  rot:"OUT GAIN", min:-18,max:0,  fmt:v=>v.toFixed(1)+" dB"};
  const RNG69={campo:"range",rot:"RANGE", min:-69,max:0, fmt:v=>v<=-69?"-∞":v.toFixed(0)+" dB"};
  const RNG70={campo:"range",rot:"RANGE", min:-70,max:0, fmt:v=>v.toFixed(0)+" dB"};
  const WID = {campo:"width",rot:"WIDTH", min:1,  max:90, fmt:v=>v.toFixed(0)+" dB"};
  const FRQ = {campo:"freq", rot:"FREQUENCY", min:1000, max:12500, log:true,
               fmt:v=>(v/1000).toFixed(2)+" kHz"};
  switch(tipo){
    case "GATE":        return [T72, RNG69, ATK, HLD, DEC];
    case "DUCKING":     return [T54, RNG70, ATK, HLD, DEC];
    case "COMPRESSOR":  return [T54, RAT, ATK, REL, KNE, OUTp];
    case "EXPANDER":    return [T54, RAT, ATK, REL, KNE, OUTp];
    case "COMPANDER-H":
    case "COMPANDER-S": return [T54, RAT, ATK, REL, WID, OUTn];
    case "DE-ESSER":    return [T54, FRQ];
    default:            return [T54];
  }
}
function popupDyn(area, qual){
  const c = S.canais[S.sel];
  const d = c[qual];
  const tipos = tiposDyn(c, qual);
  const b = molde(area, qual==="dyn1"?"DYNAMICS 1":"DYNAMICS 2", c.nome);

  /* canal de saída não tem DYNAMICS 2 (p.249) */
  if (qual==="dyn2" && ehSaida(c)){
    const av = el("div",null,"Canal de saída não tem DYNAMICS 2 — só a seção 1.");
    av.style.cssText="font-size:11px;color:#ffd45e";
    b.appendChild(av);
    return;
  }

  const lt = linhaTela();
  tipos.forEach(t=>{
    lt.appendChild(btTela(t, ()=>d.tipo===t, ()=>{ d.tipo=t;
      S.ajuda = "DYN "+(qual==="dyn1"?"1":"2")+" agora é <b>"+t+"</b>"; }));
  });
  lt.appendChild(btTela("ON", ()=>d.on, ()=>d.on=!d.on));
  b.appendChild(lt);

  /* os controles saem da TABELA do manual: cada tipo mostra os seus,
     com a sua faixa. Antes eu tinha 5 knobs fixos para DYN1 e 5 para DYN2,
     o que dava parâmetro errado (e faixa errada) em metade dos tipos. */
  const l = linhaTela();
  l.style.marginTop = "5px";
  paramsDyn(d.tipo).forEach(p=>{
    if (p.lista){                       /* RATIO: 16 pontos discretos */
      const idx = () => { const i = p.lista.indexOf(d[p.campo]);
        return i<0 ? p.lista.findIndex(x=>x>=d[p.campo]) : i; };
      l.appendChild(knobTela(p.rot,
        ()=>Math.max(0,idx()),
        v=>{ d[p.campo] = p.lista[clamp(Math.round(v),0,p.lista.length-1)]; },
        0, p.lista.length-1,
        v=>p.fmt(p.lista[clamp(Math.round(v),0,p.lista.length-1)])));
    } else if (p.log){                  /* tempos e frequência: escala log */
      l.appendChild(knobTela(p.rot,
        ()=>Math.log10(d[p.campo]||p.min),
        v=>{ d[p.campo] = Math.pow(10,v); },
        Math.log10(p.min), Math.log10(p.max),
        v=>p.fmt(Math.pow(10,v))));
    } else {
      l.appendChild(knobTela(p.rot, ()=>d[p.campo],
        v=>{ d[p.campo] = p.passo ? Math.round(v) : v; },
        p.min, p.max, p.fmt));
    }
  });
  b.appendChild(l);

  /* curva de transferência: mostra o que o compressor/gate faz de verdade */
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 120 120");
  svg.style.cssText="width:180px;height:180px;background:#15171a;border-radius:2px;margin-top:5px";
  const eixo = document.createElementNS("http://www.w3.org/2000/svg","path");
  eixo.setAttribute("d","M0,120 L120,0"); eixo.setAttribute("stroke","#3a3d42");
  eixo.setAttribute("stroke-width","0.7"); eixo.setAttribute("fill","none");
  const curva = document.createElementNS("http://www.w3.org/2000/svg","path");
  curva.setAttribute("stroke","var(--tela-verde)"); curva.setAttribute("stroke-width","1.6");
  curva.setAttribute("fill","none");
  svg.appendChild(eixo); svg.appendChild(curva);
  lig(()=>{
    const pts = [];
    for (let i=0;i<=60;i++){
      const inDb = -60 + i;                       /* -60..0 dB */
      let outDb = inDb;
      if (d.on){
        if (qual==="dyn1"){
          if (d.tipo==="GATE" || d.tipo==="DUCKING"){
            if (inDb < d.thr) outDb = inDb + (d.range||-70)*(d.tipo==="GATE"?1:0);
          } else if (inDb > d.thr){
            outDb = d.thr + (inDb - d.thr)/2;
          }
        } else {
          if (inDb > d.thr) outDb = d.thr + (inDb - d.thr)/Math.max(1,d.ratio);
          outDb += d.out || 0;
        }
      }
      const x = ((inDb+60)/60)*120;
      const y = 120 - clamp((outDb+60)/60,0,1.2)*120;
      pts.push(x.toFixed(1)+","+y.toFixed(1));
    }
    curva.setAttribute("d","M"+pts.join("L"));
  });
  b.appendChild(svg);
  const nota = el("div");
  nota.style.cssText="font-size:9px;color:#9aa0a8;margin-top:3px;line-height:1.4";
  lig(()=>{
    const p = paramsDyn(d.tipo);
    nota.innerHTML = "<b>"+d.tipo+"</b> — "+p.map(x=>x.rot).join(" · ")+
      "<br>Tipos deste canal: "+tipos.join(" · ")+
      (ehSaida(c) ? " (lista de canal de SAÍDA)" : "");
  });
  b.appendChild(nota);
}

  nomeCx.appendChild(linha1); nomeCx.appendChild(campo);
  ico.addEventListener("pointerdown",()=>{ S.pnAba="ICON"; pedirRender(); });
  topo.appendChild(porta); topo.appendChild(ico); topo.appendChild(nomeCx);
  b.appendChild(topo);

  /* corpo conforme a aba */
  const corpo = el("div");

  if (S.pnAba === "NAME"){
    const escreve = t => {
      if (t==="BS")        c.nome = c.nome.slice(0,-1);
      else if (t==="CLEAR")c.nome = "";
      else if (t==="SPACE")c.nome = (c.nome+" ").slice(0,8);
      else if (t==="SHIFT LOCK") S.pnShift = !S.pnShift;
      else if (t==="ENTER"){ fecharPopup(); }
      else if (t.length===1) c.nome = (c.nome + (S.pnShift?t.toUpperCase():t)).slice(0,8);
      S.ajuda = "Nome do canal: <b>"+c.nome+"</b> (até 8 caracteres, como na fita)";
      pedirRender();
    };
    const fx = linhaTela();
    ["CLEAR","BS","SPACE"].forEach(t=>{
      const bt = el("button","tbt",t); bt.type="button";
      bt.addEventListener("pointerdown",()=>escreve(t));
      fx.appendChild(bt);
    });
    corpo.appendChild(fx);
    TECLADO.forEach(linha=>{
      const l = el("div");
      l.style.cssText="display:flex;gap:2px;margin-top:2px;justify-content:center";
      linha.forEach(t=>{
        const bt = el("button","tbt", t.length===1&&S.pnShift ? t.toUpperCase() : t);
        bt.type="button";

                                      : "font-size:10px;padding:3px 6px;min-width:18px";

        bt.addEventListener("pointerdown",()=>escreve(t));
        l.appendChild(bt);

  else if (S.pnAba === "ICON"){
    const g = el("div");
    g.style.cssText="display:grid;grid-template-columns:repeat(6,1fr);gap:3px";
    ICONES.forEach(([nome,em])=>{
      const bt = el("button","tbt", em+" "+nome);
      bt.type="button"; bt.style.cssText="font-size:9px;padding:4px 2px";
      if (c.icone === nome) bt.classList.add("on");
      bt.addEventListener("pointerdown",()=>{ c.icone = nome;
        S.ajuda = "Ícone de <b>"+c.nome+"</b>: "+nome; pedirRender(); });
      g.appendChild(bt);
    });
    corpo.appendChild(g);
  }
  else {
    const portas = (c.tipo==="in"||c.tipo==="stin") ? PORTAS_ENTRADA : PORTAS_SAIDA;
    const mapa   = (c.tipo==="in"||c.tipo==="stin") ? S.patch.entrada : S.patch.saida;
    const g = el("div");
    g.style.cssText="display:grid;grid-template-columns:repeat(6,1fr);gap:2px";
    portas.forEach(p=>{
      const bt = el("button","tbt", p); bt.type="button";
      bt.style.cssText="font-size:8.5px;padding:3px 2px";

      bt.addEventListener("pointerdown",()=>{ mapa[c.id] = p;
        S.ajuda = "<b>"+c.nome+"</b> ligado em "+p; pedirRender(); });
      g.appendChild(bt);
    });
    corpo.appendChild(g);
  }
  b.appendChild(corpo);

  /* abas embaixo, como na figura */
  const abas = el("div");
  abas.style.cssText="display:flex;gap:3px;margin-top:5px";
  ["PATCH","ICON","NAME"].forEach(a=>{
    const bt = btTela(a, ()=>S.pnAba===a, ()=>S.pnAba=a);
    bt.style.cssText="font-size:10px;padding:3px 12px";
    abas.appendChild(bt);
  });

};

/* ---- SCENE (300 cenas, p.135) ---- */
TELAS_POPUP.SCENE = function(area){
  const b = molde(area,"SCENE MEMORY","300 cenas · a 000 é protegida");
  const l = el("div"); l.style.cssText="display:flex;gap:6px;height:100%;min-height:0";

  const lista = el("div");
  lista.style.cssText="flex:1 1 auto;min-width:0;overflow:auto;background:#1a1c1f;border-radius:2px;padding:2px";
  for (let n=0;n<=24;n++){
    const reg = S.cena.lista.find(x=>x.n===n);
    const li = el("div");
    li.style.cssText="display:flex;gap:6px;font-size:10px;padding:2px 4px;border-radius:2px;cursor:pointer;"+
      (n===S.cena.n ? "background:var(--tela-azul);" : "");
    li.appendChild(el("span",null,num3(n)));
    const nm = el("span",null, reg ? reg.nome : "— vazia —");
    nm.style.color = reg ? "var(--tela-texto)" : "#6d7278";
    li.appendChild(nm);
    if (reg && reg.bloq){ const c = el("span",null,"🔒"); c.style.marginLeft="auto"; li.appendChild(c); }
    li.addEventListener("pointerdown",()=>{ S.cena.n = n;
      S.ajuda = "Cena "+num3(n)+" selecionada — RECALL para chamar, STORE para guardar"; pedirRender(); });
    lista.appendChild(li);
  }
  l.appendChild(lista);

  const bts = el("div"); bts.style.cssText="display:flex;flex-direction:column;gap:4px;width:120px";
  const bR = el("button","tbt","RECALL"); bR.type="button";
  bR.addEventListener("pointerdown",()=>{ recallCena(); });
  const bS = el("button","tbt","STORE"); bS.type="button";
  bS.addEventListener("pointerdown",()=>{ abrirPopup("SCENE_STORE"); pedirRender(); });
  const bC = el("button","tbt","CLEAR"); bC.type="button";
  bC.addEventListener("pointerdown",()=>{
    if (S.cena.n===0){ S.ajuda="A cena 000 é protegida"; pedirRender(); return; }
    S.cena.lista = S.cena.lista.filter(x=>x.n!==S.cena.n);
    S.ajuda="Cena "+num3(S.cena.n)+" apagada"; pedirRender();
  });
  bts.appendChild(bR); bts.appendChild(bS); bts.appendChild(bC);

  /* edição de cenas (p.140-145): copiar, colar, cortar, inserir, renomear */
  const acao = (rot, fn) => { const x = el("button","tbt",rot); x.type="button";
    x.addEventListener("pointerdown",()=>{ fn(); pedirRender(); }); bts.appendChild(x); };
  acao("COPY", ()=>{
    const r = S.cena.lista.find(x=>x.n===S.cena.n);
    if (!r){ S.ajuda="Cena vazia — nada a copiar"; return; }
    S.cenaCopia = JSON.parse(JSON.stringify(r));
    S.ajuda = "Cena "+num3(r.n)+" copiada";
  });
  acao("PASTE", ()=>{
    if (!S.cenaCopia){ S.ajuda="Nada copiado ainda"; return; }
    if (S.cena.n===0){ S.ajuda="A cena 000 é protegida"; return; }
    const nova = JSON.parse(JSON.stringify(S.cenaCopia));
    nova.n = S.cena.n;
    S.cena.lista = S.cena.lista.filter(x=>x.n!==S.cena.n).concat(nova).sort((a,b)=>a.n-b.n);
    S.ajuda = "Colado na cena "+num3(S.cena.n);
  });
  acao("CUT", ()=>{
    const r = S.cena.lista.find(x=>x.n===S.cena.n);
    if (!r || r.bloq){ S.ajuda="Cena vazia ou protegida"; return; }
    S.cenaCopia = JSON.parse(JSON.stringify(r));
    S.cena.lista = S.cena.lista.filter(x=>x.n!==S.cena.n);
    S.ajuda = "Cena "+num3(r.n)+" recortada";
  });
  acao("INSERT", ()=>{
    /* empurra as cenas seguintes um número para baixo, como na mesa */
    S.cena.lista.forEach(x=>{ if (x.n >= S.cena.n && x.n>0) x.n++; });
    if (S.cenaCopia){
      const nova = JSON.parse(JSON.stringify(S.cenaCopia)); nova.n = S.cena.n;
      S.cena.lista.push(nova);
    }
    S.cena.lista.sort((a,b)=>a.n-b.n);
    S.ajuda = "Inserido em "+num3(S.cena.n)+" — as seguintes andaram um número";
  });
  acao("RENAME", ()=>{
    const r = S.cena.lista.find(x=>x.n===S.cena.n);
    if (!r || r.bloq){ S.ajuda="Cena vazia ou protegida"; return; }
    S.renomeando = r; abrirPopup("SCENE_STORE");
  });
  const nota = el("div",null,
    "Na mesa real o recall move os faders motorizados. Canais com RECALL SAFE ligado não mudam.");
  nota.style.cssText="font-size:9px;color:#9aa0a8;line-height:1.35";
  bts.appendChild(nota);
  l.appendChild(bts);
  b.appendChild(l);
};

/* ---- RACK: GEQ 31 bandas + efeitos (p.171) ---- */
S.rack = Array.from({length:8},(_,i)=>({
  n:i+1,
  tipo: i<4 ? "GEQ" : "EFFECT",
  geq: new Array(31).fill(0),
  efeito: "REV-X HALL",
  param:{ tempo:500, mix:35 }
}));
const FREQ_GEQ = [20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,
                  1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
/* Os 41 tipos oficiais, copiados do apêndice "Effect Type List" (p.252).
   A 1ª versão tinha 13 nomes aproximados ("EQ601", "OPEN DECK") que não
   existem escritos assim na mesa. */
const EFEITOS = [
  "REVERB HALL","REVERB ROOM","REVERB STAGE","REVERB PLATE","EARLY REF.",
  "GATE REVERB","REVERSE GATE","MONO DELAY","STEREO DELAY","MOD.DELAY",
  "DELAY LCR","ECHO","CHORUS","FLANGE","SYMPHONIC","PHASER","AUTO PAN",
  "TREMOLO","HQ.PITCH","DUAL PITCH","ROTARY","RING MOD.","MOD.FILTER",
  "DISTORTION","AMP SIMULATE","DYNA.FILTER","DYNA.FLANGE","DYNA.PHASER",
  "MULTI FILTER","FREEZE","ST REVERB","M.BAND COMP",
  "REV-X HALL","REV-X ROOM","REV-X PLATE",
  "COMP276","COMP276S","COMP260","COMP260S","EQUALIZER601","OPENDECK",
];
/* famílias, para o aluno achar o efeito sem decorar 41 nomes */
const FAMILIA_EFEITO = e =>
  /REVERB|REV-X|EARLY|GATE REVERB|REVERSE/.test(e) ? "REVERB" :
  /DELAY|ECHO/.test(e)                             ? "DELAY"  :
  /CHORUS|FLANGE|SYMPHONIC|PHASER|TREMOLO|AUTO PAN|ROTARY/.test(e) ? "MODULAÇÃO" :
  /PITCH|RING|FILTER|DISTORTION|AMP|FREEZE/.test(e) ? "ESPECIAL" : "DINÂMICA / EQ";
S.rackSel = 0;
TELAS_POPUP.RACK = function(area){
  const b = molde(area,"VIRTUAL RACK","racks 1-4: GEQ · racks 5-8: GEQ ou efeito");
  const abas = linhaTela();
  S.rack.forEach((r,i)=>{
    abas.appendChild(btTela(String(r.n)+" "+r.tipo, ()=>S.rackSel===i, ()=>{ S.rackSel=i;
      S.ajuda="Rack "+r.n+" — "+r.tipo; }));
  });
  b.appendChild(abas);

  const r = S.rack[S.rackSel];
  const cx = caixaTela(null);
  cx.style.marginTop = "5px";

  if (r.n>4){
    const lt = linhaTela();
    lt.appendChild(btTela("GEQ", ()=>r.tipo==="GEQ", ()=>{ r.tipo="GEQ"; }));
    lt.appendChild(btTela("EFFECT", ()=>r.tipo==="EFFECT", ()=>{ r.tipo="EFFECT"; }));
    cx.appendChild(lt);
  }

  if (r.tipo==="GEQ"){
    const g = el("div");
    g.style.cssText="display:flex;gap:1px;align-items:flex-end;margin-top:5px";
    FREQ_GEQ.forEach((f,i)=>{
      const col = el("div"); col.style.cssText="display:flex;flex-direction:column;align-items:center;gap:1px";
      const trilho = el("div");
      trilho.style.cssText="width:9px;height:74px;background:#15171a;border-radius:1px;position:relative;cursor:ns-resize";
      const cur = el("div");
      cur.style.cssText="position:absolute;left:-1px;width:11px;height:6px;border-radius:1px;"+
        "background:linear-gradient(180deg,#e6e8ea,#9a9da2);border:1px solid #17191b";
      trilho.appendChild(cur);
      const meio = el("div");
      meio.style.cssText="position:absolute;left:0;right:0;top:50%;height:1px;background:#3a3d42";
      trilho.appendChild(meio);
      trilho.style.touchAction="none";
      let base=null, y0=0;
      trilho.addEventListener("pointerdown",ev=>{ ev.stopPropagation(); base=r.geq[i]; y0=ev.clientY;
        try{trilho.setPointerCapture(ev.pointerId);}catch(e){} });
      trilho.addEventListener("pointermove",ev=>{
        if (base===null) return;
        r.geq[i] = clamp(base + (y0-ev.clientY)/74*30, -15, 15);   /* ±15 dB, MEDIDO */
        S.ajuda = "GEQ rack "+r.n+" · "+(f>=1000?(f/1000)+"k":f)+" Hz: "+
                  (r.geq[i]>0?"+":"")+r.geq[i].toFixed(1)+" dB";
        pedirRender();
      });
      const solta=()=>base=null;
      trilho.addEventListener("pointerup",solta); trilho.addEventListener("pointercancel",solta);
      lig(()=>{ cur.style.top = (50 - r.geq[i]/15*50)+"%"; cur.style.marginTop="-3px"; });
      const rot = el("div",null, f>=1000?(f/1000)+"k":String(f));
      rot.style.cssText="font-size:5px;color:#8f959c;writing-mode:vertical-rl;height:22px";
      col.appendChild(trilho); col.appendChild(rot);
      g.appendChild(col);
    });
    cx.appendChild(g);
    const l2 = linhaTela();
    const flat = el("button","tbt","FLAT"); flat.type="button";
    flat.addEventListener("pointerdown",()=>{ r.geq.fill(0); S.ajuda="GEQ zerado"; pedirRender(); });
    l2.appendChild(flat);
    const nota = el("div",null,"31 bandas · ±15 dB · na mesa real os 8 faders da Centralogic pegam 8 bandas por vez");
    nota.style.cssText="font-size:9px;color:#9aa0a8";
    l2.appendChild(nota);
    cx.appendChild(l2);
  } else {
    /* 41 tipos agrupados por família — decorar a lista inteira não é o
       objetivo; achar o efeito certo é. */
    const famAtual = FAMILIA_EFEITO(r.efeito);
    const fams = ["REVERB","DELAY","MODULAÇÃO","ESPECIAL","DINÂMICA / EQ"];
    const lf = linhaTela(); lf.style.marginTop="5px";
    fams.forEach(f=>{
      lf.appendChild(btTela(f, ()=>(r.fam||famAtual)===f, ()=>{ r.fam=f; }));
    });
    cx.appendChild(lf);
    const lt = el("div"); lt.style.cssText="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px";
    EFEITOS.filter(e=>FAMILIA_EFEITO(e)===(r.fam||famAtual)).forEach(e=>{
      lt.appendChild(btTela(e, ()=>r.efeito===e, ()=>{ r.efeito=e;
        S.ajuda="Rack "+r.n+" — efeito <b>"+e+"</b>"; }));
    });
    cx.appendChild(lt);
    const lp = linhaTela(); lp.style.marginTop="6px";
    lp.appendChild(knobTela("TIME/TEMPO", ()=>r.param.tempo, v=>r.param.tempo=v, 20, 3000, v=>v.toFixed(0)+" ms"));
    lp.appendChild(knobTela("MIX", ()=>r.param.mix, v=>r.param.mix=v, 0, 100, v=>v.toFixed(0)+" %"));
    const tap = el("button","tbt","TAP TEMPO"); tap.type="button";
    let ultimo = 0;
    tap.addEventListener("pointerdown",()=>{
      const agora = performance.now();
      if (ultimo && agora-ultimo < 3000){
        r.param.tempo = Math.round(agora-ultimo);
        S.ajuda = "TAP TEMPO: "+r.param.tempo+" ms ("+Math.round(60000/r.param.tempo)+" BPM)";
      } else S.ajuda = "TAP TEMPO — bata de novo no ritmo";
      ultimo = agora; pedirRender();
    });
    lp.appendChild(tap);
    cx.appendChild(lp);
  }
  b.appendChild(cx);
};

/* ---- MONITOR / CUE / OSCILADOR / TALKBACK (p.153/161) ---- */

  b.appendChild(l);
  const nota = el("div",null,

/* ---- SETUP + USER SETUP + USER DEFINED KEYS (p.207/216/229) ---- */

/* O brilho MEXE no painel de verdade: BANK A é o ajuste de dia e BANK B o
   de show com a casa escura. Guardar o número sem mudar nada seria enfeite. */
function aplicarBrilho(){
  const b = S.sys.brilho[S.sys.brilhoBanco];
  const raiz = document.documentElement;
  raiz.style.setProperty("--brilho-tela",  b.screen.toFixed(2));
  raiz.style.setProperty("--brilho-led",   b.panel.toFixed(2));
  const tela = document.getElementById("tela");
  if (tela) tela.style.filter = "brightness("+(0.45 + b.screen*0.75).toFixed(2)+")";
  const mesa2 = document.getElementById("mesa");
  if (mesa2) mesa2.style.setProperty("--led-brilho", String(b.panel));
}

/* ==================================================================
   ZOOM-TO-FIT
   A mesa é desenhada num palco fixo de 1920x1000 e depois escalada.
   SEM isto o painel fica cortado -- e um painel cortado é exatamente
   o que faz as proporções parecerem erradas.
   Nota do projeto: NÃO derivar a altura da largura (aspect-ratio) --
   foi o que já cortou simulador em tela cheia antes.
   ================================================================== */
const palco = document.getElementById("palco");
function ajustarZoom(){
  const lw = window.innerWidth, lh = window.innerHeight;
  const k = Math.min(lw / 1920, lh / 1044);
  palco.style.transform = "scale(" + k.toFixed(4) + ")";
}
window.addEventListener("resize", ajustarZoom);
ajustarZoom();

/* contrato html.smu-fs: o player avisa por postMessage quando entra em
   tela cheia; o simulador responde só com CSS + um novo cálculo de zoom */
window.addEventListener("message", ev=>{
  const d = ev && ev.data;
  if (!d) return;
  const tipo = typeof d === "string" ? d : d.type || d.tipo;
  if (tipo === "smu-fs-on"  || tipo === "smu:fullscreen:on")  document.documentElement.classList.add("smu-fs");
  if (tipo === "smu-fs-off" || tipo === "smu:fullscreen:off") document.documentElement.classList.remove("smu-fs");
  requestAnimationFrame(ajustarZoom);
});

/* ---------- EXPANDIR A TELA ----------
   Recurso do SIMULADOR (a console real não faz isso): a tela da M7CL é
   pequena de propósito -- 16,8 % da largura da mesa, medido -- e num
   notebook fica ilegível. Por isso vem rotulado como recurso do simulador.

   A tela é MOVIDA para o overlay e devolvida ao lugar depois. Mover, e não
   copiar, mantém UM único #tela: o estado, os listeners e as ligações de
   render continuam valendo, sem nenhuma sincronização entre duas cópias. */
const btLupa   = document.getElementById("lupa");
const btFechar = document.getElementById("fechar-lupa");
const overlay  = document.getElementById("overlay");
const molduraOv= document.getElementById("overlay-moldura");
const telaEl   = document.getElementById("tela");
const espacoEl = document.getElementById("lcd-espaco");   /* recorta e escala */
let expandida = false;

/* Encaixa o LCD (640x480) no espaço disponível, por ESCALA.
   É o mesmo desenho na mesa e ampliado -- só muda o zoom. */
function escalarLCD(lw, lh){
  const k = Math.min(lw / 640, lh / 480);
  telaEl.style.transform = "scale(" + k.toFixed(4) + ")";
  espacoEl.style.width  = Math.round(640*k)+"px";
  espacoEl.style.height = Math.round(480*k)+"px";
  return k;
}

function dimensionarTelaExpandida(){
  if (!expandida) return;
  /* AMPLIAR = ZOOM. O LCD tem 640x480 sempre; só cresce a escala. */
  escalarLCD(window.innerWidth - 60, window.innerHeight - 150);
}
/* na mesa, o LCD ocupa o espaço físico medido na planta */
function encaixarLCDnaMesa(){
  escalarLCD(MED.lcd, Math.round(MED.lcd/1.315));
}

/* As NAVIGATION KEYS ficam na mesa, ATRÁS do overlay — com a tela ampliada
   o aluno não conseguia trocar de grupo de canais e a tela parecia travada.
   Aqui elas são repetidas dentro do overlay, junto com a barra de transporte. */
function montarNavOverlay(){
  const nv = document.getElementById("navov");
  if (!nv) return;
  nv.innerHTML = "";
  NAVS.forEach(n=>{
    const b = el("button", null, n.rot);
    b.type = "button";
    b.classList.toggle("on", S.nav === n.id);
    b.addEventListener("click", ()=>{
      S.navAnterior = (S.nav !== "DCA") ? S.nav : S.navAnterior;
      S.nav = n.id;
      S.ajuda = "Tela mostrando <b>"+n.rot+"</b>";
      telaChave = null;
      montarNavOverlay();
      pedirRender();
    });
    nv.appendChild(b);
  });
  /* a barra de transporte vive no rodapé da mesa; com a tela ampliada ela
     fica escondida, então trago uma cópia funcional para cá */
  if (!nv.querySelector("#smu-ov")){
    const barra = fazBarraTransporte();
    barra.id = "smu-ov";
    barra.style.cssText += ";width:100%;margin-top:6px;border-radius:4px;border-top:0";
    nv.appendChild(barra);
  }
}

function expandirTela(on){
  expandida = on;
  if (on){
    montarNavOverlay();
    /* move o ESPAÇO inteiro (que já recorta e escala), não só a tela */
    molduraOv.appendChild(espacoEl);
    overlay.classList.add("on");
    dimensionarTelaExpandida();
    S.ajuda = "Tela ampliada — recurso do simulador, a mesa real não faz isto";
  } else {
    const tb = document.querySelector(".telabox");
    if (tb) tb.insertBefore(espacoEl, tb.firstChild);
    overlay.classList.remove("on");
    encaixarLCDnaMesa();
    S.ajuda = "";
  }
  btLupa.textContent = on ? "TELA AMPLIADA" : "AMPLIAR TELA";
  telaChave = null;                          /* força reconstruir no tamanho novo */
  pedirRender();
}
btLupa.addEventListener("click", ()=>expandirTela(!expandida));
btFechar.addEventListener("click", ()=>expandirTela(false));

/* teclado: atalhos de estudo */
document.addEventListener("keydown", ev=>{
  if (ev.key === "Escape" && expandida){ expandirTela(false); return; }
  if (ev.key === "Escape" && S.popup){ fecharPopup(); pedirRender(); }
  if (ev.key === "ArrowRight") pularCanal(1);
  if (ev.key === "ArrowLeft")  pularCanal(-1);
});

/* ==================================================================
   ÁUDIO MULTITRACK — as músicas cadastradas, cada track num canal
   ==================================================================
   As bases vêm do catálogo público do projeto (media/bases.json), o mesmo
   que a frota de simuladores já usa. Cada stem (Bumbo, Caixa, Baixo, Voz...)
   entra num canal da mesa: o aluno mixa de verdade, com o fader, o EQ e o
   pan daquele canal.

   ⚠️ O som só começa quando o aluno APERTA PLAY. Nada toca sozinho ao abrir.

   Cadeia por canal, na ordem da mesa real:
     buffer -> HPF -> EQ 4 bandas -> gain do fader -> pan -> master
   AudioParam: uso setValueAtTime, que resolve e PARA. setTargetAtTime é
   exponencial e nunca termina -- o param vira a-rate e o biquad recalcula
   coeficiente a cada amostra (foi o que pesou 34,5% de CPU na CL5).      */
/* SB_MEDIA é declarado LÁ EM CIMA, junto de AUD — ver a nota de TDZ lá. */
/* AUD é declarado LÁ EM CIMA, junto do estado S — ver a nota de TDZ lá.
   Aqui ficam só as funções que mexem nele. */

async function carregarCatalogo(){
  try{
    const r = await fetch(SB_MEDIA+"bases.json?t="+(AUD.t0||1));
    if (!r.ok) return;
    const j = await r.json();
    AUD.bases = Array.isArray(j) ? j : (j.bases || j.songs || []);
  }catch(e){
    /* Sem rede é caso esperado -- o simulador segue sem áudio. Mas erro de
       PROGRAMAÇÃO não pode ficar mudo aqui: foi assim que um TDZ de SB_MEDIA
       (declarado depois desta função ser chamada) deixou a lista de músicas
       vazia sem uma linha no console. */
    if (e instanceof ReferenceError || e instanceof TypeError) console.error("[m7cl] catálogo:", e);
  }
}

/** Carrega os stems de uma base e amarra cada um a um canal da mesa. */
async function carregarBase(idx){
  const b = AUD.bases[idx];
  if (!b || AUD.carregando) return;
  pararAudio();
  AUD.carregando = true;
  AUD.base = b;
  S.ajuda = "Carregando <b>"+b.label+"</b> ("+b.stems.length+" faixas)…";
  pedirRender();

  AUD.ctx = AUD.ctx || new (window.AudioContext||window.webkitAudioContext)();
  const ctx = AUD.ctx;
  /* uma base pode ter mais faixas que 48; usa as primeiras e avisa */
  const usar = b.stems.slice(0, N_IN);
  const carregados = await Promise.all(usar.map(async (st,i)=>{
    try{
      const resp = await fetch(SB_MEDIA + b.folder + "/" + st.f);
      if (!resp.ok) return null;
      const buf = await ctx.decodeAudioData(await resp.arrayBuffer());
      return { ...st, buffer:buf };
    }catch(e){ console.error("[m7cl] faixa falhou:", st.f, e); return null; }
  }));

  /* O canal é numerado DEPOIS de descartar as faixas que falharam.
     Antes eu numerava no map (canal:"CH"+(i+1)) e só então filtrava: se a
     faixa 1 falhasse, ela sumia e as outras continuavam em CH2, CH3... ->
     o CH1 ficava MUDO com o LED mexendo, e o loop que desliga os canais
     sobrando (usando AUD.stems.length) desligava canais que TINHAM faixa.
     Um download perdido desalinhava a mesa inteira. */
  const perdidas = carregados.filter(x=>!x).length;
  AUD.stems = carregados.filter(Boolean).map((s,i)=>({ ...s, canal:"CH"+(i+1) }));
  AUD.dur = AUD.stems.reduce((m,s)=>Math.max(m, s.buffer.duration), 0);

  /* o canal recebe o nome e o pan da faixa, como numa passagem de som */
  AUD.stems.forEach(s=>{
    const c = S.canais[s.canal];
    if (!c) return;
    c.nome = String(s.n).slice(0,8);
    c.pan  = clamp((s.p||0)/50, -1, 1);
    c.ha.gain = -20;
    c.hpf.on  = !!s.h;          /* a base já marca quem pede corte de grave */
    c.fader = -138;             /* tudo fechado: o aluno abre */
    c.on = true;
  });
  /* canais sem faixa saem do caminho */
  for (let i=AUD.stems.length+1;i<=N_IN;i++){
    const c = S.canais["CH"+i];
    if (c){ c.nome = "ch "+i; c.on = false; }
  }

  AUD.carregando = false;
  S.ajuda = "<b>"+b.label+"</b> — "+AUD.stems.length+" faixas nos canais 1-"+AUD.stems.length+
            (b.stems.length>N_IN ? " (a base tem "+b.stems.length+", a mesa comporta "+N_IN+")" : "")+
            /* falha de download não pode ficar muda: era o que fazia um canal
               ficar sem som sem ninguém saber por quê */
            (perdidas ? " · ⚠️ "+perdidas+" faixa(s) não baixaram" : "")+
            " · abra os faders e aperte PLAY";
  telaChave = null;
  pedirRender();
}

/** Monta a cadeia de um stem e começa a tocar. */
function tocarStem(s, quando, offset){
  const ctx = AUD.ctx, c = S.canais[s.canal];
  const src = ctx.createBufferSource();
  src.buffer = s.buffer;
  /* LOOP: a música repete sozinha, como nos outros simuladores da frota.
     O ponto de volta é a faixa MAIS LONGA da base (AUD.dur), não a duração
     de cada uma — senão cada stem voltaria num instante diferente e a banda
     se desmontaria depois da primeira volta. */
  src.loop = true;
  src.loopStart = 0;
  src.loopEnd = AUD.dur || s.buffer.duration;

  const hpf = ctx.createBiquadFilter(); hpf.type = "highpass";
  const bandas = ["low","lomid","himid","high"].map(()=>{
    const f = ctx.createBiquadFilter(); f.type = "peaking"; return f;
  });
  const gain = ctx.createGain();
  const pan  = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

  /* Analisadores para o METER medir o sinal DE VERDADE.
     São dois porque o metering point da M7CL escolhe ONDE medir (p.167):
       pre  = antes do fader/ON  ·  pos = depois de tudo, o que realmente sai
     Sem isto o LED era um seno fictício: mexia sem áudio e não correspondia
     ao que se ouvia -- foi o que o dono viu. */
  const anaPre = ctx.createAnalyser(); anaPre.fftSize = 256;
  const anaPos = ctx.createAnalyser(); anaPos.fftSize = 256;

  let no = src.connect(hpf);
  bandas.forEach(f=>{ no = no.connect(f); });
  no.connect(anaPre);                    /* derivação: não corta a cadeia */
  no = no.connect(gain);
  if (pan) no = no.connect(pan);
  no.connect(anaPos);
  no.connect(ctx.destination);

  s.src = src;
  s.nodes = { hpf, bandas, gain, pan, anaPre, anaPos, buf:new Uint8Array(anaPos.frequencyBinCount) };
  aplicarCanalNoAudio(s);
  /* offset pela duração da BASE (não da faixa): com o loop sincronizado em
     AUD.dur, usar a duração de cada stem faria as faixas entrarem
     desencontradas ao retomar de uma pausa */
  src.start(quando, offset % (AUD.dur || s.buffer.duration || 1));
}

/** Espelha o canal da mesa nos nós de áudio daquele stem. */
function aplicarCanalNoAudio(s){
  const c = S.canais[s.canal], n = s.nodes, ctx = AUD.ctx;
  if (!c || !n || !ctx) return;
  const t = ctx.currentTime;
  const P = (param, v) => {           /* resolve e PARA -- nada de rampa infinita */
    if (Number.isFinite(v) && Math.abs(param.value - v) > 1e-4) param.setValueAtTime(v, t);
  };
  /* ganho: HA + fader + ON, tudo o que a mesa faz antes da saída */
  const ha = Math.pow(10, (c.ha.gain + 20) / 20);
  const fd = c.fader <= -138 ? 0 : Math.pow(10, c.fader / 20);
  P(n.gain.gain, (c.on ? 1 : 0) * ha * fd * (c.toSt ? 1 : 0));
  if (n.pan) P(n.pan.pan, clamp(c.pan, -1, 1));
  P(n.hpf.frequency, c.hpf.on ? c.hpf.freq : 20);
  const bs = [c.eq.bandas.low, c.eq.bandas.lomid, c.eq.bandas.himid, c.eq.bandas.high];
  n.bandas.forEach((f,i)=>{
    const b = bs[i];
    P(f.frequency, b.f);
    P(f.Q, b.q);
    P(f.gain, c.eq.on ? b.g : 0);
  });
}

function tocarAudio(){
  if (!AUD.ctx || !AUD.stems.length || AUD.tocando) return;
  AUD.ctx.resume();
  const quando = AUD.ctx.currentTime + 0.06;   /* todas as faixas juntas */
  AUD.stems.forEach(s=>tocarStem(s, quando, AUD.offset));
  AUD.t0 = quando - AUD.offset;
  AUD.tocando = true;
  S.ajuda = "Tocando <b>"+AUD.base.label+"</b> em looping — mexa nos faders e ouça";
  pedirRender();
}
function pararAudio(){
  AUD.stems.forEach(s=>{
    try{ s.src && s.src.stop(); }catch(e){}
    s.src=null; s.nodes=null;
    const c = S.canais[s.canal];
    if (c) c.nivel = 0;          /* LED apaga junto com o som */
  });
  /* com loop o tempo cresce sem parar: guarda a posição DENTRO da volta */
  if (AUD.tocando && AUD.ctx){
    const t = Math.max(0, AUD.ctx.currentTime - AUD.t0);
    AUD.offset = AUD.dur ? (t % AUD.dur) : t;
  }
  AUD.tocando = false;
}
function pausarAudio(){ pararAudio(); S.ajuda="Pausado"; pedirRender(); }
function voltarAudio(){ pararAudio(); AUD.offset=0; S.ajuda="Voltou ao começo"; pedirRender(); }

/* espelha a mesa no áudio a cada frame -- é o que faz o fader "soar" */
function tickAudio(){
  if (AUD.tocando) AUD.stems.forEach(aplicarCanalNoAudio);
  requestAnimationFrame(tickAudio);
}
requestAnimationFrame(tickAudio);

/* ==================================================================
   CENAS NO BANCO — presas ao cadastro do aluno
   ==================================================================
   Guarda em /api/sim/scenes, que resolve o aluno pela sessão Clerk. O aluno
   monta o show, guarda, volta noutro dia e chama de volta -- como na mesa. */
const API_CENAS = "/api/sim/scenes";
S.cenasNuvem = [];
S.nuvemMsg = "";

function estadoParaSalvar(){
  return {
    canais: fotoDaMesa(),
    patch: S.patch, bus: S.bus, rack: S.rack,
    focus: S.focus, muteSafe: S.muteSafe, fade: S.fade,
    meterPonto: S.meterPonto, udk: S.udk,
    base: AUD.base ? AUD.base.folder : null,
  };
}
function aplicarEstadoSalvo(d){
  if (!d) return;
  if (d.canais) aplicarCena(d.canais);
  if (d.patch) S.patch = d.patch;
  if (d.bus)   S.bus = d.bus;
  if (d.rack)  S.rack = d.rack;
  if (d.focus) S.focus = d.focus;
  if (d.muteSafe) S.muteSafe = d.muteSafe;
  if (d.fade)  S.fade = d.fade;
  if (d.meterPonto) S.meterPonto = d.meterPonto;
  if (d.udk)   S.udk = d.udk;
}

async function listarCenasNuvem(){
  try{
    const r = await fetch(API_CENAS+"?simulador=m7cl");
    if (r.status === 401){ S.nuvemMsg = "Entre na plataforma para guardar suas cenas."; return; }
    if (!r.ok){ S.nuvemMsg = "Não consegui falar com o servidor."; return; }
    const j = await r.json();
    S.cenasNuvem = j.cenas || [];
    S.nuvemMsg = S.cenasNuvem.length ? "" : "Nenhuma cena guardada ainda.";
  }catch(e){ S.nuvemMsg = "Sem conexão — as cenas locais continuam funcionando."; }
  telaChave = null; pedirRender();
}
async function guardarCenaNuvem(numero, nome){
  S.nuvemMsg = "Guardando…"; pedirRender();
  try{
    const r = await fetch(API_CENAS,{ method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ simulador:"m7cl", numero, nome, dados: estadoParaSalvar() }) });
    if (r.status === 401){ S.nuvemMsg = "Entre na plataforma para guardar suas cenas."; pedirRender(); return; }
    const j = await r.json();
    if (!r.ok){ S.nuvemMsg = "Falhou: "+(j.error||r.status); pedirRender(); return; }
    S.nuvemMsg = "Cena "+num3(numero)+" guardada na sua conta.";
    listarCenasNuvem();
  }catch(e){ S.nuvemMsg = "Sem conexão."; pedirRender(); }
}
async function chamarCenaNuvem(numero){
  try{
    const r = await fetch(API_CENAS+"?simulador=m7cl&numero="+numero);
    const j = await r.json();
    const c = (j.cenas||[])[0];
    if (!c){ S.nuvemMsg = "Cena "+num3(numero)+" não encontrada."; pedirRender(); return; }
    aplicarEstadoSalvo(c.dados);
    S.nuvemMsg = "Cena "+num3(numero)+" ("+c.nome+") chamada.";
    S.ajuda = "Cena <b>"+c.nome+"</b> chamada da sua conta";
    telaChave = null; pedirRender();
  }catch(e){ S.nuvemMsg = "Sem conexão."; pedirRender(); }
}

  b.appendChild(lista);
  const nota = el("div",null,

/* ==================================================================
   AUTOTESTE — confere as funções contra o MANUAL, não contra o código
   ==================================================================
   Rode `m7clTeste()` no console do navegador. Cada teste cita o capítulo
   do manual de onde saiu o número, para dar pra checar na fonte.

   Por que isto mora dentro do arquivo: o portão do projeto
   (ferramentas/clicar-tudo.mjs) prova que todo controle RESPONDE, não que
   faça a coisa certa. Um botão pode responder e mexer no parâmetro errado.
   Estes testes olham o ESTADO depois da ação.                          */
function m7clTeste(){
  const R = [];
  const T = (cap, nome, fn) => {
    let ok = false, erro = "";
    try { ok = !!fn(); } catch(e){ erro = e.message; }
    R.push({cap, nome, ok, erro});
  };
  const C = id => S.canais[id];
  const guardaEstado = JSON.stringify({sel:S.sel, nav:S.nav, tela:S.tela});

  /* cap.2 — painel */
  T(2,"62 strips (48 in + 4 ST IN + 8 Centralogic + 2 master)",
    ()=>document.querySelectorAll(".strip").length===62);
  T(2,"SELECTED CHANNEL com 33 knobs (16 send + HA/PAN/HPF/DYN1/DYN2 + EQ 4x3)",
    ()=>document.querySelectorAll(".selch .knob").length===33);
  T(2,"12 USER DEFINED KEYS", ()=>document.querySelectorAll("[data-udk]").length===12);
  T(2,"12 NAVIGATION KEYS",   ()=>document.querySelectorAll("[data-nav]").length===12);

  /* cap.5 — canal de entrada */
  T(5,"HA gain vai de -62 a +10 dB",
    ()=>{const c=C("CH1"),v=c.ha.gain;c.ha.gain=-62;const a=c.ha.gain;c.ha.gain=10;
         const b=c.ha.gain;c.ha.gain=v;return a===-62&&b===10;});
  T(5,"16 sends de MIX e 8 de MATRIX por canal",
    ()=>C("CH1").mix.length===N_MIX && C("CH1").mtx.length===N_MTX);

  /* cap.9 — patch */
  T(9,"patch de fábrica: OMNI 1-12 = MIX 1-12 (p.105)", ()=>S.patch.saida.MIX1==="OMNI 1");
  T(9,"patch de fábrica: OMNI 13/14 = MATRIX 1/2",
    ()=>S.patch.saida.MTX1==="OMNI 13" && S.patch.saida.MTX2==="OMNI 14");
  T(9,"patch de fábrica: OMNI 15/16 = STEREO", ()=>S.patch.saida.STEREO==="OMNI 15");

  /* cap.10 — EQ e dinâmica */
  T(10,"EQ 4 bandas, 20 Hz-20 kHz, ±18 dB",
    ()=>{const b=C("CH1").eq.bandas.low,g=b.g,f=b.f;b.g=18;b.f=20000;
         const r=b.g===18&&b.f===20000;b.g=g;b.f=f;return r;});
  T(10,"entrada DYN1 = GATE/DUCKING/COMPRESSOR/EXPANDER (p.249)",
    ()=>tiposDyn(C("CH1"),"dyn1").join()==="GATE,DUCKING,COMPRESSOR,EXPANDER");
  T(10,"entrada DYN2 = COMPRESSOR/COMPANDER-H/COMPANDER-S/DE-ESSER",
    ()=>tiposDyn(C("CH1"),"dyn2").join()==="COMPRESSOR,COMPANDER-H,COMPANDER-S,DE-ESSER");
  T(10,"SAÍDA DYN1 tem lista PRÓPRIA (não a de entrada)",
    ()=>tiposDyn(C("MIX1"),"dyn1").join()==="COMPRESSOR,EXPANDER,COMPANDER-H,COMPANDER-S");
  T(10,"GATE: THRESHOLD -72..0 · COMPRESSOR: -54..0",
    ()=>paramsDyn("GATE")[0].min===-72 && paramsDyn("COMPRESSOR")[0].min===-54);
  T(10,"OUT GAIN: 0..+18 no compressor, -18..0 no compander",
    ()=>paramsDyn("COMPRESSOR").find(p=>p.campo==="out").min===0 &&
        paramsDyn("COMPANDER-H").find(p=>p.campo==="out").min===-18);
  T(10,"RATIO são 16 pontos discretos, terminando em ∞:1",
    ()=>RATIOS.length===16 && RATIOS[15]===Infinity);
  T(10,"EQ LIBRARY: 39 presets, Bass Drum 1 com os valores do manual",
    ()=>EQ_LIB.length===39 && EQ_LIB[0][1]==="Bass Drum 1" &&
        EQ_LIB[0][3][0]===3.5 && EQ_LIB[0][4][0]===100);
  T(10,"DYNAMICS LIBRARY: 41 presets", ()=>DYN_LIB.length===41);

  /* cap.11 — grupos */
  T(11,"MUTE GROUP muta o canal do grupo",
    ()=>{const a=C("CH1");a.mute=[1];a.on=true;S.muteSafe={};aplicarMuteGroup(1,true);
         const r=a.on===false;a.on=true;a.mute=[];return r;});
  T(11,"MUTE SAFE impede o mute group de mutar",
    ()=>{const a=C("CH2");a.mute=[1];a.on=true;S.muteSafe={};S.muteSafe[a.id]=true;
         aplicarMuteGroup(1,true);const r=a.on===true;S.muteSafe={};a.mute=[];a.on=true;return r;});

  /* cap.12 — cenas */
  T(12,"STORE guarda e RECALL restaura",
    ()=>{const c=C("CH5"),v=c.fader;c.fader=-11;guardarCena(299,"AUTOTESTE");
         c.fader=-40;S.cena.n=299;recallCena();const r=c.fader===-11;c.fader=v;return r;});
  T(12,"cena 000 é protegida", ()=>guardarCena(0,"x")===false);
  T(12,"RECALL SAFE protege o canal do recall",
    ()=>{const c=C("CH5");c.recallSafe=true;c.fader=-33;S.cena.n=299;recallCena();
         const r=c.fader===-33;c.recallSafe=false;return r;});
  T(12,"FOCUS impede o recall de mexer no fader",
    ()=>{const c=C("CH5");c.fader=-22;S.focus={FADER:false};S.cena.n=299;recallCena();
         const r=c.fader===-22;S.focus={};return r;});

  /* cap.15/16 */
  T(15,"meter bridge: 16 MIX + 8 MATRIX = 24 colunas",
    ()=>document.querySelectorAll(".bcol").length===24);
  T(16,"GEQ de 31 bandas", ()=>S.rack[0].geq.length===31 && FREQ_GEQ.length===31);
  T(16,"41 tipos de efeito oficiais (p.252)",
    ()=>EFEITOS.length===41 && EFEITOS.includes("REV-X HALL") && EFEITOS.includes("OPENDECK"));

  /* cap.17/20 */
  T(17,"PROGRAM CHANGE chama a cena de mesmo número",
    ()=>{const c=C("CH5"),v=c.fader;c.fader=-11;guardarCena(298,"PGM");c.fader=-40;
         S.cena.n=298;recallCena();const r=c.fader===-11;c.fader=v;return r;});
  T(20,"BRIGHTNESS muda mesmo o brilho da tela",
    ()=>{const bk=S.sys.brilhoBanco;S.sys.brilhoBanco="B";aplicarBrilho();
         const b=document.getElementById("tela").style.filter;S.sys.brilhoBanco="A";
         aplicarBrilho();const a=document.getElementById("tela").style.filter;
         S.sys.brilhoBanco=bk;aplicarBrilho();return a!==b && !!a;});
  T(20,"BUS SETUP alterna VARI/FIXED",
    ()=>{const t=S.bus.mix[0].tipo;S.bus.mix[0].tipo="FIXED";
         const r=S.bus.mix[0].tipo==="FIXED";S.bus.mix[0].tipo=t;return r;});

  /* telas */
  T(0,"todas as telas abrem com conteúdo", ()=>{
    const area = document.getElementById("area");
    let vazias = 0;
    for (const p of Object.keys(TELAS_POPUP)){
      S.tela="OVERVIEW"; S.popup=p; telaChave=null; construirTela();
      if (area.querySelectorAll("*").length < 10) vazias++;
    }
    S.popup=null; S.tela="OVERVIEW"; telaChave=null; construirTela();
    return vazias === 0;
  });

  /* limpa o que o teste criou */
  S.cena.lista = S.cena.lista.filter(x=>x.n<298);
  const g = JSON.parse(guardaEstado);
  S.sel=g.sel; S.nav=g.nav; S.tela=g.tela; S.popup=null; telaChave=null;
  pedirRender();

  const falhas = R.filter(x=>!x.ok);
  console.log("M7CL — "+R.length+" testes · "+falhas.length+" falha(s)");
  R.forEach(x=>console.log((x.ok?"  OK   ":"  FALHA")+" cap."+String(x.cap).padEnd(3)+x.nome+
    (x.erro?"  ["+x.erro+"]":"")));
  return {total:R.length, falhas:falhas.length,
          detalhe:falhas.map(f=>"cap."+f.cap+" — "+f.nome)};
}
window.m7clTeste = m7clTeste;

/* ---- primeiro render ---- */
S.ajuda = "Aperte um <b>[SEL]</b> para escolher o canal · gire os knobs do <b>SELECTED CHANNEL</b> · "+
          "as <b>NAVIGATION KEYS</b> mandam 8 canais para a Centralogic";

S.cena.lista[0].dados = fotoDaMesa();
