const TELAS_POPUP = {};
/* opc.ferramentas -> mostra as TECLAS DE FERRAMENTAS do manual (p.35):
     LIBRARY · DEFAULT · COPY · PASTE · COMPARE
   opc.abas -> as fichas 1ch / 8ch / ALL do rodapé
   opc.canais -> a faixa com os 8 canais, para trocar de canal DENTRO da
   janela (o manual chama de "tecla de nome / número de canal") */
function molde(area, titulo, sub, opc){
  opc = opc || {};
  const p = el("div","popup");
  const cab = el("div","cab");
  cab.appendChild(el("span",null,titulo));
  if (sub){ const s = el("span",null,sub); s.style.cssText="font-size:9px;color:#9aa0a8;font-weight:400"; cab.appendChild(s); }

  if (opc.ferramentas){
    const fer = el("div","ferramentas");
    const c = S.canais[S.sel];
    [["LIBRARY", ()=>{ abrirPopup(opc.lib || "EQ_LIB"); }],
     ["DEFAULT", ()=>{ opc.padrao && opc.padrao(c); S.ajuda = "Voltou ao padrão"; }],
     ["COPY",    ()=>{ S.copiaFer = opc.copiar && opc.copiar(c); S.ajuda = "Copiado"; }],
     ["PASTE",   ()=>{ if (!S.copiaFer){ S.ajuda="Nada copiado ainda"; return; }
                       opc.colar && opc.colar(c, S.copiaFer); S.ajuda = "Colado em "+c.nome; }],
     ["COMPARE", ()=>{ if (!S.copiaFer){ S.ajuda="Copie algo antes de comparar"; return; }
                       const atual = opc.copiar && opc.copiar(c);
                       opc.colar && opc.colar(c, S.copiaFer); S.copiaFer = atual;
                       S.ajuda = "Comparando — aperte de novo para voltar"; }],
    ].forEach(([rot,fn])=>{
      const b = el("button","fbt",rot); b.type="button";
      b.addEventListener("pointerdown",()=>{ fn(); pedirRender(); });
      fer.appendChild(b);
    });
    cab.appendChild(fer);
  }

  const x = el("button","x","X"); x.type="button";
  x.addEventListener("pointerdown",()=>{ fecharPopup(); pedirRender(); });
  cab.appendChild(x);
  p.appendChild(cab);
  const corpo = el("div","corpo");
  p.appendChild(corpo);

  if (opc.abas){
    const ab = el("div","abas1ch");
    /* nem toda janela tem as três: a TO STEREO/MONO só existe em 8 ch e ALL
       (p.63). opc.abas pode vir como lista para dizer quais. */
    const quais = Array.isArray(opc.abas) ? opc.abas : ["1ch","8ch","ALL"];
    if (quais.indexOf(S.popAba) < 0) S.popAba = quais[0];
    quais.forEach(a=>{
      const b = el("button","abt"+(S.popAba===a?" on":""), a); b.type="button";
      b.addEventListener("pointerdown",()=>{ S.popAba=a;
        S.ajuda = a==="1ch" ? "Janela mostrando só o canal selecionado"
                : a==="8ch" ? "Janela mostrando os 8 canais da Centralogic"
                            : "Janela mostrando todos os canais";
        telaChave=null; pedirRender(); });
      ab.appendChild(b);
    });
    p.appendChild(ab);
  }
  if (opc.canais){
    const rod = el("div","rodape-canais");
    grupoTela().forEach(id=>{
      const cc = S.canais[id];
      const d = el("div", id===S.sel ? "sel" : null, cc ? cc.nome : "—");
      if (cc) d.addEventListener("pointerdown",()=>{ S.sel=id; telaChave=null;
        S.ajuda="Canal <b>"+cc.nome+"</b> — a janela seguiu"; pedirRender(); });
      rod.appendChild(d);
    });
    p.appendChild(rod);
  }
  area.appendChild(p);
  return corpo;
}

/* ==================================================================
   DYNAMICS — tudo MEDIDO no apêndice "Dynamics Parameters" (p.249-251)
   ==================================================================
   O manual é explícito: a lista de tipos MUDA conforme o canal.
     entrada, DYN1 : GATE · DUCKING · COMPRESSOR · EXPANDER
     entrada, DYN2 : COMPRESSOR · COMPANDER-H · COMPANDER-S · DE-ESSER
     SAÍDA,   DYN1 : COMPRESSOR · EXPANDER · COMPANDER-H · COMPANDER-S
   (canal de saída não tem DYN2). Eu usava a lista de entrada em tudo. */
const TIPOS_DYN1     = ["GATE","DUCKING","COMPRESSOR","EXPANDER"];
const TIPOS_DYN2     = ["COMPRESSOR","COMPANDER-H","COMPANDER-S","DE-ESSER"];
const TIPOS_DYN1_OUT = ["COMPRESSOR","EXPANDER","COMPANDER-H","COMPANDER-S"];
const tiposDyn = (c, qual) =>
  qual === "dyn2" ? TIPOS_DYN2 : (ehSaida(c) ? TIPOS_DYN1_OUT : TIPOS_DYN1);

/* GAIN REDUCTION: quanto a dinâmica está PUXANDO o sinal agora, de 0 a 1.
   É o que o medidor laranja da p.101 mostra, e é o único jeito de o aluno
   ver que o compressor está trabalhando -- sem ele o [ON] da dinâmica é um
   botão que acende e mais nada.

   Sai do nível medido do canal contra o threshold, com a razão do tipo:
     GATE/DUCKING -> reduz quando o sinal está ABAIXO do threshold
     COMP/EXPANDER/COMPANDER/DE-ESSER -> reduz quando está ACIMA
   ⚠️ É a lei de compressão de manual (excesso / ratio), não a curva medida
   da Yamaha -- serve para a AGULHA andar certo, não para casar dB a dB. */
function reducaoDyn(c, kk){
  const d = c[kk];
  if (!d || !d.on) return 0;
  /* com música tocando, o GR é o APLICADO no áudio (processarDinamica) --
     medidor e ouvido têm de contar a mesma história */
  if (AUD.tocando){
    const s = (AUD.stems||[]).find(x=>x.canal===c.id);
    if (s && s.nodes) return clamp(s.nodes[kk==="dyn1"?"red1":"red2"]||0, 0, 1);
  }
  const dB = c.nivel > 0 ? 20*Math.log10(clamp(c.nivel,1e-5,1)) : -100;
  const abre = d.tipo==="GATE" || d.tipo==="DUCKING";
  if (abre){
    if (dB >= d.thr) return 0;                       /* portão aberto */
    const faltam = d.thr - dB;                       /* dB abaixo do limiar */
    const range = Math.abs(d.range || 70) || 70;
    return clamp(faltam / range, 0, 1);
  }
  if (dB <= d.thr) return 0;                         /* abaixo do limiar: passa */
  const excesso = dB - d.thr;
  const r = (d.ratio === Infinity) ? 1 : 1 - 1/(d.ratio || 1);
  return clamp((excesso * r) / 24, 0, 1);            /* 24 dB = medidor cheio */
}

/* RATIO não é contínuo: são 16 pontos fixos (p.249). O operador gira e o
   valor PULA entre eles -- um knob contínuo de 1 a 20 seria mentira. */
const RATIOS = [1.0,1.1,1.3,1.5,1.7,2.0,2.5,3.0,3.5,4.0,5.0,6.0,8.0,10,20,Infinity];
const fmtRatio = v => (v===Infinity?"∞":v>=10?String(v):v.toFixed(1))+":1";

/* Qual parâmetro cada tipo mostra, e com que faixa. Sai direto das tabelas
   do manual: THRESHOLD do GATE vai a -72, dos outros a -54; OUT GAIN é
   0..+18 no compressor e -18..0 no compander. */
function paramsDyn(tipo){
  const T72 = {campo:"thr",  rot:"THRESHOLD", min:-72, max:0,   fmt:v=>v.toFixed(0)+" dB"};
  const T54 = {campo:"thr",  rot:"THRESHOLD", min:-54, max:0,   fmt:v=>v.toFixed(0)+" dB"};
  const ATK = {campo:"attack",rot:"ATTACK",   min:0,   max:120, fmt:v=>v.toFixed(0)+" ms"};
  const HLD = {campo:"hold", rot:"HOLD",  min:0.02, max:1.96, log:true, fmt:v=>v<1?(v*1000).toFixed(0)+" ms":v.toFixed(2)+" s"};
  const DEC = {campo:"decay",rot:"DECAY", min:0.005,max:42.3, log:true, fmt:v=>v<1?(v*1000).toFixed(0)+" ms":v.toFixed(2)+" s"};
  const REL = {campo:"release",rot:"RELEASE",min:0.005,max:42.3,log:true, fmt:v=>v<1?(v*1000).toFixed(0)+" ms":v.toFixed(2)+" s"};
  const RAT = {campo:"ratio",rot:"RATIO", lista:RATIOS, fmt:fmtRatio};
  const KNE = {campo:"knee", rot:"KNEE",  min:0, max:5, passo:1, fmt:v=>v<1?"HARD":v.toFixed(0)};
  const OUTp= {campo:"out",  rot:"OUT GAIN", min:0,  max:18, fmt:v=>"+"+v.toFixed(1)+" dB"};
  const OUTn= {campo:"out",  rot:"OUT GAIN", min:-18,max:0,  fmt:v=>v.toFixed(1)+" dB"};
  const RNG69={campo:"range",rot:"RANGE", min:-69,max:0, fmt:v=>v<=-69?"-∞":v.toFixed(0)+" dB"};
  const RNG70={campo:"range",rot:"RANGE", min:-70,max:0, fmt:v=>v.toFixed(0)+" dB"};
  const WID = {campo:"width",rot:"WIDTH", min:1,  max:90, fmt:v=>v.toFixed(0)+" dB"};
  const FRQ = {campo:"freq", rot:"FREQUENCY", min:1000, max:12500, log:true,
               fmt:v=>(v/1000).toFixed(2)+" kHz"};
  switch(tipo){
    case "GATE":        return [T72, RNG69, ATK, HLD, DEC];
    case "DUCKING":     return [T54, RNG70, ATK, HLD, DEC];
    case "COMPRESSOR":  return [T54, RAT, ATK, REL, KNE, OUTp];
    case "EXPANDER":    return [T54, RAT, ATK, REL, KNE, OUTp];
    case "COMPANDER-H":
    case "COMPANDER-S": return [T54, RAT, ATK, REL, WID, OUTn];
    case "DE-ESSER":    return [T54, FRQ];
    default:            return [T54];
  }
}
function popupDyn(area, qual){
  const c = S.canais[S.sel];
  const d = c[qual];
  const tipos = tiposDyn(c, qual);
  const b = molde(area, qual==="dyn1"?"DYNAMICS 1":"DYNAMICS 2", c.nome);

  /* canal de saída não tem DYNAMICS 2 (p.249) */
  if (qual==="dyn2" && ehSaida(c)){
    const av = el("div",null,"Canal de saída não tem DYNAMICS 2 — só a seção 1.");
    av.style.cssText="font-size:11px;color:#ffd45e";
    b.appendChild(av);
    return;
  }

  const lt = linhaTela();
  tipos.forEach(t=>{
    lt.appendChild(btTela(t, ()=>d.tipo===t, ()=>{ d.tipo=t;
      S.ajuda = "DYN "+(qual==="dyn1"?"1":"2")+" agora é <b>"+t+"</b>"; }));
  });
  lt.appendChild(btTela("ON", ()=>d.on, ()=>d.on=!d.on));
  b.appendChild(lt);

  /* os controles saem da TABELA do manual: cada tipo mostra os seus,
     com a sua faixa. Antes eu tinha 5 knobs fixos para DYN1 e 5 para DYN2,
     o que dava parâmetro errado (e faixa errada) em metade dos tipos. */
  const l = linhaTela();
  l.style.marginTop = "5px";
  paramsDyn(d.tipo).forEach(p=>{
    if (p.lista){                       /* RATIO: 16 pontos discretos */
      const idx = () => { const i = p.lista.indexOf(d[p.campo]);
        return i<0 ? p.lista.findIndex(x=>x>=d[p.campo]) : i; };
      l.appendChild(knobTela(p.rot,
        ()=>Math.max(0,idx()),
        v=>{ d[p.campo] = p.lista[clamp(Math.round(v),0,p.lista.length-1)]; },
        0, p.lista.length-1,
        v=>p.fmt(p.lista[clamp(Math.round(v),0,p.lista.length-1)])));
    } else if (p.log){                  /* tempos e frequência: escala log */
      l.appendChild(knobTela(p.rot,
        ()=>Math.log10(d[p.campo]||p.min),
        v=>{ d[p.campo] = Math.pow(10,v); },
        Math.log10(p.min), Math.log10(p.max),
        v=>p.fmt(Math.pow(10,v))));
    } else {
      l.appendChild(knobTela(p.rot, ()=>d[p.campo],
        v=>{ d[p.campo] = p.passo ? Math.round(v) : v; },
        p.min, p.max, p.fmt));
    }
  });
  b.appendChild(l);

  /* curva de transferência: mostra o que o compressor/gate faz de verdade */
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 120 120");
  svg.style.cssText="width:180px;height:180px;background:#15171a;border-radius:2px;margin-top:5px";
  const eixo = document.createElementNS("http://www.w3.org/2000/svg","path");
  eixo.setAttribute("d","M0,120 L120,0"); eixo.setAttribute("stroke","#3a3d42");
  eixo.setAttribute("stroke-width","0.7"); eixo.setAttribute("fill","none");
  const curva = document.createElementNS("http://www.w3.org/2000/svg","path");
  curva.setAttribute("stroke","var(--tela-verde)"); curva.setAttribute("stroke-width","1.6");
  curva.setAttribute("fill","none");
  svg.appendChild(eixo); svg.appendChild(curva);
  lig(()=>{
    const pts = [];
    for (let i=0;i<=60;i++){
      const inDb = -60 + i;                       /* -60..0 dB */
      let outDb = inDb;
      if (d.on){
        if (qual==="dyn1"){
          if (d.tipo==="GATE" || d.tipo==="DUCKING"){
            if (inDb < d.thr) outDb = inDb + (d.range||-70)*(d.tipo==="GATE"?1:0);
          } else if (inDb > d.thr){
            outDb = d.thr + (inDb - d.thr)/2;
          }
        } else {
          if (inDb > d.thr) outDb = d.thr + (inDb - d.thr)/Math.max(1,d.ratio);
          outDb += d.out || 0;
        }
      }
      const x = ((inDb+60)/60)*120;
      const y = 120 - clamp((outDb+60)/60,0,1.2)*120;
      pts.push(x.toFixed(1)+","+y.toFixed(1));
    }
    curva.setAttribute("d","M"+pts.join("L"));
  });
  b.appendChild(svg);
  const nota = el("div");
  nota.style.cssText="font-size:9px;color:#9aa0a8;margin-top:3px;line-height:1.4";
  lig(()=>{
    const p = paramsDyn(d.tipo);
    nota.innerHTML = "<b>"+d.tipo+"</b> — "+p.map(x=>x.rot).join(" · ")+
      "<br>Tipos deste canal: "+tipos.join(" · ")+
      (ehSaida(c) ? " (lista de canal de SAÍDA)" : "");
  });
  b.appendChild(nota);
}

  nomeCx.appendChild(linha1); nomeCx.appendChild(campo);
  ico.addEventListener("pointerdown",()=>{ S.pnAba="ICON"; pedirRender(); });
  topo.appendChild(porta); topo.appendChild(ico); topo.appendChild(nomeCx);

  /* corpo conforme a aba */
  const corpo = el("div");

      if (t==="BS")        c.nome = c.nome.slice(0,-1);
      else if (t==="CLEAR")c.nome = "";
      else if (t==="SPACE")c.nome = (c.nome+" ").slice(0,8);
      else if (t==="SHIFT LOCK") S.pnShift = !S.pnShift;
      else if (t==="ENTER"){ fecharPopup(); }
      else if (t.length===1) c.nome = (c.nome + (S.pnShift?t.toUpperCase():t)).slice(0,8);
      S.ajuda = "Nome do canal: <b>"+c.nome+"</b> (até 8 caracteres, como na fita)";
      pedirRender();
    };
    const fx = linhaTela();
    ["CLEAR","BS","SPACE"].forEach(t=>{
      const bt = el("button","tbt",t); bt.type="button";
      bt.addEventListener("pointerdown",()=>escreve(t));
      fx.appendChild(bt);
    });
    corpo.appendChild(fx);
    TECLADO.forEach(linha=>{
      const l = el("div");
      l.style.cssText="display:flex;gap:2px;margin-top:2px;justify-content:center";
      linha.forEach(t=>{

      const bt = el("button","tbt", em+" "+nome);

      g.appendChild(bt);

    const portas = (c.tipo==="in"||c.tipo==="stin") ? PORTAS_ENTRADA : PORTAS_SAIDA;

        S.ajuda = "<b>"+c.nome+"</b> ligado em "+p; pedirRender(); });
      g.appendChild(bt);
    });
    corpo.appendChild(g);

  b.appendChild(corpo);

  /* abas embaixo, como na figura */
  const abas = el("div");
  abas.style.cssText="display:flex;gap:3px;margin-top:5px";
  ["PATCH","ICON","NAME"].forEach(a=>{
    const bt = btTela(a, ()=>S.pnAba===a, ()=>S.pnAba=a);
    bt.style.cssText="font-size:10px;padding:3px 12px";

S.patchAba = "saida";
/* ==================================================================
   HA / PATCH  (p.61-62) — 1 ch · 8 ch · ALL
   ==================================================================
   Quem manda no GAIN aqui é o ENCODER, não o mouse: na 1 ch é o encoder 3
   (o manual nomeia o número); na 8 ch são os 1–8, um por canal; na ALL você
   toca o knob para pôr a moldura e então gira os 1–8. */
const ENTRADA_TEM_HA = p => /^(INPUT|ST IN|OMNI IN|SLOT)/i.test(p || "");

function haLinha(id, nEnc, compacta){
  const c = S.canais[id];
  const linha = el("div");
  linha.style.cssText = "display:flex;align-items:center;gap:4px;background:#26292d;"+
    "border:1px solid #3d4147;border-radius:2px;padding:2px 4px;min-width:0";

  /* 1 — tecla de seleção de canal: "ao apertar, o canal é selecionado e o
     [SEL] correspondente acende" (p.62) */
  const nm = el("button","tbt", rotuloCurto(c)+" "+c.nome);
  nm.type = "button";
  nm.style.cssText = "flex:0 0 "+(compacta?"78px":"104px")+";overflow:hidden;"+
    "white-space:nowrap;text-align:left;font-size:8.5px";
  nm.addEventListener("pointerdown",e=>{ e.stopPropagation(); S.sel = id;
    S.ajuda = "Canal <b>"+c.nome+"</b> selecionado (o [SEL] dele acendeu)"; pedirRender(); });
  lig(()=>nm.classList.toggle("on", id===S.sel));
  linha.appendChild(nm);

  const porta = S.patch.entrada[id] || "";
  const temHA = ENTRADA_TEM_HA(porta);

  /* 2 — INPUT PATCH: abre a seleção de porta de entrada */
  if (!compacta){
    const bp = el("button","tbt", porta || "—"); bp.type="button";
    bp.style.cssText = "flex:0 0 82px;font-size:8px;overflow:hidden;white-space:nowrap";
    bp.addEventListener("pointerdown",e=>{ e.stopPropagation();
      S.patchAba = "entrada"; abrirPopup("PATCH"); pedirRender(); });
    linha.appendChild(bp);
  }

  /* 4 — GAIN + meter da porta, do lado direito do knob (p.62) */
  const k = el("div","knob mini"); k.style.setProperty("--kd", compacta?"17px":"22px");
  const vv = el("span"); vv.style.cssText="font-size:8px;width:26px;text-align:right";
  const met = el("div"); met.style.cssText =
    "width:5px;height:"+(compacta?"14px":"18px")+";background:#15171a;border-radius:1px;"+
    "position:relative;overflow:hidden;flex:0 0 auto";
  const barra = el("div"); barra.style.cssText =
    "position:absolute;left:0;right:0;bottom:0;background:var(--tela-verde)";
  met.appendChild(barra);

  /* p.62: "o knob GAIN, o botão +48V e o botão ø só valem para canais cuja
     porta de entrada é um jack INPUT/ST IN/OMNI ou um slot com head amp
     externo". Sem isso o aluno mexe num ganho que não existe. */
  if (temHA){
    k.style.cursor = "pointer";
    k.addEventListener("pointerdown", e=>{ e.stopPropagation();
      S.sel = id; S.encFoco = "ha"; telaChave = null;
      S.ajuda = "GAIN de <b>"+c.nome+"</b> — gire o encoder "+(nEnc+1)+" da Centralogic";
      pedirRender(); });
    registrarEncoder(nEnc, { rot:c.nome+" GAIN", min:-62, max:10,
      ler:()=>c.ha.gain, escrever:v=>{ c.ha.gain = v; } });
  } else {
    k.style.opacity = ".25";
  }
  const p48 = el("button","tbt laranja","+48"); p48.type="button"; p48.style.fontSize="7.5px";
  const ph  = el("button","tbt","ø");           ph.type="button";  ph.style.fontSize="8px";
  if (temHA){
    p48.addEventListener("pointerdown",e=>{ e.stopPropagation(); c.ha.phantom=!c.ha.phantom;
      S.ajuda="Phantom +48V "+(c.ha.phantom?"LIGADO":"desligado")+" em <b>"+c.nome+"</b>"; pedirRender(); });
    ph.addEventListener("pointerdown",e=>{ e.stopPropagation(); c.ha.phase=!c.ha.phase;
      S.ajuda="Polaridade de <b>"+c.nome+"</b> "+(c.ha.phase?"INVERTIDA":"normal"); pedirRender(); });
  } else { p48.disabled = true; ph.disabled = true; p48.style.opacity=".25"; ph.style.opacity=".25"; }

  linha.appendChild(k); linha.appendChild(met); linha.appendChild(vv);
  linha.appendChild(p48); linha.appendChild(ph);
  if (!temHA){
    const av = el("span",null,"sem head amp");
    av.style.cssText="font-size:7.5px;color:#7d838a;margin-left:auto";
    linha.appendChild(av);
  }
  lig(()=>{
    k.style.setProperty("--ang", anguloDe(c.ha.gain,-62,10)+"deg");
    k.classList.toggle("emfoco", temHA && S.encFoco==="ha" && id===S.sel);
    vv.textContent = c.ha.gain.toFixed(0)+" dB";
    barra.style.height = Math.round(clamp(c.nivel,0,1)*100)+"%";
    p48.classList.toggle("on", c.ha.phantom);
    ph.classList.toggle("on", c.ha.phase);
  });
  return linha;
}

TELAS_POPUP.HA = function(area){
  const b = molde(area,"HA / PATCH","head amp: ganho, phantom e polaridade · p.61",
    { abas:["1ch","8ch","ALL"] });
  limparEncoders();
  S.encRotulo = "HA GAIN";
  const cx = el("div");
  cx.style.cssText="display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0";

  if (S.popAba === "1ch"){
    /* p.61: na visão de 1 canal o ganho vai no ENCODER 3 -- não é escolha
       minha, o manual diz o número. */
    cx.appendChild(haLinha(S.sel, 2, false));
    const n = el("div",null,
      "Visão 1 ch — o ganho responde ao <b>encoder 3</b> da Centralogic (p.61). "+
      "Troque de canal pelas teclas [SEL].");

    grupoTela().forEach((id,i)=>{ if (S.canais[id]) cx.appendChild(haLinha(id, i, false)); });
    const n = el("div",null,
      "Visão 8 ch — <b>encoders 1 a 8</b>, um para cada linha. As NAVIGATION KEYS "+

    /* ALL: todos os canais de entrada; os encoders seguem o grupo de 8 da tela */
    const g8 = grupoTela();

/* ==================================================================
   TO STEREO / MONO  (p.63-64) — 8 ch · ALL
   ==================================================================
   Só existe em 8 ch e ALL, e o botão MODE troca o canal entre ST/MONO e LCR.
   Em LCR o par STEREO/MONO vira um botão só e aparece o CSR. */
function tostLinha(id, nEnc, compacta){
  const c = S.canais[id];
  const linha = el("div");
  linha.style.cssText="display:flex;align-items:center;gap:4px;background:#26292d;"+
    "border:1px solid #3d4147;border-radius:2px;padding:2px 4px;min-width:0";

  const nm = el("button","tbt", rotuloCurto(c)+" "+c.nome); nm.type="button";
  nm.style.cssText="flex:0 0 "+(compacta?"78px":"104px")+";overflow:hidden;"+
    "white-space:nowrap;text-align:left;font-size:8.5px";
  nm.addEventListener("pointerdown",e=>{ e.stopPropagation(); S.sel=id;
    S.ajuda="Canal <b>"+c.nome+"</b> selecionado"; pedirRender(); });
  lig(()=>nm.classList.toggle("on", id===S.sel));
  linha.appendChild(nm);

  /* estéreo (ST IN e MIX estéreo) mostra BALANCE; mono mostra PAN (p.64) */
  const ehEstereo = c.tipo === "stin";
  const rotPan = ehEstereo ? "BALANCE" : "PAN";

  if (!compacta){
    const modo = el("div");
    modo.style.cssText="display:flex;flex-direction:column;align-items:center;flex:0 0 46px";
    const ind = el("div"); ind.style.cssText="font-size:7px;color:#ffd45e";
    const bm = el("button","tbt","MODE"); bm.type="button"; bm.style.fontSize="7.5px";
    bm.addEventListener("pointerdown",e=>{ e.stopPropagation(); c.lcr = !c.lcr;
      S.ajuda = "<b>"+c.nome+"</b> em modo <b>"+(c.lcr?"LCR":"ST/MONO")+"</b> — "+
        (c.lcr ? "STEREO e MONO ligam juntos e o CSR reparte o nível"
               : "STEREO e MONO ligam separados");
      telaChave=null; pedirRender(); });
    lig(()=>{ ind.textContent = c.lcr ? "LCR" : "ST/MONO"; });
    modo.appendChild(ind); modo.appendChild(bm);
    linha.appendChild(modo);
  }

  /* botões: ST + MONO separados, ou LCR único */
  if (c.lcr){
    const bl = el("button","tbt","LCR"); bl.type="button"; bl.style.fontSize="8px";
    bl.addEventListener("pointerdown",e=>{ e.stopPropagation(); c.lcrOn=!c.lcrOn;
      S.ajuda="<b>"+c.nome+"</b> "+(c.lcrOn?"vai":"NÃO vai")+" para STEREO+MONO"; pedirRender(); });
    lig(()=>bl.classList.toggle("on", c.lcrOn));
    linha.appendChild(bl);
  } else {
    const bs = el("button","tbt","ST"); bs.type="button"; bs.style.fontSize="8px";
    const bo = el("button","tbt","MONO"); bo.type="button"; bo.style.fontSize="8px";
    bs.addEventListener("pointerdown",e=>{ e.stopPropagation(); c.toSt=!c.toSt;
      S.ajuda="<b>"+c.nome+"</b> "+(c.toSt?"vai":"NÃO vai")+" para o STEREO"; pedirRender(); });
    bo.addEventListener("pointerdown",e=>{ e.stopPropagation(); c.toMono=!c.toMono;
      S.ajuda="<b>"+c.nome+"</b> "+(c.toMono?"vai":"não vai")+" para o MONO"; pedirRender(); });
    lig(()=>{ bs.classList.toggle("on",c.toSt); bo.classList.toggle("on",c.toMono); });
    linha.appendChild(bs); linha.appendChild(bo);
  }

  /* CSR — só em LCR (p.64), 0 a 100% */
  if (c.lcr && !compacta){
    const kc = el("div","knob mini"); kc.style.setProperty("--kd","20px");
    const vc = el("span"); vc.style.cssText="font-size:7.5px;width:30px";
    kc.style.cursor="pointer";
    kc.addEventListener("pointerdown",e=>{ e.stopPropagation(); S.sel=id;
      S.encFoco="csr"; telaChave=null;
      S.ajuda="<b>CSR</b> de "+c.nome+" — encoder "+(nEnc+1)+" (0% = pan comum, "+
              "nada vai para o MONO)"; pedirRender(); });
    lig(()=>{ kc.style.setProperty("--ang", anguloDe(c.csr,0,100)+"deg");
      kc.classList.toggle("emfoco", S.encFoco==="csr" && id===S.sel);
      vc.textContent = "CSR "+c.csr.toFixed(0)+"%"; });
    linha.appendChild(kc); linha.appendChild(vc);
    if (nEnc >= 0 && S.encFoco === "csr")
      registrarEncoder(nEnc, { rot:c.nome+" CSR", min:0, max:100,
        ler:()=>c.csr, escrever:v=>{ c.csr = v; } });
  }

  /* PAN / BALANCE + indicador OVER (p.64) */
  const kp = el("div","knob mini"); kp.style.setProperty("--kd", compacta?"17px":"20px");
  const vp = el("span"); vp.style.cssText="font-size:7.5px;width:38px";
  const over = el("div"); over.style.cssText=
    "width:5px;height:5px;border-radius:50%;background:#3d4147;flex:0 0 auto";
  kp.style.cursor="pointer";
  kp.addEventListener("pointerdown",e=>{ e.stopPropagation(); S.sel=id;
    S.encFoco="pan"; telaChave=null;
    S.ajuda="<b>"+rotPan+"</b> de "+c.nome+" — encoder "+(nEnc+1)+" da Centralogic";
    pedirRender(); });
  lig(()=>{
    kp.style.setProperty("--ang", anguloDe(c.pan,-1,1)+"deg");
    const emf = S.encFoco==="pan" && (compacta ? id===S.sel : true);
    kp.classList.toggle("emfoco", emf);
    kp.classList.toggle("dupla",  emf);          /* moldura dupla = PAN, p.31 */
    vp.textContent = (compacta?"":rotPan+" ")+textoPan(c.pan);
    over.style.background = c.nivel > 0.97 ? "#ff3b30" : "#3d4147";
  });
  linha.appendChild(kp); linha.appendChild(over); linha.appendChild(vp);
  if (nEnc >= 0 && S.encFoco !== "csr")
    registrarEncoder(nEnc, { rot:c.nome+" "+rotPan, min:-1, max:1,
      ler:()=>c.pan, escrever:v=>{ c.pan = v; } });
  return linha;
}

/* ---- INSERT / DIRECT OUT (1 ch), p.110-112 ----
   Ponto de inserção e direct out COM porta escolhível. Os campos nascem
   preguiçosos no canal (insIn/insOut/doutPorta/doutLvl) para não mexer no

    [sel1, sel2].forEach(sl=>{
      sl.style.cssText="background:#15171a;color:var(--tela-texto);border:1px solid #3d4147;"+

    const l1=linhaTela(); l1.appendChild(el("span",null,"OUT →")); l1.appendChild(sel1);
    l1.appendChild(el("span",null,"IN ←")); l1.appendChild(sel2);
    cx.appendChild(l1);
    cx.appendChild(btTela("INSERT ON", ()=>c.insert, ()=>{ c.insert=!c.insert;
      S.ajuda="INSERT "+(c.insert?"ligado":"desligado")+" — o sinal desvia por "+c.insOut; }));
    const n1=el("div",null,"O insert desvia o sinal do canal por um rack (GEQ/efeito) e volta.");
    n1.style.cssText="font-size:8.5px;color:#9aa0a8"; cx.appendChild(n1);
    l.appendChild(cx);
  }
  if (c.tipo === "in"){
    const cx = caixaTela("DIRECT OUT");
    const sel = el("select");
    sel.style.cssText="background:#15171a;color:var(--tela-texto);border:1px solid #3d4147;"+
      "border-radius:2px;font-size:9px;padding:1px";

     ...Array.from({length:16},(_,i)=>"SLOT1-"+(i+1))].forEach(pn=>{
      const o=el("option",null,pn); o.value=pn; sel.appendChild(o); });

    sel.addEventListener("change",()=>{ c.doutPorta=sel.value; pedirRender(); });
    const l2=linhaTela(); l2.appendChild(el("span",null,"PORTA")); l2.appendChild(sel);
    l2.appendChild(knobTela("LEVEL", ()=>c.doutLvl, v=>c.doutLvl=v, -60, 10,
      v=>(v>0?"+":"")+v.toFixed(1)+" dB"));
    l2.appendChild(btTela("D.OUT ON", ()=>c.dout, ()=>{ c.dout=!c.dout; }));
    cx.appendChild(l2);
    const n2=el("div",null,"Saída direta do canal (pré-mix) — é o que alimenta a gravação multitrack.");
    n2.style.cssText="font-size:8.5px;color:#9aa0a8"; cx.appendChild(n2);
    l.appendChild(cx);
  }
  b.appendChild(l);
};

    if (S.cena.sel===0){ S.ajuda="A cena 000 é protegida"; pedirRender(); return; }
    S.cena.lista = S.cena.lista.filter(x=>x.n!==S.cena.sel);
    S.ajuda="Cena "+num3(S.cena.sel)+" apagada"; pedirRender();
  });
  bts.appendChild(bR); bts.appendChild(bS); bts.appendChild(bC);

  /* edição de cenas (p.140-145): copiar, colar, cortar, inserir, renomear */
  const acao = (rot, fn) => { const x = el("button","tbt",rot); x.type="button";
    x.addEventListener("pointerdown",()=>{ fn(); pedirRender(); }); bts.appendChild(x); };
  acao("COPY", ()=>{
    const r = S.cena.lista.find(x=>x.n===S.cena.sel);
    if (!r){ S.ajuda="Cena vazia — nada a copiar"; return; }
    S.cenaCopia = JSON.parse(JSON.stringify(r));
    S.ajuda = "Cena "+num3(r.n)+" copiada";
  });
  acao("PASTE", ()=>{
    if (!S.cenaCopia){ S.ajuda="Nada copiado ainda"; return; }
    if (S.cena.sel===0){ S.ajuda="A cena 000 é protegida"; return; }
    const nova = JSON.parse(JSON.stringify(S.cenaCopia));
    nova.n = S.cena.sel;
    S.cena.lista = S.cena.lista.filter(x=>x.n!==S.cena.sel).concat(nova).sort((a,b)=>a.n-b.n);
    S.ajuda = "Colado na cena "+num3(S.cena.sel);
  });
  acao("CUT", ()=>{
    const r = S.cena.lista.find(x=>x.n===S.cena.sel);
    if (!r || r.bloq){ S.ajuda="Cena vazia ou protegida"; return; }
    S.cenaCopia = JSON.parse(JSON.stringify(r));
    S.cena.lista = S.cena.lista.filter(x=>x.n!==S.cena.sel);
    S.ajuda = "Cena "+num3(r.n)+" recortada";
  });
  acao("INSERT", ()=>{
    /* empurra as cenas seguintes um número para baixo, como na mesa */
    S.cena.lista.forEach(x=>{ if (x.n >= S.cena.sel && x.n>0) x.n++; });
    if (S.cenaCopia){
      const nova = JSON.parse(JSON.stringify(S.cenaCopia)); nova.n = S.cena.sel;
      S.cena.lista.push(nova);
    }
    S.cena.lista.sort((a,b)=>a.n-b.n);
    S.ajuda = "Inserido em "+num3(S.cena.sel)+" — as seguintes andaram um número";
  });
  acao("RENAME", ()=>{
    const r = S.cena.lista.find(x=>x.n===S.cena.sel);
    if (!r || r.bloq){ S.ajuda="Cena vazia ou protegida"; return; }
    S.renomeando = r; abrirPopup("SCENE_STORE");
  });
  const nota = el("div",null,
    "Na mesa real o recall move os faders motorizados. Canais com RECALL SAFE ligado não mudam.");
  nota.style.cssText="font-size:9px;color:#9aa0a8;line-height:1.35";
  bts.appendChild(nota);
  l.appendChild(bts);
  b.appendChild(l);
};

/* ---- RACK: GEQ 31 bandas + efeitos (p.171) ---- */
/* Racks 1-4 = só GEQ; 5-8 = GEQ ou EFFECT (p.172).
   PATCH de fábrica (p.46): "Racks 5–8 are assigned to the ST IN channels" —
   a SAÍDA dos efeitos volta nos ST IN 1-4. A ENTRADA de fábrica é vazia; o
   simulador já nasce com MIX 13-16 → racks 5-8, que é o send/return que a
   p.181 ensina a montar (⚠️ escolha do simulador para a aula funcionar de
   primeira — configurável na tela RACK, como na mesa). */
S.rack = Array.from({length:8},(_,i)=>({
  n:i+1,
  tipo: i<4 ? "GEQ" : "EFFECT",
  geq: new Array(31).fill(0),
  efeito: ["REV-X HALL","STEREO DELAY","CHORUS","REV-X PLATE"][i-4] || "REV-X HALL",
  entrada: i>=4 ? "MIX"+(9+i) : null,       /* rack5=MIX13 … rack8=MIX16 */
  saida:   i>=4 ? "ST"+(i-3)  : null,       /* rack5=ST IN1 … rack8=ST IN4 */
  param:{ tempo:500, mix:35 }
}));
const FREQ_GEQ = [20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,
                  1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
/* Os 41 tipos oficiais, copiados do apêndice "Effect Type List" (p.252).
   A 1ª versão tinha 13 nomes aproximados ("EQ601", "OPEN DECK") que não
   existem escritos assim na mesa. */
const EFEITOS = [
  "REVERB HALL","REVERB ROOM","REVERB STAGE","REVERB PLATE","EARLY REF.",
  "GATE REVERB","REVERSE GATE","MONO DELAY","STEREO DELAY","MOD.DELAY",
  "DELAY LCR","ECHO","CHORUS","FLANGE","SYMPHONIC","PHASER","AUTO PAN",
  "TREMOLO","HQ.PITCH","DUAL PITCH","ROTARY","RING MOD.","MOD.FILTER",
  "DISTORTION","AMP SIMULATE","DYNA.FILTER","DYNA.FLANGE","DYNA.PHASER",
  "MULTI FILTER","FREEZE","ST REVERB","M.BAND COMP",
  "REV-X HALL","REV-X ROOM","REV-X PLATE",
  "COMP276","COMP276S","COMP260","COMP260S","EQUALIZER601","OPENDECK",
];
/* famílias, para o aluno achar o efeito sem decorar 41 nomes */
const FAMILIA_EFEITO = e =>
  /REVERB|REV-X|EARLY|GATE REVERB|REVERSE/.test(e) ? "REVERB" :
  /DELAY|ECHO/.test(e)                             ? "DELAY"  :
  /CHORUS|FLANGE|SYMPHONIC|PHASER|TREMOLO|AUTO PAN|ROTARY/.test(e) ? "MODULAÇÃO" :
  /PITCH|RING|FILTER|DISTORTION|AMP|FREEZE/.test(e) ? "ESPECIAL" : "DINÂMICA / EQ";
S.rackSel = 0;
TELAS_POPUP.RACK = function(area){
  const b = molde(area,"VIRTUAL RACK","racks 1-4: GEQ · racks 5-8: GEQ ou efeito");
  const abas = linhaTela();
  S.rack.forEach((r,i)=>{
    abas.appendChild(btTela(String(r.n)+" "+r.tipo, ()=>S.rackSel===i, ()=>{ S.rackSel=i;
      S.ajuda="Rack "+r.n+" — "+r.tipo; }));
  });
  b.appendChild(abas);

  const r = S.rack[S.rackSel];
  const cx = caixaTela(null);
  cx.style.marginTop = "5px";

  if (r.n>4){
    const lt = linhaTela();
    lt.appendChild(btTela("GEQ", ()=>r.tipo==="GEQ", ()=>{ r.tipo="GEQ"; }));
    lt.appendChild(btTela("EFFECT", ()=>r.tipo==="EFFECT", ()=>{ r.tipo="EFFECT"; }));
    cx.appendChild(lt);
  }

  if (r.tipo==="GEQ"){
    const g = el("div");
    g.style.cssText="display:flex;gap:1px;align-items:flex-end;margin-top:5px";
    FREQ_GEQ.forEach((f,i)=>{
      const col = el("div"); col.style.cssText="display:flex;flex-direction:column;align-items:center;gap:1px";
      const trilho = el("div");
      trilho.style.cssText="width:9px;height:74px;background:#15171a;border-radius:1px;position:relative;cursor:ns-resize";
      const cur = el("div");
      cur.style.cssText="position:absolute;left:-1px;width:11px;height:6px;border-radius:1px;"+
        "background:linear-gradient(180deg,#e6e8ea,#9a9da2);border:1px solid #17191b";
      trilho.appendChild(cur);
      const meio = el("div");
      meio.style.cssText="position:absolute;left:0;right:0;top:50%;height:1px;background:#3a3d42";
      trilho.appendChild(meio);
      trilho.style.touchAction="none";
      let base=null, y0=0;
      trilho.addEventListener("pointerdown",ev=>{ ev.stopPropagation(); base=r.geq[i]; y0=ev.clientY;
        try{trilho.setPointerCapture(ev.pointerId);}catch(e){} });
      trilho.addEventListener("pointermove",ev=>{
        if (base===null) return;
        r.geq[i] = clamp(base + (y0-ev.clientY)/74*30, -15, 15);   /* ±15 dB, MEDIDO */
        S.ajuda = "GEQ rack "+r.n+" · "+(f>=1000?(f/1000)+"k":f)+" Hz: "+
                  (r.geq[i]>0?"+":"")+r.geq[i].toFixed(1)+" dB";
        pedirRender();
      });
      const solta=()=>base=null;
      trilho.addEventListener("pointerup",solta); trilho.addEventListener("pointercancel",solta);
      lig(()=>{ cur.style.top = (50 - r.geq[i]/15*50)+"%"; cur.style.marginTop="-3px"; });
      const rot = el("div",null, f>=1000?(f/1000)+"k":String(f));
      rot.style.cssText="font-size:5px;color:#8f959c;writing-mode:vertical-rl;height:22px";
      col.appendChild(trilho); col.appendChild(rot);
      g.appendChild(col);
    });
    cx.appendChild(g);
    const l2 = linhaTela();
    const flat = el("button","tbt","FLAT"); flat.type="button";
    flat.addEventListener("pointerdown",()=>{ r.geq.fill(0); S.ajuda="GEQ zerado"; pedirRender(); });
    l2.appendChild(flat);
    const nota = el("div",null,"31 bandas · ±15 dB · na mesa real os 8 faders da Centralogic pegam 8 bandas por vez");
    nota.style.cssText="font-size:9px;color:#9aa0a8";
    l2.appendChild(nota);
    cx.appendChild(l2);
  } else {
    /* 41 tipos agrupados por família — decorar a lista inteira não é o
       objetivo; achar o efeito certo é. */
    const famAtual = FAMILIA_EFEITO(r.efeito);
    const fams = ["REVERB","DELAY","MODULAÇÃO","ESPECIAL","DINÂMICA / EQ"];
    const lf = linhaTela(); lf.style.marginTop="5px";
    fams.forEach(f=>{
      lf.appendChild(btTela(f, ()=>(r.fam||famAtual)===f, ()=>{ r.fam=f; }));
    });
    cx.appendChild(lf);
    const lt = el("div"); lt.style.cssText="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px";
    EFEITOS.filter(e=>FAMILIA_EFEITO(e)===(r.fam||famAtual)).forEach(e=>{
      lt.appendChild(btTela(e, ()=>r.efeito===e, ()=>{ r.efeito=e;
        S.ajuda="Rack "+r.n+" — efeito <b>"+e+"</b>"; }));
    });
    cx.appendChild(lt);
    const lp = linhaTela(); lp.style.marginTop="6px";
    lp.appendChild(knobTela("TIME/TEMPO", ()=>r.param.tempo, v=>r.param.tempo=v, 20, 3000, v=>v.toFixed(0)+" ms"));
    lp.appendChild(knobTela("MIX", ()=>r.param.mix, v=>r.param.mix=v, 0, 100, v=>v.toFixed(0)+" %"));
    const tap = el("button","tbt","TAP TEMPO"); tap.type="button";
    let ultimo = 0;
    tap.addEventListener("pointerdown",()=>{
      const agora = performance.now();
      if (ultimo && agora-ultimo < 3000){
        r.param.tempo = Math.round(agora-ultimo);
        S.ajuda = "TAP TEMPO: "+r.param.tempo+" ms ("+Math.round(60000/r.param.tempo)+" BPM)";
      } else S.ajuda = "TAP TEMPO — bata de novo no ritmo";
      ultimo = agora; pedirRender();
    });
    lp.appendChild(tap);
    cx.appendChild(lp);
  }
  b.appendChild(cx);
};

  b.appendChild(l);
  const nota = el("div",null,

/* O brilho MEXE no painel de verdade: BANK A é o ajuste de dia e BANK B o
   de show com a casa escura. Guardar o número sem mudar nada seria enfeite. */
function aplicarBrilho(){
  const b = S.sys.brilho[S.sys.brilhoBanco];
  const raiz = document.documentElement;
  raiz.style.setProperty("--brilho-tela",  b.screen.toFixed(2));
  raiz.style.setProperty("--brilho-led",   b.panel.toFixed(2));
  const tela = document.getElementById("tela");
  if (tela) tela.style.filter = "brightness("+(0.45 + b.screen*0.75).toFixed(2)+")";
  const mesa2 = document.getElementById("mesa");
  if (mesa2) mesa2.style.setProperty("--led-brilho", String(b.panel));
}

/* ==================================================================
   ZOOM-TO-FIT
   A mesa é desenhada num palco fixo de 1920x1000 e depois escalada.
   SEM isto o painel fica cortado -- e um painel cortado é exatamente
   o que faz as proporções parecerem erradas.
   Nota do projeto: NÃO derivar a altura da largura (aspect-ratio) --
   foi o que já cortou simulador em tela cheia antes.
   ================================================================== */
const palco = document.getElementById("palco");
function ajustarZoom(){
  const lw = window.innerWidth, lh = window.innerHeight;
  const k = Math.min(lw / 1920, lh / 1044);
  palco.style.transform = "scale(" + k.toFixed(4) + ")";
}
window.addEventListener("resize", ajustarZoom);
ajustarZoom();

/* contrato html.smu-fs: o player avisa por postMessage quando entra em
   tela cheia; o simulador responde só com CSS + um novo cálculo de zoom */
window.addEventListener("message", ev=>{
  const d = ev && ev.data;
  if (!d) return;
  const tipo = typeof d === "string" ? d : d.type || d.tipo;
  if (tipo === "smu-fs-on"  || tipo === "smu:fullscreen:on")  document.documentElement.classList.add("smu-fs");
  if (tipo === "smu-fs-off" || tipo === "smu:fullscreen:off") document.documentElement.classList.remove("smu-fs");
  requestAnimationFrame(ajustarZoom);
});

/* ---------- EXPANDIR A TELA ----------
   Recurso do SIMULADOR (a console real não faz isso): a tela da M7CL é
   pequena de propósito -- 16,8 % da largura da mesa, medido -- e num
   notebook fica ilegível. Por isso vem rotulado como recurso do simulador.

   A tela é MOVIDA para o overlay e devolvida ao lugar depois. Mover, e não
   copiar, mantém UM único #tela: o estado, os listeners e as ligações de
   render continuam valendo, sem nenhuma sincronização entre duas cópias. */
const btLupa   = document.getElementById("lupa");
const btFechar = document.getElementById("fechar-lupa");
const overlay  = document.getElementById("overlay");
const molduraOv= document.getElementById("overlay-moldura");
const telaEl   = document.getElementById("tela");
const espacoEl = document.getElementById("lcd-espaco");   /* recorta e escala */
let expandida = false;

/* Encaixa o LCD (640x480) no espaço disponível, por ESCALA.
   É o mesmo desenho na mesa e ampliado -- só muda o zoom. */
function escalarLCD(lw, lh){
  const k = Math.min(lw / 640, lh / 480);
  telaEl.style.transform = "scale(" + k.toFixed(4) + ")";
  espacoEl.style.width  = Math.round(640*k)+"px";
  espacoEl.style.height = Math.round(480*k)+"px";
  return k;
}

function dimensionarTelaExpandida(){
  if (!expandida) return;
  /* AMPLIAR = ZOOM em duas camadas, sem medir pedaço de flexbox:
     1. o LCD fica numa escala FIXA e nítida dentro do palco (640x480 x1,6);
     2. o PALCO inteiro (tela + SELECTED CHANNEL + Centralogic + navegação +
        transporte) é medido SEM transform e escalado como UM bloco.
     A versão anterior calculava a tela descontando a largura da coluna e a
     altura dos blocos -- medida parcial em flexbox mente (a coluna encolhe,
     a conta infla, a tela engole o resto) e foi o que cortou tudo. */
  escalarLCD(1024, 768);
  const palco = document.getElementById("ov-palco");
  if (!palco) return;
  palco.style.transform = "none";          /* mede no tamanho natural */
  const w = palco.offsetWidth, h = palco.offsetHeight;
  if (!w || !h) return;
  const k = Math.min((window.innerWidth - 24) / w, (window.innerHeight - 24) / h);
  palco.style.transform = "scale(" + k.toFixed(4) + ")";
}
/* na mesa, o LCD ocupa o espaço físico medido na planta */
function encaixarLCDnaMesa(){
  escalarLCD(MED.lcd, Math.round(MED.lcd/1.315));
}

/* As NAVIGATION KEYS ficam na mesa, ATRÁS do overlay — com a tela ampliada
   o aluno não conseguia trocar de grupo de canais e a tela parecia travada.
   Aqui elas são repetidas dentro do overlay, junto com a barra de transporte. */
function montarNavOverlay(){
  const nv = document.getElementById("navov");
  if (!nv) return;
  nv.innerHTML = "";
  NAVS.forEach(n=>{
    const b = el("button", null, n.rot);
    b.type = "button";
    b.classList.toggle("on", S.nav === n.id);
    b.addEventListener("click", ()=>{
      S.navAnterior = (S.nav !== "DCA") ? S.nav : S.navAnterior;
      S.nav = n.id;
      S.ajuda = "Tela mostrando <b>"+n.rot+"</b>";
      telaChave = null;
      montarNavOverlay();
      pedirRender();
    });
    nv.appendChild(b);
  });
  /* a barra de transporte vive no rodapé da mesa; com a tela ampliada ela
     fica escondida, então trago uma cópia funcional para cá */
  if (!nv.querySelector("#smu-ov")){
    const barra = fazBarraTransporte();
    barra.id = "smu-ov";
    barra.style.cssText += ";width:100%;margin-top:6px;border-radius:4px;border-top:0";
    nv.appendChild(barra);
  }
}

/* ------------------------------------------------------------------
   AUXILIARES QUE VÃO JUNTO COM A TELA AMPLIADA
   ------------------------------------------------------------------
   Ordem do dono: com a tela grande têm de vir junto os controles que a
   acompanham na mesa -- a seção SELECTED CHANNEL (HA, PAN, HPF, dinâmica,
   EQ: os 33 knobs) e os 8 strips da Centralogic, que são a mão do operador
   naquela tela.

   Eles são MOVIDOS, não copiados. Uma cópia perderia os tratadores e viraria
   exatamente o "botão que finge" -- e uma segunda cópia do mesmo knob
   dessincronizaria do original. Voltam ao lugar quando a tela reduz, cada um
   guardando o pai e a posição de origem. */
const AUX_AMPLIADA = [
  { sel: ".selch",             onde: "esq" },   /* SELECTED CHANNEL: 33 knobs */
  { sel: "#bloco-centralogic", onde: "baixo" }, /* os 8 strips da Centralogic */
];
const auxOrigem = new Map();

function moverAux(paraOverlay){
  for (const {sel, onde} of AUX_AMPLIADA){
    const nó = document.querySelector(sel);
    if (!nó) continue;
    if (paraOverlay){
      if (!auxOrigem.has(sel)) auxOrigem.set(sel, { pai: nó.parentNode, irmão: nó.nextSibling });
      const caixa = document.getElementById(onde === "esq" ? "aux-esq" : "aux-baixo");
      if (caixa) caixa.appendChild(nó);
    } else {
      const o = auxOrigem.get(sel);
      if (o && o.pai) o.pai.insertBefore(nó, o.irmão);
    }
  }
  /* a Centralogic tem largura FIXA em px (medida na planta). No palco do
     overlay ela ganha um tamanho fixo confortável (o palco escala inteiro);
     na mesa volta ao valor medido. */
  const cl = document.getElementById("bloco-centralogic");
  if (cl) cl.style.width = paraOverlay ? "620px" : MED.centralog+"px";
  const sc = document.querySelector(".selch");
  if (sc) sc.style.width = paraOverlay ? "" : MED.selch+"px";
}

function expandirTela(on){
  expandida = on;
  if (on){
    montarNavOverlay();
    /* move o ESPAÇO inteiro (que já recorta e escala), não só a tela */
    molduraOv.appendChild(espacoEl);
    moverAux(true);
    overlay.classList.add("on");
    dimensionarTelaExpandida();
    S.ajuda = "Tela ampliada — recurso do simulador, a mesa real não faz isto";
  } else {
    const tb = document.querySelector(".telabox");
    if (tb) tb.insertBefore(espacoEl, tb.firstChild);
    moverAux(false);
    overlay.classList.remove("on");
    encaixarLCDnaMesa();
    S.ajuda = "";
  }
  btLupa.textContent = on ? "TELA AMPLIADA" : "AMPLIAR TELA";
  telaChave = null;                          /* força reconstruir no tamanho novo */
  pedirRender();
}
btLupa.addEventListener("click", ()=>expandirTela(!expandida));
btFechar.addEventListener("click", ()=>expandirTela(false));
overlay.addEventListener("pointerdown", ev=>{ if (ev.target === overlay) expandirTela(false); });
window.addEventListener("resize", dimensionarTelaExpandida);

/* teclado: atalhos de estudo */
document.addEventListener("keydown", ev=>{
  if (ev.key === "Escape" && expandida){ expandirTela(false); return; }
  if (ev.key === "Escape" && S.popup){ fecharPopup(); pedirRender(); }
  if (ev.key === "ArrowRight") pularCanal(1);
  if (ev.key === "ArrowLeft")  pularCanal(-1);
});

/* ==================================================================
   ÁUDIO MULTITRACK — as músicas cadastradas, cada track num canal
   ==================================================================
   As bases vêm do catálogo público do projeto (media/bases.json), o mesmo
   que a frota de simuladores já usa. Cada stem (Bumbo, Caixa, Baixo, Voz...)
   entra num canal da mesa: o aluno mixa de verdade, com o fader, o EQ e o
   pan daquele canal.

   ⚠️ O som só começa quando o aluno APERTA PLAY. Nada toca sozinho ao abrir.

   Cadeia por canal, na ordem da mesa real:
     buffer -> HPF -> EQ 4 bandas -> gain do fader -> pan -> master
   AudioParam: uso setValueAtTime, que resolve e PARA. setTargetAtTime é
   exponencial e nunca termina -- o param vira a-rate e o biquad recalcula
   coeficiente a cada amostra (foi o que pesou 34,5% de CPU na CL5).      */
/* SB_MEDIA é declarado LÁ EM CIMA, junto de AUD — ver a nota de TDZ lá. */
/* AUD é declarado LÁ EM CIMA, junto do estado S — ver a nota de TDZ lá.
   Aqui ficam só as funções que mexem nele. */

async function carregarCatalogo(){
  try{
    const r = await fetch(SB_MEDIA+"bases.json?t="+(AUD.t0||1));
    if (!r.ok) return;
    const j = await r.json();
    AUD.bases = Array.isArray(j) ? j : (j.bases || j.songs || []);
  }catch(e){
    /* Sem rede é caso esperado -- o simulador segue sem áudio. Mas erro de
       PROGRAMAÇÃO não pode ficar mudo aqui: foi assim que um TDZ de SB_MEDIA
       (declarado depois desta função ser chamada) deixou a lista de músicas
       vazia sem uma linha no console. */
    if (e instanceof ReferenceError || e instanceof TypeError) console.error("[m7cl] catálogo:", e);
  }
}

/** Carrega os stems de uma base e amarra cada um a um canal da mesa. */
async function carregarBase(idx){
  const b = AUD.bases[idx];
  if (!b || AUD.carregando) return;
  pararAudio();
  AUD.offset = 0;            /* música nova começa do início, não de onde a outra parou */
  AUD.carregando = true;
  /* ⚠️ NÃO publica AUD.base aqui. Publicar a base no INÍCIO e as faixas só no
     FIM deixa a mesa num estado mentiroso enquanto baixa: diz que a música é
     a nova enquanto as faixas ainda são da anterior. Com 42 faixas isso dura
     segundos, e é a janela em que se dispara a música errada. Base e faixas
     são publicadas JUNTAS, lá embaixo. */
  AUD.baseAlvo = b;          /* só para mostrar "carregando X" na interface */
  const pedido = ++AUD.pedido;   /* só o ÚLTIMO pedido pode publicar o resultado */
  S.ajuda = "Carregando <b>"+b.label+"</b> ("+b.stems.length+" faixas)…";
  pedirRender();

  AUD.ctx = AUD.ctx || new (window.AudioContext||window.webkitAudioContext)();
  const ctx = AUD.ctx;
  montarMaster(ctx);
  /* uma base pode ter mais faixas que 48; usa as primeiras e avisa */
  const usar = b.stems.slice(0, N_IN);
  let prontas = 0;
  /* Promise.all inteiro nunca rejeita: cada faixa já trata o próprio erro.
     Ainda assim o corpo abaixo pode lançar -- por isso o finally no fim
     solta AUD.carregando SEMPRE. Ficar preso em true trava o áudio do
     simulador inteiro, e em silêncio. */
  const carregados = await Promise.all(usar.map(async (st)=>{
    try{
      const resp = await fetch(SB_MEDIA + b.folder + "/" + st.f);
      if (!resp.ok) return null;
      const buf = await ctx.decodeAudioData(await resp.arrayBuffer());
      return { ...st, buffer:buf };
    }catch(e){ console.error("[m7cl] faixa falhou:", st.f, e); return null; }
    finally{
      prontas++;
      /* progresso: com 42 faixas o aluno precisa ver que está andando */
      if (pedido === AUD.pedido){
        S.ajuda = "Carregando <b>"+b.label+"</b> — "+prontas+" de "+usar.length+" faixas…";
        pedirRender();
      }
    }
  }));

  /* O canal é numerado DEPOIS de descartar as faixas que falharam.
     Antes eu numerava no map (canal:"CH"+(i+1)) e só então filtrava: se a
     faixa 1 falhasse, ela sumia e as outras continuavam em CH2, CH3... ->
     o CH1 ficava MUDO com o LED mexendo, e o loop que desliga os canais
     sobrando (usando AUD.stems.length) desligava canais que TINHAM faixa.
     Um download perdido desalinhava a mesa inteira. */
  /* Se o aluno trocou de música de novo enquanto esta baixava, este resultado
     está velho: descarta em vez de sobrescrever a base mais recente.
     ⚠️ Antes eu dava `return` aqui SEM soltar AUD.carregando -- ele ficava
     preso em true e o áudio não tocava nunca mais, calado. */
  if (pedido !== AUD.pedido){ AUD.carregando = false; return; }

  const perdidas = carregados.filter(x=>!x).length;
  /* base e faixas publicadas JUNTAS: a partir daqui a mesa é coerente */
  AUD.base  = b;
  AUD.stems = carregados.filter(Boolean).map((s,i)=>({ ...s, canal:"CH"+(i+1) }));
  AUD.dur = AUD.stems.reduce((m,s)=>Math.max(m, s.buffer.duration), 0);

  /* o canal recebe o nome e o pan da faixa, como numa passagem de som */
  AUD.stems.forEach(s=>{
    const c = S.canais[s.canal];
    if (!c) return;
    c.nome = String(s.n).slice(0,8);
    c.pan  = clamp((s.p||0)/50, -1, 1);
    c.ha.gain = -20;
    c.hpf.on  = !!s.h;          /* a base já marca quem pede corte de grave */
    c.fader = -138;             /* tudo fechado: o aluno abre */
    /* Canal entra DESLIGADO. Ordem do dono: "o ON do canal habilita ou não o
       canal, o fader dá a proporção de volume". Assim o aluno vive os dois
       controles como coisas separadas -- liga o canal, depois dosa o nível --
       em vez de achar que o [ON] não faz nada porque tudo já vinha ligado. */
    c.on = false;
  });
  /* canais sem faixa saem do caminho */
  for (let i=AUD.stems.length+1;i<=N_IN;i++){
    const c = S.canais["CH"+i];
    if (c){ c.nome = "ch "+i; c.on = false; }
  }

  AUD.carregando = false;
  S.ajuda = "<b>"+b.label+"</b> — "+AUD.stems.length+" faixas nos canais 1-"+AUD.stems.length+
            (b.stems.length>N_IN ? " (a base tem "+b.stems.length+", a mesa comporta "+N_IN+")" : "")+
            /* falha de download não pode ficar muda: era o que fazia um canal
               ficar sem som sem ninguém saber por quê */
            (perdidas ? " · ⚠️ "+perdidas+" faixa(s) não baixaram" : "")+
            " · <b>ligue o [ON]</b> de cada canal e suba o fader";
  telaChave = null;
  pedirRender();
}

/* ==================================================================
   BARRAMENTO MASTER — STEREO e MONO
   ==================================================================
   ⛔ DEFEITO QUE ISTO CONSERTA (achado pelo dono, 31/07): cada canal ligava
   DIRETO em ctx.destination. Não existia barramento. Consequência: o [ON] e o
   fader do STEREO e do MONO não tinham por onde agir — desligar o master não
   parava o som e o fader não mudava volume nenhum. Os botões existiam na tela
   e mexiam no estado; o estado é que não chegava ao áudio.

   O caminho agora segue o do manual (p.63 e diagrama de blocos):

     canal → gain(HA+fader+ON) ─┬→ pan → busSt   → saída   (STEREO L/R)
                                └→ envMono       → busMono → saída   (MONO C)

   O tap do MONO sai ANTES do panorâmico de propósito: "o sinal mandado ao
   barramento MONO não é afetado por este knob" (p.63). Ligar depois do pan
   faria o MONO seguir o panorâmico, que é justamente o que a mesa não faz. */
function montarMaster(ctx){
  if (AUD.busSt) return;                       /* uma vez por AudioContext */
  AUD.busSt   = ctx.createGain();
  AUD.busMono = ctx.createGain();
  AUD.busSt.connect(ctx.destination);
  AUD.busMono.connect(ctx.destination);
  aplicarMasterNoAudio();
}

/* ==================================================================
   RACK DE EFEITOS — send/return DE VERDADE (p.181)
   ==================================================================
   O caminho é o da mesa: canal --send MIX 13-16--> rack 5-8 --> retorno no
   ST IN 1-4, cujo FADER e [ON] dosam o efeito no P.A. Antes o rack era só
   estado: reverb/delay/chorus não tocavam em nada.

   Cada tipo dos 41 é mapeado para a FAMÍLIA que o define (reverb por
   convolução, delay com feedback, modulação por LFO, distorção por
   waveshaper). ⚠️ HQ.PITCH/DUAL PITCH/FREEZE precisam de worklet e ficam
   transparentes — declarado, não escondido. */
const FAMILIA_FX = t =>
  /REV|EARLY/.test(t)                        ? "reverb" :
  /DELAY|ECHO/.test(t)                       ? "delay"  :
  /CHORUS|FLANGE|SYMPHONIC|PHASER|ROTARY|TREMOLO|AUTO PAN|RING|MOD\.FILTER|DYNA/.test(t) ? "mod" :
  /DIST|AMP|OPENDECK/.test(t)                ? "dist"   :   /* OPENDECK = saturação de fita */
  /COMP|M\.BAND/.test(t)                     ? "comp"   :
  /EQUALIZER|FILTER/.test(t)                 ? "eq"     : "nulo";

/* IR sintética: ruído estéreo com decaimento exponencial. `seg` = tempo de
   cauda. Não é a amostra da Yamaha (proprietária) -- é reverberação real por
   convolução, com o TEMPO que o operador escolher. */
function irSintetica(ctx, seg){
  const n = Math.max(1, Math.round(ctx.sampleRate * clamp(seg, 0.1, 8)));
  const buf = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.2);
  }
  return buf;
}

function construirEfeito(ctx, rack){
  const fam = FAMILIA_FX(rack.efeito || "");
  const entrada = ctx.createGain(), saida = ctx.createGain();
  const seco = ctx.createGain(), molhado = ctx.createGain();
  entrada.connect(seco); seco.connect(saida);
  let cauda = null;
  if (fam === "reverb"){
    const cv = ctx.createConvolver();
    cv.buffer = irSintetica(ctx, (rack.param.tempo||500)/1000 * 2.6);
    entrada.connect(cv); cv.connect(molhado);
  } else if (fam === "delay"){
    const dl = ctx.createDelay(3); dl.delayTime.value = clamp((rack.param.tempo||500)/1000, 0.02, 2.9);
    const fb = ctx.createGain(); fb.gain.value = 0.38;
    entrada.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(molhado);
    cauda = { delay: dl };
  } else if (fam === "mod"){
    /* chorus/flanger/phaser: delay curto varrido por LFO */
    const dl = ctx.createDelay(0.06); dl.delayTime.value = 0.018;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.6;
    const prof = ctx.createGain(); prof.gain.value = /FLANGE/.test(rack.efeito) ? 0.004 : 0.008;
    lfo.connect(prof); prof.connect(dl.delayTime); lfo.start();
    entrada.connect(dl); dl.connect(molhado);
    cauda = { lfo };
  } else if (fam === "dist"){
    const ws = ctx.createWaveShaper();
    const cur = new Float32Array(1024);
    for (let i=0;i<1024;i++){ const x=i/511.5-1; cur[i]=Math.tanh(3.2*x); }
    ws.curve = cur;
    entrada.connect(ws); ws.connect(molhado);
  } else if (fam === "comp"){
    const cp = ctx.createDynamicsCompressor();
    cp.threshold.value=-24; cp.ratio.value=4; cp.attack.value=0.01; cp.release.value=0.25;
    entrada.connect(cp); cp.connect(molhado);
  } else if (fam === "eq"){
    const f1 = ctx.createBiquadFilter(); f1.type="lowshelf";  f1.frequency.value=120;
    const f2 = ctx.createBiquadFilter(); f2.type="highshelf"; f2.frequency.value=8000;
    entrada.connect(f1); f1.connect(f2); f2.connect(molhado);
  }
  molhado.connect(saida);
  /* MIX BAL. (p.181 item D): reparte seco x efeito na saída do rack */
  const bal = clamp((rack.param.mix ?? 35)/100, 0, 1);
  seco.gain.value = fam==="nulo" ? 1 : 1 - bal;
  molhado.gain.value = fam==="nulo" ? 0 : bal;
  return { entrada, saida, seco, molhado, cauda, fam };
}

function montarFx(ctx){
  if (AUD.fx) return;
  AUD.fx = {};
  S.rack.forEach((r,i)=>{
    if (r.tipo !== "EFFECT" || !r.entrada) return;
    const fx = construirEfeito(ctx, r);
    /* retorno: o ganho de volta ao P.A. é o CANAL ST IN da saída do rack */
    const ret = ctx.createGain(); ret.gain.value = 0;
    fx.saida.connect(ret); ret.connect(AUD.busSt);
    AUD.fx[i] = { ...fx, ret, rack:r, efeitoMontado:r.efeito };
  });
}

/* Parâmetros que dá para mexer SEM remontar: tempo do delay, taxa do LFO e
   o MIX BAL. Reverb muda a IR -- aí é remontagem mesmo. */
function ajustarFxVivo(i){
  const fx = AUD.fx && AUD.fx[i]; if (!fx) return;
  const r = S.rack[i];
  const bal = clamp((r.param.mix ?? 35)/100, 0, 1);
  fx.seco.gain.value = fx.fam==="nulo" ? 1 : 1 - bal;
  fx.molhado.gain.value = fx.fam==="nulo" ? 0 : bal;
  if (fx.fam==="delay" && fx.cauda && fx.cauda.delay)
    fx.cauda.delay.delayTime.value = clamp((r.param.tempo||500)/1000, 0.02, 2.9);
  if (fx.fam==="reverb"){
    /* IR nova com o tempo novo — mas gerar convolução a cada pointermove
       do knob travaria o arraste; no máximo uma remontagem a cada 300 ms.
       O carimbo vive FORA do fx: a remontagem cria um objeto novo e um
       carimbo dentro dele zeraria o throttle a cada volta. */
    AUD._tIR = AUD._tIR || {};
    const agora = performance.now();
    if (!AUD._tIR[i] || agora - AUD._tIR[i] > 300){ AUD._tIR[i] = agora; remontarFx(i); }
  }
}

/* O rack pode ser REMONTADO em uso (trocar o efeito na tela RACK). */
function remontarFx(i){
  if (!AUD.ctx || !AUD.fx) return;
  const velho = AUD.fx[i];
  const r = S.rack[i];
  if (velho){
    try{ velho.entrada.disconnect(); velho.saida.disconnect(); velho.ret.disconnect();
         if (velho.cauda && velho.cauda.lfo) velho.cauda.lfo.stop(); }catch(e){}
    delete AUD.fx[i];
  }
  if (r.tipo !== "EFFECT" || !r.entrada) return;
  const fx = construirEfeito(AUD.ctx, r);
  const ret = AUD.ctx.createGain(); ret.gain.value = 0;
  fx.saida.connect(ret); ret.connect(AUD.busSt);
  AUD.fx[i] = { ...fx, ret, rack:r, efeitoMontado:r.efeito };
  /* religa os sends dos stems no rack novo */
  for (const s of (AUD.stems||[])){
    if (s.nodes && s.nodes.sendsFx && s.nodes.sendsFx[i]){
      try{ s.nodes.sendsFx[i].disconnect(); }catch(e){}
      s.nodes.sendsFx[i].connect(AUD.fx[i].entrada);
    }
  }
}

/** Espelha os canais STEREO e MONO nos ganhos dos dois barramentos. */
function aplicarMasterNoAudio(){
  const ctx = AUD.ctx;
  if (!ctx || !AUD.busSt) return;
  const t = ctx.currentTime;
  const R = (param, v) => {                    /* rampa de 20 ms: sem clique */
    if (!Number.isFinite(v) || Math.abs(param.value - v) <= 1e-4) return;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(v, t + 0.02);
  };
  const nivel = c => (c && c.on ? 1 : 0) *
                     (!c || c.fader <= -138 ? 0 : Math.pow(10, c.fader / 20));
  /* Guardo o ALVO calculado. O `.value` do AudioParam não serve para conferir
     nada logo depois de agendar: a rampa leva 20 ms e a leitura imediata
     devolve o valor ANTIGO. Testar contra `.value` dá teste que passa ou
     falha conforme o relógio -- pior que não ter teste. */
  AUD.alvoSt   = nivel(S.canais.STEREO);
  AUD.alvoMono = nivel(S.canais.MONO);
  R(AUD.busSt.gain,   AUD.alvoSt);
  R(AUD.busMono.gain, AUD.alvoMono);
  /* retornos de efeito: o rack volta pelo CANAL ST IN patcheado na saída
     dele (p.46/181) -- fader e [ON] do ST IN dosam o efeito, como na mesa. */
  if (AUD.fx) for (const fx of Object.values(AUD.fx)){
    const st = S.canais[fx.rack.saida];
    const g = st ? (st.on?1:0) * (st.fader<=-138?0:Math.pow(10,st.fader/20)) *
                   (st.lcr ? (st.lcrOn?1:0) : (st.toSt?1:0)) : 0;
    R(fx.ret.gain, g);
  }
}

/** Monta a cadeia de um stem e começa a tocar. */
function tocarStem(s, quando, offset){
  const ctx = AUD.ctx, c = S.canais[s.canal];
  /* rede de segurança: sem os barramentos o connect abaixo lança e a faixa
     entra MUDA, em silêncio. Montar é idempotente. */
  montarMaster(ctx);
  const src = ctx.createBufferSource();
  src.buffer = s.buffer;
  /* LOOP: a música repete sozinha, como nos outros simuladores da frota.
     O ponto de volta é a faixa MAIS LONGA da base (AUD.dur), não a duração
     de cada uma — senão cada stem voltaria num instante diferente e a banda
     se desmontaria depois da primeira volta. */
  src.loop = true;
  src.loopStart = 0;
  src.loopEnd = AUD.dur || s.buffer.duration;

  const hpf = ctx.createBiquadFilter(); hpf.type = "highpass";
  const bandas = ["low","lomid","himid","high"].map(()=>{
    const f = ctx.createBiquadFilter(); f.type = "peaking"; return f;
  });
  const gain = ctx.createGain();
  const pan  = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

  /* Analisadores para o METER medir o sinal DE VERDADE.
     São dois porque o metering point da M7CL escolhe ONDE medir (p.167):
       pre  = antes do fader/ON  ·  pos = depois de tudo, o que realmente sai
     Sem isto o LED era um seno fictício: mexia sem áudio e não correspondia
     ao que se ouvia -- foi o que o dono viu. */
  const anaPre = ctx.createAnalyser(); anaPre.fftSize = 256;
  const anaPos = ctx.createAnalyser(); anaPos.fftSize = 256;

  /* Dois envios INDEPENDENTES, um por barramento — é assim na mesa: desligar
     o ST não pode calar o MONO. O do MONO sai antes do pan (p.63). */
  const envSt   = ctx.createGain(); envSt.gain.value = 0;
  const envMono = ctx.createGain(); envMono.gain.value = 0;

  /* DINÂMICA NO CAMINHO DO SOM (a ordem da mesa: HPF -> EQ -> DYN1 -> DYN2
     -> fader). Os DOIS estágios são ganhos guiados por envelope no tickAudio
     (processarDinamica), com a LEI da mesa calculada em JS.

     ⛔ POR QUE NÃO o DynamicsCompressorNode: ele tem MAKEUP GAIN automático
     que devolve o volume conforme o threshold desce -- o aluno comprimia e
     não ouvia diferença ("GATE E COMPRESSOR NAO", 31/07). Com o ganho
     explícito a redução é a da fórmula, o OUT GAIN é respeitado e o medidor
     de GR mostra exatamente o que o ouvido recebe. */
  const dyn1G = ctx.createGain();
  const dyn2G = ctx.createGain();

  let no = src.connect(hpf);
  bandas.forEach(f=>{ no = no.connect(f); });
  no.connect(anaPre);                    /* derivação: não corta a cadeia */
  no = no.connect(dyn1G);
  no = no.connect(dyn2G);
  no = no.connect(gain);                 /* gain = HA + fader + [ON], só isso */

  /* sends de efeito: pós-fader (o uso de send/return da p.181), um gain por
     rack de EFFECT, dosado pelo send do MIX patcheado na entrada do rack */
  const sendsFx = {};
  if (AUD.fx) for (const [i,fx] of Object.entries(AUD.fx)){
    const sg = ctx.createGain(); sg.gain.value = 0;
    gain.connect(sg); sg.connect(fx.entrada);
    sendsFx[i] = sg;
  }

  gain.connect(envMono);
  envMono.connect(AUD.busMono);          /* → MONO (C), sem panorâmico */

  let st = gain.connect(envSt);
  if (pan) st = st.connect(pan);
  st.connect(anaPos);                    /* mede o que REALMENTE sai */
  st.connect(AUD.busSt);                 /* → STEREO (L/R), pelo master */

  s.src = src;
  s.nodes = { hpf, bandas, dyn1G, dyn2G, gain, pan, envSt, envMono, sendsFx,
              anaPre, anaPos, buf:new Uint8Array(anaPos.frequencyBinCount),
              env1:1, env2:1, red1:0, red2:0 };
  /* registra para poder ser parado mesmo se a música trocar depois */
  AUD.vivos.push({ src, gain, stem:s });
  aplicarCanalNoAudio(s);
  /* offset pela duração da BASE (não da faixa): com o loop sincronizado em
     AUD.dur, usar a duração de cada stem faria as faixas entrarem
     desencontradas ao retomar de uma pausa */
  src.start(quando, offset % (AUD.dur || s.buffer.duration || 1));
}

/** Espelha o canal da mesa nos nós de áudio daquele stem. */
function aplicarCanalNoAudio(s){
  const c = S.canais[s.canal], n = s.nodes, ctx = AUD.ctx;
  if (!c || !n || !ctx) return;
  const t = ctx.currentTime;
  const P = (param, v) => {           /* resolve e PARA -- nada de rampa infinita */
    if (Number.isFinite(v) && Math.abs(param.value - v) > 1e-4) param.setValueAtTime(v, t);
  };
  /* O ganho usa RAMPA CURTA (20 ms, como no CL5): ligar/desligar o [ON] no
     seco produz um clique audível. linearRampToValueAtTime TERMINA -- ao
     contrário de setTargetAtTime, que é exponencial e nunca chega ao valor,
     deixando o param em a-rate e o filtro recalculando por amostra. */
  const R = (param, v) => {
    if (!Number.isFinite(v) || Math.abs(param.value - v) <= 1e-4) return;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(v, t + 0.02);
  };
  /* ganho: HA + fader + ON, tudo o que a mesa faz antes da saída.
     [ON] desligado = 0: o canal não passa som, por mais que o fader suba. */
  const ha = Math.pow(10, (c.ha.gain + 20) / 20);
  const fd = c.fader <= -138 ? 0 : Math.pow(10, c.fader / 20);
  /* O gain do canal é SÓ o canal: HA + fader + [ON]. O roteamento saiu daqui
     de propósito — quando ele carregava o `toSt`, desligar o ST calava também
     o MONO, e na mesa os dois são independentes (p.63). */
  R(n.gain.gain, (c.on ? 1 : 0) * ha * fd);

  /* Para onde este canal vai (p.63):
       ST/MONO -> [ST] e [MONO] são chaves independentes
       LCR     -> o botão [LCR] abre os dois juntos e o CSR reparte o nível */
  const csr = clamp(c.csr, 0, 100) / 100;
  let gSt, gMono;
  if (c.lcr){
    /* ⚠️ ESTIMADO: o manual dá os EXTREMOS (0 % = nada vai ao MONO e o TO ST
       PAN age como pan comum; 100 % = o sinal se reparte entre L/R e C, p.65),
       mas não publica a lei entre eles. Uso repartição linear, que acerta os
       dois extremos documentados. Se aparecer a curva oficial, é 1 linha. */
    gSt   = c.lcrOn ? (1 - csr) : 0;
    gMono = c.lcrOn ? csr : 0;
  } else {
    gSt   = c.toSt   ? 1 : 0;
    gMono = c.toMono ? 1 : 0;
  }
  if (n.envSt)   R(n.envSt.gain,   gSt);
  if (n.envMono) R(n.envMono.gain, gMono);
  /* o panorâmico é do STEREO; o MONO tapa antes dele e não o sente (p.63) */
  if (n.pan) P(n.pan.pan, clamp(c.pan, -1, 1));

  /* a dinâmica (gate/comp/expander) vive em processarDinamica(), guiada por
     envelope frame a frame -- não há mais nó nativo aqui (ver tocarStem) */

  /* sends de efeito: o nível que o canal manda ao MIX patcheado na entrada
     do rack (pós-fader; o retorno é dosado pelo ST IN da saída) */
  if (n.sendsFx && AUD.fx) for (const [i,sg] of Object.entries(n.sendsFx)){
    const fx = AUD.fx[i]; if (!fx) continue;
    const idx = +fx.rack.entrada.replace(/\D/g,"") - 1;   /* MIX13 -> 12 */
    const sd = c.mix && c.mix[idx];
    R(sg.gain, (sd && sd.on && sd.lvl>-138) ? Math.pow(10, sd.lvl/20) : 0);
  }
  P(n.hpf.frequency, c.hpf.on ? c.hpf.freq : 20);
  const bs = [c.eq.bandas.low, c.eq.bandas.lomid, c.eq.bandas.himid, c.eq.bandas.high];
  n.bandas.forEach((f,i)=>{
    const b = bs[i];
    P(f.frequency, b.f);
    P(f.Q, b.q);
    P(f.gain, c.eq.on ? b.g : 0);
  });
}

/* ==================================================================
   UMA INSTÂNCIA POR VEZ
   ==================================================================
   O simulador pode estar aberto em mais de uma aba/painel ao mesmo tempo --
   e cada cópia tem o SEU AudioContext. Dar play numa e depois abrir outra
   deixava as duas tocando juntas, e nada dentro da cópia nova alcançava a
   antiga: era o "não para o pagode".

   Agora quem começa a tocar AVISA as outras cópias, que se calam. Uso
   BroadcastChannel e, onde ele não existe (file:// em alguns navegadores),
   caio no localStorage, que dispara 'storage' nas outras abas.            */
const EU = Math.random().toString(36).slice(2);
let canalAvisos = null;
try { canalAvisos = new BroadcastChannel("m7cl-audio"); } catch(e) {}

function avisarQueVouTocar(){
  const msg = { quem: EU, t: Date.now() };
  try { canalAvisos && canalAvisos.postMessage(msg); } catch(e) {}
  try { localStorage.setItem("m7cl-tocando", JSON.stringify(msg)); } catch(e) {}
}
function calarPorOutraInstancia(quem){
  if (quem === EU) return;
  if (!AUD.tocando) return;
  pararAudio();
  S.ajuda = "Outra janela do simulador começou a tocar — esta parou para não "+
            "sobrepor as músicas.";
  pedirRender();
}
if (canalAvisos) canalAvisos.onmessage = ev => {
  if (ev && ev.data && ev.data.quem) calarPorOutraInstancia(ev.data.quem);
};
window.addEventListener("storage", ev => {
  if (ev.key !== "m7cl-tocando" || !ev.newValue) return;
  try { calarPorOutraInstancia(JSON.parse(ev.newValue).quem); } catch(e) {}
});
/* fechar ou recarregar a aba não pode deixar som órfão tocando */
window.addEventListener("pagehide", ()=>{ pararAudio(); try{ AUD.ctx && AUD.ctx.close(); }catch(e){} });

function tocarAudio(){
  /* Não toca ENQUANTO outra base carrega. Sem esta guarda, apertar play
     durante a troca disparava a lista ANTIGA; logo depois AUD.stems virava a
     nova, e aqueles sources ficavam órfãos tocando por baixo -- as duas
     músicas juntas. */
  if (AUD.carregando){
    S.ajuda = "Espere a música terminar de carregar…";
    pedirRender(); return;
  }
  if (!AUD.ctx || !AUD.stems.length || AUD.tocando) return;
  avisarQueVouTocar();      /* cala qualquer outra cópia aberta */
  AUD.ctx.resume();
  const quando = AUD.ctx.currentTime + 0.06;   /* todas as faixas juntas */
  AUD.stems.forEach(s=>tocarStem(s, quando, AUD.offset));
  AUD.t0 = quando - AUD.offset;
  AUD.tocando = true;
  S.ajuda = "Tocando <b>"+AUD.base.label+"</b> em looping — mexa nos faders e ouça";
  pedirRender();
}
function pararAudio(){
  /* Para TODOS os sources já criados, não só os da música atual: é o que
     impede duas músicas de tocarem juntas quando se troca a base. */
  AUD.vivos.forEach(v=>{
    try{ v.gain && (v.gain.gain.value = 0); }catch(e){}   /* corta antes de parar */
    try{ v.src && v.src.stop(); }catch(e){}
    try{ v.src && v.src.disconnect(); }catch(e){}
    if (v.stem){ v.stem.src = null; v.stem.nodes = null; }
  });
  AUD.vivos = [];
  AUD.stems.forEach(s=>{
    s.src=null; s.nodes=null;
    const c = S.canais[s.canal];
    if (c) c.nivel = 0;          /* LED apaga junto com o som */
  });
  /* zera o LED de qualquer canal que tenha sobrado de outra base */
  for (const c of Object.values(S.canais)) if (c.tipo==="in"||c.tipo==="stin") c.nivel = 0;
  /* com loop o tempo cresce sem parar: guarda a posição DENTRO da volta */
  if (AUD.tocando && AUD.ctx){
    const t = Math.max(0, AUD.ctx.currentTime - AUD.t0);
    AUD.offset = AUD.dur ? (t % AUD.dur) : t;
  }
  AUD.tocando = false;
}
function pausarAudio(){ pararAudio(); S.ajuda="Pausado"; pedirRender(); }
function voltarAudio(){ pararAudio(); AUD.offset=0; S.ajuda="Voltou ao começo"; pedirRender(); }

/* espelha a mesa no áudio a cada frame -- é o que faz o fader "soar" */
/* Chamada pelo pedirRender() a cada toque do operador -- o som responde na
   hora, sem depender do rAF. `function` (não const) para poder ser usada
   antes desta linha sem cair em TDZ. */
function aplicarAudioAgora(){
  if (!AUD.tocando) return;
  for (const s of AUD.stems) aplicarCanalNoAudio(s);
  /* o master é UM par de ganhos, fora dos stems -- se não for aplicado aqui,
     o [ON] e o fader do STEREO/MONO voltam a não fazer nada (defeito de 31/07) */
  aplicarMasterNoAudio();
  processarDinamica();
}

/* ==================================================================
   DINÂMICA POR ENVELOPE — DYN1 e DYN2 no caminho do som
   ==================================================================
   Web Audio não tem nó de gate, e o nó de compressor nativo aplica MAKEUP
   automático que esconde a compressão do ouvido. Então os dois estágios são
   GANHOS guiados frame a frame: lê-se o nível pós-EQ, aplica-se a LEI do
   tipo (tabelas do manual) e caminha-se para o alvo na velocidade de
   ATTACK/RELEASE/DECAY. Resolução do envelope ~16 ms (um frame) -- attack de
   0 ms vira 4 ms; declarado, não escondido.
   linearRamp CURTO de propósito: setTargetAtTime nunca termina e deixaria o
   param em a-rate ([[smu-audioparam-automacao-nunca-termina]]). */

/* A LEI de cada tipo, com TODOS os campos da tabela do manual (p.249-251):
   THRESHOLD, RATIO, ATTACK, RELEASE/DECAY, HOLD, KNEE, WIDTH, RANGE, OUT.
   Devolve {alvo, red}: alvo = ganho 0..1 JÁ com o OUT GAIN; red = a redução
   0..1 SEM o out gain -- é o que o medidor de GR mostra (GR mede a mordida,
   não o make-up; somar os dois no medidor mentiria). */
function leiDyn(d, dB){
  if (!d || !d.on) return { alvo:1, red:0 };
  const t = d.tipo;
  const out = Number.isFinite(d.out) ? d.out : 0;
  const r = d.ratio===Infinity ? 1 : (1 - 1/(d.ratio||1));
  let redDb = 0;

  if (t==="EXPANDER"){
    /* abaixo do threshold, o deficit é reduzido pela razão. A tabela dá
       OUT GAIN ao expander também (OUTp) -- versão anterior o ignorava. */
    if (dB < d.thr) redDb = (d.thr - dB) * r;
  }
  else if (t==="COMPANDER-H" || t==="COMPANDER-S"){
    /* ⚠️ aproximação declarada: comprime ACIMA do thr e expande ABAIXO de
       thr - WIDTH; entre os dois, unidade. O WIDTH agora trabalha. */
    if (dB > d.thr) redDb = (dB - d.thr) * r;
    else {
      const piso = d.thr - (d.width ?? 6);
      if (dB < piso) redDb = (piso - dB) * r;
    }
  }
  else { /* COMPRESSOR / DE-ESSER (de-esser = comp de banda cheia, declarado) */
    /* KNEE da tabela: HARD (0) ou soft 1..5. No soft a mordida começa antes
       do threshold e cresce em curva -- ⚠️ largura do joelho ESTIMADA em
       knee*4 dB (4..20); a Yamaha não publica a curva. 1 linha para corrigir. */
    const W = (d.knee >= 1) ? d.knee * 4 : 0;
    const x = dB - d.thr;
    if (W > 0){
      if (x >= W/2)       redDb = r * x;
      else if (x > -W/2)  redDb = r * Math.pow(x + W/2, 2) / (2*W);
    } else if (x > 0)     redDb = r * x;
  }
  return { alvo: Math.pow(10, (out - redDb)/20),
           red:  1 - Math.pow(10, -redDb/20) };
}

function estagioDyn(n, id, d, dB, t, dt){
  const g = n["dyn"+id+"G"]; if (!g) return;
  let alvo, red;
  if (d && d.on && (d.tipo==="GATE" || d.tipo==="DUCKING")){
    /* GATE/DUCKING têm HOLD (tabela): depois que o sinal some, a porta
       segura o estado por HOLD segundos antes de começar a fechar/abrir.
       Sem isso o gate picotava a cauda do bumbo -- e o HOLD existe na mesa
       exatamente para isso. */
    const fechado = Math.pow(10, -Math.abs(d.range ?? 70)/20);
    const presente = dB >= d.thr;
    if (presente) n["tSinal"+id] = t;
    const dentroHold = (t - (n["tSinal"+id] ?? -9e9)) < (d.hold || 0);
    const ativo = presente || dentroHold;
    alvo = (d.tipo==="GATE") ? (ativo ? 1 : fechado) : (ativo ? fechado : 1);
    red = 1 - Math.min(alvo, 1);
  } else {
    const L = leiDyn(d, dB);
    alvo = L.alvo; red = L.red;
  }
  n["red"+id] = red;                          /* p/ o medidor de GR */
  const atual = n["env"+id] ?? 1;
  if (Math.abs(atual - alvo) < 1e-3) return;
  /* constantes de tempo com o SENTIDO certo por tipo:
       gate/ducking -> ATTACK abre (ganho subindo), DECAY fecha
       comp/expander -> ATTACK morde (ganho descendo), RELEASE devolve */
  const atk = Math.max(((d && d.attack) || 0)/1000, 0.004);
  const ehPorta = d && (d.tipo==="GATE" || d.tipo==="DUCKING");
  const tau = ehPorta
    ? (alvo > atual ? atk : Math.max((d && d.decay)   || 0.3,  0.02))
    : (alvo < atual ? atk : Math.max((d && d.release) || 0.25, 0.02));
  const k = 1 - Math.exp(-dt / tau);
  const novo = atual + (alvo - atual) * k;
  n["env"+id] = novo;
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(g.gain.value, t);
  g.gain.linearRampToValueAtTime(novo, t + dt);
}

function processarDinamica(){
  const ctx = AUD.ctx; if (!ctx) return;
  const t = ctx.currentTime, dt = 1/60;
  for (const s of AUD.stems){
    const c = S.canais[s.canal], n = s.nodes;
    if (!c || !n || !n.dyn1G) continue;
    /* detector: nível pós-EQ, ANTES da dinâmica (senão o gate mediria a
       própria mordida e oscilaria) */
    n.anaPre.getByteTimeDomainData(n.buf);
    let pico = 0;
    for (let i=0;i<n.buf.length;i++){ const v=Math.abs(n.buf[i]-128)/128; if (v>pico) pico=v; }
    const dB = pico>0 ? 20*Math.log10(pico) : -100;
    estagioDyn(n, "1", c.dyn1, dB, t, dt);
    estagioDyn(n, "2", c.dyn2, dB, t, dt);
  }
}
