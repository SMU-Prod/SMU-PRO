<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Yamaha M7CL-48 — console real (Simulador SMU)</title>
<style>
/* ==================================================================
   YAMAHA M7CL-48 — RÉPLICA DA CONSOLE FÍSICA
   ------------------------------------------------------------------
   Este NÃO é o M7CL Editor (o software de PC). É a MESA: superfície,
   faders, os 33 knobs do SELECTED CHANNEL e a touch screen central.

   FONTE DE VERDADE (Regra 2) — tudo medido, nada chutado:
     manuais/yamaha-M7CL-v3-owners.pdf, cap.2 "Panels and controls"
       p.17  mapa geral do top panel
       p.18  strip de INPUT e ST IN
       p.19  SELECTED CHANNEL (16 MIX/MTX + HA/PAN/HPF/DYN + EQ 4x3)
       p.21  Centralogic (8 strips com encoder multifunção)
       p.22  SCENE MEMORY / MONITOR e USER DEFINED KEYS (12, grade 4x3)
       p.23  STEREO/MONO MASTER e NAVIGATION KEYS
       p.32  estrutura da touch screen (function access area + main area)
       p.90  SELECTED CHANNEL VIEW screen (15 campos)
       p.98  OVERVIEW screen (12 campos)
     Páginas rasterizadas em _ref-m7cl/p0NN.png. Spec em _ref-m7cl/SPEC-PAINEL.md

   ⚠️ ESTIMADO — a ÚNICA coisa não tirada do manual:
     A COR do chassi. As figuras do manual são line art (P&B), então a
     geometria é exata mas a cor não está lá. A paleta abaixo veio das
     fotos do produto. Está toda em custom properties: para corrigir,
     mexa SÓ no bloco :root — é 1 linha por cor.
     As cores da TELA (azuis, laranja do +48V, verde da curva de EQ) NÃO
     são estimadas: vieram das capturas coloridas da p.32 e p.98.
   ================================================================== */

:root{
  /* --- chassi: MEDIDO na foto real da M7CL-48 enviada pelo dono ---
     Correção: a primeira versão usava cinza grafite (estimativa minha a
     partir do line art). Na foto o corpo é PRETO fosco com moldura preta
     e os blocos de strip são um cinza-chumbo mais escuro que o corpo. */
  --chassi:#17191c;          /* corpo preto fosco */
  --chassi-alto:#23262a;     /* faces iluminadas / relevo */
  --chassi-baixo:#0d0e10;    /* sombra / vinco */
  --painel:#1f2226;          /* fundo dos blocos de strip */
  --etiqueta:#1b5fa8;        /* faixa azul do topo de cada canal */
  --fita:#e9e6dd;            /* fita branca de escrever o nome */
  --serigrafia:#e8e8ea;      /* texto impresso no painel */
  --serigrafia-fraca:#9a9da3;
  --knob-send:#7d2230;       /* knobs MIX/MATRIX do SELECTED CHANNEL: bordô */

  /* --- tela touch: MEDIDO nas capturas coloridas p.32 / p.98 --- */
  --tela-fundo:#2b2d30;
  --tela-canal:#3a3d42;
  --tela-azul:#1f6fb8;       /* botões e faixa do canal selecionado */
  --tela-azul-claro:#3fa9f5;
  --tela-laranja:#e8741c;    /* +48V, INS  */
  --tela-verde:#39b54a;      /* curva de EQ */
  --tela-borda:#5a5e64;
  --tela-texto:#e9eaec;

  /* --- LEDs --- */
  --led-on:#48e05a;          /* [ON] aceso */
  --led-sel:#f2c200;         /* [SEL] aceso */
  --led-cue:#ff8a1f;         /* [CUE] aceso */
  --led-over:#ff2d2d;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#17181a;color:var(--serigrafia);
  font-family:"Segoe UI",Tahoma,Verdana,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* A mesa é desenhada num palco fixo de 1920x1000 e depois recebe um
   scale para caber na janela. Assim as proporções do painel nunca
   deformam -- só muda o zoom. */
/* position:fixed + translate(-50%,-50%) centraliza o palco JÁ escalado.
   Com o palco no fluxo normal ele continua ocupando 1920x1000 e o
   flex do body empurra tudo -- foi o que deixou a mesa fora do lugar. */
/* PROPORÇÃO MEDIDA, não escolhida:
     - cotas oficiais (p.299): 1274 mm x 701 mm  ->  1.817
     - vista de topo da figura p.17, medida por pixel: 1349 x 734 px -> 1.838
   Duas fontes independentes batem, então o palco usa 1920 x 1044 (= 1.839). */
/* Centralização: margem negativa de METADE do tamanho de design, e o scale
   em torno do centro. Com translate(-50%,-50%) o deslocamento usaria o
   tamanho NÃO escalado (960/522 px) e jogava a mesa para o canto. */
#palco{
  position:fixed;left:50%;top:50%;width:1920px;height:1044px;
  margin-left:-960px;margin-top:-522px;
  transform-origin:center center;
}

/* ---- contrato html.smu-fs (memória: o player avisa por postMessage e o
   simulador responde SÓ com CSS -- sem isso o sim é cortado em tela cheia) --- */
html.smu-fs,html.smu-fs body{height:100%}
html.smu-fs body{align-items:center}

/* ================= chassi ================= */
.mesa{
  position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(180deg,var(--chassi-alto) 0%,var(--chassi) 42%,var(--chassi-baixo) 100%);
  box-shadow:0 18px 60px #000a, inset 0 1px 0 #ffffff18;
  display:flex;flex-direction:column;padding:10px;gap:8px;
}

/* Profundidade dos andares, MEDIDA na figura p.17 (caixa de 734 px):
   andar de cima 330 px = 45 %, andar de baixo 310 px = 42 %,
   faixa frontal da mesa 94 px = 13 %. */
/* gap ZERO de propósito: a posição de cada bloco vem das medidas da planta,
   por vãos explícitos. Deixar o flex distribuir sobra foi o que desalinhou
   os blocos de input da direita entre o andar de cima e o de baixo -- na
   mesa real os dois começam no MESMO x (1119 de 1349 na planta). */
.andar{display:flex;gap:0;min-height:0}
.andar.cima{flex:45 1 0}
.andar.baixo{flex:42 1 0}
.rodape{
  flex:13 1 0;min-height:0;display:flex;align-items:center;padding:0 14px;
  border-top:1px solid #00000055;
  background:linear-gradient(180deg,var(--chassi-baixo),#31343880);
  border-radius:0 0 6px 6px;
}

/* bloco preto que abriga um grupo de strips */
.bloco{
  background:var(--painel);border-radius:6px;padding:5px 4px;
  border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff10;
  display:flex;gap:2px;flex:0 0 auto;
}
.bloco.col{flex-direction:column;gap:4px}

/* ================= strip de canal ================= */
/* ordem MEDIDA no manual p.18: nº / SEL / CUE / 6 LEDs / ON / nome / fader / nº */
/* Larguras MEDIDAS na figura p.17 (% da largura da mesa x 1920 px):
     input  1.885 % -> 36 px   (confere nos dois blocos: 16 e 8 strips)
     ST IN  1.90  % -> 36 px
     Centralogic 2.41 % -> 46 px  (faders mais espaçados que os de input)
     STEREO/MONO 2.15 % -> 41 px                                        */
/* O strip divide a largura do bloco (que é quem tem a medida da planta),
   em vez de cada strip ter largura fixa e a soma "dar mais ou menos certo". */
.strip{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:2px 1px;background:#232629;border-radius:3px;border:1px solid #0c0d0e;
}
/* Etiqueta AZUL no topo de cada canal -- vista na foto real.
   O rodapé do strip é serigrafia branca simples. */
.strip .num{
  font-size:9px;color:#fff;line-height:1;font-weight:700;width:100%;text-align:center;
  background:linear-gradient(180deg,#2a78c4,var(--etiqueta));
  border-radius:2px;padding:1px 0;border:1px solid #0b3a68;
}
.strip .num.b{
  margin-top:1px;background:none;border:none;color:var(--serigrafia);
  font-weight:600;font-size:8px;padding:0;
}

/* Alturas MEDIDAS no recorte ampliado do andar de baixo (strip de 280 px na
   planta): a metade de cima do canal é botão e meter; o fader fica com 43 %.
   A 1ª versão dava 67 % ao fader e o strip virava um trilho comprido e vazio. */
/* As teclas da M7CL são CINZA-CLARAS com o LED escuro em cima (ver foto do
   painel SCENE/UDK/NAV). A 1ª versão usava tecla escura e elas sumiam no
   painel preto -- na mesa real elas saltam à vista. */
.tecla{
  width:26px;height:20px;border-radius:2px;cursor:pointer;position:relative;
  background:linear-gradient(180deg,#d3d7db 0%,#b3b8be 55%,#969ba1 100%);
  border:1px solid #15171a;
  box-shadow:inset 0 1px 0 #ffffffcc, 0 1px 2px #0009;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.tecla:active{transform:translateY(1px)}
/* o LED é a barrinha na parte de cima da tecla, como no hardware */
.tecla i{
  display:block;width:16px;height:4px;border-radius:1px;background:#2a2d31;
  box-shadow:inset 0 1px 1px #000;transition:background .08s,box-shadow .08s;
}
.tecla.on i{background:var(--led-on);box-shadow:0 0 6px var(--led-on)}
.tecla.sel.on i{background:var(--led-sel);box-shadow:0 0 6px var(--led-sel)}
.tecla.cue.on i{background:var(--led-cue);box-shadow:0 0 6px var(--led-cue)}
.rot{font-size:7px;color:var(--serigrafia-fraca);line-height:1;letter-spacing:.3px}

/* meter de 6 LEDs -- OVER,-6,-12,-18,-30,-60 (p.18) */
.meterled{display:flex;flex-direction:column;gap:1px;width:26px;padding:1px 2px;
  background:#15171a;border-radius:2px;border:1px solid #0a0b0c}
.meterled b{display:block;height:7px;border-radius:1px;background:#15281a;
  box-shadow:inset 0 0 0 1px #0b0d0c;transition:background .05s}
/* cores conferidas na foto: verde embaixo, âmbar no topo da faixa útil,
   vermelho só no OVER */
.meterled b.a{background:var(--led-on)}
.meterled b.a.am{background:#e8c020;box-shadow:0 0 4px #e8c02088}
.meterled b.a.ov{background:var(--led-over);box-shadow:0 0 5px var(--led-over)}

/* fita BRANCA de escrever o nome do canal (na foto é fita clara, não faixa preta) */
.nome{
  width:32px;height:14px;background:var(--fita);border:1px solid #8d8a80;border-radius:1px;
  font-size:7.5px;color:#15181b;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;white-space:nowrap;cursor:pointer;
}

/* fader 100mm: trilho + escala impressa + cursor */
/* 43 % do strip -- MEDIDO na planta (fader 120 px num strip de 280 px).
   Com flex:1 ele engolia 67 % e o canal virava um trilho vazio. */
.fader{
  position:relative;width:30px;flex:0 0 43%;min-height:0;cursor:ns-resize;
  display:flex;align-items:stretch;justify-content:center;
  /* Na foto (e na planta) a área do fader é um painel CLARO com a escala
     impressa e a fenda escura no meio. Deixar tudo escuro como o resto do
     strip fazia o fader sumir e o canal parecer oco. */
  background:linear-gradient(180deg,#4b5057,#3c4046);
  border-radius:2px;box-shadow:inset 0 0 3px #0008;
}
/* O fader é o elemento mais visível do canal na mesa real (ver foto).
   A 1ª versão tinha trilho fino e escuro e o strip virava um buraco preto. */
/* a fenda por onde o punho corre: escura contra o painel claro */
.fader .trilho{
  position:absolute;left:50%;top:3px;bottom:3px;width:7px;transform:translateX(-50%);
  background:linear-gradient(90deg,#0b0d0f 0%,#17191c 40%,#25282c 50%,#17191c 60%,#0b0d0f 100%);
  border-radius:2px;box-shadow:inset 0 1px 3px #000, 0 0 0 1px #5a6068;
}
.fader .escala{
  position:absolute;inset:3px 0;font-size:5px;color:#e2e5e8;
  pointer-events:none;
}
.fader .escala span{position:absolute;right:0;transform:translateY(-50%);line-height:1}
.fader .escala u{position:absolute;left:0;width:4px;height:1px;background:#cfd3d8;
  transform:translateY(-50%);text-decoration:none}
/* cursor claro e graúdo, com o risco central branco do fader Yamaha */
/* punho: ~62 % da largura do strip na planta. A 1ª versão usava 26 px num
   strip de 29 px (90 %) e o punho transbordava por cima das bordas. */
.fader .cursor{
  position:absolute;left:50%;width:18px;height:13px;transform:translate(-50%,-50%);
  border-radius:2px;pointer-events:none;
  background:linear-gradient(180deg,#f2f4f6 0%,#cfd3d7 40%,#7e8288 50%,#c8ccd1 60%,#eef0f2 100%);
  border:1px solid #0d0f11;box-shadow:0 2px 5px #000b, inset 0 1px 0 #fff;
}
.fader .cursor:after{content:"";position:absolute;left:1px;right:1px;top:50%;height:2px;
  background:#fff;transform:translateY(-50%);box-shadow:0 0 2px #000a}
/* Na M7CL o punho do STEREO e do MONO é VERMELHO -- é o que distingue o
   master dos canais quando se olha a mesa de longe. */
.strip.master .fader .cursor{
  background:linear-gradient(180deg,#e8555f 0%,#c8202e 40%,#7d1019 50%,#c02434 60%,#e8555f 100%);
  border-color:#3d070c;
}
.strip.master .fader .cursor:after{background:#ffd9dc}

/* ================= knobs ================= */
.knob{
  width:var(--kd,26px);height:var(--kd,26px);border-radius:50%;position:relative;cursor:ns-resize;
  background:radial-gradient(circle at 38% 30%,#6e727a,#33363b 70%,#212327);
  border:1px solid #131517;box-shadow:0 2px 4px #0008,inset 0 1px 0 #ffffff20;
}
.knob:after{ /* traço indicador */
  content:"";position:absolute;left:50%;top:8%;width:2px;height:34%;
  background:#f0f2f4;border-radius:1px;transform-origin:50% 100%;
  transform:translateX(-50%) rotate(var(--ang,0deg));
}
.knob.mini{--kd:19px}
/* os 16 encoders MIX/MATRIX do SELECTED CHANNEL são bordô na mesa real */
.knob.send{background:radial-gradient(circle at 38% 30%,#a8394a,var(--knob-send) 68%,#4a1119)}
.knob.enc{ /* encoder multifunção: tem serrilha */
  background:radial-gradient(circle at 38% 30%,#7a7e86,#3a3d42 68%,#232528);
}
.knob.enc:before{
  content:"";position:absolute;inset:3px;border-radius:50%;
  background:repeating-conic-gradient(#00000030 0 6deg,#ffffff10 6deg 12deg);
}

/* ================= SELECTED CHANNEL ================= */
/* SELECTED CHANNEL: 11.1 % da largura da mesa.
   MEDIDO no recorte ampliado da p.17 (x 557..707 da caixa de 1349 px).
   A 1ª versão usava 21.5 % -- o dobro -- e era o que mais deixava a mesa
   "fora de parâmetro": o painel de knobs engolia o lugar do display. */
/* largura vem de MED.selch (medida na planta), aplicada no script */
.selch{
  background:var(--painel);border:1px solid #000;border-radius:6px;padding:3px;
  display:flex;gap:3px;flex:0 0 auto;
}
/* vãos de chassi: larguras vindas das medidas da planta (const MED no script) */
.vao-chassi{flex:0 0 auto}
.vao{
  flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:10px;
}
.vao span{font-size:9px;color:var(--serigrafia-fraca);letter-spacing:.5px}
/* Knobs miúdos: o SELECTED CHANNEL real tem 213 px de largura para 33 knobs.
   São pequenos na mesa de verdade -- encolher aqui é fidelidade, não economia. */
/* knobs maiores: na foto o SELECTED CHANNEL é DENSO, os knobs preenchem a
   caixa inteira. Os meus estavam espremidos no topo com vazio embaixo. */
.selch .knob{--kd:24px}
.selch .knob.mini{--kd:20px}
/* Os dois blocos ESTICAM para preencher os 201 px da caixa. Sem isto eles
   ficavam com a largura natural (131 px) e sobravam 70 px mortos à direita
   -- era o vazio que aparecia na comparação com a foto. */
.selch>*{flex:1 1 0;min-width:0}
.selch>.caixa:first-child{flex:0 0 40%}
.selch>div:last-child{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.selch .caixa{display:flex;flex-direction:column;justify-content:center}
.gridmix{align-content:space-between;height:100%;justify-items:center}
.eqlinha{justify-content:space-around}
.selch .caixa{border:1px solid #4a4e54;border-radius:3px;padding:3px 3px;position:relative}
.selch .caixa>.tit{
  position:absolute;top:-5px;left:4px;background:var(--painel);padding:0 3px;
  font-size:6px;color:var(--serigrafia);letter-spacing:.3px;font-weight:600;
}
.gridmix{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px}
.gridmix .cel{display:flex;flex-direction:column;align-items:center;gap:1px}
.gridmix .cel small{font-size:6.5px;color:var(--serigrafia-fraca);line-height:1}
.eqlinha{display:flex;align-items:flex-end;gap:3px;margin-top:1px}
.eqlinha .cel{display:flex;flex-direction:column;align-items:center;gap:0}
.eqlinha .cel small{font-size:4.5px;color:var(--serigrafia-fraca);line-height:1}
.gridmix .cel small{font-size:5px}
.faixa-eq{font-size:5.5px;color:var(--serigrafia);text-align:center;letter-spacing:.3px}

/* ================= touch screen ================= */
/* Display: 24.5 % da mesa = moldura com a TELA LCD (16.8 %, razão ~4:3)
   à esquerda e a placa YAMAHA / M7CL (6.7 %) à direita. MEDIDO na p.17. */
.telabox{
  flex:0 0 auto;background:var(--painel);border-radius:6px;border:1px solid #000;
  padding:5px;display:flex;gap:4px;position:relative;
}
.placa{
  flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
  align-items:flex-end;justify-content:space-between;padding:2px 2px 6px;
}
.placa .ym{font-size:13px;font-weight:800;letter-spacing:1.5px;color:#d8dbe0}
.placa .mod{text-align:right;line-height:1.15}
.placa .mod u{display:block;font-size:5.5px;letter-spacing:.6px;color:#92969c;
  text-decoration:none}
.placa .mod b{font-size:17px;letter-spacing:.5px;color:#e4e7ea}
/* centro do andar de cima: bridge em cima (atravessando os dois),
   selected channel + display embaixo. Larguras fixas porque foram MEDIDAS. */
/* O centro alinha pela BASE com os blocos de input: na planta os blocos vão
   até y=310 e o display até y=315. Alinhado pelo topo, sobrava um degrau de
   uns 100 px embaixo do display -- foi o "flutuando" que o dono viu.
   Altura: bridge (30..110) + display (117..315) = 285 px de 734 = 38,8 %. */
.centro{
  flex:0 0 auto;display:flex;flex-direction:column;gap:5px;
  align-self:flex-end;height:405px;
}
/* altura da faixa selected-channel/display: 198 px de 734 = 27 % = 282 px.
   Alinhada ao topo: abaixo dela a mesa real tem chassi liso até a Centralogic. */
.centro-linha{flex:0 0 auto;height:282px;display:flex;gap:6px;align-items:stretch}

/* --- meter bridge MBM7CL (atravessa selected channel + tela) --- */
/* altura da bridge: 80 px de 734 na planta = 114 px no palco */
.bridge{
  flex:0 0 auto;width:100%;height:114px;overflow:hidden;display:flex;gap:8px;align-items:stretch;
  background:#0e1012;border:1px solid #000;border-radius:4px;padding:3px 6px;
  box-shadow:inset 0 1px 0 #ffffff12;
}
.bcols{flex-wrap:nowrap}
.bgrupo{display:flex;flex-direction:column;gap:1px}
.bcols{display:flex;gap:3px;align-items:flex-end}
.bcol{display:flex;flex-direction:column;align-items:center;gap:1px}
.bcol>span{font-size:6px;color:var(--serigrafia-fraca);line-height:1}
.bleds{display:flex;flex-direction:column;gap:1px}
/* LED apagado não é cinza morto: é o próprio LED sem corrente, e a grade
   continua visível de longe (ver foto da bridge). */
/* LED bicolor APAGADO é escuro, seja qual for a cor que ele acende.
   Pintar o topo de vermelho/âmbar escuro deixava a bridge com cara suja --
   na foto a bridge apagada é uma grade verde-escura uniforme. */
.bleds b{display:block;width:10px;height:5px;border-radius:1px;background:#15281a;
  box-shadow:inset 0 0 0 1px #0a0c0b}
.bleds b.a{background:var(--led-on);box-shadow:0 0 4px #48e05a99}
.bleds b.a.am{background:#e8c020;box-shadow:0 0 4px #e8c02099}
.bleds b.a.ov{background:var(--led-over);box-shadow:0 0 5px var(--led-over)}
.brot{font-size:6.5px;color:var(--serigrafia-fraca);text-align:center;letter-spacing:1px}
.betiq{margin-left:auto;align-self:center;font-size:6.5px;color:var(--serigrafia-fraca);
  border:1px solid #34383d;border-radius:2px;padding:2px 5px}
.bridge .logo{align-self:center;font-size:13px;font-weight:800;letter-spacing:2.5px;
  color:#d8dbe0;padding-left:6px}
/* "M7CL" impresso à direita da tela, como na foto */
.telabox .marca{font-size:13px;letter-spacing:1.5px;color:#b9bdc3;font-weight:700}

/* TELA LCD: 16.8 % da mesa = 322 px. Razão medida na p.17: 226x172 px = 1.31,
   ou seja ~4:3 -- NÃO é widescreen (foi outro erro da 1ª versão). */
/* Altura MEDIDA na planta: 172 px de 734 = 23.4 % da profundidade = 246 px.
   Fixa em px de propósito -- derivar altura da largura (aspect-ratio) é o que
   já cortou simulador em tela cheia neste projeto. */
#tela{
  flex:0 0 auto;display:flex;gap:3px;
  background:var(--tela-fundo);border:2px solid #0a0b0c;border-radius:2px;padding:3px;
  color:var(--tela-texto);font-size:10px;overflow:hidden;
}
#area{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* --- function access area (barra direita da tela, p.32) --- */

/* ================= Centralogic / UDK / NAV / SCENE ================= */
.subtit{font-size:7.5px;color:var(--serigrafia);letter-spacing:.6px;text-align:center;

.udk{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}

.nav{display:flex;gap:4px;align-items:flex-start}

.nav .navk{

.cena-sec{display:flex;align-items:center;gap:6px}

/* ================= rodapé de ajuda ================= */

/* ================= popups da tela ================= */

/* botão genérico dentro da tela */
.tbt{

/* ================= barra de aprendizado (fora da console) ================= */

}
#lupa{

  background:#1f6fb8;border:1px solid #0d3f6d;border-radius:3px;color:#fff;
  font-size:11px;padding:3px 9px;cursor:pointer;

/* modo lupa: a tela ocupa a mesa inteira, para o aluno enxergar */
.mesa.lupa .andar,.mesa.lupa .rodape{display:none}
.mesa.lupa .telabox{display:flex;position:absolute;inset:8px}

<body>
<div id="palco">
  <div class="mesa" id="mesa"></div>
  <button id="lupa" type="button">AMPLIAR TELA</button>
</div>

<script>
"use strict";
/* ==================================================================
   MOTOR DO SIMULADOR
   Tudo em DOM/SVG de propósito: o portão de teste do projeto
   (ferramentas/clicar-tudo.mjs) não enxerga dentro de <canvas>, então
   um botão desenhado em canvas passaria por "vivo" sem nunca ter sido
   clicado. Curva de EQ é SVG, que é DOM e é inspecionável.
   ================================================================== */

/* ---------- constantes da mesa (MEDIDAS no manual) ---------- */
const N_IN = 48;            // M7CL-48
const N_STIN = 4;
const N_MIX = 16;
const N_MTX = 8;
const N_DCA = 8;
const N_MUTE = 8;

/* escala impressa no fader, p.18 */
const ESCALA_FADER = [10,5,0,-5,-10,-20,-30,-40,-50,-60,-Infinity];
/* LEDs do meter do strip, p.18 */
const LEDS_STRIP = ["OVER","-6","-12","-18","-30","-60"];

/* ---------- helpers ---------- */
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const fmtDb = v => v <= -138 ? "-∞" : (v>0?"+":"") + v.toFixed(1);

/* dB do fader -> posição 0..1 no trilho.
   O fader da M7CL não é linear em dB: de +10 a -10 o curso é largo e
   embaixo comprime. Reproduzo a escala impressa por interpolação nos
   próprios pontos serigrafados, que é o que o operador enxerga. */
const PONTOS = [[10,1],[5,.93],[0,.84],[-5,.75],[-10,.66],[-20,.52],
                [-30,.40],[-40,.28],[-50,.17],[-60,.07],[-138,0]];
function dbParaPos(db){
  if (db <= -138) return 0;
  for (let i=0;i<PONTOS.length-1;i++){
    const [d1,p1] = PONTOS[i], [d2,p2] = PONTOS[i+1];
    if (db <= d1 && db >= d2) return p2 + (db-d2)*(p1-p2)/(d1-d2);
  }
  return db > 10 ? 1 : 0;
}
function posParaDb(p){
  p = clamp(p,0,1);
  if (p <= 0) return -138;
  for (let i=0;i<PONTOS.length-1;i++){
    const [d1,p1] = PONTOS[i], [d2,p2] = PONTOS[i+1];
    if (p <= p1 && p >= p2) return d2 + (p-p2)*(d1-d2)/(p1-p2);
  }
  return 10;
}

/* ---------- estado ---------- */
function novoCanal(id, tipo, nome){
  return {
    id, tipo, nome,
    on: true, sel:false, cue:false,
    fader: tipo==="in" || tipo==="stin" ? -138 : 0,
    /* HA: faixa MEDIDA no manual -62..+10 dB */
    ha:{ gain:-20, phantom:false, phase:false },
    hpf:{ on:tipo==="in"||tipo==="stin", freq:80 },        /* 20..600 Hz */
    /* EQ 4 bandas, faixas MEDIDAS: F 20..20k, G ±18, Q 0.10..10 */
    eq:{ on:true, tipo:"I", att:0, bandas:{
      low:  {f:125,  g:0, q:0.7},
      lomid:{f:1000, g:0, q:0.7},
      himid:{f:4000, g:0, q:0.7},
      high: {f:10000,g:0, q:0.7} } },
    /* DYN1 gate/comp, DYN2 comp/de-esser -- faixas do manual p.249 */
    dyn1:{ on:false, tipo:"GATE", thr:-26, range:-70, attack:0, hold:0.02, decay:0.3 },
    dyn2:{ on:false, tipo:"COMP", thr:-14, ratio:2.5, attack:6, release:0.3, knee:2, out:0 },
    pan:0, toSt:true, toMono:false,
    mix: Array.from({length:N_MIX}, () => ({ lvl:-138, on:true, pre:false })),
    mtx: Array.from({length:N_MTX}, () => ({ lvl:-138, on:true, pre:false })),
    dca:[], mute:[],
    insert:false, dout:false, recallSafe:false,
    nivel:0   /* nível instantâneo p/ os meters */
  };
}

const S = {
  canais:{},
  sel:"CH1",
  nav:"IN1-8",          /* nav key ativa -> quem está na Centralogic */
  navFixa:null,         /* nav key segurada 2s fixa a Centralogic */
  tela:"OVERVIEW",
  popup:null,
  sof:null,             /* SENDS ON FADER: null | {tipo:"mix"|"mtx", n:0..} */
  sendDest:"mix",       /* TO MIX x TO MATRIX no OVERVIEW */
  cena:{ n:0, nome:"Initial Data", lista:[] },
  monitor:{ nivel:0.7, cueAtivo:false, dimm:false },
  osc:{ on:false, tipo:"SINE", freq:1000, nivel:-20 },
  talkback:{ on:false, nivel:-10 },
  udk:[],               /* 12 funções */
  usuario:"ADMIN",
  ajuda:"",
};

/* --- monta os canais --- */
for (let i=1;i<=N_IN;i++)   S.canais["CH"+i]  = novoCanal("CH"+i,"in","ch "+i);
for (let i=1;i<=N_STIN;i++) S.canais["ST"+i]  = novoCanal("ST"+i,"stin","ST IN "+i);
for (let i=1;i<=N_MIX;i++)  S.canais["MIX"+i] = novoCanal("MIX"+i,"mix","MIX "+i);
for (let i=1;i<=N_MTX;i++)  S.canais["MTX"+i] = novoCanal("MTX"+i,"mtx","MATRIX "+i);
for (let i=1;i<=N_DCA;i++) S.canais["DCA"+i] = novoCanal("DCA"+i,"dca","DCA "+i);
S.canais["STEREO"] = novoCanal("STEREO","stereo","ST");
S.canais["MONO"]   = novoCanal("MONO","mono","MONO");

/* Ordem do dono: a mesa nasce com TODOS os faders embaixo (-∞).
   É também como se entrega uma console para o show: nada aberto. */
for (const c of Object.values(S.canais)) c.fader = -138;

/* funções que a Yamaha permite nas 12 USER DEFINED KEYS (apêndice p.280) */
const FUNCOES_UDK = [
  "SCENE INC","SCENE DEC","SCENE RECALL","TALKBACK ON","OSCILLATOR ON",
  "MONITOR DIMM","SENDS ON FADER","CUE CLEAR","METER PEAK HOLD","TAP TEMPO",
  "MUTE GROUP 1","MUTE GROUP 2","HELP","(sem atribuição)"
];
S.udk = ["SCENE DEC","SCENE INC","SCENE RECALL","TALKBACK ON",
         "OSCILLATOR ON","CUE CLEAR","SENDS ON FADER","MONITOR DIMM",
         "MUTE GROUP 1","MUTE GROUP 2","TAP TEMPO","HELP"];

/* 300 cenas -- a 000 é "Initial Data" e é read-only na mesa real */
S.cena.lista = [{n:0,nome:"Initial Data",bloq:true,dados:null}];

/* ---------- qual grupo a Centralogic está controlando ---------- */
const NAVS = [
  {id:"IN1-8",   rot:"1-8",     alvo:i=>"CH"+(1+i)},
  {id:"IN9-16",  rot:"9-16",    alvo:i=>"CH"+(9+i)},
  {id:"IN17-24", rot:"17-24",   alvo:i=>"CH"+(17+i)},
  {id:"IN25-32", rot:"25-32",   alvo:i=>"CH"+(25+i)},
  {id:"IN33-40", rot:"33-40",   alvo:i=>"CH"+(33+i)},
  {id:"IN41-48", rot:"41-48",   alvo:i=>"CH"+(41+i)},
  {id:"STIN",    rot:"ST IN",   alvo:i=>i<4?"ST"+(1+i):null},
  {id:"DCA",     rot:"DCA",     alvo:i=>"DCA"+(1+i)},
  {id:"MIX1-8",  rot:"MIX1-8",  alvo:i=>"MIX"+(1+i)},
  {id:"MIX9-16", rot:"MIX9-16", alvo:i=>"MIX"+(9+i)},
  {id:"MATRIX",  rot:"MATRIX",  alvo:i=>"MTX"+(1+i)},
  /* p.23: [STEREO] põe ST L/R + MONO nos módulos 1-3; 4-8 ficam sem uso */
  {id:"STEREO",  rot:"STEREO",  alvo:i=>i===0?"STEREO":i===1?"STEREO":i===2?"MONO":null},
];
const navPorId = id => NAVS.find(n=>n.id===id);
function grupoCentralogic(){
  const nv = navPorId(S.navFixa || S.nav) || NAVS[0];
  return Array.from({length:8}, (_,i)=>nv.alvo(i));
}
/* o OVERVIEW pode estar mostrando um grupo diferente do da Centralogic
   (p.98/104) -- por isso as duas leituras são separadas */
function grupoTela(){
  const nv = navPorId(S.nav) || NAVS[0];
  if (nv.id === "DCA") {           /* p.98: não existe OVERVIEW de DCA */
    const ant = navPorId(S.navAnterior || "IN1-8");
    return Array.from({length:8}, (_,i)=>ant.alvo(i));
  }
  return Array.from({length:8}, (_,i)=>nv.alvo(i));
}

/* ---------- render coalescido por frame ----------
   (memória do projeto: repaint síncrono por pointermove travava o iPad) */
let sujo = false;
function pedirRender(){
  if (sujo) return;
  sujo = true;
  requestAnimationFrame(()=>{ sujo = false; desenhar(); });
}

/* ================= construção do DOM da mesa =================
   MEDIDAS DA PLANTA (p.17), caixa do painel = 1349 px de largura.
   Convertidas para o palco de 1920 px pelo fator 1920/1349 = 1,4233.
   Os dois andares usam os MESMOS x para os blocos de input -- é isso que
   mantém 41-48 (cima) e 33-40 (baixo) na mesma coluna, como na foto.    */
const F = 1920/1349;
const mm = px => Math.round(px * F);          /* planta -> palco */

/* Os x abaixo são as MOLDURAS do desenho, achadas por densidade de traço
   (colunas com preto em >80 % da altura), medidas separadamente no andar de
   cima e no de baixo. Correção importante da 2ª rodada: a 1ª versão media
   "colunas vazias", e o texto "Centralogic™" impresso no chassi partia o vão
   em dois -- daí a Centralogic ter saído 100 px larga demais e o vão estreito.
   Molduras COMUNS aos dois andares (a carcaça): 53 · 233 · 257 · 436 · 1135 · 1314 */
const MED = {
  x0:        mm(53),                 /*  75  borda até o 1º bloco de input     */
  bloco8:    mm(233-53),             /* 256  um grupo de 8 canais              */
  divisoria: mm(257-233),            /*  34  chassi entre os dois grupos de 8  */
  bloco8b:   mm(436-257),            /* 255  o segundo grupo de 8              */
  blocoDir:  mm(1314-1135),          /* 255  8 strips, à direita               */
  /* andar de cima */
  vaoCima:   mm(566-436),            /* 185  chassi antes do SELECTED CHANNEL  */
  selch:     mm(707-566),            /* 201  SELECTED CHANNEL — a moldura
                                             EXTERNA é 566; eu tinha pegado a
                                             linha interna (579) e perdido
                                             20 px de largura útil de knob    */
  vaoSel:    mm(715-707),            /*  11                                    */
  lcd:       mm(945-715),            /* 327  a TELA                            */
  placa:     mm(1036-945),           /* 130  YAMAHA / M7CL impressos           */
  vaoDir:    mm(1135-1036),          /* 141  chassi depois do display          */
  /* andar de baixo */
  vaoStin:   mm(454-436),            /*  26                                    */
  stin:      mm(570-454),            /* 165  4 strips ST IN                    */
  vaoCL:     mm(722-570),            /* 216  o vão com a marca Centralogic     */
  centralog: mm(902-722),            /* 256  8 strips -- MESMA largura dos de
                                             input (22,5 px na planta), não
                                             mais largos como eu tinha feito   */
  meio:      mm(1042-902),           /* 199  SCENE / UDK / NAV                 */
  master:    mm(1103-1042),          /*  87  STEREO + MONO                     */
  vaoMaster: mm(1135-1103),          /*  46                                    */
};
const vao = w => { const v = el("div","vao-chassi"); v.style.width = w+"px"; return v; };

/* O "bloco de 16" da esquerda são na verdade DOIS blocos de 8 com uma
   divisória de chassi no meio (planta: 36..234 | 234..256 | 256..445).
   Na foto isso é bem visível -- fazer um bloco único de 16 apagava a
   divisória e deixava a mesa com cara de painel corrido. */
function parDeBlocos(primeiro){
  const total = MED.bloco8 + MED.divisoria + MED.bloco8b;
  const w = el("div");
  w.style.cssText = "flex:0 0 auto;display:flex;gap:"+MED.divisoria+"px;width:"+total+"px";
  [[0,MED.bloco8],[8,MED.bloco8b]].forEach(([off,larg])=>{
    const b = fazBloco(Array.from({length:8},(_,i)=>{
      const n = primeiro + off + i;
      return fazStrip("CH"+n, String(n));
    }));
    b.style.width = larg+"px";
    w.appendChild(b);
  });
  return w;
}

const mesa = document.getElementById("mesa");

function fazTecla(cls, rotulo){
  const cel = el("div","udkcel");
  const b = el("button","tecla "+cls);
  b.type = "button";
  b.appendChild(el("i"));
  cel.appendChild(b);
  if (rotulo) cel.appendChild(el("small",null,rotulo));
  return {cel, b};
}

function fazMeterLed(){
  const m = el("div","meterled");
  LEDS_STRIP.forEach((_,i)=>{
    const b = el("b");
    if (i===0) b.classList.add("ov");        /* OVER: vermelho */
    else if (i===1) b.classList.add("am");   /* -6: âmbar */
    m.appendChild(b);
  });
  return m;
}

function fazFader(){
  const f = el("div","fader");
  f.appendChild(el("div","trilho"));
  const esc = el("div","escala");
  ESCALA_FADER.forEach(v=>{
    const p = dbParaPos(v===-Infinity?-138:v);
    const y = (1-p)*100;
    const t = el("span",null, v===-Infinity?"-∞":String(v));
    t.style.top = y+"%";
    const u = el("u"); u.style.top = y+"%";
    esc.appendChild(u); esc.appendChild(t);
  });
  f.appendChild(esc);
  f.appendChild(el("div","cursor"));
  return f;
}

/* um strip completo (input, ST IN, centralogic, master) */
function fazStrip(idCanal, rotuloTopo, opc){
  opc = opc || {};
  const s = el("div","strip"+(opc.classe ? " "+opc.classe : ""));
  s.dataset.canal = idCanal || "";

  /* Na Centralogic o strip começa DIRETO no encoder: não existe etiqueta de
     número no topo (o número fica só no rodapé) -- conferido na planta e na
     foto. Nos canais de input a etiqueta azul existe. */
  if (opc.encoder){
    const k = el("div","knob enc");
    k.dataset.papel = "enc";
    s.appendChild(k);
  } else {
    s.appendChild(el("div","num",rotuloTopo));
  }
  const sel = fazTecla("sel","SEL");  s.appendChild(sel.cel); sel.b.dataset.acao="sel";
  const cue = fazTecla("cue","CUE");  s.appendChild(cue.cel); cue.b.dataset.acao="cue";
  s.appendChild(fazMeterLed());
  const on  = fazTecla("on","ON");    s.appendChild(on.cel);  on.b.dataset.acao="on";
  const nm  = el("div","nome");       s.appendChild(nm);
  s.appendChild(fazFader());
  s.appendChild(el("div","num b",opc.rodape != null ? opc.rodape : rotuloTopo));
  return s;
}

/* ---- meter bridge MBM7CL (opcional no hardware; p.19)
   MIX 1-16 à esquerda, MATRIX 1-8 à direita. Escala MEDIDA:
   OVER,-3,-6,-9,-12,-15,-18,-24,-30,-40,-50,-60 ---- */
const ESCALA_BRIDGE = ["OVER","-3","-6","-9","-12","-15","-18","-24","-30","-40","-50","-60"];
function fazMeterBridge(){
  const mb = el("div","bridge");
  /* TRÊS blocos, como na p.19 e na foto: MIX 1-8 | MIX 9-16 | MATRIX 1-8.
     Eu tinha feito o MIX como um bloco corrido de 16. */
  const faz = (rot, n, pref, base) => {
    base = base || 0;
    const g = el("div","bgrupo");
    const cols = el("div","bcols");
    for (let i=0;i<n;i++){
      const c = el("div","bcol");
      c.dataset.canal = pref+(base+i+1);
      c.appendChild(el("span",null,String(base+i+1)));
      const leds = el("div","bleds");
      ESCALA_BRIDGE.forEach((_,j)=>{
        const b=el("b");
        if (j===0) b.classList.add("ov");            /* OVER */
        else if (j<=2) b.classList.add("am");        /* -3 / -6 */
        leds.appendChild(b);
      });
      c.appendChild(leds);
      cols.appendChild(c);
    }
    g.appendChild(cols);
    g.appendChild(el("div","brot",rot));
    return g;
  };
  mb.appendChild(faz("MIX", 8, "MIX", 0));

const $ajuda = () => document.getElementById("ajuda");

function canalDoStrip(strip){
  if (strip.dataset.cl != null && strip.dataset.cl !== "")
    return grupoCentralogic()[+strip.dataset.cl];
  return strip.dataset.canal || null;
}

/* valor que o fader mostra: em SENDS ON FADER ele vira o send, não o nível
   do canal (p.18 -- "In SENDS ON FADER mode, this adjusts the send level") */
function valorFader(c){
  if (!c) return -138;
  if (S.sof && (c.tipo==="in" || c.tipo==="stin")){
    const arr = S.sof.tipo==="mix" ? c.mix : c.mtx;
    return arr[S.sof.n].lvl;
  }
  return c.fader;
}
function ligadoFader(c){
  if (!c) return false;
  if (S.sof && (c.tipo==="in" || c.tipo==="stin")){
    const arr = S.sof.tipo==="mix" ? c.mix : c.mtx;
    return arr[S.sof.n].on;
  }
  return c.on;
}

function desenharStrip(strip){
  const id = canalDoStrip(strip);
  const c = id ? S.canais[id] : null;

  strip.style.opacity = c ? "1" : ".35";

  /* nome */
  const nm = strip.querySelector(".nome");
  if (nm) nm.textContent = c ? c.nome : "";

  /* Na Centralogic só existe o número do RODAPÉ (não há etiqueta no topo),
     então é o primeiro .num do strip -- e ele mostra o módulo 1-8, fixo. */
  if (strip.dataset.cl != null && strip.dataset.cl !== "" && c){
    const num = strip.querySelector(".num");
    if (num) num.textContent = String(+strip.dataset.cl + 1);
  }

  /* teclas */
  const sel = strip.querySelector('[data-acao="sel"]');
  const cue = strip.querySelector('[data-acao="cue"]');
  const on  = strip.querySelector('[data-acao="on"]');
  /* p.18: em SENDS ON FADER os [SEL] de TODOS os canais acendem */
  if (sel) sel.classList.toggle("on", !!c && (S.sel===id || (!!S.sof && (c.tipo==="in"||c.tipo==="stin"))));
  if (cue) cue.classList.toggle("on", !!c && c.cue);
  if (on)  on.classList.toggle("on", ligadoFader(c));

  /* fader */
  const cur = strip.querySelector(".cursor");
  if (cur){
    const p = dbParaPos(valorFader(c));
    cur.style.top = ((1-p)*100).toFixed(2)+"%";
  }

  /* meter de 6 LEDs */
  const leds = strip.querySelectorAll(".meterled b");
  const n = c ? c.nivel : 0;                    /* 0..1 */
  const limiares = [0.97,0.82,0.66,0.5,0.3,0.12];
  leds.forEach((b,i)=>b.classList.toggle("a", n >= limiares[i]));

  /* encoder da Centralogic */
  const enc = strip.querySelector('[data-papel="enc"]');
  if (enc && c) enc.style.setProperty("--ang", (valorEncoderCL(c)*270-135)+"deg");
}

/* o encoder multifunção segue o parâmetro selecionado na tela (p.99) */
function valorEncoderCL(c){
  if (S.encFoco === "pan") return (c.pan+1)/2;
  if (S.encFoco && S.encFoco.startsWith("send")){
    const n = +S.encFoco.slice(4);
    const arr = S.sendDest==="mix" ? c.mix : c.mtx;
    return dbParaPos(arr[n] ? arr[n].lvl : -138);
  }
  return dbParaPos(c.fader);
}
S.encFoco = "send0";

function desenhar(){
  document.querySelectorAll(".strip").forEach(desenharStrip);
  desenharBridge();
  desenharSelectedChannel();
  desenharNav();

  desenharTela();

/* ---- knobs do SELECTED CHANNEL ---- */
const anguloDe = (v,min,max) => ((v-min)/(max-min))*270-135;

function desenharSelectedChannel(){
  const c = S.canais[S.sel];
  if (!c) return;
  const box = document.querySelector(".selch");
  if (!box) return;

  box.querySelectorAll('[data-papel="send"]').forEach(k=>{
    const n = +k.dataset.n;
    const arr = ehSaida(c) ? c.mtx : c.mix;
    const s = arr[n];
    k.style.setProperty("--ang", (s ? dbParaPos(s.lvl)*270-135 : -135)+"deg");
    k.style.opacity = s ? (s.on?"1":".45") : ".2";
  });
  const set = (papel,ang)=>{
    const k = box.querySelector('[data-papel="'+papel+'"]');
    if (k) k.style.setProperty("--ang", ang+"deg");
  };
  set("ha",   anguloDe(c.ha.gain,-62,10));
  set("pan",  anguloDe(c.pan,-1,1));
  set("hpf",  anguloDe(Math.log10(c.hpf.freq), Math.log10(20), Math.log10(600)));
  set("dyn1", anguloDe(c.dyn1.thr,-72,0));
  set("dyn2", anguloDe(c.dyn2.thr,-54,0));
  box.querySelectorAll('[data-papel="eq"]').forEach(k=>{
    const b = c.eq.bandas[k.dataset.banda];
    if (!b) return;
    let ang;
    if (k.dataset.par==="f") ang = anguloDe(Math.log10(b.f), Math.log10(20), Math.log10(20000));
    else if (k.dataset.par==="g") ang = anguloDe(b.g,-18,18);
    else ang = anguloDe(Math.log10(b.q), Math.log10(0.1), Math.log10(10));
    k.style.setProperty("--ang", ang+"deg");
  });
  const km = document.querySelector('[data-papel="monitor"]');
  if (km) km.style.setProperty("--ang", anguloDe(S.monitor.nivel,0,1)+"deg");
}
const ehSaida = c => c && (c.tipo==="mix"||c.tipo==="mtx"||c.tipo==="stereo"||c.tipo==="mono");

function desenharNav(){
  document.querySelectorAll("[data-nav]").forEach(b=>{

    b.classList.toggle("piscando", b.dataset.nav === S.navFixa);

/* ==================================================================
   INTERAÇÃO — arrastar faders e knobs, clicar teclas
   ================================================================== */
let arrasto = null;

function ondeCliquei(alvo){
  const k = alvo.closest(".knob");
  if (k) return {tipo:"knob", nó:k};
  const f = alvo.closest(".fader");
  if (f) return {tipo:"fader", nó:f};
  return null;
}

document.addEventListener("pointerdown", ev=>{
  const alvo = ev.target;

  /* --- teclas do strip --- */
  const tecla = alvo.closest("[data-acao]");
  if (tecla){ acaoTecla(tecla, ev); return; }

  const nav = alvo.closest("[data-nav]");
  if (nav){ acaoNav(nav, ev); return; }

  const udk = alvo.closest("[data-udk]");
  if (udk){ acaoUDK(+udk.dataset.udk); return; }

  /* fita branca do nome: na mesa real é onde se escreve o canal.
     Clicar seleciona o canal e abre o CH JOB, que tem o campo do nome. */
  const fita = alvo.closest(".nome");
  if (fita){
    const strip = fita.closest(".strip");
    const id = canalDoStrip(strip);
    if (id){
      S.sel = id;
      abrirPopup("CHJOB");
      S.ajuda = "Escreva o nome de <b>"+S.canais[id].nome+"</b> — igual a escrever na fita da mesa";
      pedirRender();
    }
    return;
  }

  /* --- arraste --- */
  const alvoDrag = ondeCliquei(alvo);
  if (!alvoDrag) return;
  ev.preventDefault();

  const strip = alvo.closest(".strip");
  arrasto = { ...alvoDrag, strip, y0: ev.clientY, ini:null, nó:alvoDrag.nó };

  if (alvoDrag.tipo === "fader"){
    /* clicar no trilho já leva o cursor para lá (como puxar o fader) */
    const r = alvoDrag.nó.getBoundingClientRect();
    const p = 1 - (ev.clientY - r.top) / r.height;
    aplicarFader(strip, posParaDb(clamp(p,0,1)));
  } else {
    arrasto.ini = lerKnob(alvoDrag.nó, strip);
  }
  try { alvoDrag.nó.setPointerCapture(ev.pointerId); } catch(e){}
  pedirRender();
});

document.addEventListener("pointermove", ev=>{
  if (!arrasto) return;
  ev.preventDefault();
  if (arrasto.tipo === "fader"){
    const r = arrasto.nó.getBoundingClientRect();
    const p = 1 - (ev.clientY - r.top) / r.height;
    aplicarFader(arrasto.strip, posParaDb(clamp(p,0,1)));
  } else {
    const d = (arrasto.y0 - ev.clientY) / 140;   /* 140px = curso cheio */
    aplicarKnob(arrasto.nó, arrasto.strip, arrasto.ini, d);
  }
  pedirRender();
});

document.addEventListener("pointerup", ()=>{ arrasto = null; });
document.addEventListener("pointercancel", ()=>{ arrasto = null; });

function aplicarFader(strip, db){
  const id = canalDoStrip(strip);
  const c = S.canais[id];
  if (!c) return;
  db = clamp(db,-138,10);
  if (S.sof && (c.tipo==="in"||c.tipo==="stin")){
    const arr = S.sof.tipo==="mix" ? c.mix : c.mtx;
    arr[S.sof.n].lvl = db;
    S.ajuda = "<b>"+c.nome+"</b> → send "+(S.sof.tipo==="mix"?"MIX ":"MATRIX ")+(S.sof.n+1)+": "+fmtDb(db)+" dB";
  } else {
    c.fader = db;
    S.ajuda = "<b>"+c.nome+"</b> fader: "+fmtDb(db)+" dB";
  }
}

function lerKnob(k, strip){
  const c = S.canais[S.sel];
  const papel = k.dataset.papel;
  if (papel==="monitor") return S.monitor.nivel;
  if (!c) return 0;
  if (papel==="ha")   return c.ha.gain;
  if (papel==="pan")  return c.pan;
  if (papel==="hpf")  return c.hpf.freq;
  if (papel==="dyn1") return c.dyn1.thr;
  if (papel==="dyn2") return c.dyn2.thr;
  if (papel==="send"){ const a = ehSaida(c)?c.mtx:c.mix; const s=a[+k.dataset.n]; return s?s.lvl:-138; }
  if (papel==="eq"){
    const b = c.eq.bandas[k.dataset.banda];
    return k.dataset.par==="f" ? b.f : k.dataset.par==="g" ? b.g : b.q;
  }
  if (papel==="enc"){
    const id = canalDoStrip(strip); const cc = S.canais[id];
    if (!cc) return 0;
    if (S.encFoco==="pan") return cc.pan;
    if (S.encFoco && S.encFoco.startsWith("send")){
      const a = S.sendDest==="mix"?cc.mix:cc.mtx; const s=a[+S.encFoco.slice(4)];
      return s?s.lvl:-138;
    }
    return cc.fader;
  }
  return 0;
}

function aplicarKnob(k, strip, ini, d){
  const papel = k.dataset.papel;
  if (papel==="monitor"){
    S.monitor.nivel = clamp(ini + d, 0, 1);
    S.ajuda = "<b>MONITOR LEVEL</b>: "+Math.round(S.monitor.nivel*10)+" / 10";
    return;
  }
  const c = S.canais[S.sel];
  if (!c) return;
  const nome = c.nome;
  if (papel==="ha"){                       /* faixa MEDIDA: -62..+10 */
    c.ha.gain = clamp(ini + d*72, -62, 10);
    /* p.19: o PAD entra sozinho entre -14 e -13 dB. Comportamento real. */
    const pad = c.ha.gain >= -13;
    S.ajuda = "<b>"+nome+"</b> HA GAIN: "+c.ha.gain.toFixed(0)+" dB"+(pad?"  ·  PAD interno LIGADO":"");
  }
  else if (papel==="pan"){
    c.pan = clamp(ini + d*2, -1, 1);
    const v = Math.round(c.pan*63);
    S.ajuda = "<b>"+nome+"</b> PAN: "+(v===0?"C":v<0?"L"+(-v):"R"+v);
  }
  else if (papel==="hpf"){                 /* 20..600 Hz, log */
    const lg = clamp(Math.log10(ini) + d*(Math.log10(600)-Math.log10(20)), Math.log10(20), Math.log10(600));
    c.hpf.freq = Math.round(Math.pow(10,lg));
    S.ajuda = "<b>"+nome+"</b> HPF: "+c.hpf.freq+" Hz  (-12 dB/oct)";
  }
  else if (papel==="dyn1"){
    c.dyn1.thr = clamp(ini + d*72, -72, 0);
    S.ajuda = "<b>"+nome+"</b> DYN1 "+c.dyn1.tipo+" THRESHOLD: "+c.dyn1.thr.toFixed(0)+" dB";
  }
  else if (papel==="dyn2"){
    c.dyn2.thr = clamp(ini + d*54, -54, 0);
    S.ajuda = "<b>"+nome+"</b> DYN2 "+c.dyn2.tipo+" THRESHOLD: "+c.dyn2.thr.toFixed(0)+" dB";
  }
  else if (papel==="send"){
    const arr = ehSaida(c)?c.mtx:c.mix;
    const n = +k.dataset.n;
    if (!arr[n]) return;
    arr[n].lvl = clamp(posParaDb(dbParaPos(ini)+d), -138, 10);
    S.encFoco = "send"+n;
    S.ajuda = "<b>"+nome+"</b> → "+(ehSaida(c)?"MATRIX ":"MIX ")+(n+1)+": "+fmtDb(arr[n].lvl)+" dB";
  }
  else if (papel==="eq"){
    const b = c.eq.bandas[k.dataset.banda];
    const rot = {high:"HIGH",himid:"HIGH MID",lomid:"LOW MID",low:"LOW"}[k.dataset.banda];
    if (k.dataset.par==="f"){              /* 20 Hz..20 kHz, log, passo 1/12 oitava */
      const lg = clamp(Math.log10(ini)+d*3, Math.log10(20), Math.log10(20000));
      b.f = Math.round(Math.pow(10,lg));
      S.ajuda = "<b>"+nome+"</b> EQ "+rot+" FREQ: "+(b.f>=1000?(b.f/1000).toFixed(2)+" k":b.f)+"Hz";
    } else if (k.dataset.par==="g"){       /* ±18 dB */
      b.g = clamp(ini + d*36, -18, 18);
      S.ajuda = "<b>"+nome+"</b> EQ "+rot+" GAIN: "+(b.g>0?"+":"")+b.g.toFixed(1)+" dB";
    } else {                               /* Q 0.10..10 */
      const lg = clamp(Math.log10(ini)+d*2, Math.log10(0.1), Math.log10(10));
      b.q = Math.round(Math.pow(10,lg)*100)/100;
      S.ajuda = "<b>"+nome+"</b> EQ "+rot+" Q: "+b.q.toFixed(2);
    }
  }
  else if (papel==="enc"){                 /* encoder multifunção da Centralogic */
    const id = canalDoStrip(strip); const cc = S.canais[id];
    if (!cc) return;
    if (S.encFoco==="pan"){
      cc.pan = clamp(ini + d*2, -1, 1);
      S.ajuda = "<b>"+cc.nome+"</b> PAN (encoder Centralogic)";
    } else if (S.encFoco && S.encFoco.startsWith("send")){
      const n = +S.encFoco.slice(4);
      const arr = S.sendDest==="mix"?cc.mix:cc.mtx;
      if (arr[n]){
        arr[n].lvl = clamp(posParaDb(dbParaPos(ini)+d), -138, 10);
        S.ajuda = "<b>"+cc.nome+"</b> → "+(S.sendDest==="mix"?"MIX ":"MATRIX ")+(n+1)+": "+fmtDb(arr[n].lvl)+" dB";
      }
    } else {
      cc.fader = clamp(posParaDb(dbParaPos(ini)+d), -138, 10);
      S.ajuda = "<b>"+cc.nome+"</b> fader: "+fmtDb(cc.fader)+" dB";
    }
  }
  /* p.91: mexer num knob do SELECTED CHANNEL abre a SELECTED CHANNEL VIEW */
  if (papel!=="enc" && papel!=="monitor" && S.tela!=="SELCH" && !S.popup) S.tela = "SELCH";
}

/* ---- teclas SEL / CUE / ON e SCENE ---- */
function acaoTecla(b, ev){
  const acao = b.dataset.acao;
  if (acao==="store"){ abrirPopup("SCENE_STORE"); pedirRender(); return; }
  if (acao==="recall"){ recallCena(); pedirRender(); return; }
  if (acao==="cenaUp"){ S.cena.n = clamp(S.cena.n+1,0,300); S.ajuda="Cena selecionada: <b>"+num3(S.cena.n)+"</b> (aperte RECALL)"; pedirRender(); return; }
  if (acao==="cenaDown"){ S.cena.n = clamp(S.cena.n-1,0,300); S.ajuda="Cena selecionada: <b>"+num3(S.cena.n)+"</b> (aperte RECALL)"; pedirRender(); return; }

  const strip = b.closest(".strip");
  const id = canalDoStrip(strip);
  const c = S.canais[id];
  if (!c) return;
  if (acao==="sel"){
    /* p.18/23: no ST IN e no STEREO o [SEL] alterna entre L e R */
    if (S.sel===id && (c.tipo==="stin"||c.tipo==="stereo")){
      c.ladoR = !c.ladoR;
      S.ajuda = "<b>"+c.nome+"</b> — controlando o lado "+(c.ladoR?"R":"L");
    } else {
      S.sel = id;
      S.ajuda = "Canal selecionado: <b>"+c.nome+"</b>";
    }
    if (S.tela==="OVERVIEW") S.tela = "OVERVIEW";
  }
  else if (acao==="cue"){
    c.cue = !c.cue;
    S.monitor.cueAtivo = Object.values(S.canais).some(x=>x.cue);
    S.ajuda = "CUE de <b>"+c.nome+"</b> "+(c.cue?"ligado":"desligado");
  }
  else if (acao==="on"){
    if (S.sof && (c.tipo==="in"||c.tipo==="stin")){
      const arr = S.sof.tipo==="mix"?c.mix:c.mtx;
      arr[S.sof.n].on = !arr[S.sof.n].on;
      S.ajuda = "<b>"+c.nome+"</b> send "+(S.sof.n+1)+" "+(arr[S.sof.n].on?"ON":"OFF");
    } else {
      c.on = !c.on;
      S.ajuda = "<b>"+c.nome+"</b> "+(c.on?"ligado":"MUTADO");
    }
  }
  pedirRender();
}
const num3 = n => String(n).padStart(3,"0");

/* ---- NAVIGATION KEYS ----
   p.23: segurar 2s fixa a Centralogic naquele grupo (a tecla pisca);
   depois disso, outra nav key muda SÓ a tela. */
let timerNav = null;
function acaoNav(b, ev){
  const id = b.dataset.nav;
  S.navAnterior = (S.nav !== "DCA") ? S.nav : S.navAnterior;
  S.nav = id;
  S.ajuda = "Centralogic / tela: <b>"+navPorId(id).rot+"</b> — segure 2 s para FIXAR a Centralogic";
  clearTimeout(timerNav);
  timerNav = setTimeout(()=>{
    S.navFixa = id;
    S.ajuda = "Centralogic <b>FIXADA</b> em "+navPorId(id).rot+" — agora as nav keys mudam só a tela. Segure de novo para soltar.";
    pedirRender();
  }, 2000);
  const solta = ()=>{ clearTimeout(timerNav); document.removeEventListener("pointerup",solta); };
  document.addEventListener("pointerup", solta);
  if (S.navFixa === id && ev.detail === 2) S.navFixa = null;
  pedirRender();
}

/* ---- USER DEFINED KEYS ---- */
function acaoUDK(i){
  const f = S.udk[i];
  switch(f){
    case "SCENE INC": S.cena.n = clamp(S.cena.n+1,0,300); recallCena(); break;
    case "SCENE DEC": S.cena.n = clamp(S.cena.n-1,0,300); recallCena(); break;
    case "SCENE RECALL": recallCena(); break;
    case "TALKBACK ON": S.talkback.on = !S.talkback.on;
      S.ajuda = "TALKBACK "+(S.talkback.on?"ligado":"desligado"); break;
    case "OSCILLATOR ON": S.osc.on = !S.osc.on;
      S.ajuda = "OSCILADOR "+(S.osc.on?"LIGADO — cuidado com o PA":"desligado"); break;
    case "MONITOR DIMM": S.monitor.dimm = !S.monitor.dimm;
      S.ajuda = "MONITOR DIMM "+(S.monitor.dimm?"ligado":"desligado"); break;
    case "SENDS ON FADER":
      S.sof = S.sof ? null : {tipo:"mix", n:0};
      S.ajuda = S.sof ? "<b>SENDS ON FADER</b> — os faders viram sends do MIX 1" : "Saiu do SENDS ON FADER";
      break;
    case "CUE CLEAR":
      Object.values(S.canais).forEach(c=>c.cue=false);
      S.monitor.cueAtivo = false; S.ajuda = "CUE limpo em todos os canais"; break;
    case "HELP": abrirPopup("HELP"); break;
    case "TAP TEMPO": S.ajuda = "TAP TEMPO — bata no ritmo (usado no delay do rack)"; break;
    default:
      S.ajuda = "USER DEFINED KEY "+(i+1)+": <b>"+(f||"sem atribuição")+"</b>";
  }
  pedirRender();
}

/* ---- cenas ---- */
function recallCena(){
  const c = S.cena.lista.find(x=>x.n===S.cena.n);
  if (!c){ S.ajuda = "Cena <b>"+num3(S.cena.n)+"</b> está vazia — nada para chamar"; pedirRender(); return; }
  if (c.dados) aplicarCena(c.dados);
  S.cena.nome = c.nome;
  S.ajuda = "Cena <b>"+num3(c.n)+" "+c.nome+"</b> chamada — os faders andaram sozinhos";
  pedirRender();
}
function fotoDaMesa(){
  const f = {};
  for (const [id,c] of Object.entries(S.canais)){
    f[id] = { fader:c.fader, on:c.on, pan:c.pan, toSt:c.toSt, toMono:c.toMono,
      ha:{...c.ha}, hpf:{...c.hpf},
      eq:{on:c.eq.on,tipo:c.eq.tipo,att:c.eq.att,bandas:JSON.parse(JSON.stringify(c.eq.bandas))},
      dyn1:{...c.dyn1}, dyn2:{...c.dyn2},
      mix:c.mix.map(s=>({...s})), mtx:c.mtx.map(s=>({...s})),
      dca:[...c.dca], mute:[...c.mute], insert:c.insert, dout:c.dout, nome:c.nome };
  }
  return f;
}
function aplicarCena(f){
  for (const [id,v] of Object.entries(f)){
    const c = S.canais[id];
    if (!c || c.recallSafe) continue;      /* RECALL SAFE respeitado */
    Object.assign(c, {
      fader:v.fader, on:v.on, pan:v.pan, toSt:v.toSt, toMono:v.toMono,
      ha:{...v.ha}, hpf:{...v.hpf},
      eq:{on:v.eq.on,tipo:v.eq.tipo,att:v.eq.att,bandas:JSON.parse(JSON.stringify(v.eq.bandas))},
      dyn1:{...v.dyn1}, dyn2:{...v.dyn2},
      mix:v.mix.map(s=>({...s})), mtx:v.mtx.map(s=>({...s})),
      dca:[...v.dca], mute:[...v.mute], insert:v.insert, dout:v.dout, nome:v.nome
    });
  }
}
function guardarCena(n, nome){
  if (n===0){ S.ajuda="A cena <b>000 Initial Data</b> é protegida na mesa real — escolha outro número"; return false; }
  const ja = S.cena.lista.findIndex(x=>x.n===n);
  const reg = {n, nome:nome||("SCENE "+num3(n)), bloq:false, dados:fotoDaMesa()};
  if (ja>=0) S.cena.lista[ja] = reg; else S.cena.lista.push(reg);
  S.cena.lista.sort((a,b)=>a.n-b.n);
  S.cena.n = n; S.cena.nome = reg.nome;
  S.ajuda = "Cena <b>"+num3(n)+" "+reg.nome+"</b> guardada";
  return true;
}

/* ---- meters: sinal fictício, só visual. NÃO gera áudio de propósito ---- */
let t0 = 0;
function tickMeters(ts){
  if (ts - t0 > 60){
    t0 = ts;
    for (const c of Object.values(S.canais)){
      if (c.tipo==="in" || c.tipo==="stin"){
        /* nível de entrada depende do ganho de HA; sem sinal se o HA está no fim */
        const base = clamp((c.ha.gain+62)/72, 0, 1);
        const vivo = base * (0.55 + 0.45*Math.sin(ts/300 + c.id.length*1.7 + (+c.id.replace(/\D/g,"")||0)));
        c.nivel = c.on ? clamp(vivo*clamp(dbParaPos(c.fader)+0.15,0,1.2), 0, 1) : 0;
      }
    }
    /* saídas somam o que chega */
    const soma = Object.values(S.canais)
      .filter(c=>(c.tipo==="in"||c.tipo==="stin") && c.on && c.toSt)
      .reduce((a,c)=>a + c.nivel*dbParaPos(c.fader), 0);
    const st = S.canais.STEREO;
    st.nivel = clamp(soma/6 * dbParaPos(st.fader) * (st.on?1:0), 0, 1);
    S.canais.MONO.nivel = st.nivel*0.8;
    pedirRender();
  }
  requestAnimationFrame(tickMeters);
}
requestAnimationFrame(tickMeters);

/* ==================================================================
   TELA TOUCH
   Estrutura só é recriada quando muda a "chave estrutural". Os valores
   que mudam a todo frame (meters, ângulos, dB) são atualizados por
   ligações registradas na construção -- sem recriar nó nenhum.
   ================================================================== */
let LIGACOES = [];
const lig = fn => { LIGACOES.push(fn); fn(); };
let telaChave = null;

function desenharTela(){
  const chave = [S.tela, S.popup, S.sel, S.nav, S.navFixa, S.sendDest,
                 S.sof?S.sof.tipo+S.sof.n:"-", S.cena.n, S.cena.lista.length].join("|");
  if (chave !== telaChave){ telaChave = chave; construirTela(); }
  for (const f of LIGACOES) f();
}

function construirTela(){
  LIGACOES = [];
  const area = document.getElementById("area");
  const fac  = document.getElementById("fac");
  if (!area || !fac) return;
  area.innerHTML = ""; fac.innerHTML = "";
  construirFAC(fac);
  if (S.popup) TELAS_POPUP[S.popup] ? TELAS_POPUP[S.popup](area) : area.appendChild(el("div",null,"?"));
  else (TELAS[S.tela] || TELAS.OVERVIEW)(area);
}

/* ---------- function access area (p.32) ---------- */
function construirFAC(fac){
  const c = S.canais[S.sel];

  const sc = el("div","selcanal");
  sc.appendChild(el("b",null, c ? rotuloCurto(c) : "--"));
  sc.appendChild(el("span",null, c ? c.nome : ""));
  sc.title = "Aperte a metade esquerda para o canal anterior, a direita para o próximo (igual à mesa real)";
  sc.addEventListener("pointerdown", ev=>{
    const r = sc.getBoundingClientRect();
    pularCanal(ev.clientX < r.left + r.width/2 ? -1 : 1);
  });
  fac.appendChild(sc);

  const rel = el("div","relogio","--:--:--");
  lig(()=>{ const d = new Date();
    rel.textContent = [d.getHours(),d.getMinutes(),d.getSeconds()]
      .map(x=>String(x).padStart(2,"0")).join(":"); });
  fac.appendChild(rel);
  fac.appendChild(el("div","relogio", S.usuario));

  const botao = (rot, alvo, dica) => {
    const b = el("div","bt",rot);
    b.title = dica || "";
    b.classList.toggle("ativo",
      (alvo==="SOF" && !!S.sof) || S.tela===alvo || S.popup===alvo);
    b.addEventListener("pointerdown", ()=>{
      if (alvo==="SOF"){
        S.sof = S.sof ? null : {tipo:"mix", n:0};
        S.ajuda = S.sof
          ? "<b>SENDS ON FADER</b> — escolha o bus na tela; os faders de input viram os sends"
          : "Saiu do SENDS ON FADER";
        if (S.sof) S.tela = "SOF";
      }
      else if (alvo==="CHJOB") abrirPopup("CHJOB");
      else if (alvo==="RACK") abrirPopup("RACK");
      else if (alvo==="MONITOR") abrirPopup("MONITOR");
      else if (alvo==="SETUP") abrirPopup("SETUP");
      else if (alvo==="METER"){ S.popup=null; S.tela="METER"; }
      pedirRender();
    });
    return b;
  };
  fac.appendChild(botao("SENDS ON FADER","SOF","Os faders passam a controlar as mandadas para o bus escolhido"));
  fac.appendChild(botao("CH JOB","CHJOB","Copiar, mover e inicializar canal"));
  const linha = el("div"); linha.style.cssText="display:flex;gap:3px";
  const bR = botao("RACK","RACK","GEQ e efeitos (racks 1-8)"); bR.style.flex="1";
  const bM = botao("MONITOR","MONITOR","Monitor, cue, oscilador e talkback"); bM.style.flex="1";
  linha.appendChild(bR); linha.appendChild(bM);
  fac.appendChild(linha);

  /* meter L R M da function access area */
  const mt = el("div"); mt.id="facmeter";
  mt.appendChild(el("div","rot","METER"));
  const barras = el("div","barras");
  const bs = ["L","R","M"].map(()=>{ const i = el("i"); const b = el("b"); i.appendChild(b); barras.appendChild(i); return b; });
  mt.appendChild(barras);
  mt.appendChild(el("div","rot","L   R   M"));
  lig(()=>{
    const st = S.canais.STEREO, mo = S.canais.MONO;
    const v = [st.nivel, st.nivel*0.94, mo.nivel];
    bs.forEach((b,i)=>b.style.height = (v[i]*100).toFixed(1)+"%");
  });
  mt.style.cursor="pointer";
  mt.addEventListener("pointerdown", ()=>{ S.popup=null; S.tela="METER"; pedirRender(); });
  fac.appendChild(mt);

  fac.appendChild(botao("SETUP","SETUP","Ajustes gerais, usuário e user defined keys"));

  const cen = el("div","cena");
  cen.appendChild(el("u",null,"SCENE"));
  cen.appendChild(el("b",null,num3(S.cena.n)));
  cen.appendChild(el("span",null,S.cena.nome));
  cen.addEventListener("pointerdown", ()=>{ abrirPopup("SCENE"); pedirRender(); });
  fac.appendChild(cen);
}
function rotuloCurto(c){
  if (c.tipo==="in") return "CH"+c.id.slice(2);
  if (c.tipo==="stin") return "ST IN"+c.id.slice(2);
  if (c.tipo==="mix") return "MIX"+c.id.slice(3);
  if (c.tipo==="mtx") return "MTX"+c.id.slice(3);
  if (c.tipo==="dca") return "DCA"+c.id.slice(3);
  return c.id;
}
function pularCanal(d){
  const ordem = [];
  for (let i=1;i<=N_IN;i++) ordem.push("CH"+i);
  for (let i=1;i<=N_STIN;i++) ordem.push("ST"+i);
  for (let i=1;i<=N_MIX;i++) ordem.push("MIX"+i);
  for (let i=1;i<=N_MTX;i++) ordem.push("MTX"+i);
  ordem.push("STEREO","MONO");
  const i = ordem.indexOf(S.sel);
  S.sel = ordem[clamp(i+d, 0, ordem.length-1)];
  S.ajuda = "Canal selecionado: <b>"+S.canais[S.sel].nome+"</b>";
  pedirRender();
}
function abrirPopup(p){ S.popup = p; }
function fecharPopup(){ S.popup = null; }

/* ================= OVERVIEW (p.98/99) =================
   12 campos: A nome · B HA/PHASE · C output port · D insert/direct ·
   E EQ · F DYN1 · G DYN2 · H TO MIX/MATRIX · I FROM MIX · J TO ST/MONO ·
   K DCA/MUTE · L nome (rodapé)                                        */
const TELAS = {};

TELAS.OVERVIEW = function(area){
  const grupo = grupoTela();
  const g = el("div");
  g.style.cssText = "display:grid;grid-template-columns:repeat(8,1fr);gap:2px;height:100%;min-height:0";

  grupo.forEach((id, col)=>{
    const c = S.canais[id];
    const cel = el("div");
    cel.style.cssText = "background:var(--tela-canal);border:1px solid #1a1c1f;border-radius:2px;"+
      "display:flex;flex-direction:column;gap:1px;padding:1px;min-height:0;overflow:hidden";
    if (!c){ cel.style.opacity=".3"; g.appendChild(cel); return; }
    if (id === S.sel) cel.style.outline = "1px solid var(--tela-azul-claro)";

    /* A — nome no topo */
    const topo = el("div", null, rotuloCurto(c)+"  "+c.nome);
    topo.style.cssText = "font-size:8px;background:"+(id===S.sel?"var(--tela-azul)":"#26292d")+
      ";border-radius:1px;padding:0 2px;white-space:nowrap;overflow:hidden;cursor:pointer";
    topo.addEventListener("pointerdown",()=>{ S.sel=id; S.ajuda="Canal <b>"+c.nome+"</b> selecionado"; pedirRender(); });
    cel.appendChild(topo);

    /* B — HA / PHASE (só entrada) */
    if (c.tipo==="in" || c.tipo==="stin"){
      const ha = el("div");
      ha.style.cssText="display:flex;align-items:center;gap:2px";
      const k = el("div","knob mini"); k.style.setProperty("--kd","16px");

/* curva de EQ em SVG (4 bandas + HPF), MEDIDA: F 20-20k, G ±18, Q .1-10 */
function curvaEQ(c, w, h){
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  svg.style.cssText = "width:100%;height:"+h+"px;background:#15171a;border-radius:1px;display:block";
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("fill","none");
  path.setAttribute("stroke","var(--tela-verde)");
  path.setAttribute("stroke-width","1.2");
  const zero = document.createElementNS("http://www.w3.org/2000/svg","line");
  zero.setAttribute("x1","0"); zero.setAttribute("x2",String(w));
  zero.setAttribute("y1",String(h/2)); zero.setAttribute("y2",String(h/2));
  zero.setAttribute("stroke","#3a3d42"); zero.setAttribute("stroke-width","0.5");
  svg.appendChild(zero); svg.appendChild(path);
  lig(()=>{
    const pts = [];
    for (let x=0;x<=w;x+=2){
      const f = Math.pow(10, Math.log10(20) + (x/w)*(Math.log10(20000)-Math.log10(20)));
      let db = 0;
      if (c.eq.on){
        for (const b of Object.values(c.eq.bandas)) db += ganhoPico(f, b.f, b.g, b.q);
      }
      if (c.hpf.on) db += ganhoHPF(f, c.hpf.freq);
      pts.push(x.toFixed(0)+","+(h/2 - clamp(db,-20,20)*(h/2)/20).toFixed(1));
    }
    path.setAttribute("d","M"+pts.join("L"));
  });
  return svg;
}
/* resposta aproximada de um peaking bell -- suficiente para a tela,
   é o mesmo desenho indicativo que a mesa mostra ("approximate EQ response", p.99) */
function ganhoPico(f, f0, g, q){
  if (!g) return 0;
  const x = Math.log2(f/f0);
  return g * Math.exp(-(x*x)*(q*q)*1.4);
}
/* HPF -12 dB/oct (MEDIDO no manual: 20-600 Hz, -12 dB/oct) */
function ganhoHPF(f, fc){
  if (f >= fc) return 0;
  return Math.max(-24, 12*Math.log2(f/fc));
}

/* knob com rótulo e valor, arrastável, que escreve direto no estado */
function knobTela(rot, ler, escrever, min, max, fmt, opc){
  opc = opc || {};
  const cel = el("div");
  cel.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:1px;min-width:34px";
  if (rot) { const r = el("div",null,rot); r.style.cssText="font-size:7.5px;color:#aeb4bb"; cel.appendChild(r); }
  const k = el("div","knob"+(opc.mini?" mini":""));
  if (opc.cor === "send") k.classList.add("send");
  const v = el("div"); v.style.cssText="font-size:8px;color:var(--tela-texto)";
  cel.appendChild(k); cel.appendChild(v);
  k.style.touchAction = "none";
  let base = null, y0 = 0;
  k.addEventListener("pointerdown", ev=>{
    ev.stopPropagation(); ev.preventDefault();
    base = ler(); y0 = ev.clientY;
    try{ k.setPointerCapture(ev.pointerId); }catch(e){}
  });
  k.addEventListener("pointermove", ev=>{
    if (base === null) return;
    const d = (y0 - ev.clientY)/140;
    escrever(clamp(base + d*(max-min), min, max));
    pedirRender();
  });
  const solta = ()=>{ base = null; };
  k.addEventListener("pointerup", solta);
  k.addEventListener("pointercancel", solta);
  lig(()=>{
    const val = ler();
    k.style.setProperty("--ang", anguloDe(val,min,max)+"deg");
    v.textContent = fmt ? fmt(val) : val.toFixed(1);
  });
  return cel;
}

  b.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); alternar(); pedirRender(); });
  lig(()=>b.classList.toggle("on", !!ler()));
  return b;
}

/* ---- DYNAMICS 1 e 2 ---- */
const TIPOS_DYN1 = ["GATE","DUCKING","COMPRESSOR","EXPANDER"];
const TIPOS_DYN2 = ["COMPRESSOR","COMPANDER-H","COMPANDER-S","DE-ESSER"];
function popupDyn(area, qual){
  const c = S.canais[S.sel];
  const d = c[qual];
  const tipos = qual==="dyn1" ? TIPOS_DYN1 : TIPOS_DYN2;
  const b = molde(area, qual==="dyn1"?"DYNAMICS 1":"DYNAMICS 2", c.nome);

  const lt = linhaTela();
  tipos.forEach(t=>{
    lt.appendChild(btTela(t, ()=>d.tipo===t, ()=>{ d.tipo=t;
      S.ajuda = "DYN "+(qual==="dyn1"?"1":"2")+" agora é <b>"+t+"</b>"; }));
  });
  lt.appendChild(btTela("ON", ()=>d.on, ()=>d.on=!d.on));
  b.appendChild(lt);

  const l = linhaTela();
  l.style.marginTop = "5px";
  l.appendChild(knobTela("THRESHOLD", ()=>d.thr, v=>d.thr=v, qual==="dyn1"?-72:-54, 0, v=>v.toFixed(0)+" dB"));
  if (qual==="dyn1"){
    l.appendChild(knobTela("RANGE", ()=>d.range, v=>d.range=v, -70, 0, v=>v.toFixed(0)+" dB"));
    l.appendChild(knobTela("ATTACK", ()=>d.attack, v=>d.attack=v, 0, 120, v=>v.toFixed(0)+" ms"));
    l.appendChild(knobTela("HOLD", ()=>d.hold, v=>d.hold=v, 0.02, 1, v=>(v*1000).toFixed(0)+" ms"));
    l.appendChild(knobTela("DECAY", ()=>d.decay, v=>d.decay=v, 0.005, 42.3, v=>v.toFixed(2)+" s"));
  } else {
    l.appendChild(knobTela("RATIO", ()=>d.ratio, v=>d.ratio=v, 1, 20, v=>v.toFixed(1)+":1"));
    l.appendChild(knobTela("ATTACK", ()=>d.attack, v=>d.attack=v, 0, 120, v=>v.toFixed(0)+" ms"));
    l.appendChild(knobTela("RELEASE", ()=>d.release, v=>d.release=v, 0.005, 42.3, v=>v.toFixed(2)+" s"));
    l.appendChild(knobTela("KNEE", ()=>d.knee, v=>d.knee=v, 0, 5, v=>v<1?"HARD":v.toFixed(0)));
    l.appendChild(knobTela("OUT", ()=>d.out, v=>d.out=v, 0, 18, v=>"+"+v.toFixed(0)+" dB"));
  }
  b.appendChild(l);

  /* curva de transferência: mostra o que o compressor/gate faz de verdade */
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 120 120");
  svg.style.cssText="width:180px;height:180px;background:#15171a;border-radius:2px;margin-top:5px";
  const eixo = document.createElementNS("http://www.w3.org/2000/svg","path");
  eixo.setAttribute("d","M0,120 L120,0"); eixo.setAttribute("stroke","#3a3d42");
  eixo.setAttribute("stroke-width","0.7"); eixo.setAttribute("fill","none");
  const curva = document.createElementNS("http://www.w3.org/2000/svg","path");
  curva.setAttribute("stroke","var(--tela-verde)"); curva.setAttribute("stroke-width","1.6");
  curva.setAttribute("fill","none");
  svg.appendChild(eixo); svg.appendChild(curva);
  lig(()=>{
    const pts = [];
    for (let i=0;i<=60;i++){
      const inDb = -60 + i;                       /* -60..0 dB */
      let outDb = inDb;
      if (d.on){
        if (qual==="dyn1"){
          if (d.tipo==="GATE" || d.tipo==="DUCKING"){
            if (inDb < d.thr) outDb = inDb + (d.range||-70)*(d.tipo==="GATE"?1:0);
          } else if (inDb > d.thr){
            outDb = d.thr + (inDb - d.thr)/2;
          }
        } else {
          if (inDb > d.thr) outDb = d.thr + (inDb - d.thr)/Math.max(1,d.ratio);
          outDb += d.out || 0;
        }
      }
      const x = ((inDb+60)/60)*120;
      const y = 120 - clamp((outDb+60)/60,0,1.2)*120;
      pts.push(x.toFixed(1)+","+y.toFixed(1));
    }
    curva.setAttribute("d","M"+pts.join("L"));
  });
  b.appendChild(svg);
  const nota = el("div",null, qual==="dyn1"
    ? "DYN1 na M7CL: GATE, DUCKING, COMPRESSOR ou EXPANDER. THRESHOLD −72 a 0 dB."
    : "DYN2 na M7CL: COMPRESSOR, COMPANDER-H, COMPANDER-S ou DE-ESSER. THRESHOLD −54 a 0 dB.");
  nota.style.cssText="font-size:9px;color:#9aa0a8;margin-top:3px";
  b.appendChild(nota);
}
TELAS_POPUP.DYN1 = a => popupDyn(a,"dyn1");
TELAS_POPUP.DYN2 = a => popupDyn(a,"dyn2");

S.rack = Array.from({length:8},(_,i)=>({
  n:i+1,

const FREQ_GEQ = [20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,
                  1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
const EFEITOS = ["REV-X HALL","REV-X ROOM","REV-X PLATE","REVERB HALL","ECHO","DELAY LCR",
                 "CHORUS","FLANGE","PHASER","AUTO PAN","COMP276","EQ601","OPEN DECK"];

TELAS_POPUP.RACK = function(area){
  const b = molde(area,"VIRTUAL RACK","racks 1-4: GEQ · racks 5-8: GEQ ou efeito");
  const abas = linhaTela();
  S.rack.forEach((r,i)=>{
    abas.appendChild(btTela(String(r.n)+" "+r.tipo, ()=>S.rackSel===i, ()=>{ S.rackSel=i;

  if (r.n>4){

    lt.appendChild(btTela("GEQ", ()=>r.tipo==="GEQ", ()=>{ r.tipo="GEQ"; }));
    lt.appendChild(btTela("EFFECT", ()=>r.tipo==="EFFECT", ()=>{ r.tipo="EFFECT"; }));

  }

  if (r.tipo==="GEQ"){
    const g = el("div");
    g.style.cssText="display:flex;gap:1px;align-items:flex-end;margin-top:5px";
    FREQ_GEQ.forEach((f,i)=>{
      const col = el("div"); col.style.cssText="display:flex;flex-direction:column;align-items:center;gap:1px";
      const trilho = el("div");

      meio.style.cssText="position:absolute;left:0;right:0;top:50%;height:1px;background:#3a3d42";
      trilho.appendChild(meio);
      trilho.style.touchAction="none";
      let base=null, y0=0;
      trilho.addEventListener("pointerdown",ev=>{ ev.stopPropagation(); base=r.geq[i]; y0=ev.clientY;
        try{trilho.setPointerCapture(ev.pointerId);}catch(e){} });
      trilho.addEventListener("pointermove",ev=>{
        if (base===null) return;
        r.geq[i] = clamp(base + (y0-ev.clientY)/74*30, -15, 15);   /* ±15 dB, MEDIDO */
        S.ajuda = "GEQ rack "+r.n+" · "+(f>=1000?(f/1000)+"k":f)+" Hz: "+
                  (r.geq[i]>0?"+":"")+r.geq[i].toFixed(1)+" dB";
        pedirRender();
      });
      const solta=()=>base=null;
      trilho.addEventListener("pointerup",solta); trilho.addEventListener("pointercancel",solta);
      lig(()=>{ cur.style.top = (50 - r.geq[i]/15*50)+"%"; cur.style.marginTop="-3px"; });
      const rot = el("div",null, f>=1000?(f/1000)+"k":String(f));

      col.appendChild(trilho); col.appendChild(rot);
      g.appendChild(col);
    });
    cx.appendChild(g);
    const l2 = linhaTela();
    const flat = el("button","tbt","FLAT"); flat.type="button";
    flat.addEventListener("pointerdown",()=>{ r.geq.fill(0); S.ajuda="GEQ zerado"; pedirRender(); });
    l2.appendChild(flat);

    nota.style.cssText="font-size:9px;color:#9aa0a8";
    l2.appendChild(nota);
    cx.appendChild(l2);
  } else {
    const lt = el("div"); lt.style.cssText="display:flex;gap:3px;flex-wrap:wrap;margin-top:5px";
    EFEITOS.forEach(e=>{
      lt.appendChild(btTela(e, ()=>r.efeito===e, ()=>{ r.efeito=e;

    });
    cx.appendChild(lt);
    const lp = linhaTela(); lp.style.marginTop="6px";
    lp.appendChild(knobTela("TIME/TEMPO", ()=>r.param.tempo, v=>r.param.tempo=v, 20, 3000, v=>v.toFixed(0)+" ms"));
    lp.appendChild(knobTela("MIX", ()=>r.param.mix, v=>r.param.mix=v, 0, 100, v=>v.toFixed(0)+" %"));
    const tap = el("button","tbt","TAP TEMPO"); tap.type="button";
    let ultimo = 0;
    tap.addEventListener("pointerdown",()=>{
      const agora = performance.now();

      } else S.ajuda = "TAP TEMPO — bata de novo no ritmo";
      ultimo = agora; pedirRender();
    });
    lp.appendChild(tap);
    cx.appendChild(lp);
  }
  b.appendChild(cx);
};

/* atualiza os LEDs da meter bridge */
function desenharBridge(){
  document.querySelectorAll(".bcol").forEach(col=>{
    const c = S.canais[col.dataset.canal];
    const n = c ? c.nivel : 0;
    const leds = col.querySelectorAll(".bleds b");
    /* 12 passos, do topo (OVER) para baixo (-60) */
    leds.forEach((b,i)=>b.classList.toggle("a", n >= (1 - i/leds.length) * 0.98));
  });
}

/* ==================================================================
   ZOOM-TO-FIT
   A mesa é desenhada num palco fixo de 1920x1000 e depois escalada.
   SEM isto o painel fica cortado -- e um painel cortado é exatamente
   o que faz as proporções parecerem erradas.
   Nota do projeto: NÃO derivar a altura da largura (aspect-ratio) --
   foi o que já cortou simulador em tela cheia antes.
   ================================================================== */
const palco = document.getElementById("palco");
function ajustarZoom(){
  const lw = window.innerWidth, lh = window.innerHeight;
  const k = Math.min(lw / 1920, lh / 1044);
  palco.style.transform = "scale(" + k.toFixed(4) + ")";
}
window.addEventListener("resize", ajustarZoom);
ajustarZoom();

/* contrato html.smu-fs: o player avisa por postMessage quando entra em
   tela cheia; o simulador responde só com CSS + um novo cálculo de zoom */
window.addEventListener("message", ev=>{
  const d = ev && ev.data;
  if (!d) return;
  const tipo = typeof d === "string" ? d : d.type || d.tipo;
  if (tipo === "smu-fs-on"  || tipo === "smu:fullscreen:on")  document.documentElement.classList.add("smu-fs");
  if (tipo === "smu-fs-off" || tipo === "smu:fullscreen:off") document.documentElement.classList.remove("smu-fs");
  requestAnimationFrame(ajustarZoom);
});

/* lupa: amplia a touch screen para a mesa inteira. É recurso do
   SIMULADOR (a console real não faz isso) -- serve para o aluno enxergar
   a tela num notebook. Por isso vem rotulado como tal. */
const btLupa = document.getElementById("lupa");
btLupa.addEventListener("click", ()=>{
  const on = mesa.classList.toggle("lupa");
  btLupa.textContent = on ? "VOLTAR À MESA" : "AMPLIAR TELA";
  S.ajuda = on ? "Tela ampliada (recurso do simulador, não existe na mesa real)" : "";
  pedirRender();
});

/* teclado: atalhos de estudo */
document.addEventListener("keydown", ev=>{
  if (ev.key === "Escape" && S.popup){ fecharPopup(); pedirRender(); }
  if (ev.key === "ArrowRight") pularCanal(1);
  if (ev.key === "ArrowLeft")  pularCanal(-1);
});
