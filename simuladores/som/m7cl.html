const $ajuda = () => document.getElementById("ajuda");

function canalDoStrip(strip){
  if (strip.dataset.cl != null && strip.dataset.cl !== "")
    return grupoCentralogic()[+strip.dataset.cl];
  return strip.dataset.canal || null;
}

/* valor que o fader mostra: em SENDS ON FADER ele vira o send, não o nível
   do canal (p.18 -- "In SENDS ON FADER mode, this adjusts the send level") */
function valorFader(c){
  if (!c) return -138;
  if (S.sof && (c.tipo==="in" || c.tipo==="stin")){
    const arr = S.sof.tipo==="mix" ? c.mix : c.mtx;
    return arr[S.sof.n].lvl;
  }
  return c.fader;
}
function ligadoFader(c){
  if (!c) return false;
  if (S.sof && (c.tipo==="in" || c.tipo==="stin")){
    const arr = S.sof.tipo==="mix" ? c.mix : c.mtx;
    return arr[S.sof.n].on;
  }
  return c.on;
}

function desenharStrip(strip){
  const id = canalDoStrip(strip);
  const c = id ? S.canais[id] : null;

  strip.style.opacity = c ? "1" : ".35";

  /* nome */
  const nm = strip.querySelector(".nome");
  if (nm) nm.textContent = c ? c.nome : "";

  /* Na Centralogic só existe o número do RODAPÉ (não há etiqueta no topo),
     então é o primeiro .num do strip -- e ele mostra o módulo 1-8, fixo. */
  if (strip.dataset.cl != null && strip.dataset.cl !== "" && c){
    const num = strip.querySelector(".num");
    if (num) num.textContent = String(+strip.dataset.cl + 1);
  }

  /* teclas */
  const sel = strip.querySelector('[data-acao="sel"]');
  const cue = strip.querySelector('[data-acao="cue"]');
  const on  = strip.querySelector('[data-acao="on"]');
  /* p.18: em SENDS ON FADER os [SEL] de TODOS os canais acendem */
  if (sel) sel.classList.toggle("on", !!c && (S.sel===id || (!!S.sof && (c.tipo==="in"||c.tipo==="stin"))));
  if (cue) cue.classList.toggle("on", !!c && c.cue);
  if (on)  on.classList.toggle("on", ligadoFader(c));

  /* fader */
  const cur = strip.querySelector(".cursor");
  if (cur){
    const p = dbParaPos(valorFader(c));
    cur.style.top = ((1-p)*100).toFixed(2)+"%";
  }

  /* meter de 6 LEDs. Os limiares saem dos PRÓPRIOS rótulos em dB
     (OVER, -6, -12, -18, -30, -60) -- ver LIMIAR_LED.
     Antes eram números lineares arbitrários (o menor 0,12 = -18 dBFS), então
     música tocando a -25 dBFS não acendia LED NENHUM: o meter ficava apagado
     com áudio correndo. Foi o "não toca" que o dono viu. */
  const leds = strip.querySelectorAll(".meterled b");
  const n = c ? c.nivel : 0;                    /* 0..1 linear */
  leds.forEach((b,i)=>b.classList.toggle("a", n >= LIMIAR_LED[i]));

  /* encoder da Centralogic */
  const enc = strip.querySelector('[data-papel="enc"]');
  if (enc && c) enc.style.setProperty("--ang", (valorEncoderCL(c)*270-135)+"deg");
}

/* o encoder multifunção segue o parâmetro selecionado na tela (p.99) */
function valorEncoderCL(c){
  if (S.encFoco === "pan") return (c.pan+1)/2;
  if (S.encFoco && S.encFoco.startsWith("send")){
    const n = +S.encFoco.slice(4);
    const arr = S.sendDest==="mix" ? c.mix : c.mtx;
    return dbParaPos(arr[n] ? arr[n].lvl : -138);
  }
  return dbParaPos(c.fader);
}
S.encFoco = "send0";

function desenhar(){
  /* SENDS ON FADER muda o que o fader e o [ON] fazem: avisa na mesa inteira */
  mesa.classList.toggle("sof", !!S.sof);
  const avSof = document.getElementById("avisosof");
  if (avSof && S.sof){
    avSof.textContent = "SENDS ON FADER — MIX "+(S.sof.n+1)+
      " · os faders e as teclas [ON] são da MANDADA, não do canal";
  }
  document.querySelectorAll(".strip").forEach(desenharStrip);
  for (const f of BARRAS) f();          /* barra(s) de transporte */
  desenharBridge();
  desenharSelectedChannel();
  desenharNav();
  desenharUDK();
  desenharTela();
  const aj = $ajuda();
  if (aj) aj.innerHTML = S.ajuda;
}

/* ---- knobs do SELECTED CHANNEL ---- */
const anguloDe = (v,min,max) => ((v-min)/(max-min))*270-135;
/* PAN na M7CL é mostrado como L63 … CENTER … R63 (lista de parâmetros, p.256).
   Internamente guardo -1..+1 porque é o que o StereoPannerNode quer; a conversão
   para o número da mesa acontece só aqui, na hora de escrever na tela. */
function textoPan(p){
  const n = Math.round(clamp(p,-1,1)*63);
  return n === 0 ? "CENTER" : (n < 0 ? "L"+(-n) : "R"+n);
}

function desenharSelectedChannel(){
  const c = S.canais[S.sel];
  if (!c) return;
  const box = document.querySelector(".selch");
  if (!box) return;

  box.querySelectorAll('[data-papel="send"]').forEach(k=>{
    const n = +k.dataset.n;
    const arr = ehSaida(c) ? c.mtx : c.mix;
    const s = arr[n];
    k.style.setProperty("--ang", (s ? dbParaPos(s.lvl)*270-135 : -135)+"deg");
    k.style.opacity = s ? (s.on?"1":".45") : ".2";
  });
  const set = (papel,ang)=>{
    const k = box.querySelector('[data-papel="'+papel+'"]');
    if (k) k.style.setProperty("--ang", ang+"deg");
  };
  set("ha",   anguloDe(c.ha.gain,-62,10));
  set("pan",  anguloDe(c.pan,-1,1));
  set("hpf",  anguloDe(Math.log10(c.hpf.freq), Math.log10(20), Math.log10(600)));
  set("dyn1", anguloDe(c.dyn1.thr,-72,0));
  set("dyn2", anguloDe(c.dyn2.thr,-54,0));
  box.querySelectorAll('[data-papel="eq"]').forEach(k=>{
    const b = c.eq.bandas[k.dataset.banda];
    if (!b) return;
    let ang;
    if (k.dataset.par==="f") ang = anguloDe(Math.log10(b.f), Math.log10(20), Math.log10(20000));
    else if (k.dataset.par==="g") ang = anguloDe(b.g,-18,18);
    else ang = anguloDe(Math.log10(b.q), Math.log10(0.1), Math.log10(10));
    k.style.setProperty("--ang", ang+"deg");
  });
  const km = document.querySelector('[data-papel="monitor"]');
  if (km) km.style.setProperty("--ang", anguloDe(S.monitor.nivel,0,1)+"deg");
}
const ehSaida = c => c && (c.tipo==="mix"||c.tipo==="mtx"||c.tipo==="stereo"||c.tipo==="mono");

function desenharNav(){
  document.querySelectorAll("[data-nav]").forEach(b=>{
    b.classList.toggle("on", b.dataset.nav === S.nav);
    b.classList.toggle("piscando", b.dataset.nav === S.navFixa);
  });
}
function desenharUDK(){
  document.querySelectorAll("[data-udk]").forEach(b=>{
    const i = +b.dataset.udk;
    const f = S.udk[i];
    b.title = f || "(sem atribuição)";
    /* Funções de ESTADO ficam acesas enquanto valem. As de AÇÃO (recall, cue
       clear, tap tempo…) não têm estado: elas ganham um flash ao serem
       apertadas — sem isso 8 das 12 teclas nunca acendiam e pareciam mortas,
       mesmo funcionando. Foi o que o dono viu no painel. */
    let aceso = false;
    if (f==="TALKBACK ON")     aceso = S.talkback.on;
    else if (f==="OSCILLATOR ON")  aceso = S.osc.on;
    else if (f==="SENDS ON FADER") aceso = !!S.sof;
    else if (f==="MONITOR DIMM")   aceso = S.monitor.dimm;
    else if (f==="MUTE GROUP 1")   aceso = !!(S.mg && S.mg[1]);
    else if (f==="MUTE GROUP 2")   aceso = !!(S.mg && S.mg[2]);
    else if (f==="HELP")           aceso = S.popup === "HELP";
    else aceso = (S.udkFlash === i);          /* ação: pisca ao apertar */
    b.classList.toggle("on", aceso);
  });
}
/* acende a tecla por um instante, para a ação dar retorno visível */
function flashUDK(i){
  S.udkFlash = i;
  clearTimeout(S.udkFlashT);
  S.udkFlashT = setTimeout(()=>{ S.udkFlash = null; pedirRender(); }, 180);
}

/* ==================================================================
   INTERAÇÃO — arrastar faders e knobs, clicar teclas
   ================================================================== */
let arrasto = null;

function ondeCliquei(alvo){
  const k = alvo.closest(".knob");
  if (k) return {tipo:"knob", nó:k};
  const f = alvo.closest(".fader");
  if (f) return {tipo:"fader", nó:f};
  return null;
}

document.addEventListener("pointerdown", ev=>{
  const alvo = ev.target;

  /* --- teclas do strip --- */
  const tecla = alvo.closest("[data-acao]");
  if (tecla){ acaoTecla(tecla, ev); return; }

  const nav = alvo.closest("[data-nav]");
  if (nav){ acaoNav(nav, ev); return; }

  const udk = alvo.closest("[data-udk]");
  if (udk){ acaoUDK(+udk.dataset.udk); return; }

  /* fita branca do nome: na mesa real é onde se escreve o canal.
     Clicar seleciona o canal e abre o CH JOB, que tem o campo do nome. */
  const fita = alvo.closest(".nome");
  if (fita){
    const strip = fita.closest(".strip");
    const id = canalDoStrip(strip);
    if (id){
      S.sel = id;
      S.pnAba = "NAME";
      abrirPopup("PATCH_NAME");   /* a janela real da mesa (p.59), com teclado */
      S.ajuda = "Escreva o nome de <b>"+S.canais[id].nome+"</b> — igual a escrever na fita da mesa";
      pedirRender();
    }
    return;
  }

  /* --- arraste --- */
  const alvoDrag = ondeCliquei(alvo);
  if (!alvoDrag) return;
  ev.preventDefault();

  const strip = alvo.closest(".strip");

  /* p.100: "com a tela SELECTED CHANNEL VIEW aberta, apertar qualquer um dos
     encoders 1-8 leva de volta ao OVERVIEW, mantendo os mesmos canais
     selecionados." É o atalho que o operador usa no show para não perder o
     grupo de oito que já estava na mão. */
  if (alvoDrag.tipo === "knob" && alvoDrag.nó.dataset.papel === "enc" &&
      S.tela === "SELCH" && !S.popup){
    S.tela = "OVERVIEW"; telaChave = null;
    S.ajuda = "Encoder apertado — voltou ao <b>OVERVIEW</b> com os mesmos 8 canais (p.100)";
    pedirRender();
    return;
  }

  arrasto = { ...alvoDrag, strip, y0: ev.clientY, ini:null, nó:alvoDrag.nó };

  if (alvoDrag.tipo === "fader"){
    /* clicar no trilho já leva o cursor para lá (como puxar o fader) */
    const r = alvoDrag.nó.getBoundingClientRect();
    const p = 1 - (ev.clientY - r.top) / r.height;
    aplicarFader(strip, posParaDb(clamp(p,0,1)));
  } else {
    arrasto.ini = lerKnob(alvoDrag.nó, strip);
  }
  try { alvoDrag.nó.setPointerCapture(ev.pointerId); } catch(e){}
  pedirRender();
});

document.addEventListener("pointermove", ev=>{
  if (!arrasto) return;
  ev.preventDefault();
  if (arrasto.tipo === "fader"){
    const r = arrasto.nó.getBoundingClientRect();
    const p = 1 - (ev.clientY - r.top) / r.height;
    aplicarFader(arrasto.strip, posParaDb(clamp(p,0,1)));
  } else {
    const d = (arrasto.y0 - ev.clientY) / 140;   /* 140px = curso cheio */
    aplicarKnob(arrasto.nó, arrasto.strip, arrasto.ini, d);
  }
  pedirRender();
});

document.addEventListener("pointerup", ()=>{ arrasto = null; });
document.addEventListener("pointercancel", ()=>{ arrasto = null; });

function aplicarFader(strip, db){
  const id = canalDoStrip(strip);
  const c = S.canais[id];
  if (!c) return;
  db = clamp(db,-138,10);
  if (S.sof && (c.tipo==="in"||c.tipo==="stin")){
    const arr = S.sof.tipo==="mix" ? c.mix : c.mtx;
    arr[S.sof.n].lvl = db;
    S.ajuda = "<b>"+c.nome+"</b> → send "+(S.sof.tipo==="mix"?"MIX ":"MATRIX ")+(S.sof.n+1)+": "+fmtDb(db)+" dB";
  } else {
    c.fader = db;
    S.ajuda = "<b>"+c.nome+"</b> fader: "+fmtDb(db)+" dB";
  }
}

function lerKnob(k, strip){
  const c = S.canais[S.sel];
  const papel = k.dataset.papel;
  if (papel==="monitor") return S.monitor.nivel;
  if (!c) return 0;
  if (papel==="ha")   return c.ha.gain;
  if (papel==="pan")  return c.pan;
  if (papel==="hpf")  return c.hpf.freq;
  if (papel==="dyn1") return c.dyn1.thr;
  if (papel==="dyn2") return c.dyn2.thr;
  if (papel==="send"){ const a = ehSaida(c)?c.mtx:c.mix; const s=a[+k.dataset.n]; return s?s.lvl:-138; }
  if (papel==="eq"){
    const b = c.eq.bandas[k.dataset.banda];
    return k.dataset.par==="f" ? b.f : k.dataset.par==="g" ? b.g : b.q;
  }
  if (papel==="enc"){
    const id = canalDoStrip(strip); const cc = S.canais[id];
    if (!cc) return 0;
    if (S.encFoco==="pan") return cc.pan;
    if (S.encFoco && S.encFoco.startsWith("send")){
      const a = S.sendDest==="mix"?cc.mix:cc.mtx; const s=a[+S.encFoco.slice(4)];
      return s?s.lvl:-138;
    }
    return cc.fader;
  }
  return 0;
}

function aplicarKnob(k, strip, ini, d){
  const papel = k.dataset.papel;
  if (papel==="monitor"){
    S.monitor.nivel = clamp(ini + d, 0, 1);
    S.ajuda = "<b>MONITOR LEVEL</b>: "+Math.round(S.monitor.nivel*10)+" / 10";
    return;
  }
  const c = S.canais[S.sel];
  if (!c) return;
  const nome = c.nome;
  if (papel==="ha"){                       /* faixa MEDIDA: -62..+10 */
    c.ha.gain = clamp(ini + d*72, -62, 10);
    /* p.19: o PAD entra sozinho entre -14 e -13 dB. Comportamento real. */
    const pad = c.ha.gain >= -13;
    S.ajuda = "<b>"+nome+"</b> HA GAIN: "+c.ha.gain.toFixed(0)+" dB"+(pad?"  ·  PAD interno LIGADO":"");
  }
  else if (papel==="pan"){
    c.pan = clamp(ini + d*2, -1, 1);
    const v = Math.round(c.pan*63);
    S.ajuda = "<b>"+nome+"</b> PAN: "+(v===0?"C":v<0?"L"+(-v):"R"+v);
  }
  else if (papel==="hpf"){                 /* 20..600 Hz, log */
    const lg = clamp(Math.log10(ini) + d*(Math.log10(600)-Math.log10(20)), Math.log10(20), Math.log10(600));
    c.hpf.freq = Math.round(Math.pow(10,lg));
    S.ajuda = "<b>"+nome+"</b> HPF: "+c.hpf.freq+" Hz  (-12 dB/oct)";
  }
  else if (papel==="dyn1"){
    c.dyn1.thr = clamp(ini + d*72, -72, 0);
    S.ajuda = "<b>"+nome+"</b> DYN1 "+c.dyn1.tipo+" THRESHOLD: "+c.dyn1.thr.toFixed(0)+" dB";
  }
  else if (papel==="dyn2"){
    c.dyn2.thr = clamp(ini + d*54, -54, 0);
    S.ajuda = "<b>"+nome+"</b> DYN2 "+c.dyn2.tipo+" THRESHOLD: "+c.dyn2.thr.toFixed(0)+" dB";
  }
  else if (papel==="send"){
    const arr = ehSaida(c)?c.mtx:c.mix;
    const n = +k.dataset.n;
    if (!arr[n]) return;
    arr[n].lvl = clamp(posParaDb(dbParaPos(ini)+d), -138, 10);
    S.encFoco = "send"+n;
    S.ajuda = "<b>"+nome+"</b> → "+(ehSaida(c)?"MATRIX ":"MIX ")+(n+1)+": "+fmtDb(arr[n].lvl)+" dB";
  }
  else if (papel==="eq"){
    const b = c.eq.bandas[k.dataset.banda];
    const rot = {high:"HIGH",himid:"HIGH MID",lomid:"LOW MID",low:"LOW"}[k.dataset.banda];
    if (k.dataset.par==="f"){              /* 20 Hz..20 kHz, log, passo 1/12 oitava */
      const lg = clamp(Math.log10(ini)+d*3, Math.log10(20), Math.log10(20000));
      b.f = Math.round(Math.pow(10,lg));
      S.ajuda = "<b>"+nome+"</b> EQ "+rot+" FREQ: "+(b.f>=1000?(b.f/1000).toFixed(2)+" k":b.f)+"Hz";
    } else if (k.dataset.par==="g"){       /* ±18 dB */
      b.g = clamp(ini + d*36, -18, 18);
      S.ajuda = "<b>"+nome+"</b> EQ "+rot+" GAIN: "+(b.g>0?"+":"")+b.g.toFixed(1)+" dB";
    } else {                               /* Q 0.10..10 */
      const lg = clamp(Math.log10(ini)+d*2, Math.log10(0.1), Math.log10(10));
      b.q = Math.round(Math.pow(10,lg)*100)/100;
      S.ajuda = "<b>"+nome+"</b> EQ "+rot+" Q: "+b.q.toFixed(2);
    }
  }
  else if (papel==="enc"){                 /* encoder multifunção da Centralogic */
    const nEnc = strip && strip.dataset.cl != null ? +strip.dataset.cl : -1;
    /* Se a TELA registrou alvos, é ela quem manda: o encoder vira o que a
       tela disser (parâmetro de EQ na visão 8ch, brilho no SETUP, etc.).
       Sem alvos registrados, cai no comportamento de sempre (send/pan/fader). */
    const alvo = nEnc >= 0 ? S.encAlvos[nEnc] : null;
    if (alvo){
      const v0 = alvo.log ? Math.log10(Math.max(alvo.ler(), 1e-6)) : alvo.ler();
      const min = alvo.log ? Math.log10(alvo.min) : alvo.min;
      const max = alvo.log ? Math.log10(alvo.max) : alvo.max;
      const nv = clamp(v0 + d*(max-min), min, max);
      alvo.escrever(alvo.log ? Math.pow(10, nv) : nv);
      S.ajuda = (S.encRotulo ? "<b>"+S.encRotulo+"</b> · " : "") +
                (alvo.rot || ("encoder "+(nEnc+1)));
      return;
    }
    const id = canalDoStrip(strip); const cc = S.canais[id];
    if (!cc) return;
    if (S.encFoco==="pan"){
      cc.pan = clamp(ini + d*2, -1, 1);
      S.ajuda = "<b>"+cc.nome+"</b> PAN (encoder Centralogic)";
    } else if (S.encFoco && S.encFoco.startsWith("send")){
      const n = +S.encFoco.slice(4);
      const arr = S.sendDest==="mix"?cc.mix:cc.mtx;
      if (arr[n]){
        arr[n].lvl = clamp(posParaDb(dbParaPos(ini)+d), -138, 10);
        S.ajuda = "<b>"+cc.nome+"</b> → "+(S.sendDest==="mix"?"MIX ":"MATRIX ")+(n+1)+": "+fmtDb(arr[n].lvl)+" dB";
      }
    } else {
      cc.fader = clamp(posParaDb(dbParaPos(ini)+d), -138, 10);
      S.ajuda = "<b>"+cc.nome+"</b> fader: "+fmtDb(cc.fader)+" dB";
    }
  }
  /* p.91: mexer num knob do SELECTED CHANNEL abre a SELECTED CHANNEL VIEW */
  if (papel!=="enc" && papel!=="monitor" && S.tela!=="SELCH" && !S.popup) S.tela = "SELCH";
}

/* ---- teclas SEL / CUE / ON e SCENE ---- */
function acaoTecla(b, ev){
  const acao = b.dataset.acao;
  if (acao==="store"){ abrirPopup("SCENE_STORE"); pedirRender(); return; }
  if (acao==="recall"){ recallCena(); pedirRender(); return; }
  /* [▲]/[▼] SÓ selecionam (p.22). Não chamam, não guardam, não encostam na
     mixagem. Apertar as duas em menos de 300 ms volta para a cena atual —
     é o "press simultaneously to return to the current scene number". */
  if (acao==="cenaUp" || acao==="cenaDown"){
    const agora = performance.now();
    const outra = acao==="cenaUp" ? "cenaDown" : "cenaUp";
    if (S._setaCena && S._setaCena.acao===outra && agora - S._setaCena.t < 300){
      S.cena.sel = S.cena.n; S._setaCena = null;
      S.ajuda = "Voltou para a cena atual: <b>"+num3(S.cena.n)+" "+S.cena.nome+"</b>";
      pedirRender(); return;
    }
    S._setaCena = { acao, t:agora };
    S.cena.sel = clamp(S.cena.sel + (acao==="cenaUp" ? 1 : -1), 0, 300);
    const reg = S.cena.lista.find(x=>x.n===S.cena.sel);
    S.ajuda = "Selecionada a cena <b>"+num3(S.cena.sel)+"</b>"+
      (reg ? " "+reg.nome : " <i>(vazia)</i>")+
      " — a mesa NÃO mudou; aperte [RECALL] para chamar";
    pedirRender(); return;
  }

  const strip = b.closest(".strip");
  const id = canalDoStrip(strip);
  const c = S.canais[id];
  if (!c) return;
  if (acao==="sel"){
    /* p.18/23: no ST IN e no STEREO o [SEL] alterna entre L e R */
    if (S.sel===id && (c.tipo==="stin"||c.tipo==="stereo")){
      c.ladoR = !c.ladoR;
      S.ajuda = "<b>"+c.nome+"</b> — controlando o lado "+(c.ladoR?"R":"L");
    } else {
      S.sel = id;
      S.ajuda = "Canal selecionado: <b>"+c.nome+"</b>";
    }
    if (S.tela==="OVERVIEW") S.tela = "OVERVIEW";
  }
  else if (acao==="cue"){
    c.cue = !c.cue;
    S.monitor.cueAtivo = Object.values(S.canais).some(x=>x.cue);
    S.ajuda = "CUE de <b>"+c.nome+"</b> "+(c.cue?"ligado":"desligado");
  }
  else if (acao==="on"){
    if (S.sof && (c.tipo==="in"||c.tipo==="stin")){
      const arr = S.sof.tipo==="mix"?c.mix:c.mtx;
      arr[S.sof.n].on = !arr[S.sof.n].on;
      S.ajuda = "<b>"+c.nome+"</b> send "+(S.sof.n+1)+" "+(arr[S.sof.n].on?"ON":"OFF");
    } else {
      c.on = !c.on;
      S.ajuda = "<b>"+c.nome+"</b> "+(c.on?"ligado":"MUTADO");
    }
  }
  pedirRender();
}
const num3 = n => String(n).padStart(3,"0");

/* ---- NAVIGATION KEYS ----
   p.23: segurar 2s fixa a Centralogic naquele grupo (a tecla pisca);
   depois disso, outra nav key muda SÓ a tela. */
let timerNav = null;
function acaoNav(b, ev){
  const id = b.dataset.nav;
  S.navAnterior = (S.nav !== "DCA") ? S.nav : S.navAnterior;
  S.nav = id;
  S.ajuda = "Centralogic / tela: <b>"+navPorId(id).rot+"</b> — segure 2 s para FIXAR a Centralogic";
  clearTimeout(timerNav);
  timerNav = setTimeout(()=>{
    S.navFixa = id;
    S.ajuda = "Centralogic <b>FIXADA</b> em "+navPorId(id).rot+" — agora as nav keys mudam só a tela. Segure de novo para soltar.";
    pedirRender();
  }, 2000);
  const solta = ()=>{ clearTimeout(timerNav); document.removeEventListener("pointerup",solta); };
  document.addEventListener("pointerup", solta);
  if (S.navFixa === id && ev.detail === 2) S.navFixa = null;
  pedirRender();
}

/* ---- USER DEFINED KEYS ---- */
function acaoUDK(i){
  const f = S.udk[i];
  flashUDK(i);            /* retorno visível mesmo nas funções sem estado */
  switch(f){
    /* Nomes e comportamento do manual (p.280): não é "andar um número", é
       "chamar a cena do próximo/anterior número EXISTENTE". */
    case "INC RECALL": recallVizinha(+1); break;
    case "DEC RECALL": recallVizinha(-1); break;
    case "SCENE RECALL": recallCena(); break;
    case "TALKBACK ON": S.talkback.on = !S.talkback.on;
      S.ajuda = "TALKBACK "+(S.talkback.on?"ligado":"desligado"); break;
    case "OSCILLATOR ON": S.osc.on = !S.osc.on;
      S.ajuda = "OSCILADOR "+(S.osc.on?"LIGADO — cuidado com o PA":"desligado"); break;
    case "MONITOR DIMM": S.monitor.dimm = !S.monitor.dimm;
      S.ajuda = "MONITOR DIMM "+(S.monitor.dimm?"ligado":"desligado"); break;
    case "SENDS ON FADER":
      S.sof = S.sof ? null : {tipo:"mix", n:0};
      S.ajuda = S.sof ? "<b>SENDS ON FADER</b> — os faders viram sends do MIX 1" : "Saiu do SENDS ON FADER";
      break;
    case "CUE CLEAR": {
      const n = Object.values(S.canais).filter(c=>c.cue).length;
      Object.values(S.canais).forEach(c=>c.cue=false);
      S.monitor.cueAtivo = false;
      /* avisa mesmo quando não havia nada em cue -- sem isso o botão
         parece morto para quem aperta */
      S.ajuda = n ? ("CUE limpo em "+n+" canal(is)")
                  : "CUE CLEAR — nenhum canal estava em cue";
      break;
    }
    case "MUTE GROUP 1":
    case "MUTE GROUP 2": {
      const n = +f.slice(-1);
      S.mg = S.mg || {};
      S.mg[n] = !S.mg[n];
      aplicarMuteGroup(n, S.mg[n]);
      break;
    }
    case "HELP": abrirPopup("HELP"); break;
    /* TAP TEMPO de verdade: mede o intervalo entre as batidas e ESCREVE o
       tempo nos racks de efeito. Antes só trocava a mensagem -- era o botão
       mais morto do painel, e o portão não pegava porque a mensagem mudava. */
    case "TAP TEMPO": {
      const agora = performance.now();
      S.tap = S.tap || { ultimo:0, batidas:[] };
      if (S.tap.ultimo && agora - S.tap.ultimo < 3000){
        S.tap.batidas.push(agora - S.tap.ultimo);
        if (S.tap.batidas.length > 4) S.tap.batidas.shift();   /* média das 4 últimas */
        const med = S.tap.batidas.reduce((a,b)=>a+b,0) / S.tap.batidas.length;
        const ms = Math.round(clamp(med, 20, 3000));
        let n = 0;
        S.rack.forEach(r=>{ if (r.tipo === "EFFECT"){ r.param.tempo = ms; n++; } });
        S.tapMs = ms;
        S.ajuda = "TAP TEMPO: <b>"+ms+" ms</b> ("+Math.round(60000/ms)+" BPM) — "+
                  "aplicado em "+n+" rack(s) de efeito";
      } else {
        S.tap.batidas = [];
        S.ajuda = "TAP TEMPO — bata de novo, no ritmo da música";
      }
      S.tap.ultimo = agora;
      break;
    }
    default:
      S.ajuda = "USER DEFINED KEY "+(i+1)+": <b>"+(f||"sem atribuição")+"</b>";
  }
  pedirRender();
}

/* ---- cenas ---- */
/* Caixa de confirmação da mesa (p.32). Se a preferência estiver desligada,
   executa direto -- é o que a M7CL faz. */
/* O callback vive aqui; os botões têm tratador PERMANENTE.
   Antes eu registrava o listener só ao abrir a caixa — com ela fechada os
   botões ficavam sem função nenhuma, e o portão acusou os dois como mortos. */
let cfAcao = null;
function fecharConfirma(){
  const cx = document.getElementById("confirma");
  if (cx) cx.classList.remove("on");
  cfAcao = null;
}
function ligarConfirma(){
  const ok = document.getElementById("cf-ok");
  const no = document.getElementById("cf-cancel");
  if (!ok || !no) return;
  ok.addEventListener("click", ()=>{
    const f = cfAcao; fecharConfirma();
    if (f) f(); else { S.ajuda = "Nada a confirmar"; pedirRender(); }
  });
  no.addEventListener("click", ()=>{
    const tinha = !!cfAcao;
    fecharConfirma();
    S.ajuda = tinha ? "Cancelado — a mixagem continua como estava" : "Nada a cancelar";
    pedirRender();
  });
}

function confirmarNaTela(titulo, texto, quandoOk, precisa){
  if (!precisa){ quandoOk(); return; }
  const cx = document.getElementById("confirma");
  if (!cx){ quandoOk(); return; }
  document.getElementById("cf-tit").textContent = titulo;
  document.getElementById("cf-msg").innerHTML = texto;
  cfAcao = quandoOk;
  cx.classList.add("on");
}

/* Chama a cena SELECIONADA (o alvo das setas), não a atual. */
function recallCena(alvo){
  const n = Number.isFinite(alvo) ? alvo : S.cena.sel;
  const c = S.cena.lista.find(x=>x.n===n);
  if (!c){ S.ajuda = "Cena <b>"+num3(n)+"</b> está vazia — nada para chamar"; pedirRender(); return; }
  /* RECALL CONFIRMATION (p.214): chamar cena SOBRESCREVE a mesa inteira.
     Sem esta pergunta, um toque na tecla apagava a mixagem do aluno sem
     aviso -- e como tudo ficava mudo, parecia que a música tinha parado. */
  const zerar = (c.n === 0);
  confirmarNaTela("RECALL CONFIRMATION",
    "Chamar a cena <b>"+num3(c.n)+" "+c.nome+"</b>?<br>"+
    "<span style='font-size:11px;opacity:.85'>A mixagem atual será substituída."+
    /* a 000 é o retrato de FÁBRICA: chamar ela zera a mesa e cala tudo.
       Dizer só "será substituída" não avisa o tamanho do estrago. */
    (zerar ? "<br><b>A cena 000 é o estado de fábrica: todos os faders voltam "+
             "para −∞ e a mesa fica muda.</b>" : "")+"</span>",
    ()=>{
      if (c.dados) aplicarCena(c.dados);
      /* só AGORA a cena atual anda -- se o operador cancelar, o número não
         pode ter se mexido (era o defeito: cancelar deixava o número errado) */
      S.cena.n = c.n; S.cena.sel = c.n; S.cena.nome = c.nome;
      S.ajuda = "Cena <b>"+num3(c.n)+" "+c.nome+"</b> chamada — os faders andaram sozinhos";
      pedirRender();
    },
    S.pref.recallConf);
}
/* INC/DEC RECALL das USER DEFINED KEYS (p.280): "chama a cena do PRÓXIMO
   número EXISTENTE" / "do número existente ANTERIOR". Andar ±1 cego caía em
   cena vazia e não fazia nada -- a tecla parecia morta. */
function recallVizinha(dir){
  const nums = S.cena.lista.map(x=>x.n).sort((a,b)=>a-b);
  const alvo = dir > 0 ? nums.find(n => n > S.cena.n)
                       : [...nums].reverse().find(n => n < S.cena.n);
  if (alvo == null){
    S.ajuda = dir > 0 ? "Não há cena guardada depois da <b>"+num3(S.cena.n)+"</b>"
                      : "Não há cena guardada antes da <b>"+num3(S.cena.n)+"</b>";
    pedirRender(); return;
  }
  recallCena(alvo);
}
function fotoDaMesa(){
  const f = {};
  /* a serialização de UM canal vive em fotoDeUmCanal — foto e delta usam a
     MESMA, senão o delta compara formatos diferentes e nunca fecha */
  for (const [id,c] of Object.entries(S.canais)) f[id] = fotoDeUmCanal(c);
  return f;
}
function aplicarCena(f){
  for (const [id,v] of Object.entries(f)){
    const c = S.canais[id];
    if (!c || c.recallSafe) continue;      /* RECALL SAFE respeitado */
    /* FOCUS (p.147): a cena só mexe no que estiver ligado no FOCUS.
       Guardo o valor atual do que o focus proíbe e devolvo depois. */
    const guardado = {};
    if (S.focus.FADER === false) guardado.fader = c.fader;
    if (S.focus.ON    === false) guardado.on    = c.on;
    if (S.focus.EQ    === false) guardado.eq    = JSON.parse(JSON.stringify(c.eq));
    if (S.focus.HA    === false) guardado.ha    = {...c.ha};
    if (S.focus.PAN   === false) guardado.pan   = c.pan;
    Object.assign(c, {
      fader:v.fader, on:v.on, pan:v.pan, toSt:v.toSt, toMono:v.toMono,
      /* cena antiga (gravada antes do LCR existir) não tem estes campos --
         cair no valor de fábrica é melhor que gravar undefined no canal */
      lcr:!!v.lcr, lcrOn:v.lcrOn !== false, csr:Number.isFinite(v.csr) ? v.csr : 0,
      ha:{...v.ha}, hpf:{...v.hpf},
      eq:{on:v.eq.on,tipo:v.eq.tipo,att:v.eq.att,bandas:JSON.parse(JSON.stringify(v.eq.bandas))},
      dyn1:{...v.dyn1}, dyn2:{...v.dyn2},
      mix:v.mix.map(s=>({...s})), mtx:v.mtx.map(s=>({...s})),
      dca:[...v.dca], mute:[...v.mute], insert:v.insert, dout:v.dout, nome:v.nome
    });
    Object.assign(c, guardado);            /* devolve o que o FOCUS proibiu */
  }
}

/* MUTE GROUP com MUTE SAFE (p.126-129): o canal marcado como safe não
   obedece ao grupo -- é o que salva o microfone do padre quando alguém
   aperta o mute group errado no meio do show. */
function aplicarMuteGroup(n, ligado){
  let n_ = 0;
  for (const c of Object.values(S.canais)){
    if (!c.mute.includes(n)) continue;
    if (S.muteSafe[c.id]) continue;        /* protegido */
    c.on = !ligado; n_++;
  }
  S.ajuda = "MUTE GROUP "+n+" "+(ligado?"LIGADO":"desligado")+" — "+n_+" canais"+
            (Object.keys(S.muteSafe).filter(k=>S.muteSafe[k]).length
              ? " (os em MUTE SAFE não obedeceram)" : "");
  pedirRender();
}
function guardarCena(n, nome){
  if (n===0){ S.ajuda="A cena <b>000 Initial Data</b> é protegida na mesa real — escolha outro número"; return false; }
  /* STORE CONFIRMATION (p.214/p.32): guardar por cima de uma cena que já
     existe apaga a anterior. A mesa pergunta; aqui também. */
  const existente = S.cena.lista.find(x=>x.n===n);
  if (existente && S.pref.storeConf && !S._confirmandoStore){
    confirmarNaTela("STORE CONFIRMATION",
      "Guardar sobre a cena <b>"+num3(n)+" "+existente.nome+"</b>?",
      ()=>{ S._confirmandoStore = true; guardarCena(n, nome); S._confirmandoStore = false; pedirRender(); },
      true);
    return false;
  }
  const ja = S.cena.lista.findIndex(x=>x.n===n);
  const reg = {n, nome:nome||("SCENE "+num3(n)), bloq:false, dados:fotoDaMesa()};
  if (ja>=0) S.cena.lista[ja] = reg; else S.cena.lista.push(reg);
  S.cena.lista.sort((a,b)=>a.n-b.n);
  S.cena.n = n; S.cena.sel = n; S.cena.nome = reg.nome;
  S.ajuda = "Cena <b>"+num3(n)+" "+reg.nome+"</b> guardada";
  return true;
}

/* ---- meters: sinal fictício, só visual. NÃO gera áudio de propósito ---- */
let t0 = 0;
function tickMeters(ts){
  if (ts - t0 > 60){
    t0 = ts;
    /* Com música tocando, o meter mede o SINAL REAL de cada faixa.
       O metering point escolhe de qual analisador ler (p.167). */
    const comAudio = new Set();
    if (AUD.tocando){
      for (const s of AUD.stems){
        const c = S.canais[s.canal], n = s.nodes;
        if (!c || !n || !n.anaPos) continue;
        const ana = (S.meterPonto === "POST ON") ? n.anaPos : n.anaPre;
        ana.getByteTimeDomainData(n.buf);
        let pico = 0;
        for (let i=0;i<n.buf.length;i++){
          const v = Math.abs(n.buf[i] - 128) / 128;
          if (v > pico) pico = v;
        }
        /* ataque rápido, queda lenta -- é o que faz o LED ser legível */
        c.nivel = Math.max(pico, (c.nivel||0) * 0.82);
        comAudio.add(c.id);
      }
    }
    for (const c of Object.values(S.canais)){
      if (comAudio.has(c.id)) continue;          /* já medido no áudio real */
      if (c.tipo==="in" || c.tipo==="stin"){
        /* Sem música carregada o meter fica PARADO: um LED que mexe sem sinal
           é exatamente o "botão que finge" que o dono cobra. Só há animação
           quando o oscilador interno está ligado, que aí há sinal de verdade. */
        if (!S.osc.on){ c.nivel = 0; continue; }
        const base = clamp((c.ha.gain+62)/72, 0, 1);
        const vivo = base * (0.55 + 0.45*Math.sin(ts/300 + c.id.length*1.7 + (+c.id.replace(/\D/g,"")||0)));
        /* O METERING POINT muda de verdade o que o meter mostra (p.167):
           PRE EQ e PRE FADER ignoram o fader; só POST ON passa pelo fader
           e pela tecla [ON]. Sem isto o botão seria enfeite. */
        if (S.meterPonto === "PRE EQ" || S.meterPonto === "PRE FADER"){
          c.nivel = clamp(vivo, 0, 1);
        } else {
          c.nivel = c.on ? clamp(vivo*clamp(dbParaPos(c.fader)+0.15,0,1.2), 0, 1) : 0;
        }
      }
    }
    /* O master soma o que chega. Com áudio real o nível medido JÁ passou pelo
       fader (em POST ON), então não se multiplica por ele de novo -- isso
       elevava o sinal ao quadrado e o master ficava sempre baixo demais. */
    const entradas = Object.values(S.canais)
      .filter(c=>(c.tipo==="in"||c.tipo==="stin") && c.on);
    /* Sinais somam em POTÊNCIA, não em amplitude: raiz da soma dos quadrados.
       Somar amplitude direto e depois dividir por um número escolhido a dedo
       deixava o master sempre baixo demais e o meter apagado. */
    const somaPara = quanto => {
      let p = 0;
      for (const c of entradas){
        const g = quanto(c);
        if (!g) continue;
        const v = (AUD.tocando ? c.nivel : c.nivel*dbParaPos(c.fader)) * g;
        p += v*v;
      }
      return Math.sqrt(p);
    };
    /* STEREO e MONO medem coisas DIFERENTES, porque são barramentos
       diferentes (p.63). O MONO era `st.nivel*0.8` -- um número inventado que
       fazia o meter do MONO acender mesmo com nenhum canal mandado para ele. */
    const csrDe = c => clamp(c.csr,0,100)/100;
    const gSt   = c => c.lcr ? (c.lcrOn ? 1-csrDe(c) : 0) : (c.toSt   ? 1 : 0);
    const gMono = c => c.lcr ? (c.lcrOn ?   csrDe(c) : 0) : (c.toMono ? 1 : 0);
    const st = S.canais.STEREO, mo = S.canais.MONO;
    /* METERING POINT vale para as SAÍDAS também (p.169: a bridge segue o
       ponto escolhido). Em PRE EQ / PRE FADER a medição ignora o fader e o
       [ON] do bus -- é o modo que responde "está chegando sinal aqui?"
       mesmo com o master fechado. Antes era sempre POST ON. */
    const posOn = S.meterPonto === "POST ON";
    const fd = c => !posOn ? 1 : (c.fader <= -138 ? 0 : Math.pow(10, c.fader/20));
    const lig2 = c => !posOn ? 1 : (c.on ? 1 : 0);
    st.nivel = clamp(somaPara(gSt)   * fd(st) * lig2(st), 0, 1);
    mo.nivel = clamp(somaPara(gMono) * fd(mo) * lig2(mo), 0, 1);

    /* Os buses MIX e MATRIX medem o que os canais MANDAM para eles.
       Sem isto a meter bridge ficava sempre apagada, mesmo com o aluno
       abrindo mandada -- e é justamente nela que se confere o monitor. */
    const somaBus = (arrNome, idx) => {
      let p = 0;
      for (const c of entradas){
        const s = c[arrNome] && c[arrNome][idx];
        if (!s || !s.on || s.lvl <= -138) continue;
        const v = c.nivel * Math.pow(10, s.lvl/20);
        p += v*v;
      }
      return Math.sqrt(p);
    };
    for (let i=0;i<N_MIX;i++){
      const m = S.canais["MIX"+(i+1)];
      m.nivel = clamp(somaBus("mix", i) * fd(m) * lig2(m), 0, 1);
    }
    for (let i=0;i<N_MTX;i++){
      const m = S.canais["MTX"+(i+1)];
      m.nivel = clamp(somaBus("mtx", i) * fd(m) * lig2(m), 0, 1);
    }
    pedirRender();
  }
  requestAnimationFrame(tickMeters);
}
requestAnimationFrame(tickMeters);

/* ==================================================================
   TELA TOUCH
   Estrutura só é recriada quando muda a "chave estrutural". Os valores
   que mudam a todo frame (meters, ângulos, dB) são atualizados por
   ligações registradas na construção -- sem recriar nó nenhum.
   ================================================================== */
let LIGACOES = [];
const lig = fn => { LIGACOES.push(fn); fn(); };
let telaChave = null;

function desenharTela(){
  /* lembra a última tela "de trabalho" — é para onde o segundo toque num
     botão destacado da function access area devolve (p.33) */
  if (!S.popup && (S.tela==="OVERVIEW" || S.tela==="SELCH")) S.telaVolta = S.tela;
  const chave = [S.tela, S.popup, S.sel, S.nav, S.navFixa, S.sendDest,
                 S.sof?S.sof.tipo+S.sof.n:"-", S.cena.n, S.cena.sel, S.cena.lista.length].join("|");
  if (chave !== telaChave){ telaChave = chave; construirTela(); }
  for (const f of LIGACOES) f();
}

function construirTela(){
  LIGACOES = [];
  const area = document.getElementById("area");
  const fac  = document.getElementById("fac");
  if (!area || !fac) return;
  area.innerHTML = ""; fac.innerHTML = "";
  /* Os encoders são multifunção: quem os arma é a tela, na hora de se montar.
     Zerar aqui garante que uma tela que NÃO arma nada deixe os encoders no
     comportamento antigo (send/pan/fader) em vez de herdar o alvo da tela
     anterior -- alvo velho apontando para o canal errado é defeito mudo. */
  limparEncoders();
  construirFAC(fac);
  if (S.popup) TELAS_POPUP[S.popup] ? TELAS_POPUP[S.popup](area) : area.appendChild(el("div",null,"?"));
  else (TELAS[S.tela] || TELAS.OVERVIEW)(area);
}

/* ---------- function access area (p.32) ---------- */
function construirFAC(fac){
  const c = S.canais[S.sel];

  const sc = el("div","selcanal");
  sc.appendChild(el("b",null, c ? rotuloCurto(c) : "--"));
  sc.appendChild(el("span",null, c ? c.nome : ""));
  sc.title = "Aperte a metade esquerda para o canal anterior, a direita para o próximo (igual à mesa real)";
  sc.addEventListener("pointerdown", ev=>{
    const r = sc.getBoundingClientRect();
    pularCanal(ev.clientX < r.left + r.width/2 ? -1 : 1);
  });
  fac.appendChild(sc);

  const rel = el("div","relogio","--:--:--");
  lig(()=>{ const d = new Date();
    rel.textContent = [d.getHours(),d.getMinutes(),d.getSeconds()]
      .map(x=>String(x).padStart(2,"0")).join(":"); });
  fac.appendChild(rel);
  /* item C da p.33: junto do usuário aparecem os avisos de estado —
     OSC, TB e o tipo de sinal em cue. Sem eles o aluno liga o oscilador,
     esquece, e não há NADA na tela dizendo que há um seno indo pro PA. */
  const usu = el("div","relogio");
  lig(()=>{
    const avisos = [];
    if (S.osc.on) avisos.push("OSC");
    if (S.talkback.on) avisos.push("TB");
    if (Object.values(S.canais).some(x=>x.cue)) avisos.push("CUE");
    usu.innerHTML = S.usuario + (avisos.length
      ? " <span style='color:#ff5c40;font-weight:700'>"+avisos.join(" · ")+"</span>" : "");
  });
  fac.appendChild(usu);

  /* item D da p.33: o HELP mora AQUI, na function access area (na mesa ele
     carrega a ajuda de um pendrive; aqui abre o guia da aula). */
  const bH = el("div","bt","HELP");
  bH.title = "Guia rápido do simulador";
  bH.classList.toggle("ativo", S.popup==="HELP");
  bH.addEventListener("pointerdown",()=>{ abrirPopup("HELP"); pedirRender(); });
  fac.appendChild(bH);

  const botao = (rot, alvo, dica) => {
    const b = el("div","bt",rot);
    b.title = dica || "";
    const destacado =
      (alvo==="SOF" && !!S.sof) || S.tela===alvo || S.popup===alvo;
    b.classList.toggle("ativo", destacado);
    b.addEventListener("pointerdown", ()=>{
      /* p.33: com o botão JÁ destacado, apertar de novo volta para a tela
         de onde se veio (OVERVIEW / SELECTED CHANNEL VIEW). É o gesto de
         "fechar" da mesa — sem ele o operador fica preso na tela. */
      if (destacado && alvo!=="SOF"){
        S.popup = null;
        S.tela = (S.telaVolta==="SELCH") ? "SELCH" : "OVERVIEW";
        pedirRender(); return;
      }
      if (alvo==="SOF"){
        S.sof = S.sof ? null : {tipo:"mix", n:0};
        S.ajuda = S.sof
          ? "<b>SENDS ON FADER</b> — escolha o bus na tela; os faders de input viram os sends"
          : "Saiu do SENDS ON FADER";
        if (S.sof) S.tela = "SOF";
      }
      else if (alvo==="CHJOB") abrirPopup("CHJOB");
      else if (alvo==="RACK") abrirPopup("RACK");
      else if (alvo==="MONITOR") abrirPopup("MONITOR");
      else if (alvo==="SETUP") abrirPopup("SETUP");
      else if (alvo==="METER"){ S.popup=null; S.tela="METER"; }
      pedirRender();
    });
    return b;
  };
  /* MIX (músicas) e MINHAS CENAS: o que o aluno mais usa nesta aula */
  const linhaAluno = el("div"); linhaAluno.style.cssText="display:flex;gap:2px";
  const bMix = el("div","bt","MIX"); bMix.style.flex="1";
  bMix.title = "Escolher a música multitrack e o transporte";
  bMix.classList.toggle("ativo", S.tela==="MIX");
  bMix.addEventListener("pointerdown",()=>{ S.popup=null; S.tela="MIX"; pedirRender(); });
  const bCen = el("div","bt","CENAS"); bCen.style.flex="1";
  bCen.title = "Guardar/chamar cenas na sua conta";
  bCen.addEventListener("pointerdown",()=>{ abrirPopup("NUVEM"); pedirRender(); });
  linhaAluno.appendChild(bMix); linhaAluno.appendChild(bCen);
  fac.appendChild(linhaAluno);

  fac.appendChild(botao("SENDS ON FADER","SOF","Os faders passam a controlar as mandadas para o bus escolhido"));
  fac.appendChild(botao("CH JOB","CHJOB","Copiar, mover e inicializar canal"));
  const linha = el("div"); linha.style.cssText="display:flex;gap:3px";
  const bR = botao("RACK","RACK","GEQ e efeitos (racks 1-8)"); bR.style.flex="1";
  const bM = botao("MONITOR","MONITOR","Monitor, cue, oscilador e talkback"); bM.style.flex="1";
  linha.appendChild(bR); linha.appendChild(bM);
  fac.appendChild(linha);

  /* item I da p.33: as réguas são STEREO L/R, MONO (M) e CUE — e tocar no
     campo com o cue LIGADO não abre a tela: limpa o cue (é o CUE CLEAR de
     emergência da mesa). Sem cue, abre a METER screen. */
  const mt = el("div"); mt.id="facmeter";
  mt.appendChild(el("div","rot","METER"));
  const barras = el("div","barras");
  const bs = ["L","R","M","CUE"].map(()=>{ const i = el("i"); const b = el("b"); i.appendChild(b); barras.appendChild(i); return b; });
  mt.appendChild(barras);
  mt.appendChild(el("div","rot","L  R  M  CUE"));
  lig(()=>{
    const st = S.canais.STEREO, mo = S.canais.MONO;
    const emCue = Object.values(S.canais).filter(x=>x.cue);
    const nCue = emCue.length ? Math.max(...emCue.map(x=>x.nivel||0)) : 0;
    const v = [st.nivel, st.nivel*0.94, mo.nivel, nCue];
    bs.forEach((b,i)=>b.style.height = (v[i]*100).toFixed(1)+"%");
  });
  mt.style.cursor="pointer";
  mt.addEventListener("pointerdown", ()=>{
    const n = Object.values(S.canais).filter(x=>x.cue).length;
    if (n){
      Object.values(S.canais).forEach(x=>x.cue=false);
      S.monitor.cueAtivo = false;
      S.ajuda = "CUE limpo em "+n+" canal(is) — tocar no meter com cue ligado é o atalho da mesa (p.33)";
    } else {
      S.popup=null; S.tela="METER";
    }
    pedirRender();
  });
  fac.appendChild(mt);

  fac.appendChild(botao("SETUP","SETUP","Ajustes gerais, usuário e user defined keys"));

  /* p.22: "o número da cena SELECIONADA aparece na function access area".
     Quando o selecionado difere do que está carregado, a mesa precisa deixar
     isso claro -- senão o operador acha que já chamou. */
  const cen = el("div","cena");
  cen.appendChild(el("u",null,"SCENE"));
  const selReg = S.cena.lista.find(x=>x.n===S.cena.sel);
  cen.appendChild(el("b",null,num3(S.cena.sel)));
  if (S.cena.sel !== S.cena.n){
    const t = el("span",null,(selReg?selReg.nome:"(vazia)")+" · atual "+num3(S.cena.n));
    t.style.color = "var(--tela-amarelo,#ffd45e)";
    cen.appendChild(t);
  } else {
    cen.appendChild(el("span",null,S.cena.nome));
  }
  cen.addEventListener("pointerdown", ()=>{ abrirPopup("SCENE"); pedirRender(); });
  fac.appendChild(cen);
}
function rotuloCurto(c){
  if (c.tipo==="in") return "CH"+c.id.slice(2);
  if (c.tipo==="stin") return "ST IN"+c.id.slice(2);
  if (c.tipo==="mix") return "MIX"+c.id.slice(3);
  if (c.tipo==="mtx") return "MTX"+c.id.slice(3);
  if (c.tipo==="dca") return "DCA"+c.id.slice(3);
  return c.id;
}
function pularCanal(d){
  const ordem = [];
  for (let i=1;i<=N_IN;i++) ordem.push("CH"+i);
  for (let i=1;i<=N_STIN;i++) ordem.push("ST"+i);
  for (let i=1;i<=N_MIX;i++) ordem.push("MIX"+i);
  for (let i=1;i<=N_MTX;i++) ordem.push("MTX"+i);
  ordem.push("STEREO","MONO");
  const i = ordem.indexOf(S.sel);
  S.sel = ordem[clamp(i+d, 0, ordem.length-1)];
  S.ajuda = "Canal selecionado: <b>"+S.canais[S.sel].nome+"</b>";
  pedirRender();
}
function abrirPopup(p){ S.popup = p; }
function fecharPopup(){ S.popup = null; }

/* ================= OVERVIEW (p.98/99) =================
   12 campos: A nome · B HA/PHASE · C output port · D insert/direct ·
   E EQ · F DYN1 · G DYN2 · H TO MIX/MATRIX · I FROM MIX · J TO ST/MONO ·
   K DCA/MUTE · L nome (rodapé)                                        */
const TELAS = {};

TELAS.OVERVIEW = function(area){
  const grupo = grupoTela();
  /* Os 8 encoders passam a mexer no parâmetro EM FOCO, um canal cada (p.99).
     Os FADERS da Centralogic continuam sendo o nível desses mesmos canais. */
  limparEncoders();
  const foco = S.encFoco || "send0";
  grupo.forEach((id,i)=>{
    const c = S.canais[id];
    if (!c) return;
    if (foco === "ha"){
      S.encRotulo = "HA GAIN";
      registrarEncoder(i, { rot:c.nome, min:-62, max:10,
        ler:()=>c.ha.gain, escrever:v=>{ c.ha.gain = v; } });
    } else if (foco === "pan"){
      S.encRotulo = "PAN";
      registrarEncoder(i, { rot:c.nome, min:-1, max:1,
        ler:()=>c.pan, escrever:v=>{ c.pan = v; } });
    } else if (foco.startsWith("send")){
      const n = +foco.slice(4);
      const arr = S.sendDest==="mix" ? c.mix : c.mtx;
      if (!arr[n]) return;
      S.encRotulo = (S.sendDest==="mix"?"MIX ":"MATRIX ")+(n+1);
      registrarEncoder(i, { rot:c.nome, min:0, max:1,
        ler:()=>dbParaPos(arr[n].lvl),
        escrever:v=>{ arr[n].lvl = posParaDb(v); } });
    }
  });
  const g = el("div");
  g.style.cssText = "display:grid;grid-template-columns:repeat(8,1fr);gap:2px;height:100%;min-height:0";

  grupo.forEach((id, col)=>{
    const c = S.canais[id];
    const cel = el("div");
    cel.style.cssText = "background:var(--tela-canal);border:1px solid #1a1c1f;border-radius:2px;"+
      "display:flex;flex-direction:column;gap:1px;padding:1px;min-height:0;overflow:hidden";
    if (!c){ cel.style.opacity=".3"; g.appendChild(cel); return; }
    if (id === S.sel) cel.style.outline = "1px solid var(--tela-azul-claro)";

    /* A — nome no topo */
    const topo = el("div", null, rotuloCurto(c)+"  "+c.nome);
    topo.style.cssText = "font-size:8px;background:"+(id===S.sel?"var(--tela-azul)":"#26292d")+
      ";border-radius:1px;padding:0 2px;white-space:nowrap;overflow:hidden;cursor:pointer";
    topo.addEventListener("pointerdown",()=>{ S.sel=id; S.ajuda="Canal <b>"+c.nome+"</b> selecionado"; pedirRender(); });
    cel.appendChild(topo);

    /* B — HA / PHASE (só entrada) */
    if (c.tipo==="in" || c.tipo==="stin"){
      const ha = el("div");
      ha.style.cssText="display:flex;align-items:center;gap:2px";
      const k = el("div","knob mini"); k.style.setProperty("--kd","16px");
      const v = el("span"); v.style.cssText="font-size:7.5px";
      const p48 = el("button","tbt laranja"); p48.type="button"; p48.textContent="+48"; p48.style.fontSize="7px";
      p48.addEventListener("pointerdown",e=>{e.stopPropagation();c.ha.phantom=!c.ha.phantom;
        S.ajuda="Phantom +48V "+(c.ha.phantom?"LIGADO":"desligado")+" em <b>"+c.nome+"</b>";pedirRender();});
      const ph = el("button","tbt"); ph.type="button"; ph.textContent="Ø"; ph.style.fontSize="7px";
      ph.addEventListener("pointerdown",e=>{e.stopPropagation();c.ha.phase=!c.ha.phase;
        S.ajuda="Polaridade de <b>"+c.nome+"</b> "+(c.ha.phase?"INVERTIDA":"normal");pedirRender();});
      /* clicar no knob de HA põe o HA de TODOS os 8 canais sob os encoders */
      k.style.cursor = "pointer";
      k.addEventListener("pointerdown", ev=>{ ev.stopPropagation();
        /* p.101: "se o knob de GAIN estiver aparecendo, toque nele para
           selecionar e toque de novo" -> aí sim abre a HA/PATCH. */
        if (S.encFoco === "ha"){ S.sel = id; abrirPopup("HA"); pedirRender(); return; }
        S.encFoco = "ha";
        S.ajuda = "Knob <b>GAIN</b> selecionado — gire os encoders 1-8 da Centralogic "+
                  "para ajustar o ganho dos 8 canais; toque de novo para abrir HA/PATCH";
        telaChave = null; pedirRender();
      });
      ha.appendChild(k); ha.appendChild(v); ha.appendChild(p48); ha.appendChild(ph);
      lig(()=>{
        k.style.setProperty("--ang", anguloDe(c.ha.gain,-62,10)+"deg");
        v.textContent = c.ha.gain.toFixed(0);
        p48.classList.toggle("on", c.ha.phantom);
        ph.classList.toggle("on", c.ha.phase);
        k.classList.toggle("emfoco", S.encFoco === "ha");   /* moldura grossa */
      });
      cel.appendChild(ha);
    } else {
      /* C — OUTPUT PORT (só saída) */
      const op = el("div",null, c.tipo==="mix" ? "OMNI"+c.id.slice(3) : "—");
      op.style.cssText="font-size:7.5px;background:#1f2225;border-radius:1px;text-align:center";
      cel.appendChild(op);
    }

    /* D — INSERT / DIRECT OUT */
    const dl = el("div"); dl.style.cssText="display:flex;gap:1px";
    const bIns = el("button","tbt laranja","INS"); bIns.type="button"; bIns.style.cssText="flex:1;font-size:7px";
    bIns.addEventListener("pointerdown",()=>{c.insert=!c.insert;
      S.ajuda="INSERT de <b>"+c.nome+"</b> "+(c.insert?"ligado":"desligado");pedirRender();});
    dl.appendChild(bIns);
    if (c.tipo==="in"){
      const bD = el("button","tbt","D.OUT"); bD.type="button"; bD.style.cssText="flex:1;font-size:7px";
      bD.addEventListener("pointerdown",()=>{c.dout=!c.dout;
        S.ajuda="DIRECT OUT de <b>"+c.nome+"</b> "+(c.dout?"ligado":"desligado");pedirRender();});
      dl.appendChild(bD);
      lig(()=>bD.classList.toggle("on",c.dout));
    }
    lig(()=>bIns.classList.toggle("on",c.insert));
    cel.appendChild(dl);

    /* E — gráfico de EQ (SVG, não canvas: o portão precisa enxergar) */
    const svg = curvaEQ(c, 78, 26);
    svg.style.cursor="pointer";
    svg.addEventListener("pointerdown",()=>{ S.sel=id; abrirPopup("EQ"); pedirRender(); });
    cel.appendChild(svg);

    /* F/G — DYNAMICS 1 e 2 */
    [["dyn1","DYN1"],["dyn2","DYN2"]].forEach(([k,rot])=>{
      if (k==="dyn2" && !(c.tipo==="in"||c.tipo==="stin")) return;
      const d = c[k];
      const b = el("div");
      b.style.cssText="display:flex;align-items:center;gap:2px;font-size:7px;cursor:pointer;"+
        "background:#1f2225;border-radius:1px;padding:0 2px";
      const nm = el("span"); nm.style.flex="0 0 auto";
      const bar = el("div"); bar.style.cssText="flex:1;height:5px;background:#111;border-radius:1px;position:relative;overflow:hidden";
      const gr = el("i"); gr.style.cssText="position:absolute;right:0;top:0;bottom:0;background:#e8a33d";
      bar.appendChild(gr);
      const val = el("span");
      b.appendChild(nm); b.appendChild(bar); b.appendChild(val);
      b.addEventListener("pointerdown",()=>{ S.sel=id; abrirPopup(k==="dyn1"?"DYN1":"DYN2"); pedirRender(); });
      lig(()=>{
        nm.textContent = d.on ? d.tipo.slice(0,4) : "—";
        val.textContent = d.thr.toFixed(0);
        gr.style.width = d.on ? clamp((c.nivel*60 + d.thr)*2, 0, 100)+"%" : "0%";
      });
      cel.appendChild(b);
    });

    /* H — TO MIX / TO MATRIX: 16 knobs em 2 colunas x 8 linhas */
    const sends = el("div");
    sends.style.cssText="flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;"+
      "gap:1px;align-content:start;overflow:hidden";
    const arr = S.sendDest==="mix" ? c.mix : c.mtx;
    arr.forEach((s,n)=>{
      const cel2 = el("div");
      cel2.style.cssText="display:flex;align-items:center;gap:1px;cursor:pointer";
      const k = el("div","knob mini"); k.style.setProperty("--kd","13px");
      const t = el("span"); t.style.cssText="font-size:6px;color:#c9ced4";
      cel2.appendChild(k); cel2.appendChild(t);
      cel2.addEventListener("pointerdown",()=>{
        S.encFoco = "send"+n;
        S.ajuda = "Knob <b>"+(S.sendDest==="mix"?"MIX ":"MATRIX ")+(n+1)+
          "</b> selecionado — gire os encoders 1-8 da Centralogic para mexer nos 8 canais de uma vez";
        pedirRender();
      });
      lig(()=>{
        k.style.setProperty("--ang", (dbParaPos(s.lvl)*270-135)+"deg");
        k.classList.toggle("emfoco", S.encFoco==="send"+n);   /* moldura grossa, p.99 */
        k.style.opacity = s.on ? "1" : ".4";
        t.textContent = s.lvl<=-138 ? "-∞" : s.lvl.toFixed(0);
      });
      sends.appendChild(cel2);
    });
    cel.appendChild(sends);

    /* J — TO STEREO / MONO */
    const st = el("div"); st.style.cssText="display:flex;align-items:center;gap:1px";
    const kp = el("div","knob mini"); kp.style.setProperty("--kd","14px");
    const bST = el("button","tbt","ST"); bST.type="button"; bST.style.fontSize="6.5px";
    const bMO = el("button","tbt","M");  bMO.type="button"; bMO.style.fontSize="6.5px";
    bST.addEventListener("pointerdown",()=>{c.toSt=!c.toSt;
      S.ajuda="<b>"+c.nome+"</b> "+(c.toSt?"vai":"NÃO vai")+" para o STEREO";pedirRender();});
    bMO.addEventListener("pointerdown",()=>{c.toMono=!c.toMono;
      S.ajuda="<b>"+c.nome+"</b> "+(c.toMono?"vai":"não vai")+" para o MONO";pedirRender();});
    /* p.103: 1ª batida seleciona (moldura); com a moldura já posta, a 2ª abre

    kp.addEventListener("pointerdown",()=>{
      if (S.encFoco==="pan"){ abrirPopup("TOST"); pedirRender(); return; }
      S.encFoco="pan";
      S.ajuda="Knob <b>PAN</b> selecionado — gire os encoders 1-8 para panoramizar "+

      telaChave = null; pedirRender();
    });
    st.appendChild(kp); st.appendChild(bST); st.appendChild(bMO);
    lig(()=>{
      kp.style.setProperty("--ang", anguloDe(c.pan,-1,1)+"deg");
      /* moldura DUPLA: é assim que a mesa marca PAN/BALANCE (p.31) */
      kp.classList.toggle("emfoco", S.encFoco==="pan");

    /* K — DCA / MUTE GROUP */
    const kg = el("div"); kg.style.cssText="font-size:6px;line-height:1.1;cursor:pointer";

      kg.innerHTML = "<span style='color:#f2c200'>D:"+(c.dca.join("")||"-")+"</span> "+

  /* barra de baixo: alterna TO MIX x TO MATRIX (p.99) */
  const barra = el("div");
  barra.style.cssText="display:flex;gap:4px;padding-top:3px;align-items:center";

    b.classList.toggle("on", S.sendDest===d);
    b.addEventListener("pointerdown",()=>{ S.sendDest=d;
      S.ajuda="Os knobs da tela agora mostram as mandadas para <b>"+(d==="mix"?"MIX":"MATRIX")+"</b>"; pedirRender(); });
    barra.appendChild(b);

  const t = el("span",null,"OVERVIEW — 8 canais da Centralogic");
  t.style.cssText="font-size:9px;color:#9aa0a8;margin-left:auto";
  barra.appendChild(t);
  area.appendChild(barra);

  /* ---- L: a linha de baixo (p.99/100) ----------------------------------
     "A linha de baixo do OVERVIEW mostra os canais ou grupos DCA que podem
      ser controlados pelos FADERS, pela tecla [ON] e pela tecla [CUE] da
      Centralogic. A linha de cima mostra os canais controlados pelos
      encoders multifunção 1–8."
     Nem sempre são os mesmos: com o [DCA] escolhido, ou com uma nav key
     travada (2 s), a tela fica num grupo e os faders em outro. Sem esta
     linha o aluno não tem como saber qual dos dois está na mão dele. */
  const grupoF = grupoCentralogic();
  const difere = grupoF.some((id,i)=>id !== grupo[i]);
  const rodL = el("div","linha-l");
  grupoF.forEach(id=>{
    const cc = S.canais[id];
    rodL.appendChild(el("span", id===S.sel ? "sel" : null, cc ? cc.nome : "—"));
  });
  area.appendChild(rodL);
  /* Duas causas diferentes para as linhas divergirem — e a saída de cada uma
     é outra. Dizer "solte a trava" no caso do [DCA] mandaria o aluno procurar
     uma trava que não existe. */
  const leg = el("div", null,
    !difere ? "linha de baixo = FADERS e [ON] · linha de cima = ENCODERS 1-8 e [SEL]/[CUE]"
    : S.navFixa
      ? "⚠ Centralogic TRAVADA em "+(navPorId(S.navFixa)||{rot:"?"}).rot+
        ": os FADERS e [ON] ficam nos canais de baixo e só os ENCODERS e [SEL]/[CUE] "+
        "seguem a tela. Dois toques na nav key que pisca soltam a trava (p.104)."
      : "⚠ Não existe OVERVIEW de DCA (p.98): os FADERS e [ON] estão nos grupos DCA "+
        "de baixo, e os ENCODERS e [SEL]/[CUE] continuam nos canais de cima.");
  leg.style.cssText = "font-size:8px;line-height:1.3;padding-top:2px;color:"+
    (difere ? "var(--tela-amarelo,#ffd45e)" : "#7d838a");
  area.appendChild(leg);
};

/* curva de EQ em SVG (4 bandas + HPF), MEDIDA: F 20-20k, G ±18, Q .1-10 */
function curvaEQ(c, w, h){
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  svg.style.cssText = "width:100%;height:"+h+"px;background:#15171a;border-radius:1px;display:block";
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("fill","none");
  path.setAttribute("stroke","var(--tela-verde)");
  path.setAttribute("stroke-width","1.2");
  const zero = document.createElementNS("http://www.w3.org/2000/svg","line");
  zero.setAttribute("x1","0"); zero.setAttribute("x2",String(w));
  zero.setAttribute("y1",String(h/2)); zero.setAttribute("y2",String(h/2));
  zero.setAttribute("stroke","#3a3d42"); zero.setAttribute("stroke-width","0.5");
  svg.appendChild(zero); svg.appendChild(path);
  lig(()=>{
    const pts = [];
    for (let x=0;x<=w;x+=2){
      const f = Math.pow(10, Math.log10(20) + (x/w)*(Math.log10(20000)-Math.log10(20)));
      let db = 0;
      if (c.eq.on){
        for (const b of Object.values(c.eq.bandas)) db += ganhoPico(f, b.f, b.g, b.q);
      }
      if (c.hpf.on) db += ganhoHPF(f, c.hpf.freq);
      pts.push(x.toFixed(0)+","+(h/2 - clamp(db,-20,20)*(h/2)/20).toFixed(1));
    }
    path.setAttribute("d","M"+pts.join("L"));
  });
  return svg;
}
/* resposta aproximada de um peaking bell -- suficiente para a tela,
   é o mesmo desenho indicativo que a mesa mostra ("approximate EQ response", p.99) */
function ganhoPico(f, f0, g, q){
  if (!g) return 0;
  const x = Math.log2(f/f0);
  return g * Math.exp(-(x*x)*(q*q)*1.4);
}
/* HPF -12 dB/oct (MEDIDO no manual: 20-600 Hz, -12 dB/oct) */
function ganhoHPF(f, fc){
  if (f >= fc) return 0;
  return Math.max(-24, 12*Math.log2(f/fc));
}

/* knob com rótulo e valor, arrastável, que escreve direto no estado */
function knobTela(rot, ler, escrever, min, max, fmt, opc){
  opc = opc || {};
  const cel = el("div","kcel");
  cel.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:1px;min-width:34px";
  if (rot) { const r = el("div",null,rot); r.style.cssText="font-size:7.5px;color:#aeb4bb"; cel.appendChild(r); }
  /* opc.cor = classe k-* da paleta oficial (ver .kt no CSS) */
  const k = el("div", opc.cor ? ("kt "+opc.cor) : ("knob"+(opc.mini?" mini":"")));
  if (opc.cor && opc.mini) k.style.setProperty("--kt","19px");
  const v = el("div"); v.style.cssText="font-size:8px;color:var(--tela-texto)";
  cel.appendChild(k); cel.appendChild(v);
  k.style.touchAction = "none";
  let base = null, y0 = 0, andou = 0;
  k.addEventListener("pointerdown", ev=>{
    ev.stopPropagation(); ev.preventDefault();
    base = ler(); y0 = ev.clientY; andou = 0;
    try{ k.setPointerCapture(ev.pointerId); }catch(e){}
  });
  k.addEventListener("pointermove", ev=>{
    if (base === null) return;
    andou = Math.max(andou, Math.abs(ev.clientY - y0));
    const d = (y0 - ev.clientY)/140;
    escrever(clamp(base + d*(max-min), min, max));
    pedirRender();
  });
  /* TOQUE (sem arraste) é o gesto da mesa: "aperte o knob para abrir a
     janela" (p.95). Arrastou = girou; soltou parado = tocou. */
  const solta = ()=>{
    const tocou = base !== null && andou < 4;
    base = null;
    if (tocou && opc.aoTocar){ opc.aoTocar(); pedirRender(); }
  };
  k.addEventListener("pointerup", solta);
  k.addEventListener("pointercancel", ()=>{ base = null; });
  lig(()=>{
    const val = ler();
    k.style.setProperty("--ang", anguloDe(val,min,max)+"deg");
    v.textContent = fmt ? fmt(val) : val.toFixed(1);
  });
  return cel;
}
/* botão liga/desliga ligado ao estado */
function btTela(rot, ler, alternar, opc){
  opc = opc || {};
  const b = el("button","tbt"+(opc.laranja?" laranja":""), rot);
  b.type = "button";
  if (opc.largura) b.style.width = opc.largura;
  b.addEventListener("pointerdown", ev=>{ ev.stopPropagation(); alternar(); pedirRender(); });
  lig(()=>b.classList.toggle("on", !!ler()));
  return b;
}
function tituloTela(area, txt, sub){
  const h = el("div");
  h.style.cssText="display:flex;align-items:baseline;gap:8px;padding:1px 2px 4px";
  const t = el("div",null,txt); t.style.cssText="font-size:12px;font-weight:700";
  h.appendChild(t);
  if (sub){ const s = el("div",null,sub); s.style.cssText="font-size:9px;color:#9aa0a8"; h.appendChild(s); }
  area.appendChild(h);
  return h;
}
const caixaTela = (titulo) => {
  const c = el("div");
  c.style.cssText="background:#26292d;border:1px solid #3d4147;border-radius:3px;padding:4px 6px;"+
    "display:flex;flex-direction:column;gap:3px;min-width:0";
  if (titulo){ const t = el("div",null,titulo);
    t.style.cssText="font-size:8px;color:#9aa0a8;letter-spacing:.5px"; c.appendChild(t); }
  return c;
};
const linhaTela = () => { const l = el("div");
  l.style.cssText="display:flex;gap:5px;align-items:center;flex-wrap:wrap"; return l; };

/* ================= SELECTED CHANNEL VIEW (p.90/91) =================
   15 campos: 1 TO MIX/MATRIX · 2 HA · 3 PATCH · 4 TO ST PAN/BALANCE ·
   5/6 DYNAMICS 1/2 · 7 HPF · 8 EQ · 9 gráfico · 10 INSERT ·
   11 DIRECT OUT · 12 RECALL SAFE · 13 FADER · 14 DCA · 15 MUTE      */
TELAS.SELCH = function(area){
  const c = S.canais[S.sel];
  const ehIn = (c.tipo==="in" || c.tipo==="stin");
  area.style.background = "#1b2a44";      /* fundo azul, como na foto/p.90 */
  tituloTela(area, "SELECTED CHANNEL VIEW", c.nome);

  /* ------------------------------------------------------------------
     LAYOUT MEDIDO na figura oficial (p.90), recortada e ampliada 9x.
     A tela NÃO é de 4 colunas soltas: são 3 colunas com as LINHAS
     CASADAS -- HA fica ao lado de DYNAMICS 1, PAN ao lado de DYNAMICS 2,
     HPF ao lado do gráfico, e o EQ desce alto na coluna do meio.
     Larguras medidas (x em px do recorte, conteúdo de 55 a 1520):
       TO MIX      55.. 540 = 485  -> 33 %
       coluna meio 550.. 975 = 425 -> 29 %
       coluna dir. 980..1520 = 540 -> 37 %
     A versão anterior usava `150px 1fr 1fr 88px` com overflow:auto: por
     isso aparecia BARRA DE ROLAGEM e "COMPRESSOR" saía cortado em
     "COMPRESS". Console de verdade não rola a tela -- se rolou, o layout
     está errado, não a tela pequena demais.                            */
  const g = el("div", "telasel");
  /* Alturas em FRAÇÃO, não `auto`: com auto as três primeiras linhas comiam
     332 dos 425 px e sobravam 76 px para o EQ, que precisa de 218 -- daí a
     barra de rolagem. As proporções saem da figura da p.90, onde o EQ ocupa
     cerca de metade da coluna do meio. */
  g.style.cssText =
    "flex:1 1 auto;min-height:0;display:grid;gap:3px;overflow:hidden;"+
    "grid-template-columns:33fr 29fr 37fr;"+
    "grid-template-rows:1fr 1fr 1fr 2.7fr;"+
    "grid-template-areas:"+
      "'sends ha   dy1'"+
      "'sends pan  dy2'"+
      "'sends hpf  graf'"+
      "'sends eq   baixo'";

  /* ---------- 1 · TO MIX / TO MATRIX (p.90 item 1) ----------
     16 sends em 2 sub-colunas, cada um com o seu [ON] -- na figura o ON
     fica do lado de FORA do par, e as cores vão em grupos de 4. */
  const cx1 = caixaTela(ehSaida(c) ? "TO MATRIX" : "TO MIX");
  cx1.style.gridArea = "sends";
  cx1.style.minHeight = "0";
  cx1.style.overflow = "hidden";
  const gg = el("div");
  gg.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:1px 4px;align-content:start";
  const arr = ehSaida(c) ? c.mtx : c.mix;
  arr.forEach((s,n)=>{
    const cel = el("div");
    cel.style.cssText="display:flex;align-items:center;gap:2px;min-width:0";
    const grupo = "k-send"+(Math.floor(n/4)+1);
    const kn = knobTela(null, ()=>dbParaPos(s.lvl), p=>{ s.lvl = posParaDb(p); S.encFoco="send"+n; },
      0, 1, ()=> (s.lvl<=-138?"-∞":s.lvl.toFixed(0)), {mini:true, cor:grupo});
    kn.style.minWidth = "0";
    const on = btTela(String(n+1), ()=>s.on, ()=>{ s.on = !s.on;
      S.ajuda = "<b>"+c.nome+"</b> send "+(n+1)+" "+(s.on?"ON":"OFF"); });
    on.style.cssText="font-size:7px;padding:1px 2px;flex:0 0 auto";
    cel.appendChild(kn); cel.appendChild(on);
    gg.appendChild(cel);
  });
  cx1.appendChild(gg);
  g.appendChild(cx1);

  /* ---------- 2 · HA (só entrada) / PATCH (só saída) ---------- */
  const cxHA = caixaTela(ehIn ? "HA" : "PATCH");
  cxHA.style.gridArea = "ha";
  if (ehIn){
    const l = linhaTela();
    l.appendChild(knobTela("GAIN", ()=>c.ha.gain, v=>c.ha.gain=v, -62, 10, v=>v.toFixed(0)+" dB",
      {aoTocar:()=>{ abrirPopup("HA");
        S.ajuda="Toque no knob abriu a <b>HA/PATCH</b> — arraste para girar (p.61)"; }}));
    const bs = el("div"); bs.style.cssText="display:flex;flex-direction:column;gap:2px";
    bs.appendChild(btTela("+48V", ()=>c.ha.phantom, ()=>{ c.ha.phantom=!c.ha.phantom;
      S.ajuda="Phantom +48V "+(c.ha.phantom?"LIGADO":"desligado")+" — nunca ligue com o canal aberto"; }, {laranja:true}));
    bs.appendChild(btTela("Ø", ()=>c.ha.phase, ()=>{ c.ha.phase=!c.ha.phase;
      S.ajuda="Polaridade "+(c.ha.phase?"INVERTIDA":"normal")+" (Ø inverte 180°, não é atraso)"; }));
    l.appendChild(bs);
    /* OVER do item 2 da p.90: "mostra o OVER do nível de entrada" */
    const ov = el("div"); ov.style.cssText="width:7px;height:7px;border-radius:50%;background:#3d4147";
    lig(()=>ov.style.background = c.nivel > 0.97 ? "#ff3b30" : "#3d4147");
    l.appendChild(ov);
    cxHA.appendChild(l);
    const av = el("div"); av.style.cssText="font-size:7px;color:#ffd45e;line-height:1.1";
    lig(()=>av.textContent = c.ha.gain >= -13 ? "PAD interno LIGADO" : "");
    cxHA.appendChild(av);
  } else {
    /* p.90 item 3: em canal de SAÍDA esta área vira o PATCH */
    const pt = el("div"); pt.style.cssText="font-size:10px";
    lig(()=>pt.textContent = S.patch.saida[c.id] || "—");
    cxHA.appendChild(pt);
  }
  g.appendChild(cxHA);

  /* ---------- 4 · TO ST PAN / BALANCE ---------- */
  const cxPan = caixaTela(c.tipo==="stin" ? "TO ST BALANCE" : "TO ST PAN");
  cxPan.style.gridArea = "pan";
  const lp = linhaTela();
  lp.appendChild(knobTela(null, ()=>c.pan, v=>c.pan=v, -1, 1, textoPan,
    {cor:"k-pan", aoTocar:()=>{ abrirPopup("TOST");
      S.ajuda="Toque no PAN abriu a <b>TO STEREO/MONO</b> (p.103)"; }}));
  const bp = el("div"); bp.style.cssText="display:flex;flex-direction:column;gap:2px";
  bp.appendChild(btTela("ST", ()=>c.toSt, ()=>{ c.toSt=!c.toSt;
    S.ajuda="<b>"+c.nome+"</b> "+(c.toSt?"vai":"NÃO vai")+" para o STEREO"; }));
  bp.appendChild(btTela("MONO", ()=>c.toMono, ()=>{ c.toMono=!c.toMono;
    S.ajuda="<b>"+c.nome+"</b> "+(c.toMono?"vai":"não vai")+" para o MONO"; }));
  lp.appendChild(bp);
  cxPan.appendChild(lp);
  g.appendChild(cxPan);

  /* ---------- 7 · HPF (só entrada) ---------- */
  const cxH = caixaTela("HPF");
  cxH.style.gridArea = "hpf";
  if (ehIn){
    const lh = linhaTela();
    lh.appendChild(knobTela(null, ()=>Math.log10(c.hpf.freq),
      v=>c.hpf.freq=Math.round(Math.pow(10,v)),
      Math.log10(20), Math.log10(600), v=>Math.round(Math.pow(10,v))+" Hz",
      {cor:"k-hpf", aoTocar:()=>abrirPopup("EQ")}));
    lh.appendChild(btTela("ON", ()=>c.hpf.on, ()=>c.hpf.on=!c.hpf.on));
    cxH.appendChild(lh);
    const nota = el("div",null,"-12 dB/oct"); nota.style.cssText="font-size:7px;color:#9aa0a8";
    cxH.appendChild(nota);
  } else {
    cxH.style.visibility = "hidden";      /* saída não tem HPF (p.90 item 7) */
  }
  g.appendChild(cxH);

  /* ---------- 5/6 · DYNAMICS 1 e 2 — painéis LARGOS, como na figura ----------
     Na p.90 eles ocupam a coluna inteira da direita, com o THRESHOLD à
     esquerda e os demais parâmetros em linha. Espremê-los numa coluna
     estreita era o que cortava "COMPRESSOR" em "COMPRESS". */
  [["dyn1","DYNAMICS 1","dy1"],["dyn2","DYNAMICS 2","dy2"]].forEach(([kk,rot,ga])=>{
    const cx = caixaTela(rot);
    cx.style.gridArea = ga;
    cx.style.minWidth = "0";
    if (kk==="dyn2" && !ehIn){ cx.style.visibility="hidden"; g.appendChild(cx); return; }
    const d = c[kk];
    const l = linhaTela();
    l.style.cssText += ";flex-wrap:nowrap;min-width:0";
    const nome = el("button","tbt", d.tipo);
    nome.type="button";
    nome.style.cssText="font-size:8px;padding:1px 4px;flex:0 0 auto;white-space:nowrap";
    nome.title = "Abrir a janela de "+rot;
    nome.addEventListener("pointerdown",()=>{ abrirPopup(kk==="dyn1"?"DYN1":"DYN2"); pedirRender(); });
    l.appendChild(nome);
    l.appendChild(knobTela("THR", ()=>d.thr, v=>d.thr=v, kk==="dyn1"?-72:-54, 0, v=>v.toFixed(0),
      {aoTocar:()=>abrirPopup(kk==="dyn1"?"DYN1":"DYN2")}));
    /* medidor de GR: é o que diz se a dinâmica está TRABALHANDO (p.101) */
    const gr = el("div");
    gr.style.cssText="flex:1 1 auto;min-width:18px;height:9px;background:#15171a;"+
      "border-radius:1px;position:relative;overflow:hidden";
    const grb = el("div");
    grb.style.cssText="position:absolute;right:0;top:0;bottom:0;background:#e8a020";
    gr.appendChild(grb);
    const grt = el("div",null,"GR"); grt.style.cssText="font-size:6.5px;color:#9aa0a8";
    lig(()=>{ grb.style.width = Math.round(clamp(reducaoDyn(c,kk),0,1)*100)+"%"; });
    const wgr = el("div"); wgr.style.cssText="display:flex;flex-direction:column;flex:1 1 auto;min-width:0";
    wgr.appendChild(grt); wgr.appendChild(gr);
    l.appendChild(wgr);
    l.appendChild(btTela("ON", ()=>d.on, ()=>{ d.on=!d.on;
      S.ajuda = rot+" "+(d.on?"ligado":"desligado")+" em <b>"+c.nome+"</b>"; }));
    cx.appendChild(l);
    g.appendChild(cx);
  });

  /* ---------- 9 · gráfico de EQ/HPF ---------- */
  const cxG = caixaTela("EQ / HPF");
  cxG.style.gridArea = "graf";
  cxG.style.minWidth = "0";
  cxG.style.cursor = "pointer";
  cxG.addEventListener("pointerdown",()=>{ abrirPopup("EQ");
    S.ajuda="Tocar no gráfico abre a janela do <b>EQ</b> — é o gesto da mesa (p.95)";
    pedirRender(); });
  cxG.appendChild(curvaEQ(c, 200, 44));
  g.appendChild(cxG);

  /* ---------- 8 · EQ de 4 bandas (Q · FREQ · GAIN) ---------- */
  const cxEQ = caixaTela("EQ");
  cxEQ.style.gridArea = "eq";
  cxEQ.style.minHeight = "0";
  cxEQ.style.overflow = "hidden";
  const cab = el("div");
  cab.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;font-size:6.5px;color:#9aa0a8;text-align:center";
  ["Q","FREQ","GAIN"].forEach(t=>cab.appendChild(el("div",null,t)));
  cxEQ.appendChild(cab);
  const gq = el("div");
  gq.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 2px;align-items:center";
  [["high","HIGH"],["himid","HIGH MID"],["lomid","LOW MID"],["low","LOW"]].forEach(([id,rot])=>{
    const banda = c.eq.bandas[id];
    const r = el("div",null,rot);
    r.style.cssText="grid-column:1/4;font-size:6.5px;color:#aeb4bb;text-align:center;line-height:1";
    gq.appendChild(r);
    gq.appendChild(knobTela(null, ()=>Math.log10(banda.q), v=>banda.q=Math.round(Math.pow(10,v)*100)/100,
      Math.log10(0.1), Math.log10(10), v=>Math.pow(10,v).toFixed(2), {mini:true, cor:"k-eq", aoTocar:()=>abrirPopup("EQ")}));
    gq.appendChild(knobTela(null, ()=>Math.log10(banda.f), v=>banda.f=Math.round(Math.pow(10,v)),
      Math.log10(20), Math.log10(20000), v=>{const f=Math.pow(10,v);
        return f>=1000?(f/1000).toFixed(1)+"k":f.toFixed(0);}, {mini:true, cor:"k-eq", aoTocar:()=>abrirPopup("EQ")}));
    gq.appendChild(knobTela(null, ()=>banda.g, v=>banda.g=v, -18, 18,
      v=>(v>0?"+":"")+v.toFixed(1), {mini:true, cor:"k-eq", aoTocar:()=>abrirPopup("EQ")}));
  });
  cxEQ.appendChild(gq);
  const beq = btTela("EQ ON", ()=>c.eq.on, ()=>c.eq.on=!c.eq.on);
  beq.style.marginTop = "1px";
  cxEQ.appendChild(beq);
  g.appendChild(cxEQ);

  /* ---------- 10/11/12/13/14/15 · faixa de baixo ----------
     INSERT · DIRECT OUT · RECALL SAFE numa coluna, e DCA / MUTE em duas
     colunas de botões, exatamente como a figura da p.90 mostra. */
  const baixo = el("div");
  baixo.style.gridArea = "baixo";
  baixo.style.cssText += ";display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:2px;min-height:0;overflow:hidden";

  const cA = el("div"); cA.style.cssText="display:flex;flex-direction:column;gap:2px;min-width:0";
  /* p.95: cada campo tem o BOTÃO DE JANELA (▼) ao lado do ON — o ▼ abre a
     janela de detalhe, o ON liga/desliga. Antes só havia o ON. */
  const linhaPop = (rot, ler, alternar, abrir) => {
    const w = el("div"); w.style.cssText="display:flex;gap:2px;min-width:0";
    const pv = el("button","tbt","▼"); pv.type="button"; pv.style.cssText="flex:0 0 auto;font-size:7px";
    pv.addEventListener("pointerdown",()=>{ abrir(); pedirRender(); });
    const bt = btTela(rot, ler, alternar); bt.style.flex="1 1 auto";
    w.appendChild(pv); w.appendChild(bt);
    return w;
  };
  /* p.95: INSERT existe em INPUT, MIX, MATRIX, STEREO e MONO — não em ST IN */
  if (c.tipo !== "stin"){
    cA.appendChild(linhaPop("INSERT", ()=>c.insert, ()=>{ c.insert=!c.insert;
      S.ajuda="INSERT "+(c.insert?"ligado":"desligado")+" em <b>"+c.nome+"</b>"; },
      ()=>abrirPopup("INSDO")));
  }
  /* p.95: DIRECT OUT é só de canal INPUT */
  if (c.tipo === "in"){
    cA.appendChild(linhaPop("DIRECT OUT", ()=>c.dout, ()=>{ c.dout=!c.dout;
      S.ajuda="DIRECT OUT "+(c.dout?"ligado":"desligado")+" em <b>"+c.nome+"</b>"; },
      ()=>abrirPopup("INSDO")));
  }
  cA.appendChild(linhaPop("RECALL SAFE", ()=>c.recallSafe, ()=>{ c.recallSafe=!c.recallSafe;
    S.ajuda = "RECALL SAFE "+(c.recallSafe?"LIGADO — este canal não muda no recall de cena":"desligado"); },
    ()=>{ S.cenaAba="safe"; abrirPopup("CENA_CFG"); }));
  const fl = el("div");
  fl.style.cssText="display:flex;align-items:center;gap:3px;margin-top:auto";
  const fv = el("div"); fv.style.cssText="font-size:12px;font-weight:700;min-width:36px";
  lig(()=>fv.textContent = fmtDb(c.fader));
  fl.appendChild(fv);
  fl.appendChild(btTela("ON", ()=>c.on, ()=>{ c.on=!c.on;
    S.ajuda="<b>"+c.nome+"</b> "+(c.on?"LIGADO":"desligado"); }));
  cA.appendChild(fl);
  baixo.appendChild(cA);

  /* DCA e MUTE: 8 botões cada, atribuição direta (p.124) */
  [["dca","DCA","#f2c200"],["mute","MUTE","#ff6b6b"]].forEach(([campo,rot,cor])=>{
    const cxx = el("div");
    cxx.style.cssText="background:#26292d;border:1px solid #3d4147;border-radius:3px;"+
      "padding:1px 2px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden";
    const t = el("div",null,rot); t.style.cssText="font-size:7px;color:"+cor+";text-align:center";
    cxx.appendChild(t);
    /* DCA só existe em canal de entrada (p.99 item K) */
    if (campo==="dca" && !ehIn){ baixo.appendChild(cxx); return; }
    const gb = el("div");
    gb.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;flex:1 1 auto;min-height:0";
    for (let n=1;n<=8;n++){
      const b = btTela(String(n), ()=>c[campo].includes(n), ()=>{
        const i = c[campo].indexOf(n);
        if (i>=0) c[campo].splice(i,1); else c[campo].push(n);
        c[campo].sort((a,b2)=>a-b2);
        S.ajuda = "<b>"+c.nome+"</b> "+(i>=0?"saiu do":"entrou no")+" "+rot+" "+n;
      });
      b.style.cssText="font-size:7px;padding:0;min-width:0";
      gb.appendChild(b);
    }
    cxx.appendChild(gb);
    baixo.appendChild(cxx);
  });
  g.appendChild(baixo);

  area.appendChild(g);

  /* rodapé com os 8 canais da Centralogic, o selecionado em azul (p.90) */
  const rod = el("div","rodape-canais");
  grupoTela().forEach(id=>{
    const cc = S.canais[id];
    const d = el("div", id===S.sel ? "sel" : null, cc ? cc.nome : "—");
    if (cc) d.addEventListener("pointerdown",()=>{ S.sel=id;
      S.ajuda="Canal <b>"+cc.nome+"</b> selecionado"; pedirRender(); });
    rod.appendChild(d);
  });
  area.appendChild(rod);
};

/* ================= METER (p.167) ================= */
TELAS.METER = function(area){
  tituloTela(area,"METER","níveis de entrada e saída");
  /* METERING POINT (p.167): onde o meter mede o sinal. Muda o que se vê,
     não o que se ouve -- e é o que explica "o meter bate mas não sai som"
     (POST ON) ou "mexo no fader e o meter não muda" (PRE FADER). */
  const lp = linhaTela();
  lp.style.marginBottom = "3px";
  const rot = el("span",null,"METERING POINT:");
  rot.style.cssText="font-size:9px;color:#9aa0a8";
  lp.appendChild(rot);
  ["PRE EQ","PRE FADER","POST ON"].forEach(p=>{
    lp.appendChild(btTela(p, ()=>S.meterPonto===p, ()=>{ S.meterPonto=p;
      S.ajuda = "Meter medindo em <b>"+p+"</b>"+
        (p==="PRE EQ"    ? " — antes do EQ: mostra o que ENTRA, o fader não altera" :
         p==="PRE FADER" ? " — antes do fader: o fader não altera o meter" :
                           " — depois do [ON]: é o que realmente sai"); }));
  });
  area.appendChild(lp);
  const g = el("div");
  g.style.cssText="flex:1 1 auto;min-height:0;display:flex;gap:10px;overflow:auto";
  const grupo = (rot, ids) => {
    const cx = caixaTela(rot);
    const l = el("div"); l.style.cssText="display:flex;gap:2px;align-items:flex-end;height:100%";
    ids.forEach(id=>{
      const c = S.canais[id]; if (!c) return;
      const col = el("div"); col.style.cssText="display:flex;flex-direction:column;align-items:center;gap:1px";
      const bar = el("div"); bar.style.cssText="width:9px;height:96px;background:#15171a;border-radius:1px;position:relative";
      const f = el("i"); f.style.cssText="position:absolute;left:0;right:0;bottom:0;border-radius:1px;"+
        "background:linear-gradient(0deg,#39b54a,#c8d400 74%,#ff2d2d 93%)";
      bar.appendChild(f);
      const nm = el("div",null,rotuloCurto(c).replace(/^CH/,""));
      nm.style.cssText="font-size:6px;color:#9aa0a8";
      col.appendChild(bar); col.appendChild(nm);
      lig(()=>f.style.height = (c.nivel*100).toFixed(1)+"%");
      l.appendChild(col);
    });
    cx.appendChild(l);
    return cx;
  };
  g.appendChild(grupo("INPUT 1-24", Array.from({length:24},(_,i)=>"CH"+(i+1))));
  g.appendChild(grupo("MIX", Array.from({length:N_MIX},(_,i)=>"MIX"+(i+1))));
  g.appendChild(grupo("MATRIX / MASTER",
    Array.from({length:N_MTX},(_,i)=>"MTX"+(i+1)).concat(["STEREO","MONO"])));
  area.appendChild(g);
  const v = el("div"); v.style.cssText="padding-top:3px";
  v.appendChild(btTela("voltar ao OVERVIEW", ()=>false, ()=>{ S.tela="OVERVIEW"; }));
  area.appendChild(v);
};

/* ================= SENDS ON FADER (p.70) ================= */
TELAS.SOF = function(area){
  tituloTela(area,"SENDS ON FADER",
    "os faders de input viram as mandadas do bus escolhido");
  const g = el("div"); g.style.cssText="display:flex;flex-direction:column;gap:6px";
  const mk = (rot, tipo, n) => {
    const cx = caixaTela(rot);
    const l = el("div"); l.style.cssText="display:flex;gap:3px;flex-wrap:wrap";
    for (let i=0;i<n;i++){
      const b = btTela(String(i+1),
        ()=>S.sof && S.sof.tipo===tipo && S.sof.n===i,
        ()=>{ S.sof = {tipo, n:i};
          S.ajuda = "<b>SENDS ON FADER</b> — os faders agora são as mandadas para "+
                    (tipo==="mix"?"MIX ":"MATRIX ")+(i+1); });
      b.style.width = "30px";
      l.appendChild(b);
    }
    cx.appendChild(l);
    return cx;
  };
  g.appendChild(mk("MIX 1-16","mix",N_MIX));
  g.appendChild(mk("MATRIX 1-8","mtx",N_MTX));
