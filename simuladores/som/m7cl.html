/* ==================================================================
   CENAS NO BANCO — presas ao cadastro do aluno
   ==================================================================
   Guarda em /api/sim/scenes, que resolve o aluno pela sessão Clerk. O aluno
   monta o show, guarda, volta noutro dia e chama de volta -- como na mesa. */
const API_CENAS = "/api/sim/scenes";
S.cenasNuvem = [];
S.nuvemMsg = "";

/* ------------------------------------------------------------------
   CENA COMPACTA (v2) — só o que DIFERE da fábrica sobe para o banco.
   ------------------------------------------------------------------
   Preocupação do dono, textual: "sei que isso ocupa bits e pesa no
   sistema". A foto cheia dá ~135 KB porque 86 canais carregam 24 sends
   cada um -- mas quase tudo está intocado. O delta compara cada canal com
   novoCanal() e guarda só as chaves diferentes: a cena típica cai para
   uns poucos KB. aplicarEstadoSalvo aceita as DUAS formas: cenas v1
   (fotos cheias) já guardadas continuam abrindo. */
function deltaCanais(){
  const foto = fotoDaMesa(), d = {};
  for (const [id,v] of Object.entries(foto)){
    const c0 = S.canais[id];
    const padrao = fotoDeUmCanal(novoCanal(id, c0.tipo, nomeDeFabrica(id)));
    const dif = {};
    for (const k of Object.keys(v)){
      if (JSON.stringify(v[k]) !== JSON.stringify(padrao[k])) dif[k] = v[k];
    }
    if (Object.keys(dif).length) d[id] = dif;
  }
  return d;
}
function expandirDelta(delta){
  const foto = {};
  for (const [id,c] of Object.entries(S.canais)){
    foto[id] = fotoDeUmCanal(novoCanal(id, c.tipo, nomeDeFabrica(id)));
    if (delta[id]) Object.assign(foto[id], delta[id]);
  }
  return foto;
}
/* nome de fábrica — a MESMA regra da criação dos canais (linhas do boot):
   "ch 1", "ST IN 1", "MIX 1", "MATRIX 1", "DCA 1", "ST", "MONO". O delta
   compara contra isto; usar o nome ATUAL compararia a mesa com ela mesma
   e o delta sairia sempre vazio. */
function nomeDeFabrica(id){
  if (id==="STEREO") return "ST";
  if (id==="MONO") return "MONO";
  const n = id.replace(/\D/g,"");
  if (id.startsWith("CH"))  return "ch "+n;
  if (id.startsWith("ST"))  return "ST IN "+n;
  if (id.startsWith("MIX")) return "MIX "+n;
  if (id.startsWith("MTX")) return "MATRIX "+n;
  if (id.startsWith("DCA")) return "DCA "+n;
  return id;
}
/* a MESMA serialização da fotoDaMesa, para UM canal (senão o delta compara
   maçã com laranja e nunca bate) */
function fotoDeUmCanal(c){
  return { fader:c.fader, on:c.on, pan:c.pan, toSt:c.toSt, toMono:c.toMono,
    lcr:c.lcr, lcrOn:c.lcrOn, csr:c.csr,
    ha:{...c.ha}, hpf:{...c.hpf},
    eq:{on:c.eq.on,tipo:c.eq.tipo,att:c.eq.att,bandas:JSON.parse(JSON.stringify(c.eq.bandas))},
    dyn1:{...c.dyn1}, dyn2:{...c.dyn2},
    mix:c.mix.map(s=>({...s})), mtx:c.mtx.map(s=>({...s})),
    dca:[...c.dca], mute:[...c.mute], insert:c.insert, dout:c.dout, nome:c.nome };
}

function estadoParaSalvar(){
  /* CLONE, não referência: guardar `rack: S.rack` cru significa que mexer na
     mesa DEPOIS de salvar reescreve o que foi salvo -- a cena viraria um
     espelho da mesa, não uma foto dela. (Pego em teste: salvei STEREO DELAY,
     troquei para REV-X, e o "salvo" tinha virado REV-X junto.) */
  const cl = x => JSON.parse(JSON.stringify(x));
  return {
    v: 2,
    delta: deltaCanais(),                    /* já nasce de cópias */
    patch: cl(S.patch), bus: cl(S.bus), rack: cl(S.rack),
    focus: cl(S.focus), muteSafe: cl(S.muteSafe), fade: cl(S.fade),
    meterPonto: S.meterPonto, udk: cl(S.udk),
    base: AUD.base ? AUD.base.folder : null,
  };
}
function aplicarEstadoSalvo(d){
  if (!d) return;
  const cl = x => JSON.parse(JSON.stringify(x));   /* mesmo motivo do salvar */
  if (d.v === 2 && d.delta) aplicarCena(expandirDelta(d.delta));
  else if (d.canais) aplicarCena(d.canais);          /* cenas v1 antigas */
  if (d.patch) S.patch = cl(d.patch);
  if (d.bus)   S.bus = cl(d.bus);
  if (d.rack){
    S.rack = cl(d.rack);
    /* o rack restaurado tem de REMONTAR o áudio — senão o aluno chama a
       cena, a tela mostra DELAY e o ouvido recebe o reverb velho */
    if (AUD.ctx) S.rack.forEach((r,i)=>{ if (r.tipo==="EFFECT") remontarFx(i); });
  }
  if (d.focus) S.focus = cl(d.focus);
  if (d.muteSafe) S.muteSafe = cl(d.muteSafe);
  if (d.fade)  S.fade = cl(d.fade);
  if (d.meterPonto) S.meterPonto = d.meterPonto;
  if (d.udk)   S.udk = cl(d.udk);
  /* a MÚSICA faz parte da cena (ordem do dono): se a cena foi gravada com
     outra base, recarrega -- SEM dar play sozinho; quem aperta tocar é o
     aluno ([[feedback-audio-toca-na-maquina-do-dono]]). */
  if (d.base && (!AUD.base || AUD.base.folder !== d.base)){
    const i = (AUD.bases||[]).findIndex(x=>x.folder === d.base);
    if (i >= 0) carregarBase(i);
    else if (!AUD.bases || !AUD.bases.length){
      /* catálogo ainda não veio: busca e tenta de novo UMA vez */
      carregarCatalogo().then(()=>{
        const j = (AUD.bases||[]).findIndex(x=>x.folder === d.base);
        if (j >= 0) carregarBase(j);
      });
    }
  }
}

async function listarCenasNuvem(){
  try{
    const r = await fetch(API_CENAS+"?simulador=m7cl");
    if (r.status === 401){ S.nuvemMsg = "Entre na plataforma para guardar suas cenas."; return; }
    if (!r.ok){ S.nuvemMsg = "Não consegui falar com o servidor."; return; }
    const j = await r.json();
    S.cenasNuvem = j.cenas || [];
    S.nuvemMsg = S.cenasNuvem.length ? "" : "Nenhuma cena guardada ainda.";
  }catch(e){ S.nuvemMsg = "Sem conexão — as cenas locais continuam funcionando."; }
  telaChave = null; pedirRender();
}
async function guardarCenaNuvem(numero, nome){
  S.nuvemMsg = "Guardando…"; pedirRender();
  try{
    const r = await fetch(API_CENAS,{ method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ simulador:"m7cl", numero, nome, dados: estadoParaSalvar() }) });
    if (r.status === 401){ S.nuvemMsg = "Entre na plataforma para guardar suas cenas."; pedirRender(); return; }
    const j = await r.json();
    if (!r.ok){ S.nuvemMsg = "Falhou: "+(j.error||r.status); pedirRender(); return; }
    S.nuvemMsg = "Cena "+num3(numero)+" guardada na sua conta.";
    listarCenasNuvem();
  }catch(e){ S.nuvemMsg = "Sem conexão."; pedirRender(); }
}
async function chamarCenaNuvem(numero){
  try{
    const r = await fetch(API_CENAS+"?simulador=m7cl&numero="+numero);
    const j = await r.json();
    const c = (j.cenas||[])[0];
    if (!c){ S.nuvemMsg = "Cena "+num3(numero)+" não encontrada."; pedirRender(); return; }
    aplicarEstadoSalvo(c.dados);
    S.nuvemMsg = "Cena "+num3(numero)+" ("+c.nome+") chamada.";
    S.ajuda = "Cena <b>"+c.nome+"</b> chamada da sua conta";
    telaChave = null; pedirRender();
  }catch(e){ S.nuvemMsg = "Sem conexão."; pedirRender(); }
}

/* ==================================================================
   AUTOTESTE — confere as funções contra o MANUAL, não contra o código
   ==================================================================
   Rode `m7clTeste()` no console do navegador. Cada teste cita o capítulo
   do manual de onde saiu o número, para dar pra checar na fonte.

   Por que isto mora dentro do arquivo: o portão do projeto
   (ferramentas/clicar-tudo.mjs) prova que todo controle RESPONDE, não que
   faça a coisa certa. Um botão pode responder e mexer no parâmetro errado.
   Estes testes olham o ESTADO depois da ação.                          */
function m7clTeste(){
  const R = [];
  const T = (cap, nome, fn) => {
    let ok = false, erro = "";
    try { ok = !!fn(); } catch(e){ erro = e.message; }
    R.push({cap, nome, ok, erro});
  };
  const C = id => S.canais[id];
  const guardaEstado = JSON.stringify({sel:S.sel, nav:S.nav, tela:S.tela});
  /* As confirmações de cena (p.214) abrem uma caixa e ESPERAM resposta. Num
     teste automático ninguém aperta OK, então o recall nunca se aplicava e
     dois testes falhavam sem que houvesse defeito. Desligo durante a prova e
     devolvo no fim -- a caixa tem teste próprio, na tela. */
  const prefRecall = S.pref.recallConf, prefStore = S.pref.storeConf;
  S.pref.recallConf = false; S.pref.storeConf = false;

  /* cap.2 — painel */
  T(2,"62 strips (48 in + 4 ST IN + 8 Centralogic + 2 master)",
    ()=>document.querySelectorAll(".strip").length===62);
  T(2,"SELECTED CHANNEL com 33 knobs (16 send + HA/PAN/HPF/DYN1/DYN2 + EQ 4x3)",
    ()=>document.querySelectorAll(".selch .knob").length===33);
  /* ---- MASTER: os defeitos que o dono achou em 31/07 ---- */
  T(4,"existe barramento MASTER — canal NÃO liga direto na saída", ()=>{
    if (!AUD.ctx) AUD.ctx = new (window.AudioContext||window.webkitAudioContext)();
    montarMaster(AUD.ctx);
    return !!AUD.busSt && !!AUD.busMono;
  });
  T(4,"[ON] do STEREO desligado ZERA o barramento — o som para de verdade", ()=>{
    const st = S.canais.STEREO, g = st.on, f = st.fader;
    st.on = true; st.fader = 0; aplicarMasterNoAudio();
    const aberto = AUD.alvoSt;
    st.on = false; aplicarMasterNoAudio();
    const fechado = AUD.alvoSt;
    st.on = g; st.fader = f; aplicarMasterNoAudio();
    return aberto === 1 && fechado === 0;
  });
  T(4,"fader do STEREO muda o ganho do barramento (era o que nao mexia)", ()=>{
    const st = S.canais.STEREO, g = st.on, f = st.fader;
    st.on = true; st.fader = 0;    aplicarMasterNoAudio(); const a = AUD.alvoSt;
    st.fader = -20;                aplicarMasterNoAudio(); const b = AUD.alvoSt;
    st.fader = -138;               aplicarMasterNoAudio(); const c0 = AUD.alvoSt;
    st.on = g; st.fader = f; aplicarMasterNoAudio();
    /* 0 dB = 1 · -20 dB = 0,1 · -inf = 0 */
    return a === 1 && Math.abs(b - 0.1) < 1e-6 && c0 === 0;
  });
  T(4,"MONO tem barramento PRÓPRIO — o [ON] dele nao depende do STEREO", ()=>{
    const st = S.canais.STEREO, mo = S.canais.MONO;
    const gs=st.on, fs=st.fader, gm=mo.on, fm=mo.fader;
    st.on=false; st.fader=0; mo.on=true; mo.fader=0; aplicarMasterNoAudio();
    const r = AUD.alvoSt === 0 && AUD.alvoMono === 1;
    st.on=gs; st.fader=fs; mo.on=gm; mo.fader=fm; aplicarMasterNoAudio();
    return r;
  });
  T(4,"meter do MONO mede o MONO — nao e' mais copia do STEREO", ()=>{
    const c = C("CH1"), mo = S.canais.MONO, st = S.canais.STEREO;
    const g = {f:c.fader,o:c.on,s:c.toSt,m:c.toMono,mo:mo.on,mf:mo.fader,
               so:st.on,sf:st.fader,osc:S.osc.on,ha:c.ha.gain};
    const ligados = Object.values(S.canais).filter(x=>(x.tipo==="in"||x.tipo==="stin")&&x.on).map(x=>x.id);
    Object.values(S.canais).forEach(x=>{ if(x.tipo==="in"||x.tipo==="stin") x.on=false; });
    /* sem música e sem oscilador o tickMeters ZERA o nível do canal (e faz
       certo: meter que mexe sem sinal é o "botão que finge"). Ligo o
       oscilador para existir sinal de verdade a medir. */
    S.osc.on = true;
    c.on=true; c.fader=0; c.ha.gain=10; c.toSt=true; c.toMono=false; c.lcr=false;
    st.on=true; st.fader=0; mo.on=true; mo.fader=0;
    /* tickMeters é estrangulado a 60 ms: duas chamadas seguidas com o mesmo
       relógio fazem a 2ª virar no-op e o teste mede o estado velho. Carimbos
       CRESCENTES forçam as duas medições. */
    const t1 = performance.now() + 5000;
    tickMeters(t1);
    const soMono = mo.nivel;                  /* nada mandado ao MONO -> 0 */
    c.toMono=true; tickMeters(t1 + 5000);
    const comMono = mo.nivel;
    Object.assign(c,{fader:g.f,on:g.o,toSt:g.s,toMono:g.m});

    return alto>baixo && baixo>0;
  });

  /* cap.12 — CENAS NA CONTA: guardam TUDO e voltam leves */
  T(12,"a cena guarda mixagem + rack + patch + a MÚSICA escolhida", ()=>{
    const e2 = estadoParaSalvar();
    return e2.v===2 && "delta" in e2 && "rack" in e2 && "patch" in e2 && "base" in e2;
  });
  T(12,"cena v2 é DELTA: mexer 2 canais pesa poucos KB, não 137", ()=>{
    const f=S.canais.CH1.fader; S.canais.CH1.fader=-4;
    const kb = JSON.stringify(estadoParaSalvar()).length/1024;
    S.canais.CH1.fader=f;
    return kb < 20;
  });
  T(12,"salvar é FOTO, não espelho: mexer depois não contamina o salvo", ()=>{
    const g=S.rack[4].efeito;
    S.rack[4].efeito="STEREO DELAY";
    const salvo=estadoParaSalvar();
    S.rack[4].efeito="CHORUS";
    const intacto = salvo.rack[4].efeito==="STEREO DELAY";
    aplicarEstadoSalvo(salvo);
    const voltou = S.rack[4].efeito==="STEREO DELAY";
    S.rack[4].efeito=g; if (AUD.ctx) remontarFx(4);
    return intacto && voltou;
  });
  T(12,"cena v1 antiga (foto cheia) continua abrindo", ()=>{
    const f=S.canais.CH2.fader; S.canais.CH2.fader=-7;
    const v1={canais:fotoDaMesa()};
    S.canais.CH2.fader=3;
    aplicarEstadoSalvo(v1);
    const ok = S.canais.CH2.fader===-7;
    S.canais.CH2.fader=f;
    return ok;
  });
  T(12,"delta ida-e-volta reproduz a mesa EXATAMENTE", ()=>{
    const f=S.canais.CH3.fader; S.canais.CH3.fader=-11;
    const ok = JSON.stringify(expandirDelta(deltaCanais()))===JSON.stringify(fotoDaMesa());
    S.canais.CH3.fader=f;
    return ok;
  });

  /* telas */
  T(0,"todas as telas abrem com conteúdo", ()=>{
    const area = document.getElementById("area");
    let vazias = 0;
    for (const p of Object.keys(TELAS_POPUP)){
      S.tela="OVERVIEW"; S.popup=p; telaChave=null; construirTela();
      if (area.querySelectorAll("*").length < 10) vazias++;
    }
    S.popup=null; S.tela="OVERVIEW"; telaChave=null; construirTela();
    return vazias === 0;
  });

  /* confirmações voltam ao que eram antes da prova */
  S.pref.recallConf = prefRecall; S.pref.storeConf = prefStore;

  /* limpa o que o teste criou */
  S.cena.lista = S.cena.lista.filter(x=>x.n<298);
  const g = JSON.parse(guardaEstado);
  S.sel=g.sel; S.nav=g.nav; S.tela=g.tela; S.popup=null; telaChave=null;
  pedirRender();

  const falhas = R.filter(x=>!x.ok);
  console.log("M7CL — "+R.length+" testes · "+falhas.length+" falha(s)");
  R.forEach(x=>console.log((x.ok?"  OK   ":"  FALHA")+" cap."+String(x.cap).padEnd(3)+x.nome+
    (x.erro?"  ["+x.erro+"]":"")));
  return {total:R.length, falhas:falhas.length,
          detalhe:falhas.map(f=>"cap."+f.cap+" — "+f.nome)};
}
window.m7clTeste = m7clTeste;

/* ---- primeiro render ---- */
S.ajuda = "Aperte um <b>[SEL]</b> para escolher o canal · gire os knobs do <b>SELECTED CHANNEL</b> · "+
          "as <b>NAVIGATION KEYS</b> mandam 8 canais para a Centralogic";
/* A cena 000 "Initial Data" guarda o estado DE FÁBRICA — a foto é tirada
   agora, com a mesa ainda intocada. É a cena que devolve tudo ao começo e
   costuma ser o primeiro RECALL de quem assume uma mesa desconhecida.
   Tirar a foto só na 1ª chamada (como fiz antes) fotografava a mesa JÁ
   mexida, e o RECALL não devolvia nada. */
S.cena.lista[0].dados = fotoDaMesa();

ligarConfirma();          /* CANCEL/OK ganham tratador permanente */
encaixarLCDnaMesa();      /* põe o LCD 640x480 dentro do espaço físico da mesa */
desenhar();
</script>
